desc = 'The positive-root sum pairs with any coroot to twice its height in the flipped base, hence to an even integer over Z. Provider: Tau Ceti, present at pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 (Vector.lean:172) and checked main 1e668f5e55bc20f2eb87f4ba49b48833470290d1 (line 171). This supplies parity descent through the coroot lattice.'
