desc = 'The Iwahori subgroup, the affine flag variety, and the stratifications of the affine flag variety and of the loop Grassmannian by the Iwahori orbits. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.iwahoriStratification'
kind = 'definition'
desc = '''The Iwahori subgroup and its orbits. Let G be a split connected reductive group over a field F with the torus T and the Borel subgroup B ⊃ T of a pinning (Groups.pinnedData). The Iwahori subgroup I of L⁺G is the preimage of B under evaluation at t = 0, L⁺G → G (LoopGroups.FormalLoopGroup), and the affine flag variety Fl_G is the fpqc quotient LG/I, formed as AffineGrassmannian.LoopGrassmannian is. The node asks for the following. (1) Fl_G is an ind-projective ind-scheme, and Fl_G → Gr_G is locally trivial in the Zariski topology with fibre G/B. (2) The Iwahori–Weyl group. Take W̃ = N ⋊ W of Groups.iwahoriWeylLength for the root datum of G and T with the base of B (Groups.basedRootDatum), so N = X_*(T) and W is its Weyl group. Identify W̃ with N_T(F((t)))/T(F[[t]]) by λ ↦ t^λ or t^{−λ}, choosing the sign and the fundamental alcove of Groups.iwahoriWeylLength so that the alcove is the one fixed by I; only then is the dimension of an orbit its length. (3) Orbits on Fl_G. The I-orbits on the points of Fl_G over an algebraic closure of F are indexed by W̃, and the orbit of w is an affine space of dimension ℓ(w). (4) Minimal parahorics. For a simple affine reflection s, the minimal parahoric subgroup P_s ⊃ I has L⁺P_s/I a projective line. (5) Orbits on Gr_G. The I-orbits on Gr_G are indexed by W̃/W, the cosets of the finite Weyl group W, each represented by its element of minimal length, whose length is the dimension of the orbit; Fl_G → Gr_G maps the orbit of such an element isomorphically onto the orbit of its coset. (6) Length zero. The elements of the length-zero subgroup Ω normalize I. So left translation by a representative of τ in Ω, x ↦ τx, carries the I-orbit of w onto the I-orbit of τw, and the closure onto the closure, isomorphically, in Fl_G and in Gr_G; it carries one component onto another. On Fl_G right translation by τ is defined too, and it carries the orbit of w onto the orbit of wτ; it does not descend to Gr_G, because τ need not normalize L⁺G. (7) Checks. For GL₂ the fibre of Fl → Gr over the base point is the projective line GL₂/B, the union of two I-orbits, a point and an affine line, indexed by 1 and the finite simple reflection. For SL₂ the identity and the finite simple reflection give two I-orbits on Fl and the same I-orbit on Gr. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. The roadmap states (1), (3) and (4). It does not state (5) and (6): (5) follows from (1) and (3), because Fl_G → Gr_G is equivariant for I, and (6) from (2). The plan uses (5) and (6) for the resolutions of the Schubert varieties of Gr_G (AffineGrassmannian.bottSamelsonResolution) and for the parity of IC stalks (Satake.icSheaf_restriction_isParity); the node asks for them with (3). If Tau Ceti’s review declines (5) or (6) as outside the roadmap, they come back to the plan as a node written here, through `prompts/change.md`. Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, third paragraph: “Let I⊂L⁺H be the Iwahori subgroup, the preimage of B under reduction modulo t, and Fl_H=LH/I the affine flag variety. Prove that Fl_H is ind-projective and that Fl_H→Gr_H is Zariski-locally trivial with fibre H/B; that the I-orbits on Fl_H(F̄) are indexed by the Iwahori–Weyl group W̃=X_*(T)⋊W, the orbit of w being an affine space of dimension ℓ(w); that for a simple affine reflection s with minimal parahoric P_s the quotient L⁺P_s/I is a projective line”, with the fifth item of its API and its check on GL₂. The roadmap takes the Iwahori–Bruhat decomposition over F̄((t)) from ReductiveGroupsPartII §RG2.4 (*iwahori-bruhat-decomposition*). It has no partial affine flag variety LG/P_s. In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. To be used and not written again: evaluation at t = 0 on the arc group with its kernel K_1, `TauCeti.HopfAlgebra.positiveLoopEvalZero` (`TauCeti.Algebra.AlgebraicGroup.LoopGroup.Jet`); the fppf quotient of an affine group by a closed subgroup, `CommHopfAlgCat.fppfHomogeneousQuotient` (`TauCeti.Algebra.AlgebraicGroup.Fppf.Quotient.Homogeneous.Basic`), which gives G/B as a sheaf; the Bruhat decomposition of a Tits system, with its Coxeter system, `TauCeti.TitsSystem` (`TauCeti.GroupTheory.TitsSystem.Basic`), whose instances at the pin are all of finite type; and the matrices of GL_m over a local ring that are upper triangular modulo the maximal ideal, `TauCeti.iwahori` (`TauCeti.LinearAlgebra.Matrix.GeneralLinearGroup.UpperTriangular.Iwahori`). Not at the pin: the Iwahori subgroup of an arc group, the parahoric subgroups, an affine Tits system, the properness of G/B, and every statement of (1) to (6). Still to do: all of the node. The first step that builds on Tau Ceti main alone is the preimage in L⁺G of a closed subgroup of G under evaluation at t = 0, as an affine group.'''
