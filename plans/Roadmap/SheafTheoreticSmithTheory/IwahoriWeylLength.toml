desc = 'The Coxeter structure, length and Bruhat order of the Iwahori–Weyl group of a root datum. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.Groups.iwahoriWeylLength'
kind = 'definition'
desc = '''For a reduced root datum with cocharacter lattice N, coroot lattice Q∨ and Weyl group W: the Iwahori–Weyl group W̃ = N ⋊ W is `RootPairing.extendedAffineWeylGroup` over ℤ, where `RootPairing.coweightLattice` is all of N, so the central torus is kept; the affine Weyl group W_aff = Q∨ ⋊ W is `RootPairing.affineWeylGroup`, normal in W̃ with W̃/W_aff ≃ N/Q∨ = π₁(G) (`RootPairing.extendedAffineWeylGroupQuotientEquiv`). Construct the Coxeter system of W_aff generated by the affine simple reflections, one family for each irreducible factor and the trivial group when there are no roots; its length (`CoxeterSystem.length`) and Bruhat order; the length-zero subgroup Ω of W̃, the elements whose extension to ℝ fixes the fundamental alcove, with W̃ = W_aff ⋊ Ω and Ω ≅ N/Q∨; and the length ℓ(wω) = ℓ(w) and the Bruhat order on W̃. Over ℝ, Tau Ceti’s extended affine Weyl group is P∨ ⋊ W for the full real coweight lattice P∨, which is larger than N when G is not adjoint and is not a lattice when G has a central torus; so Ω is W̃ ∩ `fundamentalAlcoveStabilizer`, and its map to N/Q∨ is the restriction of Tau Ceti’s map to P∨/Q∨. Tau Ceti’s theorems on the alcove stabilizer assume an irreducible reduced root system over an archimedean ordered field; there they give Ω_Y ≅ Y/Q∨ and W_aff ⋊ Ω_Y ≅ Y ⋊ W for every lattice Q∨ ⊆ Y ⊆ P∨, so for Y = N. The reducible case and the case with a central torus, where N does not embed in the coweight lattice P∨ of the span of the roots (the restriction to that span loses the central directions), are obligations of this node. Checks: for the root datum of a torus W̃ = N = Ω and every length is 0; for GL₂, with the alcove 0 < x₁ − x₂ < 1, the translations by (1, 0) and (1, −1) have lengths 1 and 2, and Ω is infinite cyclic, generated by an element that maps to the class of (1, 0) in N/Q∨ = ℤ; for PGL₂, Ω has order 2 and 1 and its other element are not comparable in the Bruhat order. Provider: roadmap SheafTheoreticSmithTheory, as a prerequisite of §3.0 and not a named target. The third paragraph of §3.0 uses the group, its length and reduced words without defining them: “the I-orbits on Fl_H(F̄) are indexed by the Iwahori–Weyl group W̃=X_*(T)⋊W, the orbit of w being an affine space of dimension ℓ(w)”, and “for a reduced word w̃=s₁⋯s_r of w the Demazure variety”. The node is in Tau Ceti because AffineGrassmannian.iwahoriStratification, a target of the roadmap, uses it. Other accepted roadmaps state parts of it, for other carriers, and the pull requests of this node build on what these have on Tau Ceti main and repeat none of it. KacMoody, Layer 2, §2.1 “Simple reflections and the Weyl group as a Coxeter group”, states that the Weyl group of a realization of a generalized Cartan matrix is a Coxeter group; this is at the pin, and the affine Cartan matrix is such a matrix. ReductiveGroupsPartII §RG2.1, *affine-weyl-group*, states for the affine Weyl group of a valued root datum, a group of affine maps of the apartment: “`(W_a, S_aff)` is a Coxeter system, with `S_aff` the reflections in the walls of an alcove `C`”, with the target `AffineWeylGroup.coxeterSystem`. ReductiveGroupsPartII §RG2.4.1, *length-and-bruhat-order*, states the length and the Bruhat order on W̃ = N(K)/Z(K)₀ for a reductive group over a henselian discretely valued field K, with ℓ(wτ) = ℓ(w) for τ in Ω and the Bruhat order of `CoxeterSystem.BruhatLE` on W_aff; for a split group over F((t)) that group is N ⋊ W, and the comparison is part of AffineGrassmannian.iwahoriStratification. RepresentationTheory/LieHighestWeight, Layer 10 “affine Weyl geometry and the coweight quotient”, states Ω ≃ P∨/Q∨ and, for a W-stable lattice Q∨ ⊆ Y ⊆ P∨, that “the stabilizer of the alcove in Y⋊W is Y/Q∨”, for a root system; a root datum with a central torus is not of this form, because N does not embed in the coweight lattice P∨ of the span of the roots. In Tau Ceti at the pin, to be used and not written again. For every root pairing over a commutative ring: `RootPairing.affineWeylGroup` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Affine.Basic`), `RootPairing.coweightLattice` (`TauCeti.LinearAlgebra.RootSystem.CoweightLattice`), `RootPairing.extendedAffineWeylGroup`, the group Y ⋊ W of a lattice Q∨ ≤ Y ≤ P∨, `RootPairing.latticeAffineWeylGroup`, and `RootPairing.extendedAffineWeylGroupQuotientEquiv` (`TauCeti.LinearAlgebra.RootSystem.Weyl.ExtendedAffine.Basic`). For a finite, reduced, irreducible, crystallographic root system over an archimedean ordered field: the affine Weyl group acts simply transitively on the alcoves, `RootPairing.exists_mem_affineWeylGroup_preimage_fundamentalAlcove_eq` and `RootPairing.eq_one_of_mem_affineWeylGroup_of_apply_mem_fundamentalAlcove` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Affine.Alcove`); the stabilizer Ω of the fundamental alcove with the isomorphism Ω ≃ P∨/Q∨, `RootPairing.fundamentalAlcoveStabilizer` and `RootPairing.fundamentalAlcoveStabilizerEquivQuotient` (`TauCeti.LinearAlgebra.RootSystem.Weyl.ExtendedAffine.Alcove`); and the decompositions W_aff ⋊ Ω ≃ W_ext and, for a lattice Y, W_aff ⋊ Ω_Y ≃ Y ⋊ W with Ω_Y ≃ Y/Q∨, `RootPairing.extendedAffineWeylGroupMulEquiv`, `RootPairing.latticeAffineWeylGroupMulEquiv` and `RootPairing.latticeFundamentalAlcoveStabilizerEquivQuotient` (`TauCeti.LinearAlgebra.RootSystem.Weyl.ExtendedAffine.Semidirect`). So for an irreducible root system the Iwahori–Weyl group is the group of the lattice Y = N, and its length-zero subgroup and its decomposition are at the pin. For every Coxeter system: the Bruhat order `CoxeterSystem.BruhatLE` (`TauCeti.GroupTheory.Coxeter.Bruhat`), the minimal coset representatives `CoxeterSystem.IsMinimalCosetRep` (`TauCeti.GroupTheory.Coxeter.Parabolic`) and the length `CoxeterSystem.length` (`Mathlib.GroupTheory.Coxeter.Length`). The finite Weyl group is a Coxeter system, `TauCeti.weylCoxeterSystem` (`TauCeti.LinearAlgebra.RootSystem.Coxeter.Presentation`), and the affine Cartan matrix is `RootPairing.Base.affineCartanMatrix` (`TauCeti.LinearAlgebra.RootSystem.Affine.CartanMatrix`). The Weyl group of a realization of a generalized Cartan matrix over a field of characteristic zero is a Coxeter system for the Coxeter matrix of the Cartan matrix, and its Coxeter length is the length of the Weyl group of the realization, `TauCeti.CartanRealization.weylCoxeterSystem` and `TauCeti.CartanRealization.weylCoxeterSystem_length` (`TauCeti.LinearAlgebra.Matrix.Cartan.Realization.Weyl.Coxeter`); no declaration joins it to `RootPairing.affineWeylGroup`. Not at the pin: a Coxeter system on `RootPairing.affineWeylGroup`, a length on the affine or the extended affine Weyl group (a doc comment calls Ω the length-zero elements, and no length is defined), and the reducible case and the case with a central torus of the statements on Ω. Still to do: the Coxeter system of W_aff on the reflections in the walls of the fundamental alcove, with the Coxeter property proved once in Tau Ceti: by an isomorphism of W_aff with the Weyl group of a realization of the affine Cartan matrix that carries the wall reflections to the simple reflections, or from the simple transitivity on alcoves where that is shorter; the length and the Bruhat order on W̃ with ℓ(wω) = ℓ(w); the passage from one irreducible factor to a product and to a root datum with a central torus; and the checks.'''
