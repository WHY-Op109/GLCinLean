desc = 'The Demazure (Bott–Samelson) resolutions of the closures of the Iwahori orbits in the affine flag variety and in the loop Grassmannian. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.bottSamelsonResolution'
kind = 'definition'
desc = '''The Demazure varieties of the affine flag variety, also called Bott–Samelson varieties. Let G, I, Fl_G, the minimal parahoric subgroups P_s and the Iwahori–Weyl group W̃ = W_aff ⋊ Ω be those of AffineGrassmannian.iwahoriStratification. For an element w of the affine Weyl group W_aff and a reduced word w̃ = s₁⋯s_r of w, the Demazure variety is the contracted product D(w̃) = L⁺P_{s₁} ×^I ⋯ ×^I L⁺P_{s_r}/I. The node asks for the following. (1) D(w̃) is a smooth projective scheme of dimension r, an iterated bundle of projective lines: D(s₁⋯s_r) → D(s₁⋯s_{r−1}) is a bundle with fibre L⁺P_{s_r}/I. (2) The product map D(w̃) → Fl_G is proper and birational onto the closure of the I-orbit of w, and it is an isomorphism over that orbit. (3) The Grassmannian. The composite D(w̃) → Fl_G → Gr_G is proper, and it is birational onto the closure of the I-orbit of the coset of w in Gr_G when w has minimal length in its coset w·W; for other w it is not birational, so the plan uses the minimal-length representatives. (4) The other components. Every element of W̃ is τw for one τ in Ω and one w in W_aff, and ℓ(τw) = ℓ(w). The closure of the I-orbit of τw is the left translate by τ of the closure of the I-orbit of w, in Fl_G and in Gr_G (AffineGrassmannian.iwahoriStratification, (6)). So the left translate of D(w̃) → Fl_G resolves it, and τw has minimal length in τw·W exactly when w has minimal length in w·W. An element written as wτ is τ·(τ⁻¹wτ), and a reduced word of τ⁻¹wτ is the conjugate by τ of a reduced word of w; the orbit of wτ is not the left translate of the orbit of w in general (in type affine A₁ a length-zero element that is not central exchanges the two simple reflections). (5) Checks. For a simple affine reflection s, D(s) is the projective line L⁺P_s/I and maps isomorphically onto the closure of the orbit of s. For SL₂ and the finite simple reflection s, D(s) → Gr is the constant map to the base point, of relative dimension 1: s is not of minimal length in its coset. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. The roadmap states (1) and (2) for every split connected reductive group. It does not state (3) and (4), which follow from (2) and from (5) and (6) of AffineGrassmannian.iwahoriStratification; the node asks for them with (2), and if Tau Ceti’s review declines them they come back to the plan as a node written here, through `prompts/change.md`. The route. The construction is by contracted products of the groups L⁺P_s, as [PappasRapoport] §8 defines the Demazure varieties, and not through the affine Kac–Moody group of [Kumar] §7.1; it needs no simply connected group and no base change from ℚ̄. The roadmap says how the source applies: “PappasRapoport08 proves the Demazure statements over an algebraically closed field, and its Proposition 9.6 under the standing hypotheses of its §9, an absolutely simple simply connected group split by a tamely ramified extension; its Proposition 8.7 holds for every connected reductive group, and the proof of its Proposition 9.6(b) uses beyond that only the affine-space structure of the Iwahori orbits stated above, so it applies to split reductive H.” Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, third paragraph: “for a reduced word w̃=s₁⋯s_r of w the Demazure variety D(w̃)=L⁺P_s₁×^I⋯×^I L⁺P_(s_r)/I is a smooth projective iterated P¹-bundle of dimension r whose product map to Fl_H is proper and birational onto the closure of the I-orbit of w, and an isomorphism over that orbit”, with the fifth item of its API (“Demazure varieties resolve their closures”) and its check for a simple reflection. In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. To be used and not written again: contracted products of a torsor with a sheaf with an action, `CategoryTheory.Sheaf.Torsor.contractedProduct` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`); and, for every Coxeter system, reduced words, the Bruhat order with its subword property and the Demazure product `CoxeterSystem.demazureProd` (`TauCeti.GroupTheory.Coxeter.DemazureProduct`). Not at the pin: Demazure or Bott–Samelson varieties as schemes, for a finite or an affine flag variety, and bundles of projective lines over a flag variety. Still to do: all of the node, after AffineGrassmannian.iwahoriStratification.'''
deps = ['GLCinLean.AffineGrassmannian.iwahoriStratification', 'GLCinLean.AffineGrassmannian.LoopGrassmannian', 'GLCinLean.Stacks.groupTorsor']
