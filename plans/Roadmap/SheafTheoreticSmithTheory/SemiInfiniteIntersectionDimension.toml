desc = 'The dimensions of the intersections of the semi-infinite orbits with the orbits of the arc group. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.Satake.semiInfiniteIntersection_dimension'
kind = 'theorem'
desc = '''For a split connected reductive group G over a field F, with S_ν and T_ν of Satake.semiInfiniteOrbits, Gr^λ of AffineGrassmannian.schubertStratification, a dominant coweight λ and a coweight ν; ρ is half the sum of the positive roots and w₀ the longest element of the Weyl group (Groups.basedRootDatum). (a) S_ν ∩ Gr^λ is nonempty exactly when t^ν lies in Gr^{≤λ}; equivalently, when ν lies in the convex hull of the Weyl orbit of λ and λ − ν is in the coroot lattice. Then S_ν ∩ Gr^{≤λ} has pure dimension ⟨ρ, λ + ν⟩, and so has its open subset S_ν ∩ Gr^λ. (b) T_ν ∩ Gr^λ is nonempty under the same condition, and then T_ν ∩ Gr^{≤λ} and T_ν ∩ Gr^λ have pure dimension ⟨ρ, λ − ν⟩. (b) is (a) for the opposite Borel subgroup; [MV] writes the dimension as −ρ(ν + λ) for the antidominant element of the Weyl orbit. (c) The extreme weights. S_{w₀λ} meets Gr^λ in the single point t^{w₀λ}; and if S_{w₀λ} meets Gr^μ for a dominant μ in the same component, then λ ≤ μ. The dominant and the antidominant cases are distinct: for ν = λ the dimension of (a) is ⟨2ρ, λ⟩, the dimension of Gr^λ, and for ν = w₀λ it is 0. (d) Checks. For GL₂ and λ = (1, 0), S_{w₀λ} ∩ Gr^λ is one point and ⟨ρ, λ + w₀λ⟩ = 0; ν = (2, −1) is outside the Weyl polytope of λ and S_ν ∩ Gr^λ is empty. No dimension is stated for an empty intersection. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. This is [MV] Theorem 3.2. The roadmap states a part of it, in §6.2: the necessary condition for a nonempty intersection, the dimension of a nonempty S_ν ∩ Gr^μ, and (c). It does not state that every ν of the Weyl polytope and the component gives a nonempty intersection, that the dimension is pure, or (b). The plan uses these: Satake.weightFunctors_exact_faithful uses the bounds of (a) and (b) for the concentration in one degree, and Satake.convolution_preserves_perversity uses the dimensions of (a) for the semismallness of the convolution map. The proof of [MV] Theorem 3.2 gives all the clauses by one induction, so the node asks for the whole theorem in one statement; if Tau Ceti’s review keeps the pull request to the clauses of §6.2, the others come back to the plan as a node written here, through `prompts/change.md`. Provider: roadmap SheafTheoreticSmithTheory, §6.2 “Semi-infinite intersections at extreme weights”: “For dominant λ and the chosen positive Borel, the semi-infinite orbit indexed by w₀λ meets Gr_H^λ in the single point indexed by w₀λ. If that orbit meets Gr_H^μ with μ dominant in the same component, then λ≤μ in the dominance order. More generally the weights in Gr_H^μ lie in the Weyl-polytope of μ, and the intersection dimension is ⟨ρ,μ+ν⟩”, and “The dimension formula is asserted only for a nonempty intersection S_ν∩Gr_H^μ, with μ dominant and ν a coweight in its Weyl polytope and component.” The roadmap proves it “with the geometry of §3.0, not transported from the complex Grassmannian”. §6.2 is in Layer 6, whose field is separably closed of characteristic different from the prime p of the roadmap; the statement is one of schemes and uses no sheaf, so the node asks for it over every field, as §3.0 is. §6.2 lists §6.1, the constant term functors on étale sheaves, under its needs; the statement and the proof of [MV] use none of it. §3.1 says the same: “Construct the semi-infinite estimates needed by this proof independently of cyclic Smith compatibility in Layer 6.” In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. Still to do: all of the node, after Satake.semiInfiniteOrbits.'''
deps = ['GLCinLean.Satake.semiInfiniteOrbits', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.Groups.basedRootDatum']
source = '[MV] Theorem 3.2'
