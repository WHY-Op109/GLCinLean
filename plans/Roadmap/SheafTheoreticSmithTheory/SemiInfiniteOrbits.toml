desc = 'The semi-infinite orbits of the loop Grassmannian of a split connected reductive group, as attracting and repelling loci. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.Satake.semiInfiniteOrbits'
kind = 'definition'
desc = '''The semi-infinite orbits. Let G be a split connected reductive group over a field F with the torus T and the Borel subgroup B ⊃ T of a pinning (Groups.pinnedData), the unipotent radical N of B (Groups.borelUnipotentRadical) and the opposite unipotent radical N⁻, and LN, LN⁻ their loop groups (LoopGroups.FormalLoopGroup). For a coweight ν, S_ν is the LN-orbit and T_ν the LN⁻-orbit of t^ν in the reduced ind-scheme of Gr_G (AffineGrassmannian.LoopGrassmannian, AffineGrassmannian.schubertStratification). The node asks for the following. (1) The points of Gr_G over an algebraic closure of F are the disjoint union of the S_ν, and also of the T_ν, over all coweights ν (the Iwasawa decomposition). (2) S_ν is locally closed, and its closure is the union of the S_ν′ for ν′ ≤ ν; T_ν is locally closed, and its closure is the union of the T_ν′ for ν′ ≥ ν. Here ν′ ≤ ν means that ν − ν′ is a sum of positive coroots. (3) For the action of 𝔾_m through a regular dominant cocharacter κ of T, the fixed points of the reduced ind-scheme are the t^ν; S_ν is the set of the points x with κ(s)x → t^ν as s → 0, and T_ν the set with κ(s)x → t^ν as s → ∞. (4) S_ν meets Gr^{≤μ} only if t^ν lies in Gr^{≤μ}. The intersections S_ν ∩ Gr^{≤μ} and T_ν ∩ Gr^{≤μ} are locally closed subschemes of the projective scheme Gr^{≤μ}, so they are of finite type. (5) Check. For GL₂ with B upper triangular and λ = (1, 0), S_{(1,0)} ∩ Gr^λ is the affine line of the lines F(e₂ + ae₁) and S_{(0,1)} ∩ Gr^λ is the point Fe₁, of dimensions 1 and 0; for κ = 2ρ∨, diag(s, s⁻¹) sends the line [a : b] to [s²a : b], which tends to [0 : 1] = t^{(1,0)} when b ≠ 0. With the opposite Borel subgroup the two roles are exchanged, so the choice of B fixes the attracting direction. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, sixth paragraph: “For a coweight ν let S_ν and T_ν be the LU-orbit and the LU⁻-orbit of t^ν in the reduced ind-scheme underlying Gr_H. Prove that Gr_H(F̄) is the disjoint union of the S_ν(F̄), and also of the T_ν(F̄); that S_ν is locally closed with closure the union of the S_ν′ for ν′≤ν, and T_ν locally closed with closure the union of the T_ν′ for ν′≥ν; that for the G_m-action through a regular dominant cocharacter κ of T the fixed points of the reduced ind-scheme are the t^ν, S_ν is the set of points x with κ(s)x→t^ν as s→0 and T_ν the set with κ(s)x→t^ν as s→∞; and that S_ν meets Gr^≤μ only if t^ν∈Gr^≤μ”, with the eighth item of its API and its check on GL₂. The roadmap writes U and U⁻ for N and N⁻. It takes the Iwasawa decomposition over F̄((t)) from ReductiveGroupsPartII §RG2.4 (*iwasawa-decomposition*). The dimensions of the intersections are Satake.semiInfiniteIntersection_dimension. In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. The Iwasawa decomposition is at the pin only for GL_n over ℝ and ℂ. Still to do: all of the node, after AffineGrassmannian.schubertStratification and the unipotent radical of the Borel subgroup of a pinning (Groups.borelUnipotentRadical).'''
deps = ['GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.LoopGroups.FormalLoopGroup', 'GLCinLean.Groups.pinnedData', 'GLCinLean.Groups.borelUnipotentRadical']
source = '[MV] §3 and Proposition 3.1; [Zhu] display (5.3.5), Proposition 5.3.6 and Lemma 5.3.7, as the roadmap cites them'
