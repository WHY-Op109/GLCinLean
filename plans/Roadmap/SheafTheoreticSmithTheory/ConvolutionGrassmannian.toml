desc = 'The convolution Grassmannian of a split connected reductive group, with its projection, its convolution map and the twisted products of Schubert varieties. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.ConvolutionGrassmannian'
kind = 'definition'
desc = '''The convolution diagram of the loop Grassmannian. Let G be a split connected reductive group over a field F, Gr_G its loop Grassmannian (AffineGrassmannian.LoopGrassmannian) and Gr^{≤λ} its Schubert varieties (AffineGrassmannian.schubertStratification). The convolution Grassmannian is the contracted product Gr_G ×̃ Gr_G = LG ×^{L⁺G} Gr_G, with the first projection pr₁ to Gr_G, induced by LG → Gr_G, and the convolution map m to Gr_G, induced by the action of LG on Gr_G. The r-fold convolution Grassmannian LG ×^{L⁺G} ⋯ ×^{L⁺G} Gr_G has its successive projections and its r-fold convolution map. The node asks for the following. (1) The map (pr₁, m) is an isomorphism from Gr_G ×̃ Gr_G onto Gr_G × Gr_G. (2) For dominant λ and μ, the twisted product Gr^{≤λ} ×̃ Gr^{≤μ}, the contracted product of the preimage of Gr^{≤λ} in LG with Gr^{≤μ}, is a projective scheme; over Gr^{≤λ} it is locally in the Zariski topology a product with fibre Gr^{≤μ}; and m maps it onto Gr^{≤(λ+μ)}. The plan needs the product charts in one form: for an open U of Gr^{≤λ} and a section s over U of the torsor LG → Gr_G, the chart is U × Gr^{≤μ} → Gr^{≤λ} ×̃ Gr^{≤μ}, (u, x) ↦ [s(u), x], and such opens cover Gr^{≤λ}. Satake.convolution uses a chart of this form to identify the descended external product with the external product on U × Gr^{≤μ}; a product chart that no section induces does not give this. The roadmap states the local products and no local section of LG → Gr_H ([MV] §2 states that LG → Gr_G is locally trivial in the Zariski topology). The node asks for the charts in this form; if Tau Ceti’s review declines, the local sections come back to the plan as a node written here, through `prompts/change.md`. (3) The r-fold convolution maps are associative: the r-fold convolution Grassmannian is the iterated twisted product for every bracketing, compatibly with the convolution maps; and the base point is a unit for the twisted product. The roadmap defines the r-fold form and does not state these compatibilities; the associativity and unit constraints of Satake.convolution use them, and the node asks for them with the definition. (4) Check. For GL₂ the convolution map Gr^{(1,0)} ×̃ Gr^{(1,0)} → Gr^{≤(2,0)} is a map between surfaces whose fibre over the point tL₀ of Gr^{(1,1)} is a projective line, the lattices L₁ with tL₀ ⊂ L₁ ⊂ L₀ of colength one, and whose fibre over a point of Gr^{(2,0)} is one point. So m is surjective and not finite. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, fourth paragraph: “Define the convolution Grassmannian Gr_H×̃Gr_H=LH×^(L⁺H)Gr_H with its first projection pr₁ and convolution map m, and the r-fold convolution Grassmannian with its successive projections and r-fold convolution map. Prove that (pr₁,m) is an isomorphism onto Gr_H×Gr_H, that the twisted product Gr^≤λ×̃Gr^≤μ is a projective scheme, Zariski-locally a product over Gr^≤λ with fibre Gr^≤μ, and that m maps it onto Gr^≤(λ+μ)”, with the sixth item of its API and its check on GL₂. The contracted products are those of SchemeAndStackFoundations §1.16 (Stacks.groupTorsor). Not in the roadmap and written here: the convolution of D-modules (Satake.convolution); the convolution of the roadmap is for étale sheaves. The fifth paragraph of §3.0 builds the Beilinson–Drinfeld Grassmannians over the powers of the affine line; the plan needs them over the powers of the curve of the statement (Hecke.Correspondence, Satake.fusion), which the roadmap does not state, and they have no node here. In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. To be used and not written again: contracted products, `CategoryTheory.Sheaf.Torsor.contractedProduct` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`). Still to do: all of the node, after AffineGrassmannian.LoopGrassmannian and AffineGrassmannian.schubertStratification.'''
deps = ['GLCinLean.AffineGrassmannian.LoopGrassmannian', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.Stacks.groupTorsor']
source = '[MV] §4; [Zhu] displays (1.2.12)–(1.2.15), as the roadmap cites them'
