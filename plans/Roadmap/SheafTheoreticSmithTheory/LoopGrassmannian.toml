desc = 'The loop Grassmannian LG/L⁺G of an affine group over a field, as an fpqc sheaf on commutative algebras, with its description by torsors and its ind-projectivity for a split connected reductive group. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.LoopGrassmannian'
kind = 'definition'
desc = '''The loop Grassmannian Gr_G of an affine group G of finite type over a field F, as a functor on commutative F-algebras. LG and L⁺G are the loop group and the arc group of LoopGroups.FormalLoopGroup, for the coordinate Hopf algebra of G. The node asks for the following. (1) The functor. Gr_G is the sheafification for the fpqc topology of the presheaf R ↦ LG(R)/L⁺G(R) on commutative F-algebras; it is defined on every R, the nonreduced ones included. It has a base point and a left action of LG, hence of L⁺G; the map LG → Gr_G is a torsor under L⁺G. It is a functor of G, it sends a product of groups to the product, and it commutes with extension of the field F. (2) Torsors. Gr_G(R) is the set of isomorphism classes of pairs (E, β) of a G-torsor E on Spec R[[t]] and a trivialization β of E over Spec R((t)); a pair has no automorphism other than the identity. By Beauville–Laszlo gluing it is also the set of classes of G-torsors on the affine line over R with a trivialization off the zero section. (3) GL_n. An R-point of Gr_{GL_n} is a finite projective R[[t]]-submodule L of R((t))ⁿ with R((t))·L = R((t))ⁿ. The points with t^N R[[t]]ⁿ ⊂ L ⊂ t^{−N} R[[t]]ⁿ form the closed subscheme of the t-stable submodules in the Grassmannian of locally free quotients of the free R-module t^{−N} R[[t]]ⁿ/t^N R[[t]]ⁿ of rank 2nN, and Gr_{GL_n} is the union of these charts. (4) Ind-projectivity. For G split connected reductive and a closed embedding G → GL(V), the quotient GL(V)/G is affine and Gr_G → Gr_{GL(V)} is a closed immersion. So Gr_G is an ind-projective ind-scheme over F in the sense of the roadmap: an fpqc sheaf on commutative F-algebras that is a filtered colimit of projective F-schemes along closed immersions. (5) Checks. For 𝔾_m, Gr(F) = ℤ through the lattices t^n F[[t]]; over R = F[ε]/ε² the unit 1 + εt⁻¹ gives an R-point that reduces to the base point and differs from it, so Gr_{𝔾_m} is not the constant scheme ℤ, although its reduced ind-scheme is. For the Borel subgroup B of GL₂, Gr_B → Gr_{GL₂} is bijective on points over an algebraic closure and is not a closed immersion, because GL₂/B is the projective line: reductivity is needed in (4). Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. The roadmap defines Gr_H only for a split connected reductive H. (1) and (2) use neither reductivity nor that F is a field, and the roadmap’s own check on B ⊂ GL₂ uses Gr_B; the node asks for (1) and (2) for every affine group of finite type where Tau Ceti’s review accepts it. The plan uses Gr of the group G, of G/Z(G)⁰ and of the simply connected cover of the derived group, which are split connected reductive; the plan of the proof also uses Gr of Borel and parabolic subgroups and of their unipotent radicals. If the review keeps (1) to reductive groups, the quotient for the other groups is written in GLCinLean.AffineGrassmannian. Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, first paragraph: “Define the loop Grassmannian Gr_H as the fpqc sheafification of R↦LH(R)/L⁺H(R). Prove that Gr_H represents the functor of pairs (E,β) of an H-torsor E on Spec R[[t]] and a trivialization β of E over Spec R((t)), on all F-algebras including nonreduced ones, that Beauville–Laszlo gluing identifies it with the functor of H-torsors on the affine line over R trivialized off the zero section, and that Gr_H is an ind-projective ind-scheme over F”, with its GL_n charts, the closed immersion into Gr_{GL(V)}, the first three items of its API and its checks on 𝔾_m and on B ⊂ GL₂. The roadmap takes its inputs from other roadmaps: Beauville–Laszlo gluing (RelativeFarguesFontaine §6.5), the Grassmannian of locally free quotients (ModularCurves Layer 0G), fpqc descent, torsors and contracted products (SchemeAndStackFoundations §§1.1, 1.15–1.16) and the affine quotient GL(V)/G (ArithmeticGaloisRepresentations §1.11). It does not define the loop group: that is LoopGroups.FormalLoopGroup, of roadmap FormalConnectionsOpers. Not in the roadmap and written here, in GLCinLean.AffineGrassmannian: Gr_G as a classical prestack and a classical ind-scheme of the plan, and the action of the coordinate changes Aut(O). In Tau Ceti at the pin, to be used and not written again: the loop group and the arc group as functors (LoopGroups.FormalLoopGroup); the points of Gr_{GL_n} as lattices, `TauCeti.ProjectiveLattice` (`TauCeti.Algebra.Module.ProjectiveLattice`), a finitely generated projective B-submodule of a K-module whose K-span is everything, with its standard lattice, its maps, the action of the linear automorphisms and its base change, which no other file uses; the lattices t^a V[[t]] with the quotients t^a V[[t]]/t^b V[[t]] ≃ V^{b−a}, `TauCeti.LaurentSeries.lattice` and `TauCeti.LaurentSeries.latticeQuotientEquiv` (`TauCeti.RingTheory.LaurentSeries.Lattice`); the Grassmannian scheme of the quotients of a module over a commutative ring, `Module.Grassmannian.scheme` (`TauCeti.AlgebraicGeometry.Grassmannian.Basic`), with its functor of points `Module.Grassmannian.schemeHomEquiv` (`TauCeti.AlgebraicGeometry.Grassmannian.Points`), its properness for a finite module, the Plücker closed immersion `Module.Grassmannian.pluckerHom` (`TauCeti.AlgebraicGeometry.Grassmannian.Plucker`), and the closed subscheme of an ideal of conditions that commutes with base change, `Module.Grassmannian.schemeIdealLocus` (`TauCeti.AlgebraicGeometry.Grassmannian.IdealLocus`); the fppf topology on commutative algebras, `TauCeti.CommAlgCat.fppfTopology` (`TauCeti.Algebra.Category.CommAlgCat.Fppf`), and the fppf quotient of an affine group by a closed subgroup, `CommHopfAlgCat.fppfHomogeneousQuotient` (`TauCeti.Algebra.AlgebraicGroup.Fppf.Quotient.Homogeneous.Basic`); the affineness of GL_n/G for a faithful representation of a reductive group over a field of characteristic zero, `TauCeti.Comodule.isIso_fppfHomogeneousQuotientToCoinvariantsPoints_ker_coordinateBialgHom` (`TauCeti.Algebra.AlgebraicGroup.Fppf.Quotient.Homogeneous.GeneralLinear`), which is the case of the plan; torsors and contracted products on a site (Stacks.groupTorsor); and glueing pairs, the hypothesis of Beauville–Laszlo gluing, `TauCeti.GlueingPair` (`TauCeti.RingTheory.Patching.GlueingPair`), without the gluing equivalence. Mathlib has the fpqc topology on schemes, `AlgebraicGeometry.Scheme.fpqcTopology` (`Mathlib.AlgebraicGeometry.Sites.Fpqc`), which is the one to restrict to affine schemes; no second definition is written. Not at the pin: the functor Gr_G, its sheafification, an fpqc topology on commutative algebras, the functor of lattices in R((t))ⁿ and its bounded charts, the closed subscheme of the submodules that an endomorphism preserves, G-torsors on Spec R[[t]], Quot schemes, and any notion of ind-scheme. Still to do: all of (1) to (5). The first steps that build on Tau Ceti main alone are the bounded lattices as t-stable submodules with projective quotient, and the closed subscheme of the stable submodules in the Grassmannian scheme, which give the charts of (3).'''
