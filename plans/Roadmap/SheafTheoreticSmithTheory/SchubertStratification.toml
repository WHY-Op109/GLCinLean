desc = 'The stratification of the loop Grassmannian of a split connected reductive group by the orbits of the arc group, with the Schubert varieties and the connected components. Owner: the Tau Ceti roadmap SheafTheoreticSmithTheory.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.schubertStratification'
kind = 'definition'
desc = '''The orbits of the arc group on the loop Grassmannian and their closures. Let G be a split connected reductive group over a field F, with the split maximal torus T and the Borel subgroup B ⊃ T of a pinning (the fields `torus` and `borel` of `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`)), and Gr_G its loop Grassmannian (AffineGrassmannian.LoopGrassmannian). Dominance, the dominance order μ ≤ λ (λ − μ is a sum of simple coroots) and 2ρ, the sum of the positive roots, are those of the based root datum (Groups.basedRootDatum). For a coweight λ put t^λ = λ(t) in LT(F) ⊂ LG(F). For a dominant λ, Gr^λ is the L⁺G-orbit of the image of t^λ in Gr_G, and Gr^{≤λ} is the reduced closure of Gr^λ. The node asks for the following. (1) Orbits. The L⁺G-orbits on the points of Gr_G over an algebraic closure of F are exactly the Gr^λ, and λ ↦ Gr^λ is a bijection from the dominant coweights. Gr^λ is smooth, quasi-projective and geometrically connected of dimension ⟨2ρ, λ⟩; the stabilizer of t^λ is L⁺G ∩ t^λ L⁺G t^{−λ} and is connected; and t^ν lies in Gr^λ exactly when ν is in the Weyl orbit of λ. (2) Closures. Gr^{≤λ} is projective, and its underlying set is the union of the Gr^μ over the dominant μ ≤ λ. (3) Jets. For each λ there is n such that the action of L⁺G on Gr^{≤λ} factors through the jet group G(R[t]/tⁿ); n depends on λ. (4) Components. The connected components of Gr_G are geometrically connected and are indexed by π₁(G) = X_*(T)/ℤΦ∨, the coweight lattice modulo the coroot lattice; Gr^λ lies in the component of the class of λ, and ⟨2ρ, λ⟩ has constant parity on each component. (5) The reduced ind-scheme. Every reduced closed subscheme of finite type of Gr_G lies in a finite union of the Gr^{≤λ}, so the reduced ind-scheme of Gr_G is the filtered union of these finite unions. The roadmap does not state (5) in these words; it follows from (1), (2) and quasi-compactness, the plan uses it to present D-modules on Gr_G by Schubert varieties, and the node asks for it with (2). (6) Checks. For a torus every coweight is dominant and each Gr^λ is one point. For GL₂ and λ = (1, 0), Gr^{≤λ} = Gr^λ is the projective line of lines in L₀/tL₀, L₀ = F[[t]]²; for λ = (1, −1), Gr^{≤λ} is Gr^λ together with the point L₀, a quadric cone of dimension 2 that is singular at L₀. The strata (0, 0) and (1, −1) have dimensions 0 and 2 on one component, and (1, 0) and (2, −1) have dimensions 1 and 3 on another. L⁺GL₂ acts on Gr^{≤(1,0)} through GL₂ and not on Gr^{≤(1,−1)}: the element 1 + tE₁₂ moves the lattice tF[[t]]e₁ ⊕ t⁻¹F[[t]]e₂; the second jet group suffices there. Generality. The plan needs the case of an algebraically closed field of characteristic zero, over which every connected reductive group is split. The roadmap states §3.0 for “any field” and “a split connected reductive group over F”, and it keeps every commutative F-algebra, “including nonreduced ones”; this contains the case of the plan. The roadmap proves the statements on points over an algebraic closure and descends them to F, “because H is split and each t^λ is F-rational”. Provider: roadmap SheafTheoreticSmithTheory, §3.0 “The loop Grassmannian over an arbitrary field”, second paragraph: “Prove that the L⁺H-orbits on Gr_H(F̄) are exactly the Gr^λ(F̄), bijectively indexed by the dominant coweights; that Gr^λ is smooth, quasi-projective and geometrically connected of dimension ⟨2ρ,λ⟩, with connected stabilizer L⁺H∩t^λL⁺Ht^(−λ) at t^λ, and contains the T-fixed point t^ν exactly when ν∈Wλ; that Gr^≤λ is projective with underlying set the union of the Gr^μ over dominant μ≤λ in the dominance order; that for each λ there is n with the action of L⁺H on Gr^≤λ factoring through LⁿH; and that the connected components of Gr_H are geometrically connected and indexed by π₁(H)=X_*(T)/ℤΦ∨”, with the fourth item of its API and its checks on GL₂. The roadmap takes the Cartan decomposition over F̄((t)) from ReductiveGroupsPartII §RG2.4 (*cartan-decomposition*). In Tau Ceti at the pin: no loop Grassmannian in any form, no affine flag variety, no ind-scheme, and no Cartan, Iwasawa or Iwahori–Bruhat decomposition of the points of a group over a field of Laurent series other than GL_n. To be used and not written again: the Cartan decomposition of GL_n over a discrete valuation ring R with fraction field K, each element of GL_n(K) lying in exactly one double coset GL_n(R)·diag(π^a)·GL_n(R) with a monotone, `TauCeti.existsUnique_monotone_mem_doubleCoset_diagGL_zpow` (`TauCeti.LinearAlgebra.Matrix.GeneralLinearGroup.Cartan.DiscreteValuationRing`), which applies to F[[t]] ⊂ F((t)) and gives (1) on F-points for GL_n; the lattice ⊕ ξ^{k_i}·B of a cocharacter k of the diagonal torus of GL_n, `TauCeti.diagonalLattice` (`TauCeti.RingTheory.AffineGrassmannian.Lattice.Filtration`), which for ξ = t is the point t^λ of Gr_{GL_n}, as a submodule and not yet as a `TauCeti.ProjectiveLattice` (`TauCeti.Algebra.Module.ProjectiveLattice`), with its filtration `Submodule.latticeFiltration` (`TauCeti.RingTheory.AffineGrassmannian.Lattice.Filtration`); the jet groups of LoopGroups.FormalLoopGroup; and the Schubert loci of the finite Grassmannian scheme. Not at the pin: the element t^λ of the loop group of a torus for a cocharacter λ, the orbits Gr^λ and their closures as schemes, and every statement of (1) to (5). Still to do: all of the node, after AffineGrassmannian.LoopGrassmannian.'''
