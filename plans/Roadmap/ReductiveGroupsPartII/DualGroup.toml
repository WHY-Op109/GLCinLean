desc = 'The dual based root datum, the Langlands dual group over k, its identification data and the parity of coweights. Owner: the Tau Ceti roadmap ReductiveGroupsPartII.'

[[node]]
id = 'GLCinLean.Groups.langlandsDual'
kind = 'definition'
desc = 'Given a pinned reductive group over k, construct the pinned split reductive integral group for the FLIPPED based root datum, base-change to k, and exhibit Groups.dualityData for the input and output pinnings. This includes the central torus, not just the semisimple root system. Provider: roadmap ReductiveGroupsPartII, `langlands-dual-group` and `dual-based-root-datum`. In Tau Ceti at the pin: the base change of the parts of a pinning, `TauCeti.SplitMaximalTorus.baseChange` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`) and `TauCeti.HopfIdeal.IsBorelOver.baseChange` (`TauCeti.Algebra.AlgebraicGroup.Borel.Over`); no base change of a `TauCeti.Pinning` as a whole, and nothing on a dual group. Still to do: the existence theorem of Groups.splitReductiveGroup for the flipped based root datum, the base change of a pinning to k (item `pinning-base-change`), and the duality data for the input and output pinnings (items `dual-based-root-datum-of-pinnings` and `langlands-dual-group`). Upstream declarations used: `RootPairing.flip` (`Mathlib.LinearAlgebra.RootSystem.Defs`), `RootPairing.Base.flip` (`Mathlib.LinearAlgebra.RootSystem.Base`), `RootPairing.Equiv` (`Mathlib.LinearAlgebra.RootSystem.Hom`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.dualityData', 'GLCinLean.Groups.splitReductiveGroup']
source = '[ConradRGS] Theorems 6.1.16(2), 6.1.17; [GLC1] §0.1.1'


[[node]]
id = 'GLCinLean.Groups.dualityData'
kind = 'definition'
desc = 'Data for TWO SPECIFIED PINNINGS p of G and pd of Gd: an equivalence from basedRootDatum(p).flip to basedRootDatum(pd), preserving the flipped base. It uses RootPairing.Equiv and the base condition, not an equality or a free identification. This is the replacement content for Statement.RootDatumDuality after its future signature is made pinning-indexed. Provider: roadmap ReductiveGroupsPartII, `dual-based-root-datum` and `langlands-dual-group`. In Mathlib and Tau Ceti at the pin, the abstract part: the base condition is stated with `RootPairing.Base.map` (`Mathlib.LinearAlgebra.RootSystem.Base`), the push forward of a base along an equivalence, so for the based root data (P, b) of p and (Q, c) of pd the data are an equivalence `e : RootPairing.Equiv P.flip Q` with `b.flip.map e = c`; a structure with these two fields elaborates at the pin. Tau Ceti adds `RootPairing.Equiv.flip` and `RootPairing.Base.flipSupportEquiv` (`TauCeti.LinearAlgebra.RootSystem.Flip`). Still to do: only Groups.basedRootDatum; after it the data are one small pull request (item `dual-based-root-datum-of-pinnings`). Upstream declarations used: `RootPairing.flip` (`Mathlib.LinearAlgebra.RootSystem.Defs`), `RootPairing.Base.flip` and `RootPairing.Base.map` (`Mathlib.LinearAlgebra.RootSystem.Base`), `RootPairing.Equiv` (`Mathlib.LinearAlgebra.RootSystem.Hom`).'
deps = ['GLCinLean.Groups.basedRootDatum']
source = '[ConradRGS] Theorem 6.1.17; [GLC1] §0.1.1'

[[node]]
id = 'GLCinLean.Groups.dualityData_changePinning'
kind = 'theorem'
desc = 'Transport the duality identification under changes of pinning using pinned-group classification; the induced based-root-datum equivalences preserve the original duality map. Show that adding a dual pinning and rank is only a choice of presentation of the Langlands dual group, and provide a nontrivial example before changing the statement signature. Provider: roadmap ReductiveGroupsPartII, the independence of choices in “the dual group and its Galois action”. In Mathlib and Tau Ceti at the pin: transport of a pinning along an isomorphism, `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`), and the composite, inverse and flip of equivalences of root pairings, `RootPairing.Equiv.comp` and `RootPairing.Equiv.symm` (`Mathlib.LinearAlgebra.RootSystem.Hom`) and `RootPairing.Equiv.flip` (`TauCeti.LinearAlgebra.RootSystem.Flip`). Still to do: the canonical equivalence between the based root data of two pinnings of one group, which uses the conjugacy of the pairs of a torus and a Borel subgroup and the torsor of pinnings (Groups.pinnings_torsor) with the isomorphism theorem of Groups.splitReductiveGroup; its compatibility with the duality data; and a nontrivial example (items `pinnings-torsor` and `duality-data-change-pinning`).'
deps = ['GLCinLean.Groups.dualityData', 'GLCinLean.Groups.pinning_exists', 'GLCinLean.Groups.splitReductiveGroup', 'GLCinLean.Groups.pinnings_torsor']
source = '[ConradRGS] Theorem 6.1.17 and Proposition 7.1.6'

[[node]]
id = 'GLCinLean.Groups.coweightParity'
kind = 'definition'
desc = '''Pair a coweight with the positive-ROOT sum character supplied by TauCeti.twoWeylVector on the extracted integral based root datum, and reduce modulo 2. Prove it kills the coroot lattice and descends to the algebraic fundamental group; under duality identify the resulting central element of order dividing two. This is distinct from the Whittaker positive-COROOT cocharacter. Provider: roadmap ReductiveGroupsPartII, `dual-based-root-datum` and its root and centre lattice comparisons. Upstream declarations used: `TauCeti.twoWeylVector` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Vector`), `TauCeti.coroot'_twoWeylVector_eq_two_mul_height_flip` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Vector`).'''
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.dualityData']
source = '[GLys] §§5.2.2–5.2.3, 6.3.5'
