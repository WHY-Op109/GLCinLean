desc = 'The gerbe of n-th roots of an invertible sheaf on a scheme. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.schemeRootGerbe'
kind = 'definition'
desc = 'For a scheme X, an invertible sheaf L on X and n > 0 invertible on X, the gerbe of n-th roots of L on the big étale site of X (the schemes over X with the étale topology), banded by the sheaf μ_n (Stacks.abelianBandedGerbe): over T → X its objects are the n-th roots of the pullback of L to T and its arrows are their isomorphisms (LineBundle.Root). The banding sends a section ζ of μ_n over T to the automorphism ζ · id_M of every root (M, φ) over T; this is an automorphism of the root because ζ^n = 1, and every automorphism of a root is of this form. It is a gerbe because it is the lifting gerbe of the Kummer sequence 1 → μ_n → 𝔾_m → 𝔾_m → 1 of sheaves on this site, which is short exact when n is invertible on X (`AlgebraicGeometry.Scheme.kummerSequence_shortExact` of Tau Ceti), and of the frame torsor of L, a torsor under the sheaf 𝔾_m. Orientation of this comparison: the roadmap bands the lifting gerbe by the positive translation by the kernel (§4.20: “Its band is the **positive** translation by A”). The frame torsor of an invertible sheaf M is the sheaf Isom(𝒪, M) with the action g · ψ = ψ ∘ g of 𝔾_m, that is, g · ψ = gψ. The comparison sends a root (M, φ) to the frame torsor of M with the map ψ ↦ φ ∘ ψ^{⊗n} to the frame torsor of L, which is equivariant along the n-th power map. With this action the automorphism ζ · id_M of a root goes to the translation by ζ, so the comparison preserves the bands. `picEquiv` of SchemeAndStackFoundations §1.15 gives the same sheaf Isom(𝒪, L) the left action g · φ = φ ∘ g^{-1}; the two actions differ by the inversion of 𝔾_m, and with the action of `picEquiv` the automorphism ζ · id_M goes to the translation by ζ^{-1}. So the comparison uses the action g · ψ = ψ ∘ g, or the action of `picEquiv` together with the change of band along the inversion of μ_n. Tau Ceti should have one frame torsor of an invertible sheaf: the second action is the first one composed with the inversion of 𝔾_m, and is not a second construction. Required of the target: the equivalence between the groupoid of roots and the groupoid of lifts sends ζ · id_M to the band element ζ. Check: for n = 3 over an algebraically closed field in which 3 is invertible, a primitive cube root of unity ζ gives two different automorphisms ζ · id_M and ζ^{-1} · id_M, so the two bandings differ; for n = 2 they agree, so the square roots that the statement uses do not test the orientation. Base change: for T → X, the restriction of the root gerbe of L to the slice at T, which is the big étale site of T, is equivalent to the root gerbe of the pullback of L, with its band; the restriction is `CategoryTheory.Pseudofunctor.over` of Tau Ceti, with the restricted banding. An n-th root of L on X is an object over X, that is, a neutralization. Example, for an algebraically closed field k and n > 1 invertible in k: the root gerbe of 𝒪(1) on ℙ¹ has objects étale-locally and no object over ℙ¹, because n · deg M = 1 has no solution; for n = 2, 𝒪(2) has the root 𝒪(1). No section of L is part of the data: this is not the root stack of a line bundle with a section (SchemeAndStackFoundations §1.21). Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”: `liftingGerbe` (with `liftingGerbe.isGerbe`, `liftingGerbe.band`, `liftingGerbe.neutral_iff_lift` and `liftingGerbe.slice` of §4.20), `rootGerbe` (“An automorphism is scalar multiplication by a μn section”) and `rootO1Nonneutral`. The roadmap defines `RootGerbe_n(L)(T)` for every T → X and states its base change for every T → X, which is the root gerbe on the big étale site; it states `rootGerbeClass` on the small étale site of X. `liftingGerbe` lists under its needs `classifyingAbelianGerbe` (Stacks.classifyingAbelianGerbe), `relativeGerbe` of §4.1 (Stacks.relativeGerbe) and SchemeAndStackFoundations §§1.18 and 1.21 (Stacks.stackification, Stacks.quotientStack): the lifting gerbe is a 2-fibre product of stacks of torsors. Prerequisite that is written with this node: the frame torsor, with the action above, as a torsor under the sheaf 𝔾_m on the big étale site, in the sense of the torsors of a sheaf of groups that Tau Ceti has; the representability results of SchemeAndStackFoundations §1.15 (Stacks.groupTorsor) are not used. Of `rootO1Nonneutral` this plan uses the clauses on objects over ℙ¹, which follow from the degree; this plan does not use its clause on the class in H², nor `rootGerbeClass`, `h2Classification`, `hilbert90` or Tsen. None of these targets is in Tau Ceti. In Tau Ceti at the pin: the sheaves 𝔾_m and μ_n on the schemes over X (`AlgebraicGeometry.Scheme.Gm`, `AlgebraicGeometry.Scheme.mu`), which are sheaves for the fpqc topology and so for the étale topology, and the degree on ℙ¹. The Kummer sequence is in Tau Ceti at the pin, in the module `TauCeti.AlgebraicGeometry.Sites.Big.Kummer`. `AlgebraicGeometry.Scheme.kummerSequence X J n` is the complex μ_n → 𝔾_m → 𝔾_m, with the n-th power map, of sheaves of abelian groups on the schemes over X, for a topology J on schemes for which the fpqc sheaves on the schemes over X are sheaves; the étale topology is one. `AlgebraicGeometry.Scheme.kummerSequence_shortExact` says that it is short exact when n is invertible on X and J is finer than the étale topology; invertible means that the image of n in the global functions of X is a unit, and n > 0 is no hypothesis (n = 0 is invertible only on the empty scheme). With it: μ_n is the kernel of the n-th power map for every n (`AlgebraicGeometry.Scheme.isLimitMuKernelForkMap`); for n invertible on X the n-th power map is an epimorphism of sheaves (`AlgebraicGeometry.Scheme.epi_sheafPushforwardContinuous_map_powHom`) and is locally surjective (`AlgebraicGeometry.Scheme.isLocallySurjective_powHom`), because every unit on a scheme on which n is invertible has an n-th root on an étale covering (`AlgebraicGeometry.Scheme.exists_etale_cover_pow_eq`). For f : T → X, `AlgebraicGeometry.Scheme.kummerSequenceOverMapPullbackIso` is an isomorphism from the restriction of the Kummer sequence of X to the schemes over T, by the Mathlib functor `CategoryTheory.GrothendieckTopology.overMapPullback`, to the Kummer sequence of T; its components are `AlgebraicGeometry.Scheme.muOverMapPullbackIso` and `AlgebraicGeometry.Scheme.GmOverMapPullbackIso`. The restriction of a banded gerbe to a slice site is in Tau Ceti at the pin. For an object U of the site, `CategoryTheory.Pseudofunctor.over` (`TauCeti.CategoryTheory.Bicategory.Functor.LocallyDiscrete`) is the restriction F.over U of a `Cat`-valued pseudofunctor F to the slice C/U: its fibre over V → U is the fibre of F over V. It is a stack and a gerbe for the induced topology `J.over U` when F is one for J (the instances `CategoryTheory.Pseudofunctor.isStack_over` (`TauCeti.CategoryTheory.Sites.Descent.Over`) and `CategoryTheory.Pseudofunctor.isGerbe_over` (`TauCeti.CategoryTheory.Sites.Descent.IsGerbe`)). An A-banding b of F restricts to the banding `b.over U` of F.over U by the restriction `A.over U` of A, which is the Mathlib sheaf `CategoryTheory.Sheaf.over` (`Mathlib.CategoryTheory.Sites.Over`); the restriction of a band-preserving morphism is band-preserving for the restricted bandings (`CategoryTheory.Pseudofunctor.AbelianBanding.over` and the instance `CategoryTheory.Pseudofunctor.BandPreserving.over` (`TauCeti.CategoryTheory.Sites.Descent.Banding`)). Morphisms and modifications restrict by the precomposition pseudofunctor `CategoryTheory.Pseudofunctor.precomp` (`TauCeti.CategoryTheory.Bicategory.FunctorBicategory.Precomp`) at the functor that forgets the map to U, so restriction keeps identities and composites up to its coherence isomorphisms. The neutralizations of F.over U over V → U are the neutralizations of F over V, by the equivalence `CategoryTheory.Pseudofunctor.Neutralization.overEquiv`, which commutes with pullback (`TauCeti.CategoryTheory.Sites.Descent.Neutralization`). The restricted gerbe and its band are on the slice of the site at U; when the site is the schemes over S and U is T → S, this slice is equivalent to the schemes over T by `CategoryTheory.Over.iteratedSliceEquiv` (`Mathlib.CategoryTheory.Comma.Over.Basic`). The band of the restricted root gerbe is the sheaf `(μ_n).over (T → X)` on that slice, and the root gerbe of the pullback of L is banded by the sheaf μ_n of T on the schemes over T; the base change of this node states the comparison of the two bands through this equivalence. For it, Mathlib has `CategoryTheory.Over.iteratedSliceBackward_forget` (`Mathlib.CategoryTheory.Comma.Over.Basic`), which identifies the restriction to the slice with `overMapPullback`, and the instances of `Mathlib.CategoryTheory.Sites.Over` by which the iterated slice equivalence respects the two topologies; still to do is the transport of a pseudofunctor and of a banding along this equivalence, which Tau Ceti lacks. Also, `AlgebraicGeometry.Scheme.muOverMapPullbackIso` compares the restriction of μ_n of X to the schemes over T with μ_n of T. Upstream declarations used: `AlgebraicGeometry.Scheme.kummerSequence`, `AlgebraicGeometry.Scheme.kummerSequence_shortExact`, `AlgebraicGeometry.Scheme.kummerSequenceOverMapPullbackIso`, `AlgebraicGeometry.Scheme.isLocallySurjective_powHom`, `AlgebraicGeometry.Scheme.epi_sheafPushforwardContinuous_map_powHom` and `AlgebraicGeometry.Scheme.exists_etale_cover_pow_eq` (`TauCeti.AlgebraicGeometry.Sites.Big.Kummer`), `AlgebraicGeometry.Scheme.powHom`, `AlgebraicGeometry.Scheme.muToGm`, `AlgebraicGeometry.Scheme.isLimitMuKernelForkMap`, `AlgebraicGeometry.Scheme.muOverMapPullbackIso` and `AlgebraicGeometry.Scheme.GmOverMapPullbackIso` (`TauCeti.AlgebraicGeometry.Sites.Big.StructureSheaf`), `CategoryTheory.GrothendieckTopology.overMapPullback` (`Mathlib.CategoryTheory.Sites.Over`), `CategoryTheory.Pseudofunctor.over` (`TauCeti.CategoryTheory.Bicategory.Functor.LocallyDiscrete`), `CategoryTheory.Pseudofunctor.isStack_over` (`TauCeti.CategoryTheory.Sites.Descent.Over`), `CategoryTheory.Pseudofunctor.isGerbe_over` (`TauCeti.CategoryTheory.Sites.Descent.IsGerbe`), `CategoryTheory.Pseudofunctor.AbelianBanding.over` and `CategoryTheory.Pseudofunctor.BandPreserving.over` (`TauCeti.CategoryTheory.Sites.Descent.Banding`), `CategoryTheory.Pseudofunctor.precomp` (`TauCeti.CategoryTheory.Bicategory.FunctorBicategory.Precomp`), `CategoryTheory.Pseudofunctor.Neutralization.overEquiv` (`TauCeti.CategoryTheory.Sites.Descent.Neutralization`), `CategoryTheory.Sheaf.over` (`Mathlib.CategoryTheory.Sites.Over`), `CategoryTheory.Over.iteratedSliceEquiv` (`Mathlib.CategoryTheory.Comma.Over.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `AlgebraicGeometry.Scheme.Gm` and `AlgebraicGeometry.Scheme.mu` (`TauCeti.AlgebraicGeometry.Sites.Big.StructureSheaf`), `AlgebraicGeometry.Scheme.etaleTopology` (`Mathlib.AlgebraicGeometry.Sites.Etale`), `CategoryTheory.GrothendieckTopology.over` (`Mathlib.CategoryTheory.Sites.Over`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`), `TauCeti.AlgebraicGeometry.projectiveLine.eulerDegree_twistingSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.ProjectiveLine`).'
