desc = 'The groupoid of n-th roots of an invertible sheaf on a scheme, with its pullback. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.LineBundle.Root'
kind = 'definition'
desc = 'For a scheme X, an invertible sheaf L on X and a natural number n, the groupoid of n-th roots of L. An object is a pair (M, φ) of an invertible sheaf M on X and an isomorphism φ : M^{⊗n} ≅ L, kept as data. An arrow (M, φ) → (M′, φ′) is an isomorphism ρ : M ≅ M′ with φ = φ′ ∘ ρ^{⊗n}. Give the pullback of roots along a map of schemes f : X′ → X, a functor from the roots of L to the roots of f^*L, with its isomorphisms for the identity map and for a composite of two maps and their coherence; the equivalence between the roots of L and the roots of L′ that an isomorphism L ≅ L′ gives; and the trivial root (𝒪, 𝒪^{⊗n} ≅ 𝒪) of 𝒪, which pullback preserves. The definition has no hypothesis on X and none on n: not n ≥ 1, and not that n is invertible on X. For n = 0 a root is an invertible sheaf M with an isomorphism 𝒪 ≅ L. The definition uses no étale sheaf, no Kummer sequence and no stack: Curves.ThetaCharacteristic uses n = 2 over every base scheme, also where 2 is not invertible. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”, as the prerequisite of the target `rootGerbe`: this groupoid with its pullback is the fibre groupoid `RootGerbe_n(L)(T)` of that target (line bundles M on T and isomorphisms `φ:M⊗n≅L|T`, with arrows ρ satisfying `φ=ψ∘ρ⊗n`), and a check of that target uses the trivial root (“The root gerbe of `O_X` is equivalent to `B_Xμn` using its trivial nth root”). `rootGerbe` assumes n > 0 invertible on X; it needs this only to prove that the roots form a gerbe (Stacks.schemeRootGerbe). In Tau Ceti: `InvertibleSheaf.tensorPow` gives M^{⊗n}; its laws for isomorphic sheaves and for pullback are existence statements (`nonempty_tensorPow_obj_iso`, `nonempty_pullback_tensorPow_iso`); pullback is the functor `InvertibleSheaf.pullback` with the natural isomorphisms `pullbackId` and `pullbackComp`; and for an object of any monoidal category, `TauCeti.tensorPow` with the specified isomorphisms `tensorPowMapIso` and `tensorPowSuccIso`, which nests the factors in the other order than `InvertibleSheaf.tensorPow`. Still to do, in this order. (1) As improvements of the existing code of `TauCeti.AlgebraicGeometry.LineBundle.Power`, the specified isomorphisms in place of the two existence statements: the isomorphism L^{⊗n} ≅ K^{⊗n} of an isomorphism L ≅ K, compatible with identities and composition; the isomorphism f^*(L^{⊗n}) ≅ (f^*L)^{⊗n}, natural in L and compatible with `pullbackId` and `pullbackComp`, built from the isomorphism f^*(M ⊗ N) ≅ f^*M ⊗ f^*N of LineBundle.pullbackTensorIso; and the isomorphism 𝒪^{⊗n} ≅ 𝒪. (2) The groupoid of roots, its pullback, its equivalence for an isomorphism L ≅ L′, and the trivial root. The tensor product of roots, the dual of a root and the twist of a root are not part of this node: no roadmap target needs them (LineBundle.Root.tensorProduct). Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorTrivialLeftIso` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorPow` (`TauCeti.AlgebraicGeometry.LineBundle.Power`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackId` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackComp` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`), `TauCeti.tensorPow`, `TauCeti.tensorPowMapIso` and `TauCeti.tensorPowSuccIso` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`).'
deps = ['GLCinLean.LineBundle.pullbackTensorIso']
source = '[GLC1] §1.3.2; [GLys] §1.4.2'
