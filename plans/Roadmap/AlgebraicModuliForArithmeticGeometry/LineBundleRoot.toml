desc = 'The groupoid of n-th roots of an invertible sheaf on a scheme, with its pullback. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.LineBundle.Root'
kind = 'definition'
desc = 'For a scheme X, an invertible sheaf L on X and a natural number n, the groupoid of n-th roots of L. An object is a pair (M, φ) of an invertible sheaf M on X and an isomorphism φ : M^{⊗n} ≅ L, kept as data. An arrow (M, φ) → (M′, φ′) is an isomorphism ρ : M ≅ M′ with φ = φ′ ∘ ρ^{⊗n}. Give the pullback of roots along a map of schemes f : X′ → X, a functor from the roots of L to the roots of f^*L, with its isomorphisms for the identity map and for a composite of two maps and their coherence; the equivalence between the roots of L and the roots of L′ that an isomorphism L ≅ L′ gives; and the trivial root (𝒪, 𝒪^{⊗n} ≅ 𝒪) of 𝒪, which pullback preserves. The definition has no hypothesis on X and none on n: not n ≥ 1, and not that n is invertible on X. For n = 0 a root is an invertible sheaf M with an isomorphism 𝒪 ≅ L. The definition uses no étale sheaf, no Kummer sequence and no stack: Curves.ThetaCharacteristic uses n = 2 over every base scheme, also where 2 is not invertible. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”, as the prerequisite of the target `rootGerbe`: this groupoid with its pullback is the fibre groupoid `RootGerbe_n(L)(T)` of that target (line bundles M on T and isomorphisms `φ:M⊗n≅L|T`, with arrows ρ satisfying `φ=ψ∘ρ⊗n`), and a check of that target uses the trivial root (“The root gerbe of `O_X` is equivalent to `B_Xμn` using its trivial nth root”). `rootGerbe` assumes n > 0 invertible on X; it needs this only to prove that the roots form a gerbe (Stacks.schemeRootGerbe). In Tau Ceti at the pin: `InvertibleSheaf X` is a symmetric monoidal category (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), and M^{⊗n} is the tensor power `TauCeti.tensorPow M n` of an object of a monoidal category, with M^{⊗0} the unit of the category and M^{⊗(n+1)} = M ⊗ M^{⊗n}; so M^{⊗2} is M ⊗ (M ⊗ 𝟙). The unit and the tensor product of this category are isomorphic to `InvertibleSheaf.trivial X` and to `InvertibleSheaf.tensorProduct` by `trivialIsoTensorUnit` and `tensorProductIsoTensor`. The specified isomorphisms that exist: `TauCeti.tensorPowMapIso` gives L^{⊗n} ≅ K^{⊗n} for an isomorphism L ≅ K, compatible with identities and composition (`TauCeti.tensorPowMap_id`, `TauCeti.tensorPowMap_comp`); `InvertibleSheaf.tensorPowTrivialIso` gives 𝒪^{⊗n} ≅ 𝒪; and `InvertibleSheaf.pullbackTensorProductIso` gives f^*(M ⊗ N) ≅ f^*M ⊗ f^*N for `InvertibleSheaf.tensorProduct`, natural in each factor for isomorphisms and compatible with `pullbackId` and `pullbackComp` (`pullbackTensorProductIso_hom_naturality_left`, `pullbackTensorProductIso_hom_naturality_right`, `pullbackTensorProductIso_id`, `pullbackTensorProductIso_comp`). Pullback is the functor `InvertibleSheaf.pullback` with the natural isomorphisms `pullbackId` and `pullbackComp`. The law for the pullback of a tensor power is an existence statement (`nonempty_pullback_tensorPow_iso`). Still to do, in this order. (1) As an improvement of the existing code of `TauCeti.AlgebraicGeometry.LineBundle.Power`, the specified isomorphism f^*(L^{⊗n}) ≅ (f^*L)^{⊗n} in place of the existence statement, natural in L for isomorphisms and compatible with `pullbackId` and `pullbackComp`, built from `pullbackTensorProductIso`, the comparisons `tensorProductIsoTensor` and `trivialIsoTensorUnit`, and the isomorphism of f^*𝒪 with 𝒪. (2) The groupoid of roots, its pullback, its equivalence for an isomorphism L ≅ L′, and the trivial root. The tensor product of roots, the dual of a root and the twist of a root are not part of this node: no roadmap target needs them (LineBundle.Root.tensorProduct). Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorPowTrivialIso` (`TauCeti.AlgebraicGeometry.LineBundle.Power`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackId`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackComp` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackTensorProductIso` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `TauCeti.tensorPow`, `TauCeti.tensorPowMapIso`, `TauCeti.tensorPowMap_id` and `TauCeti.tensorPowMap_comp` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`).'
