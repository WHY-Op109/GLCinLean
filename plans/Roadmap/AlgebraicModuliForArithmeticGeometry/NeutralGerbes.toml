desc = 'Neutral banded gerbes: the equivalence with the classifying gerbe, and the self-equivalences. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.neutralGerbeEquiv'
kind = 'definition'
desc = 'For an A-banded gerbe F on a site (Stacks.abelianBandedGerbe) and an object x of F over a terminal object S of the site, y ↦ Isom(x, y) is a band-preserving equivalence from F to the classifying gerbe BA (Stacks.classifyingAbelianGerbe); its inverse twists x by a torsor, with descent. The groupoid of band-preserving self-equivalences of an A-banded gerbe that has such an object is equivalent to the groupoid of A-torsors on the site: a torsor P acts on BA by Q ↦ Q ⊗_A P, composition goes to the contracted product, and the identity goes to the trivial torsor. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”: `neutralizationEquivalence` and `neutralSelfEquivalences`. The first uses `band_morphism_equivalence` (Stacks.bandPreserving_isEquivalence). Prerequisite that is written with this node, because `neutralSelfEquivalences` needs it and Tau Ceti does not have it: the contracted product Q ⊗_A P of two torsors under a sheaf A of abelian groups on a site. It is the extension along the addition A × A → A of the product Q × P, which is a torsor under A × A; it acts on pairs of equivariant isomorphisms, so it is a functor of the two torsors; and it is associative and commutative up to specified isomorphisms, with the trivial torsor as unit. `torsorDerivedH1.add` of §4.20 uses the same contracted product. In Tau Ceti: the torsors of a sheaf of groups on a site, and the extension of one torsor along a homomorphism of sheaves of groups (`CategoryTheory.Sheaf.Torsor.map`, which takes a homomorphism and one torsor); no product of two torsors and no contracted product of two torsors. The torsors under group schemes of SchemeAndStackFoundations §§1.15–1.16 (Stacks.groupTorsor) are not used. Neither target is in Tau Ceti. Upstream declarations used: `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`), `CategoryTheory.Sheaf.Torsor.map` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Map`).'
deps = ['GLCinLean.Stacks.classifyingAbelianGerbe', 'GLCinLean.Stacks.bandPreserving_isEquivalence']
source = '[GLys] §§1.3.5–1.3.6 and 1.7.1'
