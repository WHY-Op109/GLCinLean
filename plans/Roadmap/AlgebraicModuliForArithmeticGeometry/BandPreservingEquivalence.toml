desc = 'Every band-preserving morphism of banded gerbes is an equivalence. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.bandPreserving_isEquivalence'
kind = 'theorem'
desc = 'A band-preserving morphism η : F → G of A-banded gerbes on a site (Stacks.abelianBandedGerbe) induces isomorphisms of the sheaves Isom(x, y) ≅ Isom(ηx, ηy), so every component of η is fully faithful; every component of η is essentially surjective; and η is an equivalence over the site: it has an inverse strong transformation that preserves the band, with unit and counit modifications that satisfy the triangle identities. And for an equivalence F ≃ G over the site, F is a gerbe if and only if G is. So the A-banded gerbes on a site, their band-preserving morphisms and the modifications form a 2-groupoid. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.2 “Bandings and band-preserving equivalences”: `band_morphism_full_faithful`, `band_morphism_essential_surjective` and `band_morphism_equivalence`, with `CoherentInverse.inverse` of §4.21 “Intrinsic band on slices”; and §4.1 “Gerbes and relative locality”, `IsGerbe.equivalence_iff`. For each of the four the roadmap lists a need that is not at the pin: `band_morphism_full_faithful` needs `BandedMorphism.faithful` and `BandedMorphism.locallyIsomEquiv`, which list `relativeGerbe` under their needs (Stacks.relativeGerbe); `band_morphism_essential_surjective` needs `band_morphism_full_faithful`; and `band_morphism_equivalence` and `IsGerbe.equivalence_iff` list SchemeAndStackFoundations §1.18 “Stacks in groupoids, stackification and 2-fibre products” under their needs (Stacks.stackification). The roadmap builds the carriers of its §§4.9–4.21 before these theorems (“How to read the build”). Of the four targets, Tau Ceti at the pin has `IsGerbe.equivalence_iff` with one more hypothesis: for a strong transformation F → G whose components are equivalences, if one of F and G is a gerbe and the other is a stack, then the other is a gerbe (`CategoryTheory.Pseudofunctor.isGerbe_target_of_isEquivalence`, `CategoryTheory.Pseudofunctor.isGerbe_source_of_isEquivalence` and `CategoryTheory.Pseudofunctor.isGerbe_iff_of_isEquivalence`, in `TauCeti.CategoryTheory.Sites.Descent.IsGerbe`); that the stack property passes along such a transformation is still to do. Of `band_morphism_equivalence`, Tau Ceti at the pin has the step from the components to the transformation, for pseudofunctors from any bicategory to `Cat` and with no gerbe or band: a strong transformation η : F → G whose component functors are all equivalences of categories is an equivalence in the bicategory of these pseudofunctors, their strong transformations and their modifications (`CategoryTheory.Pseudofunctor.StrongTrans.equivalenceOfIsEquivalence` (`TauCeti.CategoryTheory.Bicategory.NaturalTransformation.Cat`), with values in `CategoryTheory.Bicategory.Equivalence` (`Mathlib.CategoryTheory.Bicategory.Adjunction.Basic`)). Its inverse is a strong transformation whose components are quasi-inverses of the components of η; its unit and counit are invertible modifications whose components are the units and counits of the components; the structure states the left triangle identity, and the right one follows (`right_triangle` of the same Mathlib module). So the inverse strong transformation, the unit, the counit and the triangle identities of this node are at the pin, once the components are equivalences. Still to do for `band_morphism_equivalence`: that every component of a band-preserving morphism of A-banded gerbes is an equivalence of categories, which is `band_morphism_full_faithful` with `band_morphism_essential_surjective`; and that the inverse preserves the band, for which `CategoryTheory.Pseudofunctor.BandPreserving` (`TauCeti.CategoryTheory.Sites.Descent.Banding`) has the identity and the composite and no statement for an inverse. The targets `band_morphism_full_faithful` and `band_morphism_essential_surjective` are not in Tau Ceti. Upstream declarations used: `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `CategoryTheory.Pseudofunctor.StrongTrans.equivalenceOfIsEquivalence` (`TauCeti.CategoryTheory.Bicategory.NaturalTransformation.Cat`), `CategoryTheory.Pseudofunctor.BandPreserving` (`TauCeti.CategoryTheory.Sites.Descent.Banding`).'
deps = ['GLCinLean.Stacks.abelianBandedGerbe', 'GLCinLean.Stacks.relativeGerbe', 'GLCinLean.Stacks.stackification']
