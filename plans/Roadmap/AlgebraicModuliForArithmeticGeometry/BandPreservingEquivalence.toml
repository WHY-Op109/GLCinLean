id = 'GLCinLean.Stacks.bandPreserving_isEquivalence'
kind = 'theorem'
desc = 'A band-preserving morphism η : F → G of A-banded gerbes on a site (Stacks.abelianBandedGerbe) induces isomorphisms of the sheaves Isom(x, y) ≅ Isom(ηx, ηy), so every component of η is fully faithful; every component of η is essentially surjective; and η is an equivalence over the site: it has an inverse strong transformation that preserves the band, with unit and counit modifications that satisfy the triangle identities. And for an equivalence F ≃ G over the site, F is a gerbe if and only if G is. So the A-banded gerbes on a site, their band-preserving morphisms and the modifications form a 2-groupoid. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.2 “Bandings and band-preserving equivalences”: `band_morphism_full_faithful`, `band_morphism_essential_surjective` and `band_morphism_equivalence`, with `CoherentInverse.inverse` of §4.21 “Intrinsic band on slices”; and §4.1 “Gerbes and relative locality”, `IsGerbe.equivalence_iff`. For each of the four the roadmap lists a need that is not at the pin: `band_morphism_full_faithful` needs `BandedMorphism.faithful` and `BandedMorphism.locallyIsomEquiv`, which list `relativeGerbe` under their needs (Stacks.relativeGerbe); `band_morphism_essential_surjective` needs `band_morphism_full_faithful`; and `band_morphism_equivalence` and `IsGerbe.equivalence_iff` list SchemeAndStackFoundations §1.18 “Stacks in groupoids, stackification and 2-fibre products” under their needs (Stacks.stackification). The roadmap builds the carriers of its §§4.9–4.21 before these theorems (“How to read the build”). Of the four targets, Tau Ceti at the pin has `IsGerbe.equivalence_iff` with one more hypothesis: for a strong transformation F → G whose components are equivalences, if one of F and G is a gerbe and the other is a stack, then the other is a gerbe (`CategoryTheory.Pseudofunctor.isGerbe_target_of_isEquivalence`, `CategoryTheory.Pseudofunctor.isGerbe_source_of_isEquivalence` and `CategoryTheory.Pseudofunctor.isGerbe_iff_of_isEquivalence`, in `TauCeti.CategoryTheory.Sites.Descent.IsGerbe`); that the stack property passes along such a transformation is still to do. The other three targets are not in Tau Ceti. Upstream declarations used: `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`).'
deps = ['GLCinLean.Stacks.abelianBandedGerbe', 'GLCinLean.Stacks.relativeGerbe', 'GLCinLean.Stacks.stackification']
source = '[GLys] §1.3.6'
