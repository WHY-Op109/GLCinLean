desc = 'Banded gerbes on a site with an abelian band: the carriers, and the restriction to a slice site. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.abelianBandedGerbe'
kind = 'definition'
desc = 'A-banded gerbes on a site (C, J), for a sheaf A of abelian groups on that site: the carriers. A gerbe is a `Cat`-valued pseudofunctor F on C that is a stack for J, whose fibre categories are groupoids, that has objects locally (every U has a covering sieve with an object of F over each of its arrows), and in which every two objects over the same U are locally isomorphic. An A-banding of a gerbe F gives, for every U and every object x of F over U, an isomorphism of groups A(U) ≅ Aut(x), compatible with restriction along every V → U and with conjugation by every isomorphism x ≅ y; an A-banded gerbe is a gerbe with an A-banding. A band-preserving morphism of A-banded gerbes is a strong transformation whose components commute with the two bandings; the morphisms between two of them are the modifications, and each modification is invertible. For two objects x, y over U, the sheaf Isom(x, y) is a torsor under the restriction of A to U. A neutralization over an object S of the site is an object of F over S; this carrier is defined for every `Cat`-valued pseudofunctor F and every S. For an arrow f : V → S of the site, a neutralization x over S pulls back to the neutralization f^*x over V. F is neutral when it has a neutralization over a terminal object of the site. Provider: roadmap AlgebraicModuliForArithmeticGeometry, “Layer 4: gerbes, bands and profinite stages”: §4.1 “Gerbes and relative locality” (`IsGerbe`); §4.2 “Bandings and band-preserving equivalences” (`AbelianBanding`, `BandPreserving`, `isomTorsor`); and, of §4.3 “Neutralizations and derived classification”, the carrier `Neutralization` with `IsNeutral` and `Neutralization.pullback`. §4.24 “Signatures of the Layer 4 carriers” fixes the carriers: `F : LocallyDiscrete Cᵒᵖ ⥤ᵖ Cat`, `J : GrothendieckTopology C`, `A : Sheaf J AddCommGrpCat`, `[IsGerbe F J]`, and `Neutralization.pullback {S V : C} (f : V ⟶ S) (x : Neutralization F S) : Neutralization F V`. The needs of these targets, followed through the targets that they name, contain Mathlib and carriers of Layer 4 only: no section of SchemeAndStackFoundations and not `relativeGerbe`. In Tau Ceti at the pin: `CategoryTheory.Pseudofunctor.IsGerbe` (`TauCeti.CategoryTheory.Sites.Descent.IsGerbe`); `CategoryTheory.Pseudofunctor.AbelianBanding` and `CategoryTheory.Pseudofunctor.BandPreserving`, with the identity and the composite (`TauCeti.CategoryTheory.Sites.Descent.Banding`); for two objects x and y over the same U, the simply transitive action of A(U) on the isomorphisms from x to y, `CategoryTheory.Pseudofunctor.AbelianBanding.isomTorsor`, with its compatibility with restriction (`TauCeti.CategoryTheory.Sites.Descent.IsomTorsor`); and `CategoryTheory.Pseudofunctor.Neutralization` with `Neutralization.pullback` and `IsNeutral` (`TauCeti.CategoryTheory.Sites.Descent.Neutralization`). Still to do: the sheaf Isom(x, y) on the slice over U as a torsor under the restriction of A, a `CategoryTheory.Sheaf.Torsor`. Upstream declarations used: `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`).'
source = '[GLC1] §1.1.3; [GLys] §§1.3.2 and 1.3.6'

[[node]]
id = 'GLCinLean.Stacks.gerbeSliceRestriction'
kind = 'definition'
desc = 'The restriction of banded gerbes to a slice site. For a site (C, J), an object U of C and an A-banded gerbe F on (C, J) (Stacks.abelianBandedGerbe), the restriction of F to the slice C/U with its induced topology: its fibre over an object V → U of the slice is the fibre of F over V. It is a gerbe banded by the restriction of A to C/U. Restriction sends band-preserving morphisms to band-preserving morphisms and modifications to modifications. A neutralization of the restricted gerbe over an object V → U of the slice is a neutralization of F over V. This is the pullback of a banded gerbe that this plan uses: the sites of Stacks.EtaleGerbe are the slices of one site, so the band of the restricted gerbe is the restriction of A, with no inverse image of sheaves and no change of band. Provider: roadmap AlgebraicModuliForArithmeticGeometry, as the prerequisite of the slice targets of “Layer 4: gerbes, bands and profinite stages”, which compare a construction on the restricted gerbe with the restriction of the construction: `changeBand.slice` and `liftingGerbe.slice` (§4.20 “Derived classification on arbitrary sites”, where “for an object U the localization `C/U→C` is a morphism of sites”), and the base change of `rootGerbe` (§4.3: “`RootGerbe_n(L)×X T≃RootGerbe_n(L|T)`, respecting its band”). No target of the roadmap names the restriction itself. `classSitePullback` (§4.3) states, for a general morphism of sites, that pullback carries an A-banding to a banding by the pulled-back sheaf, and compares the classes in H²; `relativePullback` (§4.1) is the base change of a relative gerbe in a 2-cartesian square. This plan uses neither of the two. The restriction needs only Mathlib. In Tau Ceti at the pin: the restriction of a pseudofunctor to a slice site is a prestack, respectively a stack, when the pseudofunctor is (`CategoryTheory.Pseudofunctor.isPrestack_over`, `CategoryTheory.Pseudofunctor.isStack_over`, in `TauCeti.CategoryTheory.Sites.Descent.Over`). Still to do: the gerbe property and the banding of the restriction, and the restriction of band-preserving morphisms, modifications and neutralizations. Upstream declarations used: `CategoryTheory.GrothendieckTopology.over` (`Mathlib.CategoryTheory.Sites.Over`), `CategoryTheory.Over.iteratedSliceEquiv` (`Mathlib.CategoryTheory.Comma.Over.Basic`).'
deps = ['GLCinLean.Stacks.abelianBandedGerbe']
source = '[GLys] §1.3.2'
