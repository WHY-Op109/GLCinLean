desc = 'The change of band of a banded gerbe along a homomorphism of sheaves of abelian groups. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.gerbeChangeOfBand'
kind = 'definition'
desc = 'For a homomorphism u : A → B of sheaves of abelian groups on a site and an A-banded gerbe F (Stacks.abelianBandedGerbe), the B-banded gerbe u_*F with its u-compatible morphism F → u_*F. Composition with F → u_*F is an equivalence from the groupoid of band-preserving morphisms u_*F → G to the groupoid of u-compatible morphisms F → G, for every B-banded gerbe G. There are equivalences v_*(u_*F) ≃ (v ∘ u)_*F and id_*F ≃ F, with their coherence; u_* acts on band-preserving morphisms and on modifications; and u_* commutes with the restriction to a slice site (`CategoryTheory.Pseudofunctor.over` of Tau Ceti, with the restricted banding). Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”, `changeBand`, with its API in §4.20 “Derived classification on arbitrary sites”: `changeBand.unit`, `changeBand.compose`, `changeBand.slice`, `changeBand.map`, `changeBand.mapModification`, `changeBand.band`, `changeBand.isGerbe`. The target replaces each torsor Isom(x, y) by its contracted product with B and applies the stackification of SchemeAndStackFoundations §1.18 (Stacks.stackification). The target is not in Tau Ceti. The restriction of a banded gerbe to a slice site is in Tau Ceti at the pin. For an object U of the site, `CategoryTheory.Pseudofunctor.over` (`TauCeti.CategoryTheory.Bicategory.Functor.LocallyDiscrete`) is the restriction F.over U of a `Cat`-valued pseudofunctor F to the slice C/U: its fibre over V → U is the fibre of F over V. It is a stack and a gerbe for the induced topology `J.over U` when F is one for J (the instances `CategoryTheory.Pseudofunctor.isStack_over` (`TauCeti.CategoryTheory.Sites.Descent.Over`) and `CategoryTheory.Pseudofunctor.isGerbe_over` (`TauCeti.CategoryTheory.Sites.Descent.IsGerbe`)). An A-banding b of F restricts to the banding `b.over U` of F.over U by the restriction `A.over U` of A, which is the Mathlib sheaf `CategoryTheory.Sheaf.over` (`Mathlib.CategoryTheory.Sites.Over`); the restriction of a band-preserving morphism is band-preserving for the restricted bandings (`CategoryTheory.Pseudofunctor.AbelianBanding.over` and the instance `CategoryTheory.Pseudofunctor.BandPreserving.over` (`TauCeti.CategoryTheory.Sites.Descent.Banding`)). Morphisms and modifications restrict by the precomposition pseudofunctor `CategoryTheory.Pseudofunctor.precomp` (`TauCeti.CategoryTheory.Bicategory.FunctorBicategory.Precomp`) at the functor that forgets the map to U, so restriction keeps identities and composites up to its coherence isomorphisms. The neutralizations of F.over U over V → U are the neutralizations of F over V, by the equivalence `CategoryTheory.Pseudofunctor.Neutralization.overEquiv`, which commutes with pullback (`TauCeti.CategoryTheory.Sites.Descent.Neutralization`). Upstream declarations used: `CategoryTheory.Sheaf.Torsor.map` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`), `CategoryTheory.Pseudofunctor.over` (`TauCeti.CategoryTheory.Bicategory.Functor.LocallyDiscrete`), `CategoryTheory.Pseudofunctor.isStack_over` (`TauCeti.CategoryTheory.Sites.Descent.Over`), `CategoryTheory.Pseudofunctor.isGerbe_over` (`TauCeti.CategoryTheory.Sites.Descent.IsGerbe`), `CategoryTheory.Pseudofunctor.AbelianBanding.over` and `CategoryTheory.Pseudofunctor.BandPreserving.over` (`TauCeti.CategoryTheory.Sites.Descent.Banding`), `CategoryTheory.Pseudofunctor.precomp` (`TauCeti.CategoryTheory.Bicategory.FunctorBicategory.Precomp`), `CategoryTheory.Pseudofunctor.Neutralization.overEquiv` (`TauCeti.CategoryTheory.Sites.Descent.Neutralization`), `CategoryTheory.Sheaf.over` (`Mathlib.CategoryTheory.Sites.Over`).'
deps = ['GLCinLean.Stacks.abelianBandedGerbe', 'GLCinLean.Stacks.stackification']
source = '[GLys] §§1.3.1–1.3.2'
