desc = 'The change of band of a banded gerbe along a homomorphism of sheaves of abelian groups. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.Stacks.gerbeChangeOfBand'
kind = 'definition'
desc = 'For a homomorphism u : A → B of sheaves of abelian groups on a site and an A-banded gerbe F (Stacks.abelianBandedGerbe), the B-banded gerbe u_*F with its u-compatible morphism F → u_*F. Composition with F → u_*F is an equivalence from the groupoid of band-preserving morphisms u_*F → G to the groupoid of u-compatible morphisms F → G, for every B-banded gerbe G. There are equivalences v_*(u_*F) ≃ (v ∘ u)_*F and id_*F ≃ F, with their coherence; u_* acts on band-preserving morphisms and on modifications; and u_* commutes with the restriction to a slice site (Stacks.gerbeSliceRestriction). Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”, `changeBand`, with its API in §4.20 “Derived classification on arbitrary sites”: `changeBand.unit`, `changeBand.compose`, `changeBand.slice`, `changeBand.map`, `changeBand.mapModification`, `changeBand.band`, `changeBand.isGerbe`. The target replaces each torsor Isom(x, y) by its contracted product with B and applies the stackification of SchemeAndStackFoundations §1.18 (Stacks.stackification). The target is not in Tau Ceti. Upstream declarations used: `CategoryTheory.Sheaf.Torsor.map` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`).'
deps = ['GLCinLean.Stacks.abelianBandedGerbe', 'GLCinLean.Stacks.gerbeSliceRestriction', 'GLCinLean.Stacks.stackification']
source = '[GLys] §§1.3.1–1.3.2'
