desc = 'The isomorphism between the pullback of a tensor product of invertible sheaves and the tensor product of the pullbacks. Owner: the Tau Ceti roadmap AlgebraicModuliForArithmeticGeometry.'

[[node]]
id = 'GLCinLean.LineBundle.pullbackTensorIso'
kind = 'definition'
desc = 'For a map of schemes f : X → Y and invertible sheaves M and N on Y, the isomorphism f^*(M ⊗ N) ≅ f^*M ⊗ f^*N of invertible sheaves on X, natural in M and in N, and compatible with the isomorphisms `pullbackId` and `pullbackComp` for the identity map and for a composite of two maps. This node is the one owner of this isomorphism: LineBundle.Root uses it for the pullback of roots, and LineBundle.picardGroupoid uses it as the tensor comparison of the pullback functor and adds its compatibility with the associativity, unit and symmetry isomorphisms. Provider: roadmap AlgebraicModuliForArithmeticGeometry, §4.3 “Neutralizations and derived classification”, as a prerequisite of the target `rootGerbe` (the pullback of a root (M, φ) along T′ → T needs (f^*M)^{⊗n} ≅ f^*(M^{⊗n})); it is an improvement of the existing code of `TauCeti.AlgebraicGeometry.LineBundle.Functoriality`, which has the statement for classes only. In Tau Ceti: `AlgebraicGeometry.Scheme.Modules.pullbackToModulesMonoidal` says that the pullback of module sheaves, restricted to the quasicoherent sheaves on Y (the composite of the inclusion `QuasicoherentSheaf Y ⥤ Y.Modules` with `Scheme.Modules.pullback f`), is strong monoidal; an invertible sheaf is quasicoherent (`InvertibleSheaf.isQuasicoherent_obj`), so the comparison δ of the pullback at two invertible sheaves is an isomorphism. The proof of `LineBundleClass.pullback_mul` builds the isomorphism of the underlying module sheaves from this comparison and `InvertibleSheaf.tensorProductObjIso`, and keeps only its existence. Still to do: this isomorphism as a named isomorphism of invertible sheaves, its naturality, and its compatibility with `pullbackId` and `pullbackComp`; `LineBundleClass.pullback_mul` then follows from it. Upstream declarations used: `AlgebraicGeometry.Scheme.Modules.pullbackToModulesMonoidal` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Monoidal.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.isQuasicoherent_obj` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductObjIso` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackId`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackComp` and `TauCeti.AlgebraicGeometry.LineBundleClass.pullback_mul` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`).'
source = '[GLys] §1.4.2'
