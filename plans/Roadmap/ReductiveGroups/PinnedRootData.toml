desc = 'Pinned data of a reductive group, the existence of pinnings, its root datum and based root datum, and the cocharacter 2ρ. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Groups.pinnedData'
kind = 'definition'
desc = 'A reductive group with pinning yields its Borel B, torus T, unipotent radical N, simple roots and normalized simple root characters. Provider: roadmap ReductiveGroups, 8.2 “Pinnings”, with the unipotent radical and root characters of “Layer 5: solvable and unipotent groups; the unipotent radical” and “Layer 7: structure theory”. In Tau Ceti: the torus and the Borel subgroup are the fields `torus` and `borel` of `TauCeti.Pinning`, and the root vectors are `Pinning.rootVector`, defined from its field `rootSpaceEquiv`. `TauCeti.FiniteTypeCommHopfAlgCat.unipotentRadical` (`TauCeti.Algebra.AlgebraicGroup.Unipotent.Radical.Construction`) is the unipotent radical of a finite-type affine group over a field. N is the unipotent radical of the Borel subgroup B; the unipotent radical of the reductive group itself is trivial. The positive and simple roots of T and B are `TauCeti.SplitMaximalTorus.IsPositiveRoot` and `TauCeti.SplitMaximalTorus.IsSimpleRoot` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`); they are determined by T and B. Also at the pin: the criterion `TauCeti.FiniteTypeCommHopfAlgCat.isIso_productMapOfNormal_unipotentRadical_of_torus` (`TauCeti.Algebra.AlgebraicGroup.Unipotent.Radical.Torus.Complement`), by which a connected group over an algebraically closed field is the semidirect product of its unipotent radical and a large enough torus, and, for GL only, the upper unitriangular group as a unipotent radical. No declaration at the pin gives N for a pinning. Still to do: N as the unipotent radical of B, with B = N ⋊ T and the Lie algebra of N the sum of the positive root spaces (the item `pinning-borel-unipotent-radical` of `docs/worker-targets/targets.md`), and the normalized simple root characters N → 𝔾ₐ (the item `pinning-simple-root-characters`), which need the root subgroups that the items toward Groups.rootDatum construct. Upstream declarations used: `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`), `TauCeti.SplitMaximalTorus` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`), `TauCeti.SplitMaximalTorus.IsSimpleRoot` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
source = '[GLC1] §§1.3.1–1.3.6'

[[node]]
id = 'GLCinLean.Groups.twoRho'
kind = 'definition'
desc = 'Realize the positive-coroot sum as an actual cocharacter of the specified group torus, using TauCeti.twoWeylVector on the flipped extracted datum; prove the root-character comparison needed by the Whittaker twist. Do not redefine the abstract root sum. Provider: roadmap ReductiveGroups, “Layer 7: structure theory” (the item “Root datum”, for the cocharacter lattice and the coroots) and Layer 7C, 7C.3, which uses the cocharacter `2ρ∨ = ∑_{β>0} β∨` of the maximal torus. In Tau Ceti at the pin: the sum of the positive coroots of a root pairing as a cocharacter, `RootPairing.twoWeylCocharacter`, with its pairing with a root and its composite with a character on points (`pairing_ofAdd_root_twoWeylCocharacter`, `charPoints_comp_cocharPoints_twoWeylCocharacter`), in `TauCeti.Algebra.AlgebraicGroup.SplitTorus.RootDatum.TwoWeylCocharacter`. Still to do: its application to the root datum of the group (Groups.rootDatum), which is not at the pin. Upstream declarations used: `RootPairing.Base` (`Mathlib.LinearAlgebra.RootSystem.Base`), `TauCeti.twoWeylVector` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Vector`).'
deps = ['GLCinLean.Groups.pinnedData', 'GLCinLean.Groups.rootDatum']
source = '[GLC1] §§1.3.4–1.3.6'

[[node]]
id = 'GLCinLean.Groups.pinning_exists'
kind = 'theorem'
desc = 'Every split connected reductive group over a field admits a pinning for some torus rank: a split maximal torus, a Borel subgroup containing it and chosen simple root vectors. Over an algebraically closed field every connected reductive group is split, so it admits one. Construct actual witnesses, including a positive-rank example. Provider: roadmap ReductiveGroups, “Layer 9D: classification, relative groups and forms”, to which 8.2 “Pinnings” leaves the existence of pinnings. In Tau Ceti at the pin: positive-rank witnesses over every nontrivial commutative ring with connected prime spectrum, the standard pinnings `TauCeti.GeneralLinear.standardPinning` (`TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Pinning.Basic`), `TauCeti.SpecialLinear.standardPinning` (`TauCeti.Algebra.AlgebraicGroup.SpecialLinear.Pinning.Basic`) and `TauCeti.Symplectic.standardPinning` (`TauCeti.Algebra.AlgebraicGroup.Symplectic.Pinning.Basic`); and, over an algebraically closed field, the ingredients `TauCeti.HopfIdeal.exists_isMaximalTorus` (`TauCeti.Algebra.AlgebraicGroup.Torus.Existence`), `TauCeti.HopfIdeal.IsMaximalTorus.exists_isBorelOverAlgClosed_le` (`TauCeti.Algebra.AlgebraicGroup.Borel.Torus`) and `TauCeti.SplitMaximalTorus.ofSurjective` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`). Still to do (item `pinning-exists`): the general theorem, through the passage from `IsBorelOverAlgClosed` to the `IsBorelOver` that `TauCeti.Pinning` asks for (no lemma at the pin was found), the passage from a maximal torus to a `TauCeti.SplitMaximalTorus`, the simple root spaces free of rank one, and the descent of a Borel subgroup over a field that is not algebraically closed; and the rank-zero pinning of the trivial group. Upstream declarations used: `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`), `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`).'
source = '[GLC2] §0.4.1; [GLC1] §1.3.6'

[[node]]
id = 'GLCinLean.Groups.rootDatum'
kind = 'definition'
desc = 'Extract the integral UNBASED root datum of a reductive group with a specified split maximal torus; roots and coroots come from its actual adjoint action. No choice of Borel or pinning is erased. Provider: roadmap ReductiveGroups, “Layer 7: structure theory” (the item “Root datum”) and “Layer 8: split groups and pinnings”. `AbsoluteRootData` of roadmap ReductiveGroupsPartII (RG2.1.2) restates this root datum for the valued theory; that roadmap names ReductiveGroups as its owner. In Tau Ceti at the pin, only ingredients: the roots as characters, `Derivation.nontrivialAdjointWeights` and `Derivation.adjointWeightSpace` (`TauCeti.Algebra.AlgebraicGroup.Tangent.RootSpace`); the pairing of characters and cocharacters `TauCeti.SplitTorus.dotPairing` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Cocharacter`); the Weyl group of a torus and its action on the roots, `BialgHom.weylGroup` and `BialgHom.weylGroupRootPerm` (`TauCeti.Algebra.AlgebraicGroup.DiagonalizableGroup.Normalizer.WeylGroup`); and the centralizer of the kernel of a character, `TauCeti.SplitMaximalTorus.centralizerKerHopfIdeal` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.KernelCentralizer`). Still to do: the coroots and reflections of the group, the `RootDatum`, its reducedness and its compatibility with isomorphisms: the chain of items of ReductiveGroups in `docs/worker-targets/targets.md` that ends with `root-datum-of-split-maximal-torus`. Upstream declarations used: `RootDatum` (`Mathlib.LinearAlgebra.RootSystem.Defs`), `TauCeti.SplitMaximalTorus` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
source = '[ConradRGS] §5.1; [GLC1] §0.1.1'

[[node]]
id = 'GLCinLean.Groups.basedRootDatum'
kind = 'definition'
desc = 'The integral root datum of the torus in a specified pinning, with its base of simple roots; expose the exact character and cocharacter lattices and base support. Provider: roadmap ReductiveGroups, “Layer 7: structure theory” (the item “Root datum”) and “Layer 8: split groups and pinnings”. `AbsoluteRootData` of roadmap ReductiveGroupsPartII (RG2.1.2) restates this root datum for the valued theory; that roadmap names ReductiveGroups as its owner. In Tau Ceti at the pin: the positive and simple roots of a torus and a Borel subgroup, `TauCeti.SplitMaximalTorus.IsPositiveRoot` and `TauCeti.SplitMaximalTorus.IsSimpleRoot` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`); the simple root spaces of a pinning, indexed by the simple roots (the field `rootSpaceEquiv` of `TauCeti.Pinning`); their transport along an isomorphism, `TauCeti.Pinning.comapOfIso` and `TauCeti.Pinning.isSimpleRoot_comapOfIso_iff` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`); and for GL the base of the diagonal roots `TauCeti.GeneralLinear.diagonalRootBase` (`TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Root.Base`) with the consecutive numbering of the simple roots of the standard pinning `TauCeti.GeneralLinear.standardPinningSimpleRootEquiv` (`TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Pinning.Basic`). Still to do, both after Groups.rootDatum: the simple roots of B as a `RootPairing.Base` of the root datum (item `borel-positive-system`), and the based root datum of a pinning with the comparison of the index sets (item `pinning-based-root-datum`). Upstream declarations used: `RootPairing.Base` (`Mathlib.LinearAlgebra.RootSystem.Base`).'
deps = ['GLCinLean.Groups.rootDatum', 'GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.1; [GLC1] §1.3.6'
