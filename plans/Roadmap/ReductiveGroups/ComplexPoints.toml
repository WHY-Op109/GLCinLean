desc = 'Classical complex points of a C-scheme locally of finite type. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Constructible.ComplexPoints'
kind = 'definition'
desc = 'For a scheme Y locally of finite type over C, the set Y(C) with the classical (analytic) topology, functorial in Y and locally compact. It is Hausdorff when Y is separated; the line with a doubled origin is a scheme of finite type whose space is not. Closed and open embeddings go to closed and open embeddings, and proper maps of separated schemes to proper maps of spaces. Provider: roadmap ReductiveGroups, Layer 3A.5c “Classical complex points”, with the general comparisons of 3A.5b. In Tau Ceti, for the points of a scheme over `Spec k` in a local topological `k`-algebra with open units and continuous inversion on the units (ℂ is one): the carrier and its topology `TauCeti.SchemePointTopology.Points` and `TauCeti.SchemePointTopology.topology` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Basic`); functoriality `map`, `continuous_map`, `map_id`, `map_map` and `isOpenEmbedding_of_isOpenImmersion` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Functoriality`); `isClosedEmbedding_of_isClosedImmersion` (`TauCeti.Topology.Algebra.PointTopology.Scheme.ClosedImmersion`); `t2Space_of_isSeparated` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Separation`); `locallyCompactSpace_of_locallyOfFiniteType` (`TauCeti.Topology.Algebra.PointTopology.Scheme.LocallyCompact`); and the points of a fibre product, `pointsHomeomorphOfIsPullback` (`TauCeti.Topology.Algebra.PointTopology.Scheme.FiberProduct`). Still to do: the specialization to `k = R = ℂ` as a functor to topological spaces, proper maps of separated schemes go to proper maps of spaces, and the example of the line with a doubled origin. Upstream declarations used: `TauCeti.SchemePointTopology.topology` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Basic`), `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`).'
source = '[HottaTakeuchiTanisaki] Chapter 4 (analytic spaces attached to schemes)'
