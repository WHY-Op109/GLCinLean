desc = 'Classical complex points of a C-scheme locally of finite type. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Constructible.ComplexPoints'
kind = 'definition'
desc = 'For a scheme Y locally of finite type over C, the set Y(C) with the classical (analytic) topology, functorial in Y and locally compact. It is Hausdorff when Y is separated; the line with a doubled origin is a scheme of finite type whose space is not. Closed and open embeddings go to closed and open embeddings, and proper maps of separated schemes to proper maps of spaces. Provider: roadmap ReductiveGroups, Layer 3A.5c “Classical complex points”, with the general comparisons of 3A.5b. In Tau Ceti, for the points of a scheme over `Spec k` in a local topological `k`-algebra with open units and continuous inversion on the units (ℂ is one): the carrier, its topology and the map of points, `TauCeti.SchemePointTopology.Points`, `TauCeti.SchemePointTopology.topology` and `TauCeti.SchemePointTopology.map` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Basic`); functoriality `continuous_map`, `map_id`, `map_map` and `isOpenEmbedding_of_isOpenImmersion` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Functoriality`); `isClosedEmbedding_of_isClosedImmersion` (`TauCeti.Topology.Algebra.PointTopology.Scheme.ClosedImmersion`); `t2Space_of_isSeparated` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Separation`); `locallyCompactSpace_of_locallyOfFiniteType` (`TauCeti.Topology.Algebra.PointTopology.Scheme.LocallyCompact`); the points of a fibre product, `pointsHomeomorphOfIsPullback` (`TauCeti.Topology.Algebra.PointTopology.Scheme.FiberProduct`); and the item of 3A.5c on the reduction, with no hypothesis of finite type or separation: the closed immersion of the reduction of the scheme gives a bijection on the points in every reduced `k`-algebra, and a homeomorphism when the reduced algebra is a local topological `k`-algebra as above (ℂ is one), `TauCeti.SchemePointTopology.reductionEquiv` and `TauCeti.SchemePointTopology.reductionHomeomorph` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Reduction`). Also at the pin: the points as a functor from the schemes over `Spec k` to topological spaces, `TauCeti.SchemePointTopology.pointsFunctor` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Functor`); for a field K whose points of every projective space are compact (ℂ is one), a scheme that is projective over a K-algebra A has a proper map of K-points to the K-points of Spec A, and the K-points of a projective K-scheme are compact, `TauCeti.SchemePointTopology.isProperMap_map_of_isProjectiveOver` and `TauCeti.SchemePointTopology.compactSpace_of_isProjectiveOver` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Projective.Basic`); a thickening induces a homeomorphism of points, `TauCeti.SchemePointTopology.homeomorphOfIsThickening` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Thickening`); and the case of Chow’s lemma over a Noetherian affine base, `TauCeti.AlgebraicGeometry.exists_projectiveModification` (`TauCeti.AlgebraicGeometry.Chow`). Still to do: proper maps of schemes locally of finite type over ℂ go to proper maps of spaces, and the example of the line with a doubled origin. For proper maps, 3A.5c names a route and its inputs: Chow’s lemma (roadmap SchemeAndStackFoundations, §4.12), applied over affine opens of finite type of the base, the projective geometry of §0.3 of that roadmap, and the compactness of the complex points of projective space. Upstream declarations used: `TauCeti.SchemePointTopology.topology` (`TauCeti.Topology.Algebra.PointTopology.Scheme.Basic`), `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`).'
source = '[HottaTakeuchiTanisaki] Chapter 4 (analytic spaces attached to schemes)'
