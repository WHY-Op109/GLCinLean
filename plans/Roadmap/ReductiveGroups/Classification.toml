desc = 'Existence and isomorphism theorems for split reductive groups. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Groups.splitReductiveGroup'
kind = 'definition'
desc = 'For a reduced root datum, the pinned split connected reductive group scheme over ℤ with that root datum and its base change to any ring, in particular k (existence); the isomorphism theorem: pinned isomorphisms between two such groups correspond bijectively to isomorphisms of their based root data; and the isogeny theorem: central isogenies correspond to isogenies of root data. Provider: roadmap ReductiveGroups, Layers 9A–9B (the Chevalley construction) and Layer 9D “classification, relative groups and forms”.'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.3 and Theorems 6.1.16–6.1.17'
