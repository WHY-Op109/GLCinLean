desc = 'Existence, isomorphism and isogeny theorems for split reductive groups. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Groups.splitReductiveGroup'
kind = 'definition'
desc = 'For a reduced root datum, the pinned split connected reductive group scheme over ℤ with that root datum and its base change to any ring, in particular k (existence); the isomorphism theorem: pinned isomorphisms between two such groups correspond bijectively to isomorphisms of their based root data; and the isogeny theorem over a nonempty base S: an isogeny compatible with the splittings induces a p(S)-morphism of the root data ([ConradRGS] Definition 6.1.8; over a base of characteristic zero these are the isogenies of root data, with all exponents 1), every p(S)-morphism comes from such an isogeny, unique up to the action of (T/Z_G)(S), and the isogeny is central exactly when all exponents are 1 (Example 6.1.9). Provider: roadmap ReductiveGroups, Layers 9A–9B (the Chevalley construction) and Layer 9D “classification, relative groups and forms”. In Tau Ceti at the pin: the Chevalley group schemes over ℤ of the valid Dynkin types, `TauCeti.DynkinType.ChevalleyDatum.groupScheme` (`TauCeti.Algebra.AlgebraicGroup.Chevalley.Datum`) and the simply connected `TauCeti.DynkinType.chevalleyGroupScheme` with its torus `TauCeti.DynkinType.chevalleyTorus` (`TauCeti.Algebra.AlgebraicGroup.Chevalley.SimplyConnected`). By their module doc comments they are semisimple, so they have no central torus; the torus is a morphism of group schemes and not a `TauCeti.SplitMaximalTorus`, and there is no pinning. Rigidity of root systems, not of root data with a central torus: `TauCeti.nonempty_equiv_of_hasCartanType` (`TauCeti.LinearAlgebra.RootSystem.Isomorphism`) and `RootPairing.Base.equivOfCartanMatrixEq` (`Mathlib.LinearAlgebra.RootSystem.CartanMatrix`). Transport and base change of the parts of a pinning: `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`), `TauCeti.SplitMaximalTorus.baseChange` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`) and `TauCeti.HopfIdeal.IsBorelOver.baseChange` (`TauCeti.Algebra.AlgebraicGroup.Borel.Over`); the invariance of the roots under base change, `Derivation.nontrivialAdjointWeights_baseChange` (`TauCeti.Algebra.AlgebraicGroup.Tangent.RootSpace.BaseChange`), asks for a faithfully flat map, which ℤ → k is not. Still to do: the existence theorem, the base change of a pinning (item `pinning-base-change`), the isomorphism theorem and the isogeny theorem (item `split-reductive-existence-isomorphism-isogeny`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.3 and Theorems 6.1.16–6.1.17'

[[node]]
id = 'GLCinLean.Groups.SimplyConnectedCover'
kind = 'definition'
desc = 'The simply connected central cover of the derived group of a split connected reductive group: the split semisimple group whose root datum has the coroot lattice as cocharacter lattice, with its central isogeny onto the derived group, satisfying TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty. Compute the root datum of the derived group G_der (`TauCeti.CommHopfAlgCat.derivedGroupScheme`): its roots and coroots are those of G, and its cocharacter lattice is X_*(T) ∩ ℚ-span of the coroots. Then the existence and isogeny theorems (Groups.splitReductiveGroup) give G_sc and the central isogeny G_sc → G_der from the inclusion of the coroot lattice. The pair (G_sc, G_sc → G_der) is unique up to a unique isomorphism over G_der. Provider: roadmap ReductiveGroups, Layer 9D “classification, relative groups and forms” (central isogenies, the isogeny theorem, simply connected forms). Upstream declarations used: `TauCeti.CommHopfAlgCat.derivedGroupScheme` (`TauCeti.Algebra.AlgebraicGroup.Derived.Basic`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`), `TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty` (`TauCeti.Algebra.AlgebraicGroup.SimplyConnected.Basic`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.splitReductiveGroup']
source = '[ConradRGS] Exercise 6.5.2 (i); Theorem 6.1.16 (the isogeny and existence theorems, applied to the coroot-lattice root datum) and Example 6.1.9 (central isogenies); Theorem 6.1.17 for uniqueness'
