desc = 'Existence, isomorphism and isogeny theorems for split reductive groups. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Groups.splitReductiveGroup'
kind = 'definition'
desc = 'For a reduced root datum, the pinned split connected reductive group scheme over ℤ with that root datum and its base change to any ring, in particular k (existence); and the isomorphism theorem: for two pinned split connected reductive groups over one nonempty base, in particular over k, the pinned isomorphisms between them correspond bijectively to the isomorphisms of their based root data. The two groups of the isomorphism theorem are any pinned split groups: they need not be given as base changes of the groups over ℤ. A pinned split group over a base is as in the roadmap’s 8.1 and 8.2: its split maximal torus with the identification T ≃ D_S(M) for a finite free lattice M, roots and coroots that are constant sections of M and of its dual, root spaces free of rank one, and a pinning with one constant positive system; an isomorphism of pinned split groups is compatible with these identifications and with the pinnings. So over a disconnected base an isomorphism that changes the datum from one component to another is not one of them. The base is nonempty: over the empty base the root datum cannot be recovered. The root-free data and the data of rank zero are included. Over a nonempty connected affine base the pinning is a `TauCeti.Pinning`; the plan uses the theorem over the field k. Together the two theorems say that the functor from the pinned split reductive groups to the based root data, with isomorphisms as morphisms, is an equivalence ([ConradRGS] Theorem 6.1.17). The isogeny theorem is the node Groups.exists_isogeny_of_rootPairingIsogeny. Provider: roadmap ReductiveGroups, Layers 9A–9B (the Chevalley construction; its §9B.3 “Pinned comparison” compares the groups over ℤ only) and Layer 9D “classification, relative groups and forms” (the isomorphism and existence theorems, the first for arbitrary pinned split groups). In Tau Ceti at the pin: the Chevalley group schemes over ℤ of the valid Dynkin types, `TauCeti.DynkinType.ChevalleyDatum.groupScheme` (`TauCeti.Algebra.AlgebraicGroup.Chevalley.Datum`) and the simply connected `TauCeti.DynkinType.chevalleyGroupScheme` with its torus `TauCeti.DynkinType.chevalleyTorus` (`TauCeti.Algebra.AlgebraicGroup.Chevalley.SimplyConnected`). By their module doc comments they are semisimple, so they have no central torus; the torus is a morphism of group schemes and not a `TauCeti.SplitMaximalTorus`, and there is no pinning. Rigidity of root systems, not of root data with a central torus: `TauCeti.nonempty_equiv_of_hasCartanType` (`TauCeti.LinearAlgebra.RootSystem.Isomorphism`) and `RootPairing.Base.equivOfCartanMatrixEq` (`Mathlib.LinearAlgebra.RootSystem.CartanMatrix`). Transport and base change of the parts of a pinning: `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`), `TauCeti.SplitMaximalTorus.baseChange` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`) and `TauCeti.HopfIdeal.IsBorelOver.baseChange` (`TauCeti.Algebra.AlgebraicGroup.Borel.Over`); the invariance of the roots under base change, `Derivation.nontrivialAdjointWeights_baseChange` (`TauCeti.Algebra.AlgebraicGroup.Tangent.RootSpace.BaseChange`), asks for a faithfully flat map, which ℤ → k is not. Still to do: the group over ℤ of a root datum with its central torus and its pinning (the roadmap’s §§9A–9B; the target list has no item for it yet), the base change of a pinning (item `pinning-base-change`), the comparison of the root datum of the base change with the input datum (item `split-reductive-root-datum-comparison`), and the isomorphism theorem for any two pinned groups over a field (items `pinned-isomorphism-unique` and `pinned-isomorphism-exists`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.3 and Theorems 6.1.16(2), 6.1.17'

[[node]]
id = 'GLCinLean.Groups.exists_isogeny_of_rootPairingIsogeny'
kind = 'theorem'
desc = 'The isogeny theorem for split reductive groups over a nonempty base S, each with its split maximal torus: an isogeny compatible with the splittings induces a p(S)-morphism of the root data ([ConradRGS] Definition 6.1.8; over a base of characteristic zero these are the isogenies of root data, with all exponents 1), every p(S)-morphism comes from such an isogeny, unique up to the action of (T/Z_G)(S), and the isogeny is central exactly when all exponents are 1 (Example 6.1.9). The plan uses it in Groups.SimplyConnectedCover, for central isogenies over a field of characteristic zero. Provider: roadmap ReductiveGroups, Layer 9D “classification, relative groups and forms” (central isogenies and the isogeny theorem), with §9B.2 “Central quotients and realizations” for the central isogenies of the groups over ℤ. In Tau Ceti at the pin, the two notions that the theorem relates: isogenies and central isogenies of affine group schemes, `TauCeti.CommHopfAlgCat.IsIsogeny` and `TauCeti.CommHopfAlgCat.IsCentralIsogeny` (`TauCeti.Algebra.AlgebraicGroup.Isogeny.Basic`), and the isogenies of root pairings with an exponent at each root, `TauCeti.RootPairingIsogeny` (`TauCeti.LinearAlgebra.RootSystem.Isogeny.Basic`), which become morphisms of root pairings when all exponents are 1 (`TauCeti.RootPairingIsogeny.toHom`); that structure does not ask that the exponents are powers of one prime. Its weight map goes from the weight lattice of its first root pairing to that of its second, so the isogeny of root pairings that an isogeny G′ → G induces goes from the root pairing of G to that of G′. The pin has no theorem that relates the two notions for a split reductive group: it has no root datum of a group, and it uses `TauCeti.RootPairingIsogeny` for the special isogenies of the types B₂, G₂ and F₄. Also at the pin: an isogeny with étale kernel identifies the adjoint weight spaces, `TauCeti.CommHopfAlgCat.IsIsogeny.adjointWeightSpaceEquivOfEtaleKernel` (`TauCeti.Algebra.AlgebraicGroup.Isogeny.RootSpace`). Still to do: the root pairing isogeny induced by an isogeny of split groups, which needs Groups.rootDatum, and the theorem (item `split-reductive-isogeny`). Over a field of characteristic zero the central case follows from the isomorphism theorem of Groups.splitReductiveGroup and the quotient by a finite central subgroup of the torus. Upstream declarations used: `TauCeti.CommHopfAlgCat.IsIsogeny` and `TauCeti.CommHopfAlgCat.IsCentralIsogeny` (`TauCeti.Algebra.AlgebraicGroup.Isogeny.Basic`), `TauCeti.RootPairingIsogeny` (`TauCeti.LinearAlgebra.RootSystem.Isogeny.Basic`).'
deps = ['GLCinLean.Groups.rootDatum', 'GLCinLean.Groups.splitReductiveGroup']
source = '[ConradRGS] Definition 6.1.8, Example 6.1.9 and Theorem 6.1.16(1)'

[[node]]
id = 'GLCinLean.Groups.SimplyConnectedCover'
kind = 'definition'
desc = 'The simply connected central cover of the derived group of a split connected reductive group: the split semisimple group whose root datum has the coroot lattice as cocharacter lattice, with its central isogeny onto the derived group, satisfying TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty. Compute the root datum of the derived group G_der (`TauCeti.CommHopfAlgCat.derivedGroupScheme`): its roots and coroots are those of G, and its cocharacter lattice is X_*(T) ∩ ℚ-span of the coroots. Then the existence theorem (Groups.splitReductiveGroup) gives G_sc, and the isogeny theorem (Groups.exists_isogeny_of_rootPairingIsogeny) gives the central isogeny G_sc → G_der from the inclusion of the coroot lattice. The pair (G_sc, G_sc → G_der) is unique up to a unique isomorphism over G_der. Provider: roadmap ReductiveGroups, Layer 9D “classification, relative groups and forms” (central isogenies, the isogeny theorem, simply connected forms). Upstream declarations used: `TauCeti.CommHopfAlgCat.derivedGroupScheme` (`TauCeti.Algebra.AlgebraicGroup.Derived.Basic`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`), `TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty` (`TauCeti.Algebra.AlgebraicGroup.SimplyConnected.Basic`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.splitReductiveGroup', 'GLCinLean.Groups.exists_isogeny_of_rootPairingIsogeny']
source = '[ConradRGS] Exercise 6.5.2 (i); Theorem 6.1.16 (the isogeny and existence theorems, applied to the coroot-lattice root datum) and Example 6.1.9 (central isogenies); Theorem 6.1.17 for uniqueness'
