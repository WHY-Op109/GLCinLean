desc = 'Existence, isomorphism and isogeny theorems for split reductive groups. Owner: the Tau Ceti roadmap ReductiveGroups.'

[[node]]
id = 'GLCinLean.Groups.splitReductiveGroup'
kind = 'definition'
desc = 'For a reduced root datum, the pinned split connected reductive group scheme over ℤ with that root datum and its base change to any ring, in particular k (existence); the isomorphism theorem: pinned isomorphisms between two such groups correspond bijectively to isomorphisms of their based root data; and the isogeny theorem: isogenies compatible with the splittings induce isogenies of the root data, and every isogeny of root data comes from one, unique up to the action of (T/Z_G)(S). Provider: roadmap ReductiveGroups, Layers 9A–9B (the Chevalley construction) and Layer 9D “classification, relative groups and forms”.'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.3 and Theorems 6.1.16–6.1.17'

[[node]]
id = 'GLCinLean.Groups.SimplyConnectedCover'
kind = 'definition'
desc = 'The simply connected central cover of the derived group of a split connected reductive group: the split semisimple group whose root datum has the coroot lattice as cocharacter lattice, with its central isogeny onto the derived group, satisfying TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty. Compute the root datum of the derived group G_der (`TauCeti.CommHopfAlgCat.derivedGroupScheme`): its roots and coroots are those of G, and its cocharacter lattice is X_*(T) ∩ ℚ-span of the coroots. Then the existence and isogeny theorems (Groups.splitReductiveGroup) give G_sc and the central isogeny G_sc → G_der from the inclusion of the coroot lattice. Provider: roadmap ReductiveGroups, Layer 9D “classification, relative groups and forms” (central isogenies, the isogeny theorem, simply connected forms). Upstream declarations used: `TauCeti.CommHopfAlgCat.derivedGroupScheme` (`TauCeti.Algebra.AlgebraicGroup.Derived.Basic`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`), `TauCeti.simplyConnectedSemisimpleCommHopfAlgProperty` (`TauCeti.Algebra.AlgebraicGroup.SimplyConnected.Basic`).'
deps = ['GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.splitReductiveGroup']
source = '[ConradRGS] Theorems 6.1.16–6.1.17 (existence and isogeny theorems, applied to the coroot-lattice root datum)'
