desc = 'The formal loop group, the arc group and the congruence subgroups of an affine group, as group functors on commutative algebras, with the presentation of the arc group by jets and the ind-affine presentation of the loop group. Owner: the Tau Ceti roadmap FormalConnectionsOpers.'

[[node]]
id = 'GLCinLean.LoopGroups.FormalLoopGroup'
kind = 'definition'
desc = 'The formal loop group LG, the arc group L⁺G and the congruence subgroups K_N of an affine group, as functors from commutative algebras to groups. Let k be a commutative ring and H a commutative Hopf algebra over k, so that G = Spec H is an affine group scheme over k. The points of G in a commutative k-algebra R are the group `TauCeti.HopfAlgebra.points`: the algebra maps H → R with the convolution product. For a commutative k-algebra R, R[[t]] is the ring of power series and R((t)) the ring of Laurent series over R, both with the k-algebra structure through the coefficients. Then LG(R) = G(R((t))), L⁺G(R) = G(R[[t]]), and for N ≥ 1 the congruence subgroup K_N(R) is the kernel of G(R[[t]]) → G(R[t]/t^N). The node asks for the following. (1) Functors. LG, L⁺G and K_N are functors from commutative k-algebras to groups. The inclusion R[[t]] → R((t)) induces an injective natural map L⁺G → LG. A map of commutative Hopf algebras induces natural maps of the loop groups, the arc groups and the congruence subgroups, compatible with composition; the plan uses this for the unipotent radical N → G, a Borel subgroup, a torus and a central isogeny. (2) Congruence subgroups. K_{N+1} is contained in K_N, and the two can be equal, as for the trivial group; K_N is normal in L⁺G; the intersection of all K_N is trivial; the map L⁺G(R)/K_N(R) → G(R[t]/t^N) is injective, and it is bijective when H is formally smooth over k. A commutative Hopf algebra of finite type over a field of characteristic zero is smooth (`TauCeti.smoothCommHopfAlgProperty_of_charZero`), so this covers every group of the plan. Without formal smoothness the map need not be surjective: for μ_p over 𝔽_p and N ≥ 2 the point 1 + t^{N−1} of μ_p(𝔽_p[t]/t^N) has no lift, because the only point of μ_p(𝔽_p[[t]]) is 1. (3) Jets. L⁺G(R) is the limit over N of the groups G(R[t]/t^N), naturally in R, and K_N is the kernel of the projection to the N-th term. The jet functor R ↦ G(R[t]/t^N) is represented by a commutative Hopf algebra over k, the Weil restriction along k → k[t]/t^N of the base change of H, which is of finite type when H is and smooth when H is. The truncations R[t]/t^{N+1} → R[t]/t^N give maps between these Hopf algebras, and L⁺G is represented by their filtered colimit: an affine group scheme over k, which need not be of finite type (for 𝔾_a over a nonzero ring k it is an affine space of infinite dimension). For N = 1 the projection is evaluation at t = 0, L⁺G → G, and the constant loops G → L⁺G are a section of it. (4) The ind-affine presentation, for H of finite presentation over k. For a finite presentation of H by generators x_1, …, x_n, the subfunctor LG_{≤N} of LG, for a natural number N, consists of the points g for which every g(x_i) and every g⁻¹(x_i) lies in t^{−N} R[[t]]; it is stable under inversion, it is not a subgroup in general, it depends on the presentation, and LG_{≤0} is L⁺G. Each LG_{≤N} is represented by a commutative k-algebra; the inclusion LG_{≤N} → LG_{≤N+1} is a closed embedding (a surjection of the representing algebras); LG(R) is the union of the LG_{≤N}(R) for every R; and for two finite presentations each piece of one lies in a piece of the other. So LG is an ind-affine ind-scheme: a filtered union of affine schemes along closed embeddings. The pieces need not be of finite type and need not be reduced: for the trivial group every piece is Spec k; for 𝔾_a over a nonzero ring k, with the generator x of k[x], every piece is an affine space of infinite dimension; and (5) has a piece for 𝔾_a with two generators that is not reduced. LG is a sheaf for the fpqc topology on commutative k-algebras. (5) Checks, over a nonzero ring k. For the trivial group all three functors are trivial. For G = 𝔾_m: LG(R) = R((t))ˣ, L⁺G(R) = R[[t]]ˣ and K_N(R) = 1 + t^N R[[t]]; over a field R every element of R((t))ˣ is a·t^n·u with a in Rˣ, n an integer and u in K_1(R), but over R = F[ε]/(ε²), for a k-algebra F that is a field, the unit 1 + εt⁻¹, with inverse 1 − εt⁻¹, has no such form, so LG is not reduced and must be defined on all R; with the generators x and x⁻¹ of H = k[x, x⁻¹] and a nonzero ring R, t^M lies in LG_{≤N}(R) exactly when |M| ≤ N; the coordinate x alone does not generate H, and the condition that g(x) lies in R[[t]] holds for t^M for every M ≥ 0, and for a nonzero R these points lie in no single piece. For G = 𝔾_a with the generator x of H = k[x]: LG(R) = R((t)) and LG_{≤N}(R) = t^{−N} R[[t]]. With the two generators x and x² of the same H the pieces are different: for N > 0 and a nonzero R the point x ↦ t^{−N} lies in the N-th piece of the first presentation and not in the N-th piece of the second, and it lies in the 2N-th piece of the second. The first piece of the second presentation is not reduced: for a point x ↦ a_{−1} t^{−1} + a_0 + … of it, the bound on the image of x² says a_{−1}² = 0, so the piece is the spectrum of k[a_{−1}, a_0, a_1, …]/(a_{−1}²). Generality. The plan needs the case of a field k of characteristic zero, H of finite type over k and every commutative k-algebra R, the nonreduced ones included. This is the case that the roadmap states (its “Conventions”), and it is sufficient for every node of the plan that uses this node. No field is used in the definitions or in (1) to (3), and the roadmap’s `Suggested.lean` states the coefficient maps `positiveLoopToFormal` and `polynomialLoopToFormal` for a commutative ring k. So the natural generality is a commutative Hopf algebra over a commutative ring, with H of finite presentation in (4); the node asks for it where Tau Ceti’s review accepts it, and it is not a condition of the plan. The plan uses the group G, its Borel subgroups, their unipotent radicals, its maximal tori and the simply connected cover of its derived group; no reductivity is assumed. Provider: roadmap FormalConnectionsOpers, §3.1 “Formal loop groups and congruence subgroups (F3.1)” and §3.2 “Ind-affine presentation and coefficient descent (F3.2)”. §3.1 defines `LG(R) = G(F_R)`, `L⁺G(R) = G(O_R)` and `K_N(R) = ker(G(O_R) → G(R[t]/t^N))` “for the native commutative coordinate Hopf algebra `H` of an affine group `G`”, with “their functors and maps, congruence inclusions, normality of `K_N` in `L⁺G`, separation `∩_N K_N = {1}`, the proalgebraic presentation of `L⁺G` by jets, and the inverse-limit description of `K_N`”, and states `L⁺G/K_N ≃ G(R[t]/t^N)`. §3.2 constructs “`LG` as an ind-affine functor by bounding poles in a finite presentation of `H` and of the inverse point”, with “The pole-bounded subfunctors `LG_(≤N)` are affine, `LG = colim_N LG_(≤N)`” and “`LG` is an fpqc sheaf on commutative `k`-algebras”. The checks of §§3.1 and 3.2 for `𝔾_m` and for the trivial group are among those of (5); the checks for 𝔾_a are added by this node. That the inclusions of the pieces are closed embeddings is not a sentence of §3.2; it is a property of the pieces that §3.2 constructs, and the plan needs it for the ind-scheme LoopGroups.LoopGroup. Not asked by this node, although they are targets of the same two sections: the exponential `exp_N` and the Baker–Campbell–Hausdorff description of K_N, the Lie algebra of LG, and the descent of finite projective modules over R((t)) along faithfully flat maps of coefficient rings. The polynomial loop groups, the loop Grassmannian and the affine flag variety of Layer 3A of the same roadmap are stated for a connected reductive group over ℂ; this node does not use them. In Tau Ceti and Mathlib, to be used and not written again: the points functor `TauCeti.HopfAlgebra.pointsFunctor` and the map of points along a map of coefficient algebras `AlgHom.mapValue`; the congruence subgroup of any ideal, `TauCeti.HopfAlgebra.congruenceSubgroup`, a normal subgroup, of which K_N(R) is the case of the ideal (t^N) of R[[t]]; `TauCeti.HopfAlgebra.congruenceSubgroup_iInf`, the congruence subgroup of an intersection of ideals, which gives the trivial intersection of the K_N because the ideals (t^N) of R[[t]] intersect in zero; the quotient of two successive congruence subgroups as a group of linear maps from the cotangent space, `TauCeti.HopfAlgebra.congruenceQuotientEquiv`; the lifting of points of a formally smooth algebra to an adically complete ring, Mathlib’s `Algebra.FormallySmooth.exists_mkₐ_comp_eq_of_isAdicComplete`, with the completeness of R[[t]] for the ideal (t) (an instance of `Mathlib.RingTheory.AdicCompletion.Completeness`), which gives the surjectivity onto the jets; the Weil restriction `TauCeti.Algebra.WeilRestriction` along a finite projective algebra, with `TauCeti.Algebra.WeilRestriction.tensorHomEquiv`, its Hopf algebra structure `TauCeti.Algebra.WeilRestriction.instHopfAlgebra`, the natural isomorphism of groups `TauCeti.Algebra.WeilRestriction.pointsMulEquiv` between its points and the points of the group over the base change, and its finite type and smoothness (`instFiniteType`, `instSmooth`), so each jet group is in Tau Ceti as a Hopf algebra; and Mathlib’s `PowerSeries` and `LaurentSeries`, with `LaurentSeries.of_powerSeries_localization`: R((t)) is the localization of R[[t]] at t. No loop group, arc group, jet tower or pole-bounded piece is in Tau Ceti. Still to do: (1); in (2) the inclusions, the trivial intersection and the comparison with the jets; in (3) the tower of the jet groups, its transition maps and its limit; all of (4) and (5). Upstream declarations used: `TauCeti.HopfAlgebra.points` and `TauCeti.HopfAlgebra.pointsFunctor` (`TauCeti.Algebra.AlgebraicGroup.PointsFunctor`), `AlgHom.mapValue` (`TauCeti.Algebra.AlgebraicGroup.FunctorOfPoints`), `TauCeti.HopfAlgebra.congruenceSubgroup` and `TauCeti.HopfAlgebra.congruenceSubgroup_iInf` (`TauCeti.Algebra.AlgebraicGroup.CongruenceSubgroup.Basic`), `TauCeti.HopfAlgebra.congruenceQuotientEquiv` (`TauCeti.Algebra.AlgebraicGroup.CongruenceSubgroup.Quotient`), `Algebra.FormallySmooth.exists_mkₐ_comp_eq_of_isAdicComplete` (`Mathlib.RingTheory.Smooth.AdicCompletion`), `TauCeti.Algebra.WeilRestriction` and `TauCeti.Algebra.WeilRestriction.tensorHomEquiv` (`TauCeti.RingTheory.WeilRestriction.Basic`), `TauCeti.Algebra.WeilRestriction.instHopfAlgebra` and `TauCeti.Algebra.WeilRestriction.pointsMulEquiv` (`TauCeti.Algebra.HopfAlgebra.WeilRestriction`), `TauCeti.Algebra.WeilRestriction.instSmooth` (`TauCeti.RingTheory.WeilRestriction.Smooth`), `TauCeti.smoothCommHopfAlgProperty_of_charZero` (`TauCeti.Algebra.AlgebraicGroup.Smooth.CharZero`), `PowerSeries` (`Mathlib.RingTheory.PowerSeries.Basic`), `LaurentSeries` and `LaurentSeries.of_powerSeries_localization` (`Mathlib.RingTheory.LaurentSeries`).'
