desc = 'The action of the coordinate changes of the formal disc on Laurent series over any commutative ring, and on the loop group, the arc group and the congruence subgroups of an affine group. Owner: the Tau Ceti roadmap FormalConnectionsOpers.'

[[node]]
id = 'GLCinLean.LoopGroups.coordinateChange'
kind = 'definition'
desc = '''The action of the group Aut(O) of coordinate changes of the formal disc on the loop group and the arc group of LoopGroups.FormalLoopGroup. For a commutative ring R, Aut(O)(R) is the group `TauCeti.FormalCoordinate R` of the power series φ = u·t + … over R with zero constant coefficient and unit linear coefficient u, under composition, (φ ∘ ψ)(t) = φ(ψ(t)); it is a functor of R (`TauCeti.FormalCoordinate.map`). The node asks for the following. (1) Substitution on Laurent series. For every commutative ring R and every φ in Aut(O)(R), the substitution σ_φ : f ↦ f ∘ φ is an automorphism of the R-algebra R((t)); it restricts to the automorphism `TauCeti.FormalCoordinate.substAlgEquiv` of R[[t]], and it maps t^N R[[t]] onto itself for every integer N. It satisfies σ_φ ∘ σ_ψ = σ_{ψ ∘ φ}, so φ ↦ σ_φ is a homomorphism from Aut(O)(R) to the opposite of the automorphism group. It is natural in R: for a ring map R → S, applying the map to the coefficients carries σ_φ to the substitution of the image of φ. Over a field it is `TauCeti.LaurentSeries.substAlgEquiv`, and for a homothety φ = a·t over any R it is `TauCeti.LaurentSeries.rescale a`. (2) The action on loops. Let H be a commutative Hopf algebra over a commutative ring k, and R a commutative k-algebra. For φ in Aut(O)(R) and a point g of LG(R), an algebra map H → R((t)), put ρ_φ(g) = σ_{φ⁻¹} ∘ g. Then ρ_φ is an automorphism of the group LG(R), and ρ_φ ∘ ρ_ψ = ρ_{φ ∘ ψ}, so ρ is a left action of the group Aut(O)(R) on LG(R) by group automorphisms. It is natural in R and in H. It maps L⁺G(R) onto itself and each congruence subgroup K_N(R) onto itself. When H is of finite presentation, then for every finite presentation of H and every N it maps the piece LG_{≤N}(R) of that presentation onto itself. So the semidirect products LG ⋊ Aut(O) and L⁺G ⋊ Aut(O), with (g, φ)(h, ψ) = (g·ρ_φ(h), φ ∘ ψ), are functors from commutative k-algebras to groups. (3) Checks. Over ℚ the series φ = 2t and ψ = t + t² are in Aut(O), σ_φ σ_ψ (t) = (ψ ∘ φ)(t) = 2t + 4t² and σ_ψ σ_φ (t) = (φ ∘ ψ)(t) = 2t + 2t², so the two orders differ; over 𝔽_2 the series 2t is zero and is not in Aut(O). For G = 𝔾_m and the homothety φ = a·t with a in Rˣ, ρ_φ(t^n) = a^{−n} t^n: over a nonzero R the action moves the point t^n of L𝔾_m(R) = R((t))ˣ exactly when a^n ≠ 1, and it fixes every constant loop, a point of G(R) ⊂ L⁺G(R). Over a nonzero ring R the power series t² has no compositional inverse and is not in Aut(O)(R). Generality. The plan needs the case of a field k of characteristic zero, H of finite type over k and every commutative k-algebra R, the nonreduced ones included; this is the case that the roadmap states and it is sufficient for the plan. (1) uses no field and (2) uses no field and no finiteness; the node asks for a commutative ring in (1) and a commutative Hopf algebra over a commutative ring in (2) where Tau Ceti's review accepts it, and this is not a condition of the plan. Use in the plan: the action of Aut(O) on the loop group, the arc group and the affine Grassmannian of [MV] §2, for which the spherical perverse sheaves are equivariant ([MV] Proposition 2.2), and the comparison of the loop groups over the Ran space with the loop group of a chosen coordinate (LoopGroups.RanLoopGroup). Provider: roadmap FormalConnectionsOpers, §1.2 “Coordinate automorphisms (F1.2)”: “Define coordinate automorphisms by `φ ∈ tR[[t]]` with unit coefficient of `t`. Construct the inverse substitution recursively, the group functor `Aut(O)`, its composition order, and its action on `F_R` and on differential forms”, with “Substitution is a continuous `R`-algebra automorphism of `F_R` preserving `O_R`” and the check for `φ = 2t`, `ψ = t + t²`. The roadmap owns “the relative formal calculus over arbitrary coefficient algebras (Layer 1)”, so (1) for every R is its target. The action on loops is not a target of §1.2. §6.3 orders it as a construction, there on ℂ-points: “Convert §1.2's right substitution to a left action `ρ_φ = σ_(φ⁻¹)` on coefficients and Hopf-valued loops. Use the semidirect product `(g, φ)(h, ψ) = (g ρ_φ(h), φ∘ψ)`”. §5.1 constructs a right action of `Aut(O)(R)` on opers, “natural in `R`”; it does not name the action on loops, and it needs one, because the action on opers must be compatible with the gauge action of the loop group. (2) is the construction of §6.3 for every R, with its convention. If Tau Ceti's review declines (2) as outside the roadmap, (2) comes back to LoopGroups.LoopGroup through `prompts/change.md`; it is a composition of (1) with `AlgHom.mapValue`. In Tau Ceti and Mathlib, to be used and not written again: the group `TauCeti.FormalCoordinate R` for every commutative ring R, with its linear coefficient, its homotheties, its jets and the limit over them (`TauCeti.RingTheory.PowerSeries.Coordinate.Jet`), base change, and the substitution automorphisms of R[[t]] with `TauCeti.FormalCoordinate.substAlgEquivHom`, the homomorphism φ ↦ σ_φ to the opposite group; the rescaling automorphisms of Laurent series over every commutative semiring, `TauCeti.LaurentSeries.rescale`, with their formula on monomials; the substitution automorphism of Laurent series by an arbitrary formal coordinate over a field only, `TauCeti.LaurentSeries.substAlgEquiv`, with `TauCeti.LaurentSeries.substAlgEquiv_mul`; and Mathlib's `LaurentSeries.of_powerSeries_localization`, which says that R((t)) is the localization of R[[t]] at t and so gives the extension of `substAlgEquiv` from R[[t]] to R((t)), because a formal coordinate is t times a unit of R[[t]]. Still to do: (1) for an arbitrary formal coordinate over a commutative ring, (2) and (3). The action on differential forms and the invariance of the residue, also targets of §1.2, are not asked by this node. Upstream declarations used: `TauCeti.FormalCoordinate`, `TauCeti.FormalCoordinate.substAlgEquiv`, `TauCeti.FormalCoordinate.substAlgEquivHom` and `TauCeti.FormalCoordinate.map` (`TauCeti.RingTheory.PowerSeries.Coordinate.Basic`), `TauCeti.LaurentSeries.rescale` (`TauCeti.RingTheory.LaurentSeries.Rescale`), `TauCeti.LaurentSeries.substAlgEquiv` (`TauCeti.RingTheory.LaurentSeries.Substitution.Basic`), `AlgHom.mapValue` (`TauCeti.Algebra.AlgebraicGroup.FunctorOfPoints`), `LaurentSeries` and `LaurentSeries.of_powerSeries_localization` (`Mathlib.RingTheory.LaurentSeries`).'''
deps = ['GLCinLean.LoopGroups.FormalLoopGroup']
