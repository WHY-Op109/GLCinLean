desc = 'The Picard variety of a curve and multiplication on abelian varieties. Owner: the Tau Ceti roadmap JacobianChallenge.'

[[node]]
id = 'GLCinLean.Curves.picardZero_isAbelianVariety'
kind = 'theorem'
desc = 'For a smooth proper geometrically connected curve X over a field k with a k-point x₀, the degree-zero component Pic⁰_{X/k} of the Picard scheme exists and is an abelian variety of dimension g (the Jacobian), and its k-points form a group isomorphic, under tensor product, to the group of degree-zero line bundles on X up to isomorphism, which is `LineBundleClass.picZero`, the kernel of the degree `LineBundleClass.eulerDegreeHom`. Provider: roadmap JacobianChallenge, “Layer D: the relative Picard functor and the Jacobian scheme” (D.2 “The Picard scheme as a named representing object”, D.5 `isRepresentable_picZeroSets`, D.7 `isProper_jacobianScheme`, D.8 “The Jacobian over any field”, `JacobianVariety` and `dim_jacobianVariety`) and “Layer E: abelian varieties” (E.2 “Abelian varieties and projectivity”). The `JacobianVariety` of the roadmap needs no rational point. The clause on k-points has no named target: it follows from the exact sequence of D.1 for a curve with a section and `rigidifiedPicardDegreeZeroFunctorIso` (`TauCeti.AlgebraicGeometry.PicardFunctor.PicZero.Rigidified`). Upstream declarations used: `TauCeti.AlgebraicGeometry.LineBundleClass.picZero` and `TauCeti.AlgebraicGeometry.LineBundleClass.eulerDegreeHom` (`TauCeti.AlgebraicGeometry.WeilDivisor.Scheme.PicZero`).'
source = '[GLC1] §1.3.2'

[[node]]
id = 'GLCinLean.Curves.abelianVariety_multiplication_surjective'
kind = 'theorem'
desc = 'For an abelian variety A over a field and an integer n ≠ 0, multiplication by n on A is finite locally free and surjective, an isogeny. Provider: roadmap JacobianChallenge, “Layer E: abelian varieties”, E.7 “Multiplication and characteristic `p`”, `multiplication_isogeny`. The text of E.7 asks for finite locally free and surjective; the predicate `IsIsogeny` of Tau Ceti (`TauCeti.AlgebraicGeometry.AbelianVariety.Isogeny`) says finite and surjective. In Tau Ceti: `TauCeti.AlgebraicGeometry.AbelianVariety.End.mulBy` (`TauCeti.AlgebraicGeometry.AbelianVariety.End.Basic`), with the isogeny statement only for n = −1 and in dimension zero.'
source = '[GLC1] §1.3.2'
