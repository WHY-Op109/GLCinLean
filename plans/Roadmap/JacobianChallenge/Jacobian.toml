desc = 'The Picard variety of a curve and multiplication on abelian varieties. Owner: the Tau Ceti roadmap JacobianChallenge.'

[[node]]
id = 'GLCinLean.Curves.picardZero_isAbelianVariety'
kind = 'theorem'
desc = 'For a smooth proper geometrically connected curve X over a field k, the degree-zero component Pic⁰_{X/k} of the Picard scheme exists and is an abelian variety of dimension g, and its k-points are the degree-zero line bundles on X up to isomorphism when X has a k-point. Provider: roadmap JacobianChallenge, “Layer D, the relative Picard functor and the Jacobian scheme”.'
source = '[GLC1] §1.3.2'

[[node]]
id = 'GLCinLean.Curves.abelianVariety_multiplication_surjective'
kind = 'theorem'
desc = 'For an abelian variety A over a field and an integer n ≠ 0, multiplication by n on A is finite locally free and surjective (an isogeny); over an algebraically closed field it is surjective on k-points. Provider: roadmap JacobianChallenge, “Layer E, abelian varieties”, `multiplication_isogeny`.'
source = '[GLC1] §1.3.2'
