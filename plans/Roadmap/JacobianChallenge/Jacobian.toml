desc = 'The Picard variety of a curve and multiplication on abelian varieties. Owner: the Tau Ceti roadmap JacobianChallenge.'

[[node]]
id = 'GLCinLean.Curves.picardZero_isAbelianVariety'
kind = 'theorem'
desc = 'For a smooth proper geometrically connected curve X over a field k with a k-point x₀, the degree-zero component Pic⁰_{X/k} of the Picard scheme exists and is an abelian variety of dimension g (the Jacobian), and its k-points form a group isomorphic, under tensor product, to the group of degree-zero line bundles on X up to isomorphism, which is `LineBundleClass.picZero`, the kernel of the degree `LineBundleClass.eulerDegreeHom`. Provider: roadmap JacobianChallenge, “Layer D, the relative Picard functor and the Jacobian scheme” and “Layer E, abelian varieties” (“Abelian varieties and projectivity”, `JacobianVariety`). Upstream declarations used: `TauCeti.AlgebraicGeometry.LineBundleClass.picZero` and `TauCeti.AlgebraicGeometry.LineBundleClass.eulerDegreeHom` (`TauCeti.AlgebraicGeometry.WeilDivisor.Scheme.PicZero`).'
source = '[GLC1] §1.3.2'

[[node]]
id = 'GLCinLean.Curves.abelianVariety_multiplication_surjective'
kind = 'theorem'
desc = 'For an abelian variety A over a field and an integer n ≠ 0, multiplication by n on A is finite locally free and surjective, an isogeny. Provider: roadmap JacobianChallenge, “Layer E, abelian varieties”, `multiplication_isogeny`.'
source = '[GLC1] §1.3.2'
