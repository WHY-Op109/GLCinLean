[[node]]
id = 'GLCinLean.Curves.serreTrace'
kind = 'definition'
desc = 'Trace H1(X, omega_X) to k for a smooth proper connected curve, with Serre duality normalization and base-change compatibility. Provider: roadmap JacobianChallenge, “Layer B: coherent cohomology over `k`: genus, Riemann–Roch, Serre duality”, B.2 “Serre duality through the trace” (the trace `tr_{X/k}` as a sum of residues, and `serreDuality_exists_trace`). The compatibility of the trace with extension of the base field has no target in Layer B or in “Layer C: relative coherent cohomology and base change”; it is a prerequisite of the uses of the trace here (Whittaker.character) and is stated with the trace. Upstream declarations used: `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`), `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`).'
source = '[GLC1] §§1.3.4–1.3.6'
