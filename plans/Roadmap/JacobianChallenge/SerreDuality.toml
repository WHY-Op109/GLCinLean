desc = 'The Serre duality trace and the degree of the canonical bundle of a smooth proper curve. Owner: the Tau Ceti roadmap JacobianChallenge.'

[[node]]
id = 'GLCinLean.Curves.serreTrace'
kind = 'definition'
desc = 'Trace H1(X, omega_X) to k for a smooth proper connected curve, with Serre duality normalization and base-change compatibility. Provider: roadmap JacobianChallenge, “coherent cohomology over k: genus, Riemann–Roch, Serre duality” and “relative coherent cohomology and base change”. Upstream declarations used: `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`), `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`).'
source = '[GLC1] §§1.3.4–1.3.6'

[[node]]
id = 'GLCinLean.Curves.degree_canonical'
kind = 'theorem'
desc = 'For a smooth proper geometrically connected curve X of genus g over a field, deg ω_X = 2g − 2. Provider: roadmap JacobianChallenge, “Layer B, coherent cohomology over k: genus, Riemann–Roch, Serre duality”.'
source = '[GLC1] §1.3.2'
