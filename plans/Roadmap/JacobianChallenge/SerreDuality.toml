id = 'GLCinLean.Curves.serreTrace'
kind = 'definition'
desc = 'Trace H1(X, omega_X) to k for a smooth proper connected curve, with Serre duality normalization and base-change compatibility. Provider: roadmap JacobianChallenge, “Layer B: coherent cohomology over `k`: genus, Riemann–Roch, Serre duality”, B.2 “Serre duality through the trace” (the trace `tr_{X/k}` as a sum of residues, and `serreDuality_exists_trace`). The compatibility of the trace with extension of the base field has no target in Layer B or in “Layer C: relative coherent cohomology and base change”; it is a prerequisite of the uses of the trace here (Whittaker.character) and is stated with the trace. In Tau Ceti at the pin: the residue trace `TauCeti.AlgebraicGeometry.relativeDifferentialsResidueTrace`, a linear form on H¹(X, Ω_{X/k}) for an integral Noetherian separated curve X over a field k that is integrally closed in the function field of X, with discrete valuation rings at the points of codimension one, invertible relative differentials and the valuative existence criterion. A smooth proper geometrically connected curve satisfies hypotheses of this kind (the row of `TauCeti.AlgebraicGeometry.eulerDegree_relativeDifferentials` in `docs/blueprint-providers.md`), and no declaration states the trace for such a curve directly. The trace is the one built from any separating function and the divisor of its differential (`relativeDifferentialsResidueTrace_eq`), it is the sum over the places of the local components of the Weil differentials (`relativeDifferentialsResidueTrace_eq_finsum_residue`), and it is not zero (`relativeDifferentialsResidueTrace_ne_zero`). Still to do: the trace for a smooth proper connected curve over a field, from these hypotheses; the Serre duality theorem with this trace (`serreDuality_exists_trace` of B.2), which the module names as separate work; and the compatibility with extension of the base field. Upstream declarations used: `TauCeti.AlgebraicGeometry.relativeDifferentialsResidueTrace`, `TauCeti.AlgebraicGeometry.relativeDifferentialsResidueTrace_eq`, `TauCeti.AlgebraicGeometry.relativeDifferentialsResidueTrace_eq_finsum_residue` and `TauCeti.AlgebraicGeometry.relativeDifferentialsResidueTrace_ne_zero` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Trace`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`), `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`).'
source = '[GLC1] §§1.3.4–1.3.6'
