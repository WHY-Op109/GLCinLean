desc = 'The middle perverse t-structure on constructible complexes on the complex points of a C-scheme, with intermediate extensions and intersection complexes. Owner: the Tau Ceti roadmap EtaleDualityAndPerverseSheaves.'

[[node]]
id = 'GLCinLean.Constructible.PerverseSheaves'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C and a field E: the middle-perversity t-structure on D^b_c(Y, E) of Constructible.DerivedCategory, as a Mathlib t-structure on that triangulated category. K is in the part ≤ 0 when the support of the cohomology sheaf ℋ^m(K) has dimension at most −m for every m, and in the part ≥ 0 when its Verdier dual is in the part ≤ 0. For a stratification by smooth connected locally closed subvarieties along which the cohomology sheaves of the *- and !-restrictions of K are locally constant, the two conditions are: ℋ^m(i_T^*K) = 0 for m > −dim T, and ℋ^m(i_T^!K) = 0 for m < −dim T, on every stratum T. With it: the heart of perverse sheaves, in which every object has finite length; the perverse cohomology functors pH^i; the intermediate extension j_!* of a perverse sheaf P along a locally closed embedding j, as the image of pH^0(j_!P) → pH^0(Rj_*P) in the heart; it is a functor between the hearts and is not defined on all of D^b_c; the intersection complex IC(Z, L) = j_!*(L[dim U]) of a local system L of finite rank on a smooth connected locally closed subvariety U with closure Z. The simple perverse sheaves are the IC(Z, L) with L irreducible. Checks: on a point it is the standard t-structure; for Y smooth and connected of dimension d and L a local system of finite rank on Y, L[d] is perverse and equals IC(Y, L), and for a smooth Y that is not connected the shift is by the dimension of each component (on the disjoint union of a line and a point, the constant sheaf shifted by 1 is not perverse); for the inclusion j of C^× in C, Rj_*E[1] is perverse and is a non-split extension of the skyscraper at the origin by E_C[1]. Provider: roadmap EtaleDualityAndPerverseSheaves, as a prerequisite of two targets and not a named target: §3.5 `complexAnalyticComparison`, which gives the perverse comparison for finite and integral coefficients and, for rational E, an equivalence onto the monodromy-stable-lattice essential image, and preserves j_!* and IC in these ranges, and §5.9, which defines geometric origin for simple perverse sheaves of complex vector spaces. The roadmap states the étale t-structure, intermediate extensions and intersection complexes in §§2.4, 2.8 and 2.10, and the abstract gluing of t-structures in §§2.2–2.3. Upstream declarations used: `CategoryTheory.Triangulated.TStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Basic`).'
deps = ['GLCinLean.Constructible.DerivedCategory']
source = '[HottaTakeuchiTanisaki] Chapter 8 (perverse sheaves); [BBD] §§2.1–2.2 and Théorème 4.3.1 (not pinned; the roadmap cites Théorème 4.3.1 in its §2.10, check the numbers before use)'
