id = 'GLCinLean.Constructible.exists_iso_directSum_ic_properPushforward'
kind = 'theorem'
desc = 'The decomposition theorem over C, with coefficients C. Definitions, for separated schemes of finite type over C, in D^b_c(−, C) of Constructible.DerivedCategory with the perverse t-structure of Constructible.PerverseSheaves. The simple perverse sheaves of geometric origin are the smallest class of simple perverse sheaves, on all these schemes, that contains the constant sheaf C on the point and is closed under: the simple constituents of pH^i(T F) for F in the class and T one of f_*, f_!, f^*, f^! for a map f of these schemes; and the simple constituents of pH^i(A ⊗ B) and pH^i(RHom(A, B)) for A and B in the class. A complex K is semisimple of geometric origin if K ≅ ⊕_i pH^i(K)[−i] and every pH^i(K) is a finite direct sum of simple perverse sheaves of geometric origin. Theorem: for a proper map f : X → Y and K on X semisimple of geometric origin, f_*K is semisimple of geometric origin. By the classification of the simple perverse sheaves in Constructible.PerverseSheaves, f_*K is then a finite direct sum of shifted intersection complexes IC(Z, L) of irreducible local systems L on smooth connected locally closed subvarieties of Y. The zero complex is semisimple of geometric origin, as the empty sum. The case that the plan uses: X smooth and connected of dimension d and K = C_X[d], which is simple of geometric origin as pH^d(a^*C) for the map a from X to the point; a smooth X that is not connected is the sum of its components, each with the shift by its own dimension. Then pH^0(f_*C_X[d]) is a semisimple perverse sheaf and a direct summand of f_*C_X[d]. Check: for the blow-up π of C² at the origin, π_*C[2] ≅ C[2] ⊕ C_0. No descent of the splitting to a smaller coefficient field is asserted. The roadmap proves it by the ℓ-adic route of [BBD]. A simple object of geometric origin is built from the constant sheaf on the point by finitely many of the operations; the comparison of étale and analytic sheaves (§3.5), through a chosen isomorphism of C with the algebraic closure of Q_ℓ, carries this construction, and not an arbitrary analytic complex, to étale ℓ-adic sheaves, and the restricted specialization of §5.9 carries it to a perverse sheaf over the algebraic closure of a finite field that comes from a pure one over the finite field. Purity is a statement over the finite field (on Weil II of the roadmap DeligneWeightsAndPurity); the splitting of the pushforward and the semisimplicity of its perverse cohomology hold after extension to the algebraic closure of the finite field (§5.6), and are carried back. Provider: roadmap EtaleDualityAndPerverseSheaves, §5.10 `decompositionTheoremComplex`, with the definition of geometric origin of §5.9.'
deps = ['GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.ComplexPoints']
