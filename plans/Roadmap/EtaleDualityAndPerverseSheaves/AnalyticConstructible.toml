desc = 'Constructible complexes on the complex points of separated C-schemes of finite type, as an ordinary triangulated theory with its operations. Owner: the Tau Ceti roadmap EtaleDualityAndPerverseSheaves.'

[[node]]
id = 'GLCinLean.Constructible.DerivedCategory'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C and a field E: the bounded derived category D^b_c(Y, E) of sheaves of E-vector spaces on Y(C) (Constructible.ComplexPoints) whose cohomology sheaves are constructible for some algebraic stratification, with stalks of finite rank. It is a full triangulated subcategory of the derived category of sheaves of E-vector spaces on Y(C). The plan uses it as an ordinary triangulated category and never as an enhanced one. How Tau Ceti builds it is the choice of the roadmap: from Mathlib (TopCat.Sheaf and DerivedCategory), as the plan intends, or as the homotopy category of the enhanced analytic categories of EnhancedDerivedSheaves §§0.1–0.4, which §3.5 names. The maps below are maps of schemes over C. Operations, each preserving D^b_c: (1) f^*, Rf_*, Rf_! and f^! along every map f, with the adjunctions f^* ⊣ Rf_* and Rf_! ⊣ f^!, and Rf_! ≅ Rf_* for proper f; (2) the tensor product and the internal Hom RHom; (3) Verdier duality 𝔻 = RHom(−, a^!E) for the map a to the point, with 𝔻𝔻 ≅ id, and the external product p_1^*(−) ⊗ p_2^*(−). 𝔻 exchanges f^* with f^! and Rf_* with Rf_!: 𝔻 f^* ≅ f^! 𝔻 and 𝔻 Rf_! ≅ Rf_* 𝔻; this follows from (1), (2) and (5). Identities: (4) base change for Rf_!: for f : X → Y, every g : Y′ → Y, and the base changes f′ : X′ → Y′ and g′ : X′ → X in the Cartesian square, g^* Rf_! ≅ Rf′_! g′^*; for a proper f this is base change for Rf_*; (5) the projection formula Rf_!(K ⊗ f^*L) ≅ Rf_!K ⊗ L. Base change for Rf_* along an arbitrary Cartesian square is false: for the inclusion j of C^× in C and the inclusion i of the origin, i^*Rj_*E ≅ E ⊕ E[−1], and the fibre is empty. (6) Hom in D^b_c is computed by derived global sections of RHom. (7) For a smooth map g of relative dimension d, g^! ≅ g^*[2d]. For the structure map a : X → pt of a smooth scheme, (a^!E)|_C ≅ E_C[2 dim C] on each connected component C. In particular a^!E ≅ E_X[2d] when X is smooth of pure dimension d. With (4) and the adjunctions of (1) this gives smooth base change for Rf_*: in the Cartesian square of (4) with g smooth of relative dimension d, g^* Rf_* ≅ Rf′_* g′^*, because the right adjoints of the two sides of f^* Rg_! ≅ Rg′_! f′^* are g^! Rf_* and Rf′_* g′^!. Checks: Rj_*E above is in D^b_c; on a point, D^b_c is the bounded derived category of finite-dimensional E-vector spaces. What uses what: the definition of geometric origin (§5.9) uses (1) and (2). Constructible.PerverseSheaves and Constructible.StratifiedDerivedCategory use (3) with the exchange of 𝔻, and so (5); (4) for locally closed embeddings; and (7) for open embeddings (d = 0) and for the map to the point from a smooth scheme. The exchange in (3) for a map f uses (5) for that map. The local comparison, stratified-map, orbit-goodness and Bott–Samelson nodes (DModules.analyticDeRham_isEquivalence, Constructible.IsStratifiedMap, Constructible.isGood_orbitStratification, AffineGrassmannian.isEven_bottSamelsonPushforward) use further instances of base change and smooth purity, derived global Hom, external products or general coefficient fields. The complex-analytic geometric-origin and decomposition statements of §§5.9–5.10 require only part of this interface. Provider: roadmap EtaleDualityAndPerverseSheaves, as a prerequisite of two targets and not a named target: §3.5 `complexAnalyticComparison`, whose target category is the analytic D^b_c in the derived category of module sheaves on the complex points, and §5.9 “Restricted specialization and geometric origin”. Its inputs from other accepted roadmaps: ComplexComparisonPartII, which “supplies algebraically constructible analytic coefficient categories” for finite and ℓ-adic coefficients (the space is Constructible.ComplexPoints by §C−1.1; triangulations compatible with algebraic stratifications, §C6.0 `complexAlgebraicTopology`; extension by zero, compactly supported cohomology and Rf_! for sheaves of modules over any commutative ring, §C6.1); Hyperfunctions HF3a, which has f_! with proper base change and the tensor projection formula for sheaves of C-vector spaces on finite-dimensional locally compact Hausdorff spaces, and with which §C6.1 must agree; EnhancedDerivedSheaves §§0.1–0.4 for the enhancement. Left for this node: boundedness and constructibility of the six operations for algebraic maps, f^! with (7), and duality. In Tau Ceti: the exact extension by zero from an open subset, as the left adjoint of restriction on a preorder site (`TauCeti.CategoryTheory.SheafExtensionByZero.isRightAdjoint_sheafPushforwardContinuous_forget`, and for sheaves of modules `SheafOfModules.isRightAdjoint_pushforward_over`). Upstream declarations used: `TopCat.Sheaf` (`Mathlib.Topology.Sheaves.Sheaf`), `DerivedCategory` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `TauCeti.CategoryTheory.SheafExtensionByZero.isRightAdjoint_sheafPushforwardContinuous_forget` (`TauCeti.CategoryTheory.Sites.ExtensionByZero`), `SheafOfModules.isRightAdjoint_pushforward_over` (`TauCeti.Algebra.Category.ModuleCat.Sheaf.ExtensionByZero`).'
deps = ['GLCinLean.Constructible.ComplexPoints']
source = '[HottaTakeuchiTanisaki] Chapter 4 and Appendix on derived categories of sheaves'
