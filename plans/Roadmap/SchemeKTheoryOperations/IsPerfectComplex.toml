desc = 'Perfect complexes of module sheaves on a scheme. Owner: the Tau Ceti roadmap SchemeKTheoryOperations.'

[[node]]
id = 'GLCinLean.Sheaves.IsPerfectComplex'
kind = 'definition'
desc = '''For every scheme X, with no hypothesis, a complex E of O_X-modules is perfect when every point of X has an open neighbourhood U with a strictly perfect complex P on U and a quasi-isomorphism from P to the restriction of E to U ([StacksProject] Definition 20.49.1, tag 08CM). A strictly perfect complex is a bounded complex whose terms are direct summands of finite free modules; the roadmap takes bounded complexes whose terms are locally free of finite type, and both give the same perfect complexes, because the condition is local. A perfect object of `DerivedCategory X.Modules` is an object that a perfect complex represents. Checks: the zero complex and O_X in degree 0 are perfect; an unbounded contractible complex is perfect and not strictly perfect, also on a point; on the empty scheme every complex is perfect; on Spec of a field k the perfect objects are the complexes with finite-dimensional total cohomology, and ⊕_ℕ k in degree 0 is not perfect. Users: Sheaves.derivedQCoh_perfectGenerator and Sheaves.perfectDerived_iff_isPerfectComplex. Provider: roadmap SchemeKTheoryOperations, §1.3 “Perfect objects and derived operations”: `IsPerfectComplex` of its `Suggested.lean` (“The predicate `IsPerfectComplex` in `Suggested.lean` expresses local quasi-isomorphism from the strictly perfect models of §1.1 on an open neighborhood of each point”), on `IsStrictlyPerfect` of §1.1. The open Tau Ceti #43025 writes the strictly perfect complexes of §1.1 (`isStrictlyPerfect`) and names `IsPerfectComplex` as remaining work. In Tau Ceti at the pin: no strictly perfect or perfect complex of module sheaves; perfect objects of the derived category of modules over a ring. Upstream declarations used: `AlgebraicGeometry.Scheme.Modules` (`Mathlib.AlgebraicGeometry.Modules.Sheaf`), `DerivedCategory` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `TauCeti.DerivedDeRham.IsPerfect` (`TauCeti.Algebra.Homology.ModuleCat.Perfect`).'''
source = '[StacksProject] Definition 20.49.1 (tag 08CM)'
