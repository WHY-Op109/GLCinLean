desc = 'Right Kan extension of coherent diagrams into a category with the needed limits, computed objectwise by limits over the appropriate slice infinity-categories, with restriction and uniqueness equivalences; presentable targets are an instance. Ordinary Kan extension is not a substitute for this enhanced universal property. Provider: roadmap BordismFormalGroups, “Marked fibrations and Kan extensions”, with roadmap EnhancedDerivedSheaves “Kan extensions and finality”.'
