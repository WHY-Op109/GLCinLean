desc = 'The coadjoint nilpotent cone of an affine group scheme: the zero fibre of the coadjoint quotient map, as an ideal. Owner: the Tau Ceti roadmap LanglandsParameterStacks.'

[[node]]
id = 'GLCinLean.Groups.nilpotentCoadjointCone'
kind = 'definition'
desc = 'The coadjoint nilpotent cone, as an ideal. Let H be a commutative Hopf algebra over a commutative ring k whose cotangent space at the identity is finite and projective. Then Spec H is an affine group scheme, and its Lie algebra 𝔥, the dual of the cotangent space, carries the adjoint comodule structure. An affine algebraic group over a field is an example. The polynomial functions on 𝔥* are Sym(𝔥), the invariant polynomial functions are the coinvariants Sym(𝔥)^H, and the ideal of the coadjoint nilpotent cone is the ideal of Sym(𝔥) generated by the invariant polynomial functions that vanish at the origin. It is the ideal of the scheme-theoretic fibre of the coadjoint quotient map 𝔥* → Spec Sym(𝔥)^H over the image of the origin; this map is the Chevalley map ϖ of [ArinkinGaitsgory] §11.1.2. No invariant form on 𝔥 is used. Facts to prove with the definition: (1) an ideal contains it exactly when it contains every invariant polynomial function that vanishes at the origin; (2) it lies in the augmentation ideal, so the origin is on the cone; (3) it is homogeneous, so the cone is conical; (4) the coaction maps it into the ideal that it generates in Sym(𝔥) ⊗ H, so the cone is stable under the group; (5) for every isomorphism of comodules from 𝔥 to its dual 𝔥* (an invariant identification 𝔥 ≅ 𝔥*), the induced isomorphism Sym(𝔥) ≅ Sym(𝔥*) maps it onto `TauCeti.nilpotentConeIdeal`, the ideal of the adjoint nilpotent cone; (6) checks, over a field k. When the adjoint coaction is trivial, as for a torus and for the trivial group, the ideal is the augmentation ideal, so a point with values in any k-algebra is on the cone only if it is zero; for 𝔾_m the point ε with values in k[ε]/(ε²) is not on the cone. For GL₂, write a matrix Y for the linear form X ↦ tr(YX). Then E₁₂ is a nonzero point of the cone; diag(1, −1) is not on the cone, although the invariant of degree one, the trace, vanishes on it (the invariant of degree two, the determinant, does not), so the trace alone gives a wrong cone; the identity matrix, which is central and so ad-nilpotent, is not on the cone, so ad-nilpotence alone gives a wrong cone; and the point diag(ε, −ε) with values in k[ε]/(ε²) is on the cone. Generality: the definition and (1) to (4) are stated in the generality of `Derivation.adjointComodule`, a commutative ring with finite projective cotangent space; (5) is stated where `TauCeti.nilpotentConeIdeal` is defined, which is over a field at the pin. Differences from the paper. Reformulation: [ArinkinGaitsgory] §11.1.1 uses only the Zariski-closed subset Nilp(𝔥*) of 𝔥*. It is the zero set of this ideal; the ideal carries more, since it need not be radical. The support category `LocalSystems.IndCohNilpotent` and the closed subset `LocalSystems.nilpotentCone` use only the zero set. The ideal itself is used by the fibre of the coadjoint quotient map (`Groups.chevalleyMap`) and by the condition with equalities of `LocalSystems.nilpotentCone`: for 𝔾_m the ideals (t) and (t²) have the same zero set and differ at the point t = ε. Reading: §11.1.1 defines Nilp(𝔥*) for a reductive group as the image of “the locus of nilpotent elements” of 𝔥 under an invariant identification 𝔥 ≅ 𝔥*. A nilpotent element of a reductive Lie algebra is read as an element of the derived ideal that is ad-nilpotent. With this reading the two descriptions of §§11.1.1 and 11.1.2 agree, by (5) and the Tau Ceti description of the k-points of the adjoint nilpotent cone, and the cone of a torus is the origin, as [GLC1] §1.5.4 says; with ad-nilpotence alone the centre of 𝔥 would be on the cone. Generalization: the paper has a reductive group; the definition is for every H as above. Route. Tau Ceti at the pin has the common construction, `Subalgebra.symmetricAlgebraHilbertIdeal` (`TauCeti.LinearAlgebra.SymmetricAlgebra.HilbertIdeal`): for a subalgebra A of Sym(M), the ideal generated by the elements of A that vanish at the origin, with (1) to (3) as `Subalgebra.symmetricAlgebraHilbertIdeal_le_iff`, `Subalgebra.symmetricAlgebraHilbertIdeal_le_irrelevant` and `Subalgebra.isHomogeneous_symmetricAlgebraHilbertIdeal`; for the coinvariants of a comodule over a commutative bialgebra it has (4), the augmentation ideal as the ideal of a trivial coaction, and the fact that an isomorphism of comodules maps the ideal onto the ideal (`TauCeti.ComoduleAlgebra.coact_mem_map_includeLeft_symmetricAlgebraHilbertIdeal`, `TauCeti.ComoduleAlgebra.symmetricAlgebraHilbertIdeal_coinvariants_eq_ker_algebraMapInv` and `TauCeti.Comodule.Hom.map_symmetricAlgebraHilbertIdeal`, in `TauCeti.Algebra.Bialgebra.ComoduleAlgebra.SymmetricAlgebra`). The two ideals below are its cases; the rest of this paragraph says why the construction has this form. `Representation.symmetricAlgebraHilbertIdeal` (`TauCeti.RepresentationTheory.SymmetricAlgebra.HilbertIdeal`) is the ideal of Sym(M) generated by the invariants with zero constant term, for a representation of a monoid on M, with (1) to (3) as `symmetricAlgebraHilbertIdeal_le_iff`, `symmetricAlgebraHilbertIdeal_le_irrelevant` and `isHomogeneous_symmetricAlgebraHilbertIdeal`. `TauCeti.nilpotentConeIdeal` is the same ideal for the coinvariants of the dual 𝔥* of the adjoint comodule, with (1) to (4) as `nilpotentConeIdeal_le_iff`, `nilpotentConeIdeal_le_ker_algebraMapInv`, `nilpotentConeIdeal_isHomogeneous` and `coact_mem_map_includeLeft_nilpotentConeIdeal`. Neither serves the comodule 𝔥: the invariants of a group scheme are the coinvariants of its coaction, and the invariants of its group of rational points can be strictly larger: for the scaling action of 𝔾_m on 𝔽₂[x] the coinvariants are 𝔽₂, and the one rational point fixes every polynomial. Do not write a third copy. Write one construction for a subalgebra of Sym(M) that contains the homogeneous components of its elements (`SetLike.IsHomogeneous`, as in `Representation.isHomogeneous_symmetricAlgebraInvariants` and `TauCeti.ComoduleAlgebra.decompose_mem_coinvariants_symmetricAlgebra`): the ideal generated by its elements that vanish at the origin, with (1) to (3). Its case for the coinvariants of a comodule M over a commutative bialgebra adds (4), from `TauCeti.ComoduleAlgebra.coact_mem_map_includeLeft_span`, and the fact that an isomorphism of comodules M ≅ N maps the ideal of M onto the ideal of N (`TauCeti.Comodule.Hom.symmetricAlgebraMap`, in `TauCeti.Algebra.Coalgebra.Comodule.SymmetricAlgebra.Basic`, gives the map). Follow the names and the API of the Hilbert ideal. Order of work, one pull request for each step, and each step opens after the step before it is on Tau Ceti main, because Tau Ceti allows no stacked pull requests: first the common construction, with the Hilbert ideal and `TauCeti.nilpotentConeIdeal` as its cases; this improves existing Tau Ceti code and keeps the names and the statements of `TauCeti.nilpotentConeIdeal` and its four lemmas, which other code uses; then the coadjoint case M = 𝔥 with (5) and (6). Provider: roadmap LanglandsParameterStacks, §1.12 “Lie invariants and the coadjoint nullcone”: “Define the scheme-theoretic zero fibre by the positive-degree invariant ideal”, “The adjoint zero fibre and coadjoint zero fibre correspond through the pairing”, and its checks for `gl₂`, `G_m` and the trivial group, which (6) repeats. §1.12 states its targets for a split connected reductive group over a field of characteristic zero or of very good characteristic. These hypotheses serve its theorems (the invariant form, the restriction isomorphism, the degrees of the generators); the definition and (1) to (5) use none of them, as `TauCeti.nilpotentConeIdeal` uses none. The statement uses the cone of the dual group, which is split connected reductive over a field of characteristic zero (`LocalSystems.nilpotentCone`). The existence of an invariant identification 𝔥 ≅ 𝔥* for such a group is the first item of §1.12; no node of `plans/` uses it. In Tau Ceti: the invariant polynomial functions, as `TauCeti.ComoduleAlgebra.coinvariants` of the comodule algebra `TauCeti.ComoduleAlgebra.symmetricAlgebra` of `Derivation.adjointComodule`; the two ideals named under Route; and the k-points of the adjoint nilpotent cone of a reductive group over an algebraically closed field of characteristic zero, which are the ad-nilpotent elements of the derived ideal (`TauCeti.reductiveCommHopfAlgProperty.nilpotentConeIdeal_le_ker_lift_eval_iff_mem_derivedSeries_and_isNilpotent_ad`, `TauCeti.Algebra.AlgebraicGroup.Reductive.NilpotentCone`). Still to do: the coadjoint case M = 𝔥, with (5) and (6). Upstream declarations used: `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.ComoduleAlgebra.coinvariants` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra`), `TauCeti.ComoduleAlgebra.symmetricAlgebra` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra.SymmetricAlgebra`), `TauCeti.nilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`), `Representation.symmetricAlgebraHilbertIdeal` (`TauCeti.RepresentationTheory.SymmetricAlgebra.HilbertIdeal`), `Subalgebra.symmetricAlgebraHilbertIdeal` (`TauCeti.LinearAlgebra.SymmetricAlgebra.HilbertIdeal`), `TauCeti.Comodule.dual` (`TauCeti.Algebra.Coalgebra.Comodule.Dual`).'
source = '[ArinkinGaitsgory] §§11.1.1–11.1.2'
