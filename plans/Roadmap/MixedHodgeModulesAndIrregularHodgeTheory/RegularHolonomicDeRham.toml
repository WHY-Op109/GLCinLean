desc = 'The de Rham functor of the regular holonomic D-modules on a smooth complex scheme, and the regular Riemann–Hilbert correspondence. Owner: the Tau Ceti roadmap MixedHodgeModulesAndIrregularHodgeTheory.'

[[node]]
id = 'GLCinLean.DModules.regularHolonomicDeRham'
kind = 'definition'
desc = '''Let X be a smooth separated scheme of finite type over C of pure dimension d. Left modules, Dᵇ and the functors f_+, f^† and 𝔻 are those of DModules.transferModule, and f_! = 𝔻 f_+ 𝔻. Write Dᵇ_rh(D_X) for the full subcategory of Dᵇ of the left D_X-modules on the complexes whose cohomology modules are regular holonomic (DModules.regularHolonomicDModule). The functor. For a left D_X-module M with quasi-coherent underlying O_X-module, M^an is the pullback of M along the map of ringed spaces from the analytification of X to X, a sheaf on X(C) (Constructible.ComplexPoints) with the induced action of the holomorphic differential operators; DR(M) is its de Rham complex Ω^• ⊗ M^an, with the holomorphic differential forms, the tensor product over the holomorphic functions and the differential of the connection, in the degrees 0, …, d; and pDR(M) = DR(M)[d]. The node asks for pDR as a triangulated functor on Dᵇ_rh(D_X), with values in the derived category of the sheaves of C-vector spaces on X(C). The definition makes sense for every complex of left D_X-modules; the node asks nothing about the complexes outside Dᵇ_rh(D_X). Theorem. (1) pDR has values in D^b_c(X, C) of Constructible.DerivedCategory and is an equivalence of triangulated categories from Dᵇ_rh(D_X) to D^b_c(X, C). (2) It is t-exact for the standard t-structure of Dᵇ_rh(D_X) and the perverse t-structure of Constructible.PerverseSheaves, so it restricts to an equivalence from the regular holonomic D_X-modules to the perverse sheaves with coefficients C. (3) For a morphism f : X → X′ of such schemes there are natural isomorphisms pDR ∘ f_+ ≅ Rf_* ∘ pDR and pDR ∘ f_! ≅ Rf_! ∘ pDR on Dᵇ_rh(D_X), and pDR ∘ f^† ≅ f^! ∘ pDR on Dᵇ_rh(D_X′). They presuppose the stability: f_+ and f_! carry Dᵇ_rh(D_X) into Dᵇ_rh(D_X′), and f^† carries Dᵇ_rh(D_X′) into Dᵇ_rh(D_X). The node asks for one isomorphism for each map, and for no compatibility of these isomorphisms with the composition of maps. (4) pDR ∘ 𝔻_X ≅ 𝔻 ∘ pDR, for the duality of D-modules and the Verdier duality of Constructible.DerivedCategory (3). (5) External products. For left modules M on X and N on X′ of such schemes, with the projections p and q of X × X′, the external product M ⊠ N is p^*M ⊗ q^*N, the tensor product over the functions of X × X′, with the vector fields of the two factors acting on the two factors; it is exact in each variable and passes to Dᵇ ([HottaTakeuchiTanisaki] §1.5). pDR(M ⊠ N) ≅ pDR(M) ⊠ pDR(N) for M and N with regular holonomic cohomology, with the external product of Constructible.DerivedCategory (3). This presupposes the stability of regular holonomic cohomology under the external product. (6) Connections. For a left D_X-module E that is a vector bundle with an integrable connection, regular in the sense of (a) of DModules.regularHolonomicDModule, pDR(E) ≅ L[d] for the sheaf L of the horizontal sections of E^an, a local system of rank the rank of E; and every local system of finite rank on X(C) is isomorphic to the sheaf of horizontal sections of such an E. With (1): a regular holonomic D_X-module M with pDR(M) ≅ L[d] for a local system L of finite rank is a vector bundle with an integrable connection. Checks of the target: pDR(O_X) = C_X[d]; on the affine line, pDR(δ_0) is the skyscraper sheaf C at the origin in degree 0, and DR(δ_0) without the shift is in degree 1; the connection on O·e with ∂e = e is not regular, so it is outside the source, although the function e^x identifies its analytification with that of O. Checks of this node, for the shifts in (3): for the inclusion i of the origin in the affine line, i^†δ_0 = C in degree 0, and i^! of the skyscraper sheaf at the origin is C in degree 0; for the map p from the affine line to the point, p^†C = O[1], and pDR(O[1]) = C[2] = p^!C. Users: DModules.analyticDeRham and DModules.analyticDeRham_isEquivalence, with (1) to (6). Provider: roadmap MixedHodgeModulesAndIrregularHodgeTheory, §1.5 “Regular Riemann–Hilbert correspondence”, a named target: “For X a smooth complex variety of dimension d, analytification followed by pDR(M) = DR(M)[d] is an equivalence from algebraic regular holonomic left D_X-modules to Perv(X, ℂ), and from the bounded derived category with regular holonomic cohomology to D^b_c(X, ℂ). It is exact, fully faithful, and compatible with f_+ and Rf_*, f_! and Rf_!, f^† and f^! up to the normalizing shifts, holonomic duality and Verdier duality, and external product. Regularity includes regularity at the boundary of an algebraic compactification. The inverse is the regular holonomic realization; it is not the space of analytic solutions of an irregular connection”; and its “Conventions”: “For X smooth of pure dimension d, the unshifted de Rham complex DR(M) of a left D_X-module has terms in degrees 0, …, d, and pDR(M) = DR(M)[d]”. Readings of the target. (i) It says “of dimension d”; this node reads pure dimension d, as its convention and the D-modules of SpringerResolutionAndCharacteristicCycles Layers 8–9 require. (ii) It says “up to the normalizing shifts”; with f^† = Lf^*[dim X − dim X′] of DModules.transferModule (2) and the shift of pDR, this node states the isomorphisms of (3) with no further shift, and its two checks test this for a closed immersion and for a smooth map. [HottaTakeuchiTanisaki] Theorem 7.1.1 states DR_X ∘ f^† ≃ f^! ∘ DR_Y with the same f^†, and with DR_X(M) defined as the de Rham complex Ω ⊗ᴸ M^an of the analytification, over the holomorphic differential operators and with the holomorphic forms Ω of top degree, which is pDR(M) (§4.7 of the book). (iii) “Regularity includes regularity at the boundary of an algebraic compactification”: the predicate of DModules.regularHolonomicDModule has this. Its (a) tests a connection at every point of the boundary of the smooth projective completion of every smooth locally closed curve, and these points include those that lie over the boundary of a compactification of X; the connection with ∂e = e is regular at every point of the affine line and fails the test at infinity. (iv) “The inverse is the regular holonomic realization”: the node asks for the equivalence, and for no construction of an inverse functor. (v) The target does not say on which category the functor is defined before the restriction to the regular holonomic complexes, and it does not spell out the analytification of a D-module; the analytification of X is `complexSchemeAnalytification` of ComplexComparisonPartII §C−1.1 (its “Conventions”), whose space is Constructible.ComplexPoints. (vi) “compatible with”: the target states no compatibility of the isomorphisms of (3) with the composition of maps, and neither does [HottaTakeuchiTanisaki] Theorem 7.1.1, where the isomorphisms are those of four canonical morphisms: one for the direct image, one defined from it through the adjunctions of f_! with f^† and of Rf_! with f^!, and the two that duality gives from them. Remark 7.2.3 of the book says that many relations among the functors remain to be checked in its proof of Theorem 7.2.2. No node of the plan uses such a compatibility. (vii) The target says “Compatibility with nearby and vanishing cycles is 4.2”; this node does not ask for it. Limits of the target: the complex numbers, smooth schemes, left modules, the bounded derived categories and no enhancement. It has no scheme with singularities, no crystal and no category of a fixed stratification; these are in DModules.analyticDeRham and DModules.analyticDeRham_isEquivalence. The node asks for two parts beyond the target. The first is the stability that (3) and (5) presuppose, under f_+, f_!, f^† and the external product; the target presupposes it, its route uses it for (1) too (“proper direct image and induction on the support”), and no accepted roadmap states it as a target. Neither roadmap defines the external product of D-modules; (5) states it. The roadmap requests the stability from SpringerResolutionAndCharacteristicCycles, whose text does not state it: “What SpringerResolutionAndCharacteristicCycles must provide (gap:regular-holonomic-stability): stability of the bounded derived category with regular holonomic cohomology under f_+, f_!, arbitrary f^†, external product and restriction to the diagonal, for algebraic maps of smooth complex varieties.” If the review of Tau Ceti declines the stability as outside the two roadmaps, it comes back through prompts/change.md. The same stability, with that under the !-tensor product, for the crystals on the schemes of finite type over every field of characteristic 0, is a theorem of DModules.IsRegularHolonomic, which is written here. For the left modules on smooth schemes over the complex numbers the two are one theorem ([HottaTakeuchiTanisaki] Theorem 6.1.5 for the direct and inverse images), and it is not proved twice. Order of work: this node is not taken up, and the stability theorem of DModules.IsRegularHolonomic is not written, before the provider of the stability for the left modules on smooth complex schemes is decided with prompts/change.md. That change chooses the provider of that case and the route of the theorem written here; this node chooses neither. One candidate is a roadmap node of its own for the request, in the area SpringerResolutionAndCharacteristicCycles, as a prerequisite of this node and of DModules.IsRegularHolonomic. It moves a case of a theorem that the plan writes here, so it is a change of provider. The second part beyond the target is (6). The target does not state it; its route names it as the base case (“on the smooth locus the base case is `deligneRiemannHilbert`”). Its inputs are the Poincaré lemma for a holomorphic connection and ComplexComparisonPartII C5.6 `deligneRiemannHilbert`, an equivalence from the regular singular integrable algebraic connections to the local systems of finite-dimensional complex vector spaces. C5.6 tests regularity on all maps from smooth curves, and (a) of DModules.regularHolonomicDModule on the smooth locally closed curves; the proof of (6) includes that the two tests agree for a vector bundle with an integrable connection. If the review of Tau Ceti declines (6), it comes back through prompts/change.md. Inputs that §1.5 names: “1.2, 1.3; SpringerResolutionAndCharacteristicCycles §§9.1, 9.2, 9.4, 9.7 and gap:regular-holonomic-stability; ResolutionOfSingularitiesCharacteristicZero §§5.1, 5.2; ComplexComparisonPartII §C5.6 (`deligneRiemannHilbert`, `CanonicalLogExtension`)”. The route of §1.5: “construct the inverse by Kashiwara's tempered solutions; reduce biduality to a local system on the complement of a normal crossing divisor by embedded resolution and principalization, proper direct image and induction on the support; on the smooth locus the base case is `deligneRiemannHilbert`; algebraize the regular meromorphic extension and translate the solution comparison to pDR by duality”. Of the inputs, §§1.2, 1.3, 9.1, 9.2, 9.4 and 9.7 are plan nodes; the stability request, the resolution of singularities and C5.6 are not. In Tau Ceti at the pin: no analytification of a scheme, no analytic D-module, no perverse sheaf and no de Rham functor of D-modules (searched in the pinned sources of Tau Ceti: “analytification”, `ComplexAnalyticSpace`, “perverse”, “Riemann–Hilbert”, “regular singular”, “holonomic”; the matches are the Riemann–Hilbert problem on the unit disc, regular singular points of complex ordinary differential equations, D-finite power series, and two module comments that mention analytification).'''
deps = ['GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.DModules.coherentDModule', 'GLCinLean.DModules.transferModule', 'GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.regularHolonomicDModule']
source = '[HottaTakeuchiTanisaki] Theorem 7.2.2 (the equivalence, for a smooth algebraic variety; its proof is called a sketch, Remark 7.2.3), Theorem 7.2.5 (the regular holonomic modules and the perverse sheaves), Theorem 7.1.1 (direct and inverse images), formula (7.1.1) (duality), Proposition 4.7.8 (external product) and Theorem 6.1.5 (the stability), §1.5 (the external tensor product), Theorem 4.2.4 (the de Rham complex of an integrable connection on a complex manifold is its local system of horizontal sections, shifted) and Theorem 5.3.8 with Corollary 5.3.10 (regular integrable connections on a smooth algebraic variety and local systems); these numbers were compared with the English edition, and the book is not in references/. The roadmap cites M. Kashiwara, The Riemann–Hilbert problem for holonomic systems, Publ. RIMS 20 (1984), §§6–7, and A. Dimca, Sheaves in Topology (Springer, 2004), Theorems 5.3.1 and 5.3.3; neither is in docs/references.bib'
