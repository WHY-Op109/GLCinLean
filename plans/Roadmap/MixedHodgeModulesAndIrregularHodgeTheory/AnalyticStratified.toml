desc = 'Constructible complexes along a fixed stratification of the complex points of a separated C-scheme of finite type, good stratifications, and the restricted perverse t-structure. Owner: the Tau Ceti roadmap MixedHodgeModulesAndIrregularHodgeTheory.'

[[node]]
id = 'GLCinLean.Constructible.StratifiedDerivedCategory'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C, a field E and a finite stratification S of Y by locally closed subvarieties: the full subcategory D^b_S(Y, E) of D^b_c(Y, E) (Constructible.DerivedCategory) of the complexes whose cohomology sheaves are locally constant of finite rank on each stratum. It is a triangulated subcategory, and a direct summand in D^b_c(Y, E) of an object of D^b_S(Y, E) is in D^b_S(Y, E); both hold for every S. Let S have the frontier condition and smooth connected strata. S is good with coefficients E if, for every stratum inclusion j_T and every local system L of finite rank over E on T(C), Rj_{T*}L is in D^b_S(Y, E). The extension by zero j_{T!}L is always in D^b_S. Goodness is equivalent to Verdier duality preserving D^b_S, since D^b_S is generated by the shifts of the j_{T!}L and 𝔻(j_{T!}L) ≃ Rj_{T*}(L^∨)[2 dim T]. For a good S: (1) the perverse truncation functors of Constructible.PerverseSheaves preserve D^b_S(Y, E), so D^b_S has the induced t-structure in the sense of Mathlib (`ObjectProperty.HasInducedTStructure`, `ObjectProperty.tStructure`); no second t-structure is constructed. (2) Its heart has finite length, and its simple objects are the IC(T̄, L) for the strata T and the irreducible local systems L on T; these are simple among all perverse sheaves. (3) Hence the heart is closed under subquotients in the perverse sheaves of D^b_c: the constituents of a subquotient are among those of the object, and D^b_S is closed under extensions. (4) For a locally closed union U of strata with inclusion j, let S|U be the stratification of U by the strata of S that lie in U; it is good. Then j^* and j^! carry D^b_S(Y, E) into D^b_{S|U}(U, E), and Rj_* and j_! carry D^b_{S|U}(U, E) into D^b_S(Y, E). (5) The intermediate extension j_!* of Constructible.PerverseSheaves is defined on perverse sheaves only. It carries the heart of D^b_{S|U}(U, E) into the heart of D^b_S(Y, E), by (4), (1) and (3). The union must be locally closed: in the plane with strata a line minus a point, that point, and the complement of the line, the union of the complement and the point is not locally closed. Whitney stratifications with connected strata are good by stratified local triviality. The orbit cases used in this plan follow from Constructible.isGood_orbitStratification. Without goodness these statements can fail: for the Whitney umbrella x² = y²z with strata the z-axis and its complement, the degree-zero cohomology sheaf of Rj_* of the constant sheaf on the complement has stalk rank 2 along the axis away from 0 and rank 1 at 0, and the IC sheaf and the !-restriction of the constant sheaf to the axis are not in D^b_S. Checks: for Y smooth and connected with the one stratum Y, which is good, D^b_S is the complexes with locally constant cohomology of finite rank and the simple objects of the heart are the L[dim Y] for L irreducible; for the line with strata the origin and its complement, which is good, the heart contains Rj_*E[1] and j_!E[1] for the inclusion j of the complement. Provider: roadmap MixedHodgeModulesAndIrregularHodgeTheory, as a prerequisite and not a named target. The node is a full subcategory of the category of its §1.2 (Constructible.DerivedCategory), with the t-structure induced from its §1.3 (Constructible.PerverseSheaves). §1.3 defines the perverse t-structure by conditions on the strata of “an algebraic Whitney stratification”, proves “independence of the adapted stratification”, and names the route “glue the support and cosupport truncations over strata by recollement (1.2)”. §1.1 gives the algebraic Whitney stratifications, and it states the local triviality of a proper map over the strata of its target. That a Whitney stratified space is locally trivial along each of its strata, from which the goodness of Whitney stratifications follows, is the first isotopy lemma of Thom with control data: AlgebraicTopologyPartII §§16.1a–16.1e, which §1.1 lists under its needs and which is not a plan node. The roadmap does not name the category of a fixed stratification, goodness, or (1) to (5). If the review of Tau Ceti declines the node as outside the roadmap, it comes back through prompts/change.md. One accepted target of another roadmap needs it. SpringerResolutionAndCharacteristicCycles §11.3 defines a de Rham functor to the “complexes on F(C) constructible along the Schubert cells”, exact for the perverse t-structure, that “commutes with the extensions j_!, j_* and j_!* along the inclusion of each cell”. EtaleDualityAndPerverseSheaves §5.9 states the same condition on the strata for the étale side: it defines its restricted categories D^b_{T,L} by this condition on the strata of a fixed stratification, for étale ℓ-adic coefficients with a condition on the constituents, and compares them with the analytic side by its §3.5; the étale category with its condition on constituents is not this node. In Tau Ceti: finite stratifications of a topological space by locally closed subsets, with refinement, common refinement and pullback (`TauCeti.FiniteStratification`), and the sheaves on a site that are locally constant with values in a class of objects (`CategoryTheory.Sheaf.IsLocallyConstantIn`). Upstream declarations used: `TauCeti.FiniteStratification` (`TauCeti.Topology.Stratification`), `CategoryTheory.Sheaf.IsLocallyConstantIn` (`TauCeti.CategoryTheory.Sites.LocallyConstant.Basic`), `CategoryTheory.ObjectProperty.HasInducedTStructure` and `CategoryTheory.ObjectProperty.tStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Induced`).'
deps = ['GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves']
