desc = 'The middle perverse t-structure on constructible complexes on the complex points of a C-scheme, with intermediate extensions and intersection complexes. Owner: the Tau Ceti roadmap MixedHodgeModulesAndIrregularHodgeTheory.'

[[node]]
id = 'GLCinLean.Constructible.PerverseSheaves'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C and a field E: the middle-perversity t-structure on D^b_c(Y, E) of Constructible.DerivedCategory, as a Mathlib t-structure on that triangulated category. K is in the part ≤ 0 when the support of the cohomology sheaf ℋ^m(K) has dimension at most −m for every m, and in the part ≥ 0 when its Verdier dual is in the part ≤ 0. For a stratification by smooth connected locally closed subvarieties along which the cohomology sheaves of the *- and !-restrictions of K are locally constant, the two conditions are: ℋ^m(i_T^*K) = 0 for m > −dim T, and ℋ^m(i_T^!K) = 0 for m < −dim T, on every stratum T. With it: the heart of perverse sheaves, in which every object has finite length; the perverse cohomology functors pH^i; the intermediate extension j_!* of a perverse sheaf P along a locally closed embedding j, as the image of pH^0(j_!P) → pH^0(Rj_*P) in the heart; it is a functor between the hearts and is not defined on all of D^b_c; the intersection complex IC(Z, L) = j_!*(L[dim U]) of a local system L of finite rank on a smooth connected locally closed subvariety U with closure Z. The simple perverse sheaves are the IC(Z, L) with L irreducible. Checks: on a point it is the standard t-structure; for Y smooth and connected of dimension d and L a local system of finite rank on Y, L[d] is perverse and equals IC(Y, L), and for a smooth Y that is not connected the shift is by the dimension of each component (on the disjoint union of a line and a point, the constant sheaf shifted by 1 is not perverse); for the inclusion j of C^× in C, Rj_*E[1] is perverse and is a non-split extension of the skyscraper at the origin by E_C[1]. Provider: roadmap MixedHodgeModulesAndIrregularHodgeTheory, §1.3 “Middle perverse sheaves”, a named target: “For an algebraic Whitney stratification with strata S of complex dimension s, the middle perverse t-structure on D^b_c(X, Λ) has pD^{≤0} given by H^j(i_S^* K) = 0 for j > −s and pD^{≥0} by H^j(i_S^! K) = 0 for j < −s. Prove independence of the adapted stratification, boundedness, nondegeneracy and self-duality under D_X; the heart Perv(X, Λ) is abelian of finite length. Construct perverse cohomology pH^j and intermediate extension j_!* L = im(pH⁰ j_! L → pH⁰ Rj_* L) for a locally closed immersion j. For a local system L on a smooth d-fold, L[d] is perverse”; in its interface: “j_!* L is the unique extension of L with no nonzero subobject or quotient supported on the boundary” and “Verdier duality is t-exact on the heart and exchanges pH⁰ j_! and pH⁰ Rj_*”. The target and this node, clause by clause. The t-structure is the same. The target defines it by the two conditions on the strata of a Whitney stratification to which K is adapted, and proves that it does not depend on the stratification. This node defines the part ≤ 0 by the dimension of the supports and the part ≥ 0 by duality, and states the two conditions on strata as a consequence. On a smooth stratum T of dimension s, duality carries a complex with locally constant cohomology sheaves of finite rank to one whose cohomology sheaf in degree j is dual to that in degree −j − 2s, so the condition on i_T^! K is the condition on i_T^* of the dual of K. The same in both: the finite length of the heart, pH^i, j_!* with its formula, and the checks on a point and for L[d]. The target states more than this node: boundedness and nondegeneracy; the characterization of j_!* above; in its interface, “Perverse truncation triangles exist and give a long exact sequence of perverse cohomology”, which holds for every t-structure, and the exchange of pH⁰ j_! and pH⁰ Rj_* by duality, which follows from the definition of this node with the exchange of 𝔻 in (3) of Constructible.DerivedCategory; and that ℚ_D[d − 1] is perverse for a reduced divisor D in a smooth d-fold. The checks of this node for a smooth scheme that is not connected and for Rj_*E[1] on the line are not in the target. This node asks for more than the target states: every coefficient field E, where the target has ℚ and ℂ; the two conditions on strata for every stratification by smooth connected strata along which the *- and !-restrictions of K have locally constant cohomology, where the target has the Whitney stratifications; the name IC(Z, L) for j_!*(L[dim U]); and the classification of the simple perverse sheaves ([BBD] Théorème 4.3.1), whose proof uses the characterization of j_!* above. Constructible.StratifiedDerivedCategory (2) and Constructible.exists_iso_directSum_ic_properPushforward use the classification. If the review of Tau Ceti declines one of these parts as outside the roadmap, that part comes back through prompts/change.md. Other accepted roadmaps use this heart and do not construct it: EtaleDualityAndPerverseSheaves §3.5 `complexAnalyticComparison`, which gives the perverse comparison for finite and integral coefficients and, for rational E, an equivalence onto the monodromy-stable-lattice essential image, and preserves j_!* and IC in these ranges, and its §5.9, which defines geometric origin for simple perverse sheaves of complex vector spaces. That roadmap states the étale t-structure, intermediate extensions and intersection complexes in its §§2.4, 2.8 and 2.10, and the abstract gluing of t-structures in its §§2.2–2.3. Inputs that §1.3 names: “1.1, 1.2”. Upstream declarations used: `CategoryTheory.Triangulated.TStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Basic`).'
deps = ['GLCinLean.Constructible.DerivedCategory']
source = '[HottaTakeuchiTanisaki] Chapter 8 (perverse sheaves); [BBD] §§2.1–2.2 and Théorème 4.3.1 (not pinned; the roadmap EtaleDualityAndPerverseSheaves cites Théorème 4.3.1 in its §2.10, check the numbers before use). The roadmap of this node cites A. Dimca, Sheaves in Topology (Springer, 2004), §§5.1–5.2, which is not in docs/references.bib'
