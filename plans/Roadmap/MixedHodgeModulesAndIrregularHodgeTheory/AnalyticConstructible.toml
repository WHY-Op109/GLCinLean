desc = 'Constructible complexes on the complex points of separated C-schemes of finite type, as an ordinary triangulated theory with its operations. Owner: the Tau Ceti roadmap MixedHodgeModulesAndIrregularHodgeTheory.'

[[node]]
id = 'GLCinLean.Constructible.DerivedCategory'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C and a field E: the bounded derived category D^b_c(Y, E) of sheaves of E-vector spaces on Y(C) (Constructible.ComplexPoints) whose cohomology sheaves are constructible for some algebraic stratification, with stalks of finite rank. It is a full triangulated subcategory of the derived category of sheaves of E-vector spaces on Y(C). The plan uses it as an ordinary triangulated category and never as an enhanced one. The roadmap defines it inside “the derived category of sheaves of Λ-modules on X^an (EnhancedDerivedSheaves §0.1)”. That section provides the enhanced derived category of the sheaves of modules on a ringed site, with its homotopy category identified with the `DerivedCategory` of Mathlib; the triangulated category of this node is the full subcategory of that homotopy category. The maps below are maps of schemes over C. Operations, each preserving D^b_c: (1) f^*, Rf_*, Rf_! and f^! along every map f, with the adjunctions f^* ⊣ Rf_* and Rf_! ⊣ f^!, with Rf_! ≅ Rf_* for proper f, and, for composable maps f and g, with the isomorphisms (g ∘ f)^* ≅ f^* g^*, R(g ∘ f)_* ≅ Rg_* Rf_*, R(g ∘ f)_! ≅ Rg_! Rf_! and (g ∘ f)^! ≅ f^! g^!; (2) the tensor product and the internal Hom RHom; (3) Verdier duality 𝔻 = RHom(−, a^!E) for the map a to the point, with 𝔻𝔻 ≅ id, and the external product p_1^*(−) ⊗ p_2^*(−). 𝔻 exchanges f^* with f^! and Rf_* with Rf_!: 𝔻 f^* ≅ f^! 𝔻 and 𝔻 Rf_! ≅ Rf_* 𝔻; this follows from (1), (2) and (5). Identities: (4) base change for Rf_!: for f : X → Y, every g : Y′ → Y, and the base changes f′ : X′ → Y′ and g′ : X′ → X in the Cartesian square, g^* Rf_! ≅ Rf′_! g′^*; for a proper f this is base change for Rf_*; (5) the projection formula Rf_!(K ⊗ f^*L) ≅ Rf_!K ⊗ L. Base change for Rf_* along an arbitrary Cartesian square is false: for the inclusion j of C^× in C and the inclusion i of the origin, i^*Rj_*E ≅ E ⊕ E[−1], and the fibre is empty. (6) Hom in D^b_c is computed by derived global sections of RHom. (7) For a smooth map g of relative dimension d, g^! ≅ g^*[2d]. For the structure map a : X → pt of a smooth scheme, (a^!E)|_C ≅ E_C[2 dim C] on each connected component C. In particular a^!E ≅ E_X[2d] when X is smooth of pure dimension d. With (4) and the adjunctions of (1) this gives smooth base change for Rf_*: in the Cartesian square of (4) with g smooth of relative dimension d, g^* Rf_* ≅ Rf′_* g′^*, because the right adjoints of the two sides of f^* Rg_! ≅ Rg′_! f′^* are g^! Rf_* and Rf′_* g′^!. (8) For a closed immersion i with open complement j, the distinguished triangles i_* i^! K → K → Rj_* j^* K and j_! j^* K → K → i_* i^* K, functorial in K. With i^* i_* ≅ id, which is (4) for f = g = i, the second triangle shows that i_* is an equivalence from D^b_c of the closed subscheme to the full subcategory of the objects of D^b_c(Y, E) whose restriction to the open complement is zero, with inverse i^*. Checks: Rj_*E above is in D^b_c; on a point, D^b_c is the bounded derived category of finite-dimensional E-vector spaces. What uses what: the definition of geometric origin (EtaleDualityAndPerverseSheaves §5.9) uses (1) and (2). DModules.analyticDeRham and DModules.analyticDeRham_isEquivalence use the composition isomorphisms of (1), the base change (4) and (8). Constructible.PerverseSheaves and Constructible.StratifiedDerivedCategory use (3) with the exchange of 𝔻, and so (5); (4) for locally closed embeddings; and (7) for open embeddings (d = 0) and for the map to the point from a smooth scheme. The exchange in (3) for a map f uses (5) for that map. The local comparison, stratified-map, orbit-goodness and Bott–Samelson nodes (DModules.analyticDeRham_isEquivalence, Constructible.IsStratifiedMap, Constructible.isGood_orbitStratification, AffineGrassmannian.isEven_bottSamelsonPushforward) use further instances of base change and smooth purity, derived global Hom, external products or general coefficient fields. The complex-analytic geometric-origin and decomposition statements of EtaleDualityAndPerverseSheaves §§5.9–5.10 require only part of this interface. Provider: roadmap MixedHodgeModulesAndIrregularHodgeTheory, §1.2 “Algebraically constructible Betti complexes and the six operations”, a named target: “For a separated complex variety X and Λ ∈ {ℚ, ℂ}, let D^b_c(X, Λ) be the full subcategory of the derived category of sheaves of Λ-modules on X^an (EnhancedDerivedSheaves §0.1) of complexes with bounded cohomology whose cohomology sheaves have finite-dimensional stalks and are locally constant on the strata of some finite algebraic stratification. Construct, for algebraic maps, f^*, Rf_*, Rf_!, f^!, derived tensor product, internal Hom, external product and Verdier duality D_X = RHom(−, f^! Λ) for f : X → pt, with the adjunctions, composition, proper base change, the projection formula and the two localization triangles of an open–closed decomposition.” Its varieties are “separated schemes of finite type over ℂ”, and X^an is `complexSchemeAnalytification` of ComplexComparisonPartII, whose space §C−1.1 identifies with Constructible.ComplexPoints. The target and this node, clause by clause. The same in both: the schemes; the space; the condition on the cohomology sheaves; (1), where the target says “composition” for the isomorphisms of composable maps, and Rf_! ≅ Rf_* for a proper f holds by the construction of Rf_! (“after factoring f as an open immersion followed by a proper map”); (2); the definition of 𝔻 and the external product in (3); (5); (8); and the check on a point. The counterexample to base change for Rf_* and the check that Rj_*E is in D^b_c are checks of this node; the target does not have them. (4): the target states “proper base change” and, in its interface, “For f proper and any algebraic base change g, the base-change map g^* Rf_* → Rf′_* g′^* is an isomorphism”; (4) for every f follows from this, from the factorization of f, and from the base change of the extension by zero along an open immersion. The target states more than this node: the change of coefficients − ⊗_ℚ ℂ, which commutes with the six operations; the sections with support in a closed Z, “RΓ_Z = i_* i^!”, with the triangle of RΓ_Z(X, K), RΓ(X, K) and RΓ(X ∖ Z, K), and its checks on the cohomology of the affine line; and, in its route, that the operations are those of the derived categories of sheaves on the spaces of complex points: “the operations come from EnhancedDerivedSheaves §§0.1–0.4 and §E1.4 on the topological carriers of ComplexComparisonPartII §C-1.1; Rf_! uses the compact-support theory of ComplexComparisonPartII §C6.1 after factoring f as an open immersion followed by a proper map (a dense compactification, EtaleCohomologyFoundations §§G.1–G.2), and f^! is its right adjoint”. The nodes of the plan that argue with stalks and with the exactness of the pullback of sheaves use this. This node asks for more than the target states, for the nodes of this plan: (i) every coefficient field E, where the target has ℚ and ℂ (the decomposition theorem, the de Rham comparison and the parity of IC stalks use E = ℂ; the nodes written here that are stated for every E use no property of the field); (ii) 𝔻𝔻 ≅ id and the exchange of 𝔻 in (3): the target constructs D_X and cites for it Dimca, Sheaves in Topology, “Definition 3.2.1 and Theorem 3.2.3, p. 62, and Theorem 3.3.10, p. 69”, and its §1.3 uses “self-duality under D_X”; (iii) (6); (iv) (7) for a smooth map of positive relative dimension, with the smooth base change for Rf_*: the target has the check “For X smooth of dimension d, D_X(ℚ_X[d]) = ℚ_X[d]”, which is the case of the map to the point. If the review of Tau Ceti declines one of (i) to (iv) as outside the roadmap, that part comes back through prompts/change.md. Other accepted roadmaps use the category and do not construct it: EtaleDualityAndPerverseSheaves §3.5 `complexAnalyticComparison`, which compares étale complexes with finite, integral and ℓ-adic coefficients with the analytic D^b_c, and its §§5.9–5.10, which work in D^b_c(X(ℂ), ℂ) (Constructible.exists_iso_directSum_ic_properPushforward). The roadmap of this node says of that roadmap: “it constructs neither the rational nor the complex category. Layer 1 constructs both, for Λ ∈ {ℚ, ℂ}, in the derived category of Λ-module sheaves on T_X (EnhancedDerivedSheaves §0.1) with the same stalk and costalk conditions on strata, so that the complex category and heart of that §5.9 are those of 1.2 and 1.3.” Inputs that §1.2 names: “1.1; EnhancedDerivedSheaves §§0.1–0.4, E1.4; ComplexComparisonPartII §§C-1.1, C6.0, C6.1; EtaleCohomologyFoundations §§G.1–G.2; Mathlib `DerivedCategory`”. Its §1.1 stratifies an algebraic map by Whitney strata over which the map is locally trivial, and the target gets the constructibility of Rf_* and Rf_! from it. ComplexComparisonPartII has the triangulations compatible with algebraic stratifications (§C6.0 `complexAlgebraicTopology`), and extension by zero, compactly supported cohomology and Rf_! for sheaves of modules over any commutative ring (§C6.1). Hyperfunctions HF3a has f_! with proper base change and the tensor projection formula for sheaves of C-vector spaces on finite-dimensional locally compact Hausdorff spaces, and §C6.1 must agree with it. Of these inputs the space is a plan node (Constructible.ComplexPoints). Two more are plan nodes, and this node depends on them, because the route of the target takes the carrier and the direct image from them: Infinity.enhancedDerivedCategory (EnhancedDerivedSheaves E1.3, with the equivalence of its homotopy category with the `DerivedCategory` of Mathlib; the category of this node is a full subcategory of that homotopy category), and Infinity.derivedBimoduleTransfer, whose (2) is the direct image Rf_* of E1.4 for a continuous map and sheaves of rings, here the constant sheaves E. The pullback, the tensor product, the internal Hom and the change of coefficients of E1.4 for a sheaf of commutative rings, and the other inputs, are not plan nodes. In Tau Ceti: the exact extension by zero from an open subset, as the left adjoint of restriction on a preorder site (`TauCeti.CategoryTheory.SheafExtensionByZero.isRightAdjoint_sheafPushforwardContinuous_forget`, and for sheaves of modules `SheafOfModules.isRightAdjoint_pushforward_over`). Upstream declarations used: `TopCat.Sheaf` (`Mathlib.Topology.Sheaves.Sheaf`), `DerivedCategory` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `TauCeti.CategoryTheory.SheafExtensionByZero.isRightAdjoint_sheafPushforwardContinuous_forget` (`TauCeti.CategoryTheory.Sites.ExtensionByZero.Basic`), `SheafOfModules.isRightAdjoint_pushforward_over` (`TauCeti.Algebra.Category.ModuleCat.Sheaf.ExtensionByZero`).'
deps = ['GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.derivedBimoduleTransfer']
