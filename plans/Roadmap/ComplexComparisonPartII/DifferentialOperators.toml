desc = 'The sheaf of rings of differential operators of a scheme over a commutative ring, with its order filtration. Owner: the Tau Ceti roadmap ComplexComparisonPartII.'

[[node]]
id = 'GLCinLean.DModules.differentialOperators'
kind = 'definition'
desc = '''Let k be a commutative ring and X a scheme over k, with no hypothesis on the characteristic, on smoothness or on finiteness. For an open U of X and m ≥ 0, a k-linear map of sheaves P : O_U → O_U has order at most m when, for every open V of U and all sections a_0, …, a_m of O_X over V, the iterated commutator [⋯[[P, a_0], a_1] ⋯, a_m] is zero on V, where [P, a] = P ∘ (a·) − (a·) ∘ P. These maps are the sections over U of a sheaf F_m D_X of k-modules on X. F_0 D_X = O_X (the multiplications), F_m D_X ⊆ F_{m+1} D_X, and the composite of a section of F_p D_X with a section of F_q D_X is a section of F_{p+q} D_X. D_X is the sheaf of the k-linear maps O_U → O_U that have locally an order at most some m: a sheaf of rings under composition, in general not commutative, with the ring map O_X → D_X and the filtration by the F_m D_X. For an affine open U = Spec A, taking global sections is a bijection from the sections of F_m D_X over U to the operators of order at most m of the k-algebra A (`TauCeti.differentialOperators k A A A m`), because such an operator extends in exactly one way to every localization of A. Checks. For X = Spec k, D_X = O_X. For X = Spec k[x] with k not the zero ring, [d/dx, x] = 1, so d/dx is a section of F_1 D_X and not of F_0 D_X; when 2 ≠ 0 in k, (d/dx)² is a section of F_2 D_X and not of F_1 D_X (`TauCeti.derivative_comp_derivative_notMem_differentialOperators_one`). For the empty scheme D_X is the zero ring. Users: DModules.coherentDModule and the roadmap nodes above it, for k a field of characteristic 0 and X smooth; DModules.rightCrystals_equiv_dModules. Provider: roadmap ComplexComparisonPartII, C5.1 “The ordinary comparison”, the passage “Shared algebraic operators and principal parts — `IsDifferentialOperator`” (“This is the ordinary algebraic foundation, and C5.1 is its single owner”): the order predicate, with “the composition bound (orders add) and localization/sheafification on schemes” and “Every individual finite-order operator extends uniquely to localized coefficient modules”. SpringerResolutionAndCharacteristicCycles §8.1 takes from it “the order-filtered sheaf D_Y of ordinary algebraic differential operators of ComplexComparisonPartII C5.1”. In Tau Ceti at the pin, for a k-algebra A and A-modules M and N, with no scheme: the k-submodule of the k-linear maps M → N of order at most m, the equivalent condition by iterated commutators, and the bound for a composite. The predicate `IsDifferentialOperator k A m D` of the roadmap is membership of D in `TauCeti.differentialOperators k A M N m`. For a scheme X over a commutative ring k, Tau Ceti at the pin has: the sheaves F_m D_X of the operators of order at most m, `AlgebraicGeometry.Scheme.differentialOperators` (an endomorphism of the structure sheaf over U has order at most m when its component on every open V in U has order at most m); the identification of the operators of order zero with O_X by multiplication, `AlgebraicGeometry.Scheme.differentialOperatorsZeroIso`; the sheaf of rings D_X, `AlgebraicGeometry.Scheme.sheafOfDifferentialOperators`, with the ring map from O_X; and on `Spec k[X]` the operator d/dX with its order, `TauCeti.derivativeEnd`. Not at the pin: the k-module structure on F_m D_X, the comparison of the sections of F_m D_X over an affine open with the operators of its ring of sections, the check D_X = O_X for Spec k, and the extension to a localization of an operator that is not a derivation (a derivation extends by `Derivation.extendOfIsLocalization`). Searched in the pinned sources of Tau Ceti and Mathlib: `IsDifferentialOperator`, `DifferentialOperator`, `differentialOperators`, `PrincipalParts`, “differential operator”; under `TauCeti/AlgebraicGeometry/` the only matches are `PrincipalParts` of Weil divisors, which are principal parts of rational functions. The open Tau Ceti #43231 (head `e1859398`, waiting for its author) adds the modules of principal parts and the extension of an operator to a localization, moves the module `TauCeti.RingTheory.Derivation.DifferentialOperator` to `TauCeti.RingTheory.Derivation.DifferentialOperator.Basic`, and names “sheafifying algebraic differential operators on schemes” as what remains. Of what is still to do, the comparison over an affine open waits for #43231, which adds the extension of an operator to a localization and its uniqueness; the check for Spec k and the k-module structure do not wait for it. Upstream declarations used: `TauCeti.differentialOperators`, `TauCeti.mem_differentialOperators_iff_forall_list_prod`, `TauCeti.comp_mem_differentialOperators` and `TauCeti.derivative_comp_derivative_notMem_differentialOperators_one` (`TauCeti.RingTheory.Derivation.DifferentialOperator`), `AlgebraicGeometry.Scheme.differentialOperators`, `AlgebraicGeometry.Scheme.differentialOperatorsZeroIso` and `AlgebraicGeometry.Scheme.sheafOfDifferentialOperators` (`TauCeti.AlgebraicGeometry.DifferentialOperator.Basic`), `TauCeti.derivativeEnd` (`TauCeti.AlgebraicGeometry.DifferentialOperator.Spec`), `Derivation.extendOfIsLocalization` (`TauCeti.RingTheory.Derivation.Localization`).'''
source = '[Crystals] §5.4 (the classical sheaf of differential operators, there for a smooth classical scheme)'
