[[node]]
id = 'GLCinLean.Infinity.stableCategory'
kind = 'definition'
desc = 'Pointed enhanced categories with finite limits and colimits and coincident pullback and pushout squares. Provider: roadmap GeneralizedCohomology, G2.11, “Coherent model diagrams and stable enhancements”: “Define a pointed infinity category by a zero object, both initial and terminal. Define it to be stable when it has finite limits and colimits and a square is a pushout exactly when it is a pullback”. The definition uses the limit cones and the colimit cocones of a diagram, which Tau Ceti has as the terminal vertices of the slice and the initial vertices of the coslice. It does not use the characterization of limits by mapping spaces (Infinity.limits), so the node has no dependency. The nodes that use functors of limits in a stable category (fibres, cofibres, suspension) depend on Infinity.limits themselves. In Tau Ceti at the pin: no zero vertex, no predicate that all finite diagrams have limits and colimits, no isomorphism of the square `Δ[1] ⊗ Δ[1]` with the cone on the cospan `Λ[2, 2]` or with the cocone on the span `Λ[2, 0]`, and no stability predicate. Upstream declarations used: `SSet.slice.IsLimit` and `SSet.coslice.IsColimit` (`TauCeti.AlgebraicTopology.Quasicategory.Limit`), `SSet.IsTerminalVertex` (`TauCeti.AlgebraicTopology.Quasicategory.TerminalVertex`), `SSet.IsInitialVertex` (`TauCeti.AlgebraicTopology.Quasicategory.InitialVertex`), `SSet.join` (`TauCeti.AlgebraicTopology.SimplicialSet.Join.Basic`), `SSet.Finite` (`Mathlib.AlgebraicTopology.SimplicialSet.Finite`), `TauCeti.dgNerve` (`TauCeti.AlgebraicTopology.DGNerve.Basic`).'
source = '[IndCoh] §0.6.4'
