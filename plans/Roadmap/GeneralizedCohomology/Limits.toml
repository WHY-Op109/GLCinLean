id = 'GLCinLean.Infinity.limits'
kind = 'definition'
desc = 'Small limits and colimits characterized by mapping-space universal properties. Provider: roadmap GeneralizedCohomology, G2.11, “Coherent model diagrams and stable enhancements”. In Tau Ceti: limit cones and colimit cocones of a diagram in a simplicial set, as terminal and initial vertices of the slice and the coslice, `SSet.slice.IsLimit` and `SSet.coslice.IsColimit` (`TauCeti.AlgebraicTopology.Quasicategory.Limit`), with their uniqueness up to equivalence. Also at the pin, in the same module: uniqueness `SSet.slice.IsLimit.isEquivalence` and `SSet.slice.IsLimit.nonempty_edge`, the duality `SSet.coslice.isColimit_iff_isLimit_op`, and for the nerve of a category the comparison `SSet.slice.isLimit_iff_nonempty_isTerminal` (`TauCeti.AlgebraicTopology.Quasicategory.Limit`). The diagram `p : K ⟶ C` and the quasicategory `C` are in one universe, so a small diagram in a large quasicategory is indexed by a universe lift `SSet.uliftFunctor` (`Mathlib.AlgebraicTopology.SimplicialSet.Basic`). A limit cone is a terminal vertex of the slice in the sense of `SSet.IsTerminalVertex` (`TauCeti.AlgebraicTopology.Quasicategory.TerminalVertex`), the filling condition of Joyal, not a condition on mapping spaces. Further at the pin: the map of slices `SSet.slice.map` (`TauCeti.AlgebraicTopology.SimplicialSet.Slice`), the pullback and pushout squares `SSet.IsPullbackSquare` and `SSet.IsPushoutSquare` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`), and the final maps `SSet.IsFinal` (`TauCeti.AlgebraicTopology.Quasicategory.Final`), without the theorem that restriction along a final map keeps colimits. Still to do: the characterization by mapping spaces (item `limit-mapping-space-criterion` of `docs/worker-targets/targets.md`), and the predicates that a quasicategory has all small limits and colimits and that a map preserves them (item `small-limits-and-colimits`).'
deps = ['GLCinLean.Infinity.mappingSpaces']
source = '[IndCoh] §§0.6.2–0.6.4'
