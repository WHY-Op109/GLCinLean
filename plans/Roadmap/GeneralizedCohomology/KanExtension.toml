desc = 'Coherent right Kan extensions of enhanced categories. Owner: the Tau Ceti roadmap GeneralizedCohomology, G2.11 “Enriched, quasicategorical and monoidal foundations”.'

[[node]]
id = 'GLCinLean.Infinity.rightKanExtension'
kind = 'definition'
desc = 'Right Kan extension of coherent diagrams into a category with the needed limits, computed objectwise by limits over the appropriate slice infinity-categories, with restriction and uniqueness equivalences; presentable targets are an instance. Ordinary Kan extension is not a substitute for this enhanced universal property. Provider: roadmap GeneralizedCohomology, G2.11, “Coherent model diagrams and stable enhancements”, which defines left and right Kan extensions by their functor-space universal properties and proves the pointwise formulas and the existence theorem; “Marked fibrations and Kan extensions” supplies the fibrations it uses; with roadmap EnhancedDerivedSheaves “Kan extensions and finality”.'
deps = ['GLCinLean.Infinity.mappingSpaces', 'GLCinLean.Infinity.limits']
source = '[IndCoh] §10.1.2'
