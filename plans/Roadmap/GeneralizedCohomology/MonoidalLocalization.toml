desc = 'The localization of a symmetric monoidal category at a class of maps that is stable under the tensor product, as a symmetric monoidal quasicategory. Owner: the Tau Ceti roadmap GeneralizedCohomology, G2.11 “Enriched, quasicategorical and monoidal foundations”.'

[[node]]
id = 'GLCinLean.Infinity.symmetricMonoidalLocalization'
kind = 'theorem'
desc = '''Let C be a symmetric monoidal category and W a class of maps of C that contains the identities, is closed under composition, and is stable under the tensor product with an object on either side (`CategoryTheory.MorphismProperty.IsMonoidal`). Let p : N(C^⊗) → N(Fin_*) be the nerve of the functor from the category of operators of C to the finite pointed sets, which is a symmetric monoidal quasicategory (Infinity.monoidalCategory; item `symmetric-monoidal-category-nerve` of `docs/worker-targets/targets.md`). An edge of N(C^⊗) over the identity of ⟨n⟩ is a family of n maps of C; let W^⊗ be the set of these edges, for all n, whose n maps are all in W. The node is the theorem that there are an inner fibration q : D^⊗ → N(Fin_*) and a map F : N(C^⊗) → D^⊗ with q ∘ F = p such that: (1) F is a localization of N(C^⊗) at W^⊗ (Infinity.IsLocalization); (2) q is a symmetric monoidal quasicategory (`SSet.SymmetricMonoidal`), and F is a symmetric monoidal functor from p to q (`SSet.SymmetricMonoidalFunctor`), that is, it sends coCartesian edges to coCartesian edges; (3) the map that F induces on the fibres over ⟨1⟩, from the nerve of C, is a localization of the nerve of C at W. By (2), the tensor product of the images of two objects X and Y of C is the image of X ⊗ Y, naturally in X and Y, and the unit is the image of the unit of C. By Infinity.IsLocalization (5), q with F is unique up to a categorical equivalence under N(C^⊗). Checks: for W the isomorphisms of C, the identity of N(C^⊗) is such an F; for the complexes of vector spaces over a field and W the quasi-isomorphisms, the result is the symmetric monoidal structure of Infinity.derivedVect. User: Infinity.derivedVect. Provider: roadmap GeneralizedCohomology, G2.11, the monoidal and fibration sub-lane of the passage “Coherent model diagrams and stable enhancements”, which states it for the cofibrant objects of a monoidal model category: “Construct the ordinary operator category with objects tuples (X₁,…,X_n) and arrows over f in Fin_* given by maps from the ordered tensor over f⁻¹(j) into the j-th target”, and “Take its ordinary nerve over N(Fin_*) and localize at the fiberwise weak-equivalence tuples. Prove the resulting map to N(Fin_*) is coCartesian with fibers the corresponding products of DK localizations”. Roadmap EnhancedDerivedSheaves E5:abstract.3 takes it as “tensor-compatible localization, its functor-space universal property”, with the reference “Nikolaus–Scholze Proposition A.5 and Theorem A.7”, and E5:abstract.4 names it “the supplied monoidal localization”. The node states it for a symmetric monoidal category with a class of maps that the tensor product preserves in each variable, which is the hypothesis that the passage of G2.11 proves for its model before it localizes. In Tau Ceti at the pin: `SSet.SymmetricMonoidal` and `SSet.SymmetricMonoidalFunctor`; in Mathlib, the localization of a monoidal category at such a class, as a monoidal category; no category of operators of a symmetric monoidal category and no localization of a quasicategory. Still to do: `symmetric-monoidal-category-nerve`, Infinity.IsLocalization, then the theorem (item `tensor-compatible-localization`). Upstream declarations used: `CategoryTheory.MorphismProperty.IsMonoidal` (`Mathlib.CategoryTheory.Localization.Monoidal.Basic`), `SSet.SymmetricMonoidal` and `SSet.SymmetricMonoidalFunctor` (`TauCeti.AlgebraicTopology.Quasicategory.SymmetricMonoidal`), `TauCeti.FinPointed` (`TauCeti.CategoryTheory.Category.Pointed.Fin`).'''
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.IsLocalization']
source = 'Nikolaus–Scholze, Proposition A.5, and [LurieHA] Proposition 4.1.7.4 (neither is pinned; the first is cited as the roadmap cites it, the second from memory)'
