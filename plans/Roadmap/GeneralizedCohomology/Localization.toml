desc = 'Localizations of a quasicategory at a set of edges. Owner: the Tau Ceti roadmap GeneralizedCohomology, G2.11 “Enriched, quasicategorical and monoidal foundations”.'

[[node]]
id = 'GLCinLean.Infinity.IsLocalization'
kind = 'definition'
desc = '''For a simplicial set C, a set W of edges of C, a quasicategory D and a map f : C → D: f is a localization of C at W when f sends every edge of W to an equivalence of D (`SSet.Edge.IsEquivalence`) and, for every quasicategory E of the universe of C and D, precomposition with f is a categorical equivalence (`SSet.QCat.IsCategoricalEquivalence`) from the functor quasicategory `(ihom D).obj E` to the full subquasicategory (`SSet.fullEnhancedSubcategory`) of `(ihom C).obj E` on the maps that send every edge of W to an equivalence of E. So a map C → E that sends W to equivalences is naturally equivalent to the composite of f with a map D → E, and that map is unique up to a contractible choice. With it: (1) invariance: for a categorical equivalence g : D → D′ of quasicategories, f is a localization at W exactly when g ∘ f is, and a map C → D that is naturally equivalent to a localization at W is one; (2) if f is a localization at W, the functor `SSet.mapHomotopyCategory f` of homotopy categories is a localization of categories at the classes of the edges of W (`CategoryTheory.Functor.IsLocalization`); (3) the identity of a quasicategory is a localization at its equivalences; (4) existence: every C and W have a localization f : C → D, and when a map p : C → B to a quasicategory sends every edge of W to a degenerate edge, D and f can be chosen with an inner fibration q : D → B such that q ∘ f = p; (5) uniqueness: for two localizations f : C → D and f′ : C → D′ at W there is a categorical equivalence g : D → D′ such that g ∘ f is naturally equivalent to f′. Checks: the map from `Δ[1]` to `Δ[0]` is a localization at the nondegenerate edge of `Δ[1]`, and it is not a localization at the empty set of edges, by (2). Users: Infinity.enhancedDerivedCategory_isLocalization, which uses the predicate, and Infinity.symmetricMonoidalLocalization, which uses (4) and (5). Provider: roadmap GeneralizedCohomology, G2.11, passage “Coherent model diagrams and stable enhancements”: “Construct relative localization (C,W) by the categorical homotopy pushout replacing the marked edges by walking equivalences. Prove its functor-space universal property”. Roadmap EnhancedDerivedSheaves E0.3 takes it as “relative localization with its full functor-space universal property”, cites this passage as one of BordismFormalGroups F6.5, and gives the references “HTT §1.2.7, §§3.1.3–3.1.4; HA Definition 1.3.4.1 and Remark 1.3.4.2”; its later sections name it “the supplied localization universal property”. The roadmap BordismFormalGroups (“Scope and ownership”) names G2.11 as the owner of the passage, “relative and Dwyer–Kan localization” included. In Tau Ceti at the pin: the notions that the definition uses, and no localization of a simplicial set or of a quasicategory. Still to do: the predicate with (1) to (3) and the checks (item `quasicategory-localization` of `docs/worker-targets/targets.md`), then (4) and (5) (item `quasicategory-localization-existence`). Upstream declarations used: `SSet.QCat.IsCategoricalEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`), `SSet.fullEnhancedSubcategory` (`TauCeti.AlgebraicTopology.Quasicategory.FullSubcategory`), `SSet.Edge.IsEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.Core`), `SSet.mapHomotopyCategory` (`Mathlib.AlgebraicTopology.SimplicialSet.HomotopyCat`), `CategoryTheory.Functor.IsLocalization` (`Mathlib.CategoryTheory.Localization.Predicate`).'''
deps = []
