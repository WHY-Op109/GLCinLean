desc = 'Continuous linear functors between module categories, and linear equivalences. Owner: the Tau Ceti roadmap GeneralizedCohomology, G2.11 “Enriched, quasicategorical and monoidal foundations”.'

[[node]]
id = 'GLCinLean.Infinity.continuousLinearFunctor'
kind = 'definition'
desc = 'Colimit-preserving coherent module functors and their natural equivalences; composition, identities and mapping spaces. Provider: roadmap GeneralizedCohomology, G2.11, “Categorical model and functor spaces” and the monoidal/fibration sub-lane inside “Coherent model diagrams and stable enhancements”, with roadmap EnhancedDerivedSheaves “Algebras, modules and the monoidal envelope”. In Tau Ceti at the pin, only the general tools: the equivalence edges `SSet.Edge.IsEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.Core`) give the natural equivalences in a functor quasicategory, and `SSet.Edge.isEquivalence_iff_forall_isEquivalence_map_evalAt` (`TauCeti.AlgebraicTopology.Quasicategory.PointwiseEquivalence`) tests them pointwise. Still to do: the quasicategory of linear functors with the full subquasicategory of those that preserve colimits (item `linear-functor-quasicategory` of `docs/worker-targets/targets.md`), and its restriction to the linear categories of Infinity.linearCategory (in the item `presentable-stable-linear-category`).'
deps = ['GLCinLean.Infinity.linearCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.limits']
source = '[GLC1] Corollary 1.6.5 and Proposition 1.7.2'

[[node]]
id = 'GLCinLean.Infinity.linearEquivalence'
kind = 'definition'
desc = 'Two-sided inverses up to coherent natural equivalence; equivalent to categorical full faithfulness and essential surjectivity. Provider: roadmap GeneralizedCohomology, G2.11, the monoidal/fibration sub-lane inside “Coherent model diagrams and stable enhancements”. In Tau Ceti at the pin, for plain maps of quasicategories: `SSet.QCat.IsCategoricalEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`), a map with an inverse up to isomorphism on both sides in the strict bicategory `SSet.QCat` of Mathlib, which is the shape asked here, with `SSet.QCat.IsCategoricalEquivalence.isEquivalence_mapHomotopyCategory` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`), and `SSet.IsFullyFaithful` (`TauCeti.AlgebraicTopology.Quasicategory.FullyFaithful`). Still to do: the criterion by full faithfulness and essential surjectivity (item `categorical-equivalence-criterion` of `docs/worker-targets/targets.md`), then its form for linear functors (item `linear-functor-equivalence`).'
deps = ['GLCinLean.Infinity.continuousLinearFunctor']
source = '[GLC1] Conjecture 1.6.7'
