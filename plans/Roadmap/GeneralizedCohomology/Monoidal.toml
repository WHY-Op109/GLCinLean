id = 'GLCinLean.Infinity.monoidalCategory'
kind = 'definition'
desc = 'Coherent monoidal enhanced categories (E₁), with a symmetric monoidal (E∞) structure as additional structure, including the unit and associativity coherences; module categories are a separate node. The spherical category acts through a monoidal structure that is not symmetric. Provider: roadmap GeneralizedCohomology, G2.11, the monoidal/fibration sub-lane inside “Coherent model diagrams and stable enhancements”, with roadmap EnhancedDerivedSheaves “Symmetric monoidal ∞-categories and ∞-operads”. G2.11 defines them with no presentability: “Define monoidal enhancements as coCartesian fibrations over N(Fin_*) with Segal fibers C^n”; a monoidal structure whose tensor product preserves colimits in each variable is a condition that its users state (Infinity.derivedVect, Infinity.linearCategory). In Tau Ceti at the pin: Cartesian edges and Cartesian fibrations of simplicial sets; coCartesian edges and coCartesian fibrations (the module `TauCeti.AlgebraicTopology.Quasicategory.CoCartesian.Basic`); the category of finite pointed sets with its inert and active maps, `TauCeti.FinPointed` (`TauCeti.CategoryTheory.Category.Pointed.Fin`); the symmetric monoidal quasicategories, as coCartesian fibrations over its nerve with the Segal condition, with their symmetric monoidal functors, `SSet.SymmetricMonoidal` and `SSet.SymmetricMonoidalFunctor` (`TauCeti.AlgebraicTopology.Quasicategory.SymmetricMonoidal`); and the ∞-operads, `SSet.InfinityOperad` (`TauCeti.AlgebraicTopology.Quasicategory.InfinityOperad`), after [LurieHA] Definition 2.1.1.10. An ∞-operad is a map p : O^⊗ → N(Fin_*) of simplicial sets with four properties: p is an inner fibration; every inert map ⟨m⟩ → ⟨n⟩ has a p-coCartesian lift with a given source over ⟨m⟩; every family of n vertices over ⟨1⟩ is the family of the targets of p-coCartesian lifts of the n inert projections ⟨n⟩ → ⟨1⟩ with one common source over ⟨n⟩; and for every such family of lifts with source y, every vertex x and every edge e from p(x) to p(y), postcomposition with the lifts is a weak homotopy equivalence from the space of the maps x → y over e to the product of the spaces of the maps from x to the targets over the composites (`SSet.InertProjectionLifts.segalMap`, built on `SSet.rightMappingSpaceOver`). With it: the maps of ∞-operads, `SSet.InfinityOperad.Hom`, which are the maps over N(Fin_*) that send the coCartesian edges over inert maps to coCartesian edges, with identities and composites; these are the lax symmetric monoidal functors between symmetric monoidal quasicategories, and a symmetric monoidal functor has an underlying one (`SSet.SymmetricMonoidalFunctor.toOperadHom`); the space of the multi-operations from a family of colours to a colour (`SSet.InertProjectionLifts.mulSpace`); an isomorphism onto N(Fin_*) is an ∞-operad, and the empty simplicial set over N(Fin_*) is none. Still to do: that a symmetric monoidal quasicategory is an ∞-operad; the ∞-operad of associative algebras, and with it the monoidal structures that are not symmetric; the restriction of a symmetric monoidal structure to a monoidal one; and that the Segal condition does not depend on the chosen transports. Upstream declarations used: `SSet.CartesianFibration` (`TauCeti.AlgebraicTopology.Quasicategory.Cartesian`), `SSet.InfinityOperad`, `SSet.InfinityOperad.Hom`, `SSet.InertProjectionLifts.segalMap` and `SSet.InertProjectionLifts.mulSpace` (`TauCeti.AlgebraicTopology.Quasicategory.InfinityOperad`), `SSet.SymmetricMonoidalFunctor.toOperadHom` (`TauCeti.AlgebraicTopology.Quasicategory.SymmetricMonoidal`).'
deps = ['GLCinLean.Infinity.mappingSpaces']
