[[node]]
id = 'GLCinLean.Infinity.monoidalCategory'
kind = 'definition'
desc = 'Coherent monoidal enhanced categories (E₁), with a symmetric monoidal (E∞) structure as additional structure, including the unit and associativity coherences; module categories are a separate node. The spherical category acts through a monoidal structure that is not symmetric. Provider: roadmap GeneralizedCohomology, G2.11, the monoidal/fibration sub-lane inside “Coherent model diagrams and stable enhancements”, with roadmap EnhancedDerivedSheaves “Symmetric monoidal ∞-categories and ∞-operads”. G2.11 defines them with no presentability: “Define monoidal enhancements as coCartesian fibrations over N(Fin_*) with Segal fibers C^n”; a monoidal structure whose tensor product preserves colimits in each variable is a condition that its users state (Infinity.derivedVect, Infinity.linearCategory). In Tau Ceti at the pin: Cartesian edges and Cartesian fibrations of simplicial sets; coCartesian edges and coCartesian fibrations (the module `TauCeti.AlgebraicTopology.Quasicategory.CoCartesian`); the category of finite pointed sets with its inert and active maps, `TauCeti.FinPointed` (`TauCeti.CategoryTheory.Category.Pointed.Fin`); and the symmetric monoidal quasicategories, as coCartesian fibrations over its nerve with the Segal condition, with their symmetric monoidal and lax symmetric monoidal functors, `SSet.SymmetricMonoidal` (`TauCeti.AlgebraicTopology.Quasicategory.SymmetricMonoidal`). Still to do: the monoidal structures that are not symmetric, which need ∞-operads and the operad of associative algebras; the restriction of a symmetric monoidal structure to a monoidal one; and that the Segal condition does not depend on the chosen transports. Upstream declarations used: `SSet.CartesianFibration` (`TauCeti.AlgebraicTopology.Quasicategory.Cartesian`).'
deps = ['GLCinLean.Infinity.mappingSpaces']
source = '[AGKRRV] §0.9.4'
