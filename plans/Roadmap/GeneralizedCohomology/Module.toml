[[node]]
id = 'GLCinLean.Infinity.moduleCategory'
kind = 'definition'
desc = 'A coherent module category for a specified monoidal enhanced category, with action, unit and associativity data. Provider: roadmap GeneralizedCohomology, G2.11, the monoidal/fibration sub-lane inside “Coherent model diagrams and stable enhancements” (LM operad and module fibres), with roadmap EnhancedDerivedSheaves “Algebras, modules and the monoidal envelope”. In Tau Ceti at the pin, only the ingredients: coCartesian fibrations and transports, `SSet.CoCartesianFibration` and `SSet.CoCartesianTransport` (`TauCeti.AlgebraicTopology.Quasicategory.CoCartesian`), the ∞-operads `SSet.InfinityOperad` (`TauCeti.AlgebraicTopology.Quasicategory.InfinityOperad`) and `TauCeti.FinPointed` (`TauCeti.CategoryTheory.Category.Pointed.Fin`); no module structure on a quasicategory exists in Tau Ceti or Mathlib. Still to do: the categories of operators of the associative operad and of LM (item `category-of-operators-assoc-lm` of `docs/worker-targets/targets.md`), monoidal quasicategories (`monoidal-quasicategory`), and left-tensored quasicategories, whose module fibre is this node (`left-tensored-quasicategory`).'
deps = ['GLCinLean.Infinity.monoidalCategory']
source = '[AGKRRV] §0.9.4; [ArinkinGaitsgory] §1.5.2(viii)'
