kind = 'definition'
desc = 'Mapping spaces and homotopy-coherent functors between quasicategories, with composition and equivalences. Provider: roadmap GeneralizedCohomology, G2.11: “Categorical model and functor spaces”, and “Unmarked straightening and the categorical model” for the right mapping spaces `Hom^R_X` and for the theorem that a map of quasicategories is a categorical equivalence exactly when it is fully faithful and essentially surjective. Roadmap EnhancedDerivedSheaves E0.1–E0.3 takes these from G2.11; its text cites them as BordismFormalGroups F6.5, and the roadmap BordismFormalGroups (“Scope and ownership”) names G2.11 as the owner of each of these passages. In Tau Ceti and Mathlib: the right mapping space with its functoriality (`SSet.rightMappingSpace`), which is a Kan complex when X is a quasicategory, by the instance `SSet.rightMappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`); the functor quasicategory, the Mathlib instance `Quasicategory ((ihom A).obj X)` (`Mathlib.AlgebraicTopology.SimplicialSet.AnodyneExtensions.Inner.PushoutProduct`); equivalences in a quasicategory and its core, `SSet.Edge.IsEquivalence`, `SSet.core` and `SSet.coreFunctor` (`TauCeti.AlgebraicTopology.Quasicategory.Core`), with `SSet.coreHomEquiv` of the same module: the maps from a Kan complex to the core of X are the maps to X; the filling of the outer horns of a quasicategory whose first, respectively last, edge is an equivalence, `SSet.Quasicategory.hornFilling_zero` and `SSet.Quasicategory.hornFilling_last` (`TauCeti.AlgebraicTopology.Quasicategory.OuterHorn`), and from it, in the same module: the core of a quasicategory is a Kan complex (the instance `SSet.core.kanComplex`) and is the greatest subcomplex that is a Kan complex (`SSet.isGreatest_core`); categorical equivalences, `SSet.QCat.IsCategoricalEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`); and `SSet.IsFullyFaithful` (`TauCeti.AlgebraicTopology.Quasicategory.FullyFaithful`). Still to do: the two-sided mapping space, that it is a Kan complex, and its comparison with the left and the right one; composition of mapping spaces; the pointwise test for equivalences in a functor quasicategory; and the theorem that the categorical equivalences are the fully faithful and essentially surjective maps. Upstream declarations used: `SSet.Quasicategory` (`Mathlib.AlgebraicTopology.Quasicategory.Basic`), `SSet.rightMappingSpace` and `SSet.rightMappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`), `SSet.coreFunctor` and `SSet.coreHomEquiv` (`TauCeti.AlgebraicTopology.Quasicategory.Core`), `SSet.Quasicategory.hornFilling_zero`, `SSet.Quasicategory.hornFilling_last`, `SSet.core.kanComplex` and `SSet.isGreatest_core` (`TauCeti.AlgebraicTopology.Quasicategory.OuterHorn`), `SSet.QCat` (`Mathlib.AlgebraicTopology.Quasicategory.StrictBicategory`).'
source = '[IndCoh] §0.6.2'
