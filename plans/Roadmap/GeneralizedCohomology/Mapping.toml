desc = 'Mapping spaces and homotopy-coherent functors between quasicategories, with composition and equivalences. Provider: roadmap GeneralizedCohomology, G2.11: “Categorical model and functor spaces”, and “Unmarked straightening and the categorical model” for the right mapping spaces `Hom^R_X` and for the theorem that a map of quasicategories is a categorical equivalence exactly when it is fully faithful and essentially surjective. Roadmap EnhancedDerivedSheaves E0.1–E0.3 takes these from G2.11; its text cites them as BordismFormalGroups F6.5, and the roadmap BordismFormalGroups (“Scope and ownership”) names G2.11 as the owner of each of these passages. In Tau Ceti and Mathlib: the right mapping space with its quasicategory instance and functoriality (`SSet.rightMappingSpace`); the functor quasicategory, the Mathlib instance `Quasicategory ((ihom A).obj X)` (`Mathlib.AlgebraicTopology.SimplicialSet.AnodyneExtensions.Inner.PushoutProduct`); equivalences in a quasicategory and its core, `SSet.Edge.IsEquivalence` and `SSet.core` (`TauCeti.AlgebraicTopology.Quasicategory.Core`); categorical equivalences, `SSet.QCat.IsCategoricalEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`); and `SSet.IsFullyFaithful` (`TauCeti.AlgebraicTopology.Quasicategory.FullyFaithful`). Still to do: the mapping spaces and the cores are Kan complexes; the two-sided mapping space and its comparison with the left and the right one; composition of mapping spaces; the pointwise test for equivalences in a functor quasicategory; and the theorem that the categorical equivalences are the fully faithful and essentially surjective maps. Upstream declarations used: `SSet.Quasicategory` (`Mathlib.AlgebraicTopology.Quasicategory.Basic`), `SSet.rightMappingSpace` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`), `SSet.QCat` (`Mathlib.AlgebraicTopology.Quasicategory.StrictBicategory`).'
source = '[IndCoh] §0.6.2'
