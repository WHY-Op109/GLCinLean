desc = 'Mapping spaces and homotopy-coherent functors between quasicategories, with composition and equivalences. Provider: roadmap GeneralizedCohomology, G2.11: “Categorical model and functor spaces”, and “Unmarked straightening and the categorical model” for the right mapping spaces `Hom^R_X` and for the theorem that a map of quasicategories is a categorical equivalence exactly when it is fully faithful and essentially surjective. Roadmap EnhancedDerivedSheaves E0.1–E0.3 takes these from G2.11; its text cites them as BordismFormalGroups F6.5, and the roadmap BordismFormalGroups (“Scope and ownership”) names G2.11 as the owner of each of these passages. In Tau Ceti and Mathlib: the right mapping space with its functoriality (`SSet.rightMappingSpace`), which is a Kan complex when X is a quasicategory, by the instance `SSet.rightMappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`); the functor quasicategory, the Mathlib instance `Quasicategory ((ihom A).obj X)` (`Mathlib.AlgebraicTopology.SimplicialSet.AnodyneExtensions.Inner.PushoutProduct`); equivalences in a quasicategory and its core, `SSet.Edge.IsEquivalence`, `SSet.core` and `SSet.coreFunctor` (`TauCeti.AlgebraicTopology.Quasicategory.Core`), with `SSet.coreHomEquiv` of the same module: the maps from a Kan complex to the core of X are the maps to X; the filling of the outer horns of a quasicategory whose first, respectively last, edge is an equivalence, `SSet.Quasicategory.hornFilling_zero` and `SSet.Quasicategory.hornFilling_last` (`TauCeti.AlgebraicTopology.Quasicategory.OuterHorn.Basic`), and from it, in the same module: the core of a quasicategory is a Kan complex (the instance `SSet.core.kanComplex`) and is the greatest subcomplex that is a Kan complex (`SSet.isGreatest_core`); categorical equivalences, `SSet.QCat.IsCategoricalEquivalence` (`TauCeti.AlgebraicTopology.Quasicategory.CategoricalEquivalence`); and `SSet.IsFullyFaithful` (`TauCeti.AlgebraicTopology.Quasicategory.FullyFaithful`). Also at the pin: the two-sided mapping space `SSet.mappingSpace` (`TauCeti.AlgebraicTopology.Quasicategory.MappingSpace.Basic`), which is a Kan complex when X is a quasicategory (the instance `SSet.mappingSpace.kanComplex` of the same module), with the comparison map from the right mapping space, a monomorphism that is bijective on vertices and, for a quasicategory, on connected components; postcomposition with one edge on right mapping spaces (the module `TauCeti.AlgebraicTopology.Quasicategory.Postcomposition`); for a map p : X → S and an edge e of S from p(x) to p(y), the space of the maps from x to y over e, `SSet.rightMappingSpaceOver` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`), the fibre over e of the map of right mapping spaces that p induces, with postcomposition on these spaces for a quasicategory X over the nerve of a category (`SSet.rightMappingSpaceOver.postcomp`, in the module of postcomposition); the pointwise test for equivalences in a functor quasicategory, `SSet.Edge.isEquivalence_iff_forall_isEquivalence_map_evalAt` (`TauCeti.AlgebraicTopology.Quasicategory.PointwiseEquivalence`); and that a fully faithful map of quasicategories reflects equivalences (in the module of `SSet.IsFullyFaithful`). Still to do: the left mapping space and its comparison; that the comparison maps are weak homotopy equivalences; composition of mapping spaces; and the theorem that the categorical equivalences are the fully faithful and essentially surjective maps. The essentially surjective maps are at the pin: for a map f, the condition `(SSet.mapHomotopyCategory f).EssSurj`, with `SSet.mapHomotopyCategory` (`Mathlib.AlgebraicTopology.SimplicialSet.HomotopyCat`), and `SSet.essSurj_mapHomotopyCategory_iff` (`TauCeti.AlgebraicTopology.Quasicategory.HomotopyCategory`): when the target is a quasicategory, the condition holds exactly when every vertex of the target is joined by an equivalence edge to a vertex in the image. Tau Ceti uses this form as a hypothesis. Upstream declarations used: `SSet.Quasicategory` (`Mathlib.AlgebraicTopology.Quasicategory.Basic`), `SSet.rightMappingSpace`, `SSet.rightMappingSpace.kanComplex` and `SSet.rightMappingSpaceOver` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`), `SSet.mappingSpace` and `SSet.mappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.MappingSpace.Basic`), `SSet.rightMappingSpaceOver.postcomp` (`TauCeti.AlgebraicTopology.Quasicategory.Postcomposition`), `SSet.coreFunctor` and `SSet.coreHomEquiv` (`TauCeti.AlgebraicTopology.Quasicategory.Core`), `SSet.Quasicategory.hornFilling_zero`, `SSet.Quasicategory.hornFilling_last`, `SSet.core.kanComplex` and `SSet.isGreatest_core` (`TauCeti.AlgebraicTopology.Quasicategory.OuterHorn.Basic`), `SSet.QCat` (`Mathlib.AlgebraicTopology.Quasicategory.StrictBicategory`), `SSet.mapHomotopyCategory` (`Mathlib.AlgebraicTopology.SimplicialSet.HomotopyCat`), `SSet.essSurj_mapHomotopyCategory_iff` (`TauCeti.AlgebraicTopology.Quasicategory.HomotopyCategory`).'
source = '[IndCoh] §0.6.2'
