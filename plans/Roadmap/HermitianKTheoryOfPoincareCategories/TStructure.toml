desc = 't-structures on stable enhanced categories. Owner: the Tau Ceti roadmap HermitianKTheoryOfPoincareCategories, §6.0 “Truncations and the Postnikov t-structure over coherent rings”.'

[[node]]
id = 'GLCinLean.Infinity.tStructure'
kind = 'definition'
desc = 'Nonpositive and nonnegative subcategories, orthogonality, shifts and truncation triangles on a stable enhanced category. The definition is for a stable quasicategory in every universe: the categories that use it (IndCoh, QCoh, D-modules) are large. Provider: roadmap HermitianKTheoryOfPoincareCategories, §6.0 “Truncations and the Postnikov t-structure over coherent rings”: for a stable ∞-category `C`, a t-structure is a `CategoryTheory.Triangulated.TStructure` on the homotopy category of `C`; its halves are lifted to full subcategories of `C`, with the truncation functors, their adjunctions with the inclusions and the fibre sequence of the two truncations ([LurieHA] Definition 1.2.1.4 and Proposition 1.2.1.5). §6.0 writes the truncations with homological indices (`τ_{≤n}` is left adjoint to the inclusion); `TStructure` of Mathlib and [IndCoh] use cohomological indices. §6.0 lists under its needs: Mathlib `CategoryTheory.Triangulated.TStructure`; GeometryOfNumbersAndQuadraticArithmetic §6.1a “Stable categories and spectra” (stable mapping spectra), whose `StableInfinityCategory` bundles a small quasicategory, so the definition asked here, in every universe, is more general than that bundle; and EnhancedDerivedSheaves E0.4 (stable categories, which that roadmap takes from GeneralizedCohomology, G2.11, “Coherent model diagrams and stable enhancements”) and §0.1 (the standard truncations). G2.11 states no t-structure. `TStructure` needs the homotopy category to be preadditive with a zero object, a shift by ℤ with additive shift functors, and pretriangulated; this is Infinity.homotopyCategoryPretriangulated, which §6.0 presupposes and no roadmap states as a target. Roadmap EnhancedDerivedSheaves §0.1 “Enhanced derived sheaf categories” provides the standard cohomological t-structure of the enhanced derived category of a ringed site. Upstream declarations used: `CategoryTheory.Triangulated.TStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Basic`).'
deps = ['GLCinLean.Infinity.stableCategory', 'GLCinLean.Infinity.homotopyCategoryPretriangulated']
source = '[IndCoh] §0.6.5'
