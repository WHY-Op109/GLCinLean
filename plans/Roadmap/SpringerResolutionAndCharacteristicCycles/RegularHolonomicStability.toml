desc = 'The stability of the regular holonomic complexes of left D-modules on a smooth scheme in characteristic zero under direct image, inverse image and the external product: over the complex numbers, and over every field of characteristic zero. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles, as a prerequisite that the accepted roadmap MixedHodgeModulesAndIrregularHodgeTheory asks of it.'

[[node]]
id = 'GLCinLean.DModules.regularHolonomicDModule_directImage_inverseImage_complex'
kind = 'theorem'
desc = '''Notation, for a field k of characteristic 0 and smooth separated k-schemes X and X′ of finite type of pure dimensions. Left modules, Dᵇ and the functors f_+, f^† and 𝔻 are those of DModules.transferModule. Dᵇ_rh(D_X) is the full subcategory of Dᵇ of the left D_X-modules on the complexes whose cohomology modules are regular holonomic (DModules.regularHolonomicDModule); it is a triangulated subcategory, by (1) of that node and (3) of DModules.holonomicDModule. External product: for left modules M on X and N on X′, with the projections p and q of the product X × X′ over k, M ⊠ N is p^*M ⊗ q^*N, the tensor product over the functions of X × X′ of the pullbacks of the underlying modules, with the vector fields of the two factors acting on the two factors; it is exact in each variable and passes to Dᵇ ([HottaTakeuchiTanisaki] §1.5). This node defines the external product for every such k; its theorem is for k the complex numbers. Theorem, for k = C. (1) For every morphism f : X → X′, f_+ carries Dᵇ_rh(D_X) into Dᵇ_rh(D_X′). (2) For every such f, f^† carries Dᵇ_rh(D_X′) into Dᵇ_rh(D_X). (3) For M in Dᵇ_rh(D_X) and N in Dᵇ_rh(D_X′), M ⊠ N is in Dᵇ_rh(D_{X × X′}). The morphism f need not be proper, smooth or an immersion. (1) and (2) say in particular that the cohomology modules of f_+M and of f^†N are holonomic, hence coherent. Consequences, with the stability under duality of (3) of DModules.regularHolonomicDModule: f_! = 𝔻 f_+ 𝔻 is defined on Dᵇ_rh(D_X) and carries it into Dᵇ_rh(D_X′); 𝔻 f^† 𝔻 carries Dᵇ_rh(D_X′) into Dᵇ_rh(D_X); and for X = X′ with the diagonal Δ, Δ^†(M ⊠ N) is in Dᵇ_rh(D_X). The theorem is about objects: apart from the external product it asks for no new functor, and it asks for no compatibility of functors. Checks. For the inclusion j of the complement of the origin in the affine line, j_+O = O[x⁻¹], an extension of δ_0 by O, both regular. For the map p from the affine line to the point, p_+O = C[1] and p_!O = C[−1], the de Rham cohomology and the de Rham cohomology with compact supports of the line, shifted by 1; every bounded complex of vector spaces with finite-dimensional cohomology is regular holonomic on the point. For the inclusion i of the origin in the affine line, i^†O = C[−1] and i^†δ_0 = C. For the diagonal of the affine line, Δ^†(O ⊠ O) = O[−1]. The theorem has no converse: for the connection on O·e with ∂e = e on the affine line, which is holonomic and not regular, p_+ is 0, because ∂ + 1 is bijective on C[x]. Users: DModules.regularHolonomicDeRham, whose (1), (3) and (5) presuppose (1) to (3); DModules.regularHolonomicDModule_directImage_inverseImage, which extends the theorem to every field of characteristic 0. Provider: roadmap SpringerResolutionAndCharacteristicCycles, as a prerequisite and not a named target. The accepted roadmap MixedHodgeModulesAndIrregularHodgeTheory asks for it, under “From TauCetiRoadmap.SpringerResolutionAndCharacteristicCycles”: “What SpringerResolutionAndCharacteristicCycles must provide (gap:regular-holonomic-stability): stability of the bounded derived category with regular holonomic cohomology under `f_+`, `f_!`, arbitrary `f^†`, external product and restriction to the diagonal, for algebraic maps of smooth complex varieties. Duality, smooth pullback and intermediate extension are supplied by §9.7, and the composition, adjunction and proper-duality comparisons by §9.1 on holonomic complexes.” Its §1.5 and §5.1 list the request under their needs. The text of SpringerResolutionAndCharacteristicCycles does not state the stability: §9.7 has “Prove stability under duality, smooth pullback and the intermediate extensions used below”. The theorem of this node is the request, with two readings. (i) The request names f_! and the restriction to the diagonal; here they are the consequences above, of (1) with duality and of (2) with (3). (ii) Neither roadmap defines the external product of left D-modules; this node defines it, and (5) of DModules.regularHolonomicDeRham uses it. If the review of Tau Ceti declines the node, it comes back through `prompts/change.md`. Limits: left modules, smooth separated schemes of pure dimension, ordinary bounded derived categories. The node does not ask that f_+ and f^† preserve the holonomic complexes that are not regular; for the crystals these are theorems of DModules.holonomicShriek and DModules.IsHolonomic. Readiness. The node is not ready when its three dependencies are in Tau Ceti: its proof has inputs that are not plan nodes, and `lake exe tracker ready` does not see them. The request names none. The proof of the book ([HottaTakeuchiTanisaki] §6.2) uses the classification of the simple holonomic modules (Theorem 3.4.2), a smooth completion by a theorem of Hironaka, the theorem of Deligne on regular meromorphic connections (Theorem 5.3.7) and the regularity of Gauss–Manin connections, and it comes after the stability of holonomic complexes under the direct and inverse images (Theorem 3.2.3) and under the external product (Proposition 3.2.2). It proves the stability together with the curve criterion (Theorem 6.1.6). A proof that follows the book has two more proof obligations, and both can be proved before the stability. (i) Globalization. The book assumes that every variety is quasi-projective (Assumption 1.4.19), so its Theorems 3.2.3, 6.1.5 and 6.1.6 and the route to (3) in the source of this node are for smooth quasi-projective varieties, and this node is for smooth separated schemes of finite type. One route. The regularity of a holonomic module is local for the Zariski topology: the restriction to an open subscheme preserves it, by (3) of DModules.regularHolonomicDModule, and a holonomic module is regular when its restrictions to the open subschemes of a finite cover are; this converse is proved from the definition and without the stability. For the direct image: f_+ commutes with the restriction to an affine open subscheme of the target, by open base change; and for a finite affine open cover of the source, whose finite intersections are affine because X is separated, the triangles of Mayer–Vietoris and the composition of direct images ((6) of DModules.transferModule) reduce to morphisms of smooth affine schemes. For the inverse image and the external product: the restriction to affine open subschemes. Step (a2) of DModules.IsRegularHolonomic cannot supply the locality, because it uses the theorem of this node. (ii) Comparison of the two notions of regularity. The proof applies the theorems of the book to the regular holonomic modules of DModules.regularHolonomicDModule, which differ from those of the book in two points. First, the book tests an integrable connection on every morphism from a smooth curve (Definition 5.3.2), and (a) of that node on the smooth locally closed curves. Comparison: the pullback along a constant morphism is a trivial connection; a morphism that is not constant restricts, over a dense open subset of its source, to a dominant morphism onto a smooth open subset of its image, which is a smooth locally closed curve, and regularity passes along a dominant morphism of curves (Lemma 5.1.23) and from a dense open subset of a curve to the curve (Definition 5.1.21). Second, the book takes the minimal extensions along affine inclusions of smooth subvarieties (Definition 6.1.1, with Theorem 3.4.2), and (b) of that node the intermediate extensions along all locally closed immersions of a smooth W. Comparison: a dense affine open subscheme W° of W has an affine inclusion, because the ambient scheme is separated, and for a simple E the module j_!*E is the intermediate extension of the restriction of E to W°, by (2) and (3) of DModules.holonomicIntermediateExtension. ComplexComparisonPartII C5.6 tests a connection on all maps from smooth curves, as the book does, and (6) of DModules.regularHolonomicDeRham needs the first comparison too. §1.5 of the requesting roadmap names, for its own route, ResolutionOfSingularitiesCharacteristicZero §§5.1 and 5.2 and ComplexComparisonPartII §C5.6. Before the Worker takes this node, the session checks which of these inputs are in Tau Ceti. In Tau Ceti at the pin: no regular holonomic module; the search is recorded in DModules.regularHolonomicDModule.'''
deps = ['GLCinLean.DModules.regularHolonomicDModule', 'GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.transferModule']
source = '[HottaTakeuchiTanisaki] Theorem 6.1.5 (duality and the direct and inverse images preserve the regular holonomic complexes, for smooth algebraic varieties over the complex numbers), with its proof in §6.2, and §1.5 (the external tensor product). No number of the book states the stability under the external product. A route to it from the numbers of the book: Proposition 3.2.2 (the external product of holonomic complexes is holonomic); Theorem 6.1.6 (a holonomic complex is regular when its inverse images under all morphisms from smooth curves are); for a morphism k = (k_1, k_2) from a smooth curve C to X × X′, k^†(M ⊠ N) is, up to a shift, the derived tensor product over O_C of k_1^†M and k_2^†N, which are regular by Theorem 6.1.5 and whose tensor product is holonomic by Corollary 3.2.4; on a dense open subset of C their cohomology modules are regular integrable connections, whose tensor product is regular (Proposition 5.3.5); and a holonomic module on a curve is regular when its restriction to a dense open subset is (Definition 5.1.21 and Remark 6.1.4). The book assumes quasi-projective varieties (Assumption 1.4.19), so Theorems 6.1.5 and 6.1.6 and this route are for them; the passage to smooth separated schemes of finite type is the obligation (i) of this node under “Readiness”. These numbers were compared with the English edition, and the book is not in references/'

[[node]]
id = 'GLCinLean.DModules.regularHolonomicDModule_directImage_inverseImage'
kind = 'theorem'
desc = '''The statements (1), (2) and (3) of DModules.regularHolonomicDModule_directImage_inverseImage_complex hold over every field k of characteristic 0, in the notation of that node: for smooth separated k-schemes X and X′ of finite type of pure dimensions and every morphism f : X → X′ of k-schemes, f_+ carries Dᵇ_rh(D_X) into Dᵇ_rh(D_X′), f^† carries Dᵇ_rh(D_X′) into Dᵇ_rh(D_X), and M ⊠ N is in Dᵇ_rh(D_{X × X′}) for M in Dᵇ_rh(D_X) and N in Dᵇ_rh(D_X′). The consequences for 𝔻 f_+ 𝔻, 𝔻 f^† 𝔻 and Δ^†(M ⊠ N) hold as there. Check, beside those of that node: over k = ℚ and for the map f from Spec ℚ(i) to Spec ℚ, f_+ of ℚ(i) is the ℚ-vector space ℚ(i) of dimension 2, which is regular holonomic on the point; X need not be geometrically connected. Users: DModules.IsRegularHolonomic, with (1) to (3), for the stability of the regular holonomic complexes of crystals; the nodes that use that stability over the ground field of the statement, an algebraically closed field of characteristic 0, are DModules.perverseHeart, DModules.intermediateExtension and the Satake nodes, and DModules.boundedEquivariantExt_baseChange in the plan of the proof uses it over a field that is finitely generated over ℚ. Provider: roadmap SpringerResolutionAndCharacteristicCycles, as a prerequisite and not a named target. The whole node is beyond the request `gap:regular-holonomic-stability`, which is “for algebraic maps of smooth complex varieties” and is the node DModules.regularHolonomicDModule_directImage_inverseImage_complex. The reason to ask Tau Ceti for it: it is the generality of the section that the request extends. Layer 9 of the roadmap is stated for “a field of characteristic zero”, §9.7 defines regularity over a general k (“Use geometric regularity after algebraic closure for general k; its descent and stability are separate inputs”), and it prescribes for its own stabilities: “First establish the stated complex-field theorem, then prove compatibility under algebraically closed characteristic-zero extensions and descend geometric regularity to arbitrary characteristic-zero k. This field comparison is a target, not an unmentioned embedding of k into C.” A route from the complex theorem, with its obligations; none of them is a plan node, and §9.7 supplies only the third for regularity. (a) Extension of the base field. For an extension K of k and the base changes X_K, X′_K and f_K, natural isomorphisms (f_+M)_K ≅ (f_K)_+(M_K), (f^†N)_K ≅ (f_K)^†(N_K) and (M ⊠ N)_K ≅ M_K ⊠ N_K on the bounded complexes with quasi-coherent cohomology: flat base change for the direct image of sheaves, and the base change of the transfer module. (b) Reflection. A D_X-module with quasi-coherent underlying module is coherent exactly when its base change to K is, by faithfully flat descent, and a coherent D_X-module is holonomic exactly when its base change to K is, because the characteristic variety commutes with the extension of the field. A holonomic module is regular exactly when its base change to K is: by the definition of regularity over a general field, and by (4) of DModules.regularHolonomicDModule for an extension of algebraically closed fields. (c) Descent to a small field. For an algebraically closed k: the schemes X and X′, the morphism f and a bounded complex with coherent cohomology are the base changes of such data over a subfield of k that is finitely generated over ℚ (the roadmap names SchemeAndStackFoundations §§0.8–0.9 for spreading and field descent); the algebraic closure of this subfield in k embeds into the complex numbers. With these, the theorem over k follows from the theorem over C: (b) passes from k to an algebraic closure, (c) to a countable algebraically closed subfield, (a) and (b) to C and back. The crystal functor DModules.scalarExtension cannot supply (a) to (c): it depends on DModules.IsRegularHolonomic, which depends on this node. A proof that does not pass through the complex numbers needs none of (a) to (c). Readiness: the node is not ready when its four dependencies are in Tau Ceti; (a) to (c) are inputs inside Tau Ceti that `lake exe tracker ready` does not see. Through its dependency on the complex node it also waits for the two obligations of that node under “Readiness”: the passage from quasi-projective varieties to smooth separated schemes of finite type, and the comparison of the two notions of regularity. If the review of Tau Ceti declines this node, it comes back through `prompts/change.md`; the complex node and DModules.regularHolonomicDeRham do not depend on it. Limits: left modules, smooth separated schemes of pure dimension, ordinary bounded derived categories. The crystals, the schemes of finite type that are not smooth or not separated, the maps of finite type between them and the !-tensor product are in DModules.IsRegularHolonomic.'''
deps = ['GLCinLean.DModules.regularHolonomicDModule_directImage_inverseImage_complex', 'GLCinLean.DModules.regularHolonomicDModule', 'GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.transferModule']
source = 'SpringerResolutionAndCharacteristicCycles §9.7 (the passage from the complex numbers to a field of characteristic 0, for the stabilities of that section); [HottaTakeuchiTanisaki] Theorem 6.1.5 for the complex case. Explicit adaptation obligation: no source states the theorem over a field of characteristic 0 that is not the complex numbers'
