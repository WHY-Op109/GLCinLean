desc = 'The intermediate extension of a holonomic D-module along a locally closed immersion of smooth schemes in characteristic zero. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles.'

[[node]]
id = 'GLCinLean.DModules.holonomicIntermediateExtension'
kind = 'definition'
desc = '''Let k be a field of characteristic 0, j : W → Y a locally closed immersion of smooth separated k-schemes of finite type, W of pure dimension m and Y of pure dimension n, and E a holonomic left D_W-module (DModules.holonomicDModule). The intermediate extension is the holonomic D_Y-module j_!*E = im(H⁰(j_!E) → H⁰(j_+E)), with j_+ of DModules.transferModule, j_! = 𝔻_Y j_+ 𝔻_W, whose cohomology modules are holonomic by DModules.holonomicDModule (6), and the natural map j_!E → j_+E. Write W̄ for the closure of W in Y. (1) The support of j_!*E is contained in W̄, and j^†(j_!*E) is isomorphic to E in degree 0. (2) j_!*E has no nonzero submodule and no nonzero quotient module with support contained in W̄ ∖ W; a holonomic D_Y-module that satisfies (1) for E and has this property is isomorphic to j_!*E. (3) If E is simple, j_!*E is simple. (4) 𝔻_Y(j_!*E) ≅ j_!*(𝔻_W E). Checks: for j the identity, j_!*E = E; for the inclusion of the complement of the origin in the affine line, j_!*O = O, and j_+O = O[x⁻¹] has the quotient O[x⁻¹]/O ≅ δ_0, which is supported at the origin; for the inclusion of the origin in the affine line, the intermediate extension of k is δ_0. Users: DModules.intermediateExtension, with (1) to (4), and DModules.regularHolonomicDModule. Provider: roadmap SpringerResolutionAndCharacteristicCycles, §9.6 “Intermediate extension”: “For a locally closed immersion j:W→Y of smooth varieties with W pure of dimension m and holonomic E on W, define j_!*E=im(H⁰j_!E→H⁰j_+E). It restricts to E and has no nonzero subobject or quotient supported on the complement of W in its closure. It is the unique such extension and is simple when E is simple”, with “j†j_!*E≅E in degree zero” and “𝔻(j_!*E)≅j_!*(𝔻E)”. The roadmap states it for this k and for smooth W and Y only. Inputs that §9.6 names: “§9.1; §9.2; §9.4; §9.5”. In Tau Ceti at the pin: no intermediate extension of a module over differential operators (searched in the pinned sources of Tau Ceti and Mathlib: “intermediate extension”, “minimal extension”, `IntermediateExtension`; none of the matches concerns a sheaf or a module over differential operators: they are extensions of fields and of algebras).'''
deps = ['GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.transferModule']
source = '[HottaTakeuchiTanisaki] Chapter 3 (the book is not in references/; the chapter contents agree with its English edition)'
