desc = 'The characteristic variety of a coherent D-module on a smooth scheme in characteristic zero, the inequality of Bernstein, holonomic modules, their duality and their finite length. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles.'

[[node]]
id = 'GLCinLean.DModules.holonomicDModule'
kind = 'definition'
desc = '''Let k, Y and n be as in DModules.coherentDModule, and M a coherent left D_Y-module. The cotangent bundle is T*Y = Spec_Y Sym_{O_Y}(T_Y), and gr D_Y ≅ Sym_{O_Y}(T_Y) for the order filtration. A filtration (F_j M), j in ℤ, of M is good when it is increasing and exhaustive, locally zero for j small, each F_j M is a coherent O_Y-module, F_p D_Y · F_j M ⊆ F_{p+j} M, and gr_F M is locally finitely generated over gr D_Y. Every coherent M has a good filtration. The characteristic variety Ch(M) is the closed subset of T*Y that is the support of gr_F M for a good filtration F; it does not depend on F. Ch(0) = ∅. (1) The inequality of Bernstein: if M ≠ 0, every irreducible component of Ch(M) has dimension at least n. (2) M is holonomic when dim Ch(M) ≤ n; the zero module is holonomic. (3) For a short exact sequence 0 → M′ → M → M″ → 0 of coherent modules, Ch(M) = Ch(M′) ∪ Ch(M″); so M is holonomic exactly when M′ and M″ are, and the holonomic modules are an abelian subcategory of the coherent modules, closed under subobjects, quotients and extensions. (4) Every holonomic module has finite length. (5) The duality 𝔻_Y of DModules.transferModule (5) restricts to an exact contravariant functor from the holonomic modules to the holonomic modules. (6) For a locally closed immersion j : W → Y of smooth separated k-schemes of finite type of pure dimensions and a holonomic D_W-module E, the cohomology modules of j_+E and of j_!E = 𝔻_Y j_+ 𝔻_W E are holonomic. Checks, on the affine line with coordinate x and ∂ = d/dx: O is holonomic and Ch(O) is the zero section; δ_0 = D/Dx is holonomic and Ch(δ_0) is the cotangent fibre at 0; D is coherent and not holonomic, Ch(D) = T*A¹ has dimension 2; δ_0 ⊕ δ_0 has length 2 and the same characteristic variety as δ_0. Users: DModules.IsHolonomic, with (1) to (4) and (6); DModules.verdierDuality, with (5); DModules.holonomicShriek, with (6); DModules.holonomicIntermediateExtension, DModules.regularHolonomicDModule, DModules.regularHolonomicDModule_directImage_inverseImage_complex and DModules.regularHolonomicDModule_directImage_inverseImage. Provider: roadmap SpringerResolutionAndCharacteristicCycles: §8.3 “Good filtrations on coherent D-modules”, §8.4 “Existence and comparison of good filtrations” (“Every coherent D_Y-module admits a global good filtration”) and §8.5 “The characteristic variety” (“define Ch(M)⊂T*Y as the reduced closed support of gr_FM for any local good filtration”; “Ch(M)=Ch(M′)∪Ch(M″) for a short exact sequence”); §9.3 “Bernstein inequality” (“Every irreducible component of Ch(M) for a nonzero coherent D_Y-module M has dimension at least n”); §9.4 “Holonomic D-modules” (“A coherent D_Y-module is holonomic when dim Ch(M)≤n, with zero holonomic”); §9.5 “Finite holonomic length and cycle additivity” (“Every holonomic D_Y-module has finite length”). (5) and (6) are of §9.1: “State duality on Dᵇ of coherent D-modules, and its exact restriction to holonomic modules” and “stability of holonomicity under the operations used in intermediate extension”; (6) reads the second for the operations that §9.6 uses, which are j_+ and j_! for a locally closed immersion j of smooth varieties and a holonomic E. The roadmap has no statement that f_+ or f^† preserves holonomic complexes for a general morphism f. The plan takes the finite length from §9.5; the proof of §9.5 in the roadmap uses the characteristic cycle of §8.6 (its needs are “§9.4; §8.6; §8.4”), and the plan does not use characteristic cycles otherwise. Inputs that these sections name and wait for: §9.3 lists “§8.5; §9.1; §9.2” (DModules.transferModule), and its route uses from §9.1 the “filtered Ext with support-codimension bounds, the Sato–Kashiwara filtration”, which is not a clause of DModules.transferModule; FormalConnectionsOpers F2.2 for gr D_Y ≅ Sym T_Y; AlgebraicVectorBundles L1A–L2B for T*Y; SchemeAndStackFoundations §0.4. In Tau Ceti at the pin: no characteristic variety of a module over differential operators and no holonomic module (searched in the pinned sources of Tau Ceti and Mathlib: “holonomic”, “characteristic variety”, “good filtration”, “Bernstein inequality”; “holonomic” matches only the D-finite power series of `TauCeti/RingTheory/PowerSeries/DFinite/Basic.lean`, and the other matches are in analysis and probability).'''
deps = ['GLCinLean.DModules.coherentDModule', 'GLCinLean.DModules.transferModule']
source = '[GLC1] §1.3.7 (holonomic D-modules, used for the vacuum Poincaré object); [HottaTakeuchiTanisaki] Chapters 2–3 (the book is not in references/; the chapter contents agree with its English edition)'
