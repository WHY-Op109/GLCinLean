desc = 'Transfer modules of a map of smooth schemes in characteristic zero, inverse and direct image and duality of D-modules on ordinary bounded derived categories, and the equivalence of Kashiwara. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles.'

[[node]]
id = 'GLCinLean.DModules.transferModule'
kind = 'definition'
desc = '''Let k be a field of characteristic 0 and f : Y → Y′ a morphism of smooth separated k-schemes of finite type, of pure dimensions n and n′. Left modules are those of DModules.coherentDModule; a right D_Y-module is a module over the opposite ring sheaf; Dᵇ is the bounded derived category of the sheaves of left or of right modules (`DerivedCategory`); ω_Y is the sheaf of the differential forms of degree n. (1) The transfer module D_{Y→Y′} = O_Y ⊗_{f⁻¹O_Y′} f⁻¹D_Y′, a sheaf of (D_Y, f⁻¹D_Y′)-bimodules on Y; for f the identity it is D_Y. (2) Inverse image of left modules: Lf^*N = D_{Y→Y′} ⊗ᴸ_{f⁻¹D_Y′} f⁻¹N and f^†N = Lf^*N[n − n′], functors from Dᵇ of the left D_Y′-modules to Dᵇ of the left D_Y-modules; they preserve bounded complexes because O_Y has finite Tor dimension over f⁻¹O_Y′, Y′ being smooth. (3) Direct image of right modules: M ↦ Rf_*(M ⊗ᴸ_{D_Y} D_{Y→Y′}), from Dᵇ of the right D_Y-modules to Dᵇ of the right D_Y′-modules; it is the functor that the transfer functor (3) of Infinity.derivedBimoduleTransfer induces on homotopy categories, for R = D_Y, S′ = D_Y′ and T = D_{Y→Y′}, restricted to bounded complexes. (4) Side change: M ↦ ω_Y ⊗_{O_Y} M is an equivalence from the left to the right D_Y-modules, with inverse N ↦ ω_Y⁻¹ ⊗_{O_Y} N; the direct image f_+ of left modules is (3) carried through it. (5) Duality: 𝔻_Y M = RHom_{D_Y}(M, D_Y) ⊗_{O_Y} ω_Y⁻¹[n], a contravariant functor on the objects of Dᵇ of the left modules with coherent cohomology, with a natural isomorphism M ≅ 𝔻_Y 𝔻_Y M. (6) For composable morphisms f and g, isomorphisms (g ∘ f)^† ≅ f^† ∘ g^† and (g ∘ f)_+ ≅ g_+ ∘ f_+; for the identity, f^† and f_+ are isomorphic to the identity functors. (7) Kashiwara: for a closed immersion i : W → Y with W smooth of pure dimension n − c, the functor i_+ is exact on Mod_qc(D_W) and is an equivalence from it to the full subcategory of Mod_qc(D_Y) of the modules whose support is contained in W, with inverse H⁰(i^†); it restricts to an equivalence between the coherent modules of the two sides. Conventions: H^i(K[a]) = H^{i+a}(K); for a smooth f of relative dimension d, the inverse image of modules is Lf^* = f^†[−d]. Checks: for the inclusion of the origin in the affine line, i_+k = δ_0 = D/Dx and H⁰(i^†δ_0) = k; on a point, 𝔻 of a finite-dimensional vector space is its dual in degree 0; on the affine line, 𝔻O = O in degree 0. Users: DModules.rightCrystals_equiv_dModules, with (2) and (4); DModules.deRhamPushforward, with (1) and (3); DModules.verdierDuality, with (5); DModules.Coherent and DModules.IsHolonomic, with (7); DModules.holonomicDModule and DModules.holonomicIntermediateExtension. Provider: roadmap SpringerResolutionAndCharacteristicCycles, §9.1 “Transfer modules and D-module operations” (“define D_(Y→Y′)=O_Y⊗_(f⁻¹O_Y′)f⁻¹D_Y′ with its left D_Y and right f⁻¹D_Y′ actions”; “direct image for right modules is Rf_*(M⊗^L_(D_Y)D_(Y→Y′)), and left direct image is obtained using the canonical-bundle left/right equivalence”; “The source and target of right direct image are Dᵇ(Mod(D_Y^op))→Dᵇ(Mod(D_Y′^op))”; “State duality on Dᵇ of coherent D-modules”; “The derived transfer comparisons identify the operations for a composite with the composites of operations”) and §9.2 “Kashiwara equivalence”. The roadmap states them for this k and these schemes only, on ordinary derived categories; it names the bounded category for the direct image and for the duality, and no domain for Lf^*. Inputs that §9.1 names and waits for: §§8.1–8.2 (DModules.coherentDModule); “EnhancedDerivedSheaves §§0.1–0.4, E1.3–E1.4 and the derived-bimodule contract” (Infinity.enhancedDerivedCategory, and Infinity.derivedBimoduleTransfer for the tensor product and the direct image of (3)); AlgebraicVectorBundles L0A–L0C; SchemeAndStackFoundations §§0.4, 0.7–0.9, 0.17–0.21 and 4.13. The internal Hom of the contract, which (5) uses, and the associativity of its tensor product, which (6) uses, are inputs inside Tau Ceti and not plan nodes. In Tau Ceti at the pin: no transfer module and no duality of modules over differential operators (searched in the pinned sources of Tau Ceti and Mathlib: “transfer module”, “transfer bimodule”, “Kashiwara”, “Verdier dual”; the matches of “Kashiwara” are citations of his works on categories and sheaves and on crystal bases).'''
deps = ['GLCinLean.DModules.coherentDModule', 'GLCinLean.Infinity.derivedBimoduleTransfer']
source = '[DG2] §§5.1.9, 5.2.1 and 5.3.1 (the statements for D-modules on schemes); [HottaTakeuchiTanisaki] Chapters 1–2 (the book is not in references/; the chapter contents agree with its English edition)'
