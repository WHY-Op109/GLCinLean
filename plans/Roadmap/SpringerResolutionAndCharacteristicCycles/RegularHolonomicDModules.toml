desc = 'Regular holonomic D-modules on a smooth scheme in characteristic zero. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles.'

[[node]]
id = 'GLCinLean.DModules.regularHolonomicDModule'
kind = 'definition'
desc = '''Let k be a field of characteristic 0 and Y a smooth separated k-scheme of finite type of pure dimension n. First let k be algebraically closed. (a) An integrable connection on Y (a left D_Y-module that is locally free of finite rank over O_Y) is regular when, for every smooth locally closed curve C in Y and every point of the boundary of the smooth projective completion of C, the restriction of the connection to C has a logarithmic lattice at that point: a locally free lattice that is stable under the logarithmic derivations. (b) A simple holonomic D_Y-module is regular when it is isomorphic to j_!*E (DModules.holonomicIntermediateExtension) for a locally closed immersion j : W → Y of a smooth W and a simple regular integrable connection E on W. (c) A holonomic D_Y-module is regular when every simple subquotient of it is regular; it has finite length by DModules.holonomicDModule (4). For a general k, a holonomic module is regular when its base change to an algebraic closure of k is. With these: (1) the regular holonomic modules are closed under subquotients and extensions among the holonomic modules; (2) an integrable connection is regular in the sense of (c) exactly when it is regular in the sense of (a); (3) the duality 𝔻_Y and the inverse image Lf^* along a smooth morphism f (DModules.transferModule) preserve regular holonomic modules; (4) for an extension of algebraically closed fields of characteristic 0, a holonomic module is regular exactly when its base change is. Checks, on the affine line: O with ∂·1 = 0 is regular; δ_0 is regular, as the intermediate extension of k from the origin; the connection on O·e with ∂e = e is holonomic and not regular, because in the coordinate t = 1/x at infinity it is d − dt/t², with a pole of order 2. Users: DModules.IsRegularHolonomic, and the roadmap nodes DModules.regularHolonomicDModule_directImage_inverseImage_complex, DModules.regularHolonomicDModule_directImage_inverseImage and DModules.regularHolonomicDeRham. Provider: roadmap SpringerResolutionAndCharacteristicCycles, §9.7 “Regular holonomic D-modules”: “An integrable connection is regular if every restriction to a smooth locally closed curve has, at every boundary point of a smooth projective completion, a logarithmic lattice. A simple holonomic module is regular if it is j_!* of a simple regular connection on a smooth locally closed support. A holonomic module is regular when all its simple factors are regular. Use geometric regularity after algebraic closure for general k; its descent and stability are separate inputs”; “Prove stability under duality, smooth pullback and the intermediate extensions used below”; “Regular holonomic modules are closed under extensions and subquotients”; “A flat bundle is regular exactly when it satisfies the curve logarithmic-lattice condition”; “The chosen geometric regularity is invariant under algebraically closed characteristic-zero extension”. (3) states the first two of the three stabilities; the roadmap names the third only as “the intermediate extensions used below”, and its §9.9 uses the intermediate extensions of the trivial connections of rank one on orbits. The roadmap has no statement that f_+, f_! or a general f^† preserves regular holonomic complexes, and its scope says: “the general regular holonomic Riemann–Hilbert correspondence on arbitrary smooth varieties is not part of this roadmap”. The accepted roadmap MixedHodgeModulesAndIrregularHodgeTheory asks this roadmap for the stability under f_+, f_!, a general f^†, the external product and the restriction to the diagonal as `gap:regular-holonomic-stability`, for smooth complex varieties. The plan node of this request is DModules.regularHolonomicDModule_directImage_inverseImage_complex, and DModules.regularHolonomicDModule_directImage_inverseImage extends it to every field of characteristic 0; both depend on this node. §1.5 of that roadmap is the Riemann–Hilbert correspondence on smooth complex varieties (DModules.regularHolonomicDeRham). Inputs that §9.7 names: “§9.4; §9.6; §9.1; §9.5”. For k the complex numbers, ComplexComparisonPartII C5.6 defines `RegularSingular` for an integrable connection on a smooth variety: for every smooth curve with a map to the variety, the pulled-back connection has at each point at infinity of the smooth completion a lattice with at most a logarithmic pole. C5.6 takes all maps from smooth curves and §9.7 the smooth locally closed curves; §9.7 does not name C5.6, and the two are to be one notion. In Tau Ceti at the pin: no regular connection on a scheme (searched in the pinned sources of Tau Ceti and Mathlib: “regular singular”, “logarithmic lattice”, “Deligne lattice”, `RegularSingular`; the five files that match are in analysis, probability and number fields, none on a scheme).'''
deps = ['GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.holonomicIntermediateExtension', 'GLCinLean.DModules.transferModule']
