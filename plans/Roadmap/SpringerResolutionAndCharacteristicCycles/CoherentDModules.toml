desc = 'Left modules over the sheaf of differential operators of a smooth scheme in characteristic zero, with quasi-coherent underlying module, and the coherent ones. Owner: the Tau Ceti roadmap SpringerResolutionAndCharacteristicCycles.'

[[node]]
id = 'GLCinLean.DModules.coherentDModule'
kind = 'definition'
desc = '''Let k be a field of characteristic 0 and Y a smooth separated k-scheme of finite type of pure dimension n (every connected component has dimension n; Y may be empty); D_Y is DModules.differentialOperators. Mod_qc(D_Y) is the category of the sheaves of left D_Y-modules whose underlying O_Y-module is quasi-coherent, with the D_Y-linear maps: a full subcategory of `SheafOfModules` over D_Y. An object M of it is coherent when M(U) is a finitely generated D_Y(U)-module for every affine open U of Y. (1) For an affine open U with étale coordinates, the ring D_Y(U) is left and right Noetherian. (2) The coherent modules are closed under kernels, cokernels and extensions in Mod_qc(D_Y), so they are an abelian subcategory. (3) Restriction to an open subscheme is exact and preserves coherence, and a module is coherent when its restrictions to the opens of a cover by affine opens with étale coordinates are coherent. Checks: the zero module and D_Y are coherent; on the affine line, D is not coherent as an O-module, and δ_0 = D/Dx is a nonzero coherent module with xδ = 0 and ∂δ ≠ 0 for its generator δ. Users: DModules.Coherent, DModules.transferModule and DModules.holonomicDModule. Provider: roadmap SpringerResolutionAndCharacteristicCycles, §8.1 “Coherent modules over the supplied differential-operator sheaf” (“Construct its category of left modules with quasi-coherent underlying O_Y-module, and its full coherent subcategory: the modules M with M(U) finitely generated over D_Y(U) for every affine open U”; “Restriction is exact, and coherence can be tested on affine coordinate charts”) and §8.2 “Noetherian and cotangent comparisons from supplied PBW” (“the operator algebra on an affine étale coordinate chart is left and right Noetherian”; “kernels of D-linear maps between coherent modules are coherent, so the coherent modules form an abelian subcategory”). The roadmap states both sections for this k and this Y only (“Its generic constructions apply to every smooth separated finite-type characteristic-zero scheme”) and for left modules (“D-modules are left modules with quasi-coherent underlying O-module”). Inputs of other roadmaps that these sections name and wait for: ComplexComparisonPartII C5.1 (DModules.differentialOperators); FormalConnectionsOpers F2.2 (the symbol, and gr D_Y ≅ Sym T_Y for a smooth scheme in characteristic 0); AlgebraicVectorBundles L0A and L1A–L2B; SchemeAndStackFoundations §0.2. In Tau Ceti at the pin: no module over a sheaf of differential operators (searched in the pinned sources of Tau Ceti and Mathlib: “D-module”, `D_X`, `D_Y`, “good filtration”: no match that concerns differential operators).'''
deps = ['GLCinLean.DModules.differentialOperators']
source = '[DG2] §5.1.17 (coherent D-modules); [HottaTakeuchiTanisaki] Chapter 1 (the book is not in references/; the chapter contents agree with its English edition)'
