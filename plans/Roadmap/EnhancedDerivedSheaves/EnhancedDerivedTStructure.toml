desc = 'The standard t-structure of the enhanced derived category of a Grothendieck abelian category. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.enhancedDerivedCategoryTStructure'
kind = 'definition'
desc = '''For every Grothendieck abelian category A, equip the enhanced derived category D∞(A) with the t-structure (Infinity.tStructure) transported from `DerivedCategory.TStructure.t` along the triangulated equivalence of `Infinity.enhancedDerivedCategory`. The heart is equivalent to A. In particular, this gives the standard t-structure for sheaves of modules over a sheaf of rings on a small site, not assumed commutative, for modules over any ring, and for vector spaces over a field. Prove that the enhanced truncation functors agree with the standard derived truncations of EnhancedDerivedSheaves §0.1 in the ringed-site cases, with the reversal of indices in HermitianKTheoryOfPoincareCategories §6.0. The standard t-structure of Infinity.derivedVect is the specialization to the vector spaces over a field k; its heart is the k-vector spaces. The indices are cohomological, as in Mathlib and in [AGKRRV] §0.9.5: an object is in the part ≤ n exactly when its cohomology objects vanish in the degrees above n, and in the part ≥ n exactly when they vanish in the degrees below n. Checks: for A the modules over a ring R, the heart is the R-modules; an object of A in degree 0 lies in the heart, with that object as its cohomology in degree 0 and zero cohomology in the other degrees; for a nonzero object M of A, the shift M[1] lies in the part ≤ −1 and not in the heart. Users: DModules.rightCrystals_equiv_dModules (the sheaves of right modules over the differential operators); Derived.commutativeAlgebraToConnectiveCommAlg (the connective part for the modules over a commutative ring); Infinity.finiteMultiplicityProduct_isMonadic and Examples.pointQCohEquivVect (the vector spaces over a field). Provider: roadmap EnhancedDerivedSheaves, §0.1 “Enhanced derived sheaf categories”, for “an essentially small site C and a sheaf of rings R”: “the standard cohomological t-structure and its `D⁺` and `Dᵇ` subcategories”, where “an arbitrary coefficient ring is allowed for the additive enhancement”; its check “On the one-object point site, the homotopy category is `D(R-Mod)`” gives the modules over a ring. §0.1 states the t-structure for a ringed site; the statement for every Grothendieck abelian category is a generalization, by the same transport, along the equivalence that E1.3 gives for every such category. A t-structure of a stable ∞-category is, in HermitianKTheoryOfPoincareCategories §6.0, a `CategoryTheory.Triangulated.TStructure` on its homotopy category, so the transported structure is one; §6.0 lifts its halves and truncation functors. The agreement of these truncation functors with those of §0.1 is the check of §6.0: “On enhanced derived modules these functors agree with EnhancedDerivedSheaves §0.1's standard truncations after the fixed reversal of cochain degrees”; §6.0 lists “§0.1 standard derived truncations” under its needs, and §0.1 lists no t-structure of a stable ∞-category under its own. So this node depends on Infinity.tStructure and on Infinity.enhancedDerivedCategory, and neither of them depends on it. The roadmap HermitianKTheoryOfPoincareCategories names EnhancedDerivedSheaves §0.1 as the supplier of “the standard t-structure on enhanced derived modules”, so the node is of this area. E1.3 `enhancedDerived`, E1.4 `derivedTensor` and `enhancedPushforward`, E5:abstract.4 `derivedTensor_symmetricMonoidal` and E1.8 `QuasicoherentDerived` list no t-structure under their needs. In Tau Ceti and Mathlib at the pin: the standard t-structure of `DerivedCategory C` for an abelian category C; for a ring R that need not be commutative, an equivalence between the derived category of the sheaves of modules on the one-point site and the derived category of the R-modules; no t-structure on a quasicategory. Upstream declarations used: `DerivedCategory.TStructure.t` (`Mathlib.Algebra.Homology.DerivedCategory.TStructure`), `CategoryTheory.Triangulated.TStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Basic`), `CategoryTheory.IsGrothendieckAbelian` (`Mathlib.CategoryTheory.Abelian.GrothendieckCategory.Basic`), `SheafOfModules` (`Mathlib.Algebra.Category.ModuleCat.Sheaf`), `TauCeti.ModulePointSite.derivedEquivalence` (`TauCeti.Algebra.Category.ModuleCat.Sheaf.Point`).'''
deps = ['GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.tStructure']
source = '[AGKRRV] §0.9.5 (the natural t-structure of Vect); [Crystals] §5.5.3 (the derived category of D-modules and the heart of its t-structure); [IndCoh] §0.6.5'
