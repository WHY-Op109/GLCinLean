desc = 'Compact objects of an enhanced category. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.compactObject'
kind = 'definition'
desc = 'Objects whose mapping-space functors preserve filtered colimits; provide membership iff and nonzero examples. Provider: roadmap EnhancedDerivedSheaves, E0.8 “Filtered diagrams, accessibility and presentability” (`IsKappaCompact`: “An object c is `κ`-compact when C admits `κ`-filtered colimits and `Map(c, −)` preserves them”) and E5:presentability.1 “Compact generation and Ind-completion” (`compactObjects`, the full subcategory of `κ`-compact objects, where compact means `ω`-compact, with `compactMappingComparison`, `compactRetract` and `compact_finiteColimit`). E0.8 lists under the needs of `IsKappaCompact`: the limit and colimit universal properties and the Kan property of right mapping spaces, which roadmap GeneralizedCohomology, G2.11, supplies (Infinity.limits, Infinity.mappingSpaces); `IsLocallySmall`; and `IsKappaFiltered`, which E0.8 defines with `HasKappaFilteredColimits` and `PreservesKappaFilteredColimits` and which needs the join. `compactObjects` also lists `dgNerve_shift_cone_comparison` (E0.6) under its needs. Roadmap GeneralizedCohomology, G2.11, in the quotient/Ind constructions inside “Coherent model diagrams and stable enhancements”, supplies the space-valued `Ind_κ` and the comparison of the compact objects of `Ind_ω(C)` with the retracts of representables; it does not define a compact object. In Tau Ceti: the Kan property of the right mapping spaces of a quasicategory, the instance `SSet.rightMappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`); `SSet.IsLocallySmall` (`TauCeti.AlgebraicTopology.Quasicategory.LocallySmall`); and the join `SSet.join` (`TauCeti.AlgebraicTopology.SimplicialSet.Join.Basic`). Upstream declarations used: `SSet.rightMappingSpace` and `SSet.rightMappingSpace.kanComplex` (`TauCeti.AlgebraicTopology.Quasicategory.RightMappingSpace`).'
deps = ['GLCinLean.Infinity.mappingSpaces', 'GLCinLean.Infinity.limits']
source = '[AGKRRV] §0.9.2; [CompactGeneration] §1.2.1'
