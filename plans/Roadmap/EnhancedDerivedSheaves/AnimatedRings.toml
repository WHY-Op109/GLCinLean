desc = 'Animated commutative algebras and derived affine schemes. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Derived.commutativeAlgebra'
kind = 'definition'
desc = '''The ∞-category of the connective commutative derived k-algebras, with actual homotopy-coherent maps, defined as the animated commutative k-algebras. For a commutative ring k, let Poly_k be the category of the polynomial k-algebras k[x_1, …, x_n] (`MvPolynomial (Fin n) k`) with all maps of k-algebras. The category is the full subcategory of the functors from the opposite of Poly_k to spaces on the functors that carry the finite coproducts of Poly_k, the empty one included, to products (`animatedAlgebras`: “`AnimAlg_R = PΣ(Poly_R)`”). The roadmap states it for every commutative ring; the plan uses it for the base field. With it: (1) the category is presentable, the Yoneda functor from Poly_k is fully faithful and preserves finite coproducts, and every object is a sifted colimit of polynomial algebras; (2) for a category D with filtered colimits and geometric realizations, restriction along the Yoneda functor is an equivalence from the functors to D that preserve sifted colimits to all functors Poly_k → D (`animationExtension`); (3) the ordinary commutative k-algebras are the full subcategory of the discrete objects, and its inclusion has the left adjoint π_0 (`animatedDiscrete`, `animatedPiZero`); (4) the pushout B ⊗ᴸ_A C, whose homotopy groups are Tor^A_*(B, C) when A, B and C are ordinary rings (`animatedPushout`); (5) the category is equivalent to the localization of the simplicial commutative k-algebras at the maps that induce isomorphisms on all homotopy groups. Difference from [AGKRRV] §0.9.6 and [Crystals] §0.6.4, a reformulation: the first takes the connective commutative algebra objects of Vect_k, the second the connective commutative DG k-algebras. Over a commutative ℚ-algebra k, in particular over a field of characteristic 0, the three categories are equivalent; this is Derived.commutativeAlgebraToConnectiveCommAlg. Outside the ℚ-algebra case the comparison functor can fail to be an equivalence, as the check over 𝔽_2 shows. The plan uses the equivalence over the characteristic-zero ground field. The reason: the animated algebras need no symmetric monoidal structure on Infinity.derivedVect, no t-structure and no module category, so this node and Derived.affineScheme do not depend on them. Sheaves.QCoh depends on Derived.affineModules, which depends on the comparison, so the comparison stays below the statement. Checks: k[x_1, …, x_n] is discrete, and π_0 returns it; A ⊗ᴸ_A B ≃ B; for k = 𝔽_2, π_1(k ⊗ᴸ_{k[t]} k) = k, with t acting by zero on both factors, so the pushout is not the ordinary tensor product. Users: Derived.affineScheme, Derived.commutativeAlgebraToConnectiveCommAlg, Derived.affineModules, Derived.affineCotangentComplex and Sheaves.qcqsScheme_passable (limits of animated algebras, and the functor to the underlying space, which is the value at k[x]). Provider: roadmap EnhancedDerivedSheaves, E5:animation.1 “Sifted colimits and animation”: `nonabelianDerived`, `animationExtension` and `animatedAlgebras`. `animatedAlgebras` lists under its needs `nonabelianDerived`, `animationExtension`, “the supplied localization universal property” and Mathlib `MvPolynomial`, `CommRingCat`, `CategoryTheory.SimplicialObject`. `nonabelianDerived` lists `IsSiftedInfinity`, `PrL`, `accessibleLocalization` (E3.2 “Representability, adjoints and localizations”) and `leftKanExtension_restrict_trivialFibration` (E3.1 “Kan extensions and finality”). None of these lists `animatedToCAlg`, `derivedTensor_symmetricMonoidal`, `moduleSpectra_equiv_derived` or `leftModuleObjects`. The construction also needs the roadmap interfaces for spaces and space-valued presheaves, `PrL`, sifted colimits, accessible localization and the restriction theorem for left Kan extensions, which have no plan node of their own. The plan tracks presentability through Infinity.presentableCategory and the adjoint functor theorem through Infinity.rightAdjoint; Infinity.rightKanExtension supplies the dual universal property. In Tau Ceti and Mathlib at the pin: no animated ring, no category `PΣ` and no sifted ∞-category; Tau Ceti has the standard simplicial polynomial resolution of a commutative algebra, which the pushout calculation can use; Mathlib has the sifted ordinary categories (`CategoryTheory.IsSifted`), which the roadmap does not take as the definition. Upstream declarations used: `MvPolynomial` (`Mathlib.Algebra.MvPolynomial.Basic`), `CommAlgCat` (`Mathlib.Algebra.Category.CommAlgCat.Basic`), `CommAlgCat.polynomialSimplicialResolution` (`TauCeti.Algebra.Category.CommAlgCat.PolynomialResolution.Simplicial`), `CategoryTheory.IsSifted` (`Mathlib.CategoryTheory.Limits.Sifted`).'''
deps = ['GLCinLean.Infinity.mappingSpaces', 'GLCinLean.Infinity.limits', 'GLCinLean.Infinity.presentableCategory', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.rightKanExtension']
source = '[AGKRRV] §0.9.6; [Crystals] §0.6.4'

[[node]]
id = 'GLCinLean.Derived.affineScheme'
kind = 'definition'
desc = 'Opposite of connective commutative derived k-algebras (Derived.commutativeAlgebra), with classical truncation and the affine embedding. The classical truncation is π_0, and the affine embedding is the inclusion of the ordinary commutative k-algebras as the discrete objects (`animatedPiZero`, `animatedDiscrete`). The node uses the animated algebras only. Over a commutative ℚ-algebra k, Derived.commutativeAlgebraToConnectiveCommAlg identifies the animated algebras with the connective commutative algebra objects in the derived category of k-modules. For a field k of characteristic 0, the opposite category is the category of derived affine schemes of [AGKRRV] §0.9.6. This node does not depend on Derived.commutativeAlgebraToConnectiveCommAlg. Provider: roadmap EnhancedDerivedSheaves, “Animated commutative algebra”, E5:animation.1 `animatedAlgebras`.'
deps = ['GLCinLean.Derived.commutativeAlgebra']
source = '[AGKRRV] §0.9.6'
