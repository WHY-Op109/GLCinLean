desc = 'The enhanced derived category of k-vector spaces, with its tensor product. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.derivedVect'
kind = 'definition'
desc = 'Enhanced localization of complexes of k-vector spaces at quasi-isomorphisms, with derived tensor product. The category with its localization functor is Infinity.enhancedDerivedCategory for the k-vector spaces. This node states no t-structure: the standard t-structure of this category is the specialization of Infinity.enhancedDerivedCategoryTStructure to the vector spaces over a field. Provider: roadmap EnhancedDerivedSheaves, `enhancedDerived`, `derivedTensor` and `derivedTensor_symmetricMonoidal`; none of the three lists a t-structure under its needs. Upstream declarations used: `CochainComplex` (`Mathlib.Algebra.Homology.HomologicalComplex`), `TauCeti.DGCategory` (`TauCeti.CategoryTheory.DG.Basic`), `TauCeti.dgNerve` (`TauCeti.AlgebraicTopology.DGNerve.Basic`), `TauCeti.KInjectiveDGCategory` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.KInjectiveDGCategory.dgNerveHomotopyCategoryEquiv` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`). Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.presentableCategory']
source = '[AGKRRV] §0.9.3; [IndCoh] §0.6.4'
