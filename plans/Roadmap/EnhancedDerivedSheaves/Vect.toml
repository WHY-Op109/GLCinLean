id = 'GLCinLean.Infinity.derivedVect'
kind = 'definition'
desc = 'The enhanced derived category of the vector spaces over a field k, with the derived tensor product as a symmetric monoidal structure: the symmetric monoidal stable ∞-category of complexes of k-vector spaces of [AGKRRV] §0.9.3. The category with its localization functor is Infinity.enhancedDerivedCategory for the k-vector spaces. The symmetric monoidal structure is built by the route of the roadmap, a localization (E1.4, proof route of `derivedTensor`: “Layer E5:abstract identifies the higher symmetric monoidal coherences by monoidal localization”; E5:abstract.4: “applying the supplied monoidal localization to the symmetric monoidal category of K-flat complexes and the quasi-isomorphisms between them”; over a field every complex is K-flat). The complexes of k-vector spaces, with the tensor product of complexes and the Koszul braiding, are a symmetric monoidal category, and the quasi-isomorphisms are stable under the tensor product with a complex. The localization of the nerve of its category of operators at the quasi-isomorphisms (Infinity.symmetricMonoidalLocalization) is a symmetric monoidal quasicategory whose fibre over ⟨1⟩ is a localization of the nerve of the complexes at the quasi-isomorphisms. The theorem Infinity.enhancedDerivedCategory_isLocalization identifies this fibre with the category of this node, compatibly with the two functors from the complexes. So the node depends on both. No shorter route with a source is known. Two direct constructions on the dg nerve fail: a natural map from the product of the dg nerves of two dg categories to the dg nerve of their tensor product cannot be both associative and compatible with the symmetry (on 2-simplices it has one coefficient α; associativity forces α² = α and symmetry forces 2α = 1), and the category of operators of the complexes is not a dg category, because its composition is multilinear in the components of a map. This does not show that every construction needs the theorem; a route without it is a change of route, with `prompts/change.md`. Checks of the structure: the unit is the image of k in degree 0; the tensor product of the images of two complexes is the image of their tensor product, naturally in maps of complexes; on two classes of degree one the symmetry carries the sign −1. This node states no t-structure: the standard t-structure of this category is the specialization of Infinity.enhancedDerivedCategoryTStructure to the vector spaces over a field. Provider: roadmap EnhancedDerivedSheaves, `enhancedDerived`, `derivedTensor` and `derivedTensor_symmetricMonoidal`; none of the three lists a t-structure under its needs. At the pin: Mathlib has the instance `IsGrothendieckAbelian.{u} (ModuleCat.{u} R)` in `Mathlib.Algebra.Category.ModuleCat.AB`, so for a field `k : Type u` the hypotheses of `TauCeti.KInjectiveDGCategory.fromNerve` hold, and the quasicategory `TauCeti.dgNerve k (TauCeti.KInjectiveDGCategory (ModuleCat.{u} k))` with its localization map from the nerve of the complexes is at the pin, with all that Infinity.enhancedDerivedCategory lists. The derived tensor product of Tau Ceti, `TauCeti.derivedTensor` (`TauCeti.Algebra.Homology.Monoidal.KFlat.LeftDerivedTensor`), is one on ordinary derived categories. Still to do: what Infinity.enhancedDerivedCategory lacks; the derived tensor product as a symmetric monoidal quasicategory (items `symmetric-monoidal-category-nerve`, `tensor-compatible-localization` and `derived-vect-symmetric-monoidal` of `docs/worker-targets/targets.md`, with `enhanced-derived-localization`); and presentability, with compact generation by k (item `derived-vect-presentable`). Upstream declarations used: `CochainComplex` (`Mathlib.Algebra.Homology.HomologicalComplex`), `TauCeti.DGCategory` (`TauCeti.CategoryTheory.DG.Basic`), `TauCeti.dgNerve` (`TauCeti.AlgebraicTopology.DGNerve.Basic`), `TauCeti.KInjectiveDGCategory` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.KInjectiveDGCategory.dgNerveHomotopyCategoryEquiv` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.KInjectiveDGCategory.fromNerve` (`TauCeti.CategoryTheory.DG.CochainComplex.Localization`), `TauCeti.koszulSymmetricCategory` (`TauCeti.Algebra.Homology.Monoidal.Braiding`). Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.presentableCategory', 'GLCinLean.Infinity.enhancedDerivedCategory_isLocalization', 'GLCinLean.Infinity.symmetricMonoidalLocalization']
