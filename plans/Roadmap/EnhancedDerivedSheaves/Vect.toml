desc = 'The enhanced derived category of k-vector spaces, with its tensor product. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.derivedVect'
kind = 'definition'
desc = 'Enhanced localization of complexes of k-vector spaces at quasi-isomorphisms, with derived tensor product. The category with its localization functor is Infinity.enhancedDerivedCategory for the k-vector spaces. This node states no t-structure: the standard t-structure of this category is the specialization of Infinity.enhancedDerivedCategoryTStructure to the vector spaces over a field. Provider: roadmap EnhancedDerivedSheaves, `enhancedDerived`, `derivedTensor` and `derivedTensor_symmetricMonoidal`; none of the three lists a t-structure under its needs. At the pin: Mathlib has the instance `IsGrothendieckAbelian.{u} (ModuleCat.{u} R)` in `Mathlib.Algebra.Category.ModuleCat.AB`, so for a field `k : Type u` the hypotheses of `TauCeti.KInjectiveDGCategory.fromNerve` hold, and the quasicategory `TauCeti.dgNerve k (TauCeti.KInjectiveDGCategory (ModuleCat.{u} k))` with its localization map from the nerve of the complexes is at the pin, with all that Infinity.enhancedDerivedCategory lists. The derived tensor product of Tau Ceti, `TauCeti.derivedTensor` (`TauCeti.Algebra.Homology.Monoidal.KFlat.LeftDerivedTensor`), is one on ordinary derived categories. Still to do: what Infinity.enhancedDerivedCategory lacks; the derived tensor product as a symmetric monoidal quasicategory (item `derived-vect-symmetric-monoidal` of `docs/worker-targets/targets.md`); and presentability, with compact generation by k (item `derived-vect-presentable`). Upstream declarations used: `CochainComplex` (`Mathlib.Algebra.Homology.HomologicalComplex`), `TauCeti.DGCategory` (`TauCeti.CategoryTheory.DG.Basic`), `TauCeti.dgNerve` (`TauCeti.AlgebraicTopology.DGNerve.Basic`), `TauCeti.KInjectiveDGCategory` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.KInjectiveDGCategory.dgNerveHomotopyCategoryEquiv` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.KInjectiveDGCategory.fromNerve` (`TauCeti.CategoryTheory.DG.CochainComplex.Localization`). Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.presentableCategory']
source = '[AGKRRV] §0.9.3; [IndCoh] §0.6.4'
