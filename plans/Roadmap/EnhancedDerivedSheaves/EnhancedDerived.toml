desc = 'The enhanced derived category of a Grothendieck abelian category, in particular of the sheaves of modules over a sheaf of rings that need not be commutative. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.enhancedDerivedCategory'
kind = 'definition'
desc = '''For a Grothendieck abelian category A (`CategoryTheory.IsGrothendieckAbelian`), the enhanced derived category D∞(A) is the localization, as a quasicategory, of the nerve of the category of cochain complexes of A at the quasi-isomorphisms. It is constructed as the differential graded nerve of the K-injective complexes, with the localization functor Q from the nerve of the complexes, which sends a complex to a K-injective replacement. D∞(A) is a stable quasicategory (Infinity.stableCategory). Its homotopy category, with the triangulated structure of Infinity.homotopyCategoryPretriangulated, has an equivalence of triangulated categories to `DerivedCategory A`, under which the functor that Q induces from the complexes is `DerivedCategory.Q`. For A = `SheafOfModules R`, with R a sheaf of rings on a small site, not assumed commutative, D∞(A) has in addition the t-structure (Infinity.tStructure) that this equivalence carries to the standard t-structure of `DerivedCategory A` (`DerivedCategory.TStructure.t`); its heart is A. The case used: the site of the opens of a scheme X and a sheaf of rings R on it that is not commutative; `SheafOfModules R` is Grothendieck abelian by the instance of `Mathlib.CategoryTheory.Abelian.GrothendieckAxioms.SheafOfModules`, which is for a small category. Checks: for A the modules over a ring R, the homotopy category is the derived category of R-modules, and the heart is the R-modules; the zero complex is a zero object; a map of complexes goes to an equivalence exactly when it is a quasi-isomorphism. Users: DModules.rightCrystals_equiv_dModules and Infinity.derivedBimoduleTransfer; Infinity.derivedVect is the case of the vector spaces over a field, and Sheaves.schemeQCoh is a full subcategory of the case of the structure sheaf of a scheme. Provider: roadmap EnhancedDerivedSheaves, E1.3 “The enhanced derived category”: `enhancedDerived`, `enhancedDerived.homotopyCategory` (“the equivalence with `DerivedCategory A`”), `enhancedDerived.isStable` and `enhancedDerived.detection`, stated so: “For a Grothendieck abelian category A, the same comparison uses the injective model of HA §1.3.5; for a ringed site use `A = SheafOfModules O`, allowing noncommutative O for this additive comparison”, and “the functor from the nerve of complexes to `D∞(A)` is a Dwyer–Kan localization at the quasi-isomorphisms”; its checks say “The equivalence of homotopy categories carries the class of a map of complexes to `DerivedCategory.Q.map` of that map”. The t-structure is of §0.1 “Enhanced derived sheaf categories”, for “an essentially small site C and a sheaf of rings R”: “the standard cohomological t-structure and its `D⁺` and `Dᵇ` subcategories”, where “an arbitrary coefficient ring is allowed for the additive enhancement”. In Tau Ceti at the pin: for an abelian category C that is linear over a commutative ring and has K-injective resolutions, the differential graded nerve of the K-injective complexes and an equivalence of categories from its homotopy category to `DerivedCategory C`, with no statement on shifts or triangles; K-injective resolutions in every Grothendieck abelian category; and, for a ring R that need not be commutative, an equivalence between the derived category of the sheaves of modules on the one-point site and the derived category of the R-modules. Upstream declarations used: `TauCeti.KInjectiveDGCategory` and `TauCeti.KInjectiveDGCategory.dgNerveHomotopyCategoryEquiv` (`TauCeti.CategoryTheory.DG.CochainComplex.KInjective`), `TauCeti.hasKInjectiveResolutions_of_isGrothendieckAbelian` (`TauCeti.Algebra.Homology.ModelCategory.KInjective.Resolution`), `TauCeti.ModulePointSite.derivedEquivalence` (`TauCeti.Algebra.Category.ModuleCat.Sheaf.Point`), `CategoryTheory.IsGrothendieckAbelian` (`Mathlib.CategoryTheory.Abelian.GrothendieckCategory.Basic`), `SheafOfModules` (`Mathlib.Algebra.Category.ModuleCat.Sheaf`), `DerivedCategory.Q` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `DerivedCategory.TStructure.t` (`Mathlib.Algebra.Homology.DerivedCategory.TStructure`).'''
deps = ['GLCinLean.Infinity.stableCategory', 'GLCinLean.Infinity.homotopyCategoryPretriangulated', 'GLCinLean.Infinity.tStructure']
