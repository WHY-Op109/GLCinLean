desc = 'The universal property of the enhanced derived category of a Grothendieck abelian category: its functor from the complexes is a localization of quasicategories at the quasi-isomorphisms. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.enhancedDerivedCategory_isLocalization'
kind = 'theorem'
desc = '''For a Grothendieck abelian category A, the localization functor Q of Infinity.enhancedDerivedCategory, from the nerve of the category of cochain complexes of A to D∞(A), is a localization (Infinity.IsLocalization) of that nerve at the quasi-isomorphisms: Q sends the quasi-isomorphisms to equivalences and, for every quasicategory E of the universe of D∞(A), precomposition with Q is a categorical equivalence from the quasicategory of the functors D∞(A) → E to the full subquasicategory of the functors from the nerve of the complexes to E that send every quasi-isomorphism to an equivalence. So a functor on the nerve of the complexes that sends the quasi-isomorphisms to equivalences is naturally equivalent to the composite of Q with a functor on D∞(A), which is unique up to a contractible choice. Check: by Infinity.IsLocalization (2), the functor that Q induces on homotopy categories is a localization of categories at the quasi-isomorphisms; under the equivalence of Infinity.enhancedDerivedCategory with `DerivedCategory A` it is `DerivedCategory.Q`, which Mathlib proves to be one. Users: Infinity.derivedVect (the theorem identifies the localization that carries the symmetric monoidal structure with the dg nerve), DModules.rightCrystals_equiv_dModules (the action of the complexes of k-vector spaces passes to the localizations) and Infinity.derivedBimoduleTransfer (the tensor product passes from the K-flat complexes to D∞). Infinity.enhancedDerivedCategoryTStructure does not use the theorem and does not wait for this node. Sheaves.schemeQCoh and Constructible.DerivedCategory do not use the theorem themselves; they wait for this node through Infinity.derivedVect and through Infinity.derivedBimoduleTransfer. Provider: roadmap EnhancedDerivedSheaves, E1.3 “The enhanced derived category”: “More precisely, the functor from the nerve of complexes to `D∞(A)` is a Dwyer–Kan localization at the quasi-isomorphisms (the supplied localization universal property; HA Proposition 1.3.5.15)”. This is a sentence of the target `enhancedDerived` and none of the parts that E1.3 names for it: `enhancedDerived.homotopyCategory`, `enhancedDerived.mappingSpaces`, `enhancedDerived.isStable` and `enhancedDerived.detection`. In Tau Ceti at the pin: the map `TauCeti.KInjectiveDGCategory.fromNerve` with the results that Infinity.enhancedDerivedCategory lists; the module doc comment of its module says “The universal property of `TauCeti.KInjectiveDGCategory.fromNerve` as a localization of quasicategories at the quasi-isomorphisms is not proved here”. Still to do: Infinity.IsLocalization, then the theorem (item `enhanced-derived-localization` of `docs/worker-targets/targets.md`, stated for a category that is linear over a commutative ring, as the declarations at the pin are). Upstream declarations used: `TauCeti.KInjectiveDGCategory.fromNerve` (`TauCeti.CategoryTheory.DG.CochainComplex.Localization`), `HomologicalComplex.quasiIso` (`Mathlib.Algebra.Homology.QuasiIso`), `DerivedCategory.Q` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`).'''
deps = ['GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.IsLocalization']
source = '[LurieHA] Proposition 1.3.5.15 (not pinned; cited as the roadmap cites it)'
