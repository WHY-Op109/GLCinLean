desc = 'Dualizable objects of presentable k-linear categories under tensor product, with evaluation/coevaluation, triangle identities and Funct_cont(C,D)=C^vee tensor D. Prove compactly generated categories dualizable and retracts dualizable; for modules over a rigid monoidal category, prove the dualizable relative-tensor functor preserves limits. Provider: roadmap EnhancedDerivedSheaves, “Dualizable, compactly assembled and rigid categories” and “Stable monoidal structures”.'
