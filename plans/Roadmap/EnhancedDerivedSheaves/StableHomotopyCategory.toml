id = 'GLCinLean.Infinity.homotopyCategoryPretriangulated'
kind = 'definition'
desc = 'The triangulated structure on the homotopy category of a stable quasicategory. For a stable quasicategory C (the predicate `SSet.IsStable`), in every universe, the homotopy category hC (`SSet.HomotopyCategory`) gets: a preadditive structure and a zero object; a shift by ℤ whose shift by 1 is induced by the suspension Σ and whose shift by −1 is induced by the loop functor Ω; additivity of every shift functor; and the pretriangulated structure whose distinguished triangles are the triangles isomorphic to the image of X → Y → cofib(f) → ΣX for a map f : X → Y of C. With these, hC is triangulated (the octahedral axiom holds). An exact functor F : C → D of stable quasicategories (a functor that preserves zero objects and finite colimits, equivalently finite limits) induces a functor hC → hD that commutes with the shifts and is triangulated (`Functor.CommShift` for ℤ, `Functor.IsTriangulated`); for the identity and for a composite of exact functors the commutation isomorphisms are those of the identity and of the composite. These are exactly the instances that `CategoryTheory.Triangulated.TStructure` asks of a category and that `Functor.TExact` asks of a functor, so Infinity.tStructure and the t-exact functors of its users can be stated. Checks: for the stable quasicategory with one object, hC is the zero category with its only triangulated structure; a triangle X → Y → Z → ΣX of hC that comes from a cofibre sequence stays distinguished after rotation, with the sign −Σf of Mathlib on the rotated map. Provider: roadmap EnhancedDerivedSheaves, as a prerequisite of its targets and not a named target. Three of its targets cannot be stated without this structure: E0.6 `dgNerve_shift_cone_comparison` (“the triangulated structure that stability induces on the homotopy category (HA Theorem 1.1.2.14) is the pretriangulated structure Mathlib puts on the homotopy category of complexes”), and E5:abstract.4 `stableMonoidal_homotopyCategory` (“compatible with suspension and with the distinguished triangles of cofibre sequences”) and `exactMonoidalFunctor_triangle` (an exact monoidal functor “carries the cofibre triangle of f to that of `F(f)`, with the suspension comparison of Section E0.4”). E0.4 “Limits, colimits and stability” provides what the structure is built from: `stable_fibre_cofibre`, `stable_suspension_loop` and `stable_exact_iff`. This area is chosen for two reasons: E0.4 holds the suspension and the exact functors, and E0.6 is the first target in the order of the roadmaps that needs the structure. HermitianKTheoryOfPoincareCategories §6.0 (Infinity.tStructure) and GeometryOfNumbersAndQuadraticArithmetic §6.1a also use the structure; both list EnhancedDerivedSheaves E0.4 under their needs and build none of it. No roadmap states the structure as a target, and GeneralizedCohomology G2.11 builds no triangulated homotopy category. If the review of Tau Ceti declines it as outside the roadmap, the node comes back through `prompts/change.md`. In Tau Ceti at the pin: no stability predicate and no `Pretriangulated` instance for a quasicategory. Upstream declarations used: `SSet.HomotopyCategory` (`Mathlib.AlgebraicTopology.SimplicialSet.HomotopyCat`), `CategoryTheory.Pretriangulated` (`Mathlib.CategoryTheory.Triangulated.Pretriangulated`), `CategoryTheory.IsTriangulated` (`Mathlib.CategoryTheory.Triangulated.Triangulated`), `CategoryTheory.Functor.CommShift` (`Mathlib.CategoryTheory.Shift.CommShift`), `CategoryTheory.Functor.IsTriangulated` (`Mathlib.CategoryTheory.Triangulated.Functor`), `CategoryTheory.Functor.TExact` (`Mathlib.CategoryTheory.Triangulated.TStructure.TExact`). Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.limits']
