desc = 'The enhanced quasi-coherent derived category of a classical scheme. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Sheaves.schemeQCoh'
kind = 'definition'
desc = '''Enhanced quasicoherent derived sheaves on qcqs classical schemes, affine comparison and ordinary homotopy-category comparison. The homotopy-category comparison: for a quasi-compact quasi-separated scheme X, the homotopy category of this stable category, with the triangulated structure of Infinity.homotopyCategoryPretriangulated, is equivalent as a triangulated category to `DQCoh X` (Sheaves.derivedQCoh). The equivalence is the restriction of `enhancedDerived.homotopyCategory` (E1.3) to the two full subcategories. It holds by the definition of E1.8: `QuasicoherentDerived` is the full subcategory of `D∞(O_X)` “on the objects whose image in the homotopy category lies in `DQCoh X`”, the homotopy category of a full subcategory of a quasicategory is the full subcategory of the homotopy category on the same objects, and E1.3 gives the suspension and the cofibres of `D∞(O_X)` by the shift and the mapping cone of Mathlib (`enhancedDerived.isStable`). With the comparison: (1) this category is closed under the small coproducts of `D∞(O_X)`, so it has small coproducts and they are the coproducts of `DQCoh X` (small as in Sheaves.derivedQCoh); (2) the unit goes to O_X in degree 0. The mapping spaces of this category are small, as those of `D∞(O_X)`, of which it is a full subcategory (E1.3: `enhancedDerived.mappingSpaces`, `enhancedDerived_isPresentable`). That the perfect objects (`PerfectDerived`) correspond to the perfect objects of `DQCoh X` is the roadmap node Sheaves.perfectDerived_iff_isPerfectComplex, of SchemeKTheoryOperations. The comparison of the homotopy categories is a prerequisite of `quasicoherentDerived_affine` and not a named target: E1.8 says of the affine comparison “on homotopy categories this is §2.18's `DQCoh.affineEquiv`”. Sheaves.schemeQCoh_compactGeneration uses the comparison with (1) and (2), and the small mapping spaces. Checks of the comparison: for the empty scheme both categories are zero; for Spec of a field k both are the derived category of k-vector spaces, with the unit k. Provider: roadmap EnhancedDerivedSheaves, `QuasicoherentDerived` and `quasicoherentDerived_affine` (“Quasicoherent derived sheaves and base change”). Upstream declarations used: `AlgebraicGeometry.Scheme.Modules` (`Mathlib.AlgebraicGeometry.Modules.Sheaf`), `SheafOfModules.IsQuasicoherent` (`Mathlib.Algebra.Category.ModuleCat.Sheaf.Quasicoherent`), `DerivedCategory` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `SSet.fullEnhancedSubcategory` (`TauCeti.AlgebraicTopology.Quasicategory.FullSubcategory`).'''
deps = ['GLCinLean.Infinity.derivedVect', 'GLCinLean.Derived.affineModules', 'GLCinLean.Infinity.homotopyCategoryPretriangulated', 'GLCinLean.Sheaves.derivedQCoh']
source = '[IndCoh] §0.6.7'
