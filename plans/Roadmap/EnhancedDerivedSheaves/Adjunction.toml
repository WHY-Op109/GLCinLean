id = 'GLCinLean.Infinity.rightAdjoint'
kind = 'definition'
desc = 'Adjunctions of enhanced categories, by the mapping-space equivalence, and the adjoint functor theorem: a colimit-preserving functor between presentable categories has a right adjoint, which need not preserve colimits. Linearity of the right adjoint is a separate statement where it holds. Provider: roadmap EnhancedDerivedSheaves, `adjointFunctorTheorem` (“Representability, adjoints and localizations”).'
