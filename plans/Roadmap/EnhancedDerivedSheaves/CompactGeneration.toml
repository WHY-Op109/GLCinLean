desc = 'Compact generation of presentable categories. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.compactGeneration'
kind = 'definition'
desc = '''Generation under colimits by a small full subcategory of compact objects. For a presentable stable category C and a small set S of compact objects (Infinity.compactObject), these three conditions are equivalent, and C is compactly generated when they hold for some S: (a) the shifts of S detect zero: an object y of C with Hom(s[n], y) = 0 in the homotopy category for all s in S and all n in ℤ is a zero object; (b) no proper full stable subcategory of C that is closed under small colimits contains S; (c) for a small category C_S equivalent to the smallest full stable subcategory of C that contains S, the functor from the Ind-completion (Infinity.indCompletion) of C_S to C is an equivalence. Form (a) is `IsCompactlyGenerated` of the roadmap. [CompactGeneration] §1.2.2 defines generation by the condition that Hom(c_α, c) = 0 for all α implies c = 0, with Hom the degree 0 cohomology of the mapping complex (§1.1.7) and no shifts, and says that it is equivalent to (b). This plan reads the condition of the paper for the set of all shifts of S, which is (a); without the shifts it is not equivalent to (b) (the check with S = {k} in Infinity.compactObject_iff_homotopyCategory). The set S need not be closed under shifts in (a), (b) or (c). Check: the zero category is compactly generated by the empty set, and each of (a), (b), (c) holds for the empty set only in the zero category. The checks in Infinity.derivedVect are in Infinity.compactObject_iff_homotopyCategory. Provider: roadmap EnhancedDerivedSheaves, “Compact generation and Ind-completion” (`IsCompactlyGenerated`: “A presentable stable C is compactly generated when there is a small set of compact objects whose shifts detect zero objects”) and “Stable colimits and compact generation”. Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'''
deps = ['GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.indCompletion', 'GLCinLean.Infinity.presentableCategory']
source = '[CompactGeneration] §§1.1.7 and 1.2.2; [GLC1] §1.6.4'
