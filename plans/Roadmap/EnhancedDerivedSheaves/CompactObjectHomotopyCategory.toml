desc = 'The test of compactness of an object of a stable category on the homotopy category. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves, as a prerequisite of targets.'

[[node]]
id = 'GLCinLean.Infinity.compactObject_iff_homotopyCategory'
kind = 'theorem'
desc = '''Let C be a stable category (the predicate `SSet.IsStable`) in which every family of objects indexed by a type of a fixed universe w has a coproduct; small means indexed by a type of the universe w. C is not assumed presentable or locally small. The Hom sets of the homotopy category hC are abelian groups by Infinity.homotopyCategoryPretriangulated. (i) C has all small colimits, and a small coproduct in C is a coproduct in hC. (ii) For an object c these two conditions are equivalent: the mapping-space functor of c, with values in the spaces of the universe of C, preserves small filtered colimits; and Hom_hC(c, −) commutes with small coproducts, that is, the map ⊕_i Hom_hC(c, y_i) → Hom_hC(c, ⊕_i y_i) is bijective for every small family (y_i) ([CompactGeneration] §1.2.1; [LurieHA] Proposition 1.4.4.1(3)). When C is locally small for the universe w, which is the hypothesis of `IsKappaCompact` (E0.8: “C in `u + 1` and locally u-small”), the first condition says that c is compact (Infinity.compactObject). Sheaves.schemeQCoh_compactGeneration uses (i) and (ii). Checks in Infinity.derivedVect, for a field k: k is compact and its shifts detect zero, so Infinity.derivedVect is compactly generated by {k} (Infinity.compactGeneration, form (a)); the object ⊕_ℕ k is not compact, by (ii) and its identity map, which does not factor through a finite subsum; the shifts are needed in the detection: Hom(k, k[1]) = 0 and k[1] is not zero. Provider: roadmap EnhancedDerivedSheaves, as a prerequisite of targets and not a named target. `exact_preservesColimits_iff_coproducts` (E3.3 “Stable colimits and compact generation”) is the first half of (i). `rightAdjoint_preservesCoproducts_iff` (E3.3) and `IsLocallyWeaklyContractible.compactlyGenerated` (E2.5) cite Higher Algebra, Proposition 1.4.4.1(3) for the compactness of an object that is tested against coproducts. If the review of Tau Ceti declines the theorem as outside the roadmap, it comes back through `prompts/change.md`. The objects of hC that are compact for coproducts are `IsCompactForCoproducts` of roadmap StableHomotopyKTheory §5.17, which the open Tau Ceti #43034 writes; it tests the coproducts indexed by the types in the universe of the morphisms of the category, so it is the condition of (ii) when the morphisms of hC are in the universe w. Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'''
deps = ['GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.homotopyCategoryPretriangulated', 'GLCinLean.Infinity.derivedVect']
source = '[LurieHA] Proposition 1.4.4.1; [CompactGeneration] §1.2.1'
