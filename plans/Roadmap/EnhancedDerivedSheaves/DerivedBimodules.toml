desc = 'The enhanced derived tensor product with a sheaf of bimodules, the enhanced direct image of sheaves of modules, and their composite, for sheaves of rings that need not be commutative. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves; the direct image is a named target, and the tensor product is a prerequisite that the accepted roadmap SpringerResolutionAndCharacteristicCycles asks of it.'

[[node]]
id = 'GLCinLean.Infinity.derivedBimoduleTransfer'
kind = 'definition'
desc = '''Let X be a topological space and R and S sheaves of rings on X, not assumed commutative. Write Mod(Rᵒᵖ) for the sheaves of right R-modules (`SheafOfModules` over the opposite ring sheaf), and D∞ and Q for the category and the localization functor of Infinity.enhancedDerivedCategory. (1) Tensor product. For a sheaf T of (R, S)-bimodules on X, which is a sheaf of left R-modules with a right action of S that commutes with the action of R: an exact functor − ⊗ᴸ_R T from D∞(Mod(Rᵒᵖ)) to D∞(Mod(Sᵒᵖ)), with an equivalence Q(M ⊗_R T) ≃ Q(M) ⊗ᴸ_R T for the K-flat complexes M of right R-modules, natural in M. So on homotopy categories it is the left derived functor of M ↦ M ⊗_R T. (2) Direct image. For a continuous map f : X → Y, a sheaf of rings S′ on Y and a map of sheaves of rings S′ → f_*S: an exact functor Rf_* from D∞(Mod(Sᵒᵖ)) to D∞(Mod(S′ᵒᵖ)), with an equivalence Q(f_*M) ≃ Rf_*Q(M) for the K-injective complexes M, natural in M. So on homotopy categories it is the right derived functor of f_*, on which S′ acts through S′ → f_*S. (3) Transfer. For a sheaf T of (R, f⁻¹S′)-bimodules on X, the transfer functor of T is the composite M ↦ Rf_*(M ⊗ᴸ_R T) of (1), for S = f⁻¹S′, with (2), for the map S′ → f_*f⁻¹S′. For f the identity, S′ = R and T = R with its two actions, it is equivalent to the identity functor. (4) Restriction. For an open V of Y with preimage U, specified equivalences between the functors (1) and (2) for the data restricted to U and V, applied after the restriction to U, and the restrictions to U and to V of the functors (1) and (2); for opens W ⊆ V they are compatible with the restriction from V to W. Checks: for X and Y one point, (3) is M ↦ M ⊗ᴸ_R T for rings R and S′ and an (R, S′)-bimodule T; for R = S′ = T = ℤ it is the identity of D∞ of the abelian groups. Users: DModules.transferModule (3), on homotopy categories, and DModules.deRhamPushforward. Provider: roadmap EnhancedDerivedSheaves. (2) is the direct image of the named target `enhancedPushforward` of E1.4 “Tensor, internal Hom, pullback, pushforward and change of coefficients” (“`Rf_∗` by K-injective right derivation of `f_∗`”, for a morphism of ringed topoi); Layer E1 says “Additive comparisons allow noncommutative O; tensor and commutative algebra statements assume O commutative”. (1), (3) and (4) are a prerequisite and not a named target: the README of EnhancedDerivedSheaves names no bimodule, and E1.4 states the derived tensor product “For a sheaf of commutative rings O”. The accepted roadmap SpringerResolutionAndCharacteristicCycles asks for the extension, under “From TauCetiRoadmap.EnhancedDerivedSheaves”: “The transfer bimodules of §9.1 are noncommutative coefficients, so their tensor–Hom comparison requires the following extension. What EnhancedDerivedSheaves must provide (gap:derived-bimodule-sheaves): Supply associative-ring sheaf bimodule derived tensor, internal Hom and pushforward with their actions, associativity, adjunction, restriction and affine comparisons compatible with additive K-injective models and bounded coherent D-module transfer.” Its §9.1 lists “EnhancedDerivedSheaves §§0.1–0.4, E1.3–E1.4 and the derived-bimodule contract” under its needs. This node states the tensor product, the direct image and the restriction of that contract. It does not state the internal Hom, the associativity of the tensor product or the tensor–Hom adjunction: no node written here uses them, and the contract gives no hypotheses under which a derived Hom keeps a second action. DModules.transferModule names them as inputs inside Tau Ceti. If the review of Tau Ceti declines (1), (3) or (4) as outside the roadmap EnhancedDerivedSheaves, the node comes back through `prompts/change.md`. The functor of (1) is defined on the K-flat complexes and passes to D∞ through the universal property of Q, Infinity.enhancedDerivedCategory_isLocalization: the proof route of `derivedTensor` in E1.4, which is for a sheaf of commutative rings, says “the total tensor product of K-flat complexes descends to the localization at quasi-isomorphisms, which is `D∞(O)` because every complex has a K-flat replacement”. In Tau Ceti at the pin: for a commutative ring, the derived tensor product of complexes of modules; for a sheaf of commutative rings on a small site, K-flat resolutions of the complexes of sheaves of modules and the derived tensor product on the unbounded derived category (`TauCeti.derivedTensor` is defined for every abelian braided monoidal category whose K-flat complexes form a left derivability structure, and the module `TauCeti.Algebra.Category.ModuleCat.Sheaf.TensorProduct.KFlat` gives this structure for the sheaves of modules); the direct image of sheaves of modules along a continuous functor of sites, not derived; no tensor product of a sheaf of modules with a sheaf of bimodules over a sheaf of rings that is not commutative. Searched in the pinned sources of Tau Ceti and Mathlib: `derivedTensor` and `DerivedTensor` (on monoidal abelian categories, with the left derivability structures for modules over a commutative ring and for sheaves of modules), `KFlat`, and `bimodule` or `Bimodule` (no file matches these two together with `SheafOfModules`, `PresheafOfModules` or `Sheaf`). Upstream declarations used: `TauCeti.derivedTensor` (`TauCeti.Algebra.Homology.Monoidal.KFlat.LeftDerivedTensor`), `CochainComplex.exists_quasiIso_isKFlat_sheafOfModules` (`TauCeti.Algebra.Category.ModuleCat.Sheaf.TensorProduct.KFlat`), `SheafOfModules.pushforward` (`Mathlib.Algebra.Category.ModuleCat.Sheaf.PushforwardContinuous`).'''
deps = ['GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.Infinity.enhancedDerivedCategory_isLocalization']
