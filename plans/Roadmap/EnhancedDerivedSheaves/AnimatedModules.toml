[[node]]
id = 'GLCinLean.Derived.commutativeAlgebraToConnectiveCommAlg'
kind = 'definition'
desc = '''The comparison of the animated commutative k-algebras (Derived.commutativeAlgebra) with the connective commutative algebra objects of the derived category of k. For a commutative ring k, let CAlg(D(k)^{≤0}) be the commutative algebra objects, for the symmetric monoidal structure of the derived tensor product (`derivedTensor_symmetricMonoidal`; Infinity.derivedVect for a field), of the connective part of the enhanced derived category of the k-modules, which is the part ≤ 0 of Infinity.enhancedDerivedCategoryTStructure for the modules over k. (1) The functor θ from Derived.commutativeAlgebra to CAlg(D(k)^{≤0}) that preserves sifted colimits and extends the inclusion of the polynomial k-algebras as discrete commutative algebras (`animatedToCAlg`). It is defined for every commutative ring k. (2) For a commutative ℚ-algebra k, in particular for a field of characteristic 0, θ is an equivalence (`animatedToCAlg_equiv_of_rational`). So over a field k of characteristic 0 Derived.commutativeAlgebra is equivalent to the category of the connective commutative algebras in Vect_k of [AGKRRV] §0.9.6, and Derived.affineScheme to the category of derived affine schemes of the paper. (3) For a commutative ℚ-algebra k, localization of the commutative DG k-algebras at quasi-isomorphisms gives the commutative algebra objects of D(k). Restricting to algebras with cohomology in nonpositive degrees gives the connective comparison. Good truncation at degree 0 gives equivalent representatives concentrated in nonpositive degrees. Composing with (2) gives the comparison with animated k-algebras. These are the connective commutative DG algebras of [Crystals] §§0.1.3 and 0.6.4. The roadmap cites [LurieHA] Proposition 7.1.4.11 for (3) and names no declaration for it. Checks: θ sends k[x_1, …, x_n] to the polynomial algebra, discrete (`animatedToCAlg_polynomial`); over ℚ, θ is an equivalence on objects and on mapping spaces; over 𝔽_2, θ is not an equivalence: the degree-two part of the free commutative algebra object on 𝔽_2 in degree 0 has the homology of BΣ_2, nonzero in every degree ≥ 0, and the animated polynomial algebra 𝔽_2[x] is discrete. Users: Derived.affineModules (the module category of an animated algebra B is that of θB); in the plan of the proof, SpectralProof.factorizationVacuum_almostULA (a connective commutative algebra of Vect_k that corresponds to an animated algebra almost of finite type). Provider: roadmap EnhancedDerivedSheaves, E5:animation.4 “Animated rings as commutative algebras and their modules”: `animatedToCAlg`, `animatedToCAlg_polynomial` and `animatedToCAlg_equiv_of_rational`. `animatedToCAlg` lists under its needs `moduleSpectra_equiv_derived`, `animationExtension`, `animatedAlgebras`, `operadicAlgebras`, `derivedTensor_symmetricMonoidal` and `enhancedDerived`. `moduleSpectra_equiv_derived` (E5:spectra-comparison) lists `spectra`, `presentableTensor`, `leftModuleObjects`, `derivedTensor_symmetricMonoidal`, `stableMonoidal_homotopyCategory`, `enhancedDerived` and `IsCompactlyGenerated`. Use the symmetric monoidal derived tensor product for every commutative ring k, supplied by `derivedTensor_symmetricMonoidal` on the point site. `Infinity.derivedVect` is its field specialization. The comparison also needs the roadmap interfaces `operadicAlgebras`, `leftModuleObjects`, `spectra`, `presentableTensor` and `moduleSpectra_equiv_derived`. The plan tracks the compact-generation input through `Infinity.compactGeneration`. In Tau Ceti and Mathlib at the pin: no animated ring, no commutative algebra object of a quasicategory, and no Eilenberg–Mac Lane ring spectrum.'''
deps = ['GLCinLean.Derived.commutativeAlgebra', 'GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.linearCategory', 'GLCinLean.Infinity.derivedVect', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.enhancedDerivedCategoryTStructure', 'GLCinLean.Infinity.compactGeneration']
source = '[AGKRRV] §§0.9.3, 0.9.6; [Crystals] §§0.1.3, 0.6.4; [LurieHA] Theorem 7.1.2.13, Propositions 7.1.4.11 and 7.1.4.20, and Warning 7.1.4.21'

[[node]]
id = 'GLCinLean.Derived.affineModules'
kind = 'definition'
desc = 'Enhanced modules over a connective commutative derived k-algebra, with scalar extension and relative tensor product. The modules over an animated algebra B (Derived.commutativeAlgebra) are the modules, in the derived category of k, over the commutative algebra object θB of Derived.commutativeAlgebraToConnectiveCommAlg (`animatedModules`: “`Mod_B = Mod_{θB}(D(R))`”). Provider: roadmap EnhancedDerivedSheaves, “Algebras, modules and the monoidal envelope” and “Animated rings as commutative algebras and their modules” (`animatedModules`, which lists `animatedToCAlg` under its needs).'
deps = ['GLCinLean.Derived.commutativeAlgebra', 'GLCinLean.Derived.commutativeAlgebraToConnectiveCommAlg', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.derivedVect']
source = '[AGKRRV] §§0.9.3, 0.9.6; [IndCoh] §0.6.7'
