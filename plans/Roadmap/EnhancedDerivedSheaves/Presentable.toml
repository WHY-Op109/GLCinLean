desc = 'Presentable enhanced categories. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.presentableCategory'
kind = 'definition'
desc = 'Accessible enhanced categories admitting all small colimits, with explicit universe bounds. Provider: roadmap EnhancedDerivedSheaves, `IsAccessible` and `IsPresentable` (“Filtered diagrams, accessibility and presentability”, “Presentable categories, their limits and spectra”). In Tau Ceti at the pin, only universe control and the shapes of diagrams: `SSet.IsCardinalFiltered` (`TauCeti.AlgebraicTopology.SimplicialSet.CardinalFiltered`); `SSet.IsLocallySmall` and `SSet.smallMappingSpace` (`TauCeti.AlgebraicTopology.Quasicategory.LocallySmall`); `TauCeti.SmallSpaceModel` and `TauCeti.HasSmallSpaceModel` (`TauCeti.AlgebraicTopology.SimplicialSet.SmallModel`); and `TauCeti.dgNerve.rightMappingSpaceSmallModel` (`TauCeti.AlgebraicTopology.DGNerve.LocallySmall`), by which a dg nerve is locally small. Mathlib has presentable ordinary categories only. Still to do: `κ`-filtered colimits (item `kappa-filtered-colimits` of `docs/worker-targets/targets.md`), the quasicategory of spaces `SSet.spaces` (the open Tau Ceti #42960 of another contributor), the functors to spaces represented by an object (`representable-space-functor`), the predicate that a quasicategory has all small colimits (`small-limits-and-colimits`), and `κ`-compact objects, the Ind-completion and accessible and presentable quasicategories (`compact-objects-and-ind`).'
deps = ['GLCinLean.Infinity.limits']
source = '[IndCoh] §0.6.4'
