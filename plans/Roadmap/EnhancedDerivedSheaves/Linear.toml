id = 'GLCinLean.Infinity.linearCategory'
kind = 'definition'
desc = 'Presentable stable categories with an action of complexes of k-vector spaces; retain the actual field k. Provider: roadmap EnhancedDerivedSheaves, “Algebras, modules and the monoidal envelope” and “Presentable categories, their limits and spectra”. In Tau Ceti at the pin: nothing beyond the stability predicate `SSet.IsStable`. Still to do: the four prerequisites Infinity.monoidalCategory, Infinity.moduleCategory, Infinity.presentableCategory and Infinity.derivedVect, then the definition (item `presentable-stable-linear-category` of `docs/worker-targets/targets.md`). Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.presentableCategory', 'GLCinLean.Infinity.derivedVect', 'GLCinLean.Infinity.moduleCategory']
source = '[AGKRRV] §0.9.4; [IndCoh] §0.6.4'
