desc = 'Presentable stable k-linear categories. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.linearCategory'
kind = 'definition'
desc = 'Presentable stable categories with an action of complexes of k-vector spaces; retain the actual field k. Provider: roadmap EnhancedDerivedSheaves, “Algebras, modules and the monoidal envelope” and “Presentable categories, their limits and spectra”. Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.presentableCategory', 'GLCinLean.Infinity.derivedVect', 'GLCinLean.Infinity.moduleCategory']
source = '[AGKRRV] §0.9.4; [IndCoh] §0.6.4'
