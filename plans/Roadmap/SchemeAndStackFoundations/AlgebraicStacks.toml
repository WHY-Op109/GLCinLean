id = 'GLCinLean.Stacks.algebraicStack'
kind = 'definition'
desc = 'Ordinary stacks in groupoids with representable diagonal and smooth atlas, their presentations and base change. Provider: roadmap SchemeAndStackFoundations, of §1.18 “Stacks in groupoids, stackification and 2-fibre products” the stacks in groupoids on schemes for the fppf topology with their morphisms; §1.19 “Representable morphisms, algebraic stacks and Deligne–Mumford stacks” (`IsRepresentableBySpaces`, `IsAlgebraicStack`); and §1.20 “Inertia, the setoid criterion, properties of morphisms and presentations”. The site-level stackification and 2-fibre products of §1.18 are Stacks.stackification. In Tau Ceti: the definition of §1.18, `TauCeti.AlgebraicGeometry.StackInGroupoids` with its morphisms (`TauCeti.AlgebraicGeometry.Stack.StackInGroupoids`). Still to do: of §1.18 the API of stacks in groupoids (`ofSheaf`, `yonedaEquiv`, `isFiberedInGroupoids`, `limit`); and all of §§1.19–1.20, which rest on the algebraic spaces of §§1.2–1.11. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`).'
deps = ['GLCinLean.Stacks.stackification']
source = '[GLC1] §1.1.1; [AGKRRV] §0.9.1'
