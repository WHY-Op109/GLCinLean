desc = 'Ordinary stacks in groupoids with representable diagonal and smooth atlas, their presentations and base change. Provider: roadmap SchemeAndStackFoundations, §1.18 “Stacks in groupoids, stackification and 2-fibre products”, §1.19 “Representable morphisms, algebraic stacks and Deligne–Mumford stacks” (`IsRepresentableBySpaces`, `IsAlgebraicStack`) and §1.20 “Inertia, the setoid criterion, properties of morphisms and presentations”. In Tau Ceti: the definition of §1.18, `TauCeti.AlgebraicGeometry.StackInGroupoids` with its morphisms (`TauCeti.AlgebraicGeometry.Stack.StackInGroupoids`). Still to do: stackification and 2-fibre products of §1.18, and all of §§1.19–1.20, which rest on the algebraic spaces of §§1.2–1.11. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`).'
source = '[GLC1] §1.1.1; [AGKRRV] §0.9.1'
