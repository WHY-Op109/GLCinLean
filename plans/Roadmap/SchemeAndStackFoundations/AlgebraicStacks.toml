id = 'GLCinLean.Stacks.algebraicStack'
kind = 'definition'
desc = 'Ordinary stacks in groupoids with representable diagonal and smooth atlas, their presentations and base change. Provider: roadmap SchemeAndStackFoundations, of §1.18 “Stacks in groupoids, stackification and 2-fibre products” the stacks in groupoids on schemes for the fppf topology with their morphisms; §1.19 “Representable morphisms, algebraic stacks and Deligne–Mumford stacks” (`IsRepresentableBySpaces`, `IsAlgebraicStack`); and §1.20 “Inertia, the setoid criterion, properties of morphisms and presentations”. The site-level stackification and 2-fibre products of §1.18 are Stacks.stackification. In Tau Ceti: the definition of §1.18, `TauCeti.AlgebraicGeometry.StackInGroupoids` with its morphisms, and the `ofSheaf` of §1.18, the stack in groupoids of an fppf sheaf of sets, whose fibre over a scheme is the discrete groupoid on the sections over it, `TauCeti.AlgebraicGeometry.StackInGroupoids.ofSheaf` (`TauCeti.AlgebraicGeometry.Stack.StackInGroupoids`). It is built on the discrete pseudofunctor of a presheaf of types on any site, which is a stack for a topology exactly when the presheaf is a sheaf for it, `CategoryTheory.Pseudofunctor.ofPresheaf` and `CategoryTheory.Pseudofunctor.isStack_ofPresheaf_iff` (`TauCeti.CategoryTheory.Sites.Descent.Discrete`). Also at the pin: of §1.18, `TauCeti.AlgebraicGeometry.StackInGroupoids.yonedaEquiv` (`TauCeti.AlgebraicGeometry.Stack.Yoneda`), `isFiberedInGroupoids` in the module of the definition, and the 2-fibre product `TauCeti.AlgebraicGeometry.StackInGroupoids.twoFiberProduct` (`TauCeti.AlgebraicGeometry.Stack.TwoFiberProduct`); of §1.19, the morphisms that are representable by algebraic spaces, with the identity and base change (the module `TauCeti.AlgebraicGeometry.Stack.Representable`); and of §1.20, the category of dotted arrows of a 2-commutative square and the lifting of discrete valuation rings after an extension (the module `TauCeti.AlgebraicGeometry.Stack.ValuativeCriterion`). Still to do: of §1.18 `limit`; of §1.19 the composite of representable morphisms, `diag_representable_iff` and `IsAlgebraicStack`; and the rest of §§1.19–1.20, which rest on the algebraic spaces of §§1.2–1.11. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`).'
deps = ['GLCinLean.Stacks.stackification']
source = '[GLC1] §1.1.1; [AGKRRV] §0.9.1'
