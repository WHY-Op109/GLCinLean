desc = 'The quotient stack of a groupoid in sheaves on a site. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Stacks.quotientStack'
kind = 'definition'
desc = 'On a site (C, J), for a groupoid object (X, R) in sheaves: the quotient stack [X/R], the stackification (Stacks.stackification) of the prestack with objects X(T) and arrows R(T), with its map X → [X/R], the equivalence R ≃ X ×_{[X/R]} X, the description of its objects over T as locally trivial R-torsors, and its universal property. For a sheaf of groups G acting trivially on the terminal sheaf it is the stack BG of G-torsors. Provider: roadmap SchemeAndStackFoundations, the site-level part of §1.21 “Quotient stacks, line bundles with a section, root stacks”: `Stack.quotient`, `Stack.quotient.π` and `.desc`. The construction of this part uses §1.18 only: it is the stackification of a prestack of groupoids. This is a reading of the construction; the roadmap gives one list of needs for all of §1.21 (§1.13, §1.14, §1.15, §1.19, §1.20), which does not separate the site-level part. Not used by this plan from §1.21: the quotient stacks of groupoid schemes, `quotientStack_algebraic`, `lineBundleSectionStack` and `rootStack`, which need algebraic stacks (Stacks.algebraicStack). The target is not in Tau Ceti. Upstream declarations used: `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`).'
deps = ['GLCinLean.Stacks.stackification']
source = '[GLys] §§1.3.1 and 1.3.5'
