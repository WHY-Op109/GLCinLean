desc = 'Torsors under group schemes in the fppf topology, with local trivializations, descent and associated bundles. Provider: roadmap SchemeAndStackFoundations, §1.15 “Torsors, torsor classes and the multiplicative group” (`IsTorsor`, `torsorRepresentability`) and §1.16 “Contracted products and twisting” (`contractedProduct`, `pushforwardTorsor`). In Tau Ceti, on any site: torsors of a sheaf of groups and their classes (`CategoryTheory.Sheaf.Torsor`, `Sheaf.NonabelianH1`), the contracted product along a homomorphism of sheaves of groups (`CategoryTheory.Sheaf.Torsor.map`, `TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`), and the comparison of torsor classes of an abelian sheaf with `H¹` (`CategoryTheory.Sheaf.NonabelianH1.equivSheafH`, `TauCeti.CategoryTheory.Sites.NonabelianCohomology.SheafH.Basic`). Also at the pin: torsors under a group object of a site as torsors of its sheaf of points, `CategoryTheory.GrothendieckTopology.IsTorsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.GrpObj`), with the functor of points from the torsors under the group object to the torsors of its sheaf of points, which is fully faithful and whose essential image is the torsors with a representable sheaf, `CategoryTheory.GrothendieckTopology.toTorsorFunctor` and `CategoryTheory.Sheaf.Torsor.toTorsorFunctor_essImage_iff` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.GrpObj`); the action of a monoid object on an object that represents a presheaf with an action of its points, `TauCeti.ModObj.ofRepresentableBy` (`TauCeti.CategoryTheory.Monoidal.Cartesian.Mod`); the case of a group scheme and the fppf topology (the module `TauCeti.AlgebraicGeometry.GroupScheme.Torsor`); the representability of torsors under an affine group scheme, over every base scheme S and with no flatness of the group: every torsor of a sheaf of groups on the big fppf site of S whose sheaf of sets a scheme affine over S represents is represented by a scheme affine over S, `CategoryTheory.Sheaf.Torsor.exists_isAffineHom_nonempty_representableBy` (`TauCeti.AlgebraicGeometry.Descent.Representable`); so for a group scheme G affine over S every torsor of the sheaf of points of G is the torsor of points of a G-torsor affine over S, and the functor of points is an equivalence from the G-torsors to the torsors of the sheaf of points, `TauCeti.GroupScheme.exists_isTorsor_nonempty_toTorsor_iso` and `TauCeti.GroupScheme.isEquivalence_toTorsorFunctor` (`TauCeti.AlgebraicGeometry.GroupScheme.Torsor`); that representability on the big Zariski site is local on the base (the module `TauCeti.AlgebraicGeometry.Sites.Big.Representability`); the contracted product of a torsor with a sheaf of sets with an action, `CategoryTheory.Sheaf.Torsor.contractedProduct` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.ContractedProduct`); the multiplicative group scheme over any base scheme with its points; and the frame torsor of an invertible sheaf under the sheaf of units, with its class and the injectivity of the class map (the module `TauCeti.AlgebraicGeometry.LineBundle.FrameTorsor`). Still to do: the associated bundle `X ×^G P` of a G-scheme X, with the torsor pushed forward along a homomorphism of group schemes; and the classifying stack of a group scheme. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
source = '[GLC1] §§1.1.1, 1.3.1'
