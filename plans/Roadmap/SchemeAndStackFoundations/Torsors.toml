desc = 'Torsors under group schemes in the fppf topology, with local trivializations, descent and associated bundles. Provider: roadmap SchemeAndStackFoundations, §1.15 “Torsors, torsor classes and the multiplicative group” (`IsTorsor`, `torsorRepresentability`) and §1.16 “Contracted products and twisting” (`contractedProduct`, `pushforwardTorsor`). In Tau Ceti, on any site: torsors of a sheaf of groups and their classes (`CategoryTheory.Sheaf.Torsor`, `Sheaf.NonabelianH1`), the contracted product along a homomorphism of sheaves of groups (`CategoryTheory.Sheaf.Torsor.map`, `TauCeti.CategoryTheory.Sites.NonabelianCohomology.Map`), and the comparison of torsor classes of an abelian sheaf with `H¹` (`CategoryTheory.Sheaf.NonabelianH1.equivSheafH`, `TauCeti.CategoryTheory.Sites.NonabelianCohomology.SheafH`). Still to do: torsors under a group scheme for the fppf topology with their representability and descent, and the associated bundle `X ×^G P` of a G-space X. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
source = '[GLC1] §§1.1.1, 1.3.1'
