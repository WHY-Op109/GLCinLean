desc = 'Compact generation, by one perfect complex, of the derived category of complexes with quasi-coherent cohomology on a quasi-compact quasi-separated scheme. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Sheaves.derivedQCoh_perfectGenerator'
kind = 'theorem'
desc = '''The objects. `DQCoh X` is Sheaves.derivedQCoh; for X in `Scheme.{u}`, small means indexed by a type in `Type u`. A perfect object of `DerivedCategory X.Modules` is an object that a perfect complex represents, and a complex E of O_X-modules is perfect when every point of X has an open neighbourhood U with a quasi-isomorphism to the restriction of E to U from a strictly perfect complex on U ([StacksProject] Definition 20.49.1, tag 08CM). A strictly perfect complex is a bounded complex whose terms are direct summands of finite free modules; the roadmap takes bounded complexes of finite locally free modules, and both give the same perfect complexes, because the condition is local. A perfect complex need not be strictly perfect, even on a point: an unbounded contractible complex represents the perfect object 0. Every perfect object lies in `DQCoh X`. An object K of an additive category with small coproducts is compact when the map ⊕_i Hom(K, E_i) → Hom(K, ⊕_i E_i) is bijective for every small family (E_i) ([StacksProject] Definition 13.37.1, tag 07LS). The theorem. Let X be a quasi-compact quasi-separated scheme. (1) Every perfect object is a compact object of `DQCoh X`. (2) There is one perfect object P such that every object E of `DQCoh X` with Hom(P[n], E) = 0 for all n in ℤ is zero. So `DQCoh X` is compactly generated, as a triangulated category with small coproducts, by the one compact object P. The users in this plan need (2), and (1) for every perfect object (Sheaves.schemeQCoh_compactGeneration (2)). The statement does not say that every compact object of `DQCoh X` is perfect ([StacksProject] Proposition 36.17.1, tag 09M1, which this target of the roadmap does not cite), and the plan does not use it. Hypotheses. X is any quasi-compact quasi-separated scheme: no base, no Noetherian or separatedness hypothesis. Quasi-compactness is needed for (1): for X the disjoint union of countably many copies of Spec k, k a field, `DQCoh X` is the product of countably many copies of D(k), the structure sheaf O is perfect, and with O_i the structure sheaf of the i-th copy extended by zero, ⊕_i O_i = O and Hom(O, ⊕_i O_i) is the product of countably many copies of k, which is not ⊕_i Hom(O, O_i); in this example (2) holds with P = O. Checks. For the empty scheme `DQCoh` is the zero category, and P = 0. For X = Spec A the object P = O_X satisfies (2) (`DQCoh.affineEquiv`: an A-complex M with H^n(M) = 0 for all n is zero); for a field k this is D(k) with the generator k, where ⊕_ℕ k is not compact. On the projective line over a field, O ⊕ O(−1) satisfies (2) and O alone does not: Hom(O[n], O(−1)) = H^{−n}(ℙ¹, O(−1)) = 0 for all n, and O(−1) is not zero. Provider: roadmap SchemeAndStackFoundations, §2.18 “Derived categories of quasi-coherent complexes”, the target `perfect_generator` (“for `X` quasi-compact quasi-separated, `DQCoh X` is generated by a single perfect complex and is compactly generated by perfect complexes”), with `perfect_dual` and `totalDirectImage_coproduct` of the same section, which the proof of (1) uses: Hom(K, E) is the degree 0 cohomology of the derived global sections of the dual of K tensor E, and derived global sections commute with small coproducts on `DQCoh X` for a quasi-compact quasi-separated X. The roadmap cites [StacksProject] §36.15, Lemmas 36.15.1–36.15.2 and Theorem 36.15.3; statement (2) is Theorem 36.15.3. Statement (1) is a reading of “compactly generated by perfect complexes”; the weaker reading is that the generator is compact. The interface check at the deletion of this node asks for (1) for every perfect object; if Tau Ceti has only the weaker statement, (1) is deduced from `perfect_dual` and `totalDirectImage_coproduct` as above before the node is deleted. Three inputs belong to other roadmaps, and this target waits for them and writes none of them. (a) Perfect complexes: §2.18 uses the word and defines none. They are `IsPerfectComplex` of roadmap SchemeKTheoryOperations §1.3 (“local quasi-isomorphism from the strictly perfect models of §1.1”), the roadmap node Sheaves.IsPerfectComplex, which is not written; the open Tau Ceti #43025 writes the strictly perfect complexes of §1.1 (`isStrictlyPerfect`). (b) Compact objects: `IsCompactForCoproducts` of roadmap StableHomotopyKTheory §5.17, which the open Tau Ceti #43034 writes as `TauCeti.IsCompactForCoproducts`. It tests the coproducts indexed by the types in the universe of the morphisms of the category. For `DerivedCategory X.Modules` with `HasDerivedCategory.standard` that universe is u+1. On that model `IsCompactForCoproducts K` implies statement (1), because a type of `Type u` is small for `Type (u+1)`, and it is equivalent to statement (1), because the Hom sets are u-small: a family with a coproduct has only a u-small set of non-zero members. On a model with morphisms in `Type u` it is statement (1). Either form passes the interface check. (c) Lemma 36.13.8 (tag 08EI: on an affine scheme, for a perfect object F on a quasi-compact open subscheme, F ⊕ F[1] is the restriction of a perfect object), with Lemmas 36.13.6 and 36.13.7 that its proof uses: targets of roadmap SchemeKTheoryOperations §3.2 “Extension and localization of perfect objects”. The proof of Theorem 36.15.3 uses Lemma 36.15.1 (a perfect object on a quasi-compact open subscheme is a direct summand of the restriction of a perfect object) and Lemma 36.15.2, which §2.18 cites for this target. Stacks states Lemma 36.15.1 as a special case of Lemma 36.13.11; for this case the proof of Lemma 36.13.11 is an induction on the number of affine opens that uses Lemma 36.13.10, of which Lemma 36.13.8 is the case without a support condition, and the gluing of objects of the derived category on two opens ([StacksProject] Lemma 20.45.1, tag 08DG). This target does not wait for the targets of §3.2 on Lemma 36.13.11 and on the supported generator, which list the perfect generators of §2.18 under their needs. Not used by this plan from §2.18: `torIndependent_baseChange` and the bounded and coherent variants. In Tau Ceti at the pin: pseudo-coherent module sheaves with their characterization on affine opens; perfect complexes of modules over a ring, for the affine case; and the localizing closure of a class of objects of a pretriangulated category. At the pin there is no `DQCoh`, no strictly perfect or perfect complex of module sheaves, no compact object of an additive or triangulated category, and no `perfect_generator`. Upstream declarations used: `AlgebraicGeometry.Scheme.Modules.IsPseudoCoherent` (`TauCeti.AlgebraicGeometry.Modules.PseudoCoherent.Basic`), `AlgebraicGeometry.Scheme.Modules.isPseudoCoherent_iff_forall_affineOpens` (`TauCeti.AlgebraicGeometry.Modules.PseudoCoherent.Affine`), `TauCeti.DerivedDeRham.IsPerfect` (`TauCeti.Algebra.Homology.ModuleCat.Perfect`), `CategoryTheory.ObjectProperty.localizingClosure` (`TauCeti.CategoryTheory.Triangulated.LocalizingClosure`).'''
deps = ['GLCinLean.Sheaves.derivedQCoh', 'GLCinLean.Sheaves.IsPerfectComplex']
