desc = 'The Kummer sequence on the big étale site of a scheme, for an exponent that is invertible. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Etale.kummer_shortExact'
kind = 'theorem'
desc = 'For a scheme S and n > 0 invertible on S, the sequence 0 → μ_n → 𝔾_m → 𝔾_m → 0, with the n-th power map, is a short exact sequence of sheaves of abelian groups on the big étale site of S (the schemes over S with the étale topology): μ_n is the kernel of the n-th power map, and the n-th power map is an epimorphism of sheaves for the étale topology. The second claim says that every unit u on a scheme T over S has an n-th root on an étale covering of T; the covering is the Kummer cover t^n = u. The sequence restricts to the Kummer sequence of T on the slice at every T → S. Provider: roadmap SchemeAndStackFoundations, §2.9 “Big-site sheaves of quasi-coherent modules and the sheaves `𝔾_a`, `𝔾_m`, `μ_n`” for the sheaves, and of §2.11 “Hilbert 90, the Kummer and Artin–Schreier sequences, finite pushforward” the clause of `fppf_kummer_sequence` that “for `n` invertible on `X` the sequence is already exact on the étale site”. The roadmap cites Stacks Lemma 59.28.1 for this clause, which is on the small étale site of X, and exports the clause with `muEtale`. The statement of this node is on the big étale site; it is stronger and gives the clause of the roadmap by restriction to the small étale site, and the same Kummer cover proves both. Not used by this plan from §2.11: `hilbert90`, the exactness on the fppf site for every n, the sequences in H¹ and H² with `Br′`, and the comparison of §2.10; nor Tsen (§2.16) and the restrictions `GmEtale`, `muEtale` to the small étale site. In Tau Ceti: the sheaves `AlgebraicGeometry.Scheme.Gm S` and `AlgebraicGeometry.Scheme.mu S n` on the schemes over S, for the fpqc topology and so for the étale topology, the n-th power map `powHom S n`, and μ_n as its kernel (`isLimitMuKernelFork`); the finite étale Kummer cover of an affine scheme (`TauCeti.FiniteEtaleScheme.kummerCover`). At the pin also the epimorphism claim: for n invertible on S and a topology between the étale and the fpqc topology, the n-th power map is locally surjective and is an epimorphism of sheaves of abelian groups on the schemes over S (`AlgebraicGeometry.Scheme.isLocallySurjective_powHom` and `AlgebraicGeometry.Scheme.epi_sheafPushforwardContinuous_map_powHom`, in `TauCeti.AlgebraicGeometry.Sites.Big.Kummer`). Still to do: the short exact sequence as one statement, and the restriction to slices. Upstream declarations used: `AlgebraicGeometry.Scheme.Gm`, `AlgebraicGeometry.Scheme.mu`, `AlgebraicGeometry.Scheme.powHom` and `AlgebraicGeometry.Scheme.isLimitMuKernelFork` (`TauCeti.AlgebraicGeometry.Sites.Big.StructureSheaf`), `TauCeti.FiniteEtaleScheme.kummerCover` (`TauCeti.AlgebraicGeometry.FiniteEtale.Kummer`), `AlgebraicGeometry.Scheme.etaleTopology` (`Mathlib.AlgebraicGeometry.Sites.Etale`), `AlgebraicGeometry.Scheme.etaleTopology_le_proetaleTopology` and `AlgebraicGeometry.Scheme.proetaleTopology_le_fpqcTopology` (`Mathlib.AlgebraicGeometry.Sites.Proetale`), `CategoryTheory.GrothendieckTopology.over` (`Mathlib.CategoryTheory.Sites.Over`).'
source = '[GLys] §1.4.1 and §1.4.2; [GLC1] §1.1.4'
