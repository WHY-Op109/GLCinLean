desc = 'Stackification and 2-fibre products of stacks on a site. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Stacks.stackification'
kind = 'definition'
desc = 'On a site (C, J): the stackification of a `Cat`-valued pseudofunctor F on C, a stack for J with a strong transformation from F, such that for every stack G precomposition with it is an equivalence between the strong transformations (with modifications) from the stackification to G and those from F to G; the Isom presheaves of the stackification are the sheafifications of those of F, and every object of the stackification is locally in the image of F. And the 2-fibre product of two maps of stacks over a common target, with its projections, its 2-cell and its universal property. Provider: roadmap SchemeAndStackFoundations, the site-level part of §1.18 “Stacks in groupoids, stackification and 2-fibre products”: `Stack.stackification`, `Stack.toStackification`, `Stack.isStack_stackification`, `Stack.stackificationUniversal`, `Stack.stackification_of_isStack`, `Stack.stackification_isom_sheafify`, `Stack.stackification_locally_essSurj` and `Stack.twoFibreProduct`. The roadmap states the stackification for a small site, a category `C : Type u` with `Category.{u} C` and a pseudofunctor `F : LocallyDiscrete Cᵒᵖ ⥤ᵖ Cat.{u, u}`, names the fppf site of `Scheme.{u}` as a case of it, and states the 2-fibre product on any site; it lists §1.1 and Mathlib under their needs, and no algebraic space. The nodes of this plan use both constructions on the big étale site `Over S` of a scheme `S : Scheme.{u}`. That is a site with objects in `Type (u + 1)` and arrows in `Type u`, with pseudofunctors that have values in `Cat.{u, u + 1}`, as `TauCeti.AlgebraicGeometry.SchPseudofunctor` has. So the stackification and the 2-fibre product are stated at these universe levels; the form for a small site alone does not serve the nodes that use them. Stacks.abelianBandedGerbe needs none of this; Stacks.bandPreserving_isEquivalence, Stacks.gerbeChangeOfBand, Stacks.quotientStack and Stacks.schemeRootGerbe use it, on the big étale site of a scheme. In Tau Ceti: `TauCeti.AlgebraicGeometry.StackInGroupoids` with its morphisms; no stackification and no 2-fibre product of stacks. Upstream declarations used: `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`), `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `CategoryTheory.Limits.CategoricalPullback` (`Mathlib.CategoryTheory.Limits.Shapes.Pullback.Categorical.Basic`).'
source = '[GLC1] §1.1.3; [GLys] §1.3.2'
