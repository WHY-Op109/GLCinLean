desc = 'Stackification and 2-fibre products of stacks on a site. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Stacks.stackification'
kind = 'definition'
desc = 'On a site (C, J): the stackification of a `Cat`-valued pseudofunctor F on C, a stack for J with a strong transformation from F, such that for every stack G precomposition with it is an equivalence between the strong transformations (with modifications) from the stackification to G and those from F to G; the Isom presheaves of the stackification are the sheafifications of those of F, and every object of the stackification is locally in the image of F. And the 2-fibre product of two maps of stacks over a common target, with its projections, its 2-cell and its universal property. Provider: roadmap SchemeAndStackFoundations, the site-level part of §1.18 “Stacks in groupoids, stackification and 2-fibre products”: `Stack.stackification`, `Stack.toStackification`, `Stack.isStack_stackification`, `Stack.stackificationUniversal`, `Stack.stackification_of_isStack`, `Stack.stackification_isom_sheafify`, `Stack.stackification_locally_essSurj` and `Stack.twoFibreProduct`. The roadmap states the stackification for a small site, a category `C : Type u` with `Category.{u} C` and a pseudofunctor `F : LocallyDiscrete Cᵒᵖ ⥤ᵖ Cat.{u, u}`, names the fppf site of `Scheme.{u}` as a case of it, and states the 2-fibre product on any site; it lists §1.1 and Mathlib under their needs, and no algebraic space. The nodes of this plan use both constructions on the big étale site `Over S` of a scheme `S : Scheme.{u}`. That is a site with objects in `Type (u + 1)` and arrows in `Type u`, with pseudofunctors that have values in `Cat.{u, u + 1}`, as `TauCeti.AlgebraicGeometry.SchPseudofunctor` has. So the stackification and the 2-fibre product are stated at these universe levels; the form for a small site alone does not serve the nodes that use them. Stacks.abelianBandedGerbe needs none of this; Stacks.bandPreserving_isEquivalence, Stacks.gerbeChangeOfBand, Stacks.quotientStack and Stacks.schemeRootGerbe use it, on the big étale site of a scheme. In Tau Ceti at the pin: `TauCeti.AlgebraicGeometry.StackInGroupoids` with its morphisms; the 2-fibre product of pseudofunctors, with its projections, its 2-cell and its universal property, `TauCeti.Stack.twoFiberProduct` (`TauCeti.CategoryTheory.Bicategory.Functor.TwoFiberProduct`), which is a stack when it is formed from two stacks over a prestack (`twoFiberProduct.isStack`, in `TauCeti.CategoryTheory.Sites.Descent.TwoFiberProduct`); the pseudofunctor of descent data of a prestack along `w`-small covering families, on a site with pullbacks, `TauCeti.Stack.stackification` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.Pseudofunctor`); it is the stackification only when every covering sieve contains a covering sieve generated by a `w`-small family; the fully faithful functors from the fibres of the prestack to its fibres, `TauCeti.Stack.Stackification.Obj.toObjFunctor` and `TauCeti.Stack.Stackification.Obj.fullyFaithfulToObjFunctor` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.Unit`); the strong transformation from a prestack F to its stackification, with these functors as its components, and the theorem that every object of the stackification is locally in the image of F, `TauCeti.Stack.toStackification` and `TauCeti.Stack.stackification_locally_essSurj` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.StrongTrans`); and, for a stack F, the equivalences that these functors are, so that the stackification fixes a stack fibre by fibre, `TauCeti.Stack.Stackification.Obj.toObjEquivalence` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.OfIsStack`). The strong transformation is stated for a prestack with values in the universes of its stackification. The big site of `Scheme.{u}`, with covering families indexed in `Type u` and a prestack with values in `Cat.{u, u + 1}`, is such a case, and it is the case that the nodes of this plan use. A small site with a prestack with values in `Cat.{u, u}` is not such a case; for it the pin has the components and the naturality isomorphisms, `TauCeti.Stack.toStackificationNatIso` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.StrongTrans`), and not the strong transformation. The local essential surjectivity is stated in all universes. Two parts of the remaining work have their fibres at the pin: for a separated presheaf of sets with values in `Type (max u v)`, on a site where every covering sieve contains a covering sieve generated by a `w`-small family, the isomorphism classes of the fibre of the stackification of its discrete pseudofunctor are the elements of the plus construction, `TauCeti.Stack.Stackification.Obj.isoClassesEquivPlusObj` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.Discrete`); and for a pseudofunctor that is not a prestack, the fibres of the sheafification of its Hom presheaves, `TauCeti.Stack.Prestackification.Fiber` (`TauCeti.CategoryTheory.Sites.Descent.Stackification.HomSheafification`). Still to do: that the stackification is a stack; its universal property; that the strong transformation from a stack to its stackification is an equivalence of pseudofunctors; its comparison with the sheafification of a presheaf of sets, as sheaves; and the stackification of a pseudofunctor that is not a prestack, with the comparison of its Isom presheaves. Upstream declarations used: `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`), `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `CategoryTheory.Limits.CategoricalPullback` (`Mathlib.CategoryTheory.Limits.Shapes.Pullback.Categorical.Basic`).'
source = '[GLC1] §1.1.3; [GLys] §1.3.2'
