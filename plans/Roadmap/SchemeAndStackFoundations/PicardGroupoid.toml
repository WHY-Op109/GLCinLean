desc = 'The Picard groupoid of a scheme: the symmetric monoidal groupoid of invertible sheaves. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.LineBundle.picardGroupoid'
kind = 'definition'
desc = 'For a scheme X, the groupoid of invertible sheaves on X and their isomorphisms, as a symmetric monoidal category under the tensor product in which every object has a tensor inverse; and pullback along a map of schemes as a symmetric monoidal functor between these groupoids, with its isomorphisms for the identity map and for a composite. Provider: roadmap SchemeAndStackFoundations, §3.4 “Picard groups: divisor classes, excision, Picard groupoids”: `PicardGroupoid`, `picardGroupoid X := Core (InvertibleSheaf X)` with its symmetric monoidal structure and its `PicardGroupoid` instance, and `picardGroupoid.pullback` (“a functor of Picard groupoids”). Not used by this plan from §3.4: `picardGroupoid.pi0_equiv`, `pi1_equiv`, `isStack`, `gradedPicardGroupoid`, and the results on divisor classes. In Tau Ceti: the symmetric monoidal category of module sheaves (`AlgebraicGeometry.Scheme.Modules.instSymmetricCategory`), in which the invertible sheaves are a full subcategory closed under the tensor product; the single isomorphisms `tensorProductAssoc`, `tensorProductComm`, `tensorTrivialLeftIso`, `tensorTrivialRightIso` and `tensorDualIso` of invertible sheaves, with no monoidal category of invertible sheaves; and pullback as a functor with `pullbackId` and `pullbackComp`. The tensor comparison of the pullback functor is the isomorphism f^*(M ⊗ N) ≅ f^*M ⊗ f^*N of LineBundle.pullbackTensorIso, which is not written again here; this node adds its compatibility with the associativity, unit and symmetry isomorphisms. LineBundle.Root.tensorProduct takes the coherence of the tensor product of invertible sheaves and of its pullback from this node. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.dual` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorDualIso` (`TauCeti.AlgebraicGeometry.LineBundle.Dual`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `AlgebraicGeometry.Scheme.Modules.instSymmetricCategory` (`TauCeti.AlgebraicGeometry.Modules.Tensor.Product`), `CategoryTheory.Core` (`Mathlib.CategoryTheory.Core`).'
deps = ['GLCinLean.LineBundle.pullbackTensorIso']
source = '[GLys] §1.4.2; [GLC1] §1.1.4'
