desc = 'The Picard groupoid of a scheme: the symmetric monoidal groupoid of invertible sheaves. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.LineBundle.picardGroupoid'
kind = 'definition'
desc = 'For a scheme X, the groupoid of invertible sheaves on X and their isomorphisms, as a symmetric monoidal category under the tensor product in which every object has a tensor inverse; and pullback along a map of schemes as a symmetric monoidal functor between these groupoids, with its isomorphisms for the identity map and for a composite. Provider: roadmap SchemeAndStackFoundations, §3.4 “Picard groups: divisor classes, excision, Picard groupoids”: `PicardGroupoid`, `picardGroupoid X := Core (InvertibleSheaf X)` with its symmetric monoidal structure and its `PicardGroupoid` instance, and `picardGroupoid.pullback` (“a functor of Picard groupoids”). Not used by this plan from §3.4: `picardGroupoid.pi0_equiv`, `pi1_equiv`, `isStack`, `gradedPicardGroupoid`, and the results on divisor classes. In Tau Ceti: the symmetric monoidal category of module sheaves (`AlgebraicGeometry.Scheme.Modules.instSymmetricCategory`); the symmetric monoidal category `InvertibleSheaf X`, the full subcategory of the invertible sheaves with the tensor product, the unit, the associativity and the symmetry of the module sheaves: the instance `TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`) says that the invertible sheaves contain the unit and are closed under the tensor product, and Mathlib gives the structure to such a full subcategory, by the instance `CategoryTheory.ObjectProperty.fullSymmetricSubcategory` (`Mathlib.CategoryTheory.Monoidal.Subcategory`); the isomorphisms `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), from `InvertibleSheaf.tensorProduct L K` to the tensor product L ⊗ K of this category and from `InvertibleSheaf.trivial X` to its unit; the single isomorphisms `tensorProductAssoc`, `tensorProductComm`, `tensorTrivialLeftIso`, `tensorTrivialRightIso` and `tensorDualIso`, stated for `InvertibleSheaf.tensorProduct`, with no comparison with the associativity, symmetry and unit isomorphisms of this category; and pullback as a functor with `pullbackId` and `pullbackComp`, with no monoidal structure. Still to do: the symmetric monoidal structure on the groupoid `Core (InvertibleSheaf X)` (neither Mathlib nor Tau Ceti has a monoidal structure on the core of a monoidal category), `PicardGroupoid` with its instance (every object has a tensor inverse), and the symmetric monoidal pullback. The tensor comparison of the pullback functor is the isomorphism f^*(M ⊗ N) ≅ f^*M ⊗ f^*N of LineBundle.pullbackTensorIso, which is not written again here; this node adds its compatibility with the associativity, unit and symmetry isomorphisms. LineBundle.Root.tensorProduct takes the coherence of the tensor product of invertible sheaves and of its pullback from this node. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.dual` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorDualIso` (`TauCeti.AlgebraicGeometry.LineBundle.Dual`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `AlgebraicGeometry.Scheme.Modules.instSymmetricCategory` (`TauCeti.AlgebraicGeometry.Modules.Tensor.Product`), `TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `CategoryTheory.Core` (`Mathlib.CategoryTheory.Core`).'
deps = ['GLCinLean.LineBundle.pullbackTensorIso']
source = '[GLys] §1.4.2; [GLC1] §1.1.4'
