desc = 'The Picard groupoid of a scheme: the symmetric monoidal groupoid of invertible sheaves. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.LineBundle.picardGroupoid'
kind = 'definition'
desc = 'For a scheme X, the groupoid of invertible sheaves on X and their isomorphisms, as a symmetric monoidal category under the tensor product in which every object has a tensor inverse; and pullback along a map of schemes as a symmetric monoidal functor between these groupoids, with its isomorphisms for the identity map and for a composite. Provider: roadmap SchemeAndStackFoundations, §3.4 “Picard groups: divisor classes, excision, Picard groupoids”: `PicardGroupoid`, `picardGroupoid X := Core (InvertibleSheaf X)` with its symmetric monoidal structure and its `PicardGroupoid` instance, and `picardGroupoid.pullback` (“a functor of Picard groupoids”). Not used by this plan from §3.4: `picardGroupoid.pi0_equiv`, `pi1_equiv`, `isStack`, `gradedPicardGroupoid`, and the results on divisor classes. In Tau Ceti: the symmetric monoidal category of module sheaves (`AlgebraicGeometry.Scheme.Modules.instSymmetricCategory`); the symmetric monoidal category `InvertibleSheaf X`, the full subcategory of the invertible sheaves with the tensor product, the unit, the associativity and the symmetry of the module sheaves: the instance `TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`) says that the invertible sheaves contain the unit and are closed under the tensor product, and Mathlib gives the structure to such a full subcategory, by the instance `CategoryTheory.ObjectProperty.fullSymmetricSubcategory` (`Mathlib.CategoryTheory.Monoidal.Subcategory`); the isomorphisms `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), from `InvertibleSheaf.tensorProduct L K` to the tensor product L ⊗ K of this category and from `InvertibleSheaf.trivial X` to its unit; the single isomorphisms `tensorProductAssoc`, `tensorProductComm`, `tensorTrivialLeftIso`, `tensorTrivialRightIso` and `tensorDualIso`, stated for `InvertibleSheaf.tensorProduct`, with no comparison with the associativity, symmetry and unit isomorphisms of this category; and the symmetric monoidal structure on the core of a symmetric monoidal category, with the braided monoidal functor that a braided monoidal functor induces on the cores (the module `TauCeti.CategoryTheory.Monoidal.Core`), so `Core (InvertibleSheaf X)` is a symmetric monoidal groupoid. The braided monoidal structure of the pullback functor `InvertibleSheaf.pullback`, between the categories `InvertibleSheaf`, is the node LineBundle.pullbackBraided. Still to do: `PicardGroupoid` with its instance for `Core (InvertibleSheaf X)` (every object has a tensor inverse); and the pullback of Picard groupoids, as the functor on the cores of the braided monoidal functor of LineBundle.pullbackBraided, which is braided monoidal by the module `TauCeti.CategoryTheory.Monoidal.Core`, with its isomorphisms for the identity map and for a composite. No node of `plans/` or of `plans-proof/` depends on this node. LineBundle.Root.pullbackTensorProductIso uses LineBundle.pullbackBraided, and LineBundle.Root.tensorProduct uses the symmetric monoidal category `InvertibleSheaf X` and the specified dual `InvertibleSheaf.dual`. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.dual` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorDualIso` (`TauCeti.AlgebraicGeometry.LineBundle.Dual`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `AlgebraicGeometry.Scheme.Modules.instSymmetricCategory` (`TauCeti.AlgebraicGeometry.Modules.Tensor.Product`), `TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `CategoryTheory.Core` (`Mathlib.CategoryTheory.Core`).'
deps = ['GLCinLean.LineBundle.pullbackBraided']
source = '[GLys] §1.4.2; [GLC1] §1.1.4'
