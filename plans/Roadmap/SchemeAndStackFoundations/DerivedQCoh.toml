desc = 'The derived category of complexes with quasi-coherent cohomology on a scheme, with its coproducts, its affine case and its restriction to opens. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.Sheaves.derivedQCoh'
kind = 'definition'
desc = '''For every scheme X, with no hypothesis, `DQCoh X` is the full subcategory of the derived category `DerivedCategory X.Modules` of sheaves of O_X-modules on the Zariski site of X, on the complexes all of whose cohomology sheaves are quasi-coherent ([StacksProject] Section 36.3, tag 06YZ). With it: (1) it is a triangulated subcategory, closed under shifts and cones (*DQCoh.isTriangulated*); (2) it is closed under the small coproducts of `DerivedCategory X.Modules`, which exist and are computed termwise, so its small coproducts are those of the derived category of all modules (*DQCoh.hasCoproducts*; [StacksProject] Lemma 36.3.1, tag 08DT); (3) for X = Spec A the derived functor of M ↦ M~ is an equivalence from the derived category of A-modules to `DQCoh (Spec A)` (`DQCoh.affineEquiv`; [StacksProject] Lemma 36.3.5, tag 06Z0); (4) restriction to an open subscheme sends `DQCoh X` to `DQCoh U` (*DQCoh.restrict*). Universes. For X in `Scheme.{u}` the category `X.Modules` has objects in `Type (u+1)` and morphisms in `Type u`, and it is a Grothendieck abelian category for the universe u. Small means: indexed by a type in `Type u`. Hom sets of the derived category are u-small (by K-injective resolutions in a Grothendieck abelian category; this is not an item of §2.18). The roadmap takes `HasDerivedCategory.standard`, whose morphisms are in `Type (u+1)`; statements about coproducts and compact objects are about the coproducts indexed by `Type u` (Sheaves.derivedQCoh_perfectGenerator states its interface). Checks: O_X in degree 0 lies in `DQCoh X`; for the empty scheme `DQCoh` is the zero category; for a field k, `DQCoh (Spec k)` is the derived category of k-vector spaces; for X the spectrum of a discrete valuation ring and j the inclusion of the generic point, j_!O in degree 0 is not in `DQCoh X`. Users: Sheaves.schemeQCoh (E1.8 lists `DQCoh`, `DQCoh.affineEquiv` and `DQCoh.restrict` under its needs) and Sheaves.derivedQCoh_perfectGenerator. Provider: roadmap SchemeAndStackFoundations, §2.18 “Derived categories of quasi-coherent complexes”: `DQCoh` (in its `Suggested.lean`: `Coherent.DQCoh`, with `Coherent.DQCoh.affineEquiv`), *DQCoh.mem_iff*, *DQCoh.isTriangulated*, *DQCoh.hasCoproducts*, `DQCoh.affineEquiv` and *DQCoh.restrict*. Not used by this plan from this part of §2.18: `DCoh` and the bounded variants, *DQCoh.tStructure*. In Tau Ceti at the pin: `TauCeti.AlgebraicGeometry.Coherent.DQCoh` (`TauCeti.AlgebraicGeometry.Modules.Derived.DQCoh`), with `DQCoh.mem_iff`, `DQCoh.isTriangulated`, `DQCoh.hasCoproducts` (coproducts indexed by the types of the universe of the scheme) and `DQCoh.restrict` in the same module; of `DQCoh.affineEquiv`, only that the tilde functor sends a complex of modules into DQCoh (`DQCoh.mapDerivedCategory_tildeFunctor_obj`). Also at the pin, for the later targets of §2.18: the derived restriction along an open immersion with its composition law (the module `TauCeti.AlgebraicGeometry.Modules.Derived.Restrict`), the total direct image on unbounded derived categories (the module `TauCeti.AlgebraicGeometry.Modules.Derived.TotalDirectImage`), the derived tensor product of complexes of module sheaves (`TauCeti.derivedTensor`) and the derived internal Hom, `TauCeti.derivedInternalHom` (`TauCeti.Algebra.Homology.DerivedCategory.InternalHom.Basic`). Still to do: `DQCoh.affineEquiv`. For single sheaves, the kernel of a map of quasi-coherent sheaves, a small coproduct of quasi-coherent sheaves and the restriction of a quasi-coherent sheaf along an open immersion are quasi-coherent. Upstream declarations used: `AlgebraicGeometry.Scheme.Modules.isQuasicoherent_kernel` (`TauCeti.AlgebraicGeometry.Modules.Quasicoherent.Kernels`), `AlgebraicGeometry.Scheme.Modules.isQuasicoherent_sigma` (`TauCeti.AlgebraicGeometry.Modules.Quasicoherent.Colimits`), `AlgebraicGeometry.Scheme.Modules.isQuasicoherent_restrictFunctor` (`Mathlib.AlgebraicGeometry.Modules.Tilde`), `DerivedCategory` and `HasDerivedCategory.standard` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`), `AlgebraicGeometry.Scheme.Modules` (`Mathlib.AlgebraicGeometry.Modules.Sheaf`), `SheafOfModules.IsQuasicoherent` (`Mathlib.Algebra.Category.ModuleCat.Sheaf.Quasicoherent`).'''
source = '[StacksProject] Section 36.3 (tag 06YZ), Lemma 36.3.1 (tag 08DT) and Lemma 36.3.5 (tag 06Z0)'
