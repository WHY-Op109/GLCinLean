desc = 'The braided monoidal structure of the pullback of invertible sheaves along a map of schemes. Owner: the Tau Ceti roadmap SchemeAndStackFoundations.'

[[node]]
id = 'GLCinLean.LineBundle.pullbackBraided'
kind = 'definition'
desc = 'For a map of schemes f : X′ → X, the braided monoidal structure on the pullback functor `InvertibleSheaf.pullback` of invertible sheaves, from the symmetric monoidal category `InvertibleSheaf X` to `InvertibleSheaf X′`. With it, two equations on underlying module sheaves: its inverse tensor comparison f^*(M ⊗ N) ≅ f^*M ⊗ f^*N is the tensor comparison of the pullback of module sheaves, and its inverse unit comparison f^*𝟙 ≅ 𝟙 is `Scheme.Modules.pullbackObjUnitIso`. And: the isomorphisms `InvertibleSheaf.pullbackId` and `InvertibleSheaf.pullbackComp`, for the identity map and for a composite of two maps, are monoidal natural isomorphisms. No hypothesis on the schemes or on f. Provider: roadmap SchemeAndStackFoundations, §3.4 “Picard groups: divisor classes, excision, Picard groupoids”, as the prerequisite of the target `picardGroupoid.pullback` (“`pullback` (a functor of Picard groupoids)”). It is not a named target: a functor of Picard groupoids is a symmetric monoidal functor between the cores `Core (InvertibleSheaf X)`, and the module `TauCeti.CategoryTheory.Monoidal.Core` gives it from a braided monoidal functor between the categories `InvertibleSheaf`. The roadmap AlgebraicVectorBundles, §1.2 “Strong monoidal pullback”, states the same structure for the pullback of all module sheaves (“make pullback strong symmetric monoidal on module sheaves”); it does not name the instance for invertible sheaves. In Tau Ceti: the symmetric monoidal category `InvertibleSheaf X` (`TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`)); the pullback of invertible sheaves as the functor `InvertibleSheaf.pullback` with `pullbackId` and `pullbackComp`, with no monoidal instance on this functor; the isomorphism f^*(M ⊗ N) ≅ f^*M ⊗ f^*N of invertible sheaves, `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackTensorProductIso` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`), stated for `InvertibleSheaf.tensorProduct`, natural in each factor for isomorphisms and compatible with `pullbackId` and `pullbackComp`; the braided monoidal pullback of quasi-coherent sheaves along every map of schemes, `TauCeti.AlgebraicGeometry.QuasicoherentSheaf.pullbackBraided` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Monoidal.Basic`), whose inverse tensor comparison and inverse unit comparison are, on underlying module sheaves, the tensor comparison of the pullback of module sheaves and `Scheme.Modules.pullbackObjUnitIso` (`pullback_δ_hom` and `pullback_η_hom` of the same module), with the monoidal isomorphisms for the identity map and for a composite, `TauCeti.AlgebraicGeometry.QuasicoherentSheaf.isMonoidal_pullbackId_hom` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Monoidal.Identity`) and `TauCeti.AlgebraicGeometry.QuasicoherentSheaf.isMonoidal_pullbackComp_hom` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Monoidal.Composition`); and every invertible sheaf is quasi-coherent (`TauCeti.AlgebraicGeometry.InvertibleSheaf.isQuasicoherent_obj` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`)). Still to do: the braided monoidal instance on the functor `InvertibleSheaf.pullback`, carried over from `QuasicoherentSheaf.pullbackBraided`. Both functors are lifts of the pullback of module sheaves to a full monoidal subcategory, so this is a transport and no new proof of coherence. With it: the two equations above, as `pullback_δ_hom` and `pullback_η_hom` state them for quasi-coherent sheaves; by the first equation the tensor comparison is `pullbackTensorProductIso`, carried to the tensor product of the category by `InvertibleSheaf.tensorProductIsoTensor`, and it is not written again. And: `InvertibleSheaf.pullbackId` and `InvertibleSheaf.pullbackComp` are monoidal, from the two instances for quasi-coherent sheaves. Users: LineBundle.Root.pullbackTensorProductIso takes the instance, the two equations and the two monoidal isomorphisms; it needs the structure on the functor between the categories `InvertibleSheaf`, in which roots are stated. LineBundle.picardGroupoid takes the instance, for the pullback of Picard groupoids. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackId` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackComp` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `AlgebraicGeometry.Scheme.Modules.pullbackObjUnitIso` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Basic`), `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`), `CategoryTheory.NatTrans.IsMonoidal` (`Mathlib.CategoryTheory.Monoidal.NaturalTransformation`).'
source = '[GLys] §1.4.2; [GLC1] §1.1.4'
