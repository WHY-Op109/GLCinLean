desc = 'The homomorphism between the groups of two neutral Tannakian categories that a tensor functor over the fibre functors induces, and the criterion for a closed immersion. Owner: the Tau Ceti roadmap MotivesAndAlgebraicCycles, §6.3.'

[[node]]
id = 'GLCinLean.Tannaka.reconstructionMap'
kind = 'definition'
desc = 'Functoriality of Tannaka.neutralReconstruction. The data: a field K of any characteristic; two categories with fibre functors (C, ω_C) and (D, ω_D) that satisfy the hypotheses of Tannaka.neutralReconstruction over K, with Hopf algebras B_C and B_D; a strong monoidal functor U from D to C; and a monoidal natural isomorphism between ω_C ∘ U and ω_D. No other hypothesis on U: it is then additive, K-linear, faithful and exact, because ω_C is additive, K-linear, faithful and exact and ω_C ∘ U is isomorphic to ω_D, which has these properties; and it is braided, because ω_C is faithful and braided and ω_D is braided. The node gives the homomorphism of Hopf algebras B_D → B_C, that is the homomorphism of affine group schemes Spec B_C → Spec B_D: on the points in a commutative K-algebra R it sends a monoidal automorphism of the scalar extension of ω_C to its restriction along U, carried to ω_D by the isomorphism. Write b_U : B_D → B_C for the map of Hopf algebras and g_U : Spec B_C → Spec B_D for the homomorphism of group schemes. For the identity functor of C with the identity isomorphism, both are the identity. For a third datum (E, ω_E), a functor V from E to D with a monoidal isomorphism between ω_D ∘ V and ω_E, and the composite isomorphism between ω_C ∘ U ∘ V and ω_E: g_{U∘V} = g_V ∘ g_U as homomorphisms Spec B_C → Spec B_E, and b_{U∘V} = b_U ∘ b_V as maps B_E → B_C. Criterion: the homomorphism B_D → B_C is surjective, that is the homomorphism of group schemes is a closed immersion, if and only if every object of C is a subquotient of U(Y) for some object Y of D. Degenerate cases and checks. In them, the Hopf algebra B of FGComoduleCat K H with its forgetful functor is identified with H by the isomorphism of clause (5) of Tannaka.neutralReconstruction, and that of FGModuleCat K with K. For C = FGModuleCat K with the identity as ω_C and U = ω_D, the map is the counit B_D → K, the inclusion of the trivial subgroup; the criterion holds, because a vector space of dimension n is ω_D(𝟙^n). For D the finite comodules of K[t, t⁻¹] and C those of its quotient K[t]/(t² − 1) (the groups 𝔾_m and μ_2, over any field), with U the restriction of the coaction, the map is this quotient map, a closed immersion, and U is not full. For C the finite comodules of the group algebra K[M] of a commutative group M in the universe of K, with the forgetful functor, B_C is identified with K[M]; so a strong monoidal functor from D to the finite comodules of K[M], with a monoidal isomorphism between its composite with the forgetful functor and ω_D, gives a homomorphism from the diagonalizable group of M to Spec B_D. Provider: roadmap MotivesAndAlgebraicCycles, §6.3 “Generation, functoriality and finite type”: “For a tensor functor `U:D→C` with a marked fiber comparison, construct `G_C→G_D`. … it is a closed immersion exactly when every object of `C` is a subquotient of an object in the image. Include the induced coordinate maps and composition law.” §6.3 also states the criterion for a faithfully flat homomorphism (U fully faithful with an image closed under subobjects); the plan does not use it. In Tau Ceti at the pin: the restriction functor of finite comodules along a map of coalgebras (`TauCeti.FGComoduleCat.corestrict`), with no monoidal structure and no criterion; no homomorphism of Hopf algebras induced by a functor between categories of comodules; the monoidal category of the finitely supported finite-dimensional graded vector spaces (`TauCeti.VecTwisted`, for a normalized 3-cocycle; the cocycle with constant value 1 gives the untwisted associator), with no braiding; the comodule of a grading (`DirectSum.IsInternal.monoidAlgebraComodule`) and the weight spaces of a comodule; and no monoidal equivalence between the finite comodules of a group algebra K[M] and the M-graded vector spaces. Upstream declarations used: `TauCeti.FGComoduleCat.corestrict` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Corestrict`), `DirectSum.IsInternal.monoidAlgebraComodule` (`TauCeti.Algebra.Coalgebra.Comodule.MonoidAlgebra.Internal`), `TauCeti.VecTwisted` (`TauCeti.CategoryTheory.GradedObject.VecTwisted`).'
