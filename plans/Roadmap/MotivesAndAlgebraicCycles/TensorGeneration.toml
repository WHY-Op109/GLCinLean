desc = 'Finite type and connectedness of the group of a neutral Tannakian category, by the objects that generate it. Owner: the Tau Ceti roadmap MotivesAndAlgebraicCycles, §6.3.'

[[node]]
id = 'GLCinLean.Tannaka.finiteType_iff_exists_tensorGenerator'
kind = 'theorem'
desc = 'In the setting of Tannaka.neutralReconstruction, over a field K of any characteristic: the Hopf algebra B is a finitely generated K-algebra if and only if C has a tensor generator. A tensor generator is an object X such that every object of C is a subquotient of a finite direct sum of objects X^{⊗a} ⊗ (X^∨)^{⊗b} with natural numbers a and b, which may differ from one summand to the next; a tensor power with exponent 0 is the unit 𝟙, and X^∨ is the dual of X. The dual is part of the definition. Degenerate cases and checks. For C = FGModuleCat K with ω the identity, the zero object is a tensor generator, because the term with a = b = 0 is 𝟙; B = K is finitely generated. For the finite comodules of K[t, t⁻¹] (the group 𝔾_m) the character t is a tensor generator, and it is not a generator under finite direct sums and subquotients alone. The finite comodules of the group algebra K[ℚ] have no tensor generator, and K[ℚ] is not finitely generated. Provider: roadmap MotivesAndAlgebraicCycles, §6.3 “Generation, functoriality and finite type”: “It is of finite type precisely when one object tensor-generates using its dual and then finite sums and subquotients”. §6.3 also states that the group is finite exactly when one object generates C under finite direct sums and subquotients, and that it is an inverse limit of its quotients of finite type; the plan does not use these. In Tau Ceti at the pin: for a commutative Hopf algebra over a commutative ring and a comodule with a basis indexed by `Fin d`, the comodule is faithful exactly when its matrix coefficients and their images under the antipode generate the algebra (`TauCeti.Comodule.isFaithful_iff_matrixCoefficientSubalgebra_sup_antipode_eq_top`); and the statement for a given Hopf algebra H over a field: H is of finite type exactly when some finite comodule X tensor-generates the finite comodules, that is, every finite comodule is a subquotient of a finite direct sum of tensor products of powers of X and of its dual (`TauCeti.FGComoduleCat.finiteType_iff_exists_isTensorGenerator`, `TauCeti.Algebra.Coalgebra.Comodule.Finite.TensorGenerator`, with the predicate `TauCeti.IsTensorGenerator`, `TauCeti.CategoryTheory.Monoidal.Rigid.Tensor.Generator`). Still to do: the statement for a neutral Tannakian category, by transport along the equivalence of Tannaka.neutralReconstruction.'
deps = ['GLCinLean.Tannaka.neutralReconstruction']
source = '[DeligneMilne] Proposition 2.20(b)'

[[node]]
id = 'GLCinLean.Tannaka.connected_iff_not_tensorClosed_hull'
kind = 'theorem'
desc = 'In the setting of Tannaka.neutralReconstruction, over a field K of characteristic 0: the group scheme Spec B is connected (B has no idempotent other than 0 and 1; B is not zero, because it has a counit) if and only if, for every object X of C that is not isomorphic to a finite direct sum of copies of 𝟙, the full subcategory ⟨X⟩ of the subquotients of the finite direct sums of X is not closed under the tensor product: there are objects Y and Z of ⟨X⟩ such that Y ⊗ Z is not in ⟨X⟩. The objects isomorphic to a finite direct sum of copies of 𝟙 are those on which the group acts trivially; the zero object is one of them, the sum of no copies. They are excluded: for such an X the hull ⟨X⟩ is closed under the tensor product for every group. A connected group scheme over a field is geometrically connected, because it has a rational point; so the node also gives the criterion for `TauCeti.geometricallyConnectedCommHopfAlgProperty` (the prime spectrum of B ⊗ K′ is connected for every field extension K′ of K in the universe of K), which is the hypothesis of TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive and the form that Satake.tannakaRootDatum_equiv_dual uses. Degenerate cases and checks. For the trivial group (C = FGModuleCat K) no object is quantified over, and the group is connected. For 𝔾_m and the character t, the hull ⟨t⟩ consists of the sums of copies of t and does not contain t ⊗ t. For a finite group that is not trivial, the regular representation X has ⟨X⟩ = C, which is closed under the tensor product; the group is not connected. For μ_2 the hull of the sign character alone is not closed under the tensor product, so one object does not decide: the statement quantifies over all objects. The implication from the criterion to connectedness holds over every field: a group scheme that is not connected has a finite étale quotient that is not trivial, and the hull of the regular representation of that quotient is closed under the tensor product. It is the only direction that the plan uses. Characteristic 0 is needed for the converse: in characteristic p the group α_p is connected and finite, and the hull of its regular representation is all of C. Provider: roadmap MotivesAndAlgebraicCycles, §6.3 “Generation, functoriality and finite type”: “In characteristic zero, prove the connectedness criterion using nontrivial finite tensor subcategories: for every object with nontrivial action, its finite sum/subquotient hull cannot already be tensor closed. State the characteristic-zero restriction and the meaning of nontrivial action explicitly.” The accepted roadmap GeometricSatakeAndFusion §4.6 takes both criteria of this module from §6.3. In Tau Ceti at the pin: geometric connectedness with its form by idempotents, the identity component, and the component group of a group of finite type over an algebraically closed field; and statements that use connectedness for representations, such as the characterization of the subrepresentations by stability under the Lie algebra, for a connected group of finite type over an algebraically closed field of characteristic 0 (the file `Representation/LieStable.lean`). In the module `TauCeti.Algebra.AlgebraicGroup.Connected.HopfSubalgebra`: over a field of characteristic 0, a Hopf algebra with connected prime spectrum has no finite-dimensional Hopf subalgebra other than the scalars (`Subalgebra.IsHopfSubalgebra.eq_bot_of_connectedSpace`), and over an algebraically closed field the converse holds (`TauCeti.HopfAlgebra.connectedSpace_primeSpectrum_of_forall_isHopfSubalgebra_eq_bot`). Still to do: the converse over a field of characteristic 0 that is not algebraically closed; the dictionary between the hulls that are closed under tensor products and the finite-dimensional Hopf subalgebras; and the transport along the equivalence of Tannaka.neutralReconstruction. The characterization of connectedness by the tensor closure of the hulls of finite direct sums and subquotients is not there. Upstream declarations used: `TauCeti.geometricallyConnectedCommHopfAlgProperty` (`TauCeti.Algebra.AlgebraicGroup.Connected.CommHopfAlgCat`).'
deps = ['GLCinLean.Tannaka.neutralReconstruction']
source = '[DeligneMilne] Corollary 2.22, with Propositions 2.20(a) and 2.21(a)'
