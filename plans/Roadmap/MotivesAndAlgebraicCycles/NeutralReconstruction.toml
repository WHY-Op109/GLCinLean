id = 'GLCinLean.Tannaka.neutralReconstruction'
kind = 'definition'
desc = 'The affine group scheme of a neutral Tannakian category, as a commutative Hopf algebra with its equivalence. The data and all hypotheses: a field K, of any characteristic and not assumed algebraically closed; a category C whose morphisms are in the universe of K and which is essentially small in that universe (`CategoryTheory.EssentiallySmall`); C is abelian and K-linear; C is monoidal, and its tensor product is additive and K-linear in each variable (`CategoryTheory.MonoidalPreadditive`, `CategoryTheory.MonoidalLinear`); C is symmetric and rigid; the map K → End(𝟙), c ↦ c • id, is bijective; a functor ω from C to `FGModuleCat K` that is additive, K-linear, faithful and exact (it preserves finite limits and finite colimits), and braided: strong monoidal and compatible with the symmetry of C and the ordinary symmetry v ⊗ w ↦ w ⊗ v of vector spaces. No tensor generator and no semisimplicity is assumed. The node gives: (1) a commutative Hopf algebra B over K, in the universe of K, as a definition: the filtered colimit of the dual coalgebras of the finite-dimensional algebras A_X, where A_X is the algebra of the endomorphisms of ω restricted to the full subcategory ⟨X⟩ of the subquotients of the finite direct sums of X; its multiplication comes from the tensor product of C and its antipode from the duals of C; (2) an equivalence E between C and `TauCeti.FGComoduleCat K B`, the finite comodules with carriers in the universe of K, whose functor is braided monoidal; (3) a monoidal natural isomorphism between E followed by the forgetful functor of FGComoduleCat to `SemimoduleCat K` and ω followed by the forgetful functor to `ModuleCat K` and the equivalence `ModuleCat.equivalenceSemimoduleCat`. The comparison is stated in SemimoduleCat K, as in the signature of the roadmap, because the braided forgetful functor of FGComoduleCat at the pin has this target; (4) for every commutative K-algebra R in the universe of K, a group isomorphism between the K-algebra maps B → R, with the convolution product, and the monoidal natural automorphisms of the scalar extension of ω to R, natural in R; with (2) and (3) this is the transport of `TauCeti.Tannaka.pointsFunctorIsoTensorAutFunctor`, which takes K, the Hopf algebra and R in one universe and lifts the group of points by one universe. A statement for value algebras in a larger universe needs a transport of its own, and the plan does not use it; (5) uniqueness: if H is a commutative Hopf algebra over K, in the universe of K, with an equivalence between C and FGComoduleCat K H whose functor is braided monoidal, and with a monoidal isomorphism between its forgetful functor and ω in the form of (3), then H and B are isomorphic as Hopf algebras, compatibly with the two equivalences. This follows from (4) for B, from `TauCeti.Tannaka.pointsFunctorIsoTensorAutFunctor` for the given H, carried to ω by the given equivalence and isomorphism, and from the Yoneda lemma; it does not apply the node to FGComoduleCat K H. The target `neutralTannakian_recognition` of the roadmap states (2) and (3) with B under an existential quantifier. The plan needs B as data with (4): Satake.tannakaGroup is a definition, and its torus, its pinning and its identification with the dual group are stated for this Hopf algebra. Degenerate cases and checks. The zero category does not satisfy the hypotheses: End(𝟙) is isomorphic to the field K, so 𝟙 is not zero. For C = FGModuleCat K and ω the identity, B is K with its trivial Hopf structure, the trivial group. For C = FGComoduleCat K H with a commutative Hopf algebra H in the universe of K and ω the forgetful functor to FGModuleCat K of the prerequisite below, B is isomorphic to H; H need not be a finitely generated algebra, as the group algebra K[ℚ] shows. The compatibility of ω with the ordinary symmetry is needed: in characteristic different from 2, the super vector spaces with the Koszul sign rule and the forgetful functor satisfy every other hypothesis, and no functor ω satisfies all of them, because the odd line has self-symmetry −1. Rigidity is needed: the finite-dimensional ℕ-graded vector spaces with the forgetful functor satisfy every other hypothesis; they are the finite comodules of the bialgebra K[t] with t group-like, which has no antipode. Provider: roadmap MotivesAndAlgebraicCycles, §6.1 “Neutral fibers and finite reconstruction” and §6.2 “The neutral group and its noncircular antipode”, with the target `neutralTannakian_recognition`. §6.2 states (1) to (4): “The resulting affine group scheme `G_ω=Spec B` represents `Aut^⊗(ω)` and gives a symmetric monoidal equivalence `C≃Rep_fd(G_ω)`”. The accepted roadmaps GeometricSatakeAndFusion (GS4, “Imported reconstruction”), PadicDifferentialEquationsAndRigidCohomology (§RD.2.52, which states (2), (3) and (4) for its use), PadicHodgeTheory, AnabelianGeometryAndNonabelianChabauty and LieHighestWeightPartII take the reconstruction from these sections. §§6.1–6.3 do not depend on the geometric layers of the roadmap: “Abstract neutral and relative reconstruction is in Layer 6 and can be proved independently of the geometric layers”, and “The neutral abstract arguments of Layer 6 are independent of this construction and may be proved first”. Layer 5 supplies the diagram category and geometric comparison for the Nori applications in Layer 6. §5.2 of the roadmap states, as `coalgebra_reconstruction`, a coalgebra and the equivalence of (2) without its tensor structure, with a comparison of the fibre functors in `ModuleCat K`, for an essentially small abelian K-linear category with an additive, K-linear, exact and faithful functor to FGModuleCat K; one proof at that generality serves both targets. §6.2 gives the coalgebra its bialgebra structure before it uses rigidity, and §6.4 does the same under its relative hypotheses. In Tau Ceti at the pin: the reconstruction of a given commutative Hopf algebra from its finite comodules (the 15 files of its folder `Representation/Tannaka`: 14 start from a given bialgebra or Hopf algebra, and `SchemePoints.lean` starts from a given affine group scheme and takes its coordinate Hopf algebra); the linear dual with convolution multiplication when the input is a coalgebra (`TauCeti.ConvolutionDual`), which `TauCeti.ConvolutionDual.instCoalgebra` makes a coalgebra for a finite projective algebra, and, for a finite projective coalgebra, the correspondence between comodule structures and module structures over its dual algebra (`TauCeti.Comodule.convolutionActionEquiv`), which serve the algebras A_X; and, of the construction of §§5.1, 6.1 and 6.2: the hull ⟨X⟩ of the subquotients of the finite direct sums of copies of an object (`TauCeti.subquotientHull`); the algebra A_X of endomorphisms of the fibre functor on the hull, with its finite dimension, its evaluation map and the transition maps between hulls (`CategoryTheory.Functor.hullAlgebra`, `hullEndAlgEquiv`, the module `TauCeti.CategoryTheory.Tannaka.HullAlgebra`); the object that represents the fibre functor on the hull, with its projectivity among the objects of the hull (`CategoryTheory.Functor.hullRepresenting`); the equivalence between the modules over a finite projective algebra and the comodules over its dual coalgebra, also for the finite ones (`TauCeti.ComoduleCat.equivalenceModuleCat`, `TauCeti.FGComoduleCat.equivalenceFGModuleCat`); the coalgebra structure on a directed colimit of coalgebras, and the descent of a finite comodule over the colimit to a stage (`Module.DirectLimit.instCoalgebra`, `TauCeti.Comodule.exists_comoduleFactor_ofCoalgHom`); and the antipode of a commutative bialgebra over a field whose finite comodules are rigid (`TauCeti.HopfAlgebra.ofLeftRigid`). Still to do: the equivalence between the hull of X and the finite modules over A_X; the coalgebra B of a category with a fibre functor, as the directed colimit of the duals of the algebras A_X, with clause (2); its bialgebra and Hopf algebra structure with clauses (1) and (3); and clauses (4) and (5). Tau Ceti has no structure for a neutral Tannakian category and no group of tensor automorphisms of an abstract fibre functor. A prerequisite that is not a named target: for a commutative Hopf algebra H over a field K, the category FGComoduleCat K H with its forgetful functor must itself satisfy the hypotheses, because the second check and the use of Tannaka.reconstructionMap for a group algebra apply the node to it; clause (5) does not. At the pin this prerequisite is supplied: the category is abelian, symmetric monoidal and rigid; it is K-linear, with a tensor product that is additive and K-linear in each variable (`TauCeti.FGComoduleCat.instLinear`, `TauCeti.FGComoduleCat.instMonoidalPreadditive`, `TauCeti.FGComoduleCat.instMonoidalLinear`); it is essentially small (`TauCeti.FGComoduleCat.essentiallySmall`); End(𝟙) is K (`TauCeti.FGComoduleCat.smul_id_tensorUnit_bijective`); and its forgetful functor to `FGModuleCat K` (`TauCeti.FGComoduleCat.hasForgetToFGModuleCat`) is faithful, additive, K-linear, exact, monoidal and braided (the instances of the module `TauCeti.Algebra.Coalgebra.Comodule.Finite.FiberFunctor`). §RD.2.52 of PadicDifferentialEquationsAndRigidCohomology has this check (“`C =` FGComoduleCat `K H` … recovers `G = Spec H`”). Upstream declarations used: `TauCeti.FGComoduleCat` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Basic`), `TauCeti.Tannaka.pointsFunctorIsoTensorAutFunctor` (`TauCeti.Algebra.AlgebraicGroup.Representation.Tannaka.GroupFunctor`), `TauCeti.ConvolutionDual` (`TauCeti.Algebra.HopfAlgebra.FiniteDual.Basic`), `TauCeti.Comodule.convolutionActionEquiv` (`TauCeti.Algebra.Coalgebra.Comodule.Convolution.Finite`), `TauCeti.subquotientHull` (`TauCeti.CategoryTheory.Abelian.SubquotientHull`), `CategoryTheory.Functor.hullAlgebra` and `CategoryTheory.Functor.hullEndAlgEquiv` (`TauCeti.CategoryTheory.Tannaka.HullAlgebra`), `CategoryTheory.Functor.hullRepresenting` (`TauCeti.CategoryTheory.Tannaka.RepresentingObject`), `TauCeti.ComoduleCat.equivalenceModuleCat` and `TauCeti.FGComoduleCat.equivalenceFGModuleCat` (`TauCeti.Algebra.Coalgebra.Comodule.Convolution.DualCoalgebra`), `Module.DirectLimit.instCoalgebra` (`TauCeti.Algebra.Coalgebra.DirectLimit`), `TauCeti.Comodule.exists_comoduleFactor_ofCoalgHom` (`TauCeti.Algebra.Coalgebra.Comodule.DirectLimit`), `TauCeti.HopfAlgebra.ofLeftRigid` (`TauCeti.Algebra.HopfAlgebra.OfRigidFiniteComodules`), `TauCeti.FGComoduleCat.instLinear` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Preadditive`), `TauCeti.FGComoduleCat.instMonoidalPreadditive`, `TauCeti.FGComoduleCat.instMonoidalLinear` and `TauCeti.FGComoduleCat.hasForgetToFGModuleCat` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.FiberFunctor`), `TauCeti.FGComoduleCat.essentiallySmall` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.EssentiallySmall`), `TauCeti.FGComoduleCat.smul_id_tensorUnit_bijective` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Monoidal`), `FGModuleCat` (`Mathlib.Algebra.Category.FGModuleCat.Basic`), `CategoryTheory.RigidCategory` (`Mathlib.CategoryTheory.Monoidal.Rigid.Basic`), `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`), `CategoryTheory.EssentiallySmall` (`Mathlib.CategoryTheory.EssentiallySmall`), `ModuleCat.equivalenceSemimoduleCat` (`Mathlib.Algebra.Category.ModuleCat.Basic`).'
