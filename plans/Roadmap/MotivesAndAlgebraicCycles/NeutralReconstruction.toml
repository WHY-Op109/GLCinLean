desc = 'Neutral Tannakian reconstruction: the commutative Hopf algebra of a rigid abelian tensor category with a fibre functor, and the equivalence with its finite comodules. Owner: the Tau Ceti roadmap MotivesAndAlgebraicCycles, §§6.1–6.2.'

