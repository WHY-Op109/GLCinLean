[[node]]
id = 'GLCinLean.Infinity.moduleOverMonoidalLocalization'
kind = 'theorem'
desc = 'Let F: A → B be a symmetric monoidal functor of unital presentable stable symmetric monoidal categories whose continuous right adjoint is fully faithful and A-linear (for example when A is rigid, by Infinity.rightAdjoint_linear). Then B is an idempotent commutative A-algebra (B ⊗_A B ≃ B), restriction along F is fully faithful from B-modules to A-modules, and its essential image consists of the A-modules on which the kernel of F acts by zero; the B-module structure on such a module is unique. The symmetric monoidal case is what [LurieHA] §4.8.2 covers, and it is the case used (A = Hecke.unitalIndependentRepresentations). Proof of the last step: the kernel K and B fit in a cofiber sequence of A-modules, ⊗_A preserves cofibers, so B ⊗_A M is the Verdier quotient of M by the image of K ⊗_A M, which is zero exactly when K acts by zero. Provider: Missing at the pin; EnhancedDerivedSheaves owns module and rigidity APIs (E5:abstract.2, E5:presentability.4), so route through Tau Ceti Worker if it claims this scope. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node.'
deps = ['GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.stableCategory', 'GLCinLean.Infinity.rightAdjoint_linear']
source = '[LurieHA] §4.8.2 (idempotent algebras); [GaitsgoryOutline] Corollary 4.5.5'
