desc = 'A stable category with small coproducts and a small set of compact objects whose shifts detect zero is presentable.'

[[node]]
id = 'GLCinLean.Infinity.isPresentable_of_compactGenerators'
kind = 'theorem'
desc = '''Let C be a stable category (the predicate `SSet.IsStable`) in which every family of objects indexed by a type of a fixed universe w has a coproduct; small means indexed by a type of the universe w. Assume that the Hom sets of the homotopy category of C are small, and let S be a small set of objects of C such that the mapping-space functor of each member of S preserves small filtered colimits, and such that the shifts of S detect zero: an object y with Hom(s[n], y) = 0 in the homotopy category for all s in S and all n in ℤ is a zero object. Then C is presentable (Infinity.presentableCategory). The conclusion is stated in the convention of E0.8, which takes C in the universe w + 1 and locally small for w; a category C given in a larger universe is equivalent to one in that convention. In particular C is locally small (by stability the homotopy groups of a mapping space, Infinity.mappingSpaces, are Hom sets out of shifts), so the members of S are compact objects (Infinity.compactObject), and C is compactly generated by S in form (a) of Infinity.compactGeneration. The statement is the case of compact generators of the implication of [LurieHA] Corollary 1.4.4.2 from its three conditions to presentability. Proof. By part (i) of Infinity.compactObject_iff_homotopyCategory, C admits all small colimits. Stability and the smallness of the Hom sets of the homotopy category give small models of the mapping spaces. Take a small model D of the full stable subcategory generated by S under shifts and finite colimits. Its objects are compact. For an object y of C, the category of arrows d → y with d in D is essentially small and filtered, since it admits finite colimits. The map from the colimit of its sources to y induces an isomorphism on Hom(s[n], −) in the homotopy category for every s in S and every n in ℤ. Surjectivity follows by taking the given arrow s[n] → y as a stage. For injectivity, compactness represents a class at a stage d → y by an arrow s[n] → d. If its composite to y is zero, a nullhomotopy gives a later stage cofib(s[n] → d) → y that kills it. The cofibre of the colimit map is therefore zero by shifted detection. Thus every y is a small filtered colimit of objects of D, which proves accessibility and presentability. S need not be closed under shifts. S may be empty: then D consists of zero objects, every object of C is zero, and C is presentable. User: Sheaves.schemeQCoh_compactGeneration, with S = {P}. Provider: here. No accepted roadmap states it: EnhancedDerivedSheaves E3.3 and E2.5 cite Higher Algebra, Proposition 1.4.4.1(3), which is the roadmap node Infinity.compactObject_iff_homotopyCategory, and not Corollary 1.4.4.2. Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'''
deps = ['GLCinLean.Infinity.presentableCategory', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.compactObject_iff_homotopyCategory', 'GLCinLean.Infinity.mappingSpaces']
source = '[LurieHA] Corollary 1.4.4.2'
