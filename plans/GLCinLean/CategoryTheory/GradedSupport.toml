desc = 'Support of objects of a stable category for a graded central action.'

[[node]]
id = 'GLCinLean.Infinity.GradedSupport'
kind = 'definition'
desc = 'For a cocomplete stable enhanced category C with an action of a commutative ring A graded by even integers, by central cohomological operators, and a conical closed subset Y of Spec A, the full subcategory of objects supported on Y, defined by localization at homogeneous elements; give the membership criterion and closure under colimits. Provider: here. Stable quasicategories are those with the Tau Ceti predicate `SSet.IsStable` (`TauCeti.AlgebraicTopology.Quasicategory.Stable`): a zero vertex, a limit cone and a colimit cocone for every diagram indexed by a finite simplicial set, and a square is a pullback square exactly when it is a pushout square.'
deps = ['GLCinLean.Infinity.limits']
source = '[ArinkinGaitsgory] §§3.1–3.3, 3.5'
