desc = 'For a cocomplete stable enhanced category C with an action of a commutative ring A graded by even integers, by central cohomological operators, and a conical closed subset Y of Spec A, the full subcategory of objects supported on Y, defined by localization at homogeneous elements; give the membership criterion and closure under colimits. Provider: here.'
