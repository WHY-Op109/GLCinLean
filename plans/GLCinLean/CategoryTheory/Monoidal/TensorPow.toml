desc = 'The n-th tensor power as a monoidal functor of a braided monoidal category.'

[[node]]
id = 'GLCinLean.CategoryTheory.tensorPowFunctor'
kind = 'definition'
desc = 'For a monoidal category C and a natural number n, the functor from C to C that sends X to its n-th tensor power `TauCeti.tensorPow X n` and an arrow f to `TauCeti.tensorPowMap f n`. For a braided monoidal category C, its monoidal structure: the unit comparison 𝟙^{⊗n} ≅ 𝟙 and the tensor comparison (X ⊗ Y)^{⊗n} ≅ X^{⊗n} ⊗ Y^{⊗n}, natural in X and Y and compatible with the associativity and unit isomorphisms of C. It is built by induction on n: the functor for n + 1 is the diagonal of C followed by the product of the identity with the functor for n and by the tensor product functor C × C → C, which is monoidal for a braided category (`tensorMonoidal`). For a symmetric monoidal category C, the functor is braided, that is, a symmetric monoidal functor. Consequences to state: the functor sends an object with a tensor inverse to an object with a tensor inverse, with (X^{-1})^{⊗n} ≅ (X^{⊗n})^{-1}; and a braided monoidal functor G from C to D commutes with it, G(X^{⊗n}) ≅ G(X)^{⊗n}, by an isomorphism of monoidal functors. For n = 0 the functor is constant with value the unit, and for n = 1 it is isomorphic to the identity functor. At the pin (Tau Ceti `91942aa9`, which is its main of 2026-11-18, and Mathlib `048fffa1`) neither library has this functor or a monoidal structure on it. Tau Ceti has `TauCeti.tensorPow` (with `tensorPow X (n + 1) = X ⊗ tensorPow X n`), `tensorPowMap` with `tensorPowMap_id` and `tensorPowMap_comp`, `tensorPowMapIso`, `tensorPowAddIso` and `tensorPowSuccIso`, unbundled. The functor for n + 1 is by definition `(𝟭 C).prod\' (P n) ⋙ tensor C`, and the functor for 0 is by definition the constant functor at the unit, so the monoidal structure comes by recursion on n from the Mathlib instances for the identity functor, for composites, for `Functor.prod\'` (`Functor.Monoidal.prod\'`) and for `tensor C` (`MonoidalCategory.tensorMonoidal`); the one new piece is the monoidal structure of the constant functor at the unit (unit comparison the identity, tensor comparison the left unitor of the unit). Mathlib has `Functor.Braided` for the identity and for composites only: it has no braiding on a product category and no braided structure on `Functor.prod`, on the diagonal or on `tensor C` for a symmetric C; the lemma that these need is, for a symmetric C, `tensorμ X₁ X₂ Y₁ Y₂ ≫ (β_ X₁ Y₁ ⊗ₘ β_ X₂ Y₂) = β_ (X₁ ⊗ X₂) (Y₁ ⊗ Y₂) ≫ tensorμ Y₁ Y₂ X₁ X₂`, of which Mathlib has the case `SymmetricCategory.tensorμ_braid_swap`. For the commutation with a braided functor G, Mathlib has `Functor.Monoidal.μNatIso`, the `NatTrans.IsMonoidal` instances, `LaxMonoidalFunctor.isoOfComponents` and the coherence `tensorμ_comp_μ_tensorHom_μ_comp_μ`. For tensor inverses, Tau Ceti has `CategoryTheory.Functor.mapExactPairing` for exact pairings, and for an inverse given by two isomorphisms only `tensorRightEquivalenceOfIso`; the statement of this node is for an inverse given by isomorphisms X ⊗ M ≅ 𝟙 and M ⊗ X ≅ 𝟙, as the Picard groupoid uses. The open Tau Ceti pull requests #41911 (`tensorPowUnitIso` and, for a braided category, `tensorPowTensorIso`, with the step `(X ⊗ Y) ◁ prev ≫ tensorμ X Y (X^n) (Y^n)`) and #41289 (another `tensorPowUnitIso`) add unbundled comparisons and no functor. When one of them is at the pin, this node states that its isomorphism is the inverse of the unit or tensor comparison of the functor; for a braided category that is not symmetric the two tensor comparisons can differ by the choice of the braiding. No roadmap target asks for this structure; the nearest is OcneanuRigidity §0.1 “Tensor powers of a functor”, a functor of several variables without monoidal structure. The user is LineBundle.Root.tensorProduct, for the Picard groupoid of a scheme. Provider: here. Upstream declarations used: `TauCeti.tensorPow`, `TauCeti.tensorPowMap`, `TauCeti.tensorPowMapIso`, `TauCeti.tensorPowAddIso` and `TauCeti.tensorPowSuccIso` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`), `CategoryTheory.Functor.Monoidal` (`Mathlib.CategoryTheory.Monoidal.Functor`), `CategoryTheory.MonoidalCategory.tensorMonoidal` and `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`).'
source = '[GLys] §1.4.2'
