desc = 'The n-th tensor power as a monoidal functor of a braided monoidal category.'

[[node]]
id = 'GLCinLean.CategoryTheory.tensorPowFunctor'
kind = 'definition'
desc = 'For a monoidal category C and a natural number n, the functor from C to C that sends X to its n-th tensor power `TauCeti.tensorPow X n` and an arrow f to `TauCeti.tensorPowMap f n`. For a braided monoidal category C, its monoidal structure: the unit comparison 𝟙^{⊗n} ≅ 𝟙 and the tensor comparison (X ⊗ Y)^{⊗n} ≅ X^{⊗n} ⊗ Y^{⊗n}, natural in X and Y and compatible with the associativity and unit isomorphisms of C. It is built by induction on n: the functor for n + 1 is the diagonal of C followed by the product of the identity with the functor for n and by the tensor product functor C × C → C, which is monoidal for a braided category (`tensorMonoidal`). For a symmetric monoidal category C, the functor is braided, that is, a symmetric monoidal functor. Consequences to state: the functor sends an object with a tensor inverse to an object with a tensor inverse, with (X^{-1})^{⊗n} ≅ (X^{⊗n})^{-1}; and a braided monoidal functor G from C to D commutes with it, G(X^{⊗n}) ≅ G(X)^{⊗n}, by an isomorphism of monoidal functors. For n = 0 the functor is constant with value the unit, and for n = 1 it is isomorphic to the identity functor. Before this node is written, Mathlib and Tau Ceti, at the pin and on the main branch of Tau Ceti, are searched for this functor and for a monoidal structure on it; what they have is used and not written again. In Tau Ceti: `TauCeti.tensorPow` (with `tensorPow X (n + 1) = X ⊗ tensorPow X n`), `tensorPowMap` with `tensorPowMap_id` and `tensorPowMap_comp`, `tensorPowMapIso`, `tensorPowAddIso` and `tensorPowSuccIso`; the functor is not bundled and has no monoidal structure. No roadmap target asks for this structure. The user is LineBundle.Root.tensorProduct, for the Picard groupoid of a scheme. Provider: here. Upstream declarations used: `TauCeti.tensorPow`, `TauCeti.tensorPowMap`, `TauCeti.tensorPowMapIso`, `TauCeti.tensorPowAddIso` and `TauCeti.tensorPowSuccIso` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`), `CategoryTheory.Functor.Monoidal` (`Mathlib.CategoryTheory.Monoidal.Functor`), `CategoryTheory.MonoidalCategory.tensorMonoidal` and `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`).'
source = '[GLys] §1.4.2'
