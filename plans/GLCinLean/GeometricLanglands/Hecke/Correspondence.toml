kind = 'theorem'
desc = 'The projection from the Ran Hecke stack to Bun_G (each side) is pseudo-proper (Derived.pseudoProper): over X^I it is the ind-proper fibration by the Beilinson–Drinfeld Grassmannian over Bun_G × X^I, and X^I is proper, assembled over I with the presentation of Hecke.ranPseudoProper. Provider: here.'
