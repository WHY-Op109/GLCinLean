[[node]]
id = 'GLCinLean.Hecke.correspondence_pseudoProper'
kind = 'theorem'
desc = 'Let Hecke_{X^I} be the Hecke stack over X^I, with its projection to Bun_G (each side). Prove that the map colim_I Hecke_{X^I} → Bun_G is pseudo-proper (Derived.pseudoProper): after base change by a test scheme S → Bun_G, each Hecke_{X^I} is the twisted Beilinson–Drinfeld Grassmannian, ind-proper over S × X^I, and X^I is proper; assemble over I with the presentation of Hecke.ranPseudoProper. This colimit has the same de Rham prestack as the Hecke stack over Hecke.ranSpace, so it has the same D-modules and computes the same pushforward, as Hecke.ranPseudoProper says for Ran. Provider: here.'
deps = ['GLCinLean.Hecke.correspondence', 'GLCinLean.Derived.pseudoProper', 'GLCinLean.Hecke.ranPseudoProper', 'GLCinLean.Hecke.affineGrassmannian']
source = '[GLC1] §1.2.1; [GaitsgoryOutline] §§4.2.3, 4.4.2; [GaitsgoryAtiyahBott] §1.5'
