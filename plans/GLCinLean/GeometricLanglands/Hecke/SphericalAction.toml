desc = 'The Hecke functor of the half-twisted spherical category on Dmod_½(Bun_G).'

[[node]]
id = 'GLCinLean.Hecke.sphericalAction'
kind = 'definition'
desc = 'The Hecke functor (S, M) ↦ S ⋆ M of the half-twisted Sph^non-ren_{G,Ran} on Dmod_1/2(Bun_G) through the Ran Hecke correspondence, continuous in each variable, using the gerbe comparison Satake.criticalTwistBunDeterminantEquiv. Write 𝒢 for det^{1/2} on Bun_G and h_in, h_out for the two projections of the Ran Hecke stack to Bun_G. By the gerbe comparison, a kernel is twisted by h_out^*𝒢 ⊗ (h_in^*𝒢)^{-1}, so its tensor product with h_in^! M is twisted by h_out^*𝒢; push it forward by the twisted pseudo-proper pushforward (h_out)_{!,𝒢} (DModules.twistedPseudoProperShriek, Hecke.correspondence_pseudoProper). So the action is defined on all objects, not only on holonomic ones, and no trivialization of 𝒢 enters its construction. The statement uses only this functor; its structure of a right action of the factorization monoidal category Sph^non-ren_G, integrated over Ran, is Hecke.sphericalAction_associativity in the plan of the proof. Provider: here.'
deps = ['GLCinLean.Hecke.Correspondence', 'GLCinLean.Satake.factorizationSphericalCategory', 'GLCinLean.Satake.criticalTwistBunDeterminantEquiv', 'GLCinLean.Automorphic.HalfTwistedDModules', 'GLCinLean.DModules.twistedExtraordinaryPullback', 'GLCinLean.DModules.twistedPseudoProperShriek', 'GLCinLean.Hecke.correspondence_pseudoProper', 'GLCinLean.DModules.TwistedCrystals', 'GLCinLean.DModules.shriekTensor', 'GLCinLean.Stacks.EtaleGerbe']
source = '[GLC1] §1.2.1; [GLC2] §1.5.1, §H.6.8 and Remark H.6.9; [GaitsgoryOutline] §4.4.2'
