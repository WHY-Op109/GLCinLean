desc = 'The action of the half-twisted spherical category on Dmod_½(Bun_G).'

[[node]]
id = 'GLCinLean.Hecke.sphericalAction'
kind = 'definition'
desc = 'The right action of the half-twisted Sph^non-ren_{G,Ran} on Dmod_1/2(Bun_G) through the Ran Hecke correspondence, as an action of a factorization monoidal category integrated over Ran, using the gerbe comparison Satake.criticalTwistBunDeterminantEquiv. Write 𝒢 for det^{1/2} on Bun_G and h_in, h_out for the two projections of the Ran Hecke stack to Bun_G. By the gerbe comparison, a kernel is twisted by h_out^*𝒢 ⊗ (h_in^*𝒢)^{-1}, so its tensor product with h_in^! M is twisted by h_out^*𝒢; push it forward by the twisted pseudo-proper pushforward (h_out)_{!,𝒢} (DModules.twistedPseudoProperShriek, Hecke.correspondence_pseudoProper). So the action is defined on all objects, not only on holonomic ones, and no trivialization of 𝒢 enters its construction. Provider: here.'
deps = ['GLCinLean.Hecke.Correspondence', 'GLCinLean.Satake.factorizationSphericalCategory', 'GLCinLean.Satake.criticalTwistBunDeterminantEquiv', 'GLCinLean.Automorphic.HalfTwistedDModules', 'GLCinLean.DModules.twistedExtraordinaryPullback', 'GLCinLean.DModules.twistedPseudoProperShriek', 'GLCinLean.Hecke.correspondence_pseudoProper', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.DModules.TwistedCrystals', 'GLCinLean.DModules.shriekTensor', 'GLCinLean.Stacks.EtaleGerbe']
source = '[GLC1] §1.2.1; [GLC2] §1.5.1 and §H.6.8; [GLC3] §8.2.1'
