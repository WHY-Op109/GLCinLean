[[node]]
id = "GLCinLean.Hecke.ranRepresentations_rigid"
kind = "theorem"
desc = "Rep(H)_Ran is compactly generated and rigid for the monoidal structure through which Spectral.localization is monoidal and through which Hecke functors compose. Hence the continuous right adjoint of Spectral.localization is Rep(H)_Ran-linear. [GLC1] §1.2.2 asserts both facts without proof; prove them here from rigidity of Rep(H) and the factorization description of Rep(H)_Ran over X^I, in the unital Ran setting where the convolution structure needs a unit. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.ranRepresentations", "GLCinLean.Hecke.ranConvolution", "GLCinLean.Hecke.representationCategory", "GLCinLean.Infinity.rigidMonoidalCategory", "GLCinLean.Infinity.compactGeneration"]
source = "[GLC1] §1.2.2 (statement); [GaitsgoryOutline] §§4.2–4.3; [GLC2] Appendix H (unital Ran space)"
