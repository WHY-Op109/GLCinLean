desc = 'The action of the loop group over the Ran space on the Beilinson–Drinfeld Grassmannian, and that Grassmannian as the quotient of the loop group by the arc group.'

[[node]]
id = 'GLCinLean.Hecke.loopGroupAction'
kind = 'definition'
desc = '''The action of the loop group 𝔏(G) over the Ran space on the Beilinson–Drinfeld Grassmannian Gr_{G,Ran}, and Gr_{G,Ran} as the quotient of 𝔏(G) by the arc group 𝔏⁺(G). Here G is the group of Hecke.Correspondence, an affine group scheme of finite type over a field k of characteristic zero, so G is smooth; X is the curve; 𝔏(G) and 𝔏⁺(G) are the group prestacks of LoopGroups.RanLoopGroup over the Ran space Ran(X_dR), with the discs D_x and D°_x of an S-point x; and Gr_{G,Ran} is the fibre, over the trivial first bundle, of the Hecke stack of Hecke.Correspondence over the Ran space Ran(X_dR): its S-points over x are the G-bundles on S × X with a trivialization on the complement of the graphs Γ_x ([GLC2] §B.1.8), and its pullback to X^I is the Beilinson–Drinfeld Grassmannian over X^I of Hecke.Correspondence. Such a pair has no automorphism other than the identity, because the complement of Γ_x is schematically dense in S × X and G is affine; so Gr_{G,Ran} has values in sets. The test schemes S are the classical affine schemes. (1) The Beauville–Laszlo comparison over the Ran space. Restriction is along the map D_x → S × X of LoopGroups.RanLoopGroup (1) and its restriction from D°_x to the complement of Γ_x. For every S and x, restriction from S × X and the complement of Γ_x to D_x and D°_x is an equivalence from the groupoid of G-bundles on S × X with a trivialization on the complement of Γ_x to the groupoid of G-bundles on D_x with a trivialization on D°_x; and restriction from D_x to the formal disc D̂_x is an equivalence on G-bundles. Both are natural in S and compatible with the disjoint unions of discs ([GLys] §7.2.1; [GLC2] §B.4.10). Upstream prerequisite: on an affine open Spec B of S × X on which D has one equation f, the comparison between the finite projective modules over B and the triples of a finite projective module over the f-adic completion of B, a finite projective module over B[1/f] and an isomorphism of the two over the completion with f inverted, is a target of roadmap AInfCohomology, §AI.2.1 “Linear module patching across a principal divisor” (`AInf.linear_module_patching`), and roadmap RelativeFarguesFontaine §6.5 “The Beauville-Laszlo theorem for non-noetherian rings” states it for a glueing pair. Neither is in Tau Ceti. This node takes that statement from there and does not prove it again. Written here: the passage from finite projective modules to G-bundles, the gluing over the opens of S × X and the comparison of the completions on the opens with D_x, and the naturality in S. (2) The action. 𝔏(G) acts on Gr_{G,Ran} over Ran(X_dR), on the left, by changing the trivialization on D°_x. The unit section is the trivial bundle with its own trivialization, and the stabilizer of the unit section is 𝔏⁺(G) ([GLys] §7.2.2). (3) The quotient. The orbit map of the unit section, 𝔏(G) → Gr_{G,Ran}, is equivariant for the left action of 𝔏(G) on itself and invariant under the right multiplication by 𝔏⁺(G). It identifies Gr_{G,Ran} with the quotient of 𝔏(G) by the right action of 𝔏⁺(G), as sheaves for the étale topology on the test schemes over Ran(X_dR): a G-bundle on D_x is trivial after an étale cover of S, because G is smooth ([GLys] §7.2.2; [GLC2] §B.4.10). So the left action of 𝔏⁺(G) on Gr_{G,Ran} is the action that remains on the quotient, and a gerbe on Gr_{G,Ran} pulls back to 𝔏(G) along the orbit map. (4) Compatibilities. The action and the orbit map are compatible with the factorization isomorphisms of LoopGroups.RanLoopGroup and of Hecke.Correspondence over the disjoint locus, and with the pullbacks to Ran(X) and to X^I. The Beauville–Laszlo comparison at a point follows: after a choice of coordinate at a point x of X, the fibre over x of the Beilinson–Drinfeld Grassmannian (modifications of the trivial bundle, with a trivialization away from x) is the affine Grassmannian Gr_G of GLCinLean.AffineGrassmannian, by (1), (3) and the comparison (5) of LoopGroups.RanLoopGroup; under it the action and the orbit map are the action of LG on Gr_G and the quotient map LG → Gr_G. The same holds for an S-point of X with a coordinate along it. (5) Checks. For the trivial group Gr_{G,Ran} and 𝔏(G) are Ran(X_dR) and the action is trivial. For G = 𝔾_m, S = Spec k and x one k-point: the points of Gr over x are the line bundles on X with a trivialization away from x, which is ℤ by the order at x of the trivializing section, and also the nonzero elements of the fraction field of the completed local ring at x modulo its units; the loop given by a uniformizer t moves the unit point to a point of order ±1 and does not fix it, and a unit of the completed local ring fixes it. State the sign with the convention for the trivialization. Use: Satake.criticalDeterminantGerbe pulls its gerbe back along the orbit map, and Satake.factorizationSphericalCategory uses the left action of 𝔏⁺(G). Provider: here. No accepted roadmap has it. The open proposal SheafTheoreticSmithTheory (TauCetiRoadmap #1734) has the quotient of the loop group by the arc group for one disc with a coordinate, and Beilinson–Drinfeld Grassmannians over the powers of the affine line without a loop group over them.'''
deps = ['GLCinLean.Hecke.Correspondence', 'GLCinLean.LoopGroups.RanLoopGroup', 'GLCinLean.Stacks.groupTorsor', 'GLCinLean.AffineGrassmannian']
