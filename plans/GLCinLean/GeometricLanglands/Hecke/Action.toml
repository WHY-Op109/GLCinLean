desc = 'The right action of the half-twisted Sph^non-ren_{G,Ran} on Dmod_1/2(Bun_G) through the Ran Hecke correspondence, as an action of a factorization monoidal category integrated over Ran, using the gerbe comparison Satake.criticalTwist_matchesBunDeterminant. For a Levi quotient M the same construction gives the Sph^non-ren_M action on Dmod_1/2(Bun_M). Provider: here.'
