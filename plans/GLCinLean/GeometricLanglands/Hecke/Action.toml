desc = 'The Hecke action of Rep(Ǧ)_Ran on Dmod_½(Bun_G).'

[[node]]
id = 'GLCinLean.Hecke.action'
kind = 'definition'
desc = 'The Hecke action of Rep(Ǧ)_Ran on Dmod_½(Bun_G): the composite of the naive factorization Satake functor Satake.naiveFactorizationFunctor : Rep(Ǧ)_Ran → Sph^non-ren_{G,Ran}, into the half-twisted spherical category, with the action Hecke.sphericalAction, for the chosen dual identification Satake.dualIdentification, with its associativity constraints, as a module structure for the non-unital monoidal category Rep(Ǧ)_Ran. It is built from the spherical heart equivalence, its continuous DG factorization functor and the determinant-gerbe comparison, not assumed from a paper summary. Provider: here.'
deps = ['GLCinLean.Hecke.sphericalAction', 'GLCinLean.Satake.naiveFactorizationFunctor', 'GLCinLean.Ran.Representations', 'GLCinLean.Groups.langlandsDual', 'GLCinLean.Satake.dualIdentification', 'GLCinLean.Automorphic.HalfTwistedDModules', 'GLCinLean.Infinity.moduleCategory']
source = '[GLC1] §1.2.1; [GaitsgoryOutline] Proposition 4.4.4; [MV] Theorems 7.3 and 12.1; [GLys] §§9.2, 9.5; [RaskinCPSI] §6.33'
