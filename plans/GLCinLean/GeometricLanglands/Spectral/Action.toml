[[node]]
id = "GLCinLean.Spectral.actionOfVanishing"
kind = "definition"
desc = "For any connected reductive group H′ over k (the given G, or a Levi quotient M), and any proof that the kernel of Loc^spec: Rep(Ȟ′)_Ran → QCoh(LS_Ȟ′) acts by zero through Hecke.action on Dmod_1/2(Bun_H′), the unique QCoh(LS_Ȟ′)-module structure on Dmod_1/2(Bun_H′) inducing the Hecke action, from Infinity.moduleOverMonoidalLocalization. The vanishing is a hypothesis, so the rank induction can apply this to proper Levi quotients before the vanishing for G is known. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.action", "GLCinLean.Spectral.localization_rightAdjoint_fullyFaithful", "GLCinLean.Infinity.moduleOverMonoidalLocalization", "GLCinLean.Hecke.ranRepresentations_rigid"]
source = "[GaitsgoryOutline] Corollary 4.5.5; [GLC1] §1.2.5"
