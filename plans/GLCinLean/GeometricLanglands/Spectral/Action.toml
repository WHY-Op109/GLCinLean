[[node]]
id = "GLCinLean.Spectral.heckeAction_factors"
kind = "theorem"
desc = "The Hecke action of Rep(H)_Ran on Dmod_1/2(Bun_G) annihilates the kernel of Loc^spec: this is SpectralProof.localizationKernel_annihilatesAutomorphic for the given G. The resulting module structure is Spectral.actionOfVanishing applied to this proof. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.action", "GLCinLean.Spectral.localization_rightAdjoint_fullyFaithful", "GLCinLean.SpectralProof.localizationKernel_annihilatesAutomorphic"]
source = "[GLC1] Theorem 1.2.4; [GaitsgoryOutline] Theorem 4.5.2, Corollary 4.5.5 and proof §11.1; [GLC2] §15; [GenVan] §2"

