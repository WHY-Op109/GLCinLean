desc = 'The spectral localization functor Rep(H)_Ran → QCoh(LS_H).'

[[node]]
id = 'GLCinLean.Spectral.localization'
kind = 'definition'
desc = 'Construct the continuous functor Loc = (id × p)_! ∘ ev^* : Rep(H)_Ran → QCoh(LS_H), where ev : LS_H × Ran → (BH)_Ran is Spectral.evaluation and (id × p)_! is the left adjoint of pullback along the projection LS_H × Ran → LS_H, which exists because Ran(X) is pseudo-proper (Hecke.ranPseudoProper). Retain the Ran source despite the displayed shorthand. Its symmetric monoidal structure is Spectral.localization_monoidal; the construction does not need it. Provider: here.'
deps = ['GLCinLean.Hecke.ranRepresentations', 'GLCinLean.LocalSystems.deRham', 'GLCinLean.Spectral.evaluation', 'GLCinLean.Hecke.ranPseudoProper']
source = '[GLC1] §1.2.2; [GaitsgoryOutline] §§4.3.1–4.3.2; [GaitsgoryAtiyahBott] §1.5'
