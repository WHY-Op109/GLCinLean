desc = 'The spectral localization functor Rep(H)_Ran → QCoh(LS_H).'

[[node]]
id = 'GLCinLean.Spectral.localization'
kind = 'definition'
desc = 'Construct the continuous functor Loc = (id × p)_! ∘ ev^* : Rep(H)_Ran → QCoh(LS_H) of [GaitsgoryOutline] §4.3, where ev : LS_H × Ran → (BH)_Ran is Spectral.evaluation, p : Ran → pt, and Ran = Ran(X_dR) (GLCinLean.Ran), so that Ran ≅ Ran_dR. The left adjoint (id × p)_! of QCoh pullback along LS_H × Ran → LS_H is built in the form of [GLC2] §17.6.1: write Ran as the colimit of the (X^I)_dR; identify QCoh(LS_H × (X^I)_dR) with QCoh(LS_H) ⊗ QCoh((X^I)_dR) (Sheaves.externalProduct_isEquivalence_of_dualizable for Y₁ = (X^I)_dR, whose QCoh is dualizable because, through DModules.leftCrystalsEquivRightCrystals, it is the compactly generated category Dmod(X^I), DModules.qcaDMod_compactlyGenerated), and the left crystals QCoh((X^I)_dR) with the right crystals Dmod(X^I) (DModules.leftCrystalsEquivRightCrystals); apply id ⊗ p_!, where p_! : Dmod(X^I) → Vect is the de Rham pushforward of the proper scheme X^I, left adjoint to p^! (DModules.deRhamPushforward); and pass to the colimit over I, which exchanges with QCoh(LS_H) ⊗ −, along the presentation of Ran(X_dR) as the colimit of the (X^I)_dR (GLCinLean.Ran, Ran.pseudoProper_of_isProper). Retain the Ran source despite the displayed shorthand. Its non-unital symmetric monoidal structure is Spectral.localization_monoidal; the construction does not need it. Provider: here.'
deps = ['GLCinLean.Ran.Representations', 'GLCinLean.LocalSystems.DeRham', 'GLCinLean.Spectral.evaluation', 'GLCinLean.Ran.pseudoProper_of_isProper', 'GLCinLean.Sheaves.externalProduct_isEquivalence_of_dualizable', 'GLCinLean.DModules.qcaDMod_compactlyGenerated', 'GLCinLean.DModules.leftCrystalsEquivRightCrystals', 'GLCinLean.DModules.deRhamPushforward']
source = '[GLC1] §1.2.2; [GaitsgoryOutline] §§4.3.1–4.3.2; [GLC2] §17.6.1; [GaitsgoryAtiyahBott] §1.5'
