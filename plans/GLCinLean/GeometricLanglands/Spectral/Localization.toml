[[node]]
id = 'GLCinLean.Spectral.localization_factorsThroughIndependent'
kind = 'theorem'
desc = 'Spectral.localization factors as L ∘ q, with q the quotient of Hecke.unitalIndependentRepresentations and L: Rep(H)_{Ran^untl,indep} → QCoh(LS_H) strictly unital symmetric monoidal. Since q and Spectral.localization both have fully faithful continuous right adjoints, so does L (L ∘ L^R ≅ L ∘ q ∘ q^R ∘ L^R ≅ id); and q carries the kernel of Spectral.localization onto the kernel of L, because q is essentially surjective. Provider: here.'
deps = ['GLCinLean.Spectral.localization', 'GLCinLean.Spectral.localization_rightAdjoint_fullyFaithful', 'GLCinLean.Hecke.unitalIndependentRepresentations']
source = '[GLC2] §15.5.1'
