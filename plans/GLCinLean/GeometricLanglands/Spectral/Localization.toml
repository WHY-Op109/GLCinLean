desc = 'The spectral localization functor Rep(H)_Ran → QCoh(LS_H).'

[[node]]
id = 'GLCinLean.Spectral.localization'
kind = 'definition'
desc = 'Construct the continuous functor Loc = (id × p)_! ∘ ev^* : Rep(H)_Ran → QCoh(LS_H) of [GaitsgoryOutline] §4.3, where ev : LS_H × Ran → (BH)_Ran is Spectral.evaluation, p : Ran → pt, and Ran = Hecke.ranSpace, so that Ran(X) ≅ Ran(X)_dR. The left adjoint (id × p)_! of QCoh pullback along LS_H × Ran → LS_H is built in the form of [GLC2] §17.6.1: write Ran as the colimit of the (X^I)_dR; identify QCoh(LS_H × (X^I)_dR) with QCoh(LS_H) ⊗ Dmod(X^I) (Sheaves.passable_tensorBaseChange, with Dmod(X^I) dualizable because it is compactly generated, DModules.qcaDMod_compactlyGenerated); apply id ⊗ H(X^I, −), the homology of the proper scheme X^I (DModules.compactSupportedHomology); and pass to the colimit over I, using that Ran(X) is pseudo-proper (Hecke.ranPseudoProper). Pseudo-properness alone gives the left adjoint of f^! on D-modules, not the QCoh step. Retain the Ran source despite the displayed shorthand. Its non-unital symmetric monoidal structure is Spectral.localization_monoidal; the construction does not need it. Provider: here.'
deps = ['GLCinLean.Hecke.ranRepresentations', 'GLCinLean.LocalSystems.deRham', 'GLCinLean.Spectral.evaluation', 'GLCinLean.Hecke.ranPseudoProper', 'GLCinLean.Sheaves.passable_tensorBaseChange', 'GLCinLean.DModules.qcaDMod_compactlyGenerated', 'GLCinLean.DModules.compactSupportedHomology']
source = '[GLC1] §1.2.2; [GaitsgoryOutline] §§4.3.1–4.3.2; [GLC2] §17.6.1; [GaitsgoryAtiyahBott] §1.5'
