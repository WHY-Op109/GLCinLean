[[node]]
id = "GLCinLean.SpectralProof.operFinitePresentationApproximation"
kind = "theorem"
desc = "For any ind-placid indscheme Z and IndCoh!(Z)-module category C, recover C as the colimit of Funct_IndCoh!(Z)(IndCoh!(Y),C) over closed affine almost-finite-presentation pieces Y. Their transition functors have right adjoints given by precomposition with compact-preserving pushforward; turn the colimit into that right-adjoint limit and use colim IndCoh!(Y)=IndCoh!(Z). Apply to monodromy-free opers. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
