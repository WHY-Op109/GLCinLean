desc = "Decompose the reductive Lie algebra into its center and simple ideals; tensor their critical vacua and centers. The central-torus level is zero and its center/oper map is the explicit symmetric-algebra/jet pairing. For a central isogeny, compare the normalized oper definition with fixed Cartan bundle and simple-root coefficients equal to one, and separately the representation-lattice components in Satake compatibility; do not replace raw G-oper stacks or full loop groups by isomorphic ones. Combine finite central-kernel descent in characteristic zero with factorization to recover the actual pinned reductive group. Provider: Tau Ceti roadmap ReductiveGroups Layers 6–7 supplies group/isogeny data; the center/oper and Satake comparison is Missing and implemented here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
