[[node]]
id = "GLCinLean.SpectralProof.criticalCenter_fieldBaseChange"
kind = "theorem"
desc = "For the rational pinned model, compare vacuum-center invariants in each finite conformal weight: PBW makes the piece finite-dimensional, and only finitely many nonnegative modes act nontrivially, so invariants are the kernel of a finite matrix and commute with flat field extension. Match the oper polynomial generators and the constructed oper map weightwise. Faithfully-flat detection after embedding a finitely generated field of definition into C proves each map an isomorphism; take the graded union, then the specified continuous completion. Prove coordinate/factorization compatibility from the algebraic construction and its descent. Never interchange scalar extension with an unrestricted infinite product. Provider: Missing; implement here. This is the explicit arbitrary-field adaptation of the cited complex proof. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
