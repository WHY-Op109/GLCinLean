desc = "For a critical Satake D-module on a finite Schubert support, flat field extension commutes with ordinary derived global sections of the underlying quasi-coherent O-module and with the finite-weight invariant comparisons used to form its center-linear coefficients. Ordinary sections here are not de Rham direct image: compute them by a finite affine Cech cover of the projective support, use flatness for kernels/cohomology, and preserve the current action and convolution maps. Prove the conformal-weight finiteness needed for invariant kernels separately from cohomological boundedness. Provider: Missing; implement here. This is an explicit scalar-extension adaptation of the cited construction. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
