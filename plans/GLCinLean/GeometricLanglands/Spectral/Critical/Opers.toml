[[node]]
id = "GLCinLean.SpectralProof.criticalCenter_equiv_operFunctions"
kind = "theorem"
desc = "Feigin–Frenkel isomorphism between the critical vacuum center and regular-oper functions, compatible with factorization, coordinate changes, Chevalley normalization and Satake. Preserve arbitrary alg closed characteristic-zero k and the reductive central torus. Provider: Tau Ceti roadmap AffineLieAlgebras A7–A8 supplies the complex simple center theorem; the reductive arbitrary-k factorization form uses the separately planned rational-model, finite-weight scalar-extension, central-torus and central-isogeny comparisons. Their adaptation proofs remain explicit obligations, not a specialization to C. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.SpectralProof.reductiveCriticalCenter_comparison", "GLCinLean.SpectralProof.vacuumCenter", "GLCinLean.SpectralProof.localOpers", "GLCinLean.Hecke.satake"]
source = "[GLC2] Theorem 5.1.2; Theorem 5.2.5"

