desc = "Planned library module. Local and global oper data used to prove the Hecke property. No placeholders belong here. The base field remains any algebraically closed field of characteristic zero."

[[node]]
id = "GLCinLean.SpectralProof.localOpers"
kind = "definition"
desc = "Normalized regular and meromorphic dual-group opers on formal discs: retain the specified Cartan-bundle identification and negative-simple-root coefficient equal to the unit section, not just a Borel reduction with nonzero transversality. Define the monodromy-free fiber product Op^mf = LS^reg ×_{LS^mer} Op^mer, with connections, Borel reduction and oper transversality. Include the torus case and all central isogenies. Provider: Open Tau Ceti roadmap pull request #1056, FormalConnectionsOpers F3–F8, supplies a proposed local simple-complex contract only; arbitrary-k reductive families and derived prestacks are missing. No open PR is treated as available Lean code. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.formalDisc", "GLCinLean.Groups.langlandsDual", "GLCinLean.LocalSystems.classifyingStack", "GLCinLean.Derived.mappingPrestack"]
source = "[GLC2] §3.1; §§B.7–B.8"

