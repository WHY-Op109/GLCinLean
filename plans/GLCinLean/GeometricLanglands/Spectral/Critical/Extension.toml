desc = 'The invariant bilinear form -1/2 Killing on the Lie algebra of G; on the central torus its restriction is zero. Do not assume nondegeneracy or replace G by a simple complex group. Provider: Tau Ceti roadmap AffineLieAlgebras A2 supplies levels; the arbitrary characteristic-zero reductive specialization must retain its central part. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6. Upstream declarations used: `killingForm` (`Mathlib.Algebra.Lie.TraceForm`), `TauCeti.ReductiveAffineGroupSchemeCat` (`TauCeti.AlgebraicGeometry.AffineGroupScheme.Reductive.Basic`).'
