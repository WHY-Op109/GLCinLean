kind = "theorem"
desc = "Prove an isomorphism of monoidal factorization functors Rep(Ǧ)_Ran → Sph_{G,Ran}: Satake.naiveFactorizationFunctor_renormalized ≅ Sat_G^{-1} ∘ nv ∘ c^*, where Sat_G is the derived Satake equivalence, nv: Rep(Ǧ) → Sph^spec is as in [GLC2] §1.7.6, and c^* is restriction along the Chevalley involution of the pinned dual group, so that c^*(V^μ) ≅ V^{-w0 μ}. Check: Sat_G(IC_λ) = nv(V^{-w0 λ}) by [GLC2] Example 1.7.4, so both sides send V^λ to IC_λ. Both functors are determined by the image of the regular object with its algebra structure (Satake.factorizationFunctorFromRegularComodule); compare these images on hearts. Record the flip σ and the involution τ_G of [GLC2] Corollary 1.8.2 for the later passage between left and right modules. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
