desc = 'A nonempty example of the geometric setting.'

[[node]]
id = 'GLCinLean.Examples.exists_setting_rank_pos'
kind = 'theorem'
desc = 'Over every algebraically closed field of characteristic zero there is a Statement.Setting whose pinning has positive rank: construct one with GL₂, or a split torus of positive rank, on ℙ¹, with its pinning, the theta characteristic 𝒪(−1) (Curves.thetaCharacteristicProjectiveLine) and an explicit dual pair: GL₂ is its own Langlands dual, and the dual of a split torus is the torus of the dual lattice, each with its identification by Groups.dualityData. It does not use the general construction of the dual group. This rules out vacuous standing hypotheses. It can be proved only after Statement.RootDatumDuality is replaced by Groups.dualityData, as its replacement contract says, since no element of the present Setting can be constructed. The general existence of theta characteristics (Curves.nonempty_thetaCharacteristic) stays in the plan as the check that no curve is left out. Provider: here.'
deps = ['GLCinLean.Groups.dualityData', 'GLCinLean.Curves.thetaCharacteristicProjectiveLine', 'GLCinLean.Statement.Setting']
source = '[GLC1] §§1.3.2, 1.5'
