desc = "Prove the pointwise geometric Casselman–Shalika formula, including cleanness of the nondegenerate Whittaker extensions and their compatibility with spherical Hecke convolution. Compute exponential-twisted cohomology of finite Schubert/semi-infinite intersections by the corresponding dual-group representation multiplicities, with the specified degree and dominance vanishing. Follow the Drinfeld-compactification model, affine relevant strata, Hecke action and clean-extension proof, then the local cohomology computation. The source explicitly states its characteristic-zero D-module version; use the exponential D-module and de Rham operations, without Frobenius or trace-of-functions arguments. This input precedes both Zastava vanishing and the full factorization equivalence. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
