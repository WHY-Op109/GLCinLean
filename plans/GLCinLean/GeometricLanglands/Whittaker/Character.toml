desc = 'The Whittaker character.'

[[node]]
id = 'GLCinLean.Whittaker.character'
kind = 'definition'
desc = 'Sum of simple-root extension classes using the simple root characters of the pinning (Groups.simpleRootCharacter) and the trace H¹(X,ω_X)→k; includes empty sum for a torus. The sum is over the simple roots of the torus and the Borel subgroup of the pinning. Provider: here. Upstream declarations used: `TauCeti.Pinning` and `TauCeti.SplitMaximalTorus.IsSimpleRoot` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`).'
deps = ['GLCinLean.Whittaker.ReductionStack', 'GLCinLean.Groups.simpleRootCharacter', 'GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.Curves.serreTrace']
source = '[GLC1] §1.3.6'
