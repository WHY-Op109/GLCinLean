desc = 'Weight projectives and the Tannakian group of the spherical heart.'

[[node]]
id = 'GLCinLean.Satake.weightProjectives'
kind = 'definition'
desc = 'Represent the exact weight functors on each finite Schubert union by projectives; prove existence of a projective generator, compatibility under inclusions and the finite-dimensional freeness statements used to construct the coalgebra. Provider: here.'
deps = ['GLCinLean.Satake.cohomologyFiberFunctor', 'GLCinLean.DModules.intermediateExtension']
source = '[MV] Proposition 9.1, Corollary 9.2 and Proposition 10.1'

[[node]]
id = 'GLCinLean.Satake.tannakaGroup'
kind = 'definition'
desc = 'Construct the Hopf algebra from the dual endomorphism coalgebras of projective generators and fusion, prove the spherical heart equivalent to its finite comodules, and identify its points with tensor automorphisms of the fiber functor. Reuse the existing reconstruction theorem once the Hopf algebra is constructed. Provider: here. Upstream declarations used: `TauCeti.Tannaka.pointsFunctorIsoTensorAutFunctor` (`TauCeti.Algebra.AlgebraicGroup.Representation.Tannaka.GroupFunctor`).'
deps = ['GLCinLean.Satake.weightProjectives', 'GLCinLean.Satake.cohomologyFiberFunctor']
source = '[MV] Proposition 11.1'
