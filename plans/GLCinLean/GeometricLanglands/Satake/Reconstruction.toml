desc = 'The Tannakian group of the spherical heart.'

[[node]]
id = 'GLCinLean.Satake.tannakaGroup'
kind = 'definition'
desc = 'The Tannakian group of the spherical heart at a point, for a connected reductive group G over an algebraically closed field k of characteristic 0: the commutative Hopf algebra over k that Tannaka.neutralReconstruction gives for the heart of Satake.sphericalHeart with convolution, the fusion commutativity constraint and the fibre functor of total cohomology. The definition carries the three outputs of that node: the equivalence between the heart and the finite comodules of the Hopf algebra (`TauCeti.FGComoduleCat`), whose functor is braided monoidal; the monoidal isomorphism between this equivalence followed by the forgetful functor and the fibre functor, stated in `SemimoduleCat k` as in Tannaka.neutralReconstruction; and, for every commutative k-algebra R in the universe of k, the group isomorphism between the R-points of the Hopf algebra and the monoidal automorphisms of the scalar extension of the fibre functor to R, natural in R. The hypotheses of Tannaka.neutralReconstruction, each with the node that supplies it: the heart is abelian and k-linear (Satake.sphericalHeart); its morphisms are in the universe of k and it is essentially small in that universe (a lemma of this module: every object has finite length, the simple objects up to isomorphism form a set, namely the intermediate extensions of the irreducible equivariant local systems on the orbits Gr^λ for dominant coweights λ, and Ext^1 of two objects is in the universe of k); convolution is a monoidal structure on the heart, additive and k-linear in each variable (Satake.convolution_preserves_perversity); it is symmetric for the parity-corrected commutativity constraint (Satake.fusion); the heart is rigid (Satake.sphericalHeartDual); the monoidal structure includes the pentagon and triangle identities, and the symmetry includes the hexagon identities and c_{B,A} ∘ c_{A,B} = id, which the writers of Satake.convolution_preserves_perversity and Satake.fusion state with their constraints; the map k → End(IC_0), c ↦ c · id, is bijective (a lemma of this module: IC_0 is the unit, the orbit Gr^0 is a point and L⁺G is connected); the fibre functor to `FGModuleCat k` is additive, k-linear, exact, faithful, and braided for the ordinary symmetry of vector spaces (Satake.cohomologyFiberFunctor). The definition uses no semisimplicity, no tensor generator and no projective object, so at this point the Hopf algebra is not known to be finitely generated; finite type, connectedness and reductivity are Satake.tannakaRootDatum_equiv_dual. Checks: for the trivial group the affine Grassmannian is a point, the heart is FGModuleCat k, the fibre functor is the identity, and the Hopf algebra is k (the trivial group); for a torus T the heart is the category of finite-dimensional X_*(T)-graded vector spaces, the fibre functor forgets the grading, and the Hopf algebra is identified with the group algebra k[X_*(T)], the coordinate ring of the dual torus; the parity correction is needed: for PGL_2 the IC object of the minuscule coweight, whose orbit is a projective line in the odd component, has its total cohomology in the degrees −1 and 1, so with the uncorrected constraint the fibre functor carries the commutativity constraint of that object with itself to minus the ordinary symmetry, and it is not braided. [MV] §11 constructs the same group over the coefficient rings of [MV] (commutative Noetherian rings of finite global dimension, [MV] §2) from projective objects that represent the weight functors ([MV] §§9–10); over a field of characteristic 0, [MV] §7 uses [DeligneMilne] Theorem 2.11 instead, and so does this node. Provider: here; the reconstruction is the roadmap node Tannaka.neutralReconstruction. Upstream declarations used: `TauCeti.FGComoduleCat` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Basic`), `TauCeti.Tannaka.pointsFunctorIsoTensorAutFunctor` (`TauCeti.Algebra.AlgebraicGroup.Representation.Tannaka.GroupFunctor`).'
deps = ['GLCinLean.Tannaka.neutralReconstruction', 'GLCinLean.Satake.cohomologyFiberFunctor', 'GLCinLean.Satake.sphericalHeartDual', 'GLCinLean.Satake.fusion', 'GLCinLean.Satake.convolution_preserves_perversity', 'GLCinLean.Satake.sphericalHeart']
source = '[MV] §7, the statement before Theorem 7.3 that the spherical category with convolution and total cohomology is a neutralized Tannakian category; [DeligneMilne] Definition 2.19 and Theorem 2.11'
