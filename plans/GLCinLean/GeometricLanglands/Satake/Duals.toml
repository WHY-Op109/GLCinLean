desc = 'Duals of the objects of the spherical heart for convolution.'

[[node]]
id = 'GLCinLean.Satake.sphericalHeartDual'
kind = 'definition'
desc = 'Duals in the spherical heart at a point, for convolution. For every object A of Satake.sphericalHeart, the object A^∨ = 𝔻(inv^* A) is a dual of A. Here inv is the automorphism of the double quotient L⁺G\LG/L⁺G induced by g ↦ g⁻¹, which exchanges the two descriptions of the heart by left and by right L⁺G-equivariance, and 𝔻 is Verdier duality (DModules.verdierDuality) on a finite union of Schubert varieties that contains the support; both preserve the heart. The node gives the evaluation A^∨ ⋆ A → IC_0 and the coevaluation IC_0 → A ⋆ A^∨ with the two triangle identities, for the associativity and unit constraints of Satake.convolution_preserves_perversity. These data are `CategoryTheory.ExactPairing A A^∨`. The second pairing, `ExactPairing A^∨ A`, is the same construction for A^∨, carried along the isomorphism (A^∨)^∨ ≅ A: 𝔻 is involutive, inv is an involution, and 𝔻 commutes with inv^*. So A^∨ is a right dual and a left dual of A, and the heart is a rigid monoidal category (`CategoryTheory.RigidCategory`). The node uses no commutativity constraint, no fibre functor and no semisimplicity. Proof: for objects A, B, C of the heart, an isomorphism Hom(A ⋆ B, C) ≅ Hom(A, C ⋆ B^∨), natural in A and C and compatible with convolution on the left, from base change in the convolution diagram, the properness of the convolution map on finite unions of Schubert varieties, and Verdier duality. This isomorphism is an adjunction with − ⋆ B on the left and − ⋆ B^∨ on the right. Its unit at IC_0 is the coevaluation IC_0 → B ⋆ B^∨, and its counit at IC_0 is the evaluation B^∨ ⋆ B → IC_0, both after the unit constraints. [MV] §11 defines this anti-involution on the objects whose total cohomology is a projective module over the coefficient ring, which over a field are all objects, and states without proof that it makes the corresponding category of representations rigid; so this proof is an explicit obligation. Checks: the dual of IC_0 is IC_0; the dual of IC_λ is IC_{−w_0 λ}, because inversion carries the double coset of t^λ to the double coset of t^{−λ}, which is that of t^{−w_0 λ}; for a torus the dual of the skyscraper at λ is the skyscraper at −λ; for the trivial group the heart is FGModuleCat k and A^∨ is the dual vector space. For a field of characteristic 0, [MV] §7 obtains rigidity in another way, from [DeligneMilne] Proposition 1.20, cited in its corrected form of 2022: the object U of its conditions (d) and (e) is an identity object, and under its conditions (a) to (d) rigidity follows when every object L with a fibre of dimension 1 has an object L⁻¹ with L ⊗ L⁻¹ isomorphic to U. The paper indicates a proof of that proposition through the affine monoid scheme of the tensor endomorphisms of the fibre functor ([DeligneMilne] Remark 2.18). The roadmap MotivesAndAlgebraicCycles gives the coalgebra its bialgebra structure before it uses rigidity (§6.2, and §6.4 under its relative hypotheses), but it does not state Proposition 1.20, and Tannaka.neutralReconstruction takes rigidity as a hypothesis. So that route is not used; the route of this node also gives the dual object by a formula. The accepted roadmap GeometricSatakeAndFusion §2.10 states duals of the same form (“The right dual is `sw*D(A)`”) for its own Satake category, of sheaves with torsion or ℓ-adic coefficients over the Fargues–Fontaine curve; it is not a provider of this node. Provider: here. Upstream declarations used: `CategoryTheory.RigidCategory` and `CategoryTheory.ExactPairing` (`Mathlib.CategoryTheory.Monoidal.Rigid.Basic`).'
deps = ['GLCinLean.Satake.convolution_preserves_perversity', 'GLCinLean.Satake.convolution', 'GLCinLean.Satake.sphericalHeart', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.EquivariantIndscheme', 'GLCinLean.DModules.holonomicShriek']
source = '[MV] §11, the end of the proof of Proposition 11.1 (the anti-involution A ↦ 𝔻(i^*A)), and §4 (convolution); [DeligneMilne] Definition 1.7 (rigid tensor categories), Proposition 1.20 and Remark 2.18 (the route that is not used)'
