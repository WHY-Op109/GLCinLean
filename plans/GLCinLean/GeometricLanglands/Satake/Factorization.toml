desc = "L+G-equivariant D-modules on the Beilinson–Drinfeld Grassmannians for finite nonempty I, with convolution, diagonal transition functors and disjoint factorization. It is a factorization monoidal category, not a symmetric monoidal DG category. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
