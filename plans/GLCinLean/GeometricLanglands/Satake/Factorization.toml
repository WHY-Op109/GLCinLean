[[node]]
id = "GLCinLean.Satake.chiralHeckeAlgebra"
kind = "definition"
desc = "Apply the heart equivalence to the dual-group regular representation and its algebra/comodule structure; construct the diagonal-stratified Cousin complex and use its cohomology to form the compatible chiral Hecke algebra over all X^I. Include the factorization and diagonal identifications with the degree shift prescribed by Raskin §6.33. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
