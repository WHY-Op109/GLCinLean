desc = 'The non-renormalized half-twisted spherical category over the Ran space.'

[[node]]
id = 'GLCinLean.Satake.factorizationSphericalCategory'
kind = 'definition'
desc = 'The non-renormalized half-twisted spherical category Sph^non-ren_{G,Ran}: D-modules on the Beilinson–Drinfeld Grassmannians over X^I that are equivariant for the left action of the arc group 𝔏⁺(G) over X^I (LoopGroups.RanLoopGroup, Hecke.loopGroupAction), twisted by Satake.criticalDeterminantGerbe, each a module category over Dmod(X^I), with diagonal transition functors and disjoint factorization. Its convolution, which makes it a factorization monoidal category and not a symmetric monoidal DG category, is Satake.factorizationConvolution in the plan of the proof; the statement uses Sph^non-ren_{G,Ran} only as a factorization category. The twist is kept for every G: for the untwisted category, the source of factorization Satake is the ε-twisted Fact(Rep(Ǧ))^ε_{G_Z} ([GLys] §9.2.2), which in general is not Rep(Ǧ)_Ran; the two agree when the sign ε is trivial, as for the trivial group. Provider: here.'
deps = ['GLCinLean.Hecke.Correspondence', 'GLCinLean.LoopGroups.RanLoopGroup', 'GLCinLean.Hecke.loopGroupAction', 'GLCinLean.DModules.EquivariantIndscheme', 'GLCinLean.Ran.union', 'GLCinLean.Satake.criticalDeterminantGerbe', 'GLCinLean.DModules.TwistedCrystals', 'GLCinLean.Infinity.moduleCategory']
source = '[GLC2] §§1.1.6, 1.5.1 and Remark 1.7.5; [GLys] §§9.1.1, 9.2.2; [RaskinCPSI] §§6.29–6.30'
