desc = 'In the half-twisted Satake.factorizationSphericalCategory, construct the signed complex indexed by surjections of finite sets, with terms extended from collision strata using the chiral multiplication. Prove its concentration in the single prescribed degree by induction on the cardinality, diagonal support, and factorization; derive its coherent diagonal and disjoint-locus identifications. The unsymmetrized X^I construction suffices here. Provider: here.'
