desc = 'The root datum of the Tannakian group of the spherical heart, its pinning, and its identification with the Langlands dual group.'

[[node]]
id = 'GLCinLean.Satake.tannakaRootDatum_equiv_dual'
kind = 'theorem'
desc = 'Prove the reconstructed group is a split connected reductive group with dual maximal torus and based root datum dual to that of G, retaining central torus data. Follow the proof of [MV] Theorem 7.3 in §7. The sum of the IC objects for generators of the dominant monoid is a tensor generator, so the group is of finite type; no tensor subcategory other than the one generated by the unit object has finitely many simple objects (equivalently, the group has no nontrivial finite quotient), so it is connected (these are the Deligne–Milne criteria [DeligneMilne] Proposition 2.20 and Corollary 2.22, explicit obligations here). Satake.sphericalHeart_semisimple gives complete reducibility of all finite-dimensional representations, hence reductivity by TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive. The weight grading gives the dual torus, maximal by the highest-weight pattern, and the weights of the IC objects give the root datum. [MV] Remark 7.2 promises an argument that avoids Lemma 7.1 but does not write it; it is not used, and neither is the integral argument of [MV] §12. Provider: here. Upstream declarations used: `TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive` (`TauCeti.Algebra.AlgebraicGroup.Reductive.CompleteReducibility`).'
deps = ['GLCinLean.Satake.tannakaGroup', 'GLCinLean.Satake.weightFunctors_exact_faithful', 'GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.langlandsDual', 'GLCinLean.Satake.sphericalHeart_semisimple', 'GLCinLean.Satake.convolution_preserves_perversity']
source = '[MV] Lemma 7.1, Theorem 7.3 and its proof in §7; [DeligneMilne] Propositions 2.20, 2.23 and Corollary 2.22'

[[node]]
id = 'GLCinLean.Satake.dualIdentification'
kind = 'definition'
desc = 'The pinned isomorphism from the Tannakian group with Satake.tannakaPinning to the specified dual group with its dual pinning: the unique isomorphism of pinned groups lifting the based-root-datum identification Groups.dualityData, by the isomorphism theorem, with pinnings transported by TauCeti.Pinning.comapOfIso. It is the only identification of the Tannakian group with the dual group in the plan: the heart equivalence, naive Satake, the Hecke functors, the Casselman–Shalika equivalence and the comparison with derived Satake all use it. Provider: here; the isomorphism theorem is from roadmap ReductiveGroupsPartII. Upstream declarations used: `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.dualityData', 'GLCinLean.Satake.tannakaPinning', 'GLCinLean.Groups.splitReductiveGroup']
source = '[MV] Theorem 7.3; [ConradRGS] Theorem 6.1.17; [GLC1] §0.1.1; [GLC2] Remark 1.4.5'




[[node]]
id = 'GLCinLean.Satake.tannakaPinning'
kind = 'definition'
desc = 'A pinning of the Tannakian group of the spherical heart, with its dual torus and Borel subgroup from Satake.tannakaRootDatum_equiv_dual, chosen once. Make the choice for the Tannakian group of the heart with its canonical Aut(O)-equivariance ([MV] Proposition 2.2): that group is constant over X and over X^I, which the fusion construction uses ([MV] §5), so one pinning of it serves at every point. Any pinning can be chosen. Every later use of the dual identification uses this one choice. Provider: here. Upstream declarations used: `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.pinning_exists', 'GLCinLean.Groups.pinnings_torsor']
source = '[MV] Proposition 2.2, Theorem 7.3 and §5'
