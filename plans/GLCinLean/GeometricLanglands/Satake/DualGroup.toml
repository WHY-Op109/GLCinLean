desc = 'The root datum of the Tannakian group of the spherical heart, its pinning, and its identification with the Langlands dual group.'

[[node]]
id = 'GLCinLean.Satake.tannakaRootDatum_equiv_dual'
kind = 'theorem'
desc = 'Prove that the Tannakian group of Satake.tannakaGroup is a split connected reductive group with dual maximal torus and based root datum dual to that of G, retaining central torus data. Follow the proof of [MV] Theorem 7.3 in §7. Finite type: let λ_1, …, λ_r generate the monoid of dominant coweights (r = 0 for the trivial group) and let X be the direct sum of the IC_{λ_i}. For λ = Σ k_i λ_i, the object IC_λ is a constituent of the convolution of the powers IC_{λ_i}^{⋆ k_i}, which is a direct summand of the tensor power of X with exponent Σ k_i (the unit for exponent 0), and by Satake.sphericalHeart_semisimple every object is a finite direct sum of objects IC_λ; so X is a tensor generator, without its dual, and the Hopf algebra is finitely generated by Tannaka.finiteType_iff_exists_tensorGenerator. Connectedness: by semisimplicity an object that is not a direct sum of copies of IC_0 has a summand IC_λ with λ ≠ 0; the hull of the object, the subquotients of its finite direct sums, has finitely many simple objects, and the objects IC_{nλ}, n ≥ 1, are pairwise non-isomorphic constituents of the convolution powers of IC_λ; so the hull is not closed under convolution, and the group is connected by Tannaka.connected_iff_not_tensorClosed_hull (the implication from the criterion to connectedness), in the form `TauCeti.geometricallyConnectedCommHopfAlgProperty`. The two criteria are [DeligneMilne] Proposition 2.20(b) and Corollary 2.22; their provider is the roadmap MotivesAndAlgebraicCycles §6.3. Satake.sphericalHeart_semisimple gives complete reducibility of all finite-dimensional representations (every short exact sequence of finite comodules with carriers in the universe of the field splits, which is linear reductivity by `TauCeti.Coalgebra.isLinearlyReductive_iff_forall_nonempty_splitting`), hence reductivity by TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive, whose hypotheses are characteristic 0, finite type and geometric connectedness. The torus: the graded fibre functor F_gr of Satake.cohomologyFiberFunctor is a strong monoidal functor from the heart to the finite comodules of the group algebra k[X_*(T)], with its comparison with the fibre functor, stated in SemimoduleCat k. Apply Tannaka.reconstructionMap with D the heart, C these comodules and U = F_gr; the fibre functor of C is its forgetful functor to FGModuleCat k, which Tannaka.neutralReconstruction names as a prerequisite, and through it the comparison is a monoidal isomorphism between that functor composed with F_gr and the fibre functor. The Hopf algebra of C is identified with k[X_*(T)] by clause (5) of Tannaka.neutralReconstruction. This gives a homomorphism from the dual torus, whose coordinate ring is k[X_*(T)], to the Tannakian group. It is a closed immersion by the criterion of that node: every coweight is λ − μ with λ and μ dominant, F_λ(IC_λ) has dimension 1, and F_gr preserves duals (Satake.sphericalHeartDual), so every character of the dual torus occurs in F_gr(IC_λ ⋆ IC_μ^∨). The torus is maximal by the highest-weight pattern, and the weights of the IC objects give the root datum. [MV] Remark 7.2 promises an argument that avoids Lemma 7.1 but does not write it; it is not used, and neither is the integral argument of [MV] §12. Provider: here. Upstream declarations used: `TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive` (`TauCeti.Algebra.AlgebraicGroup.Reductive.CompleteReducibility`), `TauCeti.geometricallyConnectedCommHopfAlgProperty` (`TauCeti.Algebra.AlgebraicGroup.Connected.CommHopfAlgCat`), `TauCeti.Coalgebra.isLinearlyReductive_iff_forall_nonempty_splitting` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.LinearlyReductive`).'
deps = ['GLCinLean.Satake.tannakaGroup', 'GLCinLean.Satake.weightFunctors_exact_faithful', 'GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.langlandsDual', 'GLCinLean.Satake.sphericalHeart_semisimple', 'GLCinLean.Satake.convolution_preserves_perversity', 'GLCinLean.Tannaka.finiteType_iff_exists_tensorGenerator', 'GLCinLean.Tannaka.connected_iff_not_tensorClosed_hull', 'GLCinLean.Tannaka.reconstructionMap', 'GLCinLean.Satake.cohomologyFiberFunctor', 'GLCinLean.Satake.sphericalHeartDual']
source = '[MV] Lemma 7.1, Theorem 7.3 and its proof in §7; [DeligneMilne] Propositions 2.20, 2.21, 2.23 and Corollary 2.22'

[[node]]
id = 'GLCinLean.Satake.dualIdentification'
kind = 'definition'
desc = 'The pinned isomorphism from the Tannakian group with Satake.tannakaPinning to the specified dual group with its dual pinning: the unique isomorphism of pinned groups lifting the based-root-datum identification Groups.dualityData, by the isomorphism theorem, with pinnings transported by TauCeti.Pinning.comapOfIso. It is the only identification of the Tannakian group with the dual group in the plan: the heart equivalence, naive Satake, the Hecke functors, the Casselman–Shalika equivalence and the comparison with derived Satake all use it. Provider: here; the isomorphism theorem is Groups.splitReductiveGroup. Upstream declarations used: `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.dualityData', 'GLCinLean.Satake.tannakaPinning', 'GLCinLean.Groups.splitReductiveGroup']
source = '[MV] Theorem 7.3; [ConradRGS] Theorem 6.1.17; [GLC1] §0.1.1; [GLC2] Remark 1.4.5'





[[node]]
id = 'GLCinLean.Satake.tannakaPinning'
kind = 'definition'
desc = 'A pinning of the Tannakian group of the spherical heart, with its dual torus and Borel subgroup from Satake.tannakaRootDatum_equiv_dual, chosen once. Make the choice for the Tannakian group of the heart with its canonical Aut(O)-equivariance ([MV] Proposition 2.2): that group is constant over X and over X^I, which the fusion construction uses ([MV] §5), so one pinning of it serves at every point. Any pinning can be chosen. Every later use of the dual identification uses this one choice. Provider: here. Upstream declarations used: `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.pinning_exists', 'GLCinLean.Groups.pinnings_torsor']
source = '[MV] Proposition 2.2, Theorem 7.3 and §5'
