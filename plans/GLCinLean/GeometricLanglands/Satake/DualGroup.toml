[[node]]
id = "GLCinLean.Satake.tannakaRootDatum_equiv_dual"
kind = "theorem"
desc = "Prove the reconstructed group is a split connected reductive group with dual maximal torus and based root datum dual to that of G, retaining central torus data. Follow the proof of [MV] Theorem 7.3 in §7. The sum of the IC objects for generators of the dominant monoid is a tensor generator, so the group is of finite type; no tensor subcategory has finitely many simple objects, so it is connected (these are the Deligne–Milne criteria [DeligneMilne] Propositions 2.20 and 2.22, explicit obligations here). Satake.sphericalHeart_semisimple gives complete reducibility of all finite-dimensional representations, hence reductivity by TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive. The weight grading gives the dual torus, maximal by the highest-weight pattern, and the weights of the IC objects give the root datum. [MV] Remark 7.2 promises an argument that avoids Lemma 7.1 but does not write it; it is not used, and neither is the integral argument of [MV] §12. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6; the reductivity criterion was found at the pin e0610cce4004d628cbd9d2aafdbbb5459fe72938."
deps = ["GLCinLean.Satake.tannakaGroup", "GLCinLean.Satake.weightFunctors_exact_faithful", "GLCinLean.Groups.basedRootDatum", "GLCinLean.Groups.langlandsDual", "GLCinLean.Satake.sphericalHeart_semisimple", "TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive", "GLCinLean.Satake.convolution_preserves_perversity"]
source = "[MV] Lemma 7.1, Theorem 7.3 and its proof in §7; [DeligneMilne] Propositions 2.20, 2.22 and 2.23"

