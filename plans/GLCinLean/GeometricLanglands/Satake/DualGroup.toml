desc = 'Satake construction prerequisite. The DG enhancement and determinant normalization are separate from the heart equivalence.'

[[node]]
id = 'GLCinLean.Satake.tannakaRootDatum_equiv_dual'
kind = 'theorem'
desc = 'Prove the reconstructed group is a split connected reductive group with dual maximal torus and based root datum dual to that of G, retaining central torus data. Follow the proof of [MV] Theorem 7.3 in §7. The sum of the IC objects for generators of the dominant monoid is a tensor generator, so the group is of finite type; no tensor subcategory has finitely many simple objects, so it is connected (these are the Deligne–Milne criteria [DeligneMilne] Proposition 2.20 and Corollary 2.22, explicit obligations here). Satake.sphericalHeart_semisimple gives complete reducibility of all finite-dimensional representations, hence reductivity by TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive. The weight grading gives the dual torus, maximal by the highest-weight pattern, and the weights of the IC objects give the root datum. [MV] Remark 7.2 promises an argument that avoids Lemma 7.1 but does not write it; it is not used, and neither is the integral argument of [MV] §12. Provider: here. Upstream declarations used: `TauCeti.reductiveCommHopfAlgProperty_iff_linearlyReductive` (`TauCeti.Algebra.AlgebraicGroup.Reductive.CompleteReducibility`).'
deps = ['GLCinLean.Satake.tannakaGroup', 'GLCinLean.Satake.weightFunctors_exact_faithful', 'GLCinLean.Groups.basedRootDatum', 'GLCinLean.Groups.langlandsDual', 'GLCinLean.Satake.sphericalHeart_semisimple', 'GLCinLean.Satake.convolution_preserves_perversity']
source = '[MV] Lemma 7.1, Theorem 7.3 and its proof in §7; [DeligneMilne] Propositions 2.20, 2.23 and Corollary 2.22'

[[node]]
id = 'GLCinLean.Satake.dualIdentification'
kind = 'definition'
desc = 'The pinned isomorphism from the Tannakian group with Satake.tannakaPinning to the specified dual group with its dual pinning: the unique isomorphism of pinned groups lifting the based-root-datum identification Groups.dualityData, by the isomorphism theorem, with pinnings transported by TauCeti.Pinning.comapOfIso. It intertwines the Chevalley involutions (Groups.chevalleyInvolution) of the two pinned groups. It is the only identification of the Tannakian group with the dual group in the plan: the heart equivalence, naive Satake, the Hecke functors, the Casselman–Shalika equivalence and the comparison with derived Satake all use it. Provider: here; the isomorphism theorem is from roadmap ReductiveGroupsPartII. Upstream declarations used: `TauCeti.Pinning.comapOfIso` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Isomorphism`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.dualityData', 'GLCinLean.Satake.tannakaPinning', 'GLCinLean.Groups.chevalleyInvolution']
source = '[MV] Theorem 7.3; [ConradRGS] Theorem 6.1.17; [GLC1] §0.1.1; [GLC2] Remark 1.4.5'

[[node]]
id = 'GLCinLean.Satake.tannakaPinning'
kind = 'definition'
desc = 'A pinning of the Tannakian group of the spherical heart, with its dual torus and Borel subgroup from Satake.tannakaRootDatum_equiv_dual, chosen once. Make the choice for the Tannakian group of the heart with its canonical Aut(O)-equivariance ([MV] Proposition 2.2): that group is constant over X and over X^I, which the fusion construction uses ([MV] §5), so one pinning of it serves at every point. Any pinning can be chosen. Every later use of the dual identification uses this one choice. Provider: here. Upstream declarations used: `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`).'
deps = ['GLCinLean.Satake.tannakaRootDatum_equiv_dual', 'GLCinLean.Groups.pinning_exists', 'GLCinLean.Groups.pinnings_torsor']
source = '[MV] Proposition 2.2, Theorem 7.3 and §5'

[[node]]
id = 'GLCinLean.Satake.dualIdentificationChangePinningIso'
kind = 'definition'
desc = 'For another choice of Satake.tannakaPinning, the two dual identifications differ by conjugation by an element t of the dual torus (Groups.pinnings_torsor). Construct the monoidal factorization isomorphism between pullback along conjugation by t and the identity of Rep(Ǧ)_Ran (v ↦ t·v, constant over Ran), and from it the induced monoidal isomorphisms of naive Satake and of the Hecke action of Rep(Ǧ)_Ran on Dmod_1/2(Bun_G). The spectral localization, QCoh(LS_Ǧ), IndCoh_Nilp(LS_Ǧ) and Ψ do not depend on the pinning. The isomorphisms that it induces on the Casselman–Shalika equivalence and on the QCoh(LS_Ǧ)-action belong to the plan of the proof. Provider: here.'
deps = ['GLCinLean.Satake.dualIdentification', 'GLCinLean.Groups.pinnings_torsor', 'GLCinLean.Satake.naiveFactorizationFunctor', 'GLCinLean.Hecke.action']
source = '[GLC2] Theorem 1.7.2 and §1.7.6; [GLC1] §1.2.1'

[[node]]
id = 'GLCinLean.Satake.isLanglandsFunctor_iff_of_changePinning'
kind = 'theorem'
desc = 'Transport along the isomorphisms of Satake.dualIdentificationChangePinningIso preserves the two characterizing properties of [GLC1] Cor. 1.6.5: a continuous functor is a Langlands functor for one choice of Satake.tannakaPinning if and only if its transport is one for the other choice, and transport preserves equivalences. The transport of a functor F is F itself: the two Hecke actions are naturally isomorphic, and DGFun.MapsEquiv transports along a natural isomorphism of its first functor. Hence the conclusion of the main theorem does not depend on the choice. Provider: here.'
deps = ['GLCinLean.Satake.dualIdentificationChangePinningIso', 'GLCinLean.Statement.IsLanglandsFunctor', 'GLCinLean.Statement.RepRan', 'GLCinLean.Statement.Loc', 'GLCinLean.Statement.heckeActionRight', 'GLCinLean.Statement.Psi', 'GLCinLean.Statement.DGFun.IsEquivalence', 'GLCinLean.Statement.DGNatIso', 'GLCinLean.Statement.DGFun.MapsEquiv']
source = '[GLC1] Corollary 1.6.5 and §§1.2.1–1.2.2'
