desc = "Comparison of the regular Satake ind-object across de Rham and complex constructible realizations, preserving its algebra and group action."

[[node]]
id = "GLCinLean.Satake.regularSheafExt_complexComparison"
kind = "theorem"
desc = "For the regular Satake ind-object, express it as the filtered union of finite-dimensional dual-group subrepresentations. Use almost compactness of the unit in each bounded range to pass the finite-support Ext comparisons to this union. Over C apply the regular-holonomic de Rham/constructible comparison on each finite stage, retaining convolution, Yoneda products and the commuting dual-group action. Compare the explicitly constructed universal-centralizer map, then descend its isomorphism along the faithfully flat field extension; this avoids identifying an arbitrary abstract algebra isomorphism. No embedding of the original k into C is assumed. Provider: Missing; implement here. The finite-stage comparison and compatible passage to the ind-object are explicit adaptation obligations. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.DModules.boundedEquivariantExt_baseChange", "GLCinLean.Satake.regularSheafExt_centralIsogenyComparison", "GLCinLean.SpectralProof.factorizationRenormalization", "GLCinLean.Satake.geometricSatakeHeartEquivalence", "GLCinLean.Infinity.compactObject"]
source = "[LoopGrassmannianExt] Theorem 7.6.1 and proof; [FactorizableDerivedSatake] Lemma 9.2.1 and proof of Proposition 9.2.2"

[[node]]
id = "GLCinLean.Satake.regularSheafExt_torusAndProducts"
kind = "theorem"
desc = "Compute the regular Satake sheaf Ext algebra for a torus directly: its Grassmannian is the coweight lattice, the regular dual-torus representation splits by characters, and Ext from the unit sees only the zero component. The remaining equivariant algebra is H*(BT), identified with the symmetric algebra on the dual Lie algebra in degree two by the character/coweight pairing. Prove the product formula using finite-support Kunneth and then bounded almost-compact passage to the regular ind-object. Retain Yoneda multiplication, dual-group action, unit, and the actual Satake-induced comparison map. Provider: Missing; implement here. This is the torus/product adaptation required beyond ABG's semisimple hypothesis. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.affineGrassmannian", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Groups.basedRootDatum", "GLCinLean.Satake.geometricSatakeHeartEquivalence", "GLCinLean.DModules.boundedEquivariantExt_baseChange"]
source = "[FactorizableDerivedSatake] §§7.1–7.5 and 9.2–9.4 (required torus/product Ext reduction); [LoopGrassmannianExt] Theorem 7.6.1"

[[node]]
id = "GLCinLean.Satake.regularSheafExt_centralIsogenyComparison"
kind = "theorem"
desc = "Extend the semisimple simply-connected-geometric/adjoint-dual Ext calculation to a general connected reductive group using G_der^sc × Z(G)^0→G. Track Grassmannian components by the coweight lattice modulo the coroot lattice and the dual regular representation by central characters: Ext from the unit vanishes on the nonneutral components. On the neutral part compare the finite-central-kernel equivariant categories in their trivial-kernel-character sector; exact invariants for the finite kernel in characteristic zero give the Ext comparison. Combine the torus/product formula and identify Lie algebras through the isogeny. Prove compatibility of convolution, the regular-comodule algebra, Yoneda multiplication, dual-group action and the actual monad map. Do not claim that the whole Grassmannians or representation categories for distinct root data are equivalent. Provider: Tau Ceti roadmap ReductiveGroups Layers 6–7 supplies the group/isogeny/lattice input; the equivariant Ext and component comparison is Missing and implemented here. This is an explicit adaptation obligation; field descent alone does not change the root datum. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Satake.regularSheafExt_torusAndProducts", "GLCinLean.SpectralProof.equivariantRegularSheaf_cohomology", "GLCinLean.Groups.langlandsDual", "GLCinLean.DModules.equivariantIndscheme", "GLCinLean.SpectralProof.parabolicLevi"]
source = "[LoopGrassmannianExt] §§1.2, 6.1 and Theorem 7.6.1 (original group scope); [FactorizableDerivedSatake] §§1.7 and 9.2–9.4 (general-reductive target and required isogeny reduction)"
