desc = 'The critical determinant gerbe on the Beilinson–Drinfeld Grassmannian, and its comparison with the determinant gerbe on Bun_G.'

[[node]]
id = 'GLCinLean.Satake.criticalDeterminantGerbe'
kind = 'definition'
desc = 'The μ2-gerbe det^{1/2}_{Gr_G} of square roots of the determinant factorization line bundle det_{Gr_G} on Gr_{G,Ran} (the relative determinant of the adjoint bundle, det_𝔤 in [GLys]), as a factorization gerbe with its L+G-equivariance: the multiplicative factorization gerbe on the loop group 𝔏(G) over the Ran space (LoopGroups.RanLoopGroup), which is the pullback of the gerbe along the orbit map 𝔏(G) → Gr_{G,Ran} of Hecke.loopGroupAction, with multiplicative trivializations on the arc group 𝔏⁺(G) and on 𝔏(N). Here det_{Gr_G} is the relative determinant of the two lattices of the adjoint bundle on the formal disc, the modified one against the trivial one, built from Sheaves.determinant of perfect complexes, with its gluing under factorization; its grading is trivial because G is unimodular, so the gluing has no Koszul signs ([GLys] §5.2.1, footnote). This relative form is part of this node. It is canonical and uses no square root of ω_X. Record the comparison of [GLC2] Remarks 1.1.4 and 1.1.7: a square root of ω_X gives a square root of det_{Gr_G} as a line bundle on Gr_{G,Ran}, and so a trivialization of the gerbe. This square root is compatible with factorization only as a Z/2-graded factorization line bundle, with grading ⟨λ, 2ρ̌⟩ mod 2 on the component of λ, the parity of Groups.coweightParity; so in general the trivialization of the gerbe is not compatible with factorization. It is compatible when the grading is zero on every component, as for the trivial group. Provider: here.'
deps = ['GLCinLean.AffineGrassmannian', 'GLCinLean.Sheaves.determinant', 'GLCinLean.Stacks.rootGerbe', 'GLCinLean.Groups.coweightParity', 'GLCinLean.LoopGroups.RanLoopGroup', 'GLCinLean.Hecke.loopGroupAction']
source = '[GLC2] §1.1 and Remarks 1.1.4, 1.1.7; [GLys] §§5.2, 6.3, 7.2–7.3'




[[node]]
id = 'GLCinLean.Satake.criticalTwistBunDeterminantEquiv'
kind = 'definition'
desc = 'The canonical equivalence of gerbes that identifies the two pullbacks of the gerbe det^{1/2}_{Bun_G} to the Ran Hecke stack with each other, up to the local gerbe det^{1/2}_{Gr_G} of Satake.criticalDeterminantGerbe: h_out^* det ⊗ (h_in^* det)^{-1} is the pullback of det_{Gr_G}, and so h_out^* det^{1/2} ⊗ (h_in^* det^{1/2})^{-1} is the pullback of det^{1/2}_{Gr_G}. The pullback of det_{Gr_G} and of det^{1/2}_{Gr_G} to the Ran Hecke stack is formed as follows. A point of the Ran Hecke stack has no chosen trivialization of its first bundle on the disc. Restriction of the two bundles and of the isomorphism to the discs D_x and D°_x is a map from the Ran Hecke stack to the quotient of Gr_{G,Ran} by the left action of the arc group 𝔏⁺(G) of Hecke.loopGroupAction, the local Hecke stack of [GLys] §7.3.1. The gerbe of Satake.criticalDeterminantGerbe, with its equivariance for 𝔏⁺(G), descends to this quotient, and its pullback along the restriction map is the pullback meant here; the same holds for the line bundle. The equivalence is defined by its construction. Let (P, P′, α) be a point of the Ran Hecke stack over a test scheme S, with x its point of the Ran space, P its first bundle (the image under h_in) and P′ its second bundle (the image under h_out). The adjoint bundles ad(P) and ad(P′) are vector bundles on S × X, and α is an isomorphism between them off the graphs Γ_x. Write π : S × X → S, E = ad(P) and E′ = ad(P′). Choose a divisor D as in LoopGroups.RanLoopGroup (1). For sufficiently large n, N = E(−nD) maps into both E and E′ using α, and the direct images Q = π_*(E/N) and Q′ = π_*(E′/N) are finite locally free on S. Use the determinant of Sheaves.determinant with values in ℤ-graded lines, graded by the rank, with the Koszul sign rule for the symmetry of the tensor product ([GLys] §5.2.1, footnote). Prove the additivity and refinement identities used here wherever the determinant API does not already supply them. For A = det Rπ_*N, the two cofiber sequences give det Rπ_*E ≅ A ⊗ det Q and det Rπ_*E′ ≅ A ⊗ det Q′, in that order. Identify a ratio of lines L′ ⊗ L⁻¹ with Hom(L, L′). Cancelling the common normalization det Rπ_*ad(P⁰) of Stacks.determinantBundle identifies the ratio of the normalized global determinants with Hom(det Rπ_*E, det Rπ_*E′). Under additivity, identify this last line with Hom(det Q, det Q′) by cancelling tensor product on the left by A. As a contraction of A with its inverse, this cancellation is the inverse of the coevaluation 𝒪 → A ⊗ A⁻¹. The other contraction, the evaluation after the symmetry, is (−1)^d times it, for the degree d of A, and is not used: d, the rank of Rπ_*N, is dim G · (1 − g − n · deg D), so when dim G · deg D is odd the other contraction changes sign with n. The line Hom(det Q, det Q′) is the relative determinant on D_x of the outgoing lattice, the lattice of P′, against the incoming lattice, the lattice of P, that is, the pullback of det_{Gr_G} ([GLC2] Proposition 10.1.11 and its proof). For subbundles N₂ ⊂ N₁ of this kind, det Q₂ ≅ det π_*(N₁/N₂) ⊗ det Q₁ and likewise for Q₂′, and the lines Hom(det Q₂, det Q₂′) and Hom(det Q₁, det Q₁′) are identified by cancelling tensor product on the left by det π_*(N₁/N₂); the relative determinant of Satake.criticalDeterminantGerbe is formed with these identifications. Prove that the identifications above agree under common refinement, hence are independent of n and of the lifts defining D, and commute with pullback in S. The ratio lines have degree zero by unimodularity of the adjoint representation. Apply Stacks.rootGerbe to the resulting isomorphism of ordinary lines, using its tensor and inverse equivalences. Two equivalences between the same two gerbes differ by a μ_2-torsor on the Ran Hecke stack, and the Hecke functors that they define differ by the twist of the kernels by this torsor; so the node asks for this equivalence, and an equivalence that is only known to exist does not serve. Test, part of this node: on the unit section Bun_G × Ran → Hecke (the identity modification) the two pullbacks of det_{Bun_G} are equal and the two lattices are equal, so both lines are lines of endomorphisms Hom(L, L), and the isomorphism of line bundles sends the identity to the identity. For the trivial group every modification is the identity, so this is the case that Examples.trivialGroup_isLanglandsFunctor_id uses. This lets half-twisted spherical kernels act on Dmod_1/2(Bun_G) (Hecke.sphericalAction). The statement uses only this equivalence. Its compatibility with the composition of modifications and with factorization is Satake.criticalTwistBunDeterminantEquiv_comp in the plan of the proof: it is stated over the composition map of the Ran Hecke stack, which no node of this plan has and which only the action structure Hecke.sphericalAction_associativity uses. The construction retains the half twist for every G: the spherical category and its factorization structure are not untwisted by the theta characteristic, because in general that trivialization is not compatible with factorization ([GLC2] Remarks 1.1.4, 1.1.7 and 1.1.12); it is compatible when the component parity of the theta-induced square root, the grading ⟨λ, 2ρ̌⟩ mod 2 of Satake.criticalDeterminantGerbe, is zero on every component, as for the trivial group. Provider: here.'
deps = ['GLCinLean.Satake.criticalDeterminantGerbe', 'GLCinLean.Stacks.determinantBundle', 'GLCinLean.DModules.TwistedCrystals', 'GLCinLean.Hecke.Correspondence', 'GLCinLean.Hecke.loopGroupAction', 'GLCinLean.Stacks.rootGerbe', 'GLCinLean.Sheaves.determinant', 'GLCinLean.LoopGroups.RanLoopGroup']
source = '[GLys] §§2.3.5, 5.2.1, 6.3, 7.3.1, 9.5.1–9.5.3; [GLC1] §§1.1.1, 1.1.4–1.1.6 and Remark 1.1.6; [GLC2] §§1.1, 10.1.2, Proposition 10.1.11 and its proof, equations (10.5) and (10.6)'
