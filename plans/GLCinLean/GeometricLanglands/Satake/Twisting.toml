desc = 'The critical determinant gerbe on the Beilinson–Drinfeld Grassmannian, and its comparison with the determinant gerbe on Bun_G.'

[[node]]
id = 'GLCinLean.Satake.criticalDeterminantGerbe'
kind = 'definition'
desc = 'The μ2-gerbe det^{1/2}_{Gr_G} of square roots of the determinant factorization line bundle det_{Gr_G} on Gr_{G,Ran} (the relative determinant of the adjoint bundle, det_𝔤 in [GLys]), as a factorization gerbe with its L+G-equivariance: the multiplicative factorization gerbe on the loop group 𝔏(G) over the Ran space (LoopGroups.RanLoopGroup), which is the pullback of the gerbe along the orbit map 𝔏(G) → Gr_{G,Ran} of Hecke.loopGroupAction, with multiplicative trivializations on the arc group 𝔏⁺(G) and on 𝔏(N). Here det_{Gr_G} is the relative determinant of the two lattices of the adjoint bundle on the formal disc, the modified one against the trivial one, built from Sheaves.determinant of perfect complexes, with its gluing under factorization; its grading is trivial because G is unimodular, so the gluing has no Koszul signs ([GLys] §5.2.1, footnote). This relative form is part of this node. It is canonical and uses no square root of ω_X. Record the comparison of [GLC2] Remarks 1.1.4 and 1.1.7: a square root of ω_X gives a square root of det_{Gr_G} as a line bundle on Gr_{G,Ran}, and so a trivialization of the gerbe. This square root is compatible with factorization only as a Z/2-graded factorization line bundle, with grading ⟨λ, 2ρ̌⟩ mod 2 on the component of λ, the parity of Groups.coweightParity; so in general the trivialization of the gerbe is not compatible with factorization. It is compatible when the grading is zero on every component, as for the trivial group. Provider: here.'
deps = ['GLCinLean.AffineGrassmannian', 'GLCinLean.Sheaves.determinant', 'GLCinLean.Stacks.rootGerbe', 'GLCinLean.Groups.coweightParity', 'GLCinLean.LoopGroups.RanLoopGroup', 'GLCinLean.Hecke.loopGroupAction']
source = '[GLC2] §1.1 and Remarks 1.1.4, 1.1.7; [GLys] §§5.2, 6.3, 7.2–7.3'




[[node]]
id = 'GLCinLean.Satake.criticalTwistBunDeterminantEquiv'
kind = 'definition'
desc = 'The canonical equivalence of gerbes that identifies the two pullbacks of the gerbe det^{1/2}_{Bun_G} to the Ran Hecke stack with each other, up to the local gerbe det^{1/2}_{Gr_G} of Satake.criticalDeterminantGerbe: h_out^* det ⊗ (h_in^* det)^{-1} is the pullback of det_{Gr_G}, and so h_out^* det^{1/2} ⊗ (h_in^* det^{1/2})^{-1} is the pullback of det^{1/2}_{Gr_G}, compatibly with factorization and composition of modifications. The pullback of det_{Gr_G} and of det^{1/2}_{Gr_G} to the Ran Hecke stack is formed as follows. A point of the Ran Hecke stack has no chosen trivialization of its first bundle on the disc. Restriction of the two bundles and of the isomorphism to the discs D_x and D°_x is a map from the Ran Hecke stack to the quotient of Gr_{G,Ran} by the left action of the arc group 𝔏⁺(G) of Hecke.loopGroupAction, the local Hecke stack of [GLys] §7.3.1. The gerbe of Satake.criticalDeterminantGerbe, with its equivariance for 𝔏⁺(G), descends to this quotient, and its pullback along the restriction map is the pullback meant here; the same holds for the line bundle. This lets half-twisted spherical kernels act on Dmod_1/2(Bun_G) (Hecke.sphericalAction). The construction retains the half twist for every G: the spherical category and its factorization structure are not untwisted by the theta characteristic, because in general that trivialization is not compatible with factorization ([GLC2] Remarks 1.1.4, 1.1.7 and 1.1.12); it is compatible when the grading of Satake.criticalDeterminantGerbe is zero on every component, as for the trivial group. Provider: here.'
deps = ['GLCinLean.Satake.criticalDeterminantGerbe', 'GLCinLean.Stacks.determinantBundle', 'GLCinLean.DModules.TwistedCrystals', 'GLCinLean.Hecke.Correspondence', 'GLCinLean.Hecke.loopGroupAction', 'GLCinLean.Stacks.rootGerbe']
source = '[GLys] §§6.3, 9.5.1–9.5.3; [GLC1] §§1.1.4–1.1.6 and Remark 1.1.6; [GLC2] §1.1'
