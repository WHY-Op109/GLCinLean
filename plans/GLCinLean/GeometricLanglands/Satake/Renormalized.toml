desc = "Renormalized spherical convolution and the rigidity needed for parabolic induction."

[[node]]
id = "GLCinLean.Satake.renormalizedSphericalCategory"
kind = "definition"
desc = "Construct the renormalized half-twisted spherical category Sph_G: the ind-completion of the objects of Sph^non-ren (Satake.factorizationSphericalCategory) whose images under the forgetful functors to Dmod_1/2(L+G\\LG) and Dmod_1/2(LG/L+G) are compact, as a unital factorization monoidal category. Construct the adjunction ren ⊣ non-ren, with ren fully faithful and non-ren monoidal, so Sph^non-ren is a monoidal colocalization of Sph_G. The unit is compact at a geometric point and atomic relative to Dmod(X^I) over configurations. Use the relative finite-configuration formulation of factorization renormalization, and retain the flip anti-involution from loop-group inversion. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.affineGrassmannian", "GLCinLean.DModules.equivariantIndscheme", "GLCinLean.Satake.convolution", "GLCinLean.SpectralProof.factorizationRenormalization", "GLCinLean.Satake.factorizationSphericalCategory", "GLCinLean.Satake.criticalDeterminantGerbe"]
source = "[GLC2] §§1.5.1–1.5.4; [FactorizableDerivedSatake] Proposition 6.3.2"

[[node]]
id = "GLCinLean.Satake.renormalizedSphericalCategory_rigid"
kind = "theorem"
desc = "Prove ordinary rigidity at geometric points and rigidity relative to Dmod(X^I) over finite configurations. Treat the latter as a monoidal algebra in Dmod(X^I)-module categories: construct the continuous bilinear right adjoint to relative convolution, the relative evaluation/coevaluation and the atomic unit. Use Verdier duality with loop inversion and ind-proper convolution on the geometric finite-support generators, prove the triangle identities, and retain the relative scalar structure through renormalization and every diagonal/disjoint comparison. At no stage require arbitrary compact base coefficients such as D_X to be tensor-dualizable. Apply the relative evaluation/coevaluation mate calculation to prove that continuous adjoints of spherical module functors are strictly spherical-linear. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Satake.renormalizedSphericalCategory", "GLCinLean.DModules.verdierDuality", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Infinity.rigidMonoidalCategory", "GLCinLean.Infinity.rightAdjoint", "GLCinLean.Infinity.moduleCategory"]
source = "[GLC2] §1.5.5; [GLC3] §§1.3.6, 1.4.1–1.4.5, §9.6.11 and Lemma 9.6.12 (relative rigidity and adjoint linearity)"

[[node]]
id = "GLCinLean.Satake.naiveFactorizationFunctor_renormalized"
kind = "definition"
desc = "Lift the naive factorization functor to the renormalized category: each Sat^nv(V) has finite support and compact images under forgetting equivariance, so the naive functor factors through ren. Construct the monoidal factorization functor L: Rep(Ǧ)_Ran → Sph_{G,Ran} with an isomorphism non-ren ∘ L ≅ Satake.naiveFactorizationFunctor, compatible with units and factorization. Consequently, on any category acted on by Sph_G through non-ren, the Rep(Ǧ)_Ran actions through L and through the naive functor agree. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Satake.naiveFactorizationFunctor", "GLCinLean.Satake.renormalizedSphericalCategory", "GLCinLean.Infinity.compactObject"]
source = "[GLC2] §§1.5.2–1.5.3 and 1.7.6; [FactorizableDerivedSatake] Proposition 6.3.2"
