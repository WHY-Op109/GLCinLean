desc = 'The chiral Hecke algebra in the half-twisted spherical category.'

[[node]]
id = 'GLCinLean.Satake.chiralHeckeAlgebra'
kind = 'definition'
desc = 'Transport the regular representation of the dual group, with its algebra structure and its comodule structure over the coalgebra Oblv(O_{Ǧ,X^I}) of Ran.Representations.regularObject, to the half-twisted heart at each point, through the heart equivalence followed by Satake.halfTwistedHeart_equiv_untwistedHeart. Construct the diagonal-stratified Cousin complex in Satake.factorizationSphericalCategory and use its cohomology to form the compatible chiral Hecke algebra over all X^I. The differentials of the Cousin complex are built from the multiplication of the regular representation, composed with the fusion map j_*j^*(T_V ⊠ T_W) → Δ_*(T_{V⊗W}) ([GaitsgoryDeJong] §7.2), so the algebra structure at each point is part of this node. The algebra structure of the family over X^I for the convolution of Sph^non-ren_{G,X^I} is not part of it: it is constructed in Satake.naiveFactorizationFunctor_monoidal, in the plan of the proof. The commutativity of the chiral Hecke algebra uses the geometric fusion constraint of the half-twisted category, which matches the usual constraint of Rep(Ǧ); in the untwisted category it would fail by signs on odd components. Include the factorization and diagonal identifications with the degree shift of Raskin §6.33. Provider: here.'
deps = ['GLCinLean.Satake.geometricSatakeHeartEquivalence', 'GLCinLean.Satake.fusion', 'GLCinLean.Satake.factorizationSphericalCategory', 'GLCinLean.Ran.Representations', 'GLCinLean.Ran.Representations.regularObject', 'GLCinLean.Satake.chiralCousinComplex_concentrated', 'GLCinLean.Satake.halfTwistedHeart_equiv_untwistedHeart']
source = '[GaitsgoryDeJong] Appendix B (§7), §§7.1–7.5 and 7.7–7.9; [RaskinCPSI] §6.33'
