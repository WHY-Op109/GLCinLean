desc = 'The naive factorization Satake functor from Rep(Ǧ)_Ran to the half-twisted spherical category.'

[[node]]
id = 'GLCinLean.Satake.naiveFactorizationFunctor'
kind = 'definition'
desc = 'Construct the continuous DG functor Rep(Ǧ)_Ran → Sph^non-ren_{G,Ran} into the half-twisted category of Satake.factorizationSphericalCategory: for every finite set I, the Dmod(X^I)-linear functor Rep(Ǧ)_{X^I} → Sph^non-ren_{G,X^I} that corresponds under Ran.Representations.linearFunctorEquivComodule to the chiral Hecke algebra Satake.chiralHeckeAlgebra as a comodule over the regular object. These functors are compatible with the diagonal transition functors, so they define the functor over Ran. The statement uses only this functor; its monoidal structure is Satake.naiveFactorizationFunctor_monoidal in the plan of the proof. The source is the plain Rep(Ǧ)_Ran because the target is half-twisted ([GLys] §9.1.1 with trivial metaplectic gerbe). It is an equivalence on hearts only, not on the full spherical DG categories. Provider: here.'
deps = ['GLCinLean.Satake.chiralHeckeAlgebra', 'GLCinLean.Ran.Representations.linearFunctorEquivComodule', 'GLCinLean.Satake.dualIdentification', 'GLCinLean.Satake.factorizationSphericalCategory']
source = '[RaskinCPSI] §§6.30–6.33 and Lemma 6.32.1; [GLys] §§9.1.1, 9.2.1–9.2.2; [GLC2] Remark 1.7.5'
