desc = 'The naive factorization Satake functor from Rep(Ǧ)_Ran to the half-twisted spherical category.'

[[node]]
id = 'GLCinLean.Satake.naiveFactorizationFunctor'
kind = 'definition'
desc = 'Construct the continuous monoidal DG functor Rep(Ǧ)_Ran → Sph^non-ren_{G,Ran} into the half-twisted category of Satake.factorizationSphericalCategory, from the regular-comodule algebra; prove monoidality by disjoint-stratum reduction and compatibility with all diagonals. The source is the plain Rep(Ǧ)_Ran because the target is half-twisted ([GLys] §9.1.1 with trivial metaplectic gerbe). It is an equivalence on hearts only, not on the full spherical DG categories. Provider: here.'
deps = ['GLCinLean.Satake.chiralHeckeAlgebra', 'GLCinLean.Ran.Representations.linearFunctorEquivComodule', 'GLCinLean.Satake.dualIdentification', 'GLCinLean.Satake.factorizationSphericalCategory']
source = '[RaskinCPSI] §§6.30–6.33 and Lemma 6.33.3; [GLys] §§9.1.1, 9.2.1–9.2.2; [GLC2] Remark 1.7.5'
