desc = 'Total cohomology as the fibre functor of the spherical heart.'

[[node]]
id = 'GLCinLean.Satake.cohomologyFiberFunctor'
kind = 'definition'
desc = 'Total cohomology as the fibre functor of the spherical heart at a point, for a connected reductive group G with the Borel subgroup and the maximal torus T of its pinning, over an algebraically closed field k of characteristic 0. The functor F = H^*_dR(Gr_G, −) from Satake.sphericalHeart to `FGModuleCat k`, with these properties, which are the hypotheses on the fibre functor in Tannaka.neutralReconstruction. (a) Its values are finite-dimensional; it is additive and k-linear. (b) It is exact (it preserves finite limits and finite colimits) and faithful: by Satake.weightFunctors_exact_faithful it is the direct sum of the weight functors F_ν over the coweights ν in X_*(T), of which finitely many are nonzero on a given object. (c) It is strong monoidal for convolution: isomorphisms F(A ⋆ B) ≅ F(A) ⊗ F(B) and F(IC_0) ≅ k, compatible with the associativity and unit constraints. (d) It is braided: it carries the parity-corrected commutativity constraint of Satake.fusion to the ordinary symmetry v ⊗ w ↦ w ⊗ v of vector spaces. With the uncorrected constraint it carries it to the Koszul sign rule for the cohomological degree, which differs from the ordinary symmetry when the affine Grassmannian has a component of odd parity, as for PGL_2. (e) The graded refinement: the weight functors make F a functor F_gr from the heart to the finite comodules of the group algebra k[X_*(T)] (`TauCeti.FGComoduleCat` of the monoid algebra of X_*(T), written multiplicatively), where the decomposition of F(A) into the F_ν(A) gives the coaction (`DirectSum.IsInternal.monoidAlgebraComodule`); F_gr is strong monoidal, with F_ν(A ⋆ B) ≅ ⊕_{ν_1 + ν_2 = ν} F_{ν_1}(A) ⊗ F_{ν_2}(B), and there is a monoidal isomorphism between F_gr followed by the forgetful functor of these comodules to `SemimoduleCat k` and F followed by the forgetful functor to `ModuleCat k` and the equivalence `ModuleCat.equivalenceSemimoduleCat`. The comparison is stated in SemimoduleCat k, the target of the braided forgetful functor of FGComoduleCat at the pin, as in the signature of the roadmap for Tannaka.neutralReconstruction; so this node needs no forgetful functor from comodules to FGModuleCat and does not depend on the reconstruction. With (d), F_gr is braided for the symmetry of the comodules, which is the ordinary symmetry of the underlying vector spaces: the forgetful functor is faithful and braided. Tau Ceti has the finitely supported finite-dimensional graded vector spaces as a monoidal category (`TauCeti.VecTwisted`, for a normalized 3-cocycle; the cocycle with constant value 1 gives the untwisted associator), with no braiding and no monoidal equivalence with these comodules; the values of F_gr are comodules. For the torus application take C = FGComoduleCat k k[X_*(T)] and U = F_gr. Clause (5) of Tannaka.neutralReconstruction identifies B_C with k[X_*(T)]. The rigidity of the heart is not part of this node; it is Satake.sphericalHeartDual. Checks: for the trivial group the heart is FGModuleCat k and F is the identity; for a torus T the heart is the category of finite-dimensional X_*(T)-graded vector spaces, F_gr is an equivalence and F forgets the grading; for dominant λ the space F_λ(IC_λ) has dimension 1. Provider: here. Upstream declarations used: `FGModuleCat` (`Mathlib.Algebra.Category.FGModuleCat.Basic`), `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`), `TauCeti.FGComoduleCat` (`TauCeti.Algebra.Coalgebra.Comodule.Finite.Basic`), `DirectSum.IsInternal.monoidAlgebraComodule` (`TauCeti.Algebra.Coalgebra.Comodule.MonoidAlgebra.Internal`), `ModuleCat.equivalenceSemimoduleCat` (`Mathlib.Algebra.Category.ModuleCat.Basic`), `TauCeti.VecTwisted` (`TauCeti.CategoryTheory.GradedObject.VecTwisted`).'
deps = ['GLCinLean.Satake.weightFunctors_exact_faithful', 'GLCinLean.Satake.fusion', 'GLCinLean.Infinity.derivedVect']
