[[node]]
id = "GLCinLean.Satake.sphericalHeart_semisimple"
kind = "theorem"
desc = "The spherical heart over k is semisimple: its simple objects are the IC_λ for dominant coweights λ, and Ext^1(IC_λ, IC_μ) = 0 for all λ and μ, including λ = μ. (0) Every object has finite length, because holonomic D-modules do. (1) Forgetting L+G-equivariance is fully faithful on perverse objects because the group is connected, and the heart is a full subcategory of holonomic D-modules on a finite Schubert union containing both supports; so its Ext^1 injects into Hom(IC_λ, IC_μ[1]) in the bounded holonomic derived category. (2) The simple objects are the IC_λ: the stabilizers are connected, so the only irreducible equivariant local systems on the orbits are trivial. (3) Repeat the argument of [MV] Lemma 7.1 in D-modules over k. If λ and μ lie in different components the Hom vanishes for support reasons. Otherwise filter by strata: on each stratum Gr^ν the *-restriction of IC_λ and the !-restriction of IC_μ are L+G-equivariant, hence constant (the stabilizers are connected), with cohomology in even degrees by Satake.icStalkParity; the de Rham cohomology of Gr^ν is even by Hecke.schubertStratum_deRhamCohomology_even. So every stratum contributes to Hom(IC_λ, IC_μ[n]) only for even n, and the spectral sequence gives Hom(IC_λ, IC_μ[1]) = 0. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Satake.sphericalHeart", "GLCinLean.Satake.icStalkParity", "GLCinLean.DModules.intermediateExtension", "GLCinLean.DModules.deRhamPushforward", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Hecke.affineGrassmannian", "GLCinLean.Hecke.schubertStratum_deRhamCohomology_even", "GLCinLean.DModules.holonomic", "GLCinLean.DModules.equivariantIndscheme"]
source = "[MV] Lemma 7.1 and Proposition 2.1; [LusztigQAnalog] §11 (through Satake.icStalkParity)"

[[node]]
id = "GLCinLean.Satake.icStalkParity_complex"
kind = "theorem"
desc = "Over C, in the Schubert-constructible derived category of a finite Schubert union, the *-restriction and the !-restriction of IC_λ to each stratum Gr^μ in the closure of Gr^λ have cohomology only in degrees congruent to dim Gr^λ modulo 2. Proof. (1) Each G(O)-Schubert variety is an I-Schubert variety; by Hecke.iwahoriWeylGroup a length-zero element carries it to the neutral component, and by Hecke.affineGrassmannian_reducedComponents the reduced neutral component is that of the simply connected cover. (2) By Hecke.bottSamelsonPushforward_parity, the pushforward along a Bott–Samelson resolution that is an isomorphism over Gr^λ is a parity complex. (3) By Constructible.decompositionTheorem it is a direct sum of shifted IC sheaves, and IC_λ occurs unshifted because the map is birational; in characteristic zero the parity sheaves are the IC sheaves ([JuteauMautnerWilliamson] Remark 2.17). (4) A direct summand of a parity complex is parity, which gives the degrees; the !-statement also follows by Verdier self-duality. The statement agrees with [LusztigQAnalog] §11, cited by [MV] Lemma 7.1, which is a cross-check, not the proof used. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-10; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Constructible.perverseSheaves", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Hecke.affineGrassmannian", "GLCinLean.Hecke.affineGrassmannian_reducedComponents", "GLCinLean.Hecke.iwahoriWeylGroup", "GLCinLean.Hecke.bottSamelsonPushforward_parity", "GLCinLean.Constructible.decompositionTheorem"]
source = "[JuteauMautnerWilliamson] Theorem 4.6, Remark 2.17; [LusztigQAnalog] §11 (statement, cited by [MV] Lemma 7.1)"

[[node]]
id = "GLCinLean.Satake.icStalkParity"
kind = "theorem"
desc = "Over every algebraically closed k of characteristic zero, for strata Gr^μ in the closure of Gr^λ (so Gr^μ and Gr^λ lie in one connected component and d_μ ≡ d_λ mod 2), the *-restriction of the D-module IC_λ to Gr^μ has cohomology, in the D-module t-structure on the smooth stratum, only in even degrees. Under the de Rham functor the D-module degree i corresponds to the constructible degree i − d_μ, so this is the constructible statement of Satake.icStalkParity_complex (degrees ≡ d_λ mod 2) shifted by d_μ. The !-restriction statement follows by Verdier self-duality of IC_λ. Deduce the *-statement from Satake.icStalkParity_complex: G and its Schubert geometry are base changes of their split models over Q̄, restriction to strata commutes with scalar extension (DModules.holonomicHom_fieldBaseChange), and over C DModules.schubertRiemannHilbert carries *-restriction to strata to the constructible one. Only Q̄ ⊂ k and Q̄ ⊂ C are used. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Satake.icStalkParity_complex", "GLCinLean.DModules.holonomicHom_fieldBaseChange", "GLCinLean.DModules.schubertRiemannHilbert", "GLCinLean.DModules.intermediateExtension", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Groups.basedRootDatum", "GLCinLean.DModules.verdierDuality"]
source = "[LusztigQAnalog] §11; [ConradRGS] Theorems 6.1.16–6.1.17 (split model over Q̄); explicit adaptation obligation for the transfer to D-modules over k"
