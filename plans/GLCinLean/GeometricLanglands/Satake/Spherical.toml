[[node]]
id = "GLCinLean.Satake.sphericalHeart_semisimple"
kind = "theorem"
desc = "The spherical heart over k is semisimple: its simple objects are the IC_λ for dominant coweights λ, and Ext^1(IC_λ, IC_μ) = 0 for all λ and μ, including λ = μ. (1) Forgetting L+G-equivariance is fully faithful on perverse objects because the group is connected, and the heart is a full subcategory of holonomic D-modules on a finite Schubert union containing both supports; so its Ext^1 injects into Hom(IC_λ, IC_μ[1]) in the bounded holonomic derived category. (2) The simple objects are the IC_λ: the stabilizers are connected, so the only irreducible equivariant local systems on the orbits are trivial. (3) Repeat the argument of [MV] Lemma 7.1 in D-modules over k: by Satake.icStalkParity the restrictions of IC_λ and IC_μ to every stratum have opposite or equal parity as needed, the strata of one component have dimensions of one parity, and the de Rham cohomology of each stratum is even because it is an affine bundle over a partial flag variety paved by affine spaces; the stratum-by-stratum spectral sequence gives Hom(IC_λ, IC_μ[1]) = 0. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Satake.sphericalHeart", "GLCinLean.Satake.icStalkParity", "GLCinLean.DModules.intermediateExtension", "GLCinLean.DModules.deRhamPushforward", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Hecke.affineGrassmannian"]
source = "[MV] Lemma 7.1 and Proposition 2.1; [LusztigQAnalog] §11 (through Satake.icStalkParity)"

[[node]]
id = "GLCinLean.Satake.icStalkParity_complex"
kind = "theorem"
desc = "Over C, in the Schubert-constructible derived category of a finite Schubert union, the *-restriction and the !-restriction of IC_λ to each stratum Gr^μ in the closure of Gr^λ have cohomology only in degrees congruent to dim Gr^λ modulo 2. Provider: Missing; implement here. This is a very large input: the source proves it through Kazhdan–Lusztig polynomials of the affine Weyl group and purity (Weil-conjecture weights), so implementing it needs either ℓ-adic purity with the comparison to complex coefficients, or the decomposition theorem. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Constructible.perverseSheaves", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Hecke.affineGrassmannian"]
source = "[LusztigQAnalog] §11 (cited by [MV] Lemma 7.1 and by [ParabolicEisensteinFH] §A.2)"

[[node]]
id = "GLCinLean.Satake.icStalkParity"
kind = "theorem"
desc = "Over every algebraically closed k of characteristic zero, the *-restriction and the !-restriction of the D-module IC_λ to each Schubert stratum Gr^μ in the closure of Gr^λ are lisse with cohomology only in degrees congruent to dim Gr^λ modulo 2. Deduce it from Satake.icStalkParity_complex: G and its Schubert geometry are base changes of their split models over Q̄, restriction to strata commutes with scalar extension (DModules.holonomicHom_fieldBaseChange), and over C DModules.schubertRiemannHilbert carries *- and !-restriction to strata to the constructible ones. Only Q̄ ⊂ k and Q̄ ⊂ C are used. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Satake.icStalkParity_complex", "GLCinLean.DModules.holonomicHom_fieldBaseChange", "GLCinLean.DModules.schubertRiemannHilbert", "GLCinLean.DModules.intermediateExtension", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Groups.basedRootDatum"]
source = "[LusztigQAnalog] §11; [ConradRGS] Theorems 6.1.16–6.1.17 (split model over Q̄); explicit adaptation obligation for the transfer to D-modules over k"
