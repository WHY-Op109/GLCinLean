[[node]]
id = 'GLCinLean.Satake.sphericalHeart_semisimple'
kind = 'theorem'
desc = 'The spherical heart over k is semisimple: its simple objects are the IC_λ for dominant coweights λ, and Ext^1(IC_λ, IC_μ) = 0 for all λ and μ, including λ = μ. (0) Every object has finite length, because holonomic D-modules do. (1) Forgetting L+G-equivariance is fully faithful on perverse objects because the group is connected, and the heart is a full subcategory of holonomic D-modules on a finite Schubert union containing both supports; so its Ext^1 injects into Hom(IC_λ, IC_μ[1]) in the bounded holonomic derived category. (2) The simple objects are the IC_λ: the stabilizers are connected, so the only irreducible equivariant local systems on the orbits are trivial. (3) Repeat the argument of [MV] Lemma 7.1 in D-modules over k. If λ and μ lie in different components the Hom vanishes for support reasons. Otherwise filter by strata: on each stratum Gr^ν the *-restriction of IC_λ and the !-restriction of IC_μ are L+G-equivariant, hence constant (the stabilizers are connected), with cohomology in even degrees by Satake.ic_starRestriction_isEven; the de Rham cohomology of Gr^ν is even by AffineGrassmannian.deRhamCohomology_schubertStratum_eq_zero_of_odd. So every stratum contributes to Hom(IC_λ, IC_μ[n]) only for even n, and the spectral sequence gives Hom(IC_λ, IC_μ[1]) = 0. Provider: here.'
deps = ['GLCinLean.Satake.sphericalHeart', 'GLCinLean.Satake.ic_starRestriction_isEven', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.AffineGrassmannian', 'GLCinLean.AffineGrassmannian.deRhamCohomology_schubertStratum_eq_zero_of_odd', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.EquivariantIndscheme']
source = '[MV] Lemma 7.1 and Proposition 2.1 (the argument from parity, repeated in D-modules over k)'

[[node]]
id = 'GLCinLean.Satake.icSheaf_restriction_isParity'
kind = 'theorem'
desc = 'Over C, in the Schubert-constructible derived category of a finite Schubert union, the *-restriction and the !-restriction of IC_λ to each L+G-orbit Gr^μ in the closure of Gr^λ have cohomology only in degrees congruent to dim Gr^λ modulo 2. Proof. (1) The closure of Gr^λ is an I-Schubert variety. By AffineGrassmannian.iwahoriStratification a length-zero element carries it, with its I-orbit stratification, isomorphically to an I-Schubert variety in the neutral component, and by AffineGrassmannian.reducedNeutralComponent_iso_simplyConnectedCover the reduced neutral component is that of the simply connected cover. Length-zero elements do not preserve L+G-orbits, so the argument works with I-orbits until step (4). (2) By AffineGrassmannian.isEven_bottSamelsonPushforward, the pushforward along the Bott–Samelson resolution of the translated variety, for a representative w of minimal length in w·W_f so that the map to Gr_G is birational, is an even complex for the I-orbits. (3) By Constructible.exists_iso_directSum_ic_properPushforward this pushforward is a direct sum of shifted IC sheaves; the map is birational, so the IC sheaf of the translated variety occurs exactly once and unshifted; a direct summand of a parity complex is parity. Translating back, the *- and !-restrictions of IC_λ to each I-orbit have cohomology in degrees ≡ dim Gr^λ. (4) IC_λ is L+G-equivariant, so its restriction to each L+G-orbit Gr^μ is constant; Gr^μ contains I-orbits, so the parity along I-orbits gives the parity along Gr^μ. The !-statement also follows by Verdier self-duality. [LusztigQAnalog] §11, cited by [MV] Lemma 7.1, states the same parity and is only a cross-check. Provider: here.'
deps = ['GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.AffineGrassmannian', 'GLCinLean.AffineGrassmannian.reducedNeutralComponent_iso_simplyConnectedCover', 'GLCinLean.AffineGrassmannian.iwahoriStratification', 'GLCinLean.AffineGrassmannian.isEven_bottSamelsonPushforward', 'GLCinLean.Constructible.exists_iso_directSum_ic_properPushforward']
source = '[JuteauMautnerWilliamson] Proposition 4.11; [BBD] Théorème 6.2.5; [MV] §2; [LusztigQAnalog] §11 (cross-check)'

[[node]]
id = 'GLCinLean.Satake.ic_starRestriction_isEven'
kind = 'theorem'
desc = 'Over every algebraically closed k of characteristic zero, for strata Gr^μ in the closure of Gr^λ (so Gr^μ and Gr^λ lie in one connected component and d_μ ≡ d_λ mod 2), the *-restriction of the D-module IC_λ to Gr^μ has cohomology, in the D-module t-structure on the smooth stratum, only in even degrees. Under the de Rham functor the D-module degree i corresponds to the constructible degree i − d_μ, so this is the constructible statement of Satake.icSheaf_restriction_isParity (degrees ≡ d_λ mod 2) shifted by d_μ. The !-restriction statement follows by Verdier self-duality of IC_λ. Deduce the *-statement from Satake.icSheaf_restriction_isParity: G and its Schubert geometry are base changes of their split models over Q̄, restriction to strata commutes with scalar extension (DModules.scalarExtension, with Hom by DModules.scalarExtension_homTensor_isIso), and over C DModules.analyticDeRham_isEquivalence carries *-restriction to strata to the constructible one. Only Q̄ ⊂ k and Q̄ ⊂ C are used. Provider: here.'
deps = ['GLCinLean.Satake.icSheaf_restriction_isParity', 'GLCinLean.DModules.scalarExtension_homTensor_isIso', 'GLCinLean.DModules.analyticDeRham_isEquivalence', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.Groups.basedRootDatum', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.scalarExtension']
source = 'Satake.icSheaf_restriction_isParity (complex parity); [ConradRGS] Theorems 6.1.16–6.1.17 (split model over Q̄); explicit adaptation obligation for the transfer to D-modules over k'
