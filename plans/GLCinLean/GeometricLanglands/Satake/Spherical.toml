[[node]]
id = "GLCinLean.Satake.sphericalHeart_semisimple"
kind = "theorem"
desc = "The spherical heart over k is semisimple: its simple objects are the IC_λ for dominant coweights λ, and Ext^1(IC_λ, IC_μ) = 0 for all λ and μ, including λ = μ. Proof by field comparison, not quoted for D-modules. (1) The pinned split G is the base change of a split group over Q̄ with the same based root datum, so Gr_G, the Schubert stratification, each finite Schubert union and each IC_λ are base changes of their Q̄-models; intermediate extension commutes with scalar extension. (2) The heart is a full subcategory of holonomic D-modules on a finite Schubert union containing both supports, so its Ext^1 injects into Hom(IC_λ, IC_μ[1]) in the bounded holonomic derived category. (3) By DModules.holonomicHom_fieldBaseChange this Hom is the base change of the Q̄-Hom, which also base changes to C. (4) Over C, DModules.schubertRiemannHilbert identifies it with Hom(IC_λ, IC_μ[1]) in the Schubert-constructible derived category, which vanishes by the proof of [MV] Lemma 7.1: parity vanishing of IC stalks [LusztigQAnalog] §11 and simple connectedness of the orbits. Only Q̄ ⊂ k and Q̄ ⊂ C are used; k is never embedded in C. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.Satake.sphericalHeart", "GLCinLean.DModules.holonomicHom_fieldBaseChange", "GLCinLean.DModules.schubertRiemannHilbert", "GLCinLean.DModules.intermediateExtension", "GLCinLean.Hecke.schubertStratification", "GLCinLean.Hecke.affineGrassmannian", "GLCinLean.Groups.basedRootDatum", "GLCinLean.Groups.langlandsDual"]
source = "[MV] Lemma 7.1 and Proposition 2.1; [LusztigQAnalog] §11 (cited by [MV] Lemma 7.1); [HottaTakeuchiTanisaki] Chapters 7–8; [ConradRGS] Theorems 6.1.16–6.1.17 (split model over Q̄)"
