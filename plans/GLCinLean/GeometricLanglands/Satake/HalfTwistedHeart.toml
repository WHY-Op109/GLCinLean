desc = 'The heart of the half-twisted spherical category at a point, compared with the untwisted spherical heart.'

[[node]]
id = 'GLCinLean.Satake.halfTwistedHeart_equiv_untwistedHeart'
kind = 'definition'
desc = 'At a single point x of X, the square root of ω_X given by the theta characteristic trivializes det^{1/2} on Gr_{G,x} multiplicatively and L+G-equivariantly. The convolution of the half-twisted heart at x is defined here, from the multiplicative structure of the gerbe at x and the convolution diagram of Satake.convolution; the convolution of the DG categories over X^I is Satake.factorizationConvolution in the plan of the proof. This gives a monoidal equivalence between the heart of the half-twisted spherical category at x and Satake.sphericalHeart, compatible with convolution, IC objects and the cohomology fiber functor. Prove that it carries the fusion commutativity constraint of the half-twisted heart (computed from its factorization structure over X^2) to the parity-corrected constraint of Satake.fusion, using that the trivialization is only a Z/2-graded factorization line bundle with grading ⟨λ, 2ρ̌⟩ mod 2 ([GLC2] Remark 1.1.4). This sign computation is an explicit adaptation obligation: the sources state its consequence ([GLys] §9.2.2) but do not write it out. The result is pointwise. It claims nothing over Ran, where the identification induced by ω_X^{1/2} is incompatible with factorization ([GLC2] Remark 1.1.12). Provider: here.'
deps = ['GLCinLean.Satake.criticalDeterminantGerbe', 'GLCinLean.Satake.sphericalHeart', 'GLCinLean.Satake.convolution', 'GLCinLean.Satake.factorizationSphericalCategory', 'GLCinLean.Satake.fusion', 'GLCinLean.Satake.cohomologyFiberFunctor', 'GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.Groups.coweightParity', 'GLCinLean.DModules.TwistedCrystals']
source = '[GLC2] Remarks 1.1.4, 1.1.7 and 1.1.12; [GLys] §§8.2.4, 9.1.1, 9.2.2; [MV] §6 (modified commutativity constraint)'
