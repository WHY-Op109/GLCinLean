[[node]]
id = "GLCinLean.Satake.geometricSatakeHeartEquivalence"
kind = "definition"
desc = "Construct the tensor equivalence between finite-dimensional representations of the specified Langlands dual and the untwisted spherical perverse D-module heart at a point, with the parity-corrected commutativity constraint of Satake.fusion. Redo the weight, projective and fusion constructions in algebraic D-modules over every algebraically closed k of characteristic zero; MV works topologically over C, and its §14 gives only an étale variant. The only comparison with complex topology is the parity of IC stalks (Satake.icStalkParity), made through Q̄ without embedding k into C; semisimplicity (Satake.sphericalHeart_semisimple) is then proved in D-modules over k. The half-twisted heart used for factorization is reached through Satake.halfTwistedHeart_equiv_untwistedHeart. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Satake.tannakaGroup", "GLCinLean.Satake.dualIdentification", "GLCinLean.Hecke.representationCategory", "GLCinLean.Satake.sphericalHeart_semisimple"]
source = "[MV] Theorems 7.3, 12.1 and §14; [GLys] §§8, 9.2.1; [RaskinCPSI] §§6.28–6.33"
