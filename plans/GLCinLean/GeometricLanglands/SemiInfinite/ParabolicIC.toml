desc = "Hecke and Drinfeld–Plucker construction of the parabolic semi-infinite IC kernel. The cited FH construction starts with simply connected derived group; the separate central-extension descent supplies general groups."

[[node]]
id = "GLCinLean.SemiInfinite.parabolicHeckeStructures"
kind = "definition"
desc = "For a Rep(dualM×dualG) Ran module category, construct the Hecke, Drinfeld–Plucker and enhanced Drinfeld–Plucker categories from functions on dualG, the affinization of N_dualP\\dualG, and the open quotient itself. Supply extension/restriction of scalars and their adjunctions. Prove the equivalence of enhanced structures with the unipotent Chevalley-module description; for dualizable Rep(dualM)-modules prove the comodule/module Koszul comparison by the bar resolution, dualizable base change and comonadicity. Retain coherent factorization and unit structures. Provider: Missing; implement here over the Tau Ceti enhanced module/category roadmap interfaces. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
