[[node]]
id = "GLCinLean.SemiInfinite.parabolicIC_colimitDescription"
kind = "theorem"
desc = "For a connected reductive G with simply connected derived group, prove [ParabolicEisensteinFH] Lemma A.1.5.1: induction from Drinfeld–Plücker objects to Hecke objects, followed by forgetting, is the colimit over Λ_M^+ of e^{-λ} ⋆ c ⋆ V^λ. The source proves its appendix under the stronger assumption that G is semisimple and simply connected (§A.1.3). Replace that assumption by the two properties the proof uses. (a) Λ_M^+ (dominant coweights orthogonal to the simple roots of M) is a commutative submonoid of the coweight lattice, so λ1, λ2 ≤ λ1 + λ2 and the order is filtered. It is a preorder, not a poset, when G has a central torus, since then λ and −λ can both lie in Λ_M^+; a filtered preorder suffices for the colimit. (b) For every finite set of M-dominant ν there is λ in Λ_M^+ with λ + ν dominant and ⟨α, λ⟩ ≥ N for every root α of N_P: take a positive multiple of the sum of the fundamental coweights of G_ad for the simple roots outside M; a multiple lies in the coroot lattice, hence in the coweight lattice of T. Then prove Lemma A.1.5.2, correcting its proof: the restriction of V to P̌ is not semisimple, so use its filtration with M̌-semisimple graded pieces, vanishing of higher coinduction from P̌ to Ǧ for the dominant weights λ + ν (Borel–Weil vanishing in characteristic zero, an explicit obligation), and semisimplicity of Rep(Ǧ); the resulting decomposition is not canonical but suffices for the dimension count in Lemma A.1.5.1. Then prove Lemmas A.1.7.2 and A.1.8.1 for this G; the lift of θ in Λ_{G,P} = π1(M) in A.1.8.1 is where the simply connected derived group is used. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.SemiInfinite.parabolicHeckeStructures", "GLCinLean.SpectralProof.parabolicLevi", "GLCinLean.Groups.basedRootDatum", "GLCinLean.Hecke.representationCategory", "GLCinLean.Hecke.affineGrassmannian"]
source = "[ParabolicEisensteinFH] Appendix A, §§A.1.3–A.1.8 (Lemmas A.1.5.1, A.1.5.2, A.1.7.2, A.1.8.1) and §2.3.1"

[[node]]
id = "GLCinLean.SemiInfinite.parabolicIC_halfTwistedTransfer"
kind = "theorem"
desc = "Transfer the results of [ParabolicEisensteinFH] used by the plan from its setting, untwisted D-modules on Gr_G with plain Rep(Ǧ)_Ran (§1.1), to the half-twisted semi-infinite category of [GLC3] §1.3. On L(N_P)·L+(M)-equivariant objects use the canonical multiplicative trivializations of det^{1/2}_{Gr_G} on L(N) and on L+(G) ([GLC2] §1.1.14), and on the Levi side the comparison of determinant gerbes with the shift by ⟨λ, 2ρ_P⟩ ([GLC3] §§1.3, 8.1.1–8.1.4). Prove that the parabolic IC kernel, its Hecke and Drinfeld–Plücker structures and the Jacquet comparison of SemiInfinite.whittakerJacquet_matches_unipotentInvariants correspond, and that the Satake actions match those of the half-twisted naive functor. This is an explicit adaptation obligation; no source states the transfer. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.SemiInfinite.parabolicIC", "GLCinLean.SemiInfinite.whittakerJacquet_matches_unipotentInvariants", "GLCinLean.Satake.criticalDeterminantGerbe", "GLCinLean.Satake.naiveFactorizationFunctor", "GLCinLean.SpectralProof.parabolicBundleCorrespondence"]
source = "[ParabolicEisensteinFH] §1.1; [GLC2] §1.1.14; [GLC3] §§1.3, 8.1.1–8.1.4"
