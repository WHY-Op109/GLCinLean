source = "[ParabolicEisensteinFH] §§4.3–4.4, Lemma 4.4.8.1 and Appendices A–B; §2.3.1 (group hypothesis)"

[[node]]
id = "GLCinLean.SemiInfinite.parabolicIC_koszulBoundary"
kind = "theorem"
desc = "Prove that O(N_dualP)-invariants of the parabolic IC kernel equal the shriek extension of the dualizing sheaf from the zero semi-infinite stratum, with its Chevalley-algebra module and enhanced Drinfeld–Plucker structure. Compute all parabolic stratum restrictions via the bar presentation and the spherical constant-term calculation; the zero stratum gives the unit and the nonzero restrictions vanish. Use hyperbolic localization to make restriction commute with diagonal !-base change, then retain the full factorization comparison. This is a theorem about the specific shriek kernel, not existence of arbitrary ind-unipotent averaging. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.SemiInfinite.parabolicIC", "GLCinLean.SemiInfinite.parabolicInduction_factorization", "GLCinLean.DModules.hyperbolicRestriction_isIso", "GLCinLean.DModules.holonomicShriek", "GLCinLean.Infinity.limits"]
source = "[ParabolicEisensteinFH] Proposition 4.5.4.1 and its proof §§4.5.4–4.5.7; Proposition 4.4.9.1"
