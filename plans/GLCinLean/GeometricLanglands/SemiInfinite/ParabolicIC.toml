[[node]]
id = "GLCinLean.SemiInfinite.parabolicIC"
kind = "definition"
desc = "For simply-connected G_der construct the normalized parabolic semi-infinite kernel by inducing the delta sheaf's actual Drinfeld–Plucker structure to a Hecke structure. Construct that delta structure from extremal-weight maps and prove its Plucker identities. Prove the colimit description, N_P-loop invariance, support on the zero-orbit closure and the shift by the Levi component paired with 2(rho_G-rho_M). Keep the O(N_dualP) coaction. These are constructions on the geometric Grassmannian independent of derived semi-infinite Satake or the global Langlands functor. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
