id = "GLCinLean.SemiInfinite.parabolicStratification"
kind = "definition"
desc = "For each finite nonempty configuration I, construct Gr_P→Gr_G and Gr_P→Gr_M, the strata indexed by Levi component degree, the closed degree-bounded unions and open complementary bounds. Prove that reduced strata are locally closed, bounded intervals have finitely many strata, the closed unions exhaust up to nil-isomorphism and the open unions exhaust Gr_G. Identify Gr_P, Gr_Pminus and Gr_M with attractor, repeller and fixed locus of a central Levi cocharacter positive on N_P. Prove that LU-invariants on each stratum are equivalent to D-modules on the corresponding Gr_M component by ind-prounipotent transitivity. First use simply connected G_der as in Chen; apply the separate z-extension descent for general G. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
