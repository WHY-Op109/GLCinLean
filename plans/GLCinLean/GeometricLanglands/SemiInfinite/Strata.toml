[[node]]
id = "GLCinLean.SemiInfinite.parabolicInvariants_monodromic"
kind = "theorem"
desc = "Prove that all LU-invariant D-modules on Gr_G over X^I are monodromic for the chosen central Levi cocharacter. Reduce by !-limits of closed degree bounds and filtered open bounds to finite intervals, then by excision to one stratum where the Gr_M equivalence gives equivariance. Retain arbitrary enhanced tensor parameters. Do not assert monodromicity for every ambient D-module. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
