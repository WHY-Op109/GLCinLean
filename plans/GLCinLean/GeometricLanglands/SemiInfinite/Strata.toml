[[node]]
id = "GLCinLean.SemiInfinite.parabolicStratumAdjunctions"
kind = "definition"
desc = "Construct left adjoints to stratum *-pushforward and !-restriction within LU-invariant categories over every X^I. Obtain the first from the parameterized Braden formula; obtain the second on finite intervals by excision, then on the full Grassmannian by left-adjointable limits. Identify induction of a Gr_M object with the partially defined averaging Av_! applied to its closed pushforward s_*; prove this particular average exists and is strictly Dmod(X^I)-linear. Supply units/counits and coherent diagonal/disjoint comparisons. This constructs invariant-category adjoints; ambient shriek for the dualizing zero-orbit vacuum is a separate theorem. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.SemiInfinite.parabolicInvariants_monodromic", "GLCinLean.DModules.parameterizedHyperbolicAdjunction", "GLCinLean.Infinity.adjointableDiagram_limitAdjunction"]
source = "[ChenNearbyCycles] Lemma 2.3.4(2)–(4), Lemma D.2.1 and §§D.2.5–D.2.6; §3.4.1; [DhillonLysenkoRan] Corollary 2.7.9 and §2.7.10; [GaRanII] Remark 1.5.4"

[[node]]
id = "GLCinLean.SemiInfinite.parabolicInvariants_compactlyGenerated"
kind = "theorem"
desc = "Prove compact generation of LU-invariant D-modules on the whole Gr_G over each X^I. The stratum-restriction right adjoint is continuous and conservative by the full parabolic stratification, so its left adjoint sends compact generators from Dmod(Gr_M) to compact generators. Equivalently use the explicit Av_! s_* generators in Chen. Include tensor-parameter compatibility and the geometric diagonal/disjoint comparisons needed before L+M-renormalization, without inferring compact generation merely from an arbitrary limit of compactly generated categories. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
