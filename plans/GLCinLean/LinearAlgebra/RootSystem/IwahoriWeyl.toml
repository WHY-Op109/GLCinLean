desc = 'The Coxeter structure, length and Bruhat order of the Iwahori–Weyl group of a root datum.'

[[node]]
id = 'GLCinLean.Groups.iwahoriWeylLength'
kind = 'definition'
desc = '''For a reduced root datum with cocharacter lattice N, coroot lattice Q∨ and Weyl group W: the Iwahori–Weyl group W̃ = N ⋊ W is `RootPairing.extendedAffineWeylGroup` over ℤ, where `RootPairing.coweightLattice` is all of N, so the central torus is kept; the affine Weyl group W_aff = Q∨ ⋊ W is `RootPairing.affineWeylGroup`, normal in W̃ with W̃/W_aff ≃ N/Q∨ = π₁(G) (`RootPairing.extendedAffineWeylGroupQuotientEquiv`). Construct the Coxeter system of W_aff generated by the affine simple reflections, one family for each irreducible factor and the trivial group when there are no roots; its length (`CoxeterSystem.length`) and Bruhat order; the length-zero subgroup Ω of W̃, the stabilizer of the fundamental alcove after extending scalars to ℝ, with W̃ = W_aff ⋊ Ω and Ω ≅ N/Q∨; and the length ℓ(wω) = ℓ(w) and the Bruhat order on W̃. Tau Ceti's `fundamentalAlcoveStabilizer` assumes a nonempty irreducible root system over an ordered field and does not prove that its map to N/Q∨ is injective, so the reducible and torus cases and the isomorphism Ω ≅ N/Q∨ are obligations here. Provider: here. Upstream declarations used: `RootPairing.affineWeylGroup` (`TauCeti.LinearAlgebra.RootSystem.Weyl.Affine.Basic`), `RootPairing.extendedAffineWeylGroup` and `RootPairing.extendedAffineWeylGroupQuotientEquiv` (`TauCeti.LinearAlgebra.RootSystem.Weyl.ExtendedAffine.Basic`), `RootPairing.fundamentalAlcoveStabilizer` (`TauCeti.LinearAlgebra.RootSystem.Weyl.ExtendedAffine.Alcove`), `RootPairing.coweightLattice` (`TauCeti.LinearAlgebra.RootSystem.CoweightLattice`), `CoxeterSystem.length` (`Mathlib.GroupTheory.Coxeter.Length`).'''
deps = ['GLCinLean.Groups.basedRootDatum']
source = '[PappasRapoport] §8 (Iwahori–Weyl group); [MV] §2'
