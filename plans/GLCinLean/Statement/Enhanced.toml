source = '[AGKRRV] §0.9.4; [GLC1] Conj. 1.6.7'

[[node]]
id = 'GLCinLean.Statement.DGFun.MapsEquiv'
desc = 'PLACEHOLDER. Equivalences `Maps_C(H b, c) ≃ Maps_D(J b, T c)` of mapping spaces ([AGKRRV] §0.9.2), natural in `b` and `c` together: the natural equivalences between the two functors `Bᵒᵖ × C → Spc` that the two sides define. When `J` is the identity functor, these are the adjunctions with left adjoint `H` and right adjoint `T`. No existence of such an equivalence is asserted. Provider: here. Replacement contract: one equivalence of mapping-space bifunctors with coherent naturality in both variables, not a family of equivalences chosen object by object; with an example that for `J` the identity it is the mapping-space adjunction equivalence of Infinity.rightAdjoint.'
deps = ['GLCinLean.Statement.DGFun', 'GLCinLean.Statement.DGFun.obj', 'GLCinLean.Infinity.mappingSpaces', 'GLCinLean.Infinity.rightAdjoint']
source = '[AGKRRV] §0.9.2; [GLC1] §§1.2.2, 1.4.5'

