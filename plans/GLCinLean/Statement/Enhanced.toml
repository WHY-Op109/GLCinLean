desc = 'PLACEHOLDER. Natural equivalences between continuous functors: the equivalences in the category of 1-morphisms of `DGCat` ([AGKRRV] §0.9.4; [GLC1] Conj. 1.6.7). No existence of such an equivalence is asserted. Provider: here.'
