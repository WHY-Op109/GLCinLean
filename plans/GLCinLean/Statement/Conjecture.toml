source = '[GLC1] §0.1.1'

[[node]]
id = 'GLCinLean.Statement.Setting'
desc = 'PLACEHOLDER. Standing geometric data for [GLC1] §§1.1–1.3: a smooth proper connected curve, a pinned reductive group, a theta characteristic and an identified Langlands dual group. The theta characteristic is a line bundle together with its squaring isomorphism. Provider: here. Upstream declarations used: `Field` (`Mathlib.Algebra.Field.Defs`), `CharZero` (`Mathlib.Algebra.CharZero.Defs`), `IsAlgClosed` (`Mathlib.FieldTheory.IsAlgClosed.Basic`), `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `AlgebraicGeometry.Spec` (`Mathlib.AlgebraicGeometry.Scheme`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`), `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`), `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`), `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`).'
deps = ['GLCinLean.Statement.RootDatumDuality', 'GLCinLean.Curves.thetaCharacteristic']
source = '[GLC1] §§1.1–1.3; [AGKRRV] §§0.9.1, 14.1.1; [GLC2] §0.4.1'

