
[[node]]
id = 'GLCinLean.Statement.RootDatumDuality'
desc = 'PLACEHOLDER. Identification of the root datum of `Gd` with the dual root datum of `G` ([GLC1] §0.1.1). Both groups are represented by their coordinate Hopf algebras. Provider: here. Replacement contract: change its signature to take the input and dual pinnings and use Groups.dualityData. Setting will carry dualRank and dualPinning, and dualIdentification will use both pinnings. The planned changePinning theorem and explicit examples must justify that these added choices do not restrict the mathematical statement. Upstream declarations used: `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
