[[node]]
id = 'GLCinLean.Statement.IsLanglandsFunctor'
desc = 'PLACEHOLDER. The two characterizing properties of [GLC1] Cor. 1.6.5, for a continuous functor `F` from `Dmod_½(Bun_G)` to `IndCoh_Nilp(LS_Ǧ)`: `F` sends compact objects to bounded-below objects, with a bound that may depend on the object; and there is an equivalence `Maps(V ⋆ Poinc, M) ≃ Maps(Loc V, Ψ (F M))` of mapping spaces, natural in `V` and `M` together. The second property is the `Ψ ∘ F ≃ 𝕃_{G,coarse}` of the paper in an equivalent form for the underlying functors of ∞-categories; the two forms agree by [GLC1] Thm. 1.2.4 (Langlands.isLanglandsFunctor_iff_comp_psi_iso_coarse). Mapping spaces do not record `k`-linearity: a `k`-linear equivalence `Ψ ∘ F ≃ 𝕃_{G,coarse}` gives the second property, which gives back an equivalence of functors of ∞-categories; each functor with the two properties is naturally equivalent to `𝕃_G` as a functor of ∞-categories. Provider: here. Keep this formula as its category and functor placeholders are replaced.'
deps = ['GLCinLean.Statement.DmodHalf', 'GLCinLean.Statement.IndCohNilp', 'GLCinLean.Statement.Psi', 'GLCinLean.Statement.Loc', 'GLCinLean.Statement.heckeActionRight', 'GLCinLean.Statement.vacuumPoincare', 'GLCinLean.Statement.DGFun.obj', 'GLCinLean.Statement.DGFun.comp', 'GLCinLean.Statement.DGFun.MapsEquiv', 'GLCinLean.Statement.DGCat.IsCompact', 'GLCinLean.Statement.TStructuredDGCat.IsEventuallyCoconnective']
source = '[GLC1] Corollary 1.6.5, Theorem 1.2.4 and §§1.2.1–1.2.2'

