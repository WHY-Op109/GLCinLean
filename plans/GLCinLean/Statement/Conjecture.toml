[[node]]
id = 'GLCinLean.Statement.exists_isLanglandsFunctor_and_forall_isLanglandsFunctor_imp_isEquivalence'
desc = 'Main theorem: sole admitted proof. The de Rham geometric Langlands conjecture, in its characterized-functor form: a continuous functor with the two properties of [GLC1] Cor. 1.6.5 exists, and every such functor is an equivalence ([GLC1] Conj. 1.6.7). The second property is stated with the Hecke action, in an equivalent form for the underlying functors of ∞-categories. Provider: here.'
deps = ['GLCinLean.Statement.IsLanglandsFunctor', 'GLCinLean.Statement.DGFun.IsEquivalence']
source = '[GLC1] Corollary 1.6.5 and Conjecture 1.6.7'
