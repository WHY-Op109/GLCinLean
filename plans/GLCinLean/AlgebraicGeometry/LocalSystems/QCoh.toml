desc = "QCoh(LS_H) is compactly generated and rigid: identify it with zero-support IndCoh, apply the global complete-intersection support-generation theorem, and prove its compacts are perfect hence tensor-dualizable by QCA finiteness. Do not infer compact generation from the QCA hypothesis alone or merely cite the rigidity assertion in GLC1. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
