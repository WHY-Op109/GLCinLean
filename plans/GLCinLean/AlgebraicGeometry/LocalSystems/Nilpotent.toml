[[node]]
id = 'GLCinLean.LocalSystems.nilpotentCone_closed_conical'
kind = 'theorem'
desc = 'Nilpotence can be checked at one point of the connected curve, and the global nilpotent cone is a conical Zariski-closed subset of Sing(LS_H). Statement: let S be a classical affine scheme (reduced or not), (P, ∇, A) an S-point of Sing(LS_H), p an invariant polynomial function on 𝔥*, and x a k-point of X. Then p(A) is the pullback to S × X of its restriction to S × {x}. This is an equality in 𝒪(S × X); the restriction is a function on S and need not be constant. Proof: p(A) is horizontal along X, because A is horizontal and p is invariant; and a function on S × X that is horizontal along the smooth connected curve X over the field k of characteristic zero is the pullback of a function on S. This is the proof of the source, with the functions p, which are the coordinates of the Chevalley map ϖ, in place of ϖ. Consequences: (a) p(A) vanishes at every point of S × X exactly when its restriction vanishes at every point of S, and p(A) = 0 exactly when its restriction is zero. So the S-point lies in the cone exactly when the value of A at x, a section of 𝔥*_{P_x} over S, maps S into the coadjoint nilpotent cone, for one point x and then for every point x; the same holds for the condition with equalities of `LocalSystems.nilpotentCone`. (b) The cone is the preimage of the closed subset Nilp(𝔥*)/H ×_{pt/H} LS_H under the map Sing(LS_H) → 𝔥*/H ×_{pt/H} LS_H that evaluates A at x, so it is Zariski-closed. (c) The cone is conical, because the ideal `TauCeti.coadjointNilpotentConeIdeal` is homogeneous: `TauCeti.coadjointNilpotentConeIdeal_isHomogeneous` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.CoadjointNilpotentCone`). Provider: here.'
deps = ['GLCinLean.LocalSystems.nilpotentCone']
source = '[ArinkinGaitsgory] Lemma 11.1.4'
