desc = 'The global nilpotent cone in Sing(LS_H).'

[[node]]
id = 'GLCinLean.LocalSystems.nilpotentCone'
kind = 'definition'
desc = 'Global nilpotent cone: a conical Zariski-closed subset of Sing(LS_H). This is the kind of object that [ArinkinGaitsgory] §11.1.1 defines and that `Sheaves.IndCohWithSupport` takes; it is not a closed substack with a chosen scheme structure. Its points: by `LocalSystems.singularities`, for a classical affine scheme S (reduced or not) an S-point of Sing(LS_H) is a triple (P, ∇, A), where A is a horizontal section of the coadjoint bundle 𝔥*_P over S × X. For an invariant polynomial function p on 𝔥*, the function p(A) on S × X is defined in a local trivialization of P and does not depend on the trivialization, because p is invariant. The S-point lies in the cone exactly when, for every invariant polynomial function p that vanishes at the origin, p(A) vanishes at every point of S × X. Equivalently: in every local trivialization of P, A maps S × X into the zero set of the ideal of the coadjoint nilpotent cone, `TauCeti.coadjointNilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.CoadjointNilpotentCone`); this does not depend on the trivialization, because the ideal is stable under the coaction. So the cone is the closed subset whose points with values in a field are the triples with nilpotent A. Reading of the source: it states the condition for an S-point in two ways, that A “hit the locus of nilpotent elements” (§11.1.1) and that ϖ(A) “factor through” {0} (§11.1.2). The first is the condition above. The second, read for schemes, is p(A) = 0 in 𝒪(S × X) for every such p; it is stronger only for nonreduced S, and it defines a closed substack with the same closed subset. `LocalSystems.nilpotentCone_closed_conical` proves the test at one point of the curve for both conditions. Use the ideal `TauCeti.coadjointNilpotentConeIdeal`, not an arbitrary support predicate. The invariant polynomial functions are used one by one; the coadjoint quotient 𝔥*//H and the coadjoint quotient map (`Groups.chevalleyMap`, in the plan of the proof) are not used. The ideal, in Tau Ceti. Let H be a commutative Hopf algebra over a commutative ring k whose cotangent space at the identity is finite and projective. Its Lie algebra 𝔥, the dual of the cotangent space, carries the adjoint comodule structure `Derivation.adjointComodule`. The polynomial functions on 𝔥* are Sym(𝔥), the invariant polynomial functions are the coinvariants Sym(𝔥)^H (`TauCeti.coadjointInvariantPolynomials`), and `TauCeti.coadjointNilpotentConeIdeal` is the ideal of Sym(𝔥) generated by the invariant polynomial functions that vanish at the origin. It is the ideal of the scheme-theoretic fibre of the coadjoint quotient map 𝔥* → Spec Sym(𝔥)^H over the image of the origin; this map is the Chevalley map ϖ of [ArinkinGaitsgory] §11.1.2. No invariant form on 𝔥 is used. Its module has these facts: an ideal contains it exactly when it contains every invariant polynomial function that vanishes at the origin (`coadjointNilpotentConeIdeal_le_iff`); it lies in the augmentation ideal, so the origin is on the cone (`coadjointNilpotentConeIdeal_le_ker_algebraMapInv`); it is homogeneous, so the cone is conical (`coadjointNilpotentConeIdeal_isHomogeneous`); the coaction maps it into the ideal that it generates in Sym(𝔥) ⊗ H, so the cone is stable under the group (`symmetricAlgebraCoact_mem_map_includeLeft_coadjointNilpotentConeIdeal`); the value of an invariant polynomial function at a point of 𝔥* with values in a k-algebra A does not change under the coadjoint action of an A-point of the group (`lift_liftBaseChange_endOfPoint_of_mem_coadjointInvariantPolynomials`); and, over a field, for every morphism of comodules 𝔥 → 𝔥* that has a section among the morphisms of comodules, in particular for every isomorphism of comodules (an invariant identification 𝔥 ≅ 𝔥*), the induced map Sym(𝔥) → Sym(𝔥*) maps the ideal onto `TauCeti.nilpotentConeIdeal`, the ideal of the adjoint nilpotent cone (`map_coadjointNilpotentConeIdeal`). Its checks, over a field k: for a commutative group, that is a cocommutative H, in particular for a torus and for the trivial group, the ideal is the augmentation ideal, and a point with values in any k-algebra is on the cone only if it is zero (`coadjointNilpotentConeIdeal_eq_ker_algebraMapInv_of_isCocomm`, `coadjointNilpotentConeIdeal_le_ker_lift_iff_of_isCocomm`); for 𝔾_m the point ε with values in k[ε]/(ε²) is not on the cone; for GL₂, where a matrix Y stands for the linear form X ↦ tr(YX), E₁₂ is a point of the cone, and it is not zero, because Y is recovered from its linear form (`TauCeti.GeneralLinear.map_lift_traceCovector_coadjointGenericMatrix`, in `TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Adjoint.Coadjoint.Basic`), diag(1, −1) is not, although the trace vanishes on it, the identity matrix, which is central and so ad-nilpotent, is not, and the point diag(ε, −ε) with values in k[ε]/(ε²) is. So the trace alone and ad-nilpotence alone give wrong cones. Differences of the ideal from the paper. Reformulation: [ArinkinGaitsgory] §11.1.1 uses only the Zariski-closed subset Nilp(𝔥*) of 𝔥*. It is the zero set of the ideal; the ideal carries more, since it need not be radical. This node and the support category `LocalSystems.IndCohNilpotent` use only the zero set. The ideal itself is used by the condition with equalities above and by the fibre of the coadjoint quotient map (`Groups.chevalleyMap`): for 𝔾_m the ideals (t) and (t²) have the same zero set and differ at the point t = ε. Reading: §11.1.1 defines Nilp(𝔥*) for a reductive group as the image of “the locus of nilpotent elements” of 𝔥 under an invariant identification 𝔥 ≅ 𝔥*. A nilpotent element of a reductive Lie algebra is read as an element of the derived ideal that is ad-nilpotent. With this reading the two descriptions of §§11.1.1 and 11.1.2 agree, by `map_coadjointNilpotentConeIdeal` and the Tau Ceti description of the k-points of the adjoint nilpotent cone of a reductive group over an algebraically closed field of characteristic zero, which are the ad-nilpotent elements of the derived ideal, and the cone of a torus is the origin, as [GLC1] §1.5.4 says; with ad-nilpotence alone the centre of 𝔥 would be on the cone. Generalization: the paper has a reductive group; the ideal is defined for every H as above. The statement uses this node for the dual group, which is split connected reductive over a field of characteristic zero. The existence of an invariant identification 𝔥 ≅ 𝔥* for such a group is the first item of §1.12 of roadmap LanglandsParameterStacks; no node of `plans/` uses it. Upstream declarations used: `TauCeti.coadjointNilpotentConeIdeal`, `TauCeti.coadjointInvariantPolynomials`, `TauCeti.coadjointNilpotentConeIdeal_le_iff`, `TauCeti.coadjointNilpotentConeIdeal_le_ker_algebraMapInv`, `TauCeti.coadjointNilpotentConeIdeal_isHomogeneous`, `TauCeti.symmetricAlgebraCoact_mem_map_includeLeft_coadjointNilpotentConeIdeal`, `TauCeti.lift_liftBaseChange_endOfPoint_of_mem_coadjointInvariantPolynomials`, `TauCeti.map_coadjointNilpotentConeIdeal`, `TauCeti.coadjointNilpotentConeIdeal_eq_ker_algebraMapInv_of_isCocomm` and `TauCeti.coadjointNilpotentConeIdeal_le_ker_lift_iff_of_isCocomm` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.CoadjointNilpotentCone`), `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.nilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`), `TauCeti.reductiveCommHopfAlgProperty.nilpotentConeIdeal_le_ker_lift_eval_iff_mem_derivedSeries_and_isNilpotent_ad` (`TauCeti.Algebra.AlgebraicGroup.Reductive.NilpotentCone`), `TauCeti.MultiplicativeGroup.not_coadjointNilpotentConeIdeal_le_ker_lift_smulRight_eps` (`TauCeti.Algebra.AlgebraicGroup.MultiplicativeGroup.CoadjointNilpotentCone`), `TauCeti.GeneralLinear.traceCovector` (`TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Adjoint.Coadjoint.Basic`), `TauCeti.GeneralLinear.coadjointNilpotentConeIdeal_le_ker_lift_traceCovector_single_zero_one`, `TauCeti.GeneralLinear.not_coadjointNilpotentConeIdeal_le_ker_lift_traceCovector_diagonal`, `TauCeti.GeneralLinear.not_coadjointNilpotentConeIdeal_le_ker_lift_traceCovector_one` and `TauCeti.GeneralLinear.coadjointNilpotentConeIdeal_le_ker_lift_traceCovector_diagonal_eps` (`TauCeti.Algebra.AlgebraicGroup.GeneralLinear.Adjoint.Coadjoint.NilpotentCone`). Provider: here.'
deps = ['GLCinLean.LocalSystems.singularities']
source = '[ArinkinGaitsgory] §§11.1.1–11.1.2'


