desc = 'The global nilpotent cone in Sing(LS_H).'

[[node]]
id = 'GLCinLean.LocalSystems.nilpotentCone'
kind = 'definition'
desc = 'Global nilpotent cone: a conical Zariski-closed subset of Sing(LS_H). This is the kind of object that [ArinkinGaitsgory] §11.1.1 defines and that `Sheaves.IndCohWithSupport` takes; it is not a closed substack with a chosen scheme structure. Its points: by `LocalSystems.singularities`, for a classical affine scheme S (reduced or not) an S-point of Sing(LS_H) is a triple (P, ∇, A), where A is a horizontal section of the coadjoint bundle 𝔥*_P over S × X. For an invariant polynomial function p on 𝔥*, the function p(A) on S × X is defined in a local trivialization of P and does not depend on the trivialization, because p is invariant. The S-point lies in the cone exactly when, for every invariant polynomial function p that vanishes at the origin, p(A) vanishes at every point of S × X. Equivalently: in every local trivialization of P, A maps S × X into the zero set of the ideal of `Groups.nilpotentCoadjointCone`; this does not depend on the trivialization, because the ideal is stable under the coaction. So the cone is the closed subset whose points with values in a field are the triples with nilpotent A. Reading of the source: it states the condition for an S-point in two ways, that A “hit the locus of nilpotent elements” (§11.1.1) and that ϖ(A) “factor through” {0} (§11.1.2). The first is the condition above. The second, read for schemes, is p(A) = 0 in 𝒪(S × X) for every such p; it is stronger only for nonreduced S, and it defines a closed substack with the same closed subset. `LocalSystems.nilpotentCone_closed_conical` proves the test at one point of the curve for both conditions. Use the ideal of `Groups.nilpotentCoadjointCone`, not an arbitrary support predicate. The invariant polynomial functions are used one by one; the coadjoint quotient 𝔥*//H and the coadjoint quotient map (`Groups.chevalleyMap`, in the plan of the proof) are not used. Provider: here.'
deps = ['GLCinLean.LocalSystems.singularities', 'GLCinLean.Groups.nilpotentCoadjointCone']
source = '[ArinkinGaitsgory] §§11.1.1–11.1.2'


