[[node]]
id = "GLCinLean.Etale.curve_splitTorus_h2_zero"
kind = "theorem"
desc = "For a smooth curve over an algebraically closed field and a split torus Z, prove H2_et(X,Z)=0. Reduce to the multiplicative group; the divisor exact sequence and higher direct-image calculation reduce to the function field, where Tsen via Riemann–Roch and the reduced-norm argument gives vanishing. Retain the comparison to the obstruction gerbe for lifting a reductive bundle along a central torus extension. Provider: Tau Ceti roadmap SchemeAndStackFoundations §2.16 curve_Gm_cohomology and tsen_theorem, with §§2.11 and 2.15 prerequisites. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Etale.unitsSheaf", "CategoryTheory.Sheaf.H", "AlgebraicGeometry.SmoothOfRelativeDimension", "IsAlgClosed"]
source = "[StacksProject] Theorems 59.67.10 and 59.68.5 (03RD, 03RM), Lemmas 59.67.11–59.67.12 and 59.68.2–59.68.4; [DrinfeldCompactificationSchieder] proof of Proposition 7.3.2"
