desc = 'Pseudo-proper prestacks and the derived D-module direct image computed from proper scheme presentations.'

[[node]]
id = 'GLCinLean.Derived.pseudoProper'
kind = 'definition'
desc = 'A morphism of classical prestacks is pseudo-proper when each base change by a finite-type scheme admits a small colimit presentation by schemes proper over that base. Give presentation independence and base-change stability; proper maps are examples, and the Ran theorem gives the nonrepresentable example. This geometric condition does not assert any conclusion about its sheaf functors. Provider: here. Upstream declarations used: `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`).'
deps = ['GLCinLean.Derived.prestack', 'GLCinLean.Infinity.limits']
source = '[GaitsgoryAtiyahBott] §§1.5.1, 1.5.3'

[[node]]
id = 'GLCinLean.DModules.pseudoProperShriek'
kind = 'definition'
desc = 'For a pseudo-proper map construct the left adjoint f_! to f^! on all D-modules by the colimit of proper scheme pushforwards. Prove the adjunction, presentation independence, proper base-change isomorphism and projection formula by scheme testing. This is the pseudo-proper operation, with no unrestricted f_! claimed for arbitrary maps. Provider: here.'
deps = ['GLCinLean.Derived.pseudoProper', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.limits', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.DModules.shriekTensor']
source = '[GaitsgoryAtiyahBott] Proposition 1.5.2 and Corollary 1.5.4; [GaitsgoryContractibility] §§1.4–1.6'

[[node]]
id = 'GLCinLean.DModules.twistedPseudoProperShriek'
kind = 'definition'
desc = 'For a pseudo-proper map f : Y → Z and an étale μ_n-gerbe 𝒢 on Z, the left adjoint f_{!,𝒢} : Dmod_{f^*𝒢}(Y) → Dmod_𝒢(Z) of the twisted f^! (DModules.extraordinaryPullback), on all objects. Construct it over each test scheme S → Z from an étale cover of S that trivializes 𝒢: on the cover it is DModules.pseudoProperShriek through the untwisting equivalences; on overlaps two trivializations differ by a rank-one local system L on the target and by f^*L on the source, and the projection formula identifies the two functors; descend the functors together with their units, counits and these comparison maps, and assemble over test schemes by base change. Prove the adjunction, continuity, independence of the cover and of the presentation, composition, base change and the projection formula, and that for the projection f : W × Y′ → W, the product of id_W and a pseudo-proper p : Y′ → pt, with the gerbe pulled back from W, f_{!,𝒢}(M ⊠ N) ≃ M ⊗ p_!(N) naturally in M and N, where p_!(N) is in Vect. No twisted f_! is claimed for maps that are not pseudo-proper, or for twistings that are not étale-locally trivial. The sources do not write this operation out: it is an explicit adaptation of the untwisted construction. Provider: here.'
deps = ['GLCinLean.DModules.pseudoProperShriek', 'GLCinLean.DModules.twistedCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Derived.pseudoProper', 'GLCinLean.Infinity.adjointableDiagram_limitAdjunction', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.limits', 'GLCinLean.DModules.shriekTensor']
source = '[GLys] §§1.7.2–1.7.4 and 9.5; [GaitsgoryAtiyahBott] Proposition 1.5.2 and Corollary 1.5.4; [Crystals] Remark 7.3.1 (the analogue for de Rham twistings)'

[[node]]
id = 'GLCinLean.DModules.twistedPseudoProperShriek_iso_of_trivialization'
kind = 'theorem'
desc = 'For a pseudo-proper f : Y → Z, a gerbe 𝒢 on Z and a trivialization t of 𝒢, with untwisting equivalences U_t : Dmod_𝒢(Z) ≃ Dmod(Z) and U_{f^*t} : Dmod_{f^*𝒢}(Y) ≃ Dmod(Y): f_{!,𝒢} ≃ U_t^{-1} ∘ f_! ∘ U_{f^*t}, compatibly with the two adjunctions. For the trivial gerbe with its tautological trivialization this recovers DModules.pseudoProperShriek. Provider: here.'
deps = ['GLCinLean.DModules.twistedPseudoProperShriek', 'GLCinLean.DModules.pseudoProperShriek', 'GLCinLean.DModules.twistedCrystals', 'GLCinLean.DModules.extraordinaryPullback']
source = '[GLC1] §§1.1.3–1.1.5; [GLys] §§1.7.2–1.7.4'
