desc = 'Finiteness prerequisites for the statement construction.'

[[node]]
id = 'GLCinLean.Stacks.unipotentTorsorFiltration'
kind = 'theorem'
desc = 'For the torus-twisted unipotent radical on X, build a finite filtration by additive vector-bundle quotients. For every quotient vector bundle, the existing general curve-cohomology theorems give finite-dimensional H0 and H1 and vanishing H2. Flat base change identifies these groups over every affine k-test scheme, so the argument is about families of torsors, not only k-points. Compare the ordinary cohomology with the enhanced global-section complex and present each additive torsor stack as its degree-0/1 vector-space quotient. This proves finite type, rather than assuming it from the word unipotent. Provider: here; the root-height filtration of the group is from roadmap ReductiveGroups. Upstream declarations used: `AlgebraicGeometry.Scheme.Modules.finiteDimensional_cohomology_of_smooth` (`TauCeti.AlgebraicGeometry.Curves.Cohomology`), `AlgebraicGeometry.Scheme.Modules.subsingleton_cohomology_of_two_le_of_smooth` (`TauCeti.AlgebraicGeometry.Curves.Cohomology`), `TauCeti.AlgebraicGeometry.cohomologyBaseChangeLinearEquiv` (`TauCeti.AlgebraicGeometry.Cohomology.FlatBaseChange`).'
deps = ['GLCinLean.Stacks.groupTorsor', 'GLCinLean.Groups.pinnedData', 'GLCinLean.Sheaves.qcohGlobalSections']
source = '[GLC2] §12.5.7; [GLC1] §1.3.1; [StacksProject] Tags 02O6, 02UZ and 02KH'
