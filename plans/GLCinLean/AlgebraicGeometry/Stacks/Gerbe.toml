desc = 'Étale μ_n-gerbes on prestacks and the root gerbe of a line bundle.'

[[node]]
id = 'GLCinLean.Stacks.EtaleGerbe'
kind = 'definition'
desc = 'Étale μ_n-gerbes on a prestack Y, for n ≥ 1: a map from Y to the prestack of μ_n-gerbes, that is, a point of the limit, over the test schemes S → Y, of the 2-groupoids of gerbes banded by μ_n on the étale site of S (a stack in groupoids, locally nonempty and locally connected, with automorphism sheaves identified with μ_n). The point of the limit includes the compatibility equivalences and their cocycle condition. The test schemes may be taken classical, since the étale site of a derived affine scheme is that of its classical truncation. Give band-preserving equivalences and the isomorphisms between them, pullback along maps of prestacks, the tensor product and the inverse of gerbes, trivializations, and the μ_n-torsor by which two trivializations differ. The μ_n-gerbes on Y form a symmetric monoidal 2-groupoid in which every object is invertible, with the trivial gerbe as unit; pullback is a symmetric monoidal functor, compatible with composition of maps; trivializations pull back and tensor; and the trivializations of a gerbe, when one exists, form a torsor under the μ_n-torsors on Y. Every such gerbe is étale-locally trivial on each test scheme. Not included: the classification by H², other bands, and nonabelian gerbes. Provider: here. Upstream declarations used: `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `AlgebraicGeometry.Scheme.smallEtaleTopology` (`Mathlib.AlgebraicGeometry.Sites.Etale`), `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`).'
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Stacks.groupTorsor', 'GLCinLean.Stacks.algebraicStack']
source = '[GLC1] §1.1.3; [GLys] §§1.3.2 and 1.3.6, and §§1.7.1–1.7.2 for trivializations'

[[node]]
id = 'GLCinLean.Stacks.rootGerbe'
kind = 'definition'
desc = 'The étale μ_n-gerbe (Stacks.EtaleGerbe) R_n(L) of n-th roots of a line bundle L on a prestack Y, for n invertible on the base: its objects over a test scheme are the n-th roots of the pullback of L (LineBundle.Root). Prove that it is a gerbe: two roots are étale-locally isomorphic, because a unit has an n-th root étale-locally when n is invertible. This lemma is stated and proved with this node; the roadmap SchemeAndStackFoundations plans the Kummer sequence under “Hilbert 90, the Kummer and Artin–Schreier sequences, finite pushforward”. Give the tautological character. R_n is a symmetric monoidal functor from the groupoid of line bundles on Y to the μ_n-gerbes on Y, natural in Y: an isomorphism L ≅ L′ gives a band-preserving equivalence R_n(L) ≃ R_n(L′), and there are band-preserving equivalences R_n(f^*L) ≃ f^*R_n(L), R_n(L) ⊗ R_n(M) ≃ R_n(L ⊗ M) and R_n(L)^{-1} ≃ R_n(L^{-1}), with their coherence. An n-th root of L is a trivialization. Examples: the square-root gerbe of 𝒪(1) on ℙ¹ has no trivialization, and that of 𝒪(2) has the trivialization 𝒪(1); on 𝔾_m the trivializations (𝒪, 1) and (𝒪, t) of the square-root gerbe of 𝒪 differ by the μ_2-torsor s² = t, which is not trivial. This is not the root stack of a line bundle with a section. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`).'
deps = ['GLCinLean.Stacks.EtaleGerbe', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.LineBundle.Root']
source = '[GLC1] §1.1.4; [GLys] §1.4.2 and Remark 1.4.3; [GLC2] §1.1.5'
