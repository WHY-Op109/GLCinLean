desc = 'Étale gerbes with an abelian band on prestacks, and the root gerbe of a line bundle on a prestack.'

[[node]]
id = 'GLCinLean.Stacks.EtaleGerbe'
kind = 'definition'
desc = 'Étale gerbes on a prestack Y with band A. The band A is a sheaf of abelian groups on the big étale site of the base field k: the schemes over Spec k with the étale topology. The big étale site of a scheme S over k is the slice of this site at S, and A restricts to it. The case that this plan uses is A = μ_n for n ≥ 1 (Stacks.rootGerbe, DModules.TwistedCrystals); the constant sheaves of [GLys] §1.3.3 are other cases. For a scheme S over k, write Ge_A(S) for the 2-groupoid of the gerbes on the big étale site of S that are banded by the restriction of A (Stacks.abelianBandedGerbe): its 1-morphisms are the band-preserving morphisms, which are all equivalences (Stacks.bandPreserving_isEquivalence), and its 2-morphisms are the modifications. For a map S′ → S, the big étale site of S′ is the slice at S′ of the big étale site of S, and the pullback Ge_A(S) → Ge_A(S′) is the restriction to this slice (Stacks.gerbeSliceRestriction); the band of the restricted gerbe is the restriction of A, so no inverse image of sheaves between small étale sites and no change of band occurs. An A-gerbe on Y is a map from Y to the prestack of A-gerbes, that is, a point of the limit of the 2-groupoids Ge_A(S) over the test schemes S → Y; the point of the limit includes the compatibility equivalences and their cocycle condition. The test schemes are the classical affine schemes over k, as in [GLys] §1.2.1 (the restriction of Y to classical affine schemes, Derived.Prestack). The roadmap nodes named here give the banded gerbes on one site, their restriction to one slice, and their product, contracted sum and inverse on one site. Part of this node is what no roadmap target states. (1) The compatibility of the restrictions with composition, for S″ → S′ → S, which makes S ↦ Ge_A(S) a functor to 2-groupoids; the limit; and pullback along maps of prestacks. (2) The tensor product and the inverse of A-gerbes on Y, which over each test scheme are the contracted sum and the inverse of Stacks.gerbeContractedSum; and the equivalences of associativity, commutativity, unit and inverse, with their coherence, of the contracted sum on one site and of the tensor product on Y, built from the universal property of the contracted sum. (3) The groupoid of A-torsors on Y, the limit over the test schemes of the groupoids of torsors under the restriction of A; trivializations of an A-gerbe on Y, which are compatible families of objects over the test schemes (over one test scheme, a neutralization); and the A-torsor on Y by which two trivializations differ, which over each test scheme is their Isom torsor. The A-gerbes on Y form a symmetric monoidal 2-groupoid in which every object is invertible; its unit is the trivial gerbe, which over each test scheme is the classifying gerbe of the restriction of A (Stacks.classifyingAbelianGerbe); pullback is a symmetric monoidal functor, compatible with composition of maps; trivializations pull back and tensor; and the trivializations of an A-gerbe, when one exists, form a torsor under the A-torsors on Y (Stacks.neutralGerbeEquiv). Every A-gerbe on Y is étale-locally trivial on each test scheme. Not included: the classification by H², and nonabelian gerbes. Differences from [GLys]: in §1.3.1 the band is a group-like E_n-object of the prestacks over Y, with values in spaces, and here it is a sheaf of abelian groups over the base field; in §1.3.2 the étale sheafification is taken over the affine schemes over Y, which are a dense part of the site of all schemes used here. Provider: here. Upstream declarations used: `AlgebraicGeometry.Scheme.etaleTopology` (`Mathlib.AlgebraicGeometry.Sites.Etale`), `CategoryTheory.GrothendieckTopology.over` (`Mathlib.CategoryTheory.Sites.Over`), `CategoryTheory.Over.iteratedSliceEquiv` (`Mathlib.CategoryTheory.Comma.Over.Basic`), `AlgebraicGeometry.Scheme.mu` (`TauCeti.AlgebraicGeometry.Sites.Big.StructureSheaf`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`).'
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Stacks.abelianBandedGerbe', 'GLCinLean.Stacks.gerbeSliceRestriction', 'GLCinLean.Stacks.bandPreserving_isEquivalence', 'GLCinLean.Stacks.classifyingAbelianGerbe', 'GLCinLean.Stacks.neutralGerbeEquiv', 'GLCinLean.Stacks.gerbeContractedSum']
source = '[GLC1] §1.1.3; [GLys] §1.2.1, §§1.3.1–1.3.3, 1.3.5 and 1.3.6, and §§1.7.1–1.7.2 for trivializations'

[[node]]
id = 'GLCinLean.Stacks.rootGerbe'
kind = 'definition'
desc = 'The étale μ_n-gerbe R_n(L) of n-th roots of a line bundle L on a prestack Y, that is, an A-gerbe on Y in the sense of Stacks.EtaleGerbe for the band A = μ_n, for n > 0 invertible in the base field: over a test scheme S → Y it is the root gerbe, on the big étale site of S, of the pullback of L to S (Stacks.schemeRootGerbe), whose objects over T → S are the n-th roots of the pullback of L to T (LineBundle.Root); its compatibility equivalences for S′ → S are the base change equivalences of Stacks.schemeRootGerbe, which compare the restriction to the slice at S′ with the root gerbe on S′. That the roots over each test scheme form a gerbe banded by μ_n is part of Stacks.schemeRootGerbe: two roots are étale-locally isomorphic, because a unit has an n-th root étale-locally when n is invertible (Etale.kummer_shortExact). Part of this node: the cocycle condition of the compatibility equivalences, which makes R_n(L) an A-gerbe on Y; the tautological character; and that R_n is a symmetric monoidal functor from the groupoid of line bundles on Y to the μ_n-gerbes on Y, natural in Y: an isomorphism L ≅ L′ gives a band-preserving equivalence R_n(L) ≃ R_n(L′), and there are band-preserving equivalences R_n(f^*L) ≃ f^*R_n(L), R_n(L) ⊗ R_n(M) ≃ R_n(L ⊗ M) and R_n(L)^{-1} ≃ R_n(L^{-1}), with their coherence. On one site, the last two come from the tensor product and the dual of roots (LineBundle.Root.tensorProduct) through the universal property of the contracted sum (Stacks.gerbeContractedSum); they are maps of gerbes because these operations commute with the pullback of roots (LineBundle.Root.pullbackTensorProductIso). An n-th root of L is a trivialization. Examples: the square-root gerbe of 𝒪(1) on ℙ¹ has no trivialization, and that of 𝒪(2) has the trivialization 𝒪(1) (Stacks.schemeRootGerbe); on 𝔾_m the trivializations (𝒪, 1) and (𝒪, t) of the square-root gerbe of 𝒪 differ by the μ_2-torsor s² = t, which is not trivial. This is not the root stack of a line bundle with a section. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `AlgebraicGeometry.Scheme.mu` (`TauCeti.AlgebraicGeometry.Sites.Big.StructureSheaf`).'
deps = ['GLCinLean.Stacks.EtaleGerbe', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.LineBundle.Root', 'GLCinLean.Stacks.schemeRootGerbe', 'GLCinLean.LineBundle.Root.tensorProduct', 'GLCinLean.LineBundle.Root.pullbackTensorProductIso', 'GLCinLean.Stacks.gerbeContractedSum']
source = '[GLC1] §1.1.4; [GLys] §1.4.2 and Remark 1.4.3; [GLC2] §1.1.5'
