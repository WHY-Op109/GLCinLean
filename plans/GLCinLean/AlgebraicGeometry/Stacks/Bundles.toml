desc = 'The moduli stack Bun_H of H-bundles on the curve.'

[[node]]
id = 'GLCinLean.Stacks.BundleStack'
kind = 'definition'
desc = 'The moduli stack Bun_H(X) = Maps(X, BH) of H-bundles on X (Stacks.ClassifyingStack, Derived.MappingPrestack), with the derived structure of the source retained, its functor of families, change of structure group and trivial bundle. For X a smooth proper curve and H an affine algebraic group, Bun_H(X) is a derived Artin stack locally almost of finite type (Derived.LocallyAlmostFiniteType); the finiteness is [ArinkinGaitsgory] Proposition 10.3.8 (b), and the algebraicity is proved as for the classical stack, or with level structures ([ArinkinGaitsgory] §10.4.1). Provider: here.'
deps = ['GLCinLean.Stacks.groupTorsor', 'GLCinLean.Derived.IsArtinStack', 'GLCinLean.Derived.LocallyAlmostFiniteType', 'GLCinLean.Derived.MappingPrestack', 'GLCinLean.Stacks.ClassifyingStack']
source = '[GLC1] §§1.1.1, 1.3.1; [ArinkinGaitsgory] §10.1.1, Proposition 10.3.8 (b) and §10.4.1'





[[node]]
id = 'GLCinLean.Stacks.associatedAdjointBundle'
kind = 'definition'
desc = 'The adjoint bundle ad(P) of the universal G-bundle P on X × Bun_G: the associated-bundle operation of Stacks.groupTorsor applied to the adjoint representation of G. It names this instance and repeats no construction of associated bundles. Provider: here. Upstream declarations used: `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`).'
deps = ['GLCinLean.Stacks.BundleStack', 'GLCinLean.Stacks.groupTorsor']
source = '[GLC1] §1.1.1'
