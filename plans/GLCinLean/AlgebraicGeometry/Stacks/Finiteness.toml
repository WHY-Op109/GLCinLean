desc = 'Over a characteristic-zero field, a QCA stack has a finite reduced locally closed stratification with finite surjective étale covers by quotient stacks Z/H, with Z quasi-projective over an affine scheme and H an affine k-group of finite type acting linearly. Retain the cover and embedding data. Provider: here.'
