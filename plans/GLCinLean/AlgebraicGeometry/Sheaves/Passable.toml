[[node]]
id = "GLCinLean.Sheaves.passable_tensorBaseChange"
kind = "theorem"
desc = "For Y passable and Y1→Y with QCoh(Y1) dualizable, identify QCoh(Y1) tensor over QCoh(Y) with QCoh(Y2) with QCoh(Y1×_Y Y2). Prove by affine descent, relative tensor preserving limits and the quasi-affine module description; derive the continuous pushforward/base-change comparisons in the passable source/target setting. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Sheaves.passable", "GLCinLean.Infinity.dualizableCategory", "GLCinLean.Sheaves.qcoh", "GLCinLean.Infinity.moduleCategory"]
source = "[GRQCoh] Propositions 3.3.3, 3.3.5, 3.5.3 and Lemma 3.4.4; [GLC4] §C.1.2"

[[node]]
id = "GLCinLean.Sheaves.passable_qcohKernelEquivalence"
kind = "theorem"
desc = "For a passable prestack Y, identify continuous endofunctors of QCoh(Y) with QCoh(Y×Y) via self-duality; the diagonal pushforward of O_Y is the identity kernel. Prove the evaluation/coevaluation identities and compatibility with push-pull rather than assuming a kernel formalism for arbitrary prestacks. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Sheaves.passable_tensorBaseChange", "GLCinLean.Infinity.dualizableCategory", "GLCinLean.Sheaves.qcohGlobalSections"]
source = "[GRQCoh] Propositions 3.1.7, 3.4.2 and Lemma 3.4.4; [GLC4] §C.4.1"
