desc = 'Passability, QCoh tensor base change and kernel descriptions on prestacks.'

[[node]]
id = 'GLCinLean.Sheaves.passable'
kind = 'definition'
desc = '''A prestack Y (Derived.Prestack, over the base field k) is passable when all three conditions hold ([OneAffineness] Definition 5.1.2; [GRQCoh] §3.5.1). (1) The diagonal Y → Y × Y is schematic, quasi-compact and quasi-affine: for every affine test scheme T, derived test schemes included, and every map T → Y × Y, the fibre product T ×_{Y×Y} Y is a derived scheme (Derived.IsArtinStack) that is quasi-compact and quasi-affine, that is, a quasi-compact derived scheme with an open embedding into an affine derived scheme ([GRQCoh] §3.3.1). (2) The structure sheaf O_Y, the unit of QCoh(Y), is a compact object (Infinity.compactObject). (3) QCoh(Y) is dualizable (Infinity.dualizableCategory) as a plain presentable k-linear category; this is not dualizability as a module over itself. Retain all three conditions. Examples proved with the definition: every derived affine scheme Spec A is passable. Its diagonal is affine; the unit A of the module category (Derived.affineModules) is compact; and the module category is compactly generated by A (Infinity.compactGeneration), hence dualizable. This includes Spec k, where QCoh is Infinity.derivedVect, and the empty scheme Spec 0, where QCoh is the zero category and all three conditions hold. These examples use no theorem on schemes. A prestack that is not passable, also with no theorem on schemes: the coproduct, in prestacks, of countably many copies of Spec k. Its QCoh is the product of countably many copies of Infinity.derivedVect, because QCoh sends colimits of prestacks to limits, and the unit is not compact, so (2) fails; (1) fails too, because the fibre of the diagonal over two different indices is the empty prestack, which has no point on the zero ring and so is not a scheme. The example of schemes is a theorem of its own, Sheaves.qcqsScheme_passable: every quasi-compact quasi-separated scheme over k is passable; its check on a scheme that is not quasi-compact shows that (2) does not follow from (1) and (3). The spread classifying stack ([RaskinCPSII] Corollary A.8.1) and the stacks of SpectralProof.localizationPassability are examples in the plan of the proof. Provider: here.'''
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Derived.IsArtinStack', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Derived.affineModules', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.dualizableCategory']
source = '[GRQCoh] §§3.3.1 and 3.5.1; [OneAffineness] Definition 5.1.2'

[[node]]
id = 'GLCinLean.Sheaves.passable_tensorBaseChange'
kind = 'theorem'
desc = 'For Y passable and Y1→Y with QCoh(Y1) dualizable, identify QCoh(Y1) tensor over QCoh(Y) with QCoh(Y2) with QCoh(Y1×_Y Y2). Prove by affine descent, relative tensor preserving limits and the quasi-affine module description; derive the continuous pushforward/base-change comparisons in the passable source/target setting. Provider: here.'
deps = ['GLCinLean.Sheaves.passable', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.moduleCategory']
source = '[GRQCoh] Propositions 3.3.3, 3.3.5, 3.5.3 and Lemma 3.4.4; [GLC4] §C.1.2'
