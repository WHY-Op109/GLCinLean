desc = 'Passability, QCoh tensor base change and kernel descriptions on prestacks.'

[[node]]
id = 'GLCinLean.Sheaves.passable'
kind = 'definition'
desc = 'A prestack with quasi-affine diagonal, compact structure sheaf and dualizable QCoh. Retain all three conditions. Its example in this plan: every quasi-compact separated scheme is passable (affine diagonal, compact structure sheaf, and QCoh compactly generated, hence dualizable); this is proved with the definition and used by Sheaves.qcSeparatedScheme_oneAffine. The spread classifying stack ([RaskinCPSII] Corollary A.8.1) and the stacks of SpectralProof.localizationPassability are examples in the plan of the proof. Provider: here.'
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.schemeQCoh', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.dualizableCategory']
source = '[GRQCoh] §3.5.1'

[[node]]
id = 'GLCinLean.Sheaves.passable_tensorBaseChange'
kind = 'theorem'
desc = 'For Y passable and Y1→Y with QCoh(Y1) dualizable, identify QCoh(Y1) tensor over QCoh(Y) with QCoh(Y2) with QCoh(Y1×_Y Y2). Prove by affine descent, relative tensor preserving limits and the quasi-affine module description; derive the continuous pushforward/base-change comparisons in the passable source/target setting. Provider: here.'
deps = ['GLCinLean.Sheaves.passable', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.moduleCategory']
source = '[GRQCoh] Propositions 3.3.3, 3.3.5, 3.5.3 and Lemma 3.4.4; [GLC4] §C.1.2'
