kind = "definition"
desc = "A prestack with quasi-affine diagonal, compact structure sheaf and dualizable QCoh. Retain all three conditions. The spectral-localization hypotheses theorem supplies nontrivial examples. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
