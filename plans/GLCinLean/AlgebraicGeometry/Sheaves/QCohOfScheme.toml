desc = 'Compact generation of QCoh of the prestack of a quasi-compact quasi-separated scheme.'

[[node]]
id = 'GLCinLean.Sheaves.qcoh_compactGeneration_of_qcqsScheme'
kind = 'theorem'
desc = '''For the base field k and every quasi-compact quasi-separated scheme X over k, write Y for the prestack of X: X as a derived scheme, whose value on a derived affine test scheme T is the space of maps of derived schemes from T to X. (1) The unit O_Y of QCoh(Y) is compact (Infinity.compactObject), and so is every perfect object of QCoh(Y) (Sheaves.PerfectComplex). (2) There is one perfect object of QCoh(Y) whose shifts detect zero, so QCoh(Y) is compactly generated (Infinity.compactGeneration) by one perfect object. (3) QCoh(Y) is dualizable (Infinity.dualizableCategory, which proves that compactly generated categories are dualizable). Proof: (1) and (2) are Sheaves.schemeQCoh_compactGeneration (2) and (3), carried along an equivalence of categories between QCoh(Y) and Sheaves.schemeQCoh X that sends the unit to O_X and under which the perfect objects correspond in both directions; compactness of an object and zero detection by the shifts of an object are invariant under an equivalence. The symmetric monoidal structure of the equivalence is not used. Two inputs have no node. (i) The prestack of a classical scheme over k, as a derived prestack (Derived.Prestack). (ii) The equivalence of QCoh(Y) with Sheaves.schemeQCoh X, with the unit and the perfect objects. A route: use [GRQCoh] Theorem 1.3.4 for Zariski descent of QCoh of prestacks, and compare with Zariski descent for Sheaves.schemeQCoh on the basis of affine open subschemes, refining multiple intersections by affine opens; the affine equivalences (`quasicoherentDerived_affine`) must be natural for restriction and identify the unit and the perfect objects. [GRQCoh] Proposition 1.4.4 is the case of a separated scheme, where the intersections are affine. Both belong to the line of work of Sheaves.QCoh, which is held (`STATUS.md`, “Held”) and names Sheaves.schemeQCoh among its dependencies without stating the equivalence. They become nodes when the hold ends, and this node then depends on them; until then this node waits for Sheaves.QCoh. The open #2450 §5.3 states an equivalence of this kind for the functor of points of X on ordinary rings. Hypotheses: as in Sheaves.schemeQCoh_compactGeneration; without quasi-compactness (1) fails for the unit (the disjoint union of countably many copies of Spec k). Checks: for the empty scheme QCoh(Y) is the zero category; for X = Spec k it is Infinity.derivedVect with the generator k; for the projective line the generator is O ⊕ O(−1). Users: Sheaves.qcqsScheme_passable (the unit is compact and QCoh is dualizable), DModules.IsULA (the unit is compact), DModules.IsULAModuleCategory (generation by perfect objects) and Sheaves.properPerfectPushforward (QCoh of the curve is dualizable). Provider: here; it is decided again with `prompts/change.md` when a roadmap with this statement is accepted, as for Sheaves.schemeQCoh_compactGeneration.'''
deps = ['GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.schemeQCoh', 'GLCinLean.Sheaves.schemeQCoh_compactGeneration', 'GLCinLean.Sheaves.PerfectComplex', 'GLCinLean.Derived.Prestack', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.dualizableCategory']
source = '[GRQCoh] Theorem 1.3.4, Proposition 1.4.4 and §§3.7.2–3.7.4; [OneAffineness] §5.3.1; [RaskinCPSI] Example B.6.2'
