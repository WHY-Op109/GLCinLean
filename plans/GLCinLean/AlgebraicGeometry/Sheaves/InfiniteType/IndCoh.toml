source = "[GLC2] §§A.6.1–A.6.7"

[[node]]
id = "GLCinLean.Sheaves.indPlacidIndCoh_compactDuality"
kind = "theorem"
desc = "For ind-placid ind-affine indschemes, prove both sheaf categories compactly generated and mutually dual. For placid affines use flat finite-stage coherence preservation; for ind-presentations prove closed finite-presentation pushforwards preserve compactness, then pass to filtered colimits. Include the external-product equivalence. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
