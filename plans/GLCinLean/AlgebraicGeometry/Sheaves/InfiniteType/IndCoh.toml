[[node]]
id = "GLCinLean.Sheaves.indcohBang_formalCompletion"
kind = "theorem"
desc = "Over a smooth finite-type affine base, tensoring by QCoh of an almost-finite-type base change maps fully faithfully to IndCoh! of the pullback, and is an equivalence for smooth base change. Formal completion pullback is a colocalization with supported essential image and base-change-compatible fully faithful left adjoint. Derive these from the finite-type IndCoh statements using the Kan extensions. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
