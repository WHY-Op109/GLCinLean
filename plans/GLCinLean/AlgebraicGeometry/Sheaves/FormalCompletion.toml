desc = 'QCoh and IndCoh on the formal completion of a scheme along a closed subscheme, by localization.'

[[node]]
id = 'GLCinLean.Sheaves.qcoh_formalCompletion_localization'
kind = 'theorem'
desc = 'For a closed subscheme Y of a scheme X of finite type, with open complement U, pullback to the formal completion X^∧_Y (Derived.formalCompletion, an indscheme) identifies the full subcategory QCoh(X)_Y of objects supported on Y, the kernel of restriction to U, with QCoh(X^∧_Y). Provider: here.'
deps = ['GLCinLean.Derived.formalCompletion', 'GLCinLean.Derived.indscheme', 'GLCinLean.Sheaves.qcoh', 'GLCinLean.Infinity.limits']
source = '[DGIndschemes] Proposition 7.1.3'

[[node]]
id = 'GLCinLean.Sheaves.indcoh_formalCompletion_localization'
kind = 'theorem'
desc = 'In the setting of Sheaves.qcoh_formalCompletion_localization, IndCoh(X^∧_Y) is identified with the kernel of restriction IndCoh(X) → IndCoh(U), compatibly with the QCoh statement under Υ (F ↦ F ⊗ ω) on X, U and X^∧_Y. Provider: here.'
deps = ['GLCinLean.Sheaves.qcoh_formalCompletion_localization', 'GLCinLean.Sheaves.indcoh', 'GLCinLean.Sheaves.indcohQCohAction', 'GLCinLean.Derived.indscheme']
source = '[DGIndschemes] Proposition 7.4.5 and §7.4'
