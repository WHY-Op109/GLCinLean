[[node]]
id = "GLCinLean.Sheaves.indcoh"
kind = "definition"
desc = "IndCoh on locally almost finite type PRESTACKS, defined as right Kan extension of the affine !-pullback diagram: its value is the limit of IndCoh(S) over eventually coconnective almost finite type affines S mapping to Y. Include evaluation, functorial !-pullback, and agreement with the scheme and smooth-descent Artin-stack constructions. No Artin atlas is assumed for a general de Rham prestack. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Sheaves.indcohShriekOnSchemes", "GLCinLean.Derived.prestack", "GLCinLean.Derived.locallyAlmostFiniteType", "GLCinLean.Infinity.rightKanExtension"]
source = "[IndCoh] §§10.1.2–10.1.4, 10.5, 11.2"

