kind = 'theorem'
desc = 'For a smooth scheme S of finite type, Ψ_S : IndCoh(S) → QCoh(S) and Υ_S : QCoh(S) → IndCoh(S), F ↦ F ⊗ ω_S with ω_S the !-pullback of k, are equivalences, and Υ_S is the dual of Ψ_S under the self-dualities of QCoh(S) and IndCoh(S). Provider: here.'
