desc = 'Compact generation of the enhanced quasi-coherent derived category of a quasi-compact quasi-separated scheme.'

[[node]]
id = 'GLCinLean.Sheaves.schemeQCoh_compactGeneration'
kind = 'theorem'
desc = '''For every quasi-compact quasi-separated scheme X, with no base and in every universe, write C for the enhanced category Sheaves.schemeQCoh X; small is as in Sheaves.derivedQCoh. (1) C is presentable (Infinity.presentableCategory). (2) Every perfect object of C (`PerfectDerived X`) is compact (Infinity.compactObject); in particular the unit O_X is compact. (3) There is one perfect object P of C whose shifts detect zero: an object E of C with Hom(P[n], E) = 0 in the homotopy category for all n in ℤ is a zero object. So C is compactly generated (Infinity.compactGeneration) by the one compact object P. Proof, with the supplier of each step. C is stable, it has small coproducts, and its homotopy category is `DQCoh X` as a triangulated category, with the same coproducts: this is the homotopy-category comparison of Sheaves.schemeQCoh. C is locally small, and so the Hom sets of its homotopy category are small, because C is a full subcategory of `D∞(O_X)`, whose mapping spaces are small (E1.3: `enhancedDerived.mappingSpaces`, `enhancedDerived_isPresentable`); Sheaves.schemeQCoh supplies this. The perfect objects of C and of `DQCoh X` correspond in both directions (Sheaves.perfectDerived_iff_isPerfectComplex). Sheaves.derivedQCoh_perfectGenerator gives in `DQCoh X` that perfect objects are compact for small coproducts and one perfect object P₀ whose shifts detect zero. Choose P in C with image isomorphic to P₀; P is perfect because the perfect objects correspond. The equivalence carries the detection of zero from P₀ to P, which is (3). Infinity.compactObject_iff_homotopyCategory, (i) and (ii), gives (2), because the equivalence identifies the small coproducts and C is locally small, so that the first condition of its part (ii) is compactness. (1) is Infinity.isPresentable_of_compactGenerators with S = {P}. With (1), (2) and (3), C is compactly generated by form (a) of Infinity.compactGeneration. The proof adds no geometry to Sheaves.derivedQCoh_perfectGenerator. The statement does not say that every compact object is perfect, and the plan does not use it. Hypotheses. X is quasi-compact and quasi-separated: Sheaves.schemeQCoh is defined for these schemes, and the example in Sheaves.derivedQCoh_perfectGenerator shows that (2) needs quasi-compactness. Checks. For the empty scheme C is the zero category and P = 0. For X = Spec A, P = O_X; for a field k the object ⊕_ℕ k is not compact. On the projective line over a field, P = O ⊕ O(−1), and O alone does not satisfy (3). User: Sheaves.qcoh_compactGeneration_of_qcqsScheme, which carries the statement to QCoh of the prestack of a scheme over k. Provider: here. All its objects are objects of Tau Ceti; it is written here because no accepted roadmap states it as a target and no accepted target needs it. SchemeKTheoryOperations §2.6 (the compact-object model comparison) is about the compact objects of the triangulated category `D_QCoh(X)` of SchemeAndStackFoundations §2.18 and takes them from its suppliers; it says that it is “not a second compact-generation theorem”, and it has a route inside triangulated categories. The open roadmap pull request #2450 (QuasicoherentSheavesOnPrestacks, §8.1) states compact generation of QCoh of the classical prestack of X as a target, with `perfect_generator` and `IsCompactlyGenerated` under its needs. When #2450 or another roadmap with this statement is accepted, the provider of this node is decided again with `prompts/change.md`.'''
