desc = "On a QCA stack a QCoh object is compact iff perfect, equivalently tensor-dualizable. Use continuity of Γ and tensor-Hom for the forward construction of compactness; use continuous affine pushforward for restriction of a compact object. This theorem does not assert compact generation. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
