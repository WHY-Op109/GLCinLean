desc = 'Finiteness prerequisites for the statement construction.'

[[node]]
id = 'GLCinLean.Sheaves.qcaGlobalSections_continuous'
kind = 'theorem'
desc = 'For a QCA stack, derived global sections commute with colimits. Prove finite cohomological dimension by quotient strata, finite étale descent and open-closed induction, then pass from bounded-below to unbounded complexes. Provider: here.'
deps = ['GLCinLean.Stacks.qcaStratification', 'GLCinLean.Sheaves.qcohGlobalSections', 'GLCinLean.Infinity.tStructure']
source = '[DG2] Theorem 1.4.2 and §§2.1–2.4'

[[node]]
id = 'GLCinLean.Sheaves.qcaCompact_iff_perfect'
kind = 'theorem'
desc = 'On a QCA stack a QCoh object is compact iff perfect, equivalently tensor-dualizable. Use continuity of Γ and tensor-Hom for the forward construction of compactness; use continuous affine pushforward for restriction of a compact object. This theorem does not assert compact generation. Provider: here.'
deps = ['GLCinLean.Sheaves.qcaGlobalSections_continuous', 'GLCinLean.Sheaves.perfectComplex', 'GLCinLean.Infinity.compactObject']
source = '[DG2] Corollary 1.4.3'

[[node]]
id = 'GLCinLean.Sheaves.qcaIndCoh_compactlyGenerated'
kind = 'theorem'
desc = 'For a QCA stack locally almost of finite type, coherent sheaves are exactly the compact objects of IndCoh and generate it. Plan the coherent-generation descent and finite-stratification argument, not just the conclusion. Provider: here.'
deps = ['GLCinLean.Stacks.qcaStratification', 'GLCinLean.Sheaves.qcaGlobalSections_continuous', 'GLCinLean.Sheaves.coherent', 'GLCinLean.Sheaves.indcoh', 'GLCinLean.Infinity.compactGeneration']
source = '[DG2] Theorem 3.3.5, §§3.4–3.5, Proposition 3.5.1'
