desc = 'Direct image of quasi-coherent sheaves along schematic quasi-compact maps, and perfectness for proper flat maps.'

[[node]]
id = 'GLCinLean.Sheaves.properPerfectPushforward'
kind = 'definition'
desc = 'For a map f : Y → S of prestacks that is schematic and quasi-compact (its base change to every affine test scheme is a quasi-compact quasi-separated scheme), the direct image f_* : QCoh(Y) → QCoh(S), right adjoint to pullback, continuous, with the base-change isomorphism for every map S′ → S. If f is moreover proper, flat and of finite presentation, f_* sends perfect complexes (Sheaves.PerfectComplex) to perfect complexes. For the projection X × Bun_G → Bun_G this gives the perfect complex RΓ(X, ad(P)) on Bun_G. Provider: here, from the base change on classical schemes of roadmap EnhancedDerivedSheaves (Sheaves.schemeQCoh); check that roadmap for the perfectness of proper pushforward before this node is written.'
deps = ['GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.PerfectComplex', 'GLCinLean.Sheaves.schemeQCoh', 'GLCinLean.Infinity.rightAdjoint']
source = '[GRQCoh] §2.2, Proposition 2.2.2; [GLC1] §1.1.1'
