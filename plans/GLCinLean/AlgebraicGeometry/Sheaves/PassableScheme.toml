desc = 'Quasi-compact quasi-separated schemes are passable prestacks.'

[[node]]
id = 'GLCinLean.Sheaves.qcqsScheme_passable'
kind = 'theorem'
desc = '''For the base field k and every quasi-compact quasi-separated scheme X over k, the prestack of X is passable (Sheaves.passable). The prestack of X is X as a derived scheme, as in Sheaves.qcoh_compactGeneration_of_qcqsScheme. The source states the theorem for quasi-compact quasi-separated algebraic spaces ([OneAffineness] §5.3.1); [GRQCoh] §§3.5.1 and 3.7.4 state it for quasi-compact schemes as a case of perfect stacks, whose diagonal is affine by definition (§3.7.1). Neither separatedness nor an affine diagonal is used here. Proof of the three conditions. (1) The diagonal. Classical step: the diagonal X → X × X is an immersion for every scheme, so it is a closed immersion into an open subscheme W of X × X, and it is quasi-compact because X is quasi-separated; the product over the field k is also the product of the prestacks. Derived step: for an affine test scheme T, derived test schemes included, and a map T → X × X, let U be the inverse image of W, an open subscheme of T. The fibre product Z = T ×_{X×X} X is the base change of X → W to U, so Z is a derived scheme with a closed immersion into U, which is an affine map, and Z is quasi-compact. Helper lemma, for derived schemes: a quasi-compact derived scheme Z with an affine map f to an open subscheme U of an affine derived scheme T is quasi-affine in the sense of [GRQCoh] §3.3.1. Its proof: the image of Z lies in a quasi-compact open subscheme U′ of U, a finite union of principal open subschemes D(g_i) of T. Let Z_I = Z ×_T D(∏_{i∈I} g_i) for each non-empty set I of indices; each is affine. Let B be the limit of the rings of the Z_I in the connective commutative algebras over the ring of T (Derived.commutativeAlgebra), and Z′ = Spec B. For each i the map from the localization of B at g_i to the ring of Z_i is an equivalence. On underlying additive spaces, localization at g_i is the filtered telescope of multiplication by g_i. The underlying-space functor on connective commutative algebras creates limits and detects equivalences. Filtered colimits of spaces commute with finite limits. After localization the intersection indexed by I has the ring of Z_{I ∪ {i}}, so the localized limit is the ring of Z_i, because the sets that contain i have the least element {i}. So Z is the open subscheme Z′ ×_T U′ of the affine scheme Z′. If U′ is empty, the diagram is empty, B is the zero algebra and Z′ is empty. The classical case of (1) is: a quasi-compact immersion is quasi-affine ([StacksProject] Lemma 29.13.6, tag 02JR). The fibre product is a derived scheme even when T is classical: for X the affine line and T the point (0, 0) of the plane it is the derived self-intersection of the origin in the line. (2) The unit is compact and (3) QCoh is dualizable: Sheaves.qcoh_compactGeneration_of_qcqsScheme (1) and (3). So this node waits, with that node, for Sheaves.QCoh, which is held. Hypotheses. Quasi-separatedness is used in (1) and, with quasi-compactness, in (2) and (3). Quasi-compactness cannot be dropped: for X the disjoint union of countably many copies of Spec k, as a scheme, condition (1) holds (the fibre product is an open and closed subscheme of T), condition (3) holds (QCoh is the product of countably many copies of Infinity.derivedVect, compactly generated by the units O_i of the factors), and condition (2) fails: ⊕_i O_i = O_X, and Hom(O_X, ⊕_i O_i) is the product of countably many copies of k, which is not ⊕_i Hom(O_X, O_i). So X is not passable, and condition (2) of Sheaves.passable does not follow from (1) and (3). Checks. The empty scheme and Spec k are passable; they are also covered by the affine examples of Sheaves.passable. The projective line over k is passable and not affine. The affine plane with a doubled origin is passable and not separated, and its diagonal is quasi-affine and not affine: over the product of the two charts it is the punctured plane. Finite powers X^I of a quasi-compact quasi-separated scheme X over k, including the empty power Spec k, are quasi-compact quasi-separated, so they are passable. User: Sheaves.qcSeparatedScheme_oneAffine (passability of its scheme). Provider: here. The geometry of (2) and (3) is the roadmap node Sheaves.derivedQCoh_perfectGenerator; it is not proved here. Upstream declarations used, for the classical step: `AlgebraicGeometry.QuasiSeparated` (`Mathlib.AlgebraicGeometry.Morphisms.QuasiSeparated`), `AlgebraicGeometry.QuasiCompact` (`Mathlib.AlgebraicGeometry.Morphisms.QuasiCompact`), `AlgebraicGeometry.Scheme.IsQuasiAffine.of_isImmersion` and `AlgebraicGeometry.Scheme.IsQuasiAffine.of_isAffineHom` (`Mathlib.AlgebraicGeometry.QuasiAffine`).'''
deps = ['GLCinLean.Sheaves.passable', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.qcoh_compactGeneration_of_qcqsScheme', 'GLCinLean.Derived.commutativeAlgebra', 'GLCinLean.Derived.Prestack', 'GLCinLean.Derived.IsArtinStack', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.dualizableCategory']
