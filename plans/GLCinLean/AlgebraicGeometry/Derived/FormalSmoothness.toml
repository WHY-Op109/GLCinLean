desc = "Derived indscheme inputs to the finiteness argument. No placeholders; consume the affine cotangent and enhanced category providers already planned."

[[node]]
id = "GLCinLean.Derived.formallySmooth"
kind = "definition"
desc = "Formal smoothness for a derived prestack: classical nilpotent lifting plus the required homotopy-group comparison along coconnective truncations. Preserve the paper's global lifting convention rather than silently sheafifying it. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Derived.prestack", "GLCinLean.Derived.classicalReduction", "GLCinLean.Infinity.mappingSpaces"]
source = "[DGIndschemes] Definitions 8.1.1 and 8.1.3"

[[node]]
id = "GLCinLean.Derived.formallySmooth_iff_proCotangent"
kind = "theorem"
desc = "For a prestack admitting connective deformation theory with 0-truncated classical restriction, formal smoothness is equivalent to vanishing of Hom(T*_x, F[i]) for each affine test point, each heart object F and i>0. Use the relative version for meromorphic connections. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Derived.formallySmooth", "GLCinLean.Derived.connectiveDeformationTheory", "GLCinLean.Derived.proCotangentComplex"]
source = "[DGIndschemes] Proposition 8.2.2"

[[node]]
id = "GLCinLean.Derived.formallySmooth_classicalComparison"
kind = "theorem"
desc = "If a formally smooth DG indscheme has a classical restriction whose sheafified derived left Kan extension is also a formally smooth DG indscheme, the comparison map from that extension is an equivalence. Keep both formal-smoothness hypotheses. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Derived.indscheme", "GLCinLean.Derived.formallySmooth", "GLCinLean.Derived.indscheme_connectiveDeformationTheory", "GLCinLean.Derived.formallySmooth_iff_proCotangent"]
source = "[DGIndschemes] Proposition 9.1.4"
