desc = 'Derived indscheme inputs to the finiteness argument.'

[[node]]
id = 'GLCinLean.Derived.IsIndscheme'
kind = 'definition'
desc = 'Convergent derived prestack whose restrictions to n-coconnective test affines are filtered colimits of quasi-compact quasi-separated n-coconnective schemes along closed embeddings; a map of n-coconnective schemes is a closed embedding when the map of the classical truncations is one, and for n = 0 such a colimit is a filtered union. Include the presentation and mapping APIs; a formal filtered colimit alone need not be convergent. The definition has a stage for each n: an n-coconnective ind-scheme is a prestack on the n-coconnective affine schemes that is such a filtered colimit, taken in the prestacks on the n-coconnective affine schemes ([DGIndschemes] §1.1). The stage n = 0 is a classical ind-scheme: a classical prestack (the restriction to classical affine test schemes of Derived.Prestack) that is a filtered union of quasi-compact quasi-separated classical schemes along closed embeddings. A derived prestack is an ind-scheme exactly when it is convergent and its restriction to the n-coconnective affine schemes is an n-coconnective ind-scheme for every n. Include the extension from a stage ([DGIndschemes] Lemma 1.4.7 and §1.4.8). For an n-coconnective ind-scheme written as a filtered colimit of schemes X_α along closed embeddings, regard each X_α as a derived scheme, take the colimit of the X_α in the prestacks on all derived affine schemes, and take its convergent completion. The result is an ind-scheme, its restriction to the n-coconnective affine schemes is the given one, it does not depend on the presentation, and the extension is a fully faithful functor. It is the convergent completion of the fppf sheafification of the left Kan extension; the left Kan extension alone is not used, because it need not be a sheaf. For n = 0 the extension makes a derived ind-scheme from a classical one. The nodes whose input is a functor on classical rings state the stage n = 0: LoopGroups.LoopGroup and GLCinLean.AffineGrassmannian for the prestack itself, and LoopGroups.RanLoopGroup for the base change of the loop group to each test scheme over the Ran space, not for the total prestack over the Ran space, which is not an ind-scheme. A node that needs a derived prestack applies the extension. Provider: here.'
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Derived.ClassicalReduction', 'GLCinLean.Infinity.limits']
source = '[DGIndschemes] §§1.1, 1.3–1.4'
