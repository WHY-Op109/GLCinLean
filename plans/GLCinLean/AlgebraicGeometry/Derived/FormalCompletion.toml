desc = "For a closed subprestack Z of Y, form Y completed along Z as Y fiber product over Y_dR with Z_dR; prove its affine-test universal property and base-change compatibility. Use this fiber-product model for the derived prestack. Tau Ceti's ordinary Scheme.formalCompletion supplies adic thickening systems and is not redefined. Provider: Missing derived prestack construction; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Derived.prestack", "GLCinLean.Derived.deRhamPrestack", "GLCinLean.Infinity.limits"]
source = "[DGIndschemes] Definition 6.1.2; [OneAffineness] §4.1.2"
