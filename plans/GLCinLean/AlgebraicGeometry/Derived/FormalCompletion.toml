desc = 'Formal completion as a derived prestack, with comparison to support conditions.'

[[node]]
id = 'GLCinLean.Derived.formalCompletion'
kind = 'definition'
desc = '''For a closed subprestack Z of Y, form Y completed along Z as Y fiber product over Y_dR with Z_dR; prove its affine-test universal property and base-change compatibility. Use this fiber-product model for the derived prestack. Tau Ceti's ordinary Scheme.formalCompletion supplies adic thickening systems and is not redefined. Provider: here.'''
deps = ['GLCinLean.Derived.prestack', 'GLCinLean.Derived.deRhamPrestack', 'GLCinLean.Infinity.limits']
source = '[DGIndschemes] Definition 6.1.2; [OneAffineness] §4.1.2'
