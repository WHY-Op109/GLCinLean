id = 'GLCinLean.Derived.IsArtinStack'
kind = 'definition'
desc = 'Derived Artin stacks: derived prestacks with a smooth atlas by derived schemes and representable diagonal, defined inductively, with smooth descent. Finiteness conditions are not part of this notion; they are Derived.LocallyAlmostFiniteType. Provider: here.'
