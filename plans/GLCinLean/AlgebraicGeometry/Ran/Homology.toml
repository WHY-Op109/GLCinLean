desc = 'Algebraic Ran contractibility and its universal superset form; the proof precedes factorization globalization.'

[[node]]
id = 'GLCinLean.Hecke.ranPseudoProper'
kind = 'theorem'
desc = 'For proper X, prove Ran(X) is pseudo-proper from its colimit over nonempty finite sets and surjections of finite powers X^I. Likewise prove the small projection from the inclusion correspondence is pseudo-proper after every affine base change using the finite-set-pair presentation. Use classical test schemes and prove that de Rham restriction identifies this presentation with the Ran prestack used for right crystals; derived nilpotents do not change D-modules. In particular the corresponding left adjoints exist on all D-modules. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6.'
deps = ['GLCinLean.Hecke.ranInclusions', 'GLCinLean.Derived.pseudoProper', 'GLCinLean.Derived.deRhamPrestack', 'GLCinLean.Infinity.limits']
source = '[GaitsgoryAtiyahBott] Proposition 4.1.3 and Corollary 4.1.6; [GLC2] §C.5.6'

[[node]]
id = 'GLCinLean.Hecke.ranHomology_connective'
kind = 'theorem'
desc = 'For a nonempty proper connected X, the homology of Ran(X) has no negative homological degrees and the trace H_0(Ran(X))→k is an isomorphism. Compute from the finite-power proper presentation: each X^I is connected, its dualizing homology is connective with H_0=k, and the index category of nonempty finite sets and surjections has contractible nerve. Do not assume the whole homology is k at this step. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6. Upstream declarations used: `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`).'
deps = ['GLCinLean.Hecke.ranPseudoProper', 'GLCinLean.DModules.compactSupportedHomology', 'GLCinLean.Infinity.tStructure']
source = '[GaitsgoryContractibility] §1.6.3 and opening of §6'

[[node]]
id = 'GLCinLean.Hecke.ranHomology_is_unit'
kind = 'theorem'
desc = 'For a nonempty proper connected X, prove the trace H(Ran(X))→k is an equivalence. If n>0 is the least nonzero homological degree, geometric and algebraic Kunneth identify H_n(Ran^m) with m copies of H_n(Ran). Commutativity and associativity make union act by one idempotent endomorphism u in every summand; union after the diagonal is the identity, so 2u=id and 3u=id, forcing H_n=0. This algebraic argument works over the stated field without complex-topological comparison. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6.'
deps = ['GLCinLean.Hecke.ranHomology_connective', 'GLCinLean.Hecke.ranUnion', 'GLCinLean.DModules.compactSupportedHomology_kunneth']
source = '[GaitsgoryContractibility] Theorem 1.6.5 and proof in §6; [BDChiral] Proposition 4.3.3(i)'

[[node]]
id = 'GLCinLean.Hecke.ranSupersetPullback_fullyFaithful'
kind = 'theorem'
desc = 'For a nonempty proper connected X, an arbitrary affine base S and configuration I over S, prove pullback Dmod(S)→Dmod(Ran_supersets(I)) is fully faithful, universally under base change. Realize the superset prestack as a retract over S of S×Ran by J↦I∪J; universal homological contractibility survives retracts. Retain the Dmod(S)-linear adjunction and its isomorphic unit so tensoring with any presentable Dmod(S)-module category also gives a fully faithful pullback. This is the geometric input used in independent-category descent. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6.'
deps = ['GLCinLean.Hecke.ranHomology_is_unit', 'GLCinLean.Hecke.ranInclusions', 'GLCinLean.Hecke.ranPseudoProper', 'GLCinLean.DModules.homologyTrace_isIso_iff_universallyFullyFaithful', 'GLCinLean.Infinity.moduleCategory']
source = '[GaitsgoryAtiyahBott] Theorem 4.6.2 and proof §4.6.3; [GLC2] Proposition H.3.2'
