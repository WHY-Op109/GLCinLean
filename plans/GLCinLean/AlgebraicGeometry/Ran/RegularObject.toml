id = 'GLCinLean.Ran.Representations.regularObject'
kind = 'definition'
desc = 'For an affine group scheme H of finite type over k. On the collision category Rep(H)_{X^I}, for every finite set I (Ran.CollisionCategory for C = Rep(H)): the conservative symmetric monoidal Dmod(X^I)-linear functor Oblv_{X^I} : Rep(H)_{X^I} → Dmod(X^I), induced by the forgetful functor Rep(H) → Vect ([RaskinCPSI] §6.21); its continuous Dmod(X^I)-linear right adjoint Av_{X^I}, compatible with factorization (Proposition 6.22.1 (1)); and the regular object O_{H,X^I}, the commutative factorization algebra of Ran.CollisionCategory attached to the regular representation O_H, a commutative algebra of Rep(H) (§§6.14, 6.22), with the equivalence Av_{X^I}(ω_{X^I}) ≃ O_{H,X^I} (Proposition 6.22.1 (2)). Keep two objects apart: O_{H,X^I} in Rep(H)_{X^I}, on which functors are evaluated, and its underlying coalgebra Oblv_{X^I}(O_{H,X^I}) in Dmod(X^I), which acts on module categories. Record the compatibility of all of these with the diagonal maps and with factorization. On the geometric category Rep(H)_{X^I} of Ran.Representations, for every nonempty finite set I: the forgetful functor to Dmod(X^I), pullback along the section of the spread classifying stack over (X^I)_dR given by the trivial H-torsor; its right adjoint, which exists by the adjoint functor theorem (Infinity.rightAdjoint); and the regular object, the value of this right adjoint on ω_{X^I}. The declaration Ran.Representations.regularObject is this object of the geometric category; the object of the collision category is the factorization algebra of Ran.CollisionCategory for A = O_H. These geometric definitions do not use the comparison. Ran.Representations.equivCollisionLimit proves that the comparison intertwines the two forgetful functors. So it intertwines the right adjoints and the regular objects, and the geometric right adjoint is continuous and Dmod(X^I)-linear. The right adjoint exists because Oblv_{X^I} sends the ULA generators Loc_{X^I}(V) of Ran.collisionCategory_isULAModuleCategory to ULA objects of Dmod(X^I) (DModules.exists_linearRightAdjoint_iff_preservesULA). Prove this first for every continuous symmetric monoidal functor C → D with C compactly generated and rigid ([RaskinCPSI] footnote 35), and take Rep(H) → Vect as the case used. Provider: here.'
deps = ['GLCinLean.Ran.CollisionCategory', 'GLCinLean.Ran.collisionCategory_isULAModuleCategory', 'GLCinLean.Ran.Representations', 'GLCinLean.Ran.SpreadClassifyingStack', 'GLCinLean.DModules.exists_linearRightAdjoint_iff_preservesULA', 'GLCinLean.Groups.RepresentationCategory', 'GLCinLean.Groups.representationCategory_compactlyGenerated_rigid', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.moduleCategory']
