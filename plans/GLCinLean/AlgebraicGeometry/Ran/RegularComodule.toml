desc = 'Linear functors out of Rep(H)_Ran as comodules over the regular object.'

[[node]]
id = 'GLCinLean.Ran.Representations.linearFunctorEquivComodule'
kind = 'definition'
desc = 'For every affine group scheme H of finite type over k, each nonempty finite set I and each Dmod(X^I)-module category D, the equivalence between Dmod(X^I)-linear continuous functors Rep(H)_{X^I} → D and comodules in D over the regular object O_{H,X^I} (Ran.Representations.regularObject; its underlying coalgebra in Dmod(X^I) acts on D), F ↦ F(O_{H,X^I}), compatible with the diagonal and factorization maps over Ran. The lemmas of [RaskinCPSI] are about the limit presentation of Rep(H)_{X^I}, so the proof first transports along Ran.Representations.equivCollisionLimit. It then uses the self-duality of Rep(H)_{X^I} as a Dmod(X^I)-module (Ran.collisionCategory_tensorLimitComparison_isEquivalence; [RaskinCPSI] Lemma 6.18.1 and Corollary 6.18.2), the continuous linear right adjoint of the forgetful functor and its value on ω_{X^I} (Ran.Representations.regularObject; Proposition 6.22.1, which rests on the ULA generation of Theorem 6.17.1 and on Proposition B.7.1), and the comonadicity of Oblv ⊗ id_D for every D (Lemma 6.23.2). Comonadicity is a proof lemma of this node: by the tensor-limit equivalence, Oblv ⊗ id_D is a limit of the functors Rep(H)^{⊗K} ⊗ E → E; each is conservative and preserves the totalizations it splits, by one-affineness of the classifying stacks of the groups H^n, with Rep(H)^{⊗n} = QCoh(B(H^n)) by Sheaves.externalProduct_isEquivalence_of_dualizable ([OneAffineness] Theorem 2.2.2 and Lemma 5.5.4); then the comonadic form of the Barr–Beck–Lurie theorem applies (Infinity.barrBeckLurie, applied to the opposite categories). The proof identifies the resulting comonad with the action of the underlying coalgebra of the regular object, with its counit and comultiplication. Its variant for lax monoidal functors and algebras is Ran.Representations.laxMonoidalFunctorEquivAlgebra in the plan of the proof. It supplies continuity and the coherent enhancement of the functors built from it, instead of applying a functor to a triangulated heart. Provider: here.'
