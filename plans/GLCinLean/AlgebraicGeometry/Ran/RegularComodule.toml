desc = 'Linear functors out of Rep(H)_Ran as comodules over the regular object.'

[[node]]
id = 'GLCinLean.Ran.Representations.linearFunctorEquivComodule'
kind = 'definition'
desc = 'For each finite set I and each Dmod(X^I)-module category D, the equivalence between Dmod(X^I)-linear continuous functors Rep(H)_{X^I} → D and comodules in D over the regular object O_{H,X^I}, F ↦ F(O_{H,X^I}), compatible with the diagonal and factorization maps over Ran. The lemmas of [RaskinCPSI] are about the limit presentation of Rep(H)_{X^I}, so the proof first transports along Ran.Representations.equivCollisionLimit. It then uses the self-duality of Rep(H)_{X^I} as a Dmod(X^I)-module ([RaskinCPSI] Corollary 6.18.2), the continuous linear right adjoint of the forgetful functor and its value on the unit (Proposition 6.22.1), and the comonadicity of Oblv ⊗ id_D (Lemma 6.23.2), all from Lemma 6.18.1, whose long proof is an obligation here. These use one-affineness of X^I, of (X^I)_dR and of the classifying stacks of the groups H^n (Lemma 6.16.2, Appendix A.3, Lemma 6.23.2), and the dualizability of a pullback along a localization (Lemma A.2.1); and the comonadic form of the Barr–Beck–Lurie theorem (Infinity.barrBeckLurie, applied to the opposite categories). Its variant for lax monoidal functors and algebras is Ran.Representations.laxMonoidalFunctorEquivAlgebra in the plan of the proof. It supplies continuity and the coherent enhancement of the functors built from it, instead of applying a functor to a triangulated heart. Provider: here.'
deps = ['GLCinLean.Ran.Representations', 'GLCinLean.Ran.Representations.equivCollisionLimit', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.internalHom', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.barrBeckLurie', 'GLCinLean.Infinity.localizationPullback_dualizable', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine', 'GLCinLean.Sheaves.finiteTypeGroupClassifying_oneAffine']
