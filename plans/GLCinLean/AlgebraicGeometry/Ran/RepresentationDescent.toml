desc = "The spread classifying stack over finite configurations as Raskin's collision limit, with arbitrary affine parameters."

[[node]]
id = 'GLCinLean.Ran.Representations.equivCollisionLimit'
kind = 'definition'
desc = '''For an affine algebraic group H and each nonempty finite set I, the equivalence of Dmod(X^I)-module categories between QCoh of the spread classifying stack (BH)_Ran over (X^I)_dR and Raskin's category Rep(H)_{X^I_dR}: the limit, over the surjections I ↠ J ↠ K, of Dmod(U(I↠J)) ⊗ Rep(H)^{⊗K}, with open restrictions and tensor-product transitions ([RaskinCPSI] §6). It is compatible with the diagonal maps and with factorization over disjoint loci, and it identifies the forgetful functor and the regular object. By one-affineness of X^I and (X^I)_dR it gives the same equivalence after scalar extension to QCoh(X^I) and to every affine S → X^I, with terms QCoh(U(I↠J)) ⊗ Rep(H)^{⊗K}; base change along S is proved with the localization-pullback tensor theorem, not by assuming that base change commutes with arbitrary limits. The proof follows [RaskinCPSII] Lemma 9.8.1 and Appendix A.2–A.5: present the spread stack over (X^I)_dR as the prestack quotient of the regular jets of Lie(H)-valued 1-forms by the jet group H(O) (§9.4; the quotient is classical, checked on cotangent complexes); prove the comparison first for an affine target Spec A in place of BH (Proposition A.4.1, from ULA generation, [RaskinCPSI] Lemma 6.16.2 and Proposition B.8.1, and factorization); reduce to X = A^1 by étale descent for sheaves of categories; and commute the construction with the cosimplicial limit of the Čech nerve of the gauge action, whose terms are dualizable. The source uses the unsheafified prestack B^naive H; QCoh does not change under its étale sheafification, and the proof states this step. Distinguish the spread stack from a product of copies of BH, which it is only over distinct points. Provider: here.'''
deps = ['GLCinLean.Ran.SpreadClassifyingStack', 'GLCinLean.Groups.RepresentationCategory', 'GLCinLean.Sheaves.sheafOfCategories', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine', 'GLCinLean.Sheaves.formalCompletion_moduleSupport', 'GLCinLean.Infinity.localizationPullback_dualizable', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.limits']
