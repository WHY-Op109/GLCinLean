[[node]]
id = "GLCinLean.Hecke.spreadClassifyingStack_collisionDescent"
kind = "theorem"
desc = "Identify QCoh of the spread constant D-stack BH over X^I with the QCoh version of the finite collision diagram indexed by I→J→K surjections: term QCoh(U(I→J)) tensor Rep(H)^K, with open restrictions and tensor-product transitions. Construct the equivalence from horizontal torsors and their representations, using formal Taylor descent in characteristic zero and descent for affine group torsors; distinguish this from a product of BH's only over distinct points. Prove compatibility under diagonal maps and under every affine S→X^I, using one-affineness and the localization-pullback tensor theorem rather than assuming base change commutes with arbitrary limits. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.spreadClassifyingStack", "GLCinLean.Hecke.representationCategory", "GLCinLean.Sheaves.sheafOfCategories", "GLCinLean.Sheaves.qcSeparatedScheme_oneAffine", "GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine", "GLCinLean.Sheaves.formalCompletion_moduleSupport", "GLCinLean.Infinity.localizationPullback_dualizable"]
source = "[GaitsgoryOutline] §§4.1.3, 4.2.1; [RaskinCPSI] §§6.6–6.10, Lemmas 6.16.2, 6.17.2, 6.18.1 and Appendix A.3"

[[node]]
id = "GLCinLean.Hecke.spreadClassifyingStack_passable"
kind = "theorem"
desc = "For reductive H in characteristic zero and every affine S→Ran(X), prove the spread BH fiber has affine diagonal, compact unit and dualizable QCoh. Affineness comes from compatible horizontal isomorphisms of H-torsors. Prove unit compactness in the finite collision diagram, and dualizability by induction using the open complement of the full diagonal and the localization pullback criterion; retain arbitrary affine coefficient base change. Rigid compactly generated Rep(H) supplies the finite-configuration terms. This verifies all passability conditions, not merely their k-point restrictions. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.spreadClassifyingStack_collisionDescent", "GLCinLean.Sheaves.passable", "GLCinLean.Infinity.localizationPullback_dualizable", "GLCinLean.Infinity.rigidMonoidalCategory", "GLCinLean.Infinity.compactObject"]
