desc = "The category Rep(H)_{X^I} of the spread classifying stack as Raskin's collision category of Rep(H), with arbitrary affine parameters."

[[node]]
id = 'GLCinLean.Ran.Representations.equivCollisionLimit'
kind = 'definition'
desc = '''For every affine group scheme H of finite type over k (of characteristic zero, as for all D-modules of this plan) and each nonempty finite set I, the equivalence of Dmod(X^I)-module categories between Rep(H)_{X^I} of Ran.Representations (QCoh of the spread classifying stack (BH)_Ran over (X^I)_dR) and the collision category of Ran.CollisionCategory for C = Rep(H), Raskin's Rep(H)_{X^I_dR}: the limit, over the surjections I ↠ J ↠ K, of Dmod(U(I↠J)) ⊗ Rep(H)^{⊗K}, with open restrictions and tensor-product transitions ([RaskinCPSI] §6.8). The equivalence is the canonical functor of [RaskinCPSII] §9.8. Its component at (I ↠ J ↠ K) is pullback along the map U(I↠J)_dR × (BH)^K → (BH)_{X^I_dR} that sends torsors (P_k) to the torsor on the relative formal disc which is constant with value P_{q(j)} near the points x_i with p(i) = j. Here QCoh(U(I↠J)_dR × (BH)^K) is Dmod(U(I↠J)) ⊗ Rep(H)^{⊗K}, by Sheaves.externalProduct_isEquivalence_of_dualizable and the dualizability of Rep(H). No hypothesis on Rep(H) is assumed: it is compactly generated and rigid by Groups.representationCategory_compactlyGenerated_rigid. It is compatible with the diagonal maps and with factorization over disjoint loci, and it intertwines the two forgetful functors of Ran.Representations.regularObject (pullback along the trivial local system, and Oblv_{X^I} of the collision category). So the forgetful functor of Rep(H)_{X^I} of Ran.Representations has a continuous Dmod(X^I)-linear right adjoint, and its value on ω_{X^I} is the regular object O_{H,X^I} of that category, identified with the regular object of the collision category. By one-affineness of X^I and (X^I)_dR, scalar extension from Dmod(X^I) to QCoh(X^I), and to QCoh(S) for every affine S → X^I, commutes with all limits of module categories (as in [RaskinCPSI] Lemma 6.16.2). So the equivalence gives the same equivalence after these scalar extensions, with terms QCoh(U(I↠J)) ⊗ Rep(H)^{⊗K}, respectively QCoh(S ×_{X^I} U(I↠J)) ⊗ Rep(H)^{⊗K}. The proof follows [RaskinCPSII] Lemma 9.8.1 and Appendix A.2–A.5: present the spread stack over (X^I)_dR as the prestack quotient of the regular jets of Lie(H)-valued 1-forms by the jet group H(O) (§9.4; the quotient is classical, checked on cotangent complexes); prove the comparison first for an affine target Spec A in place of BH (Proposition A.4.1, from the ULA generation of A_{X^I_dR}-mod(Dmod(X^I)) by the object A_{X^I_dR} (the free-module functor is Dmod(X^I)-linear and left adjoint to the conservative forgetful functor), from the ULA unit of (A-mod)_{X^I} (Lemma 6.16.2, in Ran.collisionCategory_isULAModuleCategory), the equivalence test DModules.isEquivalence_iff_of_isULAModuleCategory, and factorization; here QCoh of the affine D_{X^I}-scheme of jets into Spec A is the category of modules over the commutative factorization algebra A_{X^I_dR} of [RaskinCPSI] §6.13, and on X = A¹, after the translation trivialization of Step 2, the Čech terms H(O)^n × Lie(H) ⊗ Ω¹(O) over (X^I)_dR are of this form); reduce to X = A¹ by Zariski descent on X^I, using the open sets on which an étale coordinate is injective on the points of the configuration (they cover X^I); the source leaves this step to the reader, and the proof states it; and commute the construction with the cosimplicial limit of the Čech nerve of the gauge action, whose terms and whose limit Rep(H) are dualizable (the limit commutes with the tensor powers C^{⊗K} only then); the limit is over Δ, whose diagonal in Δ × Δ is cofinal for limits. The source uses the unsheafified prestack B^naive H. The map from its spread prestack to the plan's spread prestack is an étale sheafification over (X^I)_dR: it is fully faithful, and essentially surjective étale-locally on S, because an H-torsor on the relative formal disc is trivial étale-locally on S (H is smooth). Since QCoh satisfies étale descent, the two have the same QCoh. The proof states and proves this step. Distinguish the spread stack from a product of copies of BH, which it is only over distinct points. Provider: here.'''
deps = ['GLCinLean.Ran.Representations', 'GLCinLean.Ran.SpreadClassifyingStack', 'GLCinLean.Ran.CollisionCategory', 'GLCinLean.Ran.collisionCategory_isULAModuleCategory', 'GLCinLean.Ran.Representations.regularObject', 'GLCinLean.DModules.isEquivalence_iff_of_isULAModuleCategory', 'GLCinLean.Groups.RepresentationCategory', 'GLCinLean.Groups.representationCategory_compactlyGenerated_rigid', 'GLCinLean.Sheaves.sheafOfCategories', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.limits', 'GLCinLean.Sheaves.externalProduct_isEquivalence_of_dualizable', 'GLCinLean.Derived.cotangentComplex']
