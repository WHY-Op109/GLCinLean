desc = 'The inclusion correspondence of finite configurations and its base-change fibers.'

[[node]]
id = 'GLCinLean.Hecke.ranInclusions'
kind = 'definition'
desc = 'The prestack of pairs of nonempty finite configurations I_small⊆I_big, with small and big projections, diagonal I↦(I⊆I) and union maps. Describe each fiber over a family I on S as configurations containing I, and give the proper-presentation description using pairs of finite sets. These are prestacks in groupoids; their fibers are not declared contractible merely because the unital category has an initial object. Provider: here.'
deps = ['GLCinLean.Hecke.ranSpace', 'GLCinLean.Hecke.ranUnion', 'GLCinLean.Derived.prestack']
source = '[GLC2] §§C.5.1–C.5.2, C.5.6; [GaitsgoryAtiyahBott] §4.6.3'
