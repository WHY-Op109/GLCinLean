desc = '''The prestack of pairs of nonempty finite configurations I_small⊆I_big, with small and big projections, diagonal I↦(I⊆I) and union maps. Describe each fiber over a family I on S as configurations containing I, and give the proper-presentation description using pairs of finite sets. These are prestacks in groupoids; their fibers are not declared contractible merely because the unital category has an initial object. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6.'''
deps = ["GLCinLean.Hecke.ranSpace", "GLCinLean.Hecke.ranUnion", "GLCinLean.Derived.prestack"]
source = '[GLC2] §§C.5.1–C.5.2, C.5.6; [GaitsgoryAtiyahBott] §4.6.3'
