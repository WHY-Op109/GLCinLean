desc = 'The relative tensor product of the collision category with a module category as a limit, and its self-duality.'

[[node]]
id = 'GLCinLean.Ran.collisionCategory_tensorLimitComparison_isEquivalence'
kind = 'theorem'
desc = 'Let C be compactly generated and rigid ([RaskinCPSI] §6.15), let I be a finite set, and let D be any Dmod(X^I)-module category. The canonical functor from C_{X^I} ⊗_{Dmod(X^I)} D (Ran.CollisionCategory) to the limit over S_I of the categories (C^{⊗K} ⊗ Dmod(U(p))) ⊗_{Dmod(X^I)} D is an equivalence (Lemma 6.18.1). Corollary, in the same module: C_{X^I} is dualizable and self-dual as a Dmod(X^I)-module category (Corollary 6.18.2); Dualizability is formal: by the theorem, the dual is the colimit of the duals of the terms. Self-duality is not formal, and the source gives no proof of it. This node chooses the pairing, proves that it is perfect, and gives the duality data, and the resulting identification of the continuous Dmod(X^I)-linear functors C_{X^I} → D with the objects of C_{X^I} ⊗_{Dmod(X^I)} D. Proof of the theorem: Appendix A.3, by induction on |I|. After scalar extension to QCoh(X^I) (one-affineness of X^I and (X^I)_dR), C_{X^I} is the fibre product of C ⊗ QCoh(X^I) and the restriction of C_{X^I} to the complement U of the small diagonal, over C ⊗ QCoh(U). Infinity.localizationPullback_dualizable (Lemma A.2.1) reduces the claim to U; rigidity gives the continuous right adjoint of the tensor functor that the lemma asks for. U is covered by the U(p) with |J| > 1, and there the claim follows from the induction hypothesis and factorization, by Zariski descent for sheaves of categories. The same induction proves that the factorization functors of Ran.CollisionCategory are equivalences over the disjoint locus. The statement is for every D, because Ran.Representations.linearFunctorEquivComodule uses it for every D (in Lemma 6.23.2); the easier case of a dualizable D (Remark 6.18.3) is not enough. For D = QCoh(S) with S affine over X^I no such theorem is needed, since that scalar extension commutes with all limits (Lemma 6.16.2). Provider: here.'
deps = ['GLCinLean.Ran.CollisionCategory', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.localizationPullback_dualizable', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.internalHom', 'GLCinLean.Infinity.limits', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine', 'GLCinLean.Sheaves.sheafOfCategories']
