desc = 'The relative tensor product of the collision category with a module category as a limit, and its self-duality.'

[[node]]
id = 'GLCinLean.Ran.collisionCategory_tensorLimitComparison_isEquivalence'
kind = 'theorem'
desc = 'Let C be compactly generated and rigid ([RaskinCPSI] §6.15), let I be a finite set, and let D be any Dmod(X^I)-module category. The canonical functor from C_{X^I} ⊗_{Dmod(X^I)} D (Ran.CollisionCategory) to the limit over S_I of the categories (C^{⊗K} ⊗ Dmod(U(p))) ⊗_{Dmod(X^I)} D is an equivalence (Lemma 6.18.1). Corollary, in the same module: C_{X^I} is dualizable and self-dual as a Dmod(X^I)-module category (Corollary 6.18.2); give the pairing and the duality data, and the resulting identification of the continuous Dmod(X^I)-linear functors C_{X^I} → D with the objects of C_{X^I} ⊗_{Dmod(X^I)} D. Proof of the theorem: Appendix A.3, by induction over the open sets U(p) of the configuration, with Infinity.localizationPullback_dualizable (Lemma A.2.1) and the one-affineness of X^I and (X^I)_dR. The statement is for every D, because Ran.Representations.linearFunctorEquivComodule uses it for every D (in Lemma 6.23.2); the easier case of a dualizable D (Remark 6.18.3) is not enough. For D = QCoh(S) with S affine over X^I no such theorem is needed, since that scalar extension commutes with all limits (Lemma 6.16.2). Provider: here.'
deps = ['GLCinLean.Ran.CollisionCategory', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.localizationPullback_dualizable', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.internalHom', 'GLCinLean.Infinity.limits', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine']
source = '[RaskinCPSI] Lemma 6.18.1, Corollary 6.18.2, Remark 6.18.3, Lemma A.2.1 and Appendix A.3'
