desc = 'The category Rep(H)_Ran.'

[[node]]
id = 'GLCinLean.Ran.Representations'
kind = 'definition'
desc = 'The de Rham factorization version Rep(H)_Ran, as a category: QCoh of the spread classifying stack (BH)_Ran (Ran.SpreadClassifyingStack), as in [GaitsgoryOutline] §4.2.4. Give also its terms over the powers of the curve: Rep(H)_{X^I} is QCoh of the restriction of (BH)_Ran to (X^I)_dR, a module category over QCoh((X^I)_dR), which is Dmod(X^I) by DModules.leftCrystalsEquivRightCrystals; Rep(H)_Ran is the limit of the Rep(H)_{X^I} along the diagonal pullbacks; and the fibre of (BH)_Ran over n distinct k-points is (BH)^n ([GaitsgoryOutline] §4.2.2), so a product of copies of BH is right only away from the diagonals. Its non-unital symmetric monoidal structure is Hecke.ranConvolution in the plan of the proof; the statement uses Rep(Ǧ)_Ran only as a category. Provider: here.'
deps = ['GLCinLean.Groups.RepresentationCategory', 'GLCinLean.Ran', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.leftCrystalsEquivRightCrystals', 'GLCinLean.Ran.SpreadClassifyingStack', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.moduleCategory']
source = '[GLC1] §1.2.1; [GaitsgoryOutline] §4.2'
