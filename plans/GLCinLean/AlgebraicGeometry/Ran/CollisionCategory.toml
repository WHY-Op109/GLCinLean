desc = 'The collision category C_{X^I} of a symmetric monoidal DG category C over the powers of the curve.'

[[node]]
id = 'GLCinLean.Ran.CollisionCategory'
kind = 'definition'
desc = '''For a presentable symmetric monoidal DG category C whose tensor product is continuous in each variable, a smooth curve X and a finite set I: the Dmod(X^I)-module category C_{X^I} (a module over QCoh((X^I)_dR), which is Dmod(X^I) by DModules.leftCrystalsEquivRightCrystals, as in Ran.Representations), the limit over the category S_I of pairs of surjections Σ = (I ↠ J ↠ K) of the terms Dmod(U(p)) ⊗ C^{⊗K}. Here U(p) ⊆ X^I, for p : I ↠ J, is the open set of points (x_i) with x_i ≠ x_{i'} whenever p(i) ≠ p(i'); the morphisms of S_I are contravariant in J and covariant in K and surjective termwise; and the transition functors are D-module restriction along U(p_2) → U(p_1) tensored with the tensor product C^{⊗K_1} → C^{⊗K_2}. Give its API: the universal property of the limit; the symmetric monoidal structure, linear over Dmod(X^I), and the symmetric monoidal functor Loc_{X^I} : C^{⊗I} → C_{X^I}, compatible with the diagonal maps ([RaskinCPSI] Remark 6.8.4); functoriality in C for continuous symmetric monoidal functors, with Vect_{X^I} = Dmod(X^I); the factorization functors C_{X^{I_1}} ⊗ C_{X^{I_2}} → C_{X^{I_1 ⊔ I_2}} (§6.10); the identification of C_{X^I} over each stratum X^J_disj with C^{⊗J} ⊗ Dmod(X^J_disj), which needs no hypothesis on C; that the factorization functors are equivalences over the disjoint locus is proved for compactly generated rigid C in Ran.collisionCategory_tensorLimitComparison_isEquivalence, because the source's argument interchanges a tensor product with the two limits; the diagonal identifications C_{X^{I_1}} ⊗_{Dmod(X^{I_1})} Dmod(X^{I_2}) ≃ C_{X^{I_2}} for I_1 ↠ I_2 (§6.11), where the scalar extension commutes with the limit because Dmod(X^{I_2}) is a retract of Dmod(X^{I_1}) as a module category; and, for a commutative algebra A of C, the commutative factorization algebra A_{X^I} in C_{X^I} (§§6.13–6.14; for C = Vect it is the limit of the j_{p,*}(A^{⊗K} ⊗ ω_{U(p)}) in Dmod(X^I)). The examples C_X = C ⊗ Dmod(X) and the fibre square for I = {1, 2} (Examples 6.6.1–6.6.2) are proved with the definition. No rigidity is assumed here; it enters in Ran.collisionCategory_isULAModuleCategory and Ran.collisionCategory_tensorLimitComparison_isEquivalence. The users are C = Rep(H), and, in the proof of Ran.Representations.equivCollisionLimit, C = A-mod for a commutative algebra A and QCoh of the affine Čech terms of [RaskinCPSII] (A.5.2). Ran.Representations stays the geometric definition of Rep(H)_{X^I}. Provider: here.'''
deps = ['GLCinLean.Infinity.monoidalCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.limits', 'GLCinLean.Infinity.presentableCategory', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion', 'GLCinLean.DModules.leftCrystalsEquivRightCrystals']
source = '[RaskinCPSI] §§6.5–6.14'
