desc = 'ULA objects and ULA generation of the collision category of a rigid category.'

[[node]]
id = 'GLCinLean.Ran.collisionCategory_isULA'
kind = 'theorem'
desc = 'Let C be compactly generated and rigid in the sense of [RaskinCPSI] §6.15 (the unit is compact and every compact object has a tensor dual), and let I be a finite set. Then: the unit Loc_{X^I}(1_C) of C_{X^I} (Ran.CollisionCategory) is ULA over X^I (Lemma 6.16.2); Loc_{X^I}(F) is ULA for every compact F of C^{⊗I} (Proposition 6.16.1); and C_{X^I} is a ULA module category over X^I, generated in the sense of DModules.IsULAModuleCategory by these objects (Theorem 6.17.1). Proof. For the unit: by one-affineness of X^I and of (X^I)_dR, scalar extension from Dmod(X^I) to QCoh(X^I) commutes with limits, so QCoh(X^I, C_{X^I}) is the same limit with QCoh(U(p)) in place of Dmod(U(p)); the limit is finite and each term of the unit is compact. For Loc(F): Loc is symmetric monoidal and F has a dual. For generation: decreasing induction on |J| over the open sets U(p), with the formal completion of the closed stratum X^J_disj of U(p) and Sheaves.formalCompletion_moduleSupport (Lemma 6.17.2), and the factorization identification of C_{X^I} over that completion with C^{⊗J}. Rigidity is needed: without it Loc_{X^2} does not preserve compact objects (Remark 6.16.3). Provider: here.'
deps = ['GLCinLean.Ran.CollisionCategory', 'GLCinLean.DModules.IsULA', 'GLCinLean.DModules.IsULAModuleCategory', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Sheaves.formalCompletion_moduleSupport', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine', 'GLCinLean.Sheaves.PerfectComplex']
