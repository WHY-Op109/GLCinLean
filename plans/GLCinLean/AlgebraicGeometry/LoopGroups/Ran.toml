desc = 'The loop group and the arc group over the Ran space of a curve: maps from the punctured discs and from the discs around the points of the Ran space, with their factorization.'

[[node]]
id = 'GLCinLean.LoopGroups.RanLoopGroup'
kind = 'definition'
desc = '''The loop group 𝔏(H) and the arc group 𝔏⁺(H) over the Ran space: the factorization prestacks of [GLC2] §§B.3–B.5 and of [GLys] §§7.1–7.2. Let k be a field of characteristic zero, X a smooth separated curve of finite type over k, and H an affine group scheme of finite type over k; no reductivity or pinning is assumed. All prestacks of this node are classical prestacks: functors on the classical affine schemes over k ([GLys] §1.2.1; the restriction to classical affine test schemes of Derived.Prestack). The base is the Ran space of [GLC2] §B.1.1, which is Ran(X_dR) of GLCinLean.Ran: its S-points are the nonempty finite sets of maps S_red → X. The definition uses no coordinate. [GLC2] §B.1.4 tacitly takes test schemes of finite type over the Ran space; the node states (1) to (5) for every classical affine scheme S, with the divisor D of (1). (1) Discs. Let S = Spec R be a classical affine scheme over k and x an S-point of Ran(X_dR). Γ_x is the union of the graphs of the elements of x, a closed subset of S × X. The formal disc D̂_x is the formal completion of S × X along Γ_x (Ran.FormalDisc; [GLC2] §B.3.1); it is a filtered colimit of affine schemes. The disc D_x is the affine scheme whose ring of functions is the limit of the rings of functions of these affine schemes ([GLC2] §B.3.4; [GLys] §7.1.2), and the punctured disc D°_x is the open subscheme D_x ∖ Γ_x ([GLC2] §B.3.7). The elements of x lift to maps S → X, because X is smooth and S is affine. The sum D of the graphs of such lifts is a relative effective Cartier divisor in S × X, finite and locally free over S, with support Γ_x, and its multiples nD for n ≥ 1 are cofinal among the closed subschemes of S × X with support in Γ_x ([GLC2] Example B.5.6). So the ring of D_x is the limit of the rings of the nD. The ideal of D in this ring is invertible: it is the limit of the modules of sections over the nD of the ideal sheaf of D. So D is an effective Cartier divisor in D_x, the ring of D_x maps injectively to the ring of D°_x, and D°_x, the complement of this divisor in an affine scheme, is affine. The map D̂_x → S × X extends in one way to a map of schemes D_x → S × X, although X need not be affine ([GLC2] §B.3.4, by a theorem of Bhatt, with a direct argument in Remark B.3.5); the preimage of Γ_x is Γ_x, so it restricts to a map from D°_x to the complement of Γ_x in S × X. These two maps are natural in S and compatible with the disjoint unions below. The definition (2) does not use them; Hecke.loopGroupAction does. A map S′ → S induces maps D_{x′} → D_x and D°_{x′} → D°_x for the pulled-back point x′, compatibly with composition; D_{x′} is in general not the base change of D_x, also for an open S′ ([GLC2] Remark B.3.6). For two S-points x_1 and x_2 whose graphs do not meet, and their union x, the scheme D_x is the disjoint union of the schemes D_{x_1} and D_{x_2}, and D°_x is the disjoint union of D°_{x_1} and D°_{x_2}; a disjoint union of two affine schemes is an affine scheme. The formal disc D̂_x is the coproduct of D̂_{x_1} and D̂_{x_2} among the disjoint-union-local prestacks of (3), and not among all prestacks: a map from a disconnected affine scheme can send one component to each disc, and then it factors through neither ([GLC2] §§B.3.3 and B.3.11; [GLys] §7.1.1). (2) Definition. For a classical prestack Z, 𝔏⁺(Z) and 𝔏(Z) are the classical prestacks over Ran(X_dR) whose S-points over x are the maps D_x → Z and D°_x → Z ([GLys] §7.1.3). Restriction along D°_x → D_x is a map 𝔏⁺(Z) → 𝔏(Z) over Ran(X_dR). For an affine scheme Z, a map D_x → Z is the same as a map of prestacks D̂_x → Z ([GLys] §7.1.4; [GLC2] §§B.5.4–B.5.5). 𝔏⁺ and 𝔏 are functors of Z that commute with finite limits, so for the group H they are group prestacks over Ran(X_dR), and 𝔏⁺(H) → 𝔏(H) is a monomorphism, because the ring of D_x maps injectively to the ring of D°_x and H is affine. The loop and arc groups over Ran(X) and over a power X^I are the pullbacks along Ran(X) → Ran(X_dR) and X^I → Ran(X_dR); over Ran(X) they are the prestacks of [GLys] §7.1.3, because the discs of an S-point of Ran(X) depend only on its image in Ran(X_dR). So the action groupoids and the gerbes that the nodes of the statement build over Ran(X_dR) restrict to those over Ran(X) and over X^I by pullback. Generality: [GLC2] §B.5.5 states the definition for an affine scheme Y over X, as the maps over X from the discs, with the map D_x → X of (1). The node states the constant case Y = X × Z, which is the case that the nodes of `plans/` use. Loops into a target that is not constant along X, such as a vector bundle on X, are not part of this node; a node that needs them states them with the map of (1). (3) Factorization, for a classical prestack Z that sends the disjoint union of two affine schemes to the product of the values: a disjoint-union-local prestack ([GLC2] §B.3.2). Every scheme and every Zariski sheaf is one, so H is. Let J be a finite set with at least two elements. Over the locus of Ran(X_dR)^J where the J points are pairwise disjoint, the pullback of 𝔏(Z) along the union map (Ran.union) is the product of the pullbacks of 𝔏(Z) from the J factors, by (1); the same holds for 𝔏⁺(Z), compatibly with 𝔏⁺(Z) → 𝔏(Z), with the group structures for Z = H, with refinement of the partition and with permutations of J ([GLC2] §§B.4.2 and B.4.6). Difference from [GLys] §7.1.3, a correction: that section says that 𝔏⁺(Z) and 𝔏(Z) are factorization prestacks for every prestack Z. Without the condition this is false: for the constant functor Z with value a set of two elements, 𝔏(Z) has two points over every x, and over a pair of disjoint points the product of the two pullbacks has four. (4) Representability, for each test scheme: the prestacks 𝔏⁺(H) and 𝔏(H) themselves are not schemes or ind-schemes, because Ran(X_dR) is not one. For every S → Ran(X_dR), S ×_{Ran(X_dR)} 𝔏⁺(H) is an affine group scheme over S: the limit, along smooth surjective maps, of the smooth affine group schemes of finite type over S of the maps to H from the multiples nD of (1), which are Weil restrictions along the finite locally free maps nD → S ([GLys] §7.1.4, for a smooth scheme of finite type; [GLC2] Lemma B.4.8 (a); H is smooth because k has characteristic zero). S ×_{Ran(X_dR)} 𝔏(H) is an ind-affine ind-scheme over S, so a classical ind-scheme (the stage n = 0 of Derived.IsIndscheme): for a finite set of generators of the ring of H, it is the filtered union, along closed embeddings, of the affine S-schemes of the maps g : D°_x → H such that the values of g and of g⁻¹ on the generators have poles of order at most N along D; the pieces depend on the generators and on the lifts that define D, and two choices give families that are cofinal in each other; the piece N = 0 is the arc group, so 𝔏⁺(H) → 𝔏(H) is a closed embedding into a piece ([GLC2] Lemma B.4.8 (b) and (c), with §B.5.5 and Example B.5.6, which writes the pieces for an affine space by the multiples of D; [GLys] §7.2.2 gets the ind-scheme property for a connected group from the quotient by the arc group). The pieces LG_{≤N} of LoopGroups.FormalLoopGroup are defined for the ring R((t)); where the points of x collide there is no coordinate, only the divisor D. So the pieces over S are constructed here, and (5) compares them with the pieces of the roadmap. (5) The comparison with LoopGroups.LoopGroup. Let S = Spec R and let x have one element. A coordinate along x is a lift of x to a map S → X, with graph D, and an isomorphism of R-algebras from the ring of D_x to R[[t]] that carries the ideal of D to the ideal (t). Two examples: a k-point x of X with an isomorphism of the completed local ring of X at x with k[[t]], base-changed to any R; and, for an affine open U of X with an étale map z : U → 𝔸¹, the point x of X(U) given by the inclusion, with t = 1 ⊗ z − z ⊗ 1. A coordinate t identifies D_x with Spec R[[t]] and D°_x with Spec R((t)), compatibly with every base change S′ → S. So it gives an isomorphism i_t from the pullback of 𝔏⁺(H) → 𝔏(H) along x to S × (L⁺H → LH), as group prestacks over S, which carries the pieces of (4), for this D and a finite set of generators of the ring of H, to the pieces S × LH_{≤N} for the same generators. For a second coordinate t′ = φ(t) with the same lift, where φ is in Aut(O)(R), i_{t′} = ρ_φ ∘ i_t, with the left action ρ of LoopGroups.coordinateChange. Check: for H = 𝔾_m and t′ = a·t with a in Rˣ, the loop given by the function t is the series t in the coordinate t and the series a⁻¹·t′ in the coordinate t′, and ρ_{a·t}(t) = a⁻¹·t. (6) Checks. For the trivial group 𝔏 and 𝔏⁺ are Ran(X_dR). For H = 𝔾_m, S = Spec k and x one k-point: the points of 𝔏⁺(𝔾_m) over x are the units of the completed local ring at x, and the points of 𝔏(𝔾_m) over x are the nonzero elements of its fraction field, which are more. Collision: for two S-points x_1 and x_2 with union x, restriction along D_{x_j} → D_x is a map from the fibre of 𝔏⁺(H) over x to the product of its fibres over x_1 and over x_2. It is the isomorphism of (3) when x_1 and x_2 are disjoint. For x_1 = x_2 it is the diagonal g ↦ (g, g) of the group of the arcs over x, which is surjective only when that group is trivial. For 𝔾_a, S = Spec k and a k-point, the pair (0, 1) is not in its image. The test scheme matters: for μ_3 over ℚ and a rational point the group of the arcs over Spec ℚ is trivial, and the diagonal is not surjective exactly over the test schemes that have a cube root of unity other than 1. So for 𝔾_a this restriction map is not an isomorphism on the diagonal. Not part of this node: the Beauville–Laszlo comparison over the Ran space, the action of 𝔏(G) on the Beilinson–Drinfeld Grassmannian and the identification of that Grassmannian with the quotient of 𝔏(G) by 𝔏⁺(G); they are Hecke.loopGroupAction. Provider: here. No accepted roadmap has loop or arc groups over the powers of a curve over a field or over the Ran space: roadmap FormalConnectionsOpers §§3.1–3.2 has the loop group of the disc with a coordinate (LoopGroups.FormalLoopGroup), and its §5.1 uses a curve only to glue the action on opers over the torsor of formal coordinates; roadmap GeometricSatakeAndFusion has loop groups over the divisors of the Fargues–Fontaine curve, as v-sheaves; and the open proposal SheafTheoreticSmithTheory (TauCetiRoadmap #1734) has Beilinson–Drinfeld Grassmannians over the powers of the affine line and no family of loop groups.'''
