desc = 'The loop group and the arc group of an affine group scheme, as group prestacks, with the action of coordinate changes.'

[[node]]
id = 'GLCinLean.LoopGroups.LoopGroup'
kind = 'definition'
desc = 'The loop group LH and the arc group L⁺H of an affine group scheme H of finite type over a field k of characteristic zero, as group prestacks of the plan, with the action of the coordinate changes. No reductivity or pinning is assumed. LH and L⁺H are classical prestacks: set-valued functors on the classical affine schemes over k, which is the restriction to classical affine test schemes of Derived.Prestack and the convention for prestacks of [GLys] §1.2.1. Their values on Spec R are the groups H(R((t))) and H(R[[t]]): they are the group functors LG and L⁺G of LoopGroups.FormalLoopGroup, for the coordinate Hopf algebra of H (`TauCeti.finiteTypeCommHopfAlgCatOpEquivFiniteTypeAffineGroupSchemeCat`). This node does not define these functors, their jets or their pole-bounded pieces again. It states them in the terms of the plan: (1) LH and L⁺H are group objects of classical prestacks, L⁺H → LH is a monomorphism of group prestacks, and both are functors of H. L and L⁺ commute with finite limits of affine group schemes: with finite products, with fibre products, and so with kernels; the central extension argument of AffineGrassmannian.reducedNeutralComponent_iso_simplyConnectedCover uses the kernels. A closed subgroup of H gives subgroups of LH and of L⁺H. (2) L⁺H is an affine scheme: the limit of the jet group schemes J_N H, with J_N H(R) = H(R[t]/t^N) and J_1 H = H. Each J_N H is a smooth affine group scheme of finite type, because H is smooth in characteristic zero and the Weil restriction keeps smoothness (`TauCeti.Algebra.WeilRestriction.instSmooth`). Each map J_{N+1} H → J_N H is surjective on R-points for every R, and for N ≥ 1 its kernel is the vector group of the Lie algebra of H. So the kernel K_1 of evaluation at t = 0, L⁺H → H, is a limit of unipotent groups, and L⁺H is K_1 ⋊ H through the constant loops. L⁺H is not of finite type when H has positive dimension. (3) LH is a classical ind-scheme, the stage n = 0 of Derived.IsIndscheme ([DGIndschemes] §1.1): for each finite presentation of the ring of H it is the filtered union of the affine schemes LH_{≤N} along closed embeddings. The pieces are not of finite type when H has positive dimension. LH is a sheaf for the fpqc topology. A node that needs LH or a quotient of LH as a derived prestack applies the extension of Derived.IsIndscheme to the classical ind-scheme. (4) Coordinate changes. Aut(O), with Aut(O)(R) the group `TauCeti.FormalCoordinate R`, is a group object of classical prestacks, represented by an affine group scheme: the limit of its jet groups. The N-th jet group, of the formal coordinates modulo t^{N+1} (`TauCeti.FormalCoordinate.Jet`), is trivial for N = 0, because a formal coordinate has constant coefficient zero; for N ≥ 1 it is represented by 𝔾_m × 𝔸^{N−1}, for the linear coefficient and the coefficients of t², …, t^N, with the group law of truncated composition. This node proves the representability; `TauCeti.FormalCoordinate.strictCoeffsEquiv` gives the coefficients of a coordinate with linear coefficient 1, and `TauCeti.FormalCoordinate.homothety` is a section of the linear coefficient. It acts on LH by automorphisms of group prestacks (LoopGroups.coordinateChange), and the action preserves L⁺H, each congruence subgroup and each piece LH_{≤N}; so LH ⋊ Aut(O) and L⁺H ⋊ Aut(O) are group prestacks. This is the action of Aut(O) on the loop group and the arc group of [MV] §2. The action that it induces on the quotient of LH by L⁺H is part of GLCinLean.AffineGrassmannian. (5) Checks, in terms of prestacks; the checks on points are those of LoopGroups.FormalLoopGroup. For the trivial group both prestacks are the point Spec k. L𝔾_m is not reduced: the subgroup prestack ℤ × L⁺𝔾_m, of the points t^n·u with n a locally constant integer and u in L⁺𝔾_m, has the same points as L𝔾_m over every reduced R, and the point 1 + εt⁻¹ over F[ε]/(ε²), for a field F over k, is not in it. Not part of this node: the values of a loop group on derived affine schemes that are not classical. [DGIndschemes] §9.2.1 defines them as the maps from Spec A((t)) to H; Proposition 9.2.4 says that the result is a DG ind-scheme for an affine target almost of finite type, which H is; and Theorem 9.3.5 says that for an algebraic group it is 0-coconnective, that is, determined by its restriction to classical affine schemes. No node of `plans/` uses them: gerbes on a prestack are tested on classical affine schemes (Stacks.EtaleGerbe), and the de Rham prestack, and so every category of D-modules, depends only on the reduced classical affine schemes (Derived.DeRhamPrestack). The families of loop and arc groups over the Ran space are LoopGroups.RanLoopGroup. Provider: here, for the statements in terms of prestacks. The functors, the congruence subgroups, the jets, the pole-bounded pieces and the fpqc sheaf property are roadmap FormalConnectionsOpers §§3.1–3.2 (LoopGroups.FormalLoopGroup), and the action of Aut(O) is §1.2 of the same roadmap (LoopGroups.coordinateChange). Upstream declarations used: `TauCeti.finiteTypeCommHopfAlgCatOpEquivFiniteTypeAffineGroupSchemeCat` (`TauCeti.AlgebraicGeometry.AffineGroupScheme.FiniteType`), `TauCeti.Algebra.WeilRestriction.instSmooth` (`TauCeti.RingTheory.WeilRestriction.Smooth`), `TauCeti.FormalCoordinate`, `TauCeti.FormalCoordinate.strictCoeffsEquiv` and `TauCeti.FormalCoordinate.homothety` (`TauCeti.RingTheory.PowerSeries.Coordinate.Basic`), `TauCeti.FormalCoordinate.Jet` and `TauCeti.FormalCoordinate.jetLimitEquiv` (`TauCeti.RingTheory.PowerSeries.Coordinate.Jet`).'
