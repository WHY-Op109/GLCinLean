desc = 'The tensor product, the dual and the twist of n-th roots of invertible sheaves on a scheme.'

[[node]]
id = 'GLCinLean.LineBundle.Root.tensorProduct'
kind = 'definition'
desc = 'For invertible sheaves L and L′ on a scheme X and a natural number n, the tensor product of an n-th root (M, φ) of L and an n-th root (M′, φ′) of L′ (LineBundle.Root): the n-th root M ⊗ M′ of L ⊗ L′, with the isomorphism (M ⊗ M′)^{⊗n} ≅ M^{⊗n} ⊗ M′^{⊗n} ≅ L ⊗ L′. It is a functor on the product of the two groupoids of roots, compatible with the associativity, commutativity and unit isomorphisms of the tensor product of invertible sheaves; its unit is the trivial root of 𝒪. The dual of a root (M, φ) of L is the n-th root M^{-1} of L^{-1}, with the isomorphism ψ : (M^{-1})^{⊗n} ≅ L^{-1} for which M ⊗ M^{-1} ≅ 𝒪 is an isomorphism of roots from the tensor product of the root and its dual to the trivial root of 𝒪, over L ⊗ L^{-1} ≅ 𝒪. The twist of a root of L by an invertible sheaf N with an isomorphism N^{⊗n} ≅ 𝒪 is the tensor product with the root N of 𝒪, followed by L ⊗ 𝒪 ≅ L. For two roots (M, φ) and (M′, φ′) of the same L, the sheaf M′ ⊗ M^{-1} is a root of 𝒪, and the twist of (M, φ) by it is isomorphic to (M′, φ′). No hypothesis on n or on X. Stacks.rootGerbe uses these operations; no roadmap target states them. The node is about one scheme: the compatibility of these operations with the pullback of roots is LineBundle.Root.pullbackTensorProductIso. Construction: the n-th tensor power is a braided monoidal functor from the symmetric monoidal category `InvertibleSheaf X` to itself. It is CategoryTheory.tensorPowFunctor applied to `InvertibleSheaf X`, which is a symmetric monoidal category in Tau Ceti; the instances of the module of CategoryTheory.tensorPowFunctor make it braided monoidal. Its value on M is `TauCeti.tensorPow` of M by definition, and this is the M^{⊗n} of LineBundle.Root; so the node compares no two tensor powers. It uses no groupoid of invertible sheaves: the arrows of roots are isomorphisms of `InvertibleSheaf X`. The groupoid of roots of L is the fibre of this functor over L: the pairs (M, φ : M^{⊗n} ≅ L), with the isomorphisms of M that respect φ. The operations on roots are the operations that a braided monoidal functor gives on its fibres. The isomorphism (M ⊗ M′)^{⊗n} ≅ M^{⊗n} ⊗ M′^{⊗n} is the inverse of the tensor comparison of the functor, and it is `TauCeti.tensorPowTensorIso`, because `InvertibleSheaf X` is symmetric (`tensorPowFunctor_δ`); 𝟙^{⊗n} ≅ 𝟙 is the inverse of its unit comparison, and it is `TauCeti.tensorPowUnitIso` (`tensorPowFunctor_η`); the tensor product is a functor because the tensor comparison is natural; and its compatibility with the associativity, unit and commutativity isomorphisms is the associativity, the unitality and the braiding axiom of the functor. So the coherence is not proved again from single isomorphisms. The tensor product L ⊗ L′ and the unit 𝟙 are those of the monoidal category `InvertibleSheaf X`. They are isomorphic to `InvertibleSheaf.tensorProduct` and to `InvertibleSheaf.trivial` by `InvertibleSheaf.tensorProductIsoTensor` and `InvertibleSheaf.trivialIsoTensorUnit`; what Tau Ceti states for the latter two is carried over by these isomorphisms and by the equivalence of roots for an isomorphism L ≅ L′. The unit of the tensor product of roots is identified with the trivial root of LineBundle.Root, whose isomorphism 𝒪^{⊗n} ≅ 𝒪 is `InvertibleSheaf.tensorPowTrivialIso`, that is `TauCeti.tensorPowUnitIso` carried along `trivialIsoTensorUnit` (`tensorPowTrivialIso_def`); the identification is `tensorPowFunctor_η`. The dual: tensor inverses are specified in Tau Ceti, by the dual `InvertibleSheaf.dual` and the isomorphism L ⊗ L^{-1} ≅ 𝒪 `InvertibleSheaf.tensorDualIso`, which is carried to an isomorphism L ⊗ L^{-1} ≅ 𝟙 of the monoidal category. In the module of CategoryTheory.tensorPowFunctor, `tensorPowTensorIsoUnit` sends the isomorphism M ⊗ M^{-1} ≅ 𝟙 to an isomorphism M^{⊗n} ⊗ (M^{-1})^{⊗n} ≅ 𝟙. The isomorphism ψ of the dual root is defined by its property: ψ is the unique isomorphism (M^{-1})^{⊗n} ≅ L^{-1} such that φ ⊗ ψ followed by L ⊗ L^{-1} ≅ 𝟙 is `tensorPowTensorIsoUnit` of M ⊗ M^{-1} ≅ 𝟙. This equation says that M ⊗ M^{-1} ≅ 𝟙 is an arrow of roots to the trivial root, so that clause holds by the definition. ψ exists and is unique because tensoring with an object that has a tensor inverse is fully faithful: `CategoryTheory.MonoidalCategory.tensorRightEquivalenceOfIso` for the right factor, carried to the left factor by the braiding. The node does not define ψ by a formula through the braiding and `tensorPowInverseIso`: such a formula satisfies the equation only up to the symmetry of M^{⊗n} ⊗ M^{⊗n}, and Tau Ceti does not state that this symmetry is the identity for an invertible sheaf. The dual of an arrow ρ : M ≅ M₁ of roots is `InvertibleSheaf.dualCongr` of ρ. It is an arrow of the dual roots by the uniqueness of ψ and one lemma that Tau Ceti does not have and that the node proves: `dualCongr` respects `tensorDualIso`, that is, ρ ⊗ `dualCongr` ρ followed by M₁ ⊗ M₁^{-1} ≅ 𝒪 is M ⊗ M^{-1} ≅ 𝒪. The same lemma for an isomorphism L ≅ L′ makes the dual compatible with the equivalence of roots. New in this node: the operations on roots. Used from LineBundle.Root: the groupoid of roots, its equivalence for an isomorphism L ≅ L′, the trivial root, and the specified isomorphism L^{⊗n} ≅ K^{⊗n} for an isomorphism L ≅ K. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.dual`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorDualIso` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.dualCongr` (`TauCeti.AlgebraicGeometry.LineBundle.Dual`), `TauCeti.AlgebraicGeometry.SheafOfModules.isMonoidal_isInvertible`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.trivialIsoTensorUnit` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorPowTrivialIso` (`TauCeti.AlgebraicGeometry.LineBundle.Power`), `TauCeti.tensorPow` and `TauCeti.tensorPowUnitIso` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`), `TauCeti.tensorPowTensorIso` (`TauCeti.CategoryTheory.Monoidal.Braided.TensorPow`), `CategoryTheory.MonoidalCategory.tensorRightEquivalenceOfIso` (`TauCeti.CategoryTheory.Monoidal.InvertibleObject`), `CategoryTheory.Functor.Monoidal` (`Mathlib.CategoryTheory.Monoidal.Functor`), `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`).'
deps = ['GLCinLean.LineBundle.Root', 'GLCinLean.CategoryTheory.tensorPowFunctor']
source = '[GLys] §§1.4.2 and 1.4.4'
