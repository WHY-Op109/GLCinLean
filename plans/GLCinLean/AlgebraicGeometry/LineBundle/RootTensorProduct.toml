desc = 'The tensor product, the dual and the twist of n-th roots of invertible sheaves on a scheme.'

[[node]]
id = 'GLCinLean.LineBundle.Root.tensorProduct'
kind = 'definition'
desc = 'For invertible sheaves L and L′ on a scheme X and a natural number n, the tensor product of an n-th root (M, φ) of L and an n-th root (M′, φ′) of L′ (LineBundle.Root): the n-th root M ⊗ M′ of L ⊗ L′, with the isomorphism (M ⊗ M′)^{⊗n} ≅ M^{⊗n} ⊗ M′^{⊗n} ≅ L ⊗ L′. It is a functor on the product of the two groupoids of roots, compatible with pullback of roots and with the associativity, commutativity and unit isomorphisms of the tensor product of invertible sheaves. The dual of a root (M, φ) of L is the n-th root M^{-1} of L^{-1}, with the isomorphism (M^{-1})^{⊗n} ≅ (M^{⊗n})^{-1} ≅ L^{-1}; the tensor product of a root and its dual is isomorphic to the trivial root of 𝒪, over L ⊗ L^{-1} ≅ 𝒪. The twist of a root of L by an invertible sheaf N with an isomorphism N^{⊗n} ≅ 𝒪 is the tensor product with the root N of 𝒪, followed by L ⊗ 𝒪 ≅ L. For two roots (M, φ) and (M′, φ′) of the same L, the sheaf M′ ⊗ M^{-1} is a root of 𝒪, and the twist of (M, φ) by it is isomorphic to (M′, φ′). No hypothesis on n or on X. Stacks.rootGerbe uses these operations; no roadmap target states them. Construction: the n-th tensor power is a symmetric monoidal functor from the Picard groupoid of X to itself (LineBundle.picardGroupoid), and the groupoid of roots of L is its fibre over L; the operations on roots are the operations that a symmetric monoidal functor of Picard groupoids gives on its fibres, so their coherence comes from the Picard groupoid and from its symmetric monoidal pullback, and is not proved again from single isomorphisms. The symmetric monoidal structure of the n-th tensor power functor of a symmetric monoidal category is CategoryTheory.tensorPowFunctor; it is stated with the tensor power `TauCeti.tensorPow` of an object of a monoidal category, for which `TauCeti.tensorPow X (n + 1)` is X ⊗ `TauCeti.tensorPow X n`, while roots use `InvertibleSheaf.tensorPow`, for which L^{⊗(n+1)} is L^{⊗n} ⊗ L. New in this node: (1) the comparison of the two tensor powers on the Picard groupoid of X, an isomorphism between `InvertibleSheaf.tensorPow L n` and `TauCeti.tensorPow L n`, natural in L and compatible with pullback, built by induction on n with `tensorPowSuccIso`; through it the tensor comparison of CategoryTheory.tensorPowFunctor gives (M ⊗ M′)^{⊗n} ≅ M^{⊗n} ⊗ M′^{⊗n}, and (M^{-1})^{⊗n} ≅ (M^{⊗n})^{-1} follows, since a monoidal functor preserves tensor inverses; (2) the operations on roots. Used from LineBundle.Root: the groupoid of roots, its pullback, its equivalence for an isomorphism L ≅ L′, the trivial root, and the specified isomorphisms L^{⊗n} ≅ K^{⊗n} and f^*(L^{⊗n}) ≅ (f^*L)^{⊗n}. Used from LineBundle.picardGroupoid: the symmetric monoidal structure, the tensor inverses, and the symmetric monoidal pullback, whose tensor comparison is the isomorphism of LineBundle.pullbackTensorIso. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorPow` (`TauCeti.AlgebraicGeometry.LineBundle.Power`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.dual` (`TauCeti.AlgebraicGeometry.LineBundle.Dual`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.tensorPow` and `TauCeti.tensorPowSuccIso` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`), `CategoryTheory.Functor.Monoidal` (`Mathlib.CategoryTheory.Monoidal.Functor`).'
deps = ['GLCinLean.LineBundle.Root', 'GLCinLean.LineBundle.picardGroupoid', 'GLCinLean.CategoryTheory.tensorPowFunctor']
source = '[GLys] §§1.4.2 and 1.4.4'
