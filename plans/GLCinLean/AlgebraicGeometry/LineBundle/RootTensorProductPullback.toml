desc = 'The compatibility of the tensor product, the dual and the twist of n-th roots of invertible sheaves with pullback along a map of schemes.'

[[node]]
id = 'GLCinLean.LineBundle.Root.pullbackTensorProductIso'
kind = 'definition'
desc = 'For a map of schemes f : X′ → X, invertible sheaves L and L′ on X and a natural number n: the compatibility of the tensor product of roots (LineBundle.Root.tensorProduct) with the pullback of roots (LineBundle.Root). For an n-th root (M, φ) of L and an n-th root (M′, φ′) of L′, it is an isomorphism of n-th roots of f^*L ⊗ f^*L′ from the pullback of the root (M, φ) ⊗ (M′, φ′), carried along f^*(L ⊗ L′) ≅ f^*L ⊗ f^*L′, to the tensor product of the pullbacks of the two roots. Its underlying isomorphism of invertible sheaves is the tensor comparison f^*(M ⊗ M′) ≅ f^*M ⊗ f^*M′ of the pullback. It is natural in the two roots; it is compatible with the associativity, commutativity and unit isomorphisms of the tensor product of roots; the pullback of the trivial root is the trivial root, compatibly; and it is compatible with the isomorphisms of the pullback of roots for the identity map and for a composite of two maps. With it: the pullback of the dual of a root is isomorphic to the dual of its pullback, and the pullback of a twist is the twist by the pullback. No hypothesis on n, on the schemes or on f. Stacks.rootGerbe uses it: the equivalences R_n(L) ⊗ R_n(M) ≃ R_n(L ⊗ M) and R_n(L)^{-1} ≃ R_n(L^{-1}) are maps of gerbes on a big étale site, so the operations on roots must commute with the pullback along every map of test schemes. No roadmap target states it. Construction: the pullback of invertible sheaves is a braided monoidal functor, by the instance on the functor `InvertibleSheaf.pullback` that LineBundle.pullbackBraided gives, with these facts from the same node. Its inverse tensor comparison f^*(M ⊗ M′) ≅ f^*M ⊗ f^*M′ is, on underlying module sheaves, the tensor comparison of the pullback of module sheaves; so it is `InvertibleSheaf.pullbackTensorProductIso`, carried to the tensor product of the category `InvertibleSheaf` by `InvertibleSheaf.tensorProductIsoTensor`. Its inverse unit comparison f^*𝟙 ≅ 𝟙 is, on underlying module sheaves, `AlgebraicGeometry.Scheme.Modules.pullbackObjUnitIso`. The isomorphisms `InvertibleSheaf.pullbackId` and `InvertibleSheaf.pullbackComp` are monoidal. For a monoidal functor G, the module of CategoryTheory.tensorPowFunctor has the isomorphism `tensorPowFunctorCompIso` from G(M^{⊗n}) to G(M)^{⊗n}, natural in M: for n = 0 it is the inverse unit comparison of G, and for n + 1 it is the inverse tensor comparison G(M ⊗ M^{⊗n}) ≅ G(M) ⊗ G(M^{⊗n}) followed by G(M) ⊗ (the isomorphism for n). For a braided G it is a monoidal natural isomorphism (`isMonoidal_tensorPowFunctorCompIso_hom`). For G the pullback, monoidal says that the two isomorphisms from f^*((M ⊗ M′)^{⊗n}) to (f^*M)^{⊗n} ⊗ (f^*M′)^{⊗n} agree, and that f^*(𝟙^{⊗n}) ≅ 𝟙^{⊗n} is compatible with the two unit comparisons; these are the statements that the tensor comparison of the pullback is an arrow of roots, and that the pullback of the trivial root is the trivial root. The node proves first that the specified isomorphism f^*(L^{⊗n}) ≅ (f^*L)^{⊗n} of LineBundle.Root is `tensorPowFunctorCompIso` of the pullback at L. LineBundle.Root defines its isomorphism by the same recursion on n, from the same two comparisons: for n = 0 the isomorphism f^*𝟙 ≅ 𝟙 above, and for n + 1 the tensor comparison followed by the isomorphism for n. The case n = 0 must be checked on its own: there the comparison is the unit comparison alone, and no tensor comparison constrains it. The compatibility with the identity map and with a composite follows from the monoidal `pullbackId` and `pullbackComp` and from two lemmas on `tensorPowFunctorCompIso`, which the node adds to the module of CategoryTheory.tensorPowFunctor: its value on a composite of two monoidal functors, and its naturality for a monoidal natural transformation. The pullback of the dual: the isomorphism f^*(M^{-1}) ≅ (f^*M)^{-1} is `FiniteLocallyFreeSheaf.pullbackDualIso` of Tau Ceti, read for invertible sheaves through `InvertibleSheaf.toFiniteLocallyFree`. The node proves that f^*M ⊗ f^*(M^{-1}) ≅ f^*M ⊗ (f^*M)^{-1} ≅ 𝟙 is the image of M ⊗ M^{-1} ≅ 𝟙 under the pullback (`Functor.Monoidal.mapTensorIsoUnit` of the module of CategoryTheory.tensorPowFunctor), from the equation that characterizes the comparison of the pullback with the internal Hom: its evaluation is the pullback of the evaluation, preceded by the tensor comparison (`whiskerLeft_pullbackIhomComparison_app_comp_ev`). By the uniqueness that defines the dual of a root (LineBundle.Root.tensorProduct), it is then an isomorphism from the pullback of the dual root to the dual of the pullback, and no formula through the braiding is used. Used from LineBundle.pullbackBraided: the braided monoidal instance on `InvertibleSheaf.pullback`, the equations of its two comparisons on underlying module sheaves, and the monoidal `pullbackId` and `pullbackComp`. The node uses no Picard groupoid (LineBundle.picardGroupoid): not its class, not the core, and not the existence of tensor inverses. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullback` (`TauCeti.AlgebraicGeometry.LineBundle.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackId`, `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackComp` and `TauCeti.AlgebraicGeometry.InvertibleSheaf.pullbackTensorProductIso` (`TauCeti.AlgebraicGeometry.LineBundle.Functoriality`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `AlgebraicGeometry.Scheme.Modules.pullbackObjUnitIso` (`TauCeti.AlgebraicGeometry.Modules.Pullback.Basic`), `TauCeti.AlgebraicGeometry.FiniteLocallyFreeSheaf.pullbackDualIso` (`TauCeti.AlgebraicGeometry.VectorBundle.Dual.Pullback`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.toFiniteLocallyFree` (`TauCeti.AlgebraicGeometry.VectorBundle.FiniteLocallyFree`), `TauCeti.AlgebraicGeometry.whiskerLeft_pullbackIhomComparison_app_comp_ev` (`TauCeti.AlgebraicGeometry.Modules.Pullback.InternalHom.Basic`), `TauCeti.tensorPow` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`), `CategoryTheory.Functor.Braided` (`Mathlib.CategoryTheory.Monoidal.Braided.Basic`), `CategoryTheory.NatTrans.IsMonoidal` (`Mathlib.CategoryTheory.Monoidal.NaturalTransformation`).'
deps = ['GLCinLean.LineBundle.Root', 'GLCinLean.LineBundle.Root.tensorProduct', 'GLCinLean.LineBundle.pullbackBraided', 'GLCinLean.CategoryTheory.tensorPowFunctor']
