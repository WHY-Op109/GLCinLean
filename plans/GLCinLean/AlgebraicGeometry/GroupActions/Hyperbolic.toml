desc = 'Fixed points, attractors, repellers and interpolation for G_m-actions on schemes, with representability for locally linear actions.'

[[node]]
id = 'GLCinLean.Actions.hyperbolicInterpolation'
kind = 'definition'
desc = 'For an action of G_m on a scheme Z of finite type, the fixed-point functor Z^0, the attractor and repeller functors Z^+ and Z^-, and the one-parameter interpolation Z̃ → A¹, whose fibre at t ≠ 0 is the graph of the action of t and whose fibre at 0 is Z^+ ×_{Z^0} Z^-, as prestacks. Prove that they are representable by schemes of finite type, with the fibre formulas, for locally linear actions (Z covered by G_m-stable affine opens), the case of Schubert varieties. Representability for actions on algebraic spaces is not planned: no node uses it. Provider: here. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`).'
deps = ['GLCinLean.Derived.Prestack', 'GLCinLean.Derived.MappingPrestack']
source = '[BradenDG] §§1.2–1.4, 1.8–1.9, 2.1–2.4; Propositions 2.2.6, 2.2.9 and Theorem 2.4.2'
