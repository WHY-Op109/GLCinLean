desc = 'Theta characteristics of a smooth curve.'

[[node]]
id = 'GLCinLean.Curves.ThetaCharacteristic'
kind = 'definition'
desc = 'A theta characteristic of a smooth curve X over a base scheme S (smooth of relative dimension one): a square root of the relative canonical bundle Ω¹_{X/S}, that is, LineBundle.Root with n = 2 and L = Ω¹_{X/S}, kept as data. The definition asks for no properness, no connectedness and no condition on the base. Over an affine base Spec R, for X smooth of relative dimension one over Spec R, Ω¹ is the invertible sheaf `TauCeti.AlgebraicGeometry.InvertibleSheaf.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Rank`), whose underlying sheaf is `Scheme.relativeDifferentials`. For this base, which is the base of Statement.Setting and of the example, state with the definition the conversion between a theta characteristic (M, φ) and a pair in the form of Statement.Setting. In a theta characteristic, φ : M^{⊗2} ≅ Ω¹ is an isomorphism of invertible sheaves from `TauCeti.tensorPow` with exponent 2, that is M ⊗ (M ⊗ 𝟙). In Statement.Setting the isomorphism is M ⊗ M ≅ Ω¹ of module sheaves, from the underlying sheaf of `InvertibleSheaf.tensorProduct`. The two differ by `InvertibleSheaf.tensorProductIsoTensor` and the right unit isomorphism of M, whiskered on the left by M; for a fixed M the conversion is a bijection between the two kinds of isomorphisms. The example is Curves.thetaCharacteristicProjectiveLine, over every commutative ring. The existence of a theta characteristic on every smooth proper connected curve over an algebraically closed field is not planned: [GLC1] §1.3.2 fixes a square root, Statement.Setting takes one as data, and no node uses the existence. Provider: here. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProductIsoTensor` (`TauCeti.AlgebraicGeometry.LineBundle.Monoidal`), `TauCeti.tensorPow` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`).'
deps = ['GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2; [GLC2] §1.1.1'
