desc = 'Theta characteristics of a smooth proper connected curve, and their existence.'

[[node]]
id = 'GLCinLean.Curves.thetaCharacteristic'
kind = 'definition'
desc = 'A line bundle L on a smooth proper connected curve with a chosen L⊗L ≅ Ω¹; keep the isomorphism as data. Provider: here. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.tensorProduct` (`TauCeti.AlgebraicGeometry.LineBundle.TensorProduct`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`), `AlgebraicGeometry.IsProper` (`Mathlib.AlgebraicGeometry.Morphisms.Proper`), `ConnectedSpace` (`Mathlib.Topology.Connected.Basic`).'
source = '[GLC1] §1.3.2; [GLC2] §0.4.1'

[[node]]
id = 'GLCinLean.Curves.thetaCharacteristic_exists'
kind = 'theorem'
desc = 'Existence of theta characteristics over an algebraically closed characteristic-zero field; include a projective-line example. Provider: here, from roadmap JacobianChallenge: the degree of the canonical bundle, the Picard variety, and multiplication by two on abelian varieties. Upstream declarations used: `IsAlgClosed` (`Mathlib.FieldTheory.IsAlgClosed.Basic`), `CharZero` (`Mathlib.Algebra.CharZero.Defs`).'
deps = ['GLCinLean.Curves.thetaCharacteristic']
