desc = 'Theta characteristics of a smooth curve.'

[[node]]
id = 'GLCinLean.Curves.ThetaCharacteristic'
kind = 'definition'
desc = 'A theta characteristic of a smooth curve X over a base scheme S (smooth of relative dimension one): a square root of the relative canonical bundle Ω¹_{X/S}, that is, LineBundle.Root with n = 2 and L = Ω¹_{X/S}, kept as data. The definition asks for no properness, no connectedness and no condition on the base. The example is Curves.thetaCharacteristicProjectiveLine. The existence of a theta characteristic on every smooth proper connected curve over an algebraically closed field is not planned: [GLC1] §1.3.2 fixes a square root, Statement.Setting takes one as data, and no node uses the existence. Provider: here. Upstream declarations used: `AlgebraicGeometry.Scheme` (`Mathlib.AlgebraicGeometry.Scheme`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`), `AlgebraicGeometry.SmoothOfRelativeDimension` (`Mathlib.AlgebraicGeometry.Morphisms.Smooth`).'
deps = ['GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2; [GLC2] §1.1.1'
