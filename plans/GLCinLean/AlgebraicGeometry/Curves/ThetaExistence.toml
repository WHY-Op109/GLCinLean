desc = 'Existence of theta characteristics on a smooth proper connected curve over an algebraically closed field.'

[[node]]
id = 'GLCinLean.Curves.nonempty_thetaCharacteristic'
kind = 'theorem'
desc = 'Existence of theta characteristics on a smooth proper connected curve X over an algebraically closed field; include a projective-line example. Proof: X has a k-point x₀ since k is algebraically closed, and X is geometrically connected since it is connected over an algebraically closed field. deg ω_X = 2g − 2 is even (Curves.degree_canonical). Let M = 𝒪((g − 1)x₀), of degree g − 1 since degree is a homomorphism with deg 𝒪(x₀) = 1 (Curves.picard_degree); then ω_X ⊗ M^{-2} has degree zero and is a k-point of Pic⁰ (Curves.picardZero_isAbelianVariety). Multiplication by 2 on the abelian variety Pic⁰ is a surjective isogeny (Curves.abelianVariety_multiplication_surjective), so it is surjective on k-points over the algebraically closed field k; this gives N with N² ≅ ω_X ⊗ M^{-2}. Take L = M ⊗ N. Provider: here. Upstream declarations used: `IsAlgClosed` (`Mathlib.FieldTheory.IsAlgClosed.Basic`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.Curves.picard_degree', 'GLCinLean.Curves.degree_canonical', 'GLCinLean.Curves.picardZero_isAbelianVariety', 'GLCinLean.Curves.abelianVariety_multiplication_surjective']
source = '[GLC1] §1.3.2'
