desc = 'Existence of theta characteristics on a smooth proper connected curve over an algebraically closed field.'

[[node]]
id = 'GLCinLean.Curves.nonempty_thetaCharacteristic'
kind = 'theorem'
desc = 'Existence of theta characteristics on a smooth proper connected curve X over an algebraically closed field k; the projective line is the separate node Curves.thetaCharacteristicProjectiveLine. Proof: X has a k-point x₀ since k is algebraically closed, and X is geometrically connected since it is connected over an algebraically closed field. So X satisfies the hypotheses of the Tau Ceti degree theorems, which are stated for a proper integral curve with discrete valuation rings in codimension one: `InvertibleSheaf.high_degree_hypotheses_of_smooth` gives integrality, the discrete valuation rings, codimension at most one and the exact constant field; `finiteDimensional_cohomology_one_trivial_of_smooth` gives that H¹(X, 𝒪_X) is finite-dimensional; `isInvertible_relativeDifferentials` gives that Ω_{X/k} is invertible; X is Noetherian and separated since it is proper over k; the image of x₀ is a point of codimension one by `isClosed_singleton_of_section` and `coheight_eq_of_isClosed_of_smoothOfRelativeDimension`. The degree is `LineBundleClass.eulerDegreeHom`, deg L = χ(L) − χ(𝒪_X), a group homomorphism from the group of isomorphism classes of line bundles to ℤ, and g = dim H¹(X, 𝒪_X) is `Scheme.genus`. deg ω_X = 2g − 2 is even (`eulerDegree_relativeDifferentials`). Let M = 𝒪((g − 1)x₀), of degree g − 1 since the degree is a homomorphism with deg 𝒪(x₀) = 1 (`eulerDegree_toLineBundleClass_ofPoint_of_section`); then ω_X ⊗ M^{-2} has degree zero, so its class is in `LineBundleClass.picZero`, and it is a k-point of Pic⁰ (Curves.picardZero_isAbelianVariety). Multiplication by 2 on the abelian variety Pic⁰ is a surjective isogeny (Curves.abelianVariety_multiplication_surjective), so it is surjective on k-points over the algebraically closed field k; this gives N with N² ≅ ω_X ⊗ M^{-2}. Take L = M ⊗ N. Provider: here. Upstream declarations used: `IsAlgClosed` (`Mathlib.FieldTheory.IsAlgClosed.Basic`), `TauCeti.AlgebraicGeometry.LineBundleClass.eulerDegreeHom` and `TauCeti.AlgebraicGeometry.LineBundleClass.picZero` (`TauCeti.AlgebraicGeometry.WeilDivisor.Scheme.PicZero`), `TauCeti.AlgebraicGeometry.eulerDegree_toLineBundleClass_ofPoint_of_section` (`TauCeti.AlgebraicGeometry.RationalPoint.Degree`), `TauCeti.AlgebraicGeometry.eulerDegree_relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Canonical`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.high_degree_hypotheses_of_smooth` (`TauCeti.AlgebraicGeometry.Curves.HighDegree`), `TauCeti.AlgebraicGeometry.finiteDimensional_cohomology_one_trivial_of_smooth` (`TauCeti.AlgebraicGeometry.WeilDivisor.Scheme.RiemannRoch.Finiteness`), `TauCeti.AlgebraicGeometry.isInvertible_relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Rank`), `TauCeti.AlgebraicGeometry.isClosed_singleton_of_section` (`TauCeti.AlgebraicGeometry.RationalPoint.Basic`), `TauCeti.AlgebraicGeometry.coheight_eq_of_isClosed_of_smoothOfRelativeDimension` (`TauCeti.AlgebraicGeometry.Morphisms.Smooth.RelativeDimension`), `AlgebraicGeometry.Scheme.genus` (`TauCeti.AlgebraicGeometry.Cohomology.Genus`), `AlgebraicGeometry.Scheme.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Basic`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.Curves.picardZero_isAbelianVariety', 'GLCinLean.Curves.abelianVariety_multiplication_surjective']
