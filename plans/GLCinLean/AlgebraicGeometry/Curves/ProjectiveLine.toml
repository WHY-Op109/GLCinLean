desc = 'A theta characteristic of the projective line.'

[[node]]
id = 'GLCinLean.Curves.thetaCharacteristicProjectiveLine'
kind = 'definition'
desc = 'A theta characteristic of the projective line ℙ¹ over a field k, with underlying line bundle 𝒪(−1): Ω¹ has degree 2g − 2 = −2 because the genus is 0, 𝒪(−1)^{⊗2} has degree −2, and line bundles on ℙ¹ are classified by their degree, so Ω¹ ≅ 𝒪(−1)^{⊗2}. The node chooses an isomorphism from this classification, which gives existence only; it is unique up to a scalar in k^×, and no user may depend on which one it is. Tau Ceti at the pin also has a specified isomorphism Ω¹ ≅ 𝒪(−2) on the projective line over every commutative ring, `TauCeti.AlgebraicGeometry.projectiveLine.relativeDifferentialsIsoTwistingSheaf` (`TauCeti.AlgebraicGeometry.Modules.Differentials.ProjectiveLine`), and the isomorphism 𝒪(m) ⊗ 𝒪(n) ≅ 𝒪(m + n), `AlgebraicGeometry.Proj.twistingSheaf.tensorProductIso` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.TensorProduct`). To build the theta characteristic from these two, with no choice, is a change of the construction that is not made yet (`STATUS.md`, "Open items"). Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.projectiveLine` and `TauCeti.AlgebraicGeometry.projectiveLine.smoothOfRelativeDimension` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.ProjectiveLine`), `AlgebraicGeometry.Proj.twistingSheaf` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.Basic`), `TauCeti.AlgebraicGeometry.projectiveLine.genus_eq_zero` (`TauCeti.AlgebraicGeometry.Cohomology.ProjectiveLine.Basic`), `TauCeti.AlgebraicGeometry.projectiveLine.nonempty_iso_twistingSheaf_iff` and `TauCeti.AlgebraicGeometry.projectiveLine.eulerDegree_twistingSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.ProjectiveLine`), `TauCeti.AlgebraicGeometry.LineBundleClass.mk_tensorPow` (`TauCeti.AlgebraicGeometry.LineBundle.Power`), `TauCeti.AlgebraicGeometry.eulerDegree_relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Canonical`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2'
