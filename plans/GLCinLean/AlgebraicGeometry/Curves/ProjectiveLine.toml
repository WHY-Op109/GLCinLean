id = 'GLCinLean.Curves.thetaCharacteristicProjectiveLine'
kind = 'definition'
desc = 'A theta characteristic of the projective line ℙ¹_R over a commutative ring R, with no choice: the square root (𝒪(−1), φ) of the canonical bundle Ω¹ of ℙ¹_R over Spec R, an object of LineBundle.Root with n = 2 (Curves.ThetaCharacteristic). The curve is `TauCeti.AlgebraicGeometry.projectiveLine`, which is smooth of relative dimension one over Spec R; Ω¹ is the invertible sheaf `TauCeti.AlgebraicGeometry.InvertibleSheaf.relativeDifferentials`; and 𝒪(n) is `AlgebraicGeometry.Proj.twistingSheaf`, which is invertible on ℙ¹_R. The isomorphism φ : 𝒪(−1)^{⊗2} ≅ Ω¹ in the category `InvertibleSheaf` is the composite of three specified isomorphisms. (1) 𝒪(−1)^{⊗2} is `TauCeti.tensorPow` with exponent 2, that is 𝒪(−1) ⊗ (𝒪(−1) ⊗ 𝟙); the right unit isomorphism of 𝒪(−1), whiskered on the left by 𝒪(−1), gives 𝒪(−1)^{⊗2} ≅ 𝒪(−1) ⊗ 𝒪(−1). (2) Multiplication of sections gives 𝒪(−1) ⊗ 𝒪(−1) ≅ 𝒪(−2): `AlgebraicGeometry.Proj.twistingSheaf.tensorObjIso` for m = n = −1, an isomorphism 𝒪(m) ⊗ 𝒪(n) ≅ 𝒪(m + n) of module sheaves for the tensor product of the monoidal category of module sheaves. Its hypothesis is a family of elements of degree one whose standard opens cover Proj. The homogeneous coordinates X₀, X₁ are such a family over every commutative ring: `coord`, `coord_mem` and `iSup_basicOpen_coord_eq_top` in the namespace `TauCeti.AlgebraicGeometry.projectiveLine`. (3) The inverse of the isomorphism Ω¹ ≅ 𝒪(−2), `TauCeti.AlgebraicGeometry.projectiveLine.relativeDifferentialsIsoTwistingSheaf`, which is normalized on the coordinates t = X₁/X₀ and s = X₀/X₁: it sends dt to the generator X₀^{−2} on the chart D₊(X₀), and ds to −X₁^{−2} on D₊(X₁). Two test lemmas fix φ. (a) On the chart D₊(X_i), φ sends the tensor square of the generator X_i^{−1} of 𝒪(−1) to dt for i = 0 and to −ds for i = 1; this follows from `tensorObjIso_hom_app_tmulRight`, `mul_chartGenerator` and `relativeDifferentialsIsoTwistingSheaf_inv_chartGenerator`. (b) In the form M ⊗ M ≅ Ω¹ of Statement.Setting, where M ⊗ M is the underlying sheaf of `InvertibleSheaf.tensorProduct` (the conversion of Curves.ThetaCharacteristic), φ becomes `AlgebraicGeometry.Proj.twistingSheaf.tensorProductIso` for m = n = −1 followed by the isomorphism (3); Examples.exists_setting_rank_pos uses this form for R an algebraically closed field of characteristic zero. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.projectiveLine`, `TauCeti.AlgebraicGeometry.projectiveLine.smoothOfRelativeDimension`, `TauCeti.AlgebraicGeometry.projectiveLine.coord`, `TauCeti.AlgebraicGeometry.projectiveLine.coord_mem`, `TauCeti.AlgebraicGeometry.projectiveLine.iSup_basicOpen_coord_eq_top` and `TauCeti.AlgebraicGeometry.projectiveLine.affineCoordinate` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.ProjectiveLine`), `AlgebraicGeometry.Proj.twistingSheaf` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.Basic`), `AlgebraicGeometry.Proj.twistingSheaf.chartGenerator`, `AlgebraicGeometry.Proj.twistingSheaf.mul_chartGenerator` and `TauCeti.SymmetricAlgebra.isInvertible_twistingSheaf` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.LocalTriviality`), `AlgebraicGeometry.Proj.twistingSheaf.tensorProductIso`, `AlgebraicGeometry.Proj.twistingSheaf.tensorObjIso` and `AlgebraicGeometry.Proj.twistingSheaf.tensorObjIso_hom_app_tmulRight` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.TensorProduct`), `TauCeti.AlgebraicGeometry.projectiveLine.relativeDifferentialsIsoTwistingSheaf` and `TauCeti.AlgebraicGeometry.projectiveLine.relativeDifferentialsIsoTwistingSheaf_inv_chartGenerator` (`TauCeti.AlgebraicGeometry.Modules.Differentials.ProjectiveLine`), `TauCeti.AlgebraicGeometry.InvertibleSheaf.relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Rank`), `TauCeti.tensorPow` (`TauCeti.CategoryTheory.Monoidal.TensorPow.Basic`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2'
