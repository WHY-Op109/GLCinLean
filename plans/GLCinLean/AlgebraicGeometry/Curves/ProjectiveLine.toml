desc = 'A theta characteristic of the projective line.'

[[node]]
id = 'GLCinLean.Curves.thetaCharacteristicProjectiveLine'
kind = 'definition'
desc = 'A theta characteristic of the projective line ℙ¹ over a field k, with underlying line bundle 𝒪(−1): Ω¹ has degree 2g − 2 = −2 because the genus is 0, 𝒪(−1)^{⊗2} has degree −2, and line bundles on ℙ¹ are classified by their degree, so Ω¹ ≅ 𝒪(−1)^{⊗2}. Tau Ceti gives only the existence of this isomorphism, so one is chosen; it is unique up to a scalar in k^×, and no user may depend on which one it is. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.projectiveLine` and `TauCeti.AlgebraicGeometry.projectiveLine.smoothOfRelativeDimension` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.ProjectiveLine`), `AlgebraicGeometry.Proj.twistingSheaf` (`TauCeti.AlgebraicGeometry.ProjectiveSpectrum.TwistingSheaf.Basic`), `TauCeti.AlgebraicGeometry.projectiveLine.genus_eq_zero` (`TauCeti.AlgebraicGeometry.Cohomology.ProjectiveLine.Basic`), `TauCeti.AlgebraicGeometry.projectiveLine.nonempty_iso_twistingSheaf_iff` and `TauCeti.AlgebraicGeometry.projectiveLine.eulerDegree_twistingSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.ProjectiveLine`, on Tau Ceti main only, not at the pin), `TauCeti.AlgebraicGeometry.LineBundleClass.mk_tensorPow` (`TauCeti.AlgebraicGeometry.LineBundle.Power`, on Tau Ceti main only, not at the pin), `TauCeti.AlgebraicGeometry.eulerDegree_relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Canonical`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2'
