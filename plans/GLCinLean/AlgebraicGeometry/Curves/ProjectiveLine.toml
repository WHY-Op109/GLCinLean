desc = 'The theta characteristic of the projective line.'

[[node]]
id = 'GLCinLean.Curves.thetaCharacteristicProjectiveLine'
kind = 'definition'
desc = 'The theta characteristic 𝒪(−1) of the projective line ℙ¹ over a field k: Ω¹ has degree 2g − 2 = −2, line bundles on ℙ¹ are classified by their degree, so Ω¹ ≅ 𝒪(−2) ≅ 𝒪(−1)^{⊗2}. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.projectiveLine.picardDegreeEquiv` and `TauCeti.AlgebraicGeometry.projectiveLine.nonempty_iso_twistingSheaf_iff` (`TauCeti.AlgebraicGeometry.LineBundle.ProjectiveLine`, on Tau Ceti main only, not at the pin), `TauCeti.AlgebraicGeometry.eulerDegree_relativeDifferentials` (`TauCeti.AlgebraicGeometry.Modules.Differentials.Canonical`).'
deps = ['GLCinLean.Curves.ThetaCharacteristic', 'GLCinLean.LineBundle.Root']
source = '[GLC1] §1.3.2'
