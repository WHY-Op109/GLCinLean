desc = 'The affine Grassmannian LG/L+G as a classical ind-scheme of the plan, with the actions of the arc group and of the coordinate changes.'

[[node]]
id = 'GLCinLean.AffineGrassmannian'
kind = 'definition'
desc = 'The affine Grassmannian Gr_G as a classical prestack of the plan: for an affine group scheme G of finite type over a field k of characteristic zero, the quotient LG/L⁺G of the loop group by the arc group (LoopGroups.LoopGroup), formed in the fpqc sheaves on the classical affine schemes over k. Its value on Spec R is the value on R of the functor AffineGrassmannian.LoopGrassmannian for the coordinate Hopf algebra of G. This node does not define that functor, its description by G-bundles on the formal disc with a trivialization on the punctured disc, or its ind-projective presentation again. It states them in the terms of the plan. (1) Gr_G is a classical prestack with a base point and a left action of the group prestack LG, hence of L⁺G; the quotient map LG → Gr_G is a torsor under L⁺G for the fpqc topology; and Gr_G is a functor of G. (2) For G split connected reductive (over the algebraically closed field of the statement every connected reductive group is split), Gr_G is a classical ind-scheme, the stage n = 0 of Derived.IsIndscheme: a filtered union of projective schemes over k along closed embeddings, by the ind-projective presentation of AffineGrassmannian.LoopGrassmannian. So it is ind-proper and of ind-finite type. A node that needs Gr_G as a derived prestack applies the extension of Derived.IsIndscheme. (3) Keep the full ind-scheme structure distinct from its reduction: Gr_G is not reduced in general (for 𝔾_m it is not the constant scheme ℤ), and a node that passes to D-modules uses nil-invariance. (4) The action of the coordinate changes Aut(O) on LG preserves L⁺G (LoopGroups.LoopGroup), so it induces an action of Aut(O) on Gr_G for which the quotient map LG → Gr_G is equivariant; with the left action of L⁺G it is an action of the semidirect product of L⁺G and Aut(O) ([MV] §2). No roadmap states this action on Gr_G; it is formal from LoopGroups.coordinateChange. Check: for 𝔾_m and the homothety φ = a·t, the action fixes each point t^n of Gr(k) = ℤ, because a^{−n} is a unit of k[[t]]. The comparison with modifications of G-bundles on X (Beauville–Laszlo) is part of Hecke.loopGroupAction. Provider: here, on the roadmap node AffineGrassmannian.LoopGrassmannian (roadmap SheafTheoreticSmithTheory, §3.0), which provides the functor, its moduli description and its ind-projectivity.'
deps = ['GLCinLean.AffineGrassmannian.LoopGrassmannian', 'GLCinLean.LoopGroups.LoopGroup', 'GLCinLean.Derived.IsIndscheme']
source = '[BDHitchin] Theorem 4.5.1 and §4.5.2; [MV] §2; [GLys] §2.1'
