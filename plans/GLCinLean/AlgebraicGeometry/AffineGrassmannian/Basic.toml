desc = 'The fpqc quotient LG/L+G as the affine Grassmannian, with ind-projectivity proved for reductive G, equivalently G-bundles on the disc trivialized on the punctured disc; prove quotient descent and the Beauville–Laszlo gluing comparison with modifications on X. Keep its full scheme structure distinct from its reduction, and use nil-invariance when passing to D-modules. The checked BD presentation is over C; reproduce the algebraic proof over the stated characteristic-zero field. Provider: here.'
