desc = 'The affine Grassmannian LG/L+G and its ind-projectivity.'

[[node]]
id = 'GLCinLean.AffineGrassmannian'
kind = 'definition'
desc = 'The affine Grassmannian Gr_G: for an affine group scheme G of finite type, the fpqc quotient LG/L+G of the loop group by the arc group (LoopGroups.LoopGroup), equivalently G-bundles on the formal disc with a trivialization on the punctured disc; prove quotient descent, and ind-projectivity for G reductive. Keep its full ind-scheme structure distinct from its reduction, and use nil-invariance when passing to D-modules. The loop group and the arc group are classical prestacks (LoopGroups.LoopGroup), so the quotient is formed in classical prestacks and Gr_G is a classical ind-scheme, the stage n = 0 of Derived.IsIndscheme; a node that needs Gr_G as a derived prestack applies the extension of Derived.IsIndscheme. The action of the coordinate changes Aut(O) on LG preserves L+G (LoopGroups.LoopGroup), so it induces an action of Aut(O) on Gr_G for which the quotient map LG → Gr_G is equivariant; with the left action of L+G it is an action of the semidirect product of L+G and Aut(O) ([MV] §2). The comparison with modifications of G-bundles on X (Beauville–Laszlo) is part of Hecke.loopGroupAction. The checked presentation of [BDHitchin] is over C; reproduce the algebraic proof over the stated characteristic-zero field. Provider: here.'
deps = ['GLCinLean.LoopGroups.LoopGroup', 'GLCinLean.Stacks.groupTorsor', 'GLCinLean.Derived.IsIndscheme']
source = '[BDHitchin] Theorem 4.5.1 and §4.5.2; [MV] §2; [GLys] §2.1'
