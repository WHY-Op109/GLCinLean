desc = "Each Schubert stratum Gr^μ is an affine bundle over the partial flag variety G/P_μ, which is paved by affine spaces (Bruhat cells). Hence its algebraic de Rham cohomology over k is concentrated in even degrees, by homotopy invariance for affine bundles and the cell decomposition. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
