desc = 'The Schubert stratification of the affine Grassmannian by L+G-orbits, and the de Rham cohomology of its strata.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.schubertStratification'
kind = 'definition'
desc = 'L+G-orbits indexed by dominant coweights, finite-dimensional projective closures, closure order, dimension and stabilizer connectedness; include rank-one and torus cases. Provider: here.'
deps = ['GLCinLean.AffineGrassmannian', 'GLCinLean.Groups.basedRootDatum']
source = '[BDHitchin] §§4.5.8–4.5.12; [MV] §2, equations (2.1)–(2.3)'

[[node]]
id = 'GLCinLean.AffineGrassmannian.deRhamCohomology_schubertStratum_eq_zero_of_odd'
kind = 'theorem'
desc = 'Each Schubert stratum Gr^μ is an affine bundle over the partial flag variety G/P_μ, which is paved by affine spaces (Bruhat cells). Hence its algebraic de Rham cohomology over k is concentrated in even degrees, by homotopy invariance for affine bundles and the cell decomposition. [MV] §2 gives the cell decomposition by I-orbits; the de Rham consequence over k is the obligation here. Provider: here; the cell paving of G/P_μ is from roadmaps SchubertGeometry (root-coordinate cells) and FlagVarieties (parabolic subgroups and projective homogeneous spaces).'
deps = ['GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.LoopGroups.LoopGroup', 'GLCinLean.Groups.pinnedData', 'GLCinLean.DModules.deRhamPushforward']
source = '[MV] §2 (I-orbits are affine spaces; Gr^λ is a vector bundle over G/P_λ); [JuteauMautnerWilliamson] Proposition 4.3 (the constructible analogue)'
