desc = 'The Iwahori subgroup and the stratifications of the affine flag variety and of the affine Grassmannian by its orbits.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.iwahoriStratification'
kind = 'definition'
desc = 'The Iwahori subgroup I = ev_0^{-1}(B) of L+G for a Borel subgroup B containing T, and the stratifications by I-orbits. On the affine flag variety LG/I the I-orbits are indexed by the Iwahori–Weyl group W̃ (Groups.iwahoriWeylLength), and the orbit of w is an affine space of dimension ℓ(w). On Gr_G they are indexed by W̃/W, the cosets of the finite Weyl group W, each represented by its element of minimal length, whose length is the dimension of the orbit. Example: for SL₂ the identity and the finite simple reflection give two I-orbits on LG/I but the same I-orbit on Gr_G. Elements of the length-zero subgroup Ω normalize I, so left translation by them carries I-Schubert varieties in one component of Gr_G onto those in another, isomorphically. Provider: here.'
deps = ['GLCinLean.LoopGroups.LoopGroup', 'GLCinLean.AffineGrassmannian', 'GLCinLean.Groups.pinnedData', 'GLCinLean.Groups.iwahoriWeylLength']
source = '[PappasRapoport] §8 (Iwahori–Weyl group and Schubert varieties); [MV] §2 (I-orbits are affine spaces)'
