desc = 'The parity of the pushforwards along the Bott–Samelson resolutions of affine Schubert varieties.'

[[node]]
id = 'GLCinLean.AffineGrassmannian.isEven_bottSamelsonPushforward'
kind = 'theorem'
desc = 'Over C, for the stratification of LG/I and of Gr_G by I-orbits (affine spaces) for a simply connected G, which is good (AffineGrassmannian.isGood_schubertStratification), the pushforward of the constant sheaf along each map of AffineGrassmannian.bottSamelsonResolution is an even complex: its *- and !-restrictions to every I-orbit are constant with cohomology in even degrees. Evenness follows from the proof of [JuteauMautnerWilliamson] Proposition 4.11 with I_0 = ∅; the proposition itself states that the pushforward is parity. In that proof, proper base change writes the Bott–Samelson pushforward as an alternating composite of pullbacks and pushforwards along the projections between partial flag varieties, applied to a skyscraper sheaf. The initial skyscraper is even. Proposition 2.36 preserves evenness under the proper even projections; the strata have even cohomology and only constant local systems (Proposition 4.3). Pullback preserves *-evenness, and smooth purity with its even shift (π^! ≅ π^*[2d], which is (7) of Constructible.DerivedCategory) gives !-evenness, as in the proof of Proposition 4.10; both steps need the target parabolic of finite type. The composite is therefore even. Theorem 4.8 is a consequence of Proposition 4.11 and is not used. The statement is for I-orbits only; it is false for L+G-orbits after translating a non-neutral component (for PGL_2, the minuscule orbit becomes a P^1 meeting a two-dimensional L+G-orbit of Gr_{SL_2} in a line). Provider: here.'
deps = ['GLCinLean.AffineGrassmannian.bottSamelsonResolution', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.Constructible.StratifiedDerivedCategory', 'GLCinLean.Constructible.IsStratifiedMap', 'GLCinLean.AffineGrassmannian.isGood_schubertStratification', 'GLCinLean.AffineGrassmannian.schubertStratification', 'GLCinLean.AffineGrassmannian.iwahoriStratification']
source = '[JuteauMautnerWilliamson] Propositions 2.36, 4.3, 4.10 and 4.11 with its proof'
