desc = 'Bott–Samelson resolutions of affine Schubert varieties and the parity of their pushforwards.'

[[node]]
id = 'GLCinLean.Hecke.bottSamelsonResolution'
kind = 'definition'
desc = 'For G simply connected, the affine flag variety LG/I and Gr_G as Kac–Moody (partial) flag varieties of the untwisted affine Kac–Moody group, and for each element w of the affine Weyl group with a reduced expression the Bott–Samelson variety: an iterated P^1-bundle with a proper map onto the closure of the I-orbit of w in LG/I, an isomorphism over that orbit; compose with the projection to Gr_G for I-Schubert varieties there. The composite is birational onto the closure of the I-orbit of w in Gr_G when w has minimal length in its coset w·W_f; for other w it is not, so use minimal-length representatives. Construct these over Q̄ and by base change over any k. Provider: here.'
deps = ['GLCinLean.Hecke.iwahoriWeylGroup', 'GLCinLean.Hecke.affineGrassmannian', 'GLCinLean.Hecke.schubertStratification', 'GLCinLean.Groups.simplyConnectedCover']
source = '[Kumar] §7.1 (Bott–Samelson–Demazure–Hansen varieties); [JuteauMautnerWilliamson] §4.1; [MV] §2'

[[node]]
id = 'GLCinLean.Hecke.bottSamelsonPushforward_parity'
kind = 'theorem'
desc = 'Over C, for the stratification of LG/I and of Gr_G by I-orbits (affine spaces) for a simply connected G, the pushforward of the constant sheaf along each map of Hecke.bottSamelsonResolution is an even complex: its *- and !-restrictions to every I-orbit are constant with cohomology in even degrees. This is [JuteauMautnerWilliamson] Proposition 4.11 with I_0 = ∅. Prove it by their route: the strata have even cohomology and only constant local systems (Proposition 4.3); pushforward along the projections between partial flag varieties preserves parity because they are proper and even (Proposition 2.36), and pullback along them preserves parity because they are smooth (π^! ≅ π^*[2d]); both need the target parabolic of finite type (Proposition 4.10); proper base change writes the Bott–Samelson pushforward as an alternating composite of such functors (proof of Proposition 4.11). Theorem 4.8 is a consequence of Proposition 4.11 and is not used. The statement is for I-orbits only; it is false for L+G-orbits after translating a non-neutral component (for PGL_2, the minuscule orbit becomes a P^1 meeting a two-dimensional L+G-orbit of Gr_{SL_2} in a line). Provider: here.'
deps = ['GLCinLean.Hecke.bottSamelsonResolution', 'GLCinLean.Constructible.derivedCategory', 'GLCinLean.Constructible.perverseSheaves', 'GLCinLean.Hecke.schubertStratification', 'GLCinLean.Hecke.iwahoriWeylGroup']
source = '[JuteauMautnerWilliamson] Propositions 2.36, 4.3, 4.10 and 4.11 with its proof'
