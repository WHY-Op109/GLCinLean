desc = 'The Chevalley map of the coadjoint representation and the nilpotent coadjoint cone.'

[[node]]
id = 'GLCinLean.Groups.chevalleyMap'
kind = 'definition'
desc = 'The invariant quotient of the coadjoint representation: for a smooth affine algebraic group H with Lie algebra 𝔥, the algebra of H-invariant polynomial functions on 𝔥*, the map χ : 𝔥* → 𝔥*//H and its zero fibre; no nondegenerate Killing form on a reductive center is used. It is the case V = 𝔥* of the invariant quotient of a finite-dimensional comodule V, of which the adjoint invariant polynomials of Tau Ceti are the case V = 𝔥; that general form generalizes existing Tau Ceti definitions and is offered to Tau Ceti as an improvement of existing code. The invariant quotient of roadmap ReductiveGroups (“regular-semisimple spectral quotients and finite Weyl monodromy”) is for complex groups only. Provider: here. Upstream declarations used: `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.Comodule.dual` (`TauCeti.Algebra.Coalgebra.Comodule.Dual`), `TauCeti.adjointInvariantPolynomials` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`, on Tau Ceti main only, not at the pin).'
source = '[ArinkinGaitsgory] §11.1.2'

[[node]]
id = 'GLCinLean.Groups.nilpotentCoadjointCone'
kind = 'definition'
desc = 'Nilpotent coadjoint cone as the Chevalley zero fiber; prove agreement with invariant identifications g≅g* and conical closedness. Provider: here; the comparison inputs are from roadmaps NilpotentOrbits and ReductiveGroups. Upstream declarations used: `TauCeti.nilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`, on Tau Ceti main only, not at the pin), `TauCeti.Comodule.dual` (`TauCeti.Algebra.Coalgebra.Comodule.Dual`).'
deps = ['GLCinLean.Groups.chevalleyMap']
source = '[ArinkinGaitsgory] §§11.1.1–11.1.2'
