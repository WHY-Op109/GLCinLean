desc = 'The Chevalley map of the coadjoint representation and the nilpotent coadjoint cone.'

[[node]]
id = 'GLCinLean.Groups.chevalleyMap'
kind = 'definition'
desc = 'Invariant-polynomial quotient of the coadjoint representation and its zero fiber; no reliance on a nondegenerate Killing form on a reductive center. Provider: here. The invariant quotient of roadmap ReductiveGroups (“regular-semisimple spectral quotients and finite Weyl monodromy”) is for complex groups only; the coadjoint form over any k needs the characteristic-zero descent. Upstream declarations used: `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.Comodule.dual` (`TauCeti.Algebra.Coalgebra.Comodule.Dual`), `TauCeti.adjointInvariantPolynomials` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`, on Tau Ceti main only, not at the pin).'
deps = ['GLCinLean.Derived.affineScheme']
source = '[ArinkinGaitsgory] §11.1.2'

[[node]]
id = 'GLCinLean.Groups.nilpotentCoadjointCone'
kind = 'definition'
desc = 'Nilpotent coadjoint cone as the Chevalley zero fiber; prove agreement with invariant identifications g≅g* and conical closedness. Provider: here; the comparison inputs are from roadmaps NilpotentOrbits and ReductiveGroups. Upstream declarations used: `TauCeti.nilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.NilpotentCone`, on Tau Ceti main only, not at the pin), `TauCeti.Comodule.dual` (`TauCeti.Algebra.Coalgebra.Comodule.Dual`).'
deps = ['GLCinLean.Groups.chevalleyMap']
source = '[ArinkinGaitsgory] §§11.1.1–11.1.2'
