desc = 'The enhanced category Rep(H) of representations of an affine group scheme of finite type.'

[[node]]
id = 'GLCinLean.Groups.RepresentationCategory'
kind = 'definition'
desc = 'For an affine group scheme H of finite type over k, the enhanced category Rep(H) = QCoh(BH) (Stacks.ClassifyingStack), with its symmetric monoidal structure and t-structure. Identify its heart with the comodules over the coordinate Hopf algebra of H, and the finite-dimensional comodules with the objects of the heart that are dualizable. Compact generation and rigidity in characteristic zero are a separate theorem, Groups.representationCategory_compactlyGenerated_rigid; the definition does not depend on it. This one definition serves Rep(Ǧ)_Ran, the Satake heart and the spectral side. Provider: here.'
deps = ['GLCinLean.Stacks.ClassifyingStack', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.tStructure', 'GLCinLean.Infinity.monoidalCategory']
source = '[GLC1] §1.2.1; [ArinkinGaitsgory] §10.2.1'

[[node]]
id = 'GLCinLean.Groups.representationCategory_compactlyGenerated_rigid'
kind = 'theorem'
desc = 'For every affine group scheme H of finite type over a field k of characteristic zero: the finite-dimensional rational representations are compact objects of Rep(H) = QCoh(BH) and generate it, the unit is compact, every compact object has a tensor dual, and Rep(H) is rigid (by the sufficient criterion of Infinity.rigidMonoidalCategory). Reductivity is not used: the additive group is covered, although its representations are not completely reducible. Proof. BH is QCA: it is quasi-compact by the atlas pt → BH, and its diagonal is affine of finite type. So derived global sections are continuous (Sheaves.qcaGlobalSections_continuous), and the unit is compact. For a finite-dimensional V, maps out of V are the global sections of V^∨ ⊗ −, so V is compact, and it has the tensor dual V^∨. Generation: for π : pt → BH, the functor π^* is conservative, and π_*π^*M ≃ M ⊗ O_H by the projection formula for the affine map π. The regular representation O_H is the filtered union of its finite-dimensional subcomodules W. Since the unit is compact, π^*M is the colimit of the complexes Hom(W^∨, M). So M = 0 if every map from a shift of a finite-dimensional representation to M is zero. The compact objects are the thick closure of the generators, so each has a tensor dual (also directly: on a QCA stack the compact objects are the perfect ones, [DG2] Corollary 1.4.3). [DG2] does not give compact generation of QCoh for a general QCA stack (the remark after Theorem 4.3.1), so the generation step is needed; [DG2] Lemma 2.6.3 with Corollary 1.4.11 is another route to it. Provider: here. Upstream declarations used: `TauCeti.Subcomodule.exists_finite_subcomodule_mem` (`TauCeti.Algebra.Coalgebra.Subcomodule.Finite`).'
deps = ['GLCinLean.Groups.RepresentationCategory', 'GLCinLean.Stacks.ClassifyingStack', 'GLCinLean.Stacks.IsQCA', 'GLCinLean.Sheaves.qcaGlobalSections_continuous', 'GLCinLean.Sheaves.qcohGlobalSections', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactGeneration', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Sheaves.properPerfectPushforward']
source = '[DG2] Definition 1.1.8, Theorem 1.4.2, Corollaries 1.4.3 and 1.4.11, Lemma 2.6.3, Remark 4.3.2 and Corollary 4.3.8; [RaskinCPSI] §6.15'
