desc = 'The enhanced category Rep(H) of representations of an affine algebraic group.'

[[node]]
id = 'GLCinLean.Groups.RepresentationCategory'
kind = 'definition'
desc = 'For an affine algebraic group H over k, the enhanced category Rep(H) = QCoh(BH) (Stacks.ClassifyingStack), with its symmetric monoidal structure and t-structure. Identify its heart with the comodules over the coordinate Hopf algebra of H, and the finite-dimensional comodules with the objects of the heart that are dualizable. For H reductive over a field of characteristic zero, Rep(H) is compactly generated by the finite-dimensional representations and rigid (Infinity.rigidMonoidalCategory). This one definition serves Rep(Ǧ)_Ran, the Satake heart and the spectral side. Provider: here.'
deps = ['GLCinLean.Stacks.ClassifyingStack', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.tStructure', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactGeneration']
source = '[GLC1] §1.2.1; [ArinkinGaitsgory] §10.2.1'
