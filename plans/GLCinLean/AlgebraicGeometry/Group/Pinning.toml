desc = "Planned library module. AlgebraicGeometry / Group / Pinning. No placeholders belong in this module; roadmap-owned work goes through Tau Ceti Worker, and these planned names are renamed to upstream names when implemented."

[[node]]
id = "GLCinLean.Groups.pinnedData"
kind = "definition"
desc = "A reductive group with pinning yields its Borel B, torus T, unipotent radical N, simple roots and normalized simple root characters. Provider: Tau Ceti existing Pinning, SplitMaximalTorus and IsSimpleRoot; remaining unipotent-radical/root-character comparison is ReductiveGroups Layers 5, 7 and 9B. Tau Ceti main checked 7ca783d4c8d324c9c74efaacd641c8a40f69f284; roadmap checked f7dd719a392f7b65ad30ef45b26c344d08ba5f91."
deps = ["TauCeti.Pinning", "TauCeti.SplitMaximalTorus", "TauCeti.SplitMaximalTorus.IsSimpleRoot", "TauCeti.ReductiveCommHopfAlgCat"]
source = "[GLC1] §§1.3.1–1.3.6"

[[node]]
id = "GLCinLean.Groups.twoRho"
kind = "definition"
desc = "Realize the positive-coroot sum as an actual cocharacter of the specified group torus, using TauCeti.twoWeylVector on the flipped extracted datum; prove the root-character comparison needed by the Whittaker twist. Do not redefine the abstract root sum. Provider: Tau Ceti roadmap ReductiveGroups Layers 7 and 9B root/cocharacter dictionary; sum positive coroots using Mathlib root data. Tau Ceti main checked 7ca783d4c8d324c9c74efaacd641c8a40f69f284; roadmap checked f7dd719a392f7b65ad30ef45b26c344d08ba5f91."
deps = ["GLCinLean.Groups.pinnedData", "GLCinLean.Groups.rootDatum", "RootPairing.Base", "TauCeti.twoWeylVector"]
source = "[GLC1] §§1.3.4–1.3.6"

[[node]]
id = "GLCinLean.Groups.pinning_exists"
kind = "theorem"
desc = "Every reductive group over an algebraically closed field of characteristic zero admits a pinning for some torus rank; construct actual witnesses, including a positive-rank example. Provider: Tau Ceti roadmap ReductiveGroups Layer 9B. Tau Ceti main checked 7ca783d4c8d324c9c74efaacd641c8a40f69f284."
deps = ["TauCeti.ReductiveCommHopfAlgCat", "TauCeti.Pinning"]
source = "[GLC2] §0.4.1; [GLC1] §1.3.6"
