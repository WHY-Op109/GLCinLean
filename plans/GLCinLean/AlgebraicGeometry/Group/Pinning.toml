desc = 'The torsor of pinnings of a split reductive group, and lifting from the adjoint torus.'

[[node]]
id = 'GLCinLean.Groups.pinnings_torsor'
kind = 'theorem'
desc = 'For a split connected reductive group G over a field k with a split maximal torus T and a Borel subgroup B containing T, the pinnings with this T and B form a torsor under the adjoint torus T_ad(k), which acts on the simple root vectors through the simple roots. No condition on k is needed. Provider: here. Upstream declarations used: `TauCeti.Pinning` (`TauCeti.Algebra.AlgebraicGroup.Pinning.Basic`), `TauCeti.SplitMaximalTorus` (`TauCeti.Algebra.AlgebraicGroup.SplitTorus.Maximal`).'
deps = ['GLCinLean.Groups.pinnedData', 'GLCinLean.Groups.basedRootDatum']
source = '[ConradRGS] §7.1 and the proof of Corollary 6.1.15'


[[node]]
id = 'GLCinLean.Groups.torusToAdjointTorus_surjective'
kind = 'theorem'
desc = 'For a split connected reductive group G over an algebraically closed field k, with split maximal torus T and adjoint torus T_ad = T/Z(G), the map T(k) → T_ad(k) is surjective. Over a general field it can fail: for SL₂ it needs square roots. Provider: here.'
deps = ['GLCinLean.Groups.pinnedData']
source = '[ConradRGS] §6.1; explicit obligation'
