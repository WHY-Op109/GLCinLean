id = "GLCinLean.Groups.zExtension_exists"
kind = "theorem"
desc = "Construct a z-extension from the simply connected derived cover and a torus embedding of its finite central kernel, with compatible parabolic and Levi preimages. Prove splitting of a further central-torus extension when the derived group is simply connected; use this to compare choices through their fiber product. Provider: Tau Ceti roadmap ReductiveGroupsPartII RG2.1.5 z-extension-existence, with ReductiveGroups Layers 6–9. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
