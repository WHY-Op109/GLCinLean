desc = "A faithfully flat central extension of a connected reductive group by a split torus, whose source has simply connected derived group; include the actual morphism, kernel identification and exactness. The existence theorem supplies witnesses; test GL2→PGL2 and the trivial extension of a torus. Provider: Tau Ceti roadmap ReductiveGroupsPartII RG2.1.5 targets z-extension and z-extension-existence. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
