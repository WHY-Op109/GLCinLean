desc = 'Over C, the stratification of a scheme by the orbits of a connected affine group of finite type that acts with finitely many orbits is good for constructible complexes, when the local systems on the orbits are constant.'

[[node]]
id = 'GLCinLean.Constructible.isGood_orbitStratification'
kind = 'theorem'
desc = 'Over C, for every coefficient field E: let a connected affine group scheme H of finite type over C act on a separated scheme Y of finite type over C with finitely many orbits, and let every local system of finite rank over E on the complex points of each orbit be constant (for example, each orbit is simply connected). Then the stratification of Y by the orbits has smooth connected strata and the frontier condition, and it is good with coefficients E in the sense of Constructible.StratifiedDerivedCategory. Take each stratum with its orbit scheme and locally closed immersion, `TauCeti.SchemeAction.orbitScheme` and `TauCeti.SchemeAction.orbitι` (`TauCeti.AlgebraicGeometry.GroupAction.Orbit.Scheme`). The smoothness instance for `orbitToBase` is in `TauCeti.AlgebraicGeometry.GroupAction.Orbit.Smooth`. Each orbit is connected as the image of the connected group. The frontier condition follows from `TauCeti.SchemeAction.orbitClosure_subset_orbitClosure_iff` (`TauCeti.AlgebraicGeometry.GroupAction.ClosedOrbit`). Proof. By the hypothesis on local systems it suffices to show that Rj_* E_T is in D^b_S(Y, E) for every stratum T with inclusion j and its constant sheaf E_T. H is smooth, by Cartier’s theorem (`TauCeti.smoothCommHopfAlgProperty_of_charZero`). Let a and p : H × Y → Y be the action and the projection; both are smooth of relative dimension dim H. The preimage of T under a and under p is H × T, because T is stable under H; so a and p each have a Cartesian square as in (4) of Constructible.DerivedCategory, with f = j, f′ = 1 × j, and g′ the action, respectively the projection, H × T → T. The pullback of the constant sheaf E_T along either map H × T → T is the constant sheaf. So smooth base change, (7) of Constructible.DerivedCategory, applied to a and to p, gives a^* Rj_* E_T ≅ R(1 × j)_* E_{H × T} ≅ p^* Rj_* E_T. Pullback of sheaves is exact, so every cohomology sheaf F of Rj_* E_T has a^* F ≅ p^* F. Restricted to H × {y} for a point y of Y, this says that the pullback of F along the orbit map h ↦ hy is a constant sheaf. The complex orbit map onto the stratum of y is a holomorphic submersion with holomorphic local sections (roadmap ReductiveGroups, Layer 3A.5f “Complex orbits”), so F is locally constant on that stratum. Its stalks have finite rank because Rj_* E_T is in D^b_c (Constructible.DerivedCategory). This route needs no stratified topology and no equivariant derived category. Checks: for an empty Y there is no stratum; for the Borel subgroup of SL_2 acting on P^1, the orbits are a point and its complement, an affine line, and the stratification by them is good. Provider: here. Upstream declarations used: `TauCeti.smoothCommHopfAlgProperty_of_charZero` (`TauCeti.Algebra.AlgebraicGroup.Smooth.CharZero`), `TauCeti.SchemeAction.orbitScheme` and `TauCeti.SchemeAction.orbitι` (`TauCeti.AlgebraicGeometry.GroupAction.Orbit.Scheme`), `TauCeti.SchemeAction.orbitClosure_subset_orbitClosure_iff` (`TauCeti.AlgebraicGeometry.GroupAction.ClosedOrbit`).'
deps = ['GLCinLean.Constructible.StratifiedDerivedCategory', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.ComplexPoints']
