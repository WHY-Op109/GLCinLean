desc = 'Constructible sheaves on the complex points of separated C-schemes of finite type, as an ordinary triangulated theory: the target of the Riemann–Hilbert comparison used for parity of IC stalks. No embedding of the original field into C is assumed anywhere.'

[[node]]
id = 'GLCinLean.Constructible.DerivedCategory'
kind = 'definition'
desc = 'For a separated scheme Y of finite type over C and a field E: the bounded derived category D^b_c(Y, E) of sheaves of E-vector spaces on Y(C) (Constructible.ComplexPoints) whose cohomology sheaves are constructible for some algebraic stratification, and, for a fixed algebraic stratification S, its full subcategory D^b_S(Y, E) of complexes whose cohomology sheaves are locally constant of finite rank on each stratum. It is an ordinary triangulated category, built from Mathlib (TopCat.Sheaf and DerivedCategory); it is not an enhanced category, and no node uses it as one. On D^b_c give *- and !-pullback along all maps, proper pushforward, base change and the projection formula, external products and Verdier duality. D^b_c and D^b_S need no condition on S. Let S be a finite algebraic stratification with the frontier condition by smooth connected locally closed strata. S is good with coefficients E if, for every stratum inclusion j_T and every local system L of finite rank over E on T(C), Rj_{T*}L is in D^b_S(Y, E). The extension by zero j_{T!}L is always in D^b_S. Goodness is equivalent to Verdier duality preserving D^b_S, since D^b_S is generated by the shifts of the j_{T!}L and 𝔻(j_{T!}L) ≃ Rj_{T*}(L^∨)[2 dim T]. Examples to prove with the definition: the stratifications of finite Schubert unions by L+G-orbits and by I-orbits are good for every E. Their strata are simply connected (affine spaces, or affine-space bundles over partial flag varieties), so every local system on a stratum is constant; a constant sheaf is equivariant for the connected group, which acts through a quotient of finite type; Rj_* keeps it equivariant (smooth base change along the action map); and an equivariant complex has cohomology locally constant along each orbit. This route needs no stratified topology. Whitney stratifications, and so all orbit stratifications of a group acting with finitely many orbits, are also good (Thom isotopy lemma), but no node uses that general statement and it is not planned. Without goodness the duality and perverse statements below fail: for the Whitney umbrella x² = y²z with strata the z-axis and its complement, Rj_* of the constant sheaf on the complement has stalk rank 2 along the axis away from 0 and rank 1 at 0, and the IC sheaf and the !-restriction of the constant sheaf to the axis are not in D^b_S. *-pullback along a map that sends each stratum into a stratum preserves the D^b_S, for any stratifications. For good stratifications S, proper pushforward along stratified maps preserves D^b_S: the preimage of each stratum is a union of strata, and over each stratum the map is locally trivial by trivializations that carry strata to strata (locally over the stratum, the product of a stratified fibre with the base). The definition of a stratified morphism in [JuteauMautnerWilliamson] §2.4 asks only that each stratum above a stratum maps to it by a submersion; the condition here is the one the proof needs, and an equivariant map between orbit stratifications of one group satisfies it. A trivial fibration that only preserves strata is not enough: for P¹ × A¹ → A¹, with strata the parabola x² = y and its complement, the pushforward of the constant sheaf on the parabola has stalk rank 2 away from 0 and rank 1 at 0. A fixed stratification is not preserved by every map: for the one-stratum stratification of C, the proper inclusion of the origin sends the constant sheaf to a skyscraper. Hom is computed by derived global sections. The constructibility conditions, the operations and duality are missing upstream and implemented here. Provider: here. Upstream declarations used: `TopCat.Sheaf` (`Mathlib.Topology.Sheaves.Sheaf`), `DerivedCategory` (`Mathlib.Algebra.Homology.DerivedCategory.Basic`).'
deps = ['GLCinLean.Constructible.ComplexPoints']
source = '[HottaTakeuchiTanisaki] Chapter 4 and Appendix on derived categories of sheaves; [JuteauMautnerWilliamson] §2.4'

[[node]]
id = 'GLCinLean.Constructible.PerverseSheaves'
kind = 'definition'
desc = 'For a stratification S that is good with coefficients E (Constructible.DerivedCategory), the middle-perversity t-structure on D^b_S(Y, E) of Constructible.DerivedCategory, as a Mathlib t-structure on that triangulated category; its heart of perverse sheaves (of finite length), and intermediate extension along locally closed strata, with the IC sheaves of irreducible local systems as the simple objects. Provider: here. Upstream declarations used: `CategoryTheory.Triangulated.TStructure` (`Mathlib.CategoryTheory.Triangulated.TStructure.Basic`).'
deps = ['GLCinLean.Constructible.DerivedCategory']
source = '[HottaTakeuchiTanisaki] Chapter 8 (perverse sheaves); [MV] §2'

[[node]]
id = 'GLCinLean.DModules.analyticDeRham'
kind = 'definition'
desc = 'For a finite-type C-scheme Y, analytification of algebraic D-modules on Y to analytic D-modules on Y(C), and the analytic de Rham functor DR from bounded holonomic complexes to D^b_c(Y, C) of Constructible.DerivedCategory, which lands in D^b_S(Y, C) for every stratification S along which the cohomology is lisse; compatible with the perverse t-structures and with Verdier duality. Provider: here.'
deps = ['GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.verdierDuality']
source = '[HottaTakeuchiTanisaki] Chapter 4 (analytic D-modules and the de Rham functor)'
