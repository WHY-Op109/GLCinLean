desc = 'Maps of stratified complex schemes along which pullback and proper pushforward preserve the complexes that are constructible along the strata. The constructible derived category, its perverse t-structure and its subcategories along a fixed stratification are nodes of the roadmap EtaleDualityAndPerverseSheaves.'

[[node]]
id = 'GLCinLean.Constructible.IsStratifiedMap'
kind = 'definition'
desc = 'For separated schemes X and Y of finite type over C with finite stratifications S_X and S_Y by smooth connected locally closed strata, and a map f : X → Y. Two conditions on f, and what each gives for the categories D^b_S of Constructible.StratifiedDerivedCategory, for every coefficient field E. (a) S_X refines the pullback of S_Y: S_X ≤ S_Y.comap f, for S_X and S_Y as stratifications of the spaces X(C) and Y(C) (`TauCeti.FiniteStratification`) and the continuous map of complex points. By `TauCeti.FiniteStratification.le_def` and `TauCeti.FiniteStratification.mem_comap_parts` this says that f sends each stratum of X into a stratum of Y. No new definition is made for (a). Then f^* carries D^b_{S_Y}(Y, E) into D^b_{S_X}(X, E), for any stratifications. (b) f is stratified, which is the definition of this node: (a) holds, so that the preimage of each stratum of Y is a union of strata of X, and over each stratum T of Y the map is locally trivial for the classical topology by trivializations that carry strata to strata (locally over T, the product of a stratified fibre with the base). Then, for S_X with the frontier condition and f proper, Rf_* carries D^b_{S_X}(X, E) into D^b_{S_Y}(Y, E). Goodness of S_X or S_Y is not a hypothesis. The definition in [JuteauMautnerWilliamson] §2.4 requires (a) and requires each induced map of strata to be a submersion with smooth fibre. Here (b) requires local product charts preserving the strata. For an equivariant map between orbit stratifications of one connected group, local sections of each target orbit map give the product charts in (b). Examples that show the conditions are needed. A trivial fibration that only preserves strata is not enough for (b): for P¹ × A¹ → A¹, with strata the parabola x² = y and its complement, the pushforward of the constant sheaf on the parabola has stalk rank 2 away from 0 and rank 1 at 0. A fixed stratification is not preserved by every map: for the one-stratum stratification of C, the proper inclusion of the origin sends the constant sheaf to a skyscraper. Example where (b) holds: the projection of a product Y × F to Y, for a smooth connected projective F with the strata T × F. Provider: here; no roadmap target uses these conditions. Upstream declarations used: `TauCeti.FiniteStratification.comap`, `TauCeti.FiniteStratification.le_def` and `TauCeti.FiniteStratification.mem_comap_parts` (`TauCeti.Topology.Stratification`).'
deps = ['GLCinLean.Constructible.StratifiedDerivedCategory', 'GLCinLean.Constructible.DerivedCategory']
source = '[JuteauMautnerWilliamson] §2.4'
