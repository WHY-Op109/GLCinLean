desc = "A coherent D-module on a safe stack is compact. Use the Verdier-duality formula Hom(F,-)=Γ_dR(D(F)⊗!-) and continuity, yielding the compact=coherent characterization. Holonomic objects are coherent but QCA alone is insufficient. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
