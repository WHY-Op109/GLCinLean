desc = 'Enhanced de Rham direct image on finite-type schemes, as needed for finite Schubert support calculations and hyperbolic localization.'

[[node]]
id = 'GLCinLean.DModules.deRhamPushforward'
kind = 'definition'
desc = '''Construct de Rham direct image for maps of schemes of finite type (such maps are quasi-compact) from the transfer-bimodule construction; prove composition, the proper and open adjunctions, the adjunction for a smooth map f of relative dimension d (f^![−2d] is left adjoint to f_*), and coherent extraordinary base change. This is the scheme functor, with no unsupported continuity assertion for arbitrary stacks. Classical input: for a morphism f : X → Y of smooth separated schemes of finite type of pure dimensions, the functor is, under the equivalences of DModules.rightCrystals_equiv_dModules, the restriction to the complexes with quasi-coherent cohomology of the transfer functor (3) of Infinity.derivedBimoduleTransfer for the transfer module D_{X→Y} of DModules.transferModule (1). So the functor that it induces on homotopy categories is, on bounded complexes, the direct image of right modules of DModules.transferModule (3). The comparison with the restricted transfer is an equivalence of continuous Vect_k-linear functors, using the equal left and right actions of k on D_{X→Y}. On finite-type schemes, construct the comparisons for changes of smooth ambient embedding and for restrictions to chart overlaps. Prove their coherence under refinement and composition so that the chart functors descend to the stated direct image. Provider: here, for the continuous k-linear functor (Infinity.continuousLinearFunctor) on the right crystals of every scheme of finite type, with its coherent composition, the adjunctions and the base change; and for the theorems that this transfer functor preserves quasi-coherent cohomology, preserves small colimits on the complexes with quasi-coherent cohomology, and is k-linear for the structure of DModules.rightCrystals_equiv_dModules. The transfer module, the transfer functor and the direct image on bounded derived categories are the roadmap nodes DModules.transferModule and Infinity.derivedBimoduleTransfer; they are not written again here.'''
deps = ['GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.continuousLinearFunctor', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.DModules.transferModule', 'GLCinLean.Infinity.derivedBimoduleTransfer']
source = '[DG2] §§5.2.1–5.2.6 and §5.3.5; [BDChiral] §2.1'
