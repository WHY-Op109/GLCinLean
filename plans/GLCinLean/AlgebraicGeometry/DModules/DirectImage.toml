desc = 'Enhanced de Rham direct image on finite-type schemes, as needed for finite Schubert support calculations and hyperbolic localization.'

[[node]]
id = 'GLCinLean.DModules.deRhamPushforward'
kind = 'definition'
desc = 'Construct de Rham direct image for maps of schemes of finite type (such maps are quasi-compact) from the transfer-bimodule construction; prove composition, the proper and open adjunctions, the adjunction for a smooth map f of relative dimension d (f^![−2d] is left adjoint to f_*), and coherent extraordinary base change. This is the scheme functor, with no unsupported continuity assertion for arbitrary stacks. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.continuousLinearFunctor', 'GLCinLean.Infinity.rightAdjoint']
source = '[DG2] §§5.2.1–5.2.6; [BDChiral] §2.1'
