id = "GLCinLean.DModules.crystalInduction"
kind = "definition"
desc = "Construct induction from IndCoh to right crystals on a locally almost finite type algebraic stack as left adjoint to the continuous conservative forgetful functor. Use relative de Rham prestacks and smooth descent; supply the adjunction and base-change comparisons. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
