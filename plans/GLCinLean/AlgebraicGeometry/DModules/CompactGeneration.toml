[[node]]
id = "GLCinLean.DModules.qcaDMod_compactlyGenerated"
kind = "theorem"
desc = "On a QCA stack, prove that crystal inductions of coherent sheaves are compact and generate all D-modules. Use compact generation of IndCoh, continuity of crystal forgetting for compactness, and its conservativity for generation. This includes the finite-type G_m-quotients used for monodromic categories; coherent D-modules need not all be compact on such a quotient. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.DModules.crystalInduction", "GLCinLean.Sheaves.qcaIndCoh_compactlyGenerated", "GLCinLean.Infinity.compactGeneration"]
source = "[DG2] Theorem 8.1.1"

[[node]]
id = "GLCinLean.DModules.indscheme_compactlyGenerated"
kind = "theorem"
desc = "For an indscheme presented by closed embeddings of finite-type schemes, identify D-modules with the colimit of the finite-stage categories under proper direct image and with the dual !-pullback limit. Prove compact generation by finite-stage compact objects because the transition functors have continuous ! right adjoints. Include the same argument for compatible finite-type G_m-quotients. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Derived.indscheme", "GLCinLean.DModules.qcaDMod_compactlyGenerated", "GLCinLean.DModules.deRhamPushforward", "GLCinLean.DModules.extraordinaryPullback", "GLCinLean.Infinity.compactGeneration"]
source = "[ChenNearbyCycles] §A.4, Lemma A.1.5 and Lemma D.1.1; [CompactGeneration] Corollary 1.9.4 and Lemma 1.9.5"
