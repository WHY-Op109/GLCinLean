desc = 'The analytic de Rham functor from the regular holonomic D-modules on a separated C-scheme of finite type that is closed in a smooth scheme to the constructible complexes on its complex points.'

[[node]]
id = 'GLCinLean.DModules.analyticDeRham'
kind = 'definition'
desc = '''Over C. Let Y be a separated scheme of finite type over C and i : Y → X a closed embedding into a smooth separated scheme X of finite type over C of pure dimension. Every quasi-projective Y has such an embedding (it is a closed subscheme of an open subscheme of a projective space), and so has every smooth separated Y of finite type. Write Dᵇ_rh(Y) for the homotopy category of the bounded regular holonomic complexes of right crystals on Y (DModules.IsRegularHolonomic). The node is, for every such embedding i, a triangulated functor DR_i from Dᵇ_rh(Y) to D^b_c(Y, C) of Constructible.DerivedCategory, with the statements (1) to (5). The embedding is part of the data of the functor; by (1) the functors of two embeddings of Y are isomorphic, and DR_Y stands for any of them in a statement that holds for each. Construction. (a) For a smooth separated X of finite type of pure dimension, DR_X is the composite of the equivalence of DModules.rightCrystals_equiv_dModules, the side change from right to left D_X-modules (DModules.transferModule (4)) and the functor pDR of DModules.regularHolonomicDeRham. (b) Let ι : Y(C) → X(C) be the map of complex points of i. The direct image i_* (DModules.deRhamPushforward) carries Dᵇ_rh(Y) into the objects of Dᵇ_rh(X) whose restriction to X ∖ Y is zero (the consequence of step (a4) of DModules.IsRegularHolonomic, which holds for every closed embedding into a smooth separated scheme of finite type of pure dimension). DR_X commutes with the restriction to an open subscheme: this is (3) of DModules.regularHolonomicDeRham for an open immersion j, where j^† and j^! are the restrictions. ι_* is an equivalence from D^b_c(Y, C) to the full subcategory of the objects of D^b_c(X, C) whose restriction to the complement is zero, with inverse ι^* ((8) of Constructible.DerivedCategory). Put DR_i = ι^* ∘ DR_X ∘ i_*. Statements. (1) Independence of the embedding. For closed embeddings i_1 and i_2 of Y into X_1 and X_2, the functors DR_{i_1} and DR_{i_2} are isomorphic. The map g = (i_1, i_2) is a closed embedding of Y into X_1 × X_2, with map γ of complex points, and the projection p_1 to X_1 has p_1 ∘ g = i_1. The isomorphism of DR_{i_1} with DR_g is ι_1^* applied to the composite DR_{X_1} ∘ i_{1*} ≅ DR_{X_1} ∘ p_{1*} ∘ g_* ≅ Rp_{1*} ∘ DR_{X_1 × X_2} ∘ g_* ≅ Rp_{1*} ∘ γ_* ∘ DR_g ≅ ι_{1*} ∘ DR_g. Its four steps are the composition isomorphism of the direct images of crystals (DModules.deRhamPushforward); the isomorphism of (3) of DModules.regularHolonomicDeRham for the map p_1, with the comparison of the direct images in DModules.deRhamPushforward; the definition of DR_g; and the composition isomorphism of (1) of Constructible.DerivedCategory. The isomorphism of DR_{i_2} with DR_g is the same with p_2. The node states no compatibility of these isomorphisms for three embeddings: no statement of the plan uses one, each use is the existence of an isomorphism, and (3) of DModules.regularHolonomicDeRham gives one isomorphism for each map with no compatibility under composition. (2) For the identity of a smooth Y of pure dimension, DR_i is the functor DR_Y of (a). (3) DR_i is t-exact for the right t-structure of the crystals on Y (DModules.rightCrystals_equiv_dModules) and the perverse t-structure of Constructible.PerverseSheaves, so it takes the regular holonomic objects of the heart to perverse sheaves. On X this is (2) of DModules.regularHolonomicDeRham, because the side change is exact; i_* is t-exact (DModules.rightCrystals_equiv_dModules); and ι_* is t-exact, and an object K is in one half of the perverse t-structure when ι_*K is. (4) For a closed embedding h : Y → Z into a scheme Z with a closed embedding i′ into a smooth X′ as above, and the map η of complex points of h: η_* ∘ DR_{i′ ∘ h} ≅ DR_{i′} ∘ h_*, by the definition of the two functors and the composition isomorphisms of both sides. With (1), η_* ∘ DR_Y ≅ DR_Z ∘ h_*. For an open subscheme U of Y, which is closed in an open subscheme of X, DR commutes with the restriction to U. (5) DR_i commutes with duality: DR_i ∘ 𝔻 ≅ 𝔻 ∘ DR_i, for the duality of DModules.verdierDuality, which preserves the regular holonomic complexes (DModules.IsRegularHolonomic), and the Verdier duality of Constructible.DerivedCategory (3). On X this is (4) of DModules.regularHolonomicDeRham with the comparison of the dualities in DModules.verdierDuality; both dualities commute with the direct image along a closed embedding; for the crystals this is the lemma of DModules.verdierDuality on closed embeddings. Checks: on a point, DR is the identity of the bounded derived category of the finite-dimensional vector spaces; for a smooth Y of pure dimension d and the right crystal whose left D_Y-module is O_Y, the value is C_Y[d]; for a closed point y of a Y that may be singular, with inclusion i_y, the value on i_{y*} of the vector space C is the skyscraper sheaf C at y in degree 0, by (4). Restrictions, with their reasons. The functor is defined on the regular holonomic complexes only: the accepted target states its values in D^b_c for these, and no node uses the constructibility of the de Rham complex of a holonomic module that is not regular ([HottaTakeuchiTanisaki] Theorems 4.6.3, 4.6.6 and 4.7.7 and Corollary 4.6.5, which this plan does not use). Y is closed in a smooth scheme: D^b_c(Y, C) is a triangulated category, and its objects do not glue along an open cover, so the functors of the affine charts of a general Y do not define a functor on Y. The uses in the plan of the statement are on finite unions of Schubert varieties, which are projective; the plan of the proof also names their products with powers of a finite jet quotient of L⁺G, which are quasi-projective. Provider: here, for the schemes that need not be smooth, for the crystals, and for (1) to (5). The functor pDR on a smooth scheme, with the analytification, and its theorem are the roadmap node DModules.regularHolonomicDeRham; they are not written again here.'''
deps = ['GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.DModules.IsRegularHolonomic', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.regularHolonomicDeRham', 'GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.transferModule']
source = '[HottaTakeuchiTanisaki] Chapter 4 (analytic D-modules and the de Rham functor) and Theorems 7.1.1 and 7.2.2, for smooth algebraic varieties; the book is not in references/. The passage to a closed subscheme of a smooth scheme is an adaptation of this plan, with the t-exact closed pushforward of [Crystals] Proposition 4.2.5'
