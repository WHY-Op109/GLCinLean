desc = 'The !-pushforward of holonomic D-modules.'

[[node]]
id = 'GLCinLean.DModules.holonomicShriek'
kind = 'definition'
desc = '''Partially defined !-pushforward adjoint to !-pullback. For maps of finite-type schemes prove its existence on holonomic objects by Verdier duality, with composition and base change; supply the particular extension used for Poincare. The adjunction: for a map f : Y → Z of schemes of finite type, a holonomic complex M on Y (DModules.IsHolonomic) and every right crystal N on Z, an equivalence Map(f_!M, N) ≃ Map(M, f^!N), natural in M and N. The base change: for a Cartesian square of schemes of finite type with maps f : Y → Z and g : Z′ → Z and base changes f′ : Y′ → Z′ and g′ : Y′ → Y, an equivalence g^* f_! ≃ f′_! g′^* on the holonomic complexes on Y, with the *-pullback of DModules.starPullback; when g is smooth of relative dimension d this gives g^! f_! ≃ f′_! g′^!, because then g^* = g^![−2d] and g′^* = g′^![−2d]. Classical input: Verdier duality preserves the holonomic complexes (DModules.verdierDuality, which takes it on smooth schemes from DModules.holonomicDModule (5)); de Rham pushforward along a locally closed immersion of smooth separated schemes of finite type of pure dimensions sends a holonomic object of the heart to a holonomic complex, by DModules.holonomicDModule (6) and the comparison of DModules.deRhamPushforward. Provider: here, for the functor f_! = 𝔻 f_* 𝔻 on the holonomic complexes with these properties, and for the theorem that de Rham pushforward along every map of schemes of finite type preserves the holonomic complexes. No accepted roadmap states this theorem: SpringerResolutionAndCharacteristicCycles §9.1 has the “stability of holonomicity under the operations used in intermediate extension”. The facts of the classical input on smooth schemes are in the roadmap node DModules.holonomicDModule; they are not written again here.'''
deps = ['GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.starPullback']
source = '[GLC1] §§1.3.5, 1.3.7; [GaRanII] §0.4.5'
