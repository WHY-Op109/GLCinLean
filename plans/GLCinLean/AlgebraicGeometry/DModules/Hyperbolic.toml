id = "GLCinLean.DModules.hyperbolicRestriction_isIso"
kind = "theorem"
desc = "Prove the two partially defined hyperbolic composites are represented and their canonical comparison is an isomorphism on all monodromic D-modules, using interpolation specialization and contraction. Prove the resulting Braden adjunction; holonomic objects give a special case. The domain is the monodromic category, not every ambient D-module. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
