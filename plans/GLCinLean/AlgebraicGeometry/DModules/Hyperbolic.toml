desc = "Attractor and repeller pull-push functors, initially in pro-categories where a left adjoint is only partially defined, and their canonical comparison for G_m-actions on finite-type algebraic spaces in characteristic zero. Preserve the star/shriek directions; the separate theorem gives representability on all monodromic D-modules. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
