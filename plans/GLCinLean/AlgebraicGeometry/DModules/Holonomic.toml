desc = 'Holonomic D-modules.'

[[node]]
id = 'GLCinLean.DModules.IsHolonomic'
kind = 'definition'
desc = '''Holonomic D-modules; provide a nonzero example. Classical input: for a smooth separated scheme Y of finite type of pure dimension, an object of the heart of the right t-structure of the right crystals on Y is holonomic when the left D_Y-module that DModules.rightCrystals_equiv_dModules attaches to it is holonomic in the sense of DModules.holonomicDModule. The inequality of Bernstein, the closure under subquotients and extensions, and the finite length are (1), (3) and (4) of that node. Provider: here, for (a) to (d). (a) The holonomic objects of the heart of the right crystals on every scheme of finite type: Zariski-locally through a closed embedding into an affine space, with the proof that the condition does not depend on the embedding. This proof needs that the equivalence of Kashiwara for a closed immersion of smooth schemes preserves and reflects holonomic modules; the roadmap states that equivalence for coherent modules (DModules.transferModule (7)), and the statement for holonomic modules is proved here. (b) The holonomic complexes: the bounded complexes whose cohomology objects are holonomic. They lie in DModules.Coherent. On algebraic stacks they are defined by smooth atlases. (c) Every holonomic object of the heart on a scheme of finite type has finite length. (d) Theorem: !-pullback (DModules.extraordinaryPullback) along every map of schemes of finite type preserves the holonomic complexes. For a closed immersion i with open complement j, the proof uses the triangle i_* i^! M → M → j_* j^! M and that j_* sends a holonomic complex to a holonomic complex; on smooth separated schemes of pure dimension this is DModules.holonomicDModule (6), through the comparison of DModules.deRhamPushforward. No accepted roadmap states this theorem: SpringerResolutionAndCharacteristicCycles §9.1 defines f^† and states no preservation of holonomic modules by f^† for a general f. That the exponential module is holonomic is stated in DModules.exponential, and that the object χ^*(exp) of the vacuum Poincaré object is holonomic is stated in Whittaker.vacuumPoincare. The holonomic modules over D_Y and their properties are the roadmap node DModules.holonomicDModule; they are not written again here.'''
deps = ['GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.holonomicDModule', 'GLCinLean.DModules.transferModule', 'GLCinLean.DModules.Coherent', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward']
source = '[GLC1] §1.3.7; [CompactGeneration] §3.3'
