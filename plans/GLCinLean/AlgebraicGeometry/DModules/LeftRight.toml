desc = 'The equivalence of left and right crystals.'

[[node]]
id = 'GLCinLean.DModules.leftCrystalsEquivRightCrystals'
kind = 'definition'
desc = 'For a locally almost finite type prestack 𝒴, the functor Sheaves.upsilon on 𝒴_dR as an equivalence QCoh(𝒴_dR) ≃ IndCoh(𝒴_dR) from left to right crystals, compatible with pullback along every map of such prestacks. Prove it as in [Crystals] Prop. 2.4.4: both sides are limits over classical affine schemes of finite type mapping to 𝒴 (DModules.crystals_rightKanExtension_of_affine), so it suffices to treat such an affine X. Embed X in a smooth classical scheme Z and let Y be the formal completion of Z along X, so that X_dR → Y_dR is an isomorphism (Derived.FormalCompletion). By descent of left and right crystals along Y → Y_dR (DModules.crystals_descent_of_classicallyFormallySmooth), reduce to the terms of the Čech nerve, which are formal completions of powers of Z (Derived.deRhamCechNerve_formalCompletion); there compare the localization sequences of QCoh and IndCoh with the equivalences on the smooth scheme and on the open complement (Sheaves.qcoh_formalCompletion_localization, Sheaves.indcoh_formalCompletion_localization, Sheaves.upsilon_isEquivalence_of_smooth). Provider: here.'
deps = ['GLCinLean.Sheaves.upsilon', 'GLCinLean.DModules.crystals_rightKanExtension_of_affine', 'GLCinLean.Derived.FormalCompletion', 'GLCinLean.DModules.crystals_descent_of_classicallyFormallySmooth', 'GLCinLean.Derived.deRhamCechNerve_formalCompletion', 'GLCinLean.Sheaves.upsilon_isEquivalence_of_smooth', 'GLCinLean.Sheaves.qcoh_formalCompletion_localization', 'GLCinLean.Sheaves.indcoh_formalCompletion_localization']
source = '[Crystals] Proposition 2.4.4 and its proof; [IndCoh] Lemma 1.1.6 and Proposition 9.3.3; [DGIndschemes] Propositions 7.1.3 and 7.4.5'
