desc = 'Field-extension comparisons needed to use the complex constructible calculation in the arbitrary-characteristic-zero de Rham theory. These are explicit adaptation proofs, not a claim that the cited complex theorem already states them.'

[[node]]
id = 'GLCinLean.DModules.holonomicHom_fieldBaseChange'
kind = 'theorem'
desc = 'For an extension K/k0 of algebraically closed fields of characteristic zero and a finite-type scheme Y0 over k0: scalar extension from bounded holonomic complexes on Y0 to bounded holonomic complexes on Y0 ×_k0 K is t-exact for the holonomic-module t-structure, preserves regular holonomicity, commutes with *- and !-pullback and pushforward along locally closed embeddings and proper maps (hence with intermediate extension and with external products), and induces isomorphisms Hom(F0, G0[n]) ⊗_k0 K → Hom(F0_K, G0_K[n]) for every integer n. Prove it by a Kashiwara embedding into a smooth ambient scheme, computing Hom as de Rham cohomology of the holonomic internal Hom pushed to the point, and flat base change for de Rham pushforward on finite-type schemes. This is the single field-comparison input; DModules.boundedEquivariantExt_baseChange and Satake.sphericalHeart_semisimple use it. Provider: here.'
deps = ['GLCinLean.DModules.holonomic', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.regularHolonomic']
source = '[HottaTakeuchiTanisaki] Chapters 2–3 (direct and inverse images, duality, holonomic modules) and §6.1 (regular holonomic modules); explicit adaptation obligation: no single source states the field base change'
