desc = 'Scalar extension of holonomic D-modules along an extension of fields of characteristic zero, and the base change of Hom. These are explicit adaptation proofs, not a claim that a cited theorem states them.'

[[node]]
id = 'GLCinLean.DModules.scalarExtension'
kind = 'definition'
desc = 'For an extension K/k₀ of fields of characteristic zero and a scheme Y₀ of finite type over k₀, the scalar-extension functor from bounded holonomic complexes on Y₀ to bounded holonomic complexes on Y₀ ×_{k₀} K. It is t-exact for the holonomic-module t-structure, preserves regular holonomicity, and commutes with *- and !-pullback and with pushforward along locally closed embeddings and proper maps, hence with intermediate extension and external products. Construct it on affine charts with closed embeddings into affine spaces, prove independence of the embedding (DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion) and compatibility on overlaps, and glue by descent (DModules.rightCrystals_hDescent); no global embedding into a smooth scheme is assumed. Provider: here.'
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.IsRegularHolonomic', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion', 'GLCinLean.DModules.rightCrystals_hDescent', 'GLCinLean.DModules.rightCrystals_equiv_dModules']
source = '[HottaTakeuchiTanisaki] Chapters 2–3 and §6.1; explicit adaptation obligation: no single source states the field base change'

[[node]]
id = 'GLCinLean.DModules.scalarExtension_homTensor_isIso'
kind = 'theorem'
desc = 'In the setting of DModules.scalarExtension, for bounded holonomic complexes F₀ and G₀ on Y₀ and every integer n, the map Hom(F₀, G₀[n]) ⊗_{k₀} K → Hom(F₀_K, G₀_K[n]) is an isomorphism. Prove it on affine charts with a closed embedding into an affine space, computing Hom as de Rham cohomology of the holonomic internal Hom pushed forward to the point, with flat base change for de Rham pushforward on schemes of finite type, and glue by descent. This is the single field-comparison input: Satake.ic_starRestriction_isEven uses it, and so does DModules.boundedEquivariantExt_baseChange in the plan of the proof. Provider: here.'
deps = ['GLCinLean.DModules.scalarExtension', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.rightCrystals_hDescent']
source = '[HottaTakeuchiTanisaki] Chapters 2–3 (direct and inverse images, duality, holonomic modules); explicit adaptation obligation'
