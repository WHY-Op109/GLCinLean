desc = "Field-extension comparisons needed to use the complex constructible calculation in the arbitrary-characteristic-zero de Rham theory. These are explicit adaptation proofs, not a claim that the cited complex theorem already states them."

[[node]]
id = "GLCinLean.DModules.boundedEquivariantExt_baseChange"
kind = "theorem"
desc = "For algebraic equivariant regular holonomic complexes supported on a finite union of Schubert varieties, construct scalar extension and prove flat base change of each bounded Ext degree, convolution maps, and equivariance. Descend the support, maps and complexes to a finitely generated characteristic-zero field; use a finite jet group quotient and de Rham-acyclic pro-unipotent transition kernels. Reduce each finite-stage Hom to DModules.holonomicHom_fieldBaseChange, computing each Ext degree using bounded truncations of the simplicial quotient and finite-stage de Rham resolutions. Prove the boundedness/stabilization needed before exchanging tensor with totalization; do not assume tensor preserves arbitrary limits. Provider: Missing; implement here. This comparison is a proof obligation for the de Rham adaptation, not a theorem quoted verbatim from ABG. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.schubertStratification", "GLCinLean.DModules.equivariantIndscheme", "GLCinLean.DModules.perverseHeart", "GLCinLean.Sheaves.qcoh", "GLCinLean.Infinity.tStructure", "GLCinLean.DModules.holonomicHom_fieldBaseChange"]
source = "[FactorizableDerivedSatake] §9.2 (required scalar-extension step in its use of [LoopGrassmannianExt] Theorem 7.6.1); [BDHitchin] §§5.3, 7.3"

[[node]]
id = "GLCinLean.DModules.holonomicHom_fieldBaseChange"
kind = "theorem"
desc = "For an extension K/k0 of algebraically closed fields of characteristic zero and a finite-type scheme Y0 over k0: scalar extension from bounded holonomic complexes on Y0 to bounded holonomic complexes on Y0 ×_k0 K is t-exact for the holonomic-module t-structure, preserves regular holonomicity, commutes with *- and !-pullback and pushforward along locally closed embeddings and proper maps (hence with intermediate extension and with external products), and induces isomorphisms Hom(F0, G0[n]) ⊗_k0 K → Hom(F0_K, G0_K[n]) for every integer n. Prove it by a Kashiwara embedding into a smooth ambient scheme, computing Hom as de Rham cohomology of the holonomic internal Hom pushed to the point, and flat base change for de Rham pushforward on finite-type schemes. This is the single field-comparison input; DModules.boundedEquivariantExt_baseChange and Satake.sphericalHeart_semisimple use it. Provider: Missing; implement here. Tau Ceti pin e0610cce4004d628cbd9d2aafdbbb5459fe72938 searched 2026-11-09; Tau Ceti main and roadmap not rechecked for this node."
deps = ["GLCinLean.DModules.holonomic", "GLCinLean.DModules.intermediateExtension", "GLCinLean.DModules.verdierDuality", "GLCinLean.DModules.deRhamPushforward", "GLCinLean.DModules.extraordinaryPullback", "GLCinLean.DModules.starPullback"]
source = "[HottaTakeuchiTanisaki] Chapters 2–3 (direct and inverse images, duality, holonomic modules) and §6.1 (regular holonomic modules); explicit adaptation obligation: no single source states the field base change"
