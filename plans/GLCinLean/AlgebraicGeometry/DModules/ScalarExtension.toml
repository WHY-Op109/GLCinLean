id = "GLCinLean.DModules.boundedEquivariantExt_baseChange"
kind = "theorem"
desc = "For algebraic equivariant regular holonomic complexes supported on a finite union of Schubert varieties, construct scalar extension and prove flat base change of each bounded Ext degree, convolution maps, and equivariance. Descend the support, maps and complexes to a finitely generated characteristic-zero field; use a finite jet group quotient and de Rham-acyclic pro-unipotent transition kernels. Compute each Ext degree using bounded truncations of the simplicial quotient and finite-stage de Rham resolutions. Prove the boundedness/stabilization needed before exchanging tensor with totalization; do not assume tensor preserves arbitrary limits. Provider: Missing; implement here. This comparison is a proof obligation for the de Rham adaptation, not a theorem quoted verbatim from ABG. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.Hecke.schubertStratification", "GLCinLean.DModules.equivariantIndscheme", "GLCinLean.DModules.perverseHeart", "GLCinLean.Sheaves.qcoh", "GLCinLean.Infinity.tStructure"]
