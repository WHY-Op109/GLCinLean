desc = 'Right crystals on smooth schemes as modules over differential operators, and on singular schemes through a closed embedding.'

[[node]]
id = 'GLCinLean.DModules.rightCrystals_equiv_dModules'
kind = 'definition'
desc = '''For a smooth scheme X of finite type over the ground field k, of characteristic 0, let D_X be the sheaf of rings DModules.differentialOperators of X over k, and let Dmod^r_qc(X) be the full subcategory of Infinity.enhancedDerivedCategory of the sheaves of right D_X-modules on the objects whose cohomology sheaves are quasi-coherent O_X-modules, with the t-structure of that node. The right t-structure of the right crystals on a scheme Z of finite type is the one for which an object is coconnective exactly when its image under the forgetful functor to IndCoh(Z) is coconnective for Sheaves.indcohTStructure ([Crystals] §4.2.2). Complexes of k-vector spaces act on the complexes of sheaves of right D_X-modules by the tensor product over k, which preserves quasi-isomorphisms in each variable and so passes to the localization (Infinity.linearCategory). The node is a Vect_k-linear equivalence from the right crystals on X (DModules.RightCrystals) to Dmod^r_qc(X), where the action on the latter tensors complexes over k using the central action of k on D_X, t-exact for the right t-structure and compatible with the forgetful functors: the forgetful functor of the crystals to IndCoh(X), followed by Ψ_X : IndCoh(X) → QCoh(X) (Sheaves.psi), corresponds to the functor that forgets the action of D_X ([Crystals] §5.5.2). Ψ_X is an equivalence for a smooth X: by Sheaves.upsilon_isEquivalence_of_smooth, because Ψ_X ∘ Υ_X is the tensor product with the invertible object Ψ_X(ω_X). So the heart of the right t-structure is the abelian category of the right D_X-modules with quasi-coherent underlying O_X-module. When X is separated of pure dimension, the side change of DModules.transferModule (4) identifies this heart with Mod_qc(D_X) of DModules.coherentDModule; DModules.Coherent, DModules.IsHolonomic and DModules.IsRegularHolonomic use this identification. Pullback: for a morphism f : X → Y of smooth separated schemes of finite type of pure dimensions, the equivalences for X and Y and the side changes carry the functor that f^! (DModules.extraordinaryPullback) induces on homotopy categories, restricted to the objects with bounded cohomology, to f^† of DModules.transferModule (2), restricted to the complexes with quasi-coherent cohomology ([Crystals] Remark 5.5.6 states the compatibility for left crystals and left D-modules). Construct the equivalence through left crystals, as in [Crystals] §5.5, so that it rests on DModules.leftCrystalsEquivRightCrystals and not the other way round. [Crystals] §5.5.3 takes, on an affine X, the derived category of the abelian category of the left D-modules; the proof identifies it with Dmod^r_qc(X) after the side change, and passes to a general X by the Zariski descent of both sides, which for the crystals is a case of DModules.rightCrystals_hDescent. For a scheme Y of finite type that may be singular, with a closed embedding into a smooth scheme X, identify right crystals on Y with the objects of Dmod^r_qc(X) supported on Y (DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion); the functor from the crystals on Y to the crystals on X, which is the inverse of that equivalence followed by the inclusion, is t-exact for the right t-structures ([Crystals] Proposition 4.2.5), and this node includes that statement. This is the D-module category that DModules.deRhamPushforward, DModules.Coherent and DModules.IsHolonomic use on singular schemes. Provider: here, for the equivalence, the comparison of the pullbacks and the case of singular schemes. The sheaf D_X, the enhanced derived category of the sheaves of its modules, and the classical modules and functors are the roadmap nodes DModules.differentialOperators, Infinity.enhancedDerivedCategory, DModules.coherentDModule and DModules.transferModule; they are not written again here.'''
deps = ['GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.leftCrystalsEquivRightCrystals', 'GLCinLean.Sheaves.upsilon_isEquivalence_of_smooth', 'GLCinLean.Infinity.tStructure', 'GLCinLean.DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.rightCrystals_hDescent', 'GLCinLean.DModules.differentialOperators', 'GLCinLean.Infinity.enhancedDerivedCategory', 'GLCinLean.DModules.transferModule', 'GLCinLean.Sheaves.indcohTStructure', 'GLCinLean.Sheaves.psi']
