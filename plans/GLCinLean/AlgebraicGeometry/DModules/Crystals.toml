desc = 'For a locally almost finite type prestack Y, the equivalence Υ_{Y_dR} : QCoh(Y_dR) ≃ IndCoh(Y_dR) from left crystals to right crystals (DModules.rightCrystals), F ↦ F ⊗ ω_{Y_dR} for the action of QCoh on IndCoh, with the proof that it is an equivalence and the compatibility of *-pullback of left crystals with !-pullback of right crystals. Prove the equivalence on affine almost finite type schemes, through a closed embedding into a smooth scheme and its formal completion, and extend by right Kan extension. Provider: here.'
