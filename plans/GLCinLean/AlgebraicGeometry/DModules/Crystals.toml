desc = 'Right crystals (D-modules) on prestacks locally almost of finite type.'

[[node]]
id = 'GLCinLean.DModules.rightCrystals'
kind = 'definition'
desc = 'Right crystals on a locally almost finite type prestack via IndCoh on its de Rham prestack, with !-pullback. The comparison with modules over differential operators on smooth schemes is DModules.rightCrystals_equiv_dModules. Provider: here.'
deps = ['GLCinLean.Derived.deRhamPrestack', 'GLCinLean.Sheaves.indcoh', 'GLCinLean.Derived.deRhamPrestack_locallyAlmostFiniteType']
source = '[Crystals] §§2.3.1–2.3.2; [IndCoh] §10.1.2'

[[node]]
id = 'GLCinLean.DModules.leftToRightCrystals'
kind = 'definition'
desc = 'For a locally almost finite type prestack Y, the continuous functor Υ_{Y_dR} : QCoh(Y_dR) → IndCoh(Y_dR) from left crystals to right crystals (DModules.rightCrystals), F ↦ F ⊗ ω_{Y_dR} for the action of QCoh on IndCoh, where ω_{Y_dR} is the !-pullback of k. Give its compatibility of *-pullback of left crystals with !-pullback of right crystals along every map of such prestacks, coherently in the map. This node claims no equivalence. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals', 'GLCinLean.Sheaves.qcoh', 'GLCinLean.Sheaves.indcohQCohAction', 'GLCinLean.Derived.deRhamPrestack']
source = '[Crystals] §2.4.1; [IndCoh] §§5.7.5, 10.3.3'

[[node]]
id = 'GLCinLean.DModules.leftCrystalsEquivRightCrystals'
kind = 'definition'
desc = 'For a smooth scheme X of finite type, the functor DModules.leftToRightCrystals on X_dR as an equivalence QCoh(X_dR) ≃ IndCoh(X_dR), with its compatibility with pullback along every map between such schemes, including closed embeddings such as the diagonals X^J → X^I. Prove it as in the proof of [Crystals] Prop. 2.4.4 with the smooth scheme taken to be X itself: by descent of left and right crystals along X → X_dR (DModules.crystals_descent_of_classicallyFormallySmooth), reduce to the terms of the Čech nerve, which are the formal completions of the powers of X along the diagonal (Derived.deRhamCechNerve_formalCompletion); there compare the localization sequences of QCoh and IndCoh with the equivalences on the smooth scheme and on the open complement (Sheaves.qcoh_formalCompletion_localization, Sheaves.indcoh_formalCompletion_localization, Sheaves.upsilon_isEquivalence_of_smooth). The general statement for locally almost finite type prestacks is not planned: its only user, Spectral.localization, needs the schemes X^I. Provider: here.'
deps = ['GLCinLean.DModules.leftToRightCrystals', 'GLCinLean.DModules.crystals_descent_of_classicallyFormallySmooth', 'GLCinLean.Derived.deRhamCechNerve_formalCompletion', 'GLCinLean.Sheaves.upsilon_isEquivalence_of_smooth', 'GLCinLean.Sheaves.qcoh_formalCompletion_localization', 'GLCinLean.Sheaves.indcoh_formalCompletion_localization']
source = '[Crystals] Proposition 2.4.4 and its proof; [IndCoh] Lemma 1.1.6 and Proposition 9.3.3; [DGIndschemes] Propositions 7.1.3 and 7.4.5'

[[node]]
id = 'GLCinLean.DModules.crystals_descent_of_classicallyFormallySmooth'
kind = 'theorem'
desc = 'For a classically formally smooth prestack Y locally almost of finite type, with Čech nerve Y^• of Y → Y_dR, pullback gives equivalences QCoh(Y_dR) ≃ Tot QCoh(Y^•) and IndCoh(Y_dR) ≃ Tot IndCoh(Y^•) for left and right crystals, compatible with DModules.leftToRightCrystals. Smooth schemes are classically formally smooth. Provider: here.'
deps = ['GLCinLean.DModules.leftToRightCrystals', 'GLCinLean.Derived.deRhamPrestack', 'GLCinLean.Derived.deRhamPrestack_locallyAlmostFiniteType', 'GLCinLean.Sheaves.qcoh', 'GLCinLean.Sheaves.indcoh', 'GLCinLean.Infinity.limits']
source = '[Crystals] Lemmas 1.2.4, 2.1.7 and 2.3.11'

[[node]]
id = 'GLCinLean.DModules.rightCrystals_equiv_dModules'
kind = 'definition'
desc = 'For a smooth scheme X of finite type, the sheaf of rings D_X of differential operators and the equivalence of right crystals on X (DModules.rightCrystals) with the enhanced category of right D_X-modules, t-exact for the right t-structure and compatible with the forgetful functors to IndCoh(X) ≃ QCoh(X). Construct it through left crystals, as in [Crystals] §5.5, so that it rests on DModules.leftCrystalsEquivRightCrystals and not the other way round. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals', 'GLCinLean.DModules.leftCrystalsEquivRightCrystals', 'GLCinLean.Sheaves.upsilon_isEquivalence_of_smooth', 'GLCinLean.Infinity.tStructure']
source = '[Crystals] §5.5'
