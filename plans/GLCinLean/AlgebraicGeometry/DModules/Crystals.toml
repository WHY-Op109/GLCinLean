desc = 'Right crystals (D-modules) on prestacks locally almost of finite type, their descent, and their reduction to affine schemes.'

[[node]]
id = 'GLCinLean.DModules.RightCrystals'
kind = 'definition'
desc = 'Right crystals on a locally almost finite type prestack Y: Dmod(Y) = IndCoh(Y_dR), with the !-pullback DModules.extraordinaryPullback. The comparison with modules over differential operators on smooth schemes is DModules.rightCrystals_equiv_dModules. Provider: here.'
deps = ['GLCinLean.Derived.DeRhamPrestack', 'GLCinLean.Sheaves.IndCoh', 'GLCinLean.Derived.deRhamPrestack_locallyAlmostFiniteType']
source = '[Crystals] §§2.3.1–2.3.2; [IndCoh] §10.1.2'

[[node]]
id = 'GLCinLean.DModules.crystals_descent_of_classicallyFormallySmooth'
kind = 'theorem'
desc = 'For a classically formally smooth prestack Y locally almost of finite type, with Čech nerve Y^• of Y → Y_dR, pullback gives equivalences QCoh(Y_dR) ≃ Tot QCoh(Y^•) and IndCoh(Y_dR) ≃ Tot IndCoh(Y^•) for left and right crystals, compatible with Sheaves.upsilon. Smooth schemes are classically formally smooth, and so is the formal completion of a smooth scheme along a closed subscheme, by the fibre-product model of Derived.FormalCompletion. Provider: here.'
deps = ['GLCinLean.Sheaves.upsilon', 'GLCinLean.Derived.DeRhamPrestack', 'GLCinLean.Derived.deRhamPrestack_locallyAlmostFiniteType', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.IndCoh', 'GLCinLean.Infinity.limits', 'GLCinLean.Derived.FormalCompletion']
source = '[Crystals] Lemmas 1.2.4, 2.1.7 and 2.3.11; [DGIndschemes] §8.4.2'

[[node]]
id = 'GLCinLean.DModules.rightCrystals_hDescent'
kind = 'theorem'
desc = 'Right crystals on affine schemes almost of finite type satisfy h-descent, through étale descent and proper surjective descent; in particular they satisfy smooth descent, which defines and computes them on algebraic stacks. Provider: here.'
deps = ['GLCinLean.DModules.RightCrystals', 'GLCinLean.Sheaves.IndCoh', 'GLCinLean.Derived.DeRhamPrestack', 'GLCinLean.Infinity.limits']
source = '[Crystals] Proposition 3.2.2'

[[node]]
id = 'GLCinLean.DModules.crystals_rightKanExtension_of_affine'
kind = 'theorem'
desc = 'For a locally almost finite type prestack Y, left crystals QCoh(Y_dR) and right crystals IndCoh(Y_dR) are the limits of the left and right crystals of the classical affine schemes of finite type mapping to Y, along pullback; the comparison maps are compatible with Sheaves.upsilon. Provider: here.'
deps = ['GLCinLean.Sheaves.upsilon', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.Derived.deRhamPrestack_locallyAlmostFiniteType', 'GLCinLean.Infinity.rightKanExtension']
source = '[Crystals] Lemma 1.1.4, Corollary 1.3.9 and Corollaries 2.2.4 and 2.3.9'
