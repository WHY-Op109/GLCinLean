desc = 'The *-pullback of D-modules, a partially defined functor.'

[[node]]
id = 'GLCinLean.DModules.starPullback'
kind = 'definition'
desc = '*-pullback of D-modules. For a map f : Y → Z of schemes of finite type, f^* is the partially defined left adjoint of de Rham pushforward (DModules.deRhamPushforward), with values in pro-objects in general. On holonomic objects it is D f^! D (DModules.verdierDuality), with holonomic values; on all objects when f is smooth of relative dimension d, a locally constant function, f^* = f^![−2d]. On algebraic stacks of finite type it is extended to holonomic objects by smooth descent. Whittaker.vacuumPoincare uses that *-pullback along a smooth map of algebraic stacks of finite type preserves holonomic objects, and that add^* is the shifted !-pullback. Provider: here.'
deps = ['GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.rightCrystals_hDescent', 'GLCinLean.DModules.verdierDuality']
source = '[BradenDG] §3.1.2 and Appendix A.3; [GaRanII]; [GLC1] §§1.3.6–1.3.8'
