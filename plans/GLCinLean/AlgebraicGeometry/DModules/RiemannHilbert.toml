desc = 'The Riemann–Hilbert correspondence over C for the regular holonomic complexes on a scheme that is closed in a smooth scheme, and its restriction to the complexes lisse along a stratification. Its uses are the transfer of parity of IC stalks (Satake.ic_starRestriction_isEven) and Satake.regularSheafExt_complexComparison; no embedding of the original field into C is assumed.'

[[node]]
id = 'GLCinLean.DModules.analyticDeRham_isEquivalence'
kind = 'theorem'
desc = '''Over k = C, for the separated schemes of finite type in the scope of DModules.analyticDeRham (the schemes with a closed embedding into a smooth separated scheme of finite type of pure dimension; every quasi-projective scheme is one). Let Y be such a scheme, and DR_Y the de Rham functor of DModules.analyticDeRham for a closed embedding of Y; each statement holds for every embedding, and each compatibility is the existence of a natural isomorphism. DR_Y is an equivalence from the bounded regular holonomic complexes on Y to D^b_c(Y, C) of Constructible.DerivedCategory, which commutes with proper pushforward, with *- and !-pullback along all maps of such schemes, with external products and with Verdier duality, and hence, by adjunction, with j_* and j_! along locally closed embeddings j, and preserves Hom in every degree. Proof, from the roadmap node DModules.regularHolonomicDeRham. Equivalence: for a closed embedding i : Y → X into a smooth X, DR_X is an equivalence by (1) of that node; i_* is an equivalence from the regular holonomic complexes on Y to those on X whose restriction to X ∖ Y is zero (DModules.rightCrystals_equiv_dModules, and the consequence of step (a4) of DModules.IsRegularHolonomic: a holonomic complex on Y is regular exactly when its direct image on X is); the direct image along the map of complex points is one on the constructible side ((8) of Constructible.DerivedCategory); and DR_X commutes with the restriction to X ∖ Y, so it matches the two subcategories. Maps. Let f : Y → Y′ be a map of schemes of the scope, with closed embeddings i and i′ into smooth X and X′. (a) Direct image, for every f. The map g = (i, i′ ∘ f) is a closed embedding of Y into X × X′, and i′ ∘ f = p ∘ g for the projection p to X′. By (4) of DModules.analyticDeRham for g and for i′, by (3) of the roadmap node for p with the comparison of the direct images in DModules.deRhamPushforward, and by the composition isomorphisms of both sides, the direct image of the complex points of i′ applied to DR_{Y′} ∘ f_* and to Rf_* ∘ DR_Y gives isomorphic functors; that direct image is fully faithful. (b) !-pullback along a closed embedding f. The direct image f_* is left adjoint to f^! on both sides (the proper adjunction of DModules.deRhamPushforward; (1) of Constructible.DerivedCategory). DR_Y and DR_{Y′} are equivalences and (a) identifies the left adjoints, so the right adjoints are identified. (c) !-pullback along the projection q : X × Y′ → Y′. It is the base change of the projection p : X × X′ → X′ along i′. For e = id × i′, the base change p^! i′_* ≅ e_* q^! holds on both sides (the base change of DModules.deRhamPushforward; (4) of Constructible.DerivedCategory, by passing to the right adjoints). The case of p is (3) of the roadmap node, with the comparison of f^! with f^† in DModules.rightCrystals_equiv_dModules; with (4) of DModules.analyticDeRham for e and for i′ it gives the case of q, because the direct image of the complex points of e is fully faithful. (d) !-pullback along every f: f is the composite of the closed embedding (i, f) of Y into X × Y′ and of q. (e) Duality is (5) of DModules.analyticDeRham. The *-pullback is the conjugate of the !-pullback by the dualities, on both sides (DModules.starPullback; (3) of Constructible.DerivedCategory). (f) External products: i × i′ is a closed embedding of Y × Y′ into X × X′, the external product commutes with the direct images along closed embeddings on both sides, and the case of X × X′ is (5) of the roadmap node. That case is stated for the external product of left D-modules, and this node for the external product of right crystals (DModules.shriekTensor). For the right crystals, the compatibility with the direct images along closed embeddings and the comparison of the two external products on smooth separated schemes of finite type of pure dimensions are the lemmas (g1) and (g2) of DModules.IsRegularHolonomic, whose stability under the external product uses them; this node takes them from there. (g) j_* is the case (a), j_! is its conjugate by the dualities, and an equivalence preserves Hom in every degree. The proof uses the isomorphisms of (3) of the roadmap node for one map at a time, and no compatibility of them with composition. Restriction to a stratification. Let S be a finite algebraic stratification of Y by smooth connected strata. Write Dᵇ_{rh,S}(Y) for the bounded regular holonomic complexes M on Y such that, for every stratum T with inclusion i_T, the D-module star-pullback i_T^*M (DModules.starPullback) has lisse cohomology. DR_Y carries Dᵇ_{rh,S}(Y) into D^b_S(Y, C) of Constructible.StratifiedDerivedCategory: DR commutes with i_T^*, and on the smooth stratum T it carries a regular holonomic module that is a vector bundle with a connection to its sheaf of horizontal sections, a local system of finite rank, shifted by dim T ((6) of the roadmap node). If S is good with coefficients C (Constructible.StratifiedDerivedCategory), DR_Y restricts to a t-exact equivalence from Dᵇ_{rh,S}(Y) to D^b_S(Y, C), with the perverse t-structure of Constructible.PerverseSheaves restricted to it, taking holonomic modules to perverse sheaves and intermediate extensions to intermediate extensions. That every object of D^b_S(Y, C) is reached uses the converse on a stratum: a regular holonomic module on a smooth T whose image is a shifted local system is a vector bundle with a connection. This is (6) of the roadmap node, carried to the right crystals on T by (a) of DModules.analyticDeRham. This node uses no statement of ComplexComparisonPartII directly: C5.6 `deligneRiemannHilbert`, and the agreement of its test of regularity with that of DModules.regularHolonomicDModule, are inputs of (6) of the roadmap node. Under this restriction, proper pushforward and *-pullback preserve the subcategories under the conditions on maps of Constructible.IsStratifiedMap (strata into strata for *-pullback; stratified maps for proper pushforward). The D-module goodness of DModules.perverseHeart is goodness with coefficients C under this equivalence. Only regular holonomic objects are compared; lisse irregular connections on strata are excluded. The finite unions of Schubert varieties in Gr_G with their Schubert stratification are the instance used; they are projective. Provider: here, for the schemes that need not be smooth, for the crystals and their functors, and for the restriction to a stratification. The equivalence for the left D_X-modules on a smooth X, with its compatibilities, is the roadmap node DModules.regularHolonomicDeRham; it is not written again here. SpringerResolutionAndCharacteristicCycles §11.3 states the restriction to a stratification in one case, the strongly B-equivariant modules on a finite flag variety with its Schubert cells; that case is not a plan node.'''
