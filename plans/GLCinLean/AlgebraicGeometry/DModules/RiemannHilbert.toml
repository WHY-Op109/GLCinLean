source = '[HottaTakeuchiTanisaki] Theorems 7.1.1, 7.2.2 and 7.2.5 (the Riemann–Hilbert correspondence for a smooth algebraic variety and its compatibility with the direct and inverse images) and Chapter 8 (perverse sheaves); the book is not in references/. The passage to a closed subscheme of a smooth scheme and the restriction to a stratification are adaptations of this plan'
