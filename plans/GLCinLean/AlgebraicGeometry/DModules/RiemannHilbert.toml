desc = 'The Riemann–Hilbert correspondence over C for regular holonomic complexes lisse along a stratification. Its uses are the transfer of parity of IC stalks (Satake.ic_starRestriction_isEven) and Satake.regularSheafExt_complexComparison; no embedding of the original field into C is assumed.'

[[node]]
id = 'GLCinLean.DModules.analyticDeRham_isEquivalence'
kind = 'theorem'
desc = 'Over k = C, for a separated scheme Y of finite type with an algebraic stratification S by smooth connected strata: the de Rham functor (DModules.analyticDeRham) is a t-exact equivalence from the bounded regular holonomic complexes on Y whose cohomology is lisse along S to D^b_S(Y, C) of Constructible.DerivedCategory, taking holonomic modules to perverse sheaves. It sends intermediate extensions to intermediate extensions, commutes with proper pushforward, with *- and !-pullback along maps that respect the stratifications, and with external products, and preserves Hom in every degree. Only regular holonomic objects are compared; lisse irregular connections on strata are excluded. The finite unions of Schubert varieties in Gr_G with their Schubert stratification are the instance used. Provider: here.'
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.IsRegularHolonomic', 'GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.DModules.analyticDeRham']
source = '[HottaTakeuchiTanisaki] Chapter 7 (Riemann–Hilbert correspondence) and Chapter 8 (perverse sheaves)'
