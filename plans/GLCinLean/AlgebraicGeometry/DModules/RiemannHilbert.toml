desc = 'The Riemann–Hilbert correspondence over C for regular holonomic complexes lisse along a stratification. Its uses are the transfer of parity of IC stalks (Satake.ic_starRestriction_isEven) and Satake.regularSheafExt_complexComparison; no embedding of the original field into C is assumed.'

[[node]]
id = 'GLCinLean.DModules.analyticDeRham_isEquivalence'
kind = 'theorem'
desc = 'Over k = C, for a separated scheme Y of finite type: the de Rham functor (DModules.analyticDeRham) is an equivalence from the bounded regular holonomic complexes on Y to D^b_c(Y, C) of Constructible.DerivedCategory, which commutes with proper pushforward, with *- and !-pullback along all maps, with external products and with Verdier duality, and preserves Hom in every degree. Restriction: for an algebraic stratification S by smooth connected strata that is good with coefficients C (Constructible.DerivedCategory), it restricts to a t-exact equivalence from the complexes whose cohomology is lisse along S to D^b_S(Y, C), taking holonomic modules to perverse sheaves and intermediate extensions to intermediate extensions. Under this restriction, proper pushforward and *-pullback preserve the subcategories under the conditions on maps of Constructible.DerivedCategory (strata into strata for *-pullback; stratified maps for proper pushforward). The D-module goodness of DModules.perverseHeart is goodness with coefficients C under this equivalence. Only regular holonomic objects are compared; lisse irregular connections on strata are excluded. The finite unions of Schubert varieties in Gr_G with their Schubert stratification are the instance used. Provider: here.'
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.IsRegularHolonomic', 'GLCinLean.Constructible.ComplexPoints', 'GLCinLean.Constructible.DerivedCategory', 'GLCinLean.Constructible.PerverseSheaves', 'GLCinLean.DModules.analyticDeRham', 'GLCinLean.DModules.shriekTensor']
source = '[HottaTakeuchiTanisaki] Chapter 7 (Riemann–Hilbert correspondence) and Chapter 8 (perverse sheaves)'
