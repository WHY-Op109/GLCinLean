desc = 'Regular holonomic D-modules.'

[[node]]
id = 'GLCinLean.DModules.IsRegularHolonomic'
kind = 'definition'
desc = '''Regular holonomic D-modules and complexes on finite-type schemes over a field of characteristic zero. Definition: for a smooth separated scheme Y of finite type of pure dimension, a holonomic object of the heart (DModules.IsHolonomic) is regular when the left D_Y-module that DModules.rightCrystals_equiv_dModules attaches to it is regular in the sense of DModules.regularHolonomicDModule; a scheme of finite type is treated Zariski-locally through a closed embedding into an affine space, as in DModules.IsHolonomic; a holonomic complex is regular when its cohomology objects are. Step (a) below proves that this is well posed. Theorem of this node, the curve criterion, for an algebraically closed ground field: a holonomic complex M on a scheme Y of finite type is regular exactly when, for every locally closed immersion c : C → Y of a smooth curve, the holonomic complex c^!M on C is regular. This theorem makes the definition a reformulation of the definition by restriction to curves. Its direction from M to c^!M is a case of the stability under !-pullback, below. The regular holonomic modules are closed under subquotients and extensions, by (1) of DModules.regularHolonomicDModule. Theorems of this node, the stability: the regular holonomic complexes are stable under the six operations for maps of schemes of finite type, which need not be separated. The operations are de Rham pushforward (DModules.deRhamPushforward), !-pushforward (DModules.holonomicShriek), !-pullback (DModules.extraordinaryPullback), *-pullback (DModules.starPullback), Verdier duality (DModules.verdierDuality) and the !-tensor product (DModules.shriekTensor); the regular holonomic complexes are also stable under the external product of DModules.shriekTensor. Classical input of the stability: for the left modules on the smooth separated schemes of finite type of pure dimension over a field of characteristic 0, the stability of the complexes with regular holonomic cohomology under f_+, f^† and the external product is the roadmap node DModules.regularHolonomicDModule_directImage_inverseImage, called the stability node below, and the stability under duality is (3) of DModules.regularHolonomicDModule. Provider of the stability: here, for the passage from the left modules on these schemes to the crystals on the schemes of finite type and to all maps of finite type. The passage uses no extension of the base field: the steps (a) to (g) hold over every field of characteristic 0, and they use the classical input only through the statements of the two roadmap nodes. Comparisons that the steps use. For a morphism f of smooth separated schemes of finite type of pure dimensions, on bounded complexes, f^! is f^† (DModules.rightCrystals_equiv_dModules) and f_* is f_+ (DModules.deRhamPushforward). For a closed embedding g of schemes of finite type with open complement u, g^! g_* is the identity (DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion), and g_* g^! K is the fibre of K → u_* u^! K. The direct image along a closed embedding and the restriction to an open subscheme are t-exact, so the steps pass between a complex and its cohomology objects. (a) The definition is well posed. (a1) Closed embeddings of smooth schemes. For a closed embedding i : W → X of smooth separated schemes of finite type of pure dimensions, a holonomic D_W-module M is regular exactly when i_+M is: i_+ preserves regularity by (1) of the stability node, and M ≅ H⁰(i^† i_+ M) (DModules.transferModule (7)) is regular by (2) of the stability node when i_+M is. (a2) Open covers of smooth schemes. For a finite open cover of such an X with inclusions u_c, a holonomic D_X-module M is regular exactly when every u_c^†M is: u_c^† preserves regularity by (2) of the stability node; and M is a submodule of the direct sum of the H⁰(u_{c+} u_c^† M), which is regular by (1) of the stability node, so M is regular by (1) of DModules.regularHolonomicDModule. (a3) Two embeddings. Let i_1 and i_2 be closed embeddings of a scheme Y of finite type into smooth separated schemes A_1 and A_2 of finite type of pure dimensions, and M a holonomic complex on Y. Then i_{1*}M is regular exactly when i_{2*}M is. The map g = (i_1, i_2) is a closed embedding of Y into A_1 × A_2, and the projections p_r have p_r ∘ g = i_r. If g_*M is regular, i_{r*}M ≅ p_{r*} g_* M is regular by (1) of the stability node. If i_{r*}M is regular, then g_*M ≅ g_* g^! p_r^! i_{r*} M is the fibre of K → u_* u^! K for K = p_r^! i_{r*} M and the inclusion u of the open complement of g(Y), and it is regular by (1) and (2) of the stability node. (a4) Charts. A holonomic complex M on a scheme Y of finite type is regular when, for a finite cover of Y by affine open subschemes U_a with closed embeddings i_a into affine spaces, every i_{a*}(M|U_a) is regular. This does not depend on the embeddings, by (a3). It does not depend on the cover: for an affine open U with a closed embedding i into an affine space A and an affine open U′ of U, U′ is closed in an open subscheme A° of A, the restriction of i_*(M|U) to A° is the direct image of M|U′, and (a2) and (a3) compare the conditions for U and for a cover of U by such U′. For a smooth separated Y of pure dimension it agrees with the definition through the left D_Y-module, by (a2) and (a1). Consequence: for a closed embedding i of a scheme Y of finite type into a smooth separated scheme X of finite type of pure dimension, a holonomic complex M on Y is regular exactly when i_*M is; DModules.analyticDeRham and DModules.analyticDeRham_isEquivalence use this for their embeddings. (b) !-pullback along f : Y → Z, for affine Y and Z with closed embeddings i_Y and i_Z into affine spaces A and A′. The map g = (i_Y, i_Z ∘ f) is a closed embedding of Y into A × A′, and the projection p to A′ has p ∘ g = i_Z ∘ f. For a regular complex N on Z, g_* f^! N ≅ g_* g^! p^! i_{Z*} N is the fibre of K → u_* u^! K for K = p^! i_{Z*} N and the inclusion u of the open complement of g(Y); it is regular by (1) and (2) of the stability node, and f^! N is regular by (a4). For all Y and Z: regularity is local on Y by (a4), and f^! commutes with the restriction to open subschemes of Y and of Z. (c) de Rham pushforward along f : Y → Z for affine Y and Z, in the notation of (b): i_{Z*} f_* M ≅ p_* g_* M, which is regular by (1) of the stability node, so f_* M is regular by (a4). (d) de Rham pushforward along every map f : Y → Z of schemes of finite type. Z is affine, because regularity is local on Z by (a4) and f_* commutes with the restriction to an open subscheme of Z (the base change of DModules.deRhamPushforward). For open subschemes U and V that cover Y, with inclusions u, v and w of U, V and U ∩ V, a complex M lies in an exact triangle M → u_* u^! M ⊕ v_* v^! M → w_* w^! M (the Zariski descent of crystals, DModules.rightCrystals_hDescent, and the open adjunction of DModules.deRhamPushforward), so f_* M is regular when (f ∘ u)_*, (f ∘ v)_* and (f ∘ w)_* preserve regular complexes. First let Y be separated, and induct on the number n of affine open subschemes in a cover of Y: n = 1 is (c); for the step, U is one of them and V the union of the others, and U ∩ V is covered by n − 1 affine open subschemes, because Y is separated. For every Y, the same induction: U ∩ V is open in the affine U, so it is separated. A map that is not separated, such as the map from the line with a doubled origin to the point, is treated by this step and has no factorization into an open immersion and a proper map. (e) Verdier duality. 𝔻 commutes with the restriction to an open subscheme (the case d = 0 of the exchange of f^! and f^![−2d] in DModules.verdierDuality) and with the direct image along a closed embedding (the proof obligation of DModules.verdierDuality). On a smooth separated scheme of pure dimension it is the duality of left modules, by the comparison of DModules.verdierDuality, and this preserves regularity by (3) of DModules.regularHolonomicDModule. So for a chart i of an affine open U, i_* 𝔻(M|U) ≅ 𝔻 i_*(M|U) is regular, and 𝔻M is regular by (a4). (f) The !-pushforward is 𝔻 f_* 𝔻 and the *-pullback is 𝔻 f^! 𝔻 on holonomic complexes. (g) External product. Two proof obligations of this node, each stated as a lemma of its own, because DModules.analyticDeRham_isEquivalence uses both. (g1) Closed embeddings: for closed embeddings i : Y → A and i′ : Y′ → A′ of schemes of finite type, an isomorphism (i × i′)_*(M ⊠ M′) ≅ i_*M ⊠ i′_*M′, natural in the right crystals M on Y and M′ on Y′. Proof: the external product commutes with !-pullback (DModules.shriekTensor); so the right side restricts to zero on (A ∖ Y) × A′ and on A × (A′ ∖ Y′), which cover the complement of Y × Y′, and its !-pullback to Y × Y′ is i^! i_*M ⊠ i′^! i′_*M′ ≅ M ⊠ M′; the equivalence of DModules.extraordinaryPullback_isEquivalence_of_isClosedImmersion for i × i′ gives the isomorphism. (g2) Left modules: for smooth separated schemes X and X′ of finite type of pure dimensions, the equivalences of DModules.rightCrystals_equiv_dModules for X, X′ and X × X′ and the side changes carry the functor that the external product of right crystals induces on the homotopy categories, on the complexes with bounded cohomology, to the external product of left D-modules of DModules.regularHolonomicDModule_directImage_inverseImage_complex, by an isomorphism natural in both variables. Its inputs: the equivalence is built through left crystals, whose external product is that of the underlying quasi-coherent sheaves; the sheaf of differential operators of X × X′ is the external product of those of X and X′, and the comparison identifies the two actions of the differential operators and not only the underlying sheaves; ω of X × X′ is the external product of ω of X and ω of X′, for the side change and for the passage between left and right crystals (DModules.leftCrystalsEquivRightCrystals), whose shifts are additive in the dimensions of X and X′. With (g1), (g2) and (a4), the external product of regular complexes on affine Y and Y′ is regular by (3) of the stability node. For all Y and Y′: the external product commutes with the restriction to the open subschemes U × U′, which cover Y × Y′. The !-tensor product is Δ^!(M ⊠ N), which is regular by (b); the diagonal Δ need not be a closed embedding. Theorem of this node on equivariant modules: let a smooth algebraic group H over a field k of characteristic zero act geometrically transitively on a smooth separated finite-type k-scheme Y with geometrically connected stabilizers. A holonomic object of the heart on Y with crystal descent data for the action groupoid (DModules.EquivariantIndscheme) is regular. Compare its descent isomorphism on H × Y, with its unit and cocycle, to the strongly equivariant isomorphism of SpringerResolutionAndCharacteristicCycles §9.8 under side change and smooth pullback. Over an algebraic closure, use the classification of strongly equivariant connections on an orbit in §9.9. Deduce the assertion over k by geometric regularity. That the scalar extension functor preserves regular holonomic complexes is stated in DModules.scalarExtension; (4) of the roadmap node DModules.regularHolonomicDModule is its classical input. The classical input of the theorem on equivariant modules is the classification of the strongly equivariant connections on an orbit, a target of SpringerResolutionAndCharacteristicCycles §9.9 with §9.8; it is not a plan node. Provider: here, for the definition on schemes of finite type, for the curve criterion, for the passage of the stability to the crystals, and for the theorem on equivariant modules. The regular holonomic modules over D_Y and their stability under the operations on smooth schemes are the roadmap nodes DModules.regularHolonomicDModule and DModules.regularHolonomicDModule_directImage_inverseImage; they are not written again here.'''
