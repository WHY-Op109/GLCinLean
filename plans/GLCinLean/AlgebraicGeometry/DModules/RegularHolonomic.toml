desc = 'Regular holonomic D-modules.'

[[node]]
id = 'GLCinLean.DModules.IsRegularHolonomic'
kind = 'definition'
desc = '''Regular holonomic D-modules and complexes on finite-type schemes over a field of characteristic zero. Definition: for a smooth separated scheme Y of finite type of pure dimension, a holonomic object of the heart (DModules.IsHolonomic) is regular when the left D_Y-module that DModules.rightCrystals_equiv_dModules attaches to it is regular in the sense of DModules.regularHolonomicDModule; a scheme of finite type is treated Zariski-locally through a closed embedding into an affine space, as in DModules.IsHolonomic; a holonomic complex is regular when its cohomology objects are. Theorem of this node, the curve criterion, for an algebraically closed ground field: a holonomic complex M on a scheme Y of finite type is regular exactly when, for every locally closed immersion c : C → Y of a smooth curve, the holonomic complex c^!M on C is regular. This theorem makes the definition a reformulation of the definition by restriction to curves. The regular holonomic modules are closed under subquotients and extensions, by (1) of DModules.regularHolonomicDModule. Theorems of this node: the regular holonomic complexes are stable under the six operations for finite-type maps, which are de Rham pushforward (DModules.deRhamPushforward), !-pushforward (DModules.holonomicShriek), !-pullback (DModules.extraordinaryPullback), *-pullback (DModules.starPullback), Verdier duality (DModules.verdierDuality) and the !-tensor product (DModules.shriekTensor). Theorem of this node on equivariant modules: let a smooth algebraic group H over a field k of characteristic zero act geometrically transitively on a smooth separated finite-type k-scheme Y with geometrically connected stabilizers. A holonomic object of the heart on Y with crystal descent data for the action groupoid (DModules.EquivariantIndscheme) is regular. Compare its descent isomorphism on H × Y, with its unit and cocycle, to the strongly equivariant isomorphism of SpringerResolutionAndCharacteristicCycles §9.8 under side change and smooth pullback. Over an algebraic closure, use the classification of strongly equivariant connections on an orbit in §9.9. Deduce the assertion over k by geometric regularity. Of the stabilities, the roadmap node gives in (3) those under duality and under pullback along a smooth map; the others have no accepted roadmap. For the left modules on the smooth separated schemes of pure dimension over the complex numbers, the stability under f_+, f_!, a general f^†, the external product and the restriction to the diagonal is also presupposed by (1), (3) and (5) of the roadmap node DModules.regularHolonomicDeRham, and the roadmap MixedHodgeModulesAndIrregularHodgeTheory requests it from SpringerResolutionAndCharacteristicCycles as `gap:regular-holonomic-stability`; no roadmap states it as a target. In that case the two are one theorem, and it is not proved twice. Order of work: the stability theorem of this node is not written, and the roadmap node DModules.regularHolonomicDeRham is not taken up, before the provider of that case is decided with prompts/change.md. That change chooses the provider of that case and the route of this theorem; this node chooses neither. The definition of this node does not wait for the decision. That the scalar extension functor preserves regular holonomic complexes is stated in DModules.scalarExtension; (4) of the roadmap node is its classical input. The classical input of the theorem on equivariant modules is the classification of the strongly equivariant connections on an orbit, a target of SpringerResolutionAndCharacteristicCycles §9.9 with §9.8; it is not a plan node. Provider: here, for the definition on schemes of finite type and for these theorems. The regular holonomic modules over D_Y are the roadmap node DModules.regularHolonomicDModule; they are not written again here.'''
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.regularHolonomicDModule', 'GLCinLean.DModules.holonomicShriek', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.shriekTensor', 'GLCinLean.DModules.EquivariantIndscheme']
source = '[HottaTakeuchiTanisaki] Chapter 6 (regular holonomic modules; Definition 6.1.1 and Theorem 6.1.6 for the definition and the curve criterion over the complex numbers; the book is not in references/, and the two numbers agree with its English edition) and §7.1'
