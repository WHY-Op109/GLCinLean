desc = "Ambient shriek on ind-holonomic inputs, proved before restriction to invariant categories."

[[node]]
id = "GLCinLean.DModules.indHolonomic"
kind = "definition"
desc = "Define ind-holonomic D-modules on finite-type schemes as the full stable colimit closure of holonomic objects and on ind-finite-type indschemes by compatible finite-stage !-pullback. Prove the equivalent colimit description under closed direct images and stability under !-pullback. Give the finite-support holonomic generators explicitly. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.DModules.holonomic", "GLCinLean.DModules.equivariantIndscheme", "GLCinLean.DModules.deRhamPushforward", "GLCinLean.Infinity.indCompletion"]
source = "[ChenNearbyCycles] §A.4.6; [GaRanII] §0.4.5"

[[node]]
id = "GLCinLean.DModules.indHolonomicShriek"
kind = "theorem"
desc = "For a morphism between ind-finite-type indschemes, construct ambient f_! on ind-holonomic objects. At finite-type stages use holonomic Verdier duality; then extend by colimits of finite-support holonomic generators. Prove the representing property Map(f_!F,A)=Map(F,f^!A) for every ambient target A, using the finite-stage adjunction and limits of mapping spaces. Verify independence of finite-stage factorizations, coherent composition and !-base change by the same generator calculation. This is an explicit extension of the cited finite-type theorem, not merely an adjunction internal to invariant categories. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.DModules.indHolonomic", "GLCinLean.DModules.holonomicShriek", "GLCinLean.DModules.verdierDuality", "GLCinLean.DModules.extraordinaryPullback", "GLCinLean.Infinity.adjointableDiagram_limitAdjunction"]
source = "[GaRanII] §0.4.5 and Remark 1.5.4; indscheme extension from [ChenNearbyCycles] §A.4.6, Lemma A.1.3 and the finite-support colimit presentation"
