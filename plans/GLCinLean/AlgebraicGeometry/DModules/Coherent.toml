desc = 'Coherent D-modules on schemes and algebraic stacks.'

[[node]]
id = 'GLCinLean.DModules.Coherent'
kind = 'definition'
desc = '''Bounded complexes of coherent D-modules on schemes and smooth-local descent to algebraic stacks. Include the atlas criterion; compactness on a stack requires a separate theorem. Classical input: for a smooth separated scheme Y of finite type of pure dimension, an object of the heart of the right t-structure of the right crystals on Y is coherent when the left D_Y-module that DModules.rightCrystals_equiv_dModules attaches to it is coherent in the sense of DModules.coherentDModule. That the coherent modules are closed under kernels, cokernels and extensions is (2) of that node, and that the equivalence of Kashiwara for a closed immersion of smooth schemes preserves coherent modules is DModules.transferModule (7). Provider: here, for the subcategory of the right crystals on every scheme of finite type, which is Zariski-locally a closed subscheme of an affine space (DModules.rightCrystals_equiv_dModules), and on algebraic stacks. That the holonomic complexes lie in this subcategory is stated in DModules.IsHolonomic. The coherent modules over D_Y and their properties are the roadmap node DModules.coherentDModule; they are not written again here.'''
deps = ['GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.tStructure', 'GLCinLean.DModules.rightCrystals_hDescent', 'GLCinLean.DModules.coherentDModule', 'GLCinLean.DModules.transferModule']
source = '[DG2] §§5.1.17, 7.3.1–7.3.2'
