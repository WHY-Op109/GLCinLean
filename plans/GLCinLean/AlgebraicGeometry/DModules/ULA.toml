desc = 'Universally locally acyclic objects of a module category over the D-modules of a scheme, and ULA module categories.'

[[node]]
id = 'GLCinLean.DModules.IsULA'
kind = 'definition'
desc = 'For a scheme S of finite type and a Dmod(S)-module category C: write QCoh(S, C) = C ⊗_{Dmod(S)} QCoh(S), with the adjoint functors Ind : QCoh(S, C) ⇄ C : Oblv induced by the left induction and forgetful functors between QCoh(S) and Dmod(S). An object F of C is universally locally acyclic (ULA) over S if Oblv(F) is compact in QCoh(S, C). API: Oblv is conservative (Lemma B.2.1); for F ULA and G compact in Dmod(S), the object G ⊗ F is compact in C, so ULA objects are compact (Proposition B.4.1, Corollary B.4.2); a Dmod(S)-linear functor with a Dmod(S)-linear right adjoint preserves ULA objects (Proposition B.4.4); and F is ULA exactly when the internal Hom functor Hom_C(F, −) : C → Dmod(S) is continuous and Dmod(S)-linear (Proposition B.5.1). Examples, proved with the definition: for C = Dmod(S), the dualizing module ω_S is ULA, with Oblv(ω_S) = O_S (Example B.6.2); for S smooth, an object of Dmod(S) is ULA exactly when it is compact with lisse cohomology (Example B.4.3). The delta module at a point of the affine line is compact and not ULA. This is a notion for module categories over D-modules; it is not the ULA condition for étale or constructible sheaves over a base. No Tau Ceti roadmap owns it. Provider: here.'
deps = ['GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.crystalInduction', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.schemeQCoh', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.compactObject', 'GLCinLean.Infinity.internalHom', 'GLCinLean.Infinity.rightAdjoint']
source = '[RaskinCPSI] Appendix B.1–B.5'

[[node]]
id = 'GLCinLean.DModules.IsULAModuleCategory'
kind = 'definition'
desc = 'A Dmod(S)-module category C is ULA over S if QCoh(S, C) is compactly generated by the objects P ⊗ Oblv(F), with P a perfect complex on S and F a ULA object of C (DModules.IsULA). Then C is compactly generated (Lemma B.6.3). Examples: Dmod(S) is ULA over S, generated by ω_S (Example B.6.2); the collision categories of rigid categories are ULA (Ran.collisionCategory_isULA). Provider: here.'
deps = ['GLCinLean.DModules.IsULA', 'GLCinLean.Sheaves.PerfectComplex', 'GLCinLean.Infinity.compactGeneration']
source = '[RaskinCPSI] Definition B.6.1, Example B.6.2, Lemma B.6.3'

[[node]]
id = 'GLCinLean.DModules.exists_linearRightAdjoint_iff_preservesULA'
kind = 'theorem'
desc = '''For a ULA Dmod(S)-module category C (DModules.IsULAModuleCategory) and a Dmod(S)-linear continuous functor F : C → D: F has a continuous Dmod(S)-linear right adjoint if and only if F sends ULA objects to ULA objects. One direction is Proposition B.4.4. For the other, F preserves compact objects, because the objects G ⊗ F' with G compact in Dmod(S) and F' ULA generate C; so its right adjoint is continuous (Infinity.rightAdjoint_continuous), and linearity is checked with Proposition B.5.1. Provider: here.'''
deps = ['GLCinLean.DModules.IsULA', 'GLCinLean.DModules.IsULAModuleCategory', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.rightAdjoint_continuous', 'GLCinLean.Infinity.compactGeneration']
source = '[RaskinCPSI] Propositions B.4.4, B.5.1 and B.7.1'

[[node]]
id = 'GLCinLean.DModules.isEquivalence_iff_of_isULAModuleCategory'
kind = 'theorem'
desc = 'Let i : T → S be a closed subscheme with open complement j : U → S, let C be a ULA Dmod(S)-module category and F : C → D a Dmod(S)-linear continuous functor. Then F is an equivalence if and only if F preserves ULA objects and its restrictions F_U : C ⊗_{Dmod(S)} Dmod(U) → D ⊗_{Dmod(S)} Dmod(U) and F_T : C ⊗_{Dmod(S)} Dmod(T) → D ⊗_{Dmod(S)} Dmod(T) are equivalences. The proof takes the linear right adjoint of DModules.exists_linearRightAdjoint_iff_preservesULA and checks the unit and the counit on U and on T. The ULA hypothesis is needed: restriction Dmod(S) → Dmod(U) ⊕ Dmod(T) is linear and an equivalence over U and over T, but it is not an equivalence (Remark B.8.2). Provider: here.'
deps = ['GLCinLean.DModules.IsULAModuleCategory', 'GLCinLean.DModules.exists_linearRightAdjoint_iff_preservesULA', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.linearEquivalence']
source = '[RaskinCPSI] Proposition B.8.1 and Remark B.8.2'
