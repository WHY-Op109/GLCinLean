desc = 'The pullback and pushforward functors of D-modules.'

[[node]]
id = 'GLCinLean.DModules.extraordinaryPullback'
kind = 'definition'
desc = '!-pullback of right crystals and of twisted right crystals: for a map f : Y → Z and an étale μ_n-gerbe 𝒢 on Z, the functor f^! : Dmod_𝒢(Z) → Dmod_{f^*𝒢}(Y), functorial in f. It needs no trivialization of 𝒢; when a trivialization is given, for example of a pulled-back twist, it is compatible with the untwisting equivalences of DModules.twistedCrystals. Provider: here.'
deps = ['GLCinLean.DModules.twistedCrystals']
source = '[GLC1] §1.3.5; [Crystals] §2.3'

[[node]]
id = 'GLCinLean.DModules.holonomicShriek'
kind = 'definition'
desc = 'Partially defined !-pushforward adjoint to !-pullback. For maps of finite-type schemes prove its existence on holonomic objects by Verdier duality, with composition and !-base change; supply the particular extension used for Poincare. Provider: here.'
deps = ['GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.DModules.holonomic', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.deRhamPushforward']
source = '[GLC1] §§1.3.5, 1.3.7; [GaRanII] §0.4.5'

[[node]]
id = 'GLCinLean.DModules.starPullback'
kind = 'definition'
desc = 'Star pullback of D-modules, with its shift conventions and compatibility with exponential character objects. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals']
source = '[GLC1] §§1.3.6–1.3.8; [Crystals] §5.5'
