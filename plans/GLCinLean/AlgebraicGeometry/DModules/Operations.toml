desc = 'The pullback and pushforward functors of D-modules.'

[[node]]
id = 'GLCinLean.DModules.extraordinaryPullback'
kind = 'definition'
desc = '!-pullback of right crystals and of twisted right crystals: for a map f : Y → Z and an étale μ_n-gerbe 𝒢 on Z, the functor f^! : Dmod_𝒢(Z) → Dmod_{f^*𝒢}(Y), functorial in f and natural in the gerbe. It needs no trivialization of 𝒢; when a trivialization is given, for example of a pulled-back twist, it is compatible with the untwisting equivalences of DModules.twistedCrystals. Provider: here.'
deps = ['GLCinLean.DModules.twistedCrystals', 'GLCinLean.Stacks.etaleGerbe']
source = '[GLC1] §1.3.5; [Crystals] §2.3'

[[node]]
id = 'GLCinLean.DModules.holonomicShriek'
kind = 'definition'
desc = 'Partially defined !-pushforward adjoint to !-pullback. For maps of finite-type schemes prove its existence on holonomic objects by Verdier duality, with composition and !-base change; supply the particular extension used for Poincare. Provider: here.'
deps = ['GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.DModules.holonomic', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.DModules.deRhamPushforward']
source = '[GLC1] §§1.3.5, 1.3.7; [GaRanII] §0.4.5'

[[node]]
id = 'GLCinLean.DModules.starPullback'
kind = 'definition'
desc = 'Star pullback of D-modules, with its shift conventions and compatibility with exponential character objects. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals']
source = '[GLC1] §§1.3.6–1.3.8; [Crystals] §5.5'

[[node]]
id = 'GLCinLean.DModules.shriekTensor'
kind = 'definition'
desc = 'The !-tensor product of right crystals on a locally almost finite type prestack Y, M ⊗^! N = Δ^!(M ⊠ N): the value on Y_dR of the symmetric monoidal structure of IndCoh for which !-pullback is symmetric monoidal. Give the external product ⊠ and the symmetric monoidal structure of !-pullback, with unit ω; an object that is étale-locally isomorphic to ω is invertible, so tensoring with it is an equivalence. Proof obligation: the symmetric monoidal structure rests on [IndCoh] Theorem 5.6.3, which that paper states without proof; it is proved with this node. Provider: here.'
deps = ['GLCinLean.DModules.rightCrystals', 'GLCinLean.Sheaves.indcoh', 'GLCinLean.Sheaves.indcohShriekOnSchemes', 'GLCinLean.Infinity.monoidalCategory']
source = '[IndCoh] Proposition 4.6.2, Theorem 5.6.3, §5.6.7 and Corollary 5.6.8 (schemes), §10.3.2 (prestacks)'
