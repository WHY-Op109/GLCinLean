desc = 'Root gerbes of line bundles and D-modules twisted by a gerbe.'

[[node]]
id = 'GLCinLean.DModules.rootGerbe'
kind = 'definition'
desc = 'Étale μ_n-gerbe of n-th roots of a line bundle; objects, morphisms, descent and tautological character. Provider: here, from the classical root gerbe of roadmap SchemeAndStackFoundations (“Quotient stacks, line bundles with a section, root stacks”). Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`).'
deps = ['GLCinLean.Derived.artinStack', 'GLCinLean.Sheaves.qcoh', 'GLCinLean.Stacks.algebraicStack']
