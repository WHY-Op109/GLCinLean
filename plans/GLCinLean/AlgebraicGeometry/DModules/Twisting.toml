desc = 'Étale μ_n-gerbes on prestacks, root gerbes of line bundles, and D-modules twisted by a gerbe.'

[[node]]
id = 'GLCinLean.DModules.etaleGerbe'
kind = 'definition'
desc = 'Étale μ_n-gerbes on a prestack Y, for n ≥ 1 invertible on the base: a compatible family, over the test schemes S → Y, of gerbes banded by μ_n on the étale site of S (a stack in groupoids, locally nonempty and locally connected, with automorphism sheaves identified with μ_n). Give band-preserving equivalences, pullback along maps of prestacks, the tensor product and the inverse of gerbes, trivializations, and the μ_n-torsor by which two trivializations differ; every such gerbe is étale-locally trivial on each test scheme. Not included: the classification by H², other bands, and nonabelian gerbes. Provider: here. Upstream declarations used: `CategoryTheory.Pseudofunctor.IsStack` (`Mathlib.CategoryTheory.Sites.Descent.IsStack`), `TauCeti.AlgebraicGeometry.SchPseudofunctor` (`TauCeti.AlgebraicGeometry.Stack.Basic`), `CategoryTheory.Sheaf.Torsor` (`TauCeti.CategoryTheory.Sites.NonabelianCohomology.Torsor`).'
deps = ['GLCinLean.Derived.prestack', 'GLCinLean.Stacks.groupTorsor', 'GLCinLean.Stacks.algebraicStack']
source = '[GLC1] §1.1.3; [GLys] §1.3'

[[node]]
id = 'GLCinLean.DModules.rootGerbe'
kind = 'definition'
desc = 'The étale μ_n-gerbe (DModules.etaleGerbe) of n-th roots of a line bundle L on a prestack: its objects over a test scheme are line bundles M with an isomorphism M^{⊗n} ≅ L. Give its tautological character, and the band-preserving equivalences R_n(f^*L) ≃ f^*R_n(L), R_n(L) ⊗ R_n(M) ≃ R_n(L ⊗ M) and R_n(L)^{-1} ≃ R_n(L^{-1}), coherently; an n-th root of L is a trivialization. This is not the root stack of a line bundle with a section. Provider: here. Upstream declarations used: `TauCeti.AlgebraicGeometry.InvertibleSheaf` (`TauCeti.AlgebraicGeometry.LineBundle.Basic`).'
deps = ['GLCinLean.DModules.etaleGerbe', 'GLCinLean.Derived.artinStack', 'GLCinLean.Sheaves.qcoh', 'GLCinLean.Stacks.algebraicStack']
source = '[GLC1] §1.1.3; [GLys] §1.4'

[[node]]
id = 'GLCinLean.DModules.twistedCrystals'
kind = 'definition'
desc = 'Twisted right crystals Dmod_𝒢(Y) for an étale μ_n-gerbe 𝒢 on a locally almost finite type prestack Y and a specified character, defined as in [GLys] §1.7: the category of right crystals twisted by the gerbe through the character, as a sheaf of categories over test schemes. These are étale twistings, not the de Rham twistings of [Crystals] §§6–7, with which they are compared only for root gerbes. A trivialization of 𝒢 identifies them with untwisted right crystals (the untwisting equivalence); two trivializations differ by a μ_n-torsor, and the two untwistings differ by tensoring with the rank-one local system of that torsor and the character. Prove étale descent, so that Dmod_𝒢 is computed from étale-local trivializations over test schemes; give functoriality in the gerbe and the !-tensor product Dmod_𝒢₁(Y) ⊗ Dmod_𝒢₂(Y) → Dmod_{𝒢₁⊗𝒢₂}(Y) (DModules.shriekTensor), compatible with the untwisting equivalences. Provider: here.'
deps = ['GLCinLean.DModules.etaleGerbe', 'GLCinLean.DModules.rightCrystals', 'GLCinLean.DModules.rightCrystals_hDescent', 'GLCinLean.DModules.shriekTensor']
source = '[GLys] §§1.7.2–1.7.4; [GLC1] §1.1.3; [GLC2] §1.1.9 and Remark 1.1.13'
