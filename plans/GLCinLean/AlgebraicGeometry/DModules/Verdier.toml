desc = 'Verdier duality of coherent D-modules.'

[[node]]
id = 'GLCinLean.DModules.verdierDuality'
kind = 'definition'
desc = 'Involutive anti-equivalence of coherent D-modules, obtained by descending scheme Verdier duality. For smooth maps it exchanges the !-pullback with the !-pullback shifted by twice the relative dimension (the *-pullback of DModules.starPullback, which on holonomic objects is built from this duality); the proof uses the smooth adjunction of DModules.deRhamPushforward and the duality formula Hom(DM, M′) = Γ_dR(M ⊗^! M′), with the cohomological normalization. Provider: here.'
deps = ['GLCinLean.DModules.Coherent', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.shriekTensor']
source = '[DG2] §5.3 and §7.3.4'
