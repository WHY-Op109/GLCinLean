desc = 'Verdier duality of coherent D-modules.'

[[node]]
id = 'GLCinLean.DModules.verdierDuality'
kind = 'definition'
desc = '''Involutive anti-equivalence of coherent D-modules, obtained by descending scheme Verdier duality. For a smooth map f of relative dimension d it exchanges f^! with f^![−2d], that is D(f^![−2d] M) ≃ f^!(DM) (f^![−2d] is the *-pullback of DModules.starPullback, which on holonomic objects is built from this duality); the proof uses the smooth adjunction of DModules.deRhamPushforward and the duality formula. The duality formula: for a scheme Z of finite type, an equivalence Hom(DM, M′) ≃ Γ_dR(Z, M ⊗^! M′) in Vect_k, natural in M of DModules.Coherent on Z and in every right crystal M′ on Z, where Hom is the Vect_k-valued mapping object of Infinity.internalHom ([DG2] §5.3.1). Classical input: for a smooth separated scheme Y of finite type of pure dimension, the equivalence of DModules.rightCrystals_equiv_dModules and the side change carry the functor that this duality induces on the homotopy category of DModules.Coherent on Y to 𝔻_Y of DModules.transferModule (5); this comparison is a theorem of this node. Theorem of this node: on every scheme of finite type the duality preserves the holonomic complexes of DModules.IsHolonomic and sends a holonomic object of the heart to a holonomic object of the heart; on a smooth separated scheme of pure dimension this is DModules.holonomicDModule (5), through the comparison. Provider: here, for the duality on DModules.Coherent of every scheme of finite type and of algebraic stacks, for the comparison and for the theorem on holonomic complexes. The duality 𝔻_Y of modules over D_Y is in the roadmap node DModules.transferModule; it is not written again here.'''
deps = ['GLCinLean.DModules.Coherent', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.shriekTensor', 'GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.transferModule', 'GLCinLean.Infinity.internalHom', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.holonomicDModule']
source = '[DG2] §5.3 and §7.3.4'
