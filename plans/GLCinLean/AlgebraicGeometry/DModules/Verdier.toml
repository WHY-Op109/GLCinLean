kind = "definition"
desc = "Involutive anti-equivalence of coherent D-modules, obtained by descending scheme Verdier duality. It exchanges smooth extraordinary and ordinary pullback, with the cohomological normalization. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
