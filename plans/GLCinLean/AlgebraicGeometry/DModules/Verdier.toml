desc = 'Verdier duality of coherent D-modules.'

[[node]]
id = 'GLCinLean.DModules.verdierDuality'
kind = 'definition'
desc = '''Involutive anti-equivalence of coherent D-modules, obtained by descending scheme Verdier duality. For a smooth map f of relative dimension d it exchanges f^! with f^![−2d], that is D(f^![−2d] M) ≃ f^!(DM) (f^![−2d] is the *-pullback of DModules.starPullback, which on holonomic objects is built from this duality); the proof uses the smooth adjunction of DModules.deRhamPushforward and the duality formula. The duality formula: for a scheme Z of finite type, an equivalence Hom(DM, M′) ≃ Γ_dR(Z, M ⊗^! M′) in Vect_k, natural in M of DModules.Coherent on Z and in every right crystal M′ on Z, where Hom is the Vect_k-valued mapping object of Infinity.internalHom ([DG2] §5.3.1). Classical input: for a smooth separated scheme Y of finite type of pure dimension, the equivalence of DModules.rightCrystals_equiv_dModules and the side change carry the functor that this duality induces on the homotopy category of DModules.Coherent on Y to 𝔻_Y of DModules.transferModule (5); this comparison is a theorem of this node. Theorem of this node: on every scheme of finite type the duality preserves the holonomic complexes of DModules.IsHolonomic and sends a holonomic object of the heart to a holonomic object of the heart; on a smooth separated scheme of pure dimension this is DModules.holonomicDModule (5), through the comparison. Proof obligation of this node, stated as a lemma of its own: for a closed embedding i : Y → Z of schemes of finite type, i_* (DModules.deRhamPushforward) preserves DModules.Coherent, and there is an isomorphism 𝔻_Z i_* M ≅ i_* 𝔻_Y M, natural in M of DModules.Coherent on Y. The coherence is proved first, because the duality 𝔻_Z is defined on DModules.Coherent: for an affine open subscheme V of Z with a closed embedding into an affine space, the preimage of V in Y is affine and closed in V, so its composite into the affine space is a closed embedding, and the criterion of DModules.Coherent through such charts gives that i_*M is coherent. The isomorphism then follows from the duality formula on Y and on Z, the adjunction of i_* and i^! (the proper adjunction of DModules.deRhamPushforward) and the projection formula N ⊗^! i_*M ≅ i_*(i^!N ⊗^! M) ([DG2] §5.2.6, which derives it from the base change of the de Rham pushforward): for every right crystal N on Z, Hom(𝔻_Z i_*M, N) ≃ Γ_dR(Z, i_*M ⊗^! N) ≃ Γ_dR(Y, M ⊗^! i^!N) ≃ Hom(𝔻_Y M, i^!N) ≃ Hom(i_* 𝔻_Y M, N). The theorem on holonomic complexes uses this isomorphism on the charts of a scheme that is not smooth, together with the restriction to open subschemes, which is the case d = 0 of the exchange above; DModules.IsRegularHolonomic and DModules.analyticDeRham use it too. Provider: here, for the duality on DModules.Coherent of every scheme of finite type and of algebraic stacks, for the comparison and for the theorem on holonomic complexes. The duality 𝔻_Y of modules over D_Y is in the roadmap node DModules.transferModule; it is not written again here.'''
deps = ['GLCinLean.DModules.Coherent', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.shriekTensor', 'GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.transferModule', 'GLCinLean.Infinity.internalHom', 'GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.holonomicDModule']
source = '[DG2] §5.3 and §7.3.4'
