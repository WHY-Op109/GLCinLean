desc = 'Verdier duality of coherent D-modules.'

[[node]]
id = 'GLCinLean.DModules.verdierDuality'
kind = 'definition'
desc = 'Involutive anti-equivalence of coherent D-modules, obtained by descending scheme Verdier duality. For a smooth map f of relative dimension d it exchanges f^! with f^![−2d], that is D(f^![−2d] M) ≃ f^!(DM) (f^![−2d] is the *-pullback of DModules.starPullback, which on holonomic objects is built from this duality); the proof uses the smooth adjunction of DModules.deRhamPushforward and the duality formula Hom(DM, M′) = Γ_dR(M ⊗^! M′). Provider: here.'
deps = ['GLCinLean.DModules.Coherent', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.DModules.deRhamPushforward', 'GLCinLean.DModules.shriekTensor']
source = '[DG2] §5.3 and §7.3.4'
