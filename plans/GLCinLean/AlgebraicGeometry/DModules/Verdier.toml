[[node]]
id = "GLCinLean.DModules.verdierMappingFormula"
kind = "theorem"
desc = "For coherent F and arbitrary M, identify the enriched Hom from VerdierDual(F) to M with de Rham global sections of F⊗!M. Use smooth descent of the scheme pairing; this is the compactness proof input. Provider: Missing; implement here. Tau Ceti main checked 1e668f5e55bc20f2eb87f4ba49b48833470290d1; roadmap checked 000abc149867f86a79d9708294c89af6b42c37a6."
deps = ["GLCinLean.DModules.verdierDuality", "GLCinLean.Infinity.internalHom", "GLCinLean.DModules.rightCrystals"]
source = "[DG2] Lemma 7.3.5"
