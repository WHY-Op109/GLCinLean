desc = 'The perverse t-structure on regular holonomic complexes lisse along a stratification, and intermediate extension.'

[[node]]
id = 'GLCinLean.DModules.perverseHeart'
kind = 'definition'
desc = 'For a scheme Y of finite type with a stratification S by smooth connected locally closed strata that is good (for every stratum T, the *- and !-extensions of a lisse regular holonomic module on T are lisse along S; when Y is defined over C and is in the scope of DModules.analyticDeRham, it corresponds to goodness with coefficients C of Constructible.StratifiedDerivedCategory, a comparison that is stated and proved in DModules.analyticDeRham_isEquivalence and is not used by this node; the Schubert stratifications are good because every lisse regular holonomic module on a stratum (an affine space, or an affine-space bundle over a partial flag variety) is a direct sum of copies of 𝒪, hence equivariant: over C because the strata are simply connected, over k by the Lefschetz principle and the flat base change of horizontal sections), the middle perverse t-structure on the bounded regular holonomic complexes on Y whose cohomology is lisse along S, specified by the bounds on the *- and !-restrictions to the strata; identify it with the restriction of the standard t-structure of holonomic D-modules, with the dimension-shift convention. Regularity is kept because the Satake heart and the comparison over C use regular objects. For an indscheme presented by closed embeddings of such stratified schemes that send strata to unions of strata, glue along the closed embeddings; finite Schubert unions in Gr_G are the case the Satake heart uses. Provider: here.'
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.tStructure', 'GLCinLean.DModules.IsRegularHolonomic', 'GLCinLean.DModules.holonomicShriek']
source = '[MV] §2; [GLys] §9.2.1'





[[node]]
id = 'GLCinLean.DModules.intermediateExtension'
kind = 'definition'
desc = '''Image of perverse j_!→j_* for a locally closed smooth stratum; characterize by absence of subobjects and quotients on the boundary, and construct IC objects. Classical input: let Y carry the good stratification of DModules.perverseHeart, let j : W → Y be the inclusion of a stratum, and let E be a lisse regular holonomic object of the heart on W. For a closed embedding i : Y → X into a smooth separated scheme of finite type of pure dimension, the equivalence of DModules.rightCrystals_equiv_dModules for X, with the side change, carries the image of this object under the closed pushforward i_* (DModules.deRhamPushforward) to (i ∘ j)_!*E′ of DModules.holonomicIntermediateExtension, where E′ is the left D_W-module of E. The proof uses (2) of that node: the object here restricts to E on W, is supported on the closure of W, and has no nonzero subobject and no nonzero quotient supported on the boundary. The simplicity for a simple E and the compatibility with duality are (3) and (4) of that node. Provider: here, for the object in the heart of DModules.perverseHeart, for the IC objects, and for this comparison. The intermediate extension of modules over D_X is the roadmap node DModules.holonomicIntermediateExtension; it is not written again here.'''
deps = ['GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.holonomicShriek', 'GLCinLean.DModules.rightCrystals_equiv_dModules', 'GLCinLean.DModules.holonomicIntermediateExtension']
source = '[MV] §2 and §8'
