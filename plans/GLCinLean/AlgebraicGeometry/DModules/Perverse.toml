desc = 'The perverse t-structure on regular holonomic complexes lisse along a stratification, and intermediate extension.'

[[node]]
id = 'GLCinLean.DModules.perverseHeart'
kind = 'definition'
desc = 'For a scheme Y of finite type with a stratification S by smooth connected locally closed strata, the middle perverse t-structure on the bounded regular holonomic complexes on Y whose cohomology is lisse along S, specified by the bounds on the *- and !-restrictions to the strata; identify it with the restriction of the standard t-structure of holonomic D-modules, with the dimension-shift convention. For an indscheme presented by closed embeddings of such stratified schemes, glue along the closed embeddings; finite Schubert unions in Gr_G are the case the Satake heart uses. Provider: here.'
deps = ['GLCinLean.DModules.IsHolonomic', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.tStructure', 'GLCinLean.DModules.IsRegularHolonomic']
source = '[MV] §2; [GLys] §9.2.1'

[[node]]
id = 'GLCinLean.DModules.intermediateExtension'
kind = 'definition'
desc = 'Image of perverse j_!→j_* for a locally closed smooth stratum; characterize by absence of subobjects and quotients on the boundary, and construct IC objects. Provider: here.'
deps = ['GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.holonomicShriek']
source = '[MV] §2 and §8'
