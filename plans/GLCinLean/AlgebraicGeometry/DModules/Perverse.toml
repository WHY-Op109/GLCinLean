desc = 'Satake construction prerequisite. The DG enhancement and determinant normalization are separate from the heart equivalence.'

[[node]]
id = 'GLCinLean.DModules.perverseHeart'
kind = 'definition'
desc = 'The middle perverse t-structure on constructible regular-holonomic objects, specified by the stratumwise star/shriek bounds and glued on finite-dimensional Schubert unions; identify it with the standard algebraic D-module heart using the dimension shift convention. Provider: here.'
deps = ['GLCinLean.DModules.holonomic', 'GLCinLean.DModules.starPullback', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Infinity.tStructure', 'GLCinLean.DModules.regularHolonomic']
source = '[MV] §2; [GLys] §9.2.1'

[[node]]
id = 'GLCinLean.DModules.intermediateExtension'
kind = 'definition'
desc = 'Image of perverse j_!→j_* for a locally closed smooth stratum; characterize by absence of subobjects and quotients on the boundary, and construct IC objects. Provider: here.'
deps = ['GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.holonomicShriek']
source = '[MV] §2 and §8'
