# GLCinLean configuration for the review kit (github.com/WHY-Op109/reviewkit; format in its
# FORMATS.md). Only the owner changes this file: it decides what the checks enforce.
#   lake exe review --config glc/project.toml all
format = "reviewkit-config/0"

[project]
import = ["GLCinLean"]                 # modules the checks load
modules = ["GLCinLean"]                # project code
abstract = "GLCinLean.Abstract"        # the formal abstract

[closure]
# Not entered by the walk: Lean core, Mathlib and its dependencies, the kit itself.
background = ["Init", "Std", "Lean", "Lake", "Mathlib", "Batteries", "Aesop", "Qq",
  "ProofWidgets", "Plausible", "ImportGraph", "LeanSearchClient", "Cli", "ReviewKit", "Tracker"]
# Entered and listed with a tag (first match wins). Project code reached outside these classes
# fails the check. Tau Ceti is walked: it is AI-written and AI-reviewed. A `stacks` class (and
# import rule) is added when the first copied Stacks declaration lands (PLAN.md).
[[closure.class]]
tag = "abstract"
modules = ["GLCinLean.Abstract"]
[[closure.class]]
tag = "foundations"
modules = ["GLCinLean.Foundations"]
[[closure.class]]
tag = "staging"                        # locally built foundations
modules = ["GLCinLean.Staging"]
[[closure.class]]
tag = "tauceti"
modules = ["TauCeti"]

[axioms]
allowed = ["propext", "Classical.choice", "Quot.sound"]
budget = "reviews/sorry-budget.toml"   # bound to statement fingerprints

# The import rule. First matching module prefix wins.
[[imports.rule]]
module = "GLCinLean.Abstract"
allow = ["Init", "Mathlib", "TauCeti", "GLCinLean.Foundations"]
[[imports.rule]]
module = "GLCinLean.Foundations"
allow = ["Init", "Mathlib", "TauCeti", "ReviewKit", "GLCinLean.Staging",
  "GLCinLean.Foundations"]
[[imports.rule]]
module = "GLCinLean.Staging"
allow = ["Init", "Mathlib", "TauCeti", "ReviewKit", "GLCinLean.Staging"]
[[imports.rule]]
module = "GLCinLean"                   # everything else: Mathlib and GLCinLean, no Tau Ceti directly
allow = ["Init", "Mathlib", "GLCinLean"]

[fingerprint]
content = ["GLCinLean", "TauCeti"]      # hashed by content, bodies included
unfold_abbrevs = ["GLCinLean.Foundations"]
notations = ["GT.gt", "GE.ge"]

[pin]
file = "reviews/statement-pin.toml"     # two levels: statement (hard), digest (stale only)
decls = ["GLCinLean.Abstract.main", "GLCinLean.Abstract.Setting"]

[placeholders]
modules = ["GLCinLean"]

[papers]
manifest = "references/papers/manifest.toml"
