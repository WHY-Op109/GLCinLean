# Extras for the GLCinLean declarations, keyed by absolute declaration id (the ids
# `tracker graph --all` prints). CI joins this file with the tracker graph and fails on an id that
# is no node (a rename), an unknown key, or a missing or unknown provider.
#
# Fields: provider (mathlib | tauceti | stacks | staging | placeholder | abstract: a construction
# defined in the formal abstract itself), key (stands for an object the statement names; the
# fidelity review covers it), chain (part of the construction of 𝕃_G), upstream (the provider
# declaration a Foundations name re-exports), note. Changing `key` or `chain` is the owner's call.
format = "reviewkit-extras/0"

