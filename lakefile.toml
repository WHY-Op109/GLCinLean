name = "GLCinLean"
defaultTargets = ["GLCinLean"]
reservoir = false
# Mathlib's linters.
# `lake lint` runs Batteries' runLinter by hand.
lintDriver = "batteries/runLinter"

[leanOptions]
weak.linter.mathlibStandardSet = true

# Tau Ceti at a fixed commit of its `main`; Mathlib and Lean come through Tau Ceti. The pin moves
# as "Builds" in `AGENTS.md` says.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "007b3a1150fc0293b327e10238b5e097afc05c56"

# bridgekat/tracker @ c223b67, a git submodule: reads the plan in plans/ and the compiled code.
[[require]]
name = "tracker"
path = "tools/tracker"

[[lean_lib]]
name = "GLCinLean"
