name = "GLCinLean"
defaultTargets = ["GLCinLean"]
reservoir = false
# Mathlib's linters. The project aims at no warnings (apart from the main theorem's `sorry`).
# `lake lint` runs Batteries' runLinter by hand.
lintDriver = "batteries/runLinter"

[leanOptions]
weak.linter.mathlibStandardSet = true

# Tau Ceti at its newest tag; Mathlib and Lean come through Tau Ceti. The pin moves only when
# merged Tau Ceti contributions are needed.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "v4.36.0-rc2"

# bridgekat/tracker @ c223b67, a git submodule: reads the plan in plans/ and the compiled code.
[[require]]
name = "tracker"
path = "tools/tracker"

[[lean_lib]]
name = "GLCinLean"
