desc = 'z-extensions of a reductive group and their existence. Owner: the Tau Ceti roadmap ReductiveGroupsPartII.'

[[node]]
id = 'GLCinLean.Groups.zExtension'
kind = 'definition'
desc = 'A faithfully flat central extension of a connected reductive group by a split torus, whose source has simply connected derived group; include the actual morphism, kernel identification and exactness. The existence theorem supplies witnesses; test GL2→PGL2 and the trivial extension of a torus. Provider: roadmap ReductiveGroupsPartII, `z-extension`. Upstream declarations used: `TauCeti.ReductiveCommHopfAlgCat` (`TauCeti.Algebra.AlgebraicGroup.Reductive.Basic`).'
deps = ['GLCinLean.Groups.rootDatum', 'GLCinLean.Stacks.groupTorsor']
source = '[DrinfeldCompactificationSchieder] Lemma 7.2.2'

[[node]]
id = 'GLCinLean.Groups.zExtension_exists'
kind = 'theorem'
desc = 'Construct a z-extension from the simply connected derived cover and a torus embedding of its finite central kernel, with compatible parabolic and Levi preimages. Prove splitting of a further central-torus extension when the derived group is simply connected; use this to compare choices through their fiber product. Provider: roadmap ReductiveGroupsPartII, `z-extension-existence`.'
deps = ['GLCinLean.Groups.zExtension', 'GLCinLean.Groups.basedRootDatum']
source = '[DrinfeldCompactificationSchieder] Lemmas 7.2.2–7.2.3 and proof of Proposition 7.2.5'
