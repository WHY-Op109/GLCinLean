desc = 'The coadjoint quotient map of an affine group scheme, and the restriction isomorphism of the invariant polynomial functions for a split reductive group. Owner: the Tau Ceti roadmap LanglandsParameterStacks.'

[[node]]
id = 'GLCinLean.Groups.chevalleyMap'
kind = 'definition'
desc = 'The coadjoint quotient map. Let H be a commutative Hopf algebra over a commutative ring k whose cotangent space at the identity is finite and projective, with Lie algebra 𝔥, and let k and H be in one universe (in Lean: `k H : Type u`). These are the hypotheses of the ideal of the coadjoint nilpotent cone, `TauCeti.coadjointNilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.CoadjointNilpotentCone`), with the condition on the universes added. The statement and the nodes that use this node satisfy the condition: their groups are the reductive groups over the field of the statement, and these are in the universe of the field. The node gives: the coadjoint quotient 𝔥*//H = Spec Sym(𝔥)^H; the coadjoint quotient map χ : 𝔥* = Spec Sym(𝔥) → 𝔥*//H that the inclusion of the invariant polynomial functions induces (the Chevalley map ϖ of [ArinkinGaitsgory] §11.1.2); the invariance of χ under the group; and its universal property, that every invariant map from 𝔥* to an affine scheme factors through χ in exactly one way. The augmentation of Sym(𝔥) restricts to a split surjection Sym(𝔥)^H → k, which is the image of the origin, a section Spec k → 𝔥*//H. The fibre of χ over this section is the closed subscheme of the ideal `TauCeti.coadjointNilpotentConeIdeal`: its algebra is Sym(𝔥) ⊗ k over Sym(𝔥)^H, the quotient of Sym(𝔥) by the ideal that the kernel of Sym(𝔥)^H → k generates. The map is the case A = Sym(𝔥) of the projection to the affine quotient of a comodule algebra, which is in Tau Ceti; use that projection, and write no second one. Who writes the node, and when: no placeholder uses it, so it is written when the proof starts. Then this node moves back into `plans/` (`plans-proof/README.md`), and an author worker pinned to LanglandsParameterStacks writes it, as a target of §1.12. Provider: roadmap LanglandsParameterStacks, §1.12 “Lie invariants and the coadjoint nullcone”: “construct the coadjoint quotient `χ* : 𝔤* → Spec k[𝔤*]^G`”. §1.12 states it for a split connected reductive group over a field of characteristic zero or of very good characteristic; the construction of the map uses none of these hypotheses, and the nodes that use it are for reductive groups. The restriction isomorphism is the node `Groups.chevalleyRestriction`. In Tau Ceti: the invariant polynomial functions, as `TauCeti.ComoduleAlgebra.coinvariants` of the comodule algebra `TauCeti.ComoduleAlgebra.symmetricAlgebra` of `Derivation.adjointComodule`; this subalgebra has the name `TauCeti.coadjointInvariantPolynomials`, and `TauCeti.coadjointNilpotentConeIdeal` is the ideal that its elements vanishing at the origin generate. And, in the module `TauCeti.AlgebraicGeometry.Quotient.ComoduleAlgebra`, for a commutative comodule algebra A over a commutative bialgebra H over a commutative ring R, with no other hypothesis: the affine quotient Spec A^H, the spectrum of the coinvariants (`TauCeti.ComoduleAlgebra.AffineQuotient.quotient`); the projection Spec A → Spec A^H that the inclusion A^H → A induces (`TauCeti.ComoduleAlgebra.AffineQuotient.projection`); its invariance (`TauCeti.ComoduleAlgebra.AffineQuotient.act_projection`): the action map Spec (A ⊗ H) → Spec A, which the coaction induces, and the projection Spec (A ⊗ H) → Spec A, which a ↦ a ⊗ 1 induces, have the same composite with it; and its universal property (`TauCeti.ComoduleAlgebra.AffineQuotient.desc` and `TauCeti.ComoduleAlgebra.AffineQuotient.existsUnique_desc`): every map from Spec A to an affine scheme Y that has the same composite with these two maps factors through the projection in exactly one way. Y is any affine scheme of the universe of A; it need not be a scheme over Spec R. The declarations take H and A in one universe, and R in any universe: the two maps of the invariance are maps of schemes from Spec (A ⊗ H) to Spec A, and the schemes of one category are in one universe. For k in universe u and H in universe v, Sym(𝔥) is in universe max u v, which is the universe of H exactly when u ≤ v. So the five declarations elaborate at A = Sym(𝔥) for `k : Type u` and `H : Type (max u v)`, and they do not for `H : Type v` with no relation between u and v. The image of the origin, Spec k → 𝔥*//H, is a map of schemes only when k is in the universe of 𝔥*//H, which is max u v; together with u ≤ v this is u = v. This is the reason for the condition on the universes. The other cases need a copy of k or of H in the universe max u v (`ULift`) with the transport of the structures, and no node needs them. `TauCeti.ComoduleAlgebra.symmetricAlgebra` is not a global instance, so the declarations are applied with it as the instance. So the coadjoint quotient, the map χ, its invariance and its universal property are these declarations at A = Sym(𝔥). Still to do: the image of the origin, as a section Spec k → 𝔥*//H, and the fibre of χ over it. Upstream declarations used: `TauCeti.coadjointInvariantPolynomials` and `TauCeti.coadjointNilpotentConeIdeal` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Lie.Adjoint.CoadjointNilpotentCone`), `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.ComoduleAlgebra.coinvariants` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra`), `TauCeti.ComoduleAlgebra.symmetricAlgebra` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra.SymmetricAlgebra`), `TauCeti.ComoduleAlgebra.AffineQuotient.quotient`, `TauCeti.ComoduleAlgebra.AffineQuotient.projection`, `TauCeti.ComoduleAlgebra.AffineQuotient.act_projection`, `TauCeti.ComoduleAlgebra.AffineQuotient.desc` and `TauCeti.ComoduleAlgebra.AffineQuotient.existsUnique_desc` (`TauCeti.AlgebraicGeometry.Quotient.ComoduleAlgebra`).'
source = '[ArinkinGaitsgory] §11.1.2'

[[node]]
id = 'GLCinLean.Groups.chevalleyRestriction'
kind = 'definition'
desc = 'The restriction isomorphism of the invariant polynomial functions on 𝔥*. Let H be a split connected reductive group over a field of characteristic zero, with a split maximal torus T, Lie algebras 𝔱 ⊂ 𝔥 and Weyl group W. The projection 𝔥 → 𝔱 along the root spaces induces a homomorphism of graded algebras Sym(𝔥) → Sym(𝔱); it is the restriction of polynomial functions from 𝔥* to 𝔱*, where 𝔱* is the space of the linear forms on 𝔥 that vanish on the root spaces. Its restriction to the invariant polynomial functions is an isomorphism of graded algebras Sym(𝔥)^H ≅ Sym(𝔱)^W. In particular Sym(𝔥)^H → Sym(𝔱) is injective. No invariant form on 𝔥 enters the statement. This is the Chevalley homomorphism of [FactorizableDerivedSatake] §9.4 and the equality ℂ[𝔥*]^W = ℂ[𝔤*]^G of [LoopGrassmannianExt] §6.2. Provider: roadmap LanglandsParameterStacks, §1.12 “Lie invariants and the coadjoint nullcone”: “Prove restriction `k[𝔤]^G ≅ k[𝔱]^W` in the positive-characteristic setting and transport it to `k[𝔤*]^G` through the chosen pairing”. In characteristic zero §1.12 takes the restriction of polynomial functions on 𝔤 from roadmap FormalConnectionsOpers, F4.3 (“Export `S(𝔤*)^G ≃ S(𝔥*)^W` as the composite, with the homogeneous-degree compatibility”, with its rational descent and its base change to a field of characteristic zero), which imports `lieChevalleyRestrictionIso` of roadmap LieHighestWeight, Layer 7. In Tau Ceti: the theorem for Lie algebras. For a finite-dimensional Lie algebra L with nondegenerate Killing form over an algebraically closed field of characteristic zero and a Cartan subalgebra 𝔱 of L, `LieSubalgebra.lieChevalleyRestrictionIso` is an isomorphism of algebras from the Lie invariants Sym(L)^L onto the Weyl invariants Sym(𝔱)^W. By `LieSubalgebra.coe_lieChevalleyRestrictionIso_apply` it is the map `TauCeti.lieCartanRestriction` (`TauCeti.Algebra.Lie.Killing.CartanRestriction`), which the projection L → 𝔱 orthogonal for the Killing form induces; this projection is the projection along the root spaces. By `LieSubalgebra.lieChevalleyRestrictionIso_mem_homogeneousSubmodule_iff` it preserves degrees. Still to do: the invariants of the connected group in place of the Lie invariants; a reductive Lie algebra, whose centre the Killing form does not see; the comparison of the Cartan subalgebra and its Weyl group with the split maximal torus and the Weyl group of the group; and a split group over a field that is not algebraically closed. The quotient of the regular locus by the group, which [LoopGrassmannianExt] §6.2 also uses, is not part of this node. Upstream declarations used: `LieSubalgebra.lieChevalleyRestrictionIso` (`TauCeti.Algebra.Lie.HighestWeight.ChevalleyRestriction`).'
deps = ['GLCinLean.Groups.rootDatum']
source = '[FactorizableDerivedSatake] §9.4; [LoopGrassmannianExt] §6.2'
