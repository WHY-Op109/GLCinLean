desc = 'The coadjoint quotient map of an affine group scheme, and the restriction isomorphism of the invariant polynomial functions for a split reductive group. Owner: the Tau Ceti roadmap LanglandsParameterStacks.'

[[node]]
id = 'GLCinLean.Groups.chevalleyMap'
kind = 'definition'
desc = 'The coadjoint quotient map. Let H be a commutative Hopf algebra over a commutative ring k whose cotangent space at the identity is finite and projective, with Lie algebra 𝔥; this is the generality of `Groups.nilpotentCoadjointCone`. The node gives: the coadjoint quotient 𝔥*//H = Spec Sym(𝔥)^H; the coadjoint quotient map χ : 𝔥* = Spec Sym(𝔥) → 𝔥*//H that the inclusion of the invariant polynomial functions induces (the Chevalley map ϖ of [ArinkinGaitsgory] §11.1.2); the invariance of χ under the group; and its universal property, that every invariant map from 𝔥* to an affine scheme factors through χ in exactly one way. The augmentation of Sym(𝔥) restricts to a split surjection Sym(𝔥)^H → k, which is the image of the origin, a section Spec k → 𝔥*//H. The fibre of χ over this section is the closed subscheme of the ideal of `Groups.nilpotentCoadjointCone`: its algebra is Sym(𝔥) ⊗ k over Sym(𝔥)^H, the quotient of Sym(𝔥) by the ideal that the kernel of Sym(𝔥)^H → k generates. The map is the case A = Sym(𝔥) of `Groups.affineQuotientProjection`; use that projection, and write no second one. Who writes the node, and when: no placeholder uses it, so it is written when the proof starts. Then this node and `Groups.affineQuotientProjection` move back into `plans/` (`plans-proof/README.md`), and `lake exe tracker ready` lists their modules in dependency order. An author worker pinned to ArithmeticGaloisRepresentations writes the projection, unless it is at the pin by then; in that case its node is deleted as "Plan" in `AGENTS.md` says. After that, an author worker pinned to LanglandsParameterStacks writes this node, as a target of §1.12. Provider: roadmap LanglandsParameterStacks, §1.12 “Lie invariants and the coadjoint nullcone”: “construct the coadjoint quotient `χ* : 𝔤* → Spec k[𝔤*]^G`”. §1.12 states it for a split connected reductive group over a field of characteristic zero or of very good characteristic; the construction of the map uses none of these hypotheses, and the nodes that use it are for reductive groups. The restriction isomorphism is the node `Groups.chevalleyRestriction`. In Tau Ceti: the invariant polynomial functions, as `TauCeti.ComoduleAlgebra.coinvariants` of the comodule algebra `TauCeti.ComoduleAlgebra.symmetricAlgebra` of `Derivation.adjointComodule`. Still to do: the map, its invariance, its universal property and its fibre over the image of the origin. Upstream declarations used: `Derivation.adjointComodule` (`TauCeti.Algebra.AlgebraicGroup.Tangent.Representation`), `TauCeti.ComoduleAlgebra.coinvariants` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra`), `TauCeti.ComoduleAlgebra.symmetricAlgebra` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra.SymmetricAlgebra`).'
deps = ['GLCinLean.Groups.nilpotentCoadjointCone', 'GLCinLean.Groups.affineQuotientProjection']
source = '[ArinkinGaitsgory] §11.1.2'

[[node]]
id = 'GLCinLean.Groups.chevalleyRestriction'
kind = 'definition'
desc = 'The restriction isomorphism of the invariant polynomial functions on 𝔥*. Let H be a split connected reductive group over a field of characteristic zero, with a split maximal torus T, Lie algebras 𝔱 ⊂ 𝔥 and Weyl group W. The projection 𝔥 → 𝔱 along the root spaces induces a homomorphism of graded algebras Sym(𝔥) → Sym(𝔱); it is the restriction of polynomial functions from 𝔥* to 𝔱*, where 𝔱* is the space of the linear forms on 𝔥 that vanish on the root spaces. Its restriction to the invariant polynomial functions is an isomorphism of graded algebras Sym(𝔥)^H ≅ Sym(𝔱)^W. In particular Sym(𝔥)^H → Sym(𝔱) is injective. No invariant form on 𝔥 enters the statement. This is the Chevalley homomorphism of [FactorizableDerivedSatake] §9.4 and the equality ℂ[𝔥*]^W = ℂ[𝔤*]^G of [LoopGrassmannianExt] §6.2. Provider: roadmap LanglandsParameterStacks, §1.12 “Lie invariants and the coadjoint nullcone”: “Prove restriction `k[𝔤]^G ≅ k[𝔱]^W` in the positive-characteristic setting and transport it to `k[𝔤*]^G` through the chosen pairing”. In characteristic zero §1.12 takes the restriction of polynomial functions on 𝔤 from roadmap FormalConnectionsOpers, F4.3 (“Export `S(𝔤*)^G ≃ S(𝔥*)^W` as the composite, with the homogeneous-degree compatibility”, with its rational descent and its base change to a field of characteristic zero), which imports `lieChevalleyRestrictionIso` of roadmap LieHighestWeight, Layer 7. In Tau Ceti: the theorem for Lie algebras. For a finite-dimensional Lie algebra L with nondegenerate Killing form over an algebraically closed field of characteristic zero and a Cartan subalgebra 𝔱 of L, `LieSubalgebra.lieChevalleyRestrictionIso` is an isomorphism of algebras from the Lie invariants Sym(L)^L onto the Weyl invariants Sym(𝔱)^W. By `LieSubalgebra.coe_lieChevalleyRestrictionIso_apply` it is the map `TauCeti.lieCartanRestriction` (`TauCeti.Algebra.Lie.Killing.CartanRestriction`), which the projection L → 𝔱 orthogonal for the Killing form induces; this projection is the projection along the root spaces. By `LieSubalgebra.lieChevalleyRestrictionIso_mem_homogeneousSubmodule_iff` it preserves degrees. Still to do: the invariants of the connected group in place of the Lie invariants; a reductive Lie algebra, whose centre the Killing form does not see; the comparison of the Cartan subalgebra and its Weyl group with the split maximal torus and the Weyl group of the group; and a split group over a field that is not algebraically closed. The quotient of the regular locus by the group, which [LoopGrassmannianExt] §6.2 also uses, is not part of this node. Upstream declarations used: `LieSubalgebra.lieChevalleyRestrictionIso` (`TauCeti.Algebra.Lie.HighestWeight.ChevalleyRestriction`).'
deps = ['GLCinLean.Groups.rootDatum']
source = '[FactorizableDerivedSatake] §9.4; [LoopGrassmannianExt] §6.2'
