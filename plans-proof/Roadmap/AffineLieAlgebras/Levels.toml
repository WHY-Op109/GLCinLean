desc = 'The invariant bilinear form -1/2 Killing on the Lie algebra of G; on the central torus its restriction is zero. Do not assume nondegeneracy or replace G by a simple complex group. Provider: roadmap AffineLieAlgebras, “Invariant forms, the dual Coxeter number and levels”. The specialization to a reductive group over any field of characteristic zero keeps its central part. Upstream declarations used: `killingForm` (`Mathlib.Algebra.Lie.TraceForm`), `TauCeti.ReductiveAffineGroupSchemeCat` (`TauCeti.AlgebraicGeometry.AffineGroupScheme.Reductive.Basic`).'
source = '[GLC2] §2.1.5'
