desc = 'One application of the Barr–Beck–Lurie theorem (Infinity.barrBeckLurie, in the statement’s plan) to finite products. Owner: the Tau Ceti roadmap EnhancedDerivedSheaves.'

[[node]]
id = 'GLCinLean.Infinity.finiteMultiplicityProduct_isMonadic'
kind = 'theorem'
desc = 'For a family of nonzero finite-dimensional vector spaces E_a, prove the right adjoint from the product of derived vector-space categories to derived vector spaces, (W_a)↦product_a Hom(E_a,W_a), is monadic. Its left adjoint is V↦(E_a tensor V)_a. Verify conservativity, t-exactness and preservation of split realizations on uniformly bounded-above subcategories; prove both vector-space t-structures complete and recover the adjunction as a limit of the truncation adjunctions. Prove monadicity passes through that compatible limit. Retain the actual finite-dimensional irreducible multiplicities when applying this to coinduction for a reductive group. Provider: roadmap EnhancedDerivedSheaves, “Monadicity”.'
deps = ['GLCinLean.Infinity.barrBeckLurie', 'GLCinLean.Infinity.derivedVect', 'GLCinLean.Infinity.tStructure', 'GLCinLean.Infinity.limits']
source = '[OneAffineness] §§7.2.4–7.2.9 and Lemmas 7.2.8, 7.2.10 (with the finite irreducible multiplicities retained)'
