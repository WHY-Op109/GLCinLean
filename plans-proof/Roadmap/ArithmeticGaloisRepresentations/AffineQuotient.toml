desc = 'The affine quotient of an affine scheme by an affine group scheme: the spectrum of the coinvariants of a comodule algebra, with its projection. Owner: the Tau Ceti roadmap ArithmeticGaloisRepresentations.'

[[node]]
id = 'GLCinLean.Groups.affineQuotientProjection'
kind = 'definition'
desc = 'The projection to the affine quotient. Let H be a commutative bialgebra over a commutative ring k, and A a commutative comodule algebra over H, that is, an action of the affine monoid scheme Spec H on Spec A; Spec H is a group scheme when H is a Hopf algebra. The affine quotient is Spec A^H, the spectrum of the coinvariants. The node gives: the projection Spec A → Spec A^H that the inclusion A^H → A induces; its invariance, that the action map and the projection from Spec A × Spec H to Spec A have the same composite with it; and its universal property, that every invariant map from Spec A to an affine scheme factors through the projection in exactly one way. No hypothesis on the group or on A is used. Provider: roadmap ArithmeticGaloisRepresentations, §1.11, target “Reductive quotients over fields and DVRs”: “construct `X//G = Spec O(X)^G`, using coaction invariants”, with “the invariant-morphism universal property”. §1.11 states the target for a connected reductive group that acts on an integral affine variety over a field, and for a case over a discrete valuation ring; its theorems (finite generation, normality, closed orbits) need these hypotheses, and this node is the construction below them. In Tau Ceti: the coinvariants as an equalizer, `TauCeti.ComoduleAlgebra.coinvariants`, and the universal property for algebras, `TauCeti.ComoduleAlgebra.range_le_coinvariants_iff` (an algebra map into A lands in the coinvariants exactly when it is invariant). At the pin also, for a comodule algebra over a commutative bialgebra over a commutative ring: the scheme `TauCeti.ComoduleAlgebra.AffineQuotient.quotient`, the projection `TauCeti.ComoduleAlgebra.AffineQuotient.projection`, its invariance `TauCeti.ComoduleAlgebra.AffineQuotient.act_projection`, and its universal property among affine schemes, `TauCeti.ComoduleAlgebra.AffineQuotient.desc` and `TauCeti.ComoduleAlgebra.AffineQuotient.existsUnique_desc` (`TauCeti.AlgebraicGeometry.Quotient.ComoduleAlgebra`). So nothing of this node is still to do; the nodes that use it name these declarations when it is removed. Upstream declarations used: `TauCeti.ComoduleAlgebra.coinvariants` (`TauCeti.Algebra.Bialgebra.ComoduleAlgebra`).'
source = '[ArinkinGaitsgory] §11.1.2 (the case A = Sym(ǧ) of this construction: 𝔠(ǧ) := Spec(Sym(ǧ)^Ǧ) and the map ϖ)'
