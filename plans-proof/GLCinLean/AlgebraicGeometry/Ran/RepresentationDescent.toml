desc = 'Representation categories on finite configurations, including collisions and arbitrary affine parameters.'

[[node]]
id = 'GLCinLean.Hecke.spreadClassifyingStack_passable'
kind = 'theorem'
desc = 'For reductive H in characteristic zero and every affine S→Ran(X), prove the spread BH fiber has affine diagonal, compact unit and dualizable QCoh. Affineness comes from compatible horizontal isomorphisms of H-torsors. Prove unit compactness in the finite collision diagram, and dualizability by induction using the open complement of the full diagonal and the localization pullback criterion; retain arbitrary affine coefficient base change. Rigid compactly generated Rep(H) supplies the finite-configuration terms. This verifies all passability conditions, not merely their k-point restrictions. Provider: here.'
deps = ['GLCinLean.Ran.Representations.equivCollisionLimit', 'GLCinLean.Sheaves.passable', 'GLCinLean.Infinity.localizationPullback_dualizable', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.compactObject']
source = '[GLC4] §§C.1.1, C.1.9; [RaskinCPSII] Corollary A.8.1; [RaskinCPSI] Lemma 6.16.2, Theorem 6.17.1, Lemma 6.18.1, Corollary 6.18.2, Appendices A.2–A.3, Proposition B.5.1(3) and Remark B.5.2'
