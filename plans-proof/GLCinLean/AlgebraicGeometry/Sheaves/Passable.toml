desc = 'For a passable prestack Y, identify continuous endofunctors of QCoh(Y) with QCoh(Y×Y) via self-duality; the diagonal pushforward of O_Y is the identity kernel. Prove the evaluation/coevaluation identities and compatibility with push-pull rather than assuming a kernel formalism for arbitrary prestacks. Provider: here.'
