desc = 'QCoh support localization and scalar extension to formal completions.'

[[node]]
id = 'GLCinLean.Sheaves.formalCompletion_moduleSupport'
kind = 'theorem'
desc = 'For an almost finite type scheme S and closed T with quasi-compact open complement U, prove QCoh of the formal completion identifies with the supported QCoh category. For every QCoh(S)-module category D, identify the kernel of restriction D→D_U with extension of scalars to the completion. Construct the localization using the fiber of Id→j_*j^*; prove the continuous fully faithful adjoint and tensor-localization identities. This is a categorical support theorem, not an assertion about geometric fibers alone. Provider: here.'
deps = ['GLCinLean.Derived.FormalCompletion', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Sheaves.isOneAffine', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.rightAdjoint', 'GLCinLean.Infinity.limits']
source = '[OneAffineness] Propositions 4.1.3, 4.1.5 and Lemma 4.1.6; [RaskinCPSI] Lemma 6.17.2'
