desc = 'One-affineness for finite-type schemes and their de Rham prestacks, with the finite formal-vector and descent proof inputs. No arbitrary indscheme or de Rham stack claim is required.'

[[node]]
id = 'GLCinLean.Sheaves.oneAffine_baseChangeAndCompletion'
kind = 'theorem'
desc = 'If Y is one-affine and every affine-test base change of Z→Y is one-affine, prove Z one-affine by the localization/global-section comparison; deduce closure under finite products. Also prove preservation by formal completion along a closed subfunctor with quasi-compact open complement. For the latter identify both QCoh module categories and sheaves of categories on the completion with the corresponding supported essential images, using affine tests and the support-localization theorem; compare their localization adjunctions. The completion argument must supply the sheaf-of-categories essential-image statement, not only the QCoh support assertion. Provider: here.'
deps = ['GLCinLean.Sheaves.isOneAffine', 'GLCinLean.Sheaves.formalCompletion_moduleSupport', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.limits']
source = '[OneAffineness] Corollaries 3.2.7–3.2.8 and Proposition 3.2.6 with proof §3.3; Theorem 2.3.1, Proposition 4.2.2 and proof §§4.3.1–4.3.3'

[[node]]
id = 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine'
kind = 'theorem'
desc = 'For a quasi-compact separated scheme, prove localization from QCoh modules to sheaves of categories is an equivalence. Start with affine schemes. The affine diagonal, passable QCoh tensor/base-change and rigidity give full faithfulness of global sections. Induct on a finite affine open cover for the other direction: the QCoh-module and sheaf-of-categories squares for two open pieces are pullbacks, and their unit/counit comparisons agree. Construct the module-square inverse by the fiber of the difference of the two pushforwards, so tensoring an arbitrary module preserves this gluing. This proves the scheme case directly without assuming the algebraic-space theorem in its own proof. Include X^I for finite I, including I empty. Provider: here.'
deps = ['GLCinLean.Sheaves.isOneAffine', 'GLCinLean.Sheaves.passable_tensorBaseChange', 'GLCinLean.Sheaves.schemeQCoh', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.localizationPullback_dualizable']
source = '[OneAffineness] Theorem 2.1.1, Propositions 5.1.3 and 5.1.7, proof §§5.3.1–5.3.3 (especially the separated-scheme argument in §5.3.3), and Appendix A Step 2'

[[node]]
id = 'GLCinLean.Sheaves.finiteTypeGroupClassifying_oneAffine'
kind = 'theorem'
desc = 'For a finite-type affine algebraic group H over the algebraically closed characteristic-zero field, form BH by the bar realization and prove it one-affine. Reduce through a faithful closed embedding H→GL_n: the fibers of BH→BGL_n are quasi-compact separated schemes. For GL_n, identify QCoh(BGL_n) with the enhanced rational representation category, use characteristic-zero complete reducibility to express it as a product of derived vector-space categories, and apply the monadic coinduction criterion to the finite-multiplicity product right adjoint. Prove the criterion by the Cech/bar comparison of the actual localization adjunction. This includes the vector group used below and is independent of de Rham one-affineness. Provider: here; faithful representations and complete reducibility in characteristic zero are from roadmap ReductiveGroups. Upstream declarations used: `TauCeti.finiteTypeCommHopfAlgCatOpEquivFiniteTypeAffineGroupSchemeCat` (`TauCeti.AlgebraicGeometry.AffineGroupScheme.FiniteType`).'
deps = ['GLCinLean.Sheaves.oneAffine_baseChangeAndCompletion', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Derived.Prestack', 'GLCinLean.Infinity.finiteMultiplicityProduct_isMonadic']
source = '[OneAffineness] Theorem 2.2.2, Proposition 6.3.7 and its proof §§6.1–6.3, §§7.1–7.2; §2.5.2 and Corollary 1.5.8 for the bar/fppf comparison'

[[node]]
id = 'GLCinLean.Sheaves.formalVector_qcohIndcohComparison'
kind = 'theorem'
desc = 'For a finite-dimensional vector group V, construct its completion at zero and compare QCoh(V completed at zero) with IndCoh there by Upsilon. Obtain the comparison from the regular-coordinate Koszul/derived-completion calculation and its compatible finite nilpotent thickenings; it is the finite-dimensional instance of the formally smooth indscheme theorem. Identify IndCoh, with convolution from addition, with the enhanced rational representations of the dual vector group. Retain the duality pairing, convolution multiplication and the identification of structural !-pullback with coinduction. Verify rigidity from proper push-pull and base change on the finite thickenings. Provider: here; completion at a regular ideal is from roadmaps DerivedModuleAlgebra and EnhancedDerivedSheaves.'
deps = ['GLCinLean.Derived.FormalCompletion', 'GLCinLean.Sheaves.IndCoh', 'GLCinLean.Sheaves.indcohShriekOnSchemes', 'GLCinLean.Sheaves.QCoh', 'GLCinLean.Infinity.rigidMonoidalCategory', 'GLCinLean.Infinity.limits']
source = '[OneAffineness] §§11.3.3 and 11.4.3–11.4.4; [DGIndschemes] Theorem 10.1.1, Corollary 2.6.2 and Proposition 2.9.2 (restricted to the finite formal vector group)'

[[node]]
id = 'GLCinLean.Sheaves.formalVectorClassifying_oneAffine'
kind = 'theorem'
desc = 'For a finite-dimensional vector group V, form B of its completion at zero by the bar realization and prove it one-affine. Use the rigid convolution comparison to identify group invariants and coinvariants and prove the reconstruction criterion: one-affineness is equivalent to monadicity of the right adjoint of structural pullback. The formal-vector QCoh/IndCoh comparison identifies that adjoint with the right adjoint of coinduction for the dual vector group, whose monadicity follows from the finite-type group theorem and its coinduction criterion. Keep the possibly discontinuous right adjoint; continuity is not a hypothesis. This proof needs neither the infinite-dimensional formal-group classification nor de Rham one-affineness. Provider: here.'
deps = ['GLCinLean.Sheaves.formalVector_qcohIndcohComparison', 'GLCinLean.Sheaves.finiteTypeGroupClassifying_oneAffine', 'GLCinLean.Infinity.barrBeckLurie', 'GLCinLean.Infinity.dualizableCategory', 'GLCinLean.Sheaves.isOneAffine']
source = '[OneAffineness] Theorem 2.5.4(b), Corollaries 11.1.5 and 11.1.7, Proposition 11.2.1 with proof §§11.2.2–11.2.4, §§11.3.2–11.3.3 and 11.4.3–11.4.4'

[[node]]
id = 'GLCinLean.Sheaves.finiteTypeScheme_deRham_oneAffine'
kind = 'theorem'
desc = 'For a separated finite-type scheme Z over the given field, prove its de Rham prestack one-affine. First identify (A^n)_dR with A^n modulo the formal additive group at zero; its map to the classifying prestack of that formal group has affine-test fibers S×A^n, so apply the base/fiber theorem. Embed a finite-type affine Z as a closed subscheme of A^n; Z_dR is the formal completion of (A^n)_dR along Z_dR, giving the affine case. Glue a finite affine open cover using the same supported Mayer–Vietoris comparison on QCoh modules and sheaves of categories; explicitly prove this descent step that the source leaves to the reader. Deduce the finite powers of the smooth proper curve, including the empty power, and their scalar-extension comparisons. No assertion about de Rham stacks or infinite indschemes is used. Provider: here.'
deps = ['GLCinLean.Sheaves.formalVectorClassifying_oneAffine', 'GLCinLean.Sheaves.oneAffine_baseChangeAndCompletion', 'GLCinLean.Sheaves.qcSeparatedScheme_oneAffine', 'GLCinLean.Derived.DeRhamPrestack', 'GLCinLean.Sheaves.sheafOfCategories']
source = '[OneAffineness] Theorem 2.6.3, proof §§12.1.1–12.1.2, with Corollaries 3.2.7–3.2.8 and Theorem 2.3.1; §12.1.3 is not required'
