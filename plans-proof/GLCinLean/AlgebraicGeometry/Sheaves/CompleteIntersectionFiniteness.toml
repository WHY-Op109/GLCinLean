desc = 'Finiteness prerequisites for the statement construction.'

[[node]]
id = 'GLCinLean.Sheaves.relativeKoszulDuality'
kind = 'theorem'
desc = 'For quasi-compact stacks with affine diagonal, smooth X and smooth schematic V→X with section, identify IndCoh(X×_V X) with modules for the relative E₂ Hochschild algebra. The algebra is enhanced; identify its E₁ module category with modules over Sym(V_rel[-2]), where V_rel is the pullback of the relative tangent bundle along the section. Provider: here.'
deps = ['GLCinLean.Infinity.hochschildCochains', 'GLCinLean.Sheaves.IndCoh', 'GLCinLean.Derived.cotangentComplex', 'GLCinLean.Infinity.moduleCategory']
source = '[ArinkinGaitsgory] §§9.1.1–9.1.4'

[[node]]
id = 'GLCinLean.Sheaves.completeIntersectionSupport_compactlyGenerated'
kind = 'theorem'
desc = 'For quasi-compact Artin stacks with affine diagonal and global complete-intersection presentation Z=U×_V X with U,X smooth and V→X smooth schematic with section, IndCoh_Y(Z) is compactly generated for every conical closed Y. Follow the relative Koszul module comparison, Gm grading shift and generation of supported QCoh on the resulting smooth stack; do not assert this for arbitrary quasi-smooth stacks. Provider: here.'
deps = ['GLCinLean.Sheaves.relativeKoszulDuality', 'GLCinLean.Sheaves.qcaIndCoh_compactlyGenerated', 'GLCinLean.Infinity.GradedSupport', 'GLCinLean.Sheaves.IndCohWithSupport', 'GLCinLean.Infinity.rigidMonoidalCategory']
source = '[ArinkinGaitsgory] §9.2, especially Corollary 9.2.7 and its proof'
