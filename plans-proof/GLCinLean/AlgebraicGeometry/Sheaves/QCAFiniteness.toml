desc = 'On a QCA stack a QCoh object is compact iff perfect, equivalently tensor-dualizable. Use continuity of Γ and tensor-Hom for the forward construction of compactness; use continuous affine pushforward for restriction of a compact object. This theorem does not assert compact generation. Provider: here.'
