[[node]]
id = 'GLCinLean.LocalSystems.regularSingular_smoothNearLS'
kind = 'theorem'
desc = 'The regular-singular connection stack is smooth near LS. Compute its cotangent complex using the connection on the coadjoint bundle; a horizontal section vanishing at x vanishes identically at a zero-residue connection. Restrict to a quasi-compact smooth neighborhood, not the whole regular-singular stack. Provider: here.'
deps = ['GLCinLean.LocalSystems.regularSingularConnections', 'GLCinLean.Curves.serreTrace', 'GLCinLean.LocalSystems.qca']
source = '[ArinkinGaitsgory] Proposition 10.6.6(a) and its proof'

[[node]]
id = 'GLCinLean.LocalSystems.globalCompleteIntersection'
kind = 'theorem'
desc = 'Present LS as U×_{g/H}BH, where U is a quasi-compact smooth neighborhood of LS in the regular-singular stack. The map g/H→BH is smooth schematic with its zero section and all stacks have affine diagonal. This supplies the global complete-intersection hypotheses of §9.2 without requiring Bun_H to be quasi-compact. Provider: here.'
deps = ['GLCinLean.LocalSystems.regularSingular_smoothNearLS', 'GLCinLean.LocalSystems.qca', 'GLCinLean.Derived.QuasiSmooth']
source = '[ArinkinGaitsgory] §10.6.2 and Proposition 10.6.6'

[[node]]
id = 'GLCinLean.LocalSystems.meromorphicConnections_classical'
kind = 'theorem'
desc = 'For a nonempty affine U in X, the relative meromorphic-connection prestack LS(X;U)=LS(U)×_{Bun(U)}Bun(X) is classical. After a smooth affine base change from Bun(X), its fibers are DG indschemes, their relative cotangent functor has no negative obstruction on affine U, and the classical model is locally S×A∞. Prove both formal-smoothness assertions and apply the derived/classical comparison; then construct polar-part maps. Provider: here.'
deps = ['GLCinLean.LocalSystems.DeRham', 'GLCinLean.Derived.MappingPrestack', 'GLCinLean.Stacks.BundleStack', 'GLCinLean.Derived.IsIndscheme', 'GLCinLean.Derived.formallySmooth_iff_proCotangent', 'GLCinLean.Derived.formallySmooth_classicalComparison']
source = '[ArinkinGaitsgory] Proposition 10.5.3 and §§10.5.1–10.5.11; [DGIndschemes] Propositions 8.2.2 and 9.1.4'
