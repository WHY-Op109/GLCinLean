kind = 'theorem'
desc = 'QCoh(LS_H) is compactly generated and rigid: identify it with zero-support IndCoh, apply the global complete-intersection support-generation theorem, and prove its compacts are perfect hence tensor-dualizable by QCA finiteness. Do not infer compact generation from the QCA hypothesis alone or merely cite the rigidity assertion in GLC1. Provider: here.'
