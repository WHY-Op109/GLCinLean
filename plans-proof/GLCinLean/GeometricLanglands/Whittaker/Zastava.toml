desc = 'Finite Zastava geometry and the rigorous vanishing input to the parabolic Jacquet comparison.'

[[node]]
id = 'GLCinLean.Whittaker.finiteZastava'
kind = 'definition'
desc = 'Construct finite-degree Zastava spaces and their central fibers from transverse Borel reductions, using the corrected Drinfeld compactification. Supply the divisor/configuration map, its affineness, disjoint-factorization decomposition, the exponential evaluation character and the identification of central fibers with the relevant finite-dimensional semi-infinite intersections. Retain the coweight, defect and cohomological normalizations; the subsequent source computations are first made for simply-connected derived group. Provider: here.'
deps = ['GLCinLean.Stacks.correctedDrinfeldCompactification', 'GLCinLean.AffineGrassmannian', 'GLCinLean.DModules.exponential', 'GLCinLean.Satake.semiInfiniteOrbits']
source = '[RaskinCPSI] §§2.7–2.17; [ParabolicEisensteinFH] §6.4.6, first proof'

[[node]]
id = 'GLCinLean.Whittaker.borelSemiInfiniteIC_zastavaComparison'
kind = 'theorem'
desc = 'Identify the translated Borel semi-infinite IC kernel on each finite Schubert/semi-infinite intersection with the restriction of the finite Zastava IC sheaf, retaining its relative-dimension shift and the exponential character. First prove the global IC pullback comparison: when minus the defect is sufficiently dominant, the Borel-bundle map is smooth; add a disjoint sufficiently dominant defect and use Zastava factorization plus smooth unipotent-level quotient descent to reach every defect. Track the shift (g−1)dim(N)+<lambda,2rho>. Combine with the Ran local-to-global IC comparison to obtain the exact shift <lambda,2rho> in GaRanII Proposition 3.8.3, normalized on the open Zastava locus. Verify agreement with the Hecke-induced IC definition used here. This supplies the actual sheaf comparison before invoking Zastava vanishing, rather than treating the two cohomology expressions as identical by notation. Provider: here.'
deps = ['GLCinLean.Whittaker.finiteZastava', 'GLCinLean.SemiInfinite.parabolicIC', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.extraordinaryPullback']
source = '[GaRanII] Proposition 3.8.3 and Theorem 3.3.3; [GaSemiInfiniteI] Proposition 3.6.5(a), proof §§3.9.1–3.9.4; [ParabolicEisensteinFH] Theorem 5.3.8.1 and §6.4.6, first proof'

[[node]]
id = 'GLCinLean.Whittaker.nonzeroZastava_whittakerCohomology_vanishes'
kind = 'theorem'
desc = '''For nonzero positive defect, prove de Rham pushforward of the Zastava IC sheaf tensored with its Whittaker exponential vanishes. Follow the source's independent proof: realize central fibers inside sufficiently dominant affine Schubert varieties, apply the pointwise Casselman–Shalika calculation to obtain positive-degree bounds and zero Euler characteristic, then induct on defect using factorization. The pushforward is supported on the main diagonal; affineness and the fiber bounds make it perverse and lisse there, and the zero Euler characteristic forces it to vanish. Do not use the later parabolic or full factorization Satake theorem to prove this input. Provider: here.'''
deps = ['GLCinLean.Whittaker.finiteZastava', 'GLCinLean.Whittaker.pointwiseCasselmanShalika', 'GLCinLean.DModules.perverseHeart', 'GLCinLean.DModules.intermediateExtension', 'GLCinLean.DModules.deRhamPushforward']
source = '[RaskinCPSI] Theorem 3.4.1, Proposition 3.5.1, Corollaries 3.5.2 and 3.5.4, and proof §3.6'
