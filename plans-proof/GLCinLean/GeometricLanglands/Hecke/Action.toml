desc = 'The Hecke action of Rep(Ǧ)_Ran on Dmod_½(Bun_G).'

[[node]]
id = 'GLCinLean.Hecke.action_viaRenormalized'
kind = 'theorem'
desc = 'The monoidal action of Rep(Ǧ)_Ran on Dmod_1/2(Bun_G) given by Hecke.action with its module structure Hecke.action_associativity is isomorphic, as a monoidal action, to the action through Satake.naiveFactorizationFunctor_renormalized followed by Hecke.renormalizedSphericalAction. Same for every Levi quotient M. This is the comparison through which Sph_G-linear constructions (enhanced Eisenstein series) become Rep(Ǧ)_Ran-linear for the Hecke action. Provider: here.'
deps = ['GLCinLean.Hecke.action', 'GLCinLean.Hecke.action_associativity', 'GLCinLean.Satake.naiveFactorizationFunctor_renormalized', 'GLCinLean.Hecke.renormalizedSphericalAction']
source = '[GLC2] §§1.5.3 and 1.7.6; [GLC3] §8.2.1'

[[node]]
id = 'GLCinLean.Hecke.renormalizedSphericalAction'
kind = 'definition'
desc = 'The action of the renormalized Sph_{G,Ran} on Dmod_1/2(Bun_G) obtained from Hecke.sphericalAction by restriction along the monoidal functor non-ren, and likewise for each Levi quotient M. This is the action for which enhanced Eisenstein series are Sph_G-linear. Provider: here.'
deps = ['GLCinLean.Hecke.sphericalAction', 'GLCinLean.Hecke.sphericalAction_associativity', 'GLCinLean.Satake.renormalizedSphericalCategory']
source = '[GLC2] §1.5.3; [GLC3] §8.2.1'

[[node]]
id = 'GLCinLean.Hecke.action_factorsThroughIndependent'
kind = 'theorem'
desc = 'By Hecke.action_localUnital the Hecke action of Rep(H) on Dmod_1/2(Bun_G) is a local Ran-unital action, so by [GLC2] Corollary H.6.11 the action of (Rep(H)_Ran)^⋆ of Hecke.action with its module structure Hecke.action_associativity factors through the quotient q to an action of Hecke.unitalIndependentRepresentations, uniquely, and the two module structures correspond. Same for each Levi quotient. Provider: here.'
deps = ['GLCinLean.Hecke.action', 'GLCinLean.Hecke.action_associativity', 'GLCinLean.Hecke.unitalIndependentRepresentations', 'GLCinLean.SpectralProof.localUnitalAction', 'GLCinLean.Hecke.action_localUnital']
source = '[GLC2] §15.5.1 and Corollary H.6.11'

[[node]]
id = 'GLCinLean.Hecke.action_localUnital'
kind = 'theorem'
desc = 'The Hecke action is a local Ran-unital action of Rep(H) on Dmod_1/2(Bun_G) in the sense of SpectralProof.localUnitalAction. Prove the three unitality inputs: Rep(H) as a sheaf of monoidal categories on the unital Ran space ([GLC2] §H.4); Satake.naiveFactorizationFunctor as a unital factorization functor (the unit goes to the delta object at the unit of the Grassmannian, compatibly with the inclusions of finite sets); and Hecke.sphericalAction as a unital action, the delta object acting by the identity compatibly with factorization. [GLC2] §15.5.1 only says that the Hecke action is considered in this way; no source with a proof was found, so this is an explicit obligation. Provider: here.'
deps = ['GLCinLean.Hecke.action', 'GLCinLean.Hecke.action_associativity', 'GLCinLean.SpectralProof.localUnitalAction', 'GLCinLean.Satake.naiveFactorizationFunctor', 'GLCinLean.Hecke.sphericalAction', 'GLCinLean.Ran.Representations']
source = '[GLC2] §15.5.1 and §§H.6.1–H.6.8; explicit obligation'

[[node]]
id = 'GLCinLean.Hecke.action_associativity'
kind = 'definition'
desc = 'The associativity constraints of Hecke.action, as a module structure for the non-unital symmetric monoidal category Rep(Ǧ)_Ran (Hecke.ranConvolution), from Satake.naiveFactorizationFunctor_monoidal and Hecke.sphericalAction_associativity. A module over a non-unital monoidal category has action and associativity data and no unit datum; Infinity.moduleCategory is unital, so this notion is stated here. Provider: here.'
deps = ['GLCinLean.Hecke.action', 'GLCinLean.Hecke.ranConvolution', 'GLCinLean.Satake.naiveFactorizationFunctor_monoidal', 'GLCinLean.Hecke.sphericalAction_associativity', 'GLCinLean.Infinity.moduleCategory']
source = '[GLC1] §1.2.1; [GaitsgoryOutline] §4.4.2 and Proposition 4.4.4; [GLys] §§9.5.1–9.5.2'
