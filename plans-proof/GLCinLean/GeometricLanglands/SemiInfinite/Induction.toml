desc = 'The ambient shriek vacuum and the full invariant-category induction with spherical linearity.'

[[node]]
id = 'GLCinLean.SemiInfinite.parabolicVacuumShriek'
kind = 'theorem'
desc = 'For every finite configuration I, prove the dualizing sheaf on the zero LU-orbit in Gr_G is ind-holonomic by finite-type closed charts, then construct its ambient shriek extension with the mapping property against all ambient D-modules. Prove LU-equivariance by action-groupoid base change and identify this object with the invariant-category induction of the spherical unit by uniqueness of the restricted adjunction. Retain coherent diagonal/disjoint !-base change, unit maps and the chosen half-twist trivialization. This theorem concerns the dualizing vacuum only: arbitrary compact base coefficients over X^I need not be holonomic. Provider: here.'
deps = ['GLCinLean.SemiInfinite.parabolicStratumAdjunctions', 'GLCinLean.DModules.indHolonomicShriek', 'GLCinLean.DModules.extraordinaryPullback', 'GLCinLean.Hecke.affineGrassmannian']
source = '[GLC3] §1.3.5; [GaRanII] Remark 1.5.4, Corollary 1.5.6 and §1.6; [DhillonLysenkoRan] Corollary 2.7.9 and §2.7.12; [ChenNearbyCycles] §A.4.6'

[[node]]
id = 'GLCinLean.SemiInfinite.parabolicInduction_factorization'
kind = 'definition'
desc = 'Use the compact-generation theorem to renormalize L+M-equivariance and descend the full invariant-category induction/restriction adjunction. Prove restriction conservative using the parabolic stratification and obtain its monadic algebra. The restriction functor is spherical-M-linear by convolution base change; the proved rigidity of the renormalized spherical category relative to Dmod(X^I) promotes its adjoint mates to a strict module structure relative to that base. Identify induction of arbitrary F with F convolved with the shriek vacuum by applying linearity to the unit. This extends arbitrary base coefficients through convolution, without asserting they are absolutely holonomic or have ambient shriek images. Match Pminus, the half-twist trivialization and the component shift <lambda,2rho_P>: induction uses the negative shift and the corrected M action the positive shift. Use the vacuum and convolution diagonal/disjoint comparisons to prove full factorization, including unit/counit coherences, and apply z-extension descent for general G. Provider: here.'
deps = ['GLCinLean.SemiInfinite.parabolicInvariants_compactlyGenerated', 'GLCinLean.SemiInfinite.parabolicVacuumShriek', 'GLCinLean.Satake.renormalizedSphericalCategory_rigid', 'GLCinLean.SpectralProof.factorizationRenormalization', 'GLCinLean.SpectralProof.factorizationCategory', 'GLCinLean.Infinity.barrBeckLurie', 'GLCinLean.SpectralProof.parabolicZExtension_descent']
source = '[GLC3] §§1.2–1.3, especially §§1.3.2–1.3.8; [GLC2] §1.5.5; [ChenNearbyCycles] Lemma 2.3.4, §3.4.1 and Appendix D; [DhillonLysenkoRan] Corollary 2.7.9 and §2.7.10'
