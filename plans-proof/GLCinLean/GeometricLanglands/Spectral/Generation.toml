[[node]]
id = 'GLCinLean.SpectralProof.localizationKernel_annihilatesAutomorphic'
kind = 'theorem'
desc = 'For every connected reductive G over the original k, the kernel of Loc_spec acts by zero on Dmod_1/2(Bun_G). In Lean, state it for all G of semisimple rank at most n, with the fixed k and X and any pinning and theta data, and prove it by induction on n. In the step, each proper parabolic P has Levi quotient M of smaller rank; the induction hypothesis gives the vanishing for M, and Spectral.actionOfVanishing turns it into the QCoh(LS_M)-module structure used by SpectralProof.parabolicGlobalization_comparison. Then KL vanishing and the Eisenstein step on the generating family conclude. Rank zero: G is a torus, there are no proper parabolics, and KL images generate. Provider: here.'
