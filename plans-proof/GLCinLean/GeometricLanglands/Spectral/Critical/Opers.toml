desc = 'Local and global oper data used to prove the Hecke property.'

[[node]]
id = 'GLCinLean.SpectralProof.localOpers'
kind = 'definition'
desc = 'Normalized regular and meromorphic dual-group opers on formal discs: retain the specified Cartan-bundle identification and negative-simple-root coefficient equal to the unit section, not just a Borel reduction with nonzero transversality. Define the monodromy-free fiber product Op^mf = LS^reg ×_{LS^mer} Op^mer, with connections, Borel reduction and oper transversality. Include the torus case and all central isogenies. Provider: here. The open roadmap pull request #1056 (FormalConnectionsOpers) proposes local opers for simple complex groups only.'
deps = ['GLCinLean.Ran.FormalDisc', 'GLCinLean.Groups.langlandsDual', 'GLCinLean.Stacks.ClassifyingStack', 'GLCinLean.Derived.MappingPrestack']
source = '[GLC2] §3.1; §§B.7–B.8'

[[node]]
id = 'GLCinLean.SpectralProof.globalMonodromyFreeOpers'
kind = 'definition'
desc = 'Global meromorphic opers with poles at a Ran configuration whose underlying local system extends over X; define the Cartesian local-to-global evaluation square. Provider: here.'
deps = ['GLCinLean.SpectralProof.localOpers', 'GLCinLean.LocalSystems.DeRham', 'GLCinLean.Ran', 'GLCinLean.Derived.MappingPrestack']
source = '[GLC2] §§15.1.1–15.1.4'

[[node]]
id = 'GLCinLean.SpectralProof.criticalCenter_equiv_operFunctions'
kind = 'theorem'
desc = 'Feigin–Frenkel isomorphism between the critical vacuum center and regular-oper functions, compatible with factorization, coordinate changes, Chevalley normalization and Satake. Preserve arbitrary alg closed characteristic-zero k and the reductive central torus. Provider: here; the complex simple centre theorem is from roadmap AffineLieAlgebras. The reductive form over any k uses the planned comparisons, which are adaptation proofs, not a specialization to C.'
deps = ['GLCinLean.SpectralProof.reductiveCriticalCenter_comparison', 'GLCinLean.SpectralProof.vacuumCenter', 'GLCinLean.SpectralProof.localOpers', 'GLCinLean.Satake.naiveFactorizationFunctor']
source = '[GLC2] Theorem 5.1.2; Theorem 5.2.5'

[[node]]
id = 'GLCinLean.SpectralProof.operActionOnKL'
kind = 'definition'
desc = 'QCoh(Op^mf)-action on spherical critical KL obtained from the enhanced central IndCoh! action through Upsilon; retain coherent scalar extension. Provider: here.'
deps = ['GLCinLean.SpectralProof.criticalCenter_equiv_operFunctions', 'GLCinLean.SpectralProof.sphericalKL', 'GLCinLean.SpectralProof.localOpers', 'GLCinLean.Sheaves.infiniteTypeUpsilon', 'GLCinLean.SpectralProof.operIndCoh_ranDescent']
source = '[GLC2] §5.3; §15.1.4'

