[[node]]
id = 'GLCinLean.Spectral.actionOfVanishing'
kind = 'definition'
desc = 'For any connected reductive group H′ over k (the given G, or a Levi quotient M), and any proof that the kernel of Loc^spec acts by zero on Dmod_1/2(Bun_H′) through Hecke.action, the unique QCoh(LS_Ȟ′)-module structure on Dmod_1/2(Bun_H′) inducing the Hecke action. Construction: by Hecke.action_factorsThroughIndependent the action is one of A = Rep(Ȟ′)_{Ran^untl,indep}; by Spectral.localization_factorsThroughIndependent the hypothesis says ker L acts by zero, and L has a fully faithful right adjoint, linear by Hecke.unitalIndependentRepresentations_rigid; apply Infinity.moduleOverMonoidalLocalization to L. The vanishing is a hypothesis, so the rank induction can apply this to proper Levi quotients before the vanishing for G is known. Provider: here.'
deps = ['GLCinLean.Hecke.action', 'GLCinLean.Hecke.action_factorsThroughIndependent', 'GLCinLean.Spectral.localization_factorsThroughIndependent', 'GLCinLean.Hecke.unitalIndependentRepresentations_rigid', 'GLCinLean.Infinity.moduleOverMonoidalLocalization']
source = '[GaitsgoryOutline] Corollary 4.5.5; [GLC1] §1.2.5; [GLC2] §15.5.1 and Corollary H.6.11'
