desc = 'Generality comparison for parabolic kernels and factorization constructions.'

[[node]]
id = 'GLCinLean.SpectralProof.parabolicZExtension_descent'
kind = 'theorem'
desc = 'Transfer parabolic semi-infinite and Jacquet kernel comparisons from groups with simply connected derived group to arbitrary connected reductive G. Construct the relative Grassmannian and Zastava charts from the corrected compactification and descend their D-module kernels along the central-torus torsor Cech diagrams. Prove compatibility of normalized IC pullback, cohomological shifts, Hecke/Drinfeld–Plucker structures, ! adjunctions, units/counits and disjoint/diagonal factorization; include the coweight/component maps rather than identify all loop quotients. Transport the actual parabolic strata, Levi component maps, finite closed bounds, excision diagrams and stratum coefficient generators. Compact generation is then proved by the continuous conservative restriction adjunction; it is not inferred from an arbitrary Cech limit. Dual root data identify the Levi and unipotent representation actions. This is an explicit adaptation of the geometric descent, not a claim that FH states the result without its derived-group hypothesis. No global Langlands equivalence is used. Provider: here.'
deps = ['GLCinLean.Stacks.drinfeldCompactification_zExtensionTorsor', 'GLCinLean.DModules.RightCrystals', 'GLCinLean.DModules.verdierDuality', 'GLCinLean.AffineGrassmannian', 'GLCinLean.SpectralProof.factorizationCategory', 'GLCinLean.Groups.dualityData']
source = '[ParabolicEisensteinFH] §2.3.1; [DrinfeldCompactificationSchieder] §§7.2–7.4, especially Proposition 7.3.2'
