[[node]]
id = 'GLCinLean.SpectralProof.parabolicGlobalization_comparison'
kind = 'theorem'
desc = 'Construct the intermediate functor from QCoh(LS_dualP) tensor over QCoh(LS_dualM) with Dmod(Bun_M) by the inverse partial-enhancement equivalence, the Rep(P)→semi-infinite functor and unital enhanced Eis. Prove recovery of ordinary Eis on free modules and full Rep(dualG)_Ran linearity with action pulled back along LS_dualP→LS_dualG. The only global action assumed is that for the proper Levi M, given by Spectral.actionOfVanishing from the induction hypothesis. Rep(Ǧ)_Ran-linearity for the Hecke action uses Hecke.action_viaRenormalized and SpectralProof.naiveSatakeIsoDerivedSatakeInverse. No equivalence with the full enhanced category is asserted. This is a derived proof route from modern inputs, not a claim that the 2010 arbitrary-P expectation was already proved there. Provider: here.'
deps = ['GLCinLean.SpectralProof.parabolicPartialEnhancement_independent_equiv', 'GLCinLean.SpectralProof.partialEnhancement_to_semiInfinite', 'GLCinLean.SpectralProof.enhancedEisenstein', 'GLCinLean.SpectralProof.factorizationGlobalization', 'GLCinLean.Spectral.actionOfVanishing', 'GLCinLean.Hecke.action_viaRenormalized', 'GLCinLean.SpectralProof.naiveSatakeIsoDerivedSatakeInverse']
source = '[GaitsgoryOutline] Proposition 11.1.3(a)–(b); construction from [GLC3] Proposition 12.7.3, §§12.6.8, 8.5.5–8.5.7 and Theorem 2.4.3; [GLC2] Remark 15.6.15'

[[node]]
id = 'GLCinLean.SpectralProof.localizationKernel_annihilatesEisenstein'
kind = 'theorem'
desc = 'Assuming spectral vanishing for the proper Levi M, with the QCoh(LS_M)-module structure of Spectral.actionOfVanishing, an object in the G spectral-localization kernel annihilates Eis_P(Dmod(Bun_M)); derive from the intermediate parabolic functor. Do not assume the G spectral action. Provider: here.'
deps = ['GLCinLean.SpectralProof.parabolicGlobalization_comparison', 'GLCinLean.SpectralProof.eisensteinLeftAdjoint', 'GLCinLean.Spectral.localization', 'GLCinLean.Hecke.action', 'GLCinLean.Spectral.actionOfVanishing']
