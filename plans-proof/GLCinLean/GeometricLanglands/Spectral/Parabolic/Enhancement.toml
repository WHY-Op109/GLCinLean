desc = 'The arbitrary-parabolic input in spectral vanishing, including its partial-enhancement proof route.'

[[node]]
id = 'GLCinLean.SpectralProof.semiInfiniteCategory'
kind = 'definition'
desc = 'Renormalize L^+(M)-equivariance on the proved compactly generated category of L(N_P^-)-invariant half-twisted D-modules on Gr_G. Construct its unital factorization structure from spherical parabolic induction and its vacuum, with the commuting spherical G/M actions. Correct the M action on component lambda by the shift <lambda,2rho_P> so it respects factorization. Use the separately proved invariant-stratum adjunctions and spherical-input shriek construction; no claim that ambient shriek averaging exists on every arbitrary L(N_P^-)-invariant D-module is required. Provider: here.'
deps = ['GLCinLean.SpectralProof.parabolicLevi', 'GLCinLean.SpectralProof.factorizationRenormalization', 'GLCinLean.Hecke.affineGrassmannian', 'GLCinLean.DModules.equivariantIndscheme', 'GLCinLean.SemiInfinite.parabolicInvariants_compactlyGenerated', 'GLCinLean.SemiInfinite.parabolicStratumAdjunctions', 'GLCinLean.SemiInfinite.parabolicInduction_factorization', 'GLCinLean.Satake.renormalizedSphericalCategory']
source = '[GLC3] §§1.2–1.3, especially §§1.3.1–1.3.8; compact generation and spherical-input induction use the separately planned Chen/Dhillon–Lysenko proof chain'

[[node]]
id = 'GLCinLean.SpectralProof.spectralSemiInfiniteCategory'
kind = 'definition'
desc = 'Define the spectral semi-infinite category by coinvariants of IndCoh*(L_nabla(dualG/N_dualP)) under the regular horizontal G and M arc groups. Identify its prestack operand with the regular/meromorphic local-systems triple fiber product; the Ran family is not locally almost of finite type, so ordinary IndCoh cannot define it. Descend arc-to-loop adjunctions to obtain compact generation, the two spherical actions, the monadic algebra Omega-tilde and its t-structure. Construct the auxiliary formal-monodromy-free category by Vect tensor over IndCoh* of L_nabla(N_dualP) semidirect L_nabla^+(dualM) with Vect, with the analogous adjunction and dual. Provider: here.'
deps = ['GLCinLean.Sheaves.parabolicHorizontalLoopIndCoh_compactDuality', 'GLCinLean.SpectralProof.factorizationCategory', 'GLCinLean.Infinity.moduleCategory', 'GLCinLean.Infinity.barrBeckLurie', 'GLCinLean.Infinity.tStructure']
source = '[GLC3] §§2.1–2.2 and Appendix A, especially §§A.5–A.7'

[[node]]
id = 'GLCinLean.SpectralProof.semiInfiniteSatake_equiv'
kind = 'theorem'
desc = 'Unital factorization equivalence between geometric and spectral semi-infinite categories, with both spherical actions, the rho_P(omega_X) twist and Chevalley normalization. Its proof is local and must not use the global Langlands functor. Provider: here.'
