desc = 'The compatibility of the comparison of the determinant gerbes on Bun_G and on the Beilinson–Drinfeld Grassmannian with the composition of modifications.'

[[node]]
id = 'GLCinLean.Satake.criticalTwistBunDeterminantEquiv_comp'
kind = 'definition'
desc = 'The compatibility of the gerbe comparison Satake.criticalTwistBunDeterminantEquiv with the composition of modifications and with factorization. Composition sends a modification (P, P′, α) at x and a modification (P′, P″, β) at y, over the same test scheme S, to the modification (P, P″, β ∘ α) at x ∪ y. Write H for the Ran Hecke stack. Composition defines an associative map c from H ×_{Bun_G} H to H over Ran.union, using h_out on the first factor and h_in on the second ([GaitsgoryOutline] §4.4.2). On the diagonal x = y this is composition in the Hecke groupoid over Bun_G × Ran, with the identity modifications as units ([GLC2] §10.1.2). Composition over varying supports is non-unital: composing with the identity modification at y moves a modification at x to the point x ∪ y of the Ran space. Let U ⊂ Ran × Ran be the locus of ordered pairs of disjoint supports. The map remembering (x, y) and the composite is an equivalence from (H ×_{Bun_G} H)|_U to U ×_{Ran} H, where U → Ran is union. Its inverse recovers the intermediate bundle by gluing P off Γ_x to P″ off Γ_y using the given isomorphism on their common open. No node of plans/ has the map c; it is defined with this node. (1) Line bundles. Construct, by the additivity of the determinant, the isomorphism between the relative determinant on D_{x ∪ y} of the lattice of P″ against the lattice of P and the tensor product of the relative determinant on D_x of P′ against P with the relative determinant on D_y of P″ against P′; in the Hom form of Satake.criticalTwistBunDeterminantEquiv it is the composition of maps, for a subbundle contained in the three adjoint bundles. Show that over the diagonal x = y it induces the multiplicative structure of the gerbe of Satake.criticalDeterminantGerbe on the loop group, and that over U it is the gluing of det_{Gr_G} under factorization of that node. Theorem: under this isomorphism and the composition Hom(det(P′), det(P″)) ⊗ Hom(det(P), det(P′)) → Hom(det(P), det(P″)) of the ratio lines of the determinants of cohomology, in the graded lines of Satake.criticalTwistBunDeterminantEquiv, the isomorphism of line bundles of Satake.criticalTwistBunDeterminantEquiv at (P, P″, β ∘ α) is the tensor product of its values at (P, P′, α) and at (P′, P″, β). This is an equality of isomorphisms of line bundles on the fibre product, natural in S. (2) Gerbes. The image of (1) under the functor of square roots of Stacks.rootGerbe, with its symmetric monoidal coherence: an isomorphism between the pullback along c of the equivalence of gerbes and the product of its pullbacks along the two projections, with the cocycle condition for three composable modifications. Over the diagonal this is the compatibility with the composition of modifications at one point of the Ran space, which the local action of Hecke.sphericalAction_associativity uses; over U it is the compatibility with factorization. [GLys] §9.5.1 states the monoidal action of the spherical category on the twisted sheaves on Bun_G and does not state this compatibility; the proof of [GLC2] Proposition 10.1.11 asks for an identification of multiplicative line bundles on the completed Hecke groupoid and gives the identification of the lines only. So this node is an explicit obligation. Provider: here.'
deps = ['GLCinLean.Satake.criticalTwistBunDeterminantEquiv', 'GLCinLean.Satake.criticalDeterminantGerbe', 'GLCinLean.Hecke.Correspondence', 'GLCinLean.Ran.union', 'GLCinLean.Stacks.rootGerbe', 'GLCinLean.Sheaves.determinant', 'GLCinLean.LoopGroups.RanLoopGroup', 'GLCinLean.Stacks.determinantBundle']
